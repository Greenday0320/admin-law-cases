    "판례내용": "【원고, 상고인】 ○○○건설 주식회사 외 3인 (소송대리인 변호사 최동식 외 1인)\n【원고, 피상고인 겸 상고인】 △△△건설 주식회사 (소송대리인 법무법인(유한) 동인 담당변호사 김성근 외 4인)\n【원고, 피상고인】 □□□건설 주식회사 (소송대리인 법무법인(유한) 동인 담당변호사 김성근 외 4인)\n【피고, 상고인 겸 피상고인】 충청남도지사 (소송대리인 변호사 김은주)\n【원심판결】 대전고법 2020. 7. 2. 선고 2019누10595 판결\n【주    문】\n  원심판결 중 원고 5 회사 부분, 원고 3 회사의 기계설비공사 부분을 파기하고, 이 부분 사건을 대전고등법원에 환송한다.  원고 1 회사, 원고 2 회사, 원고 3 회사, 원고 4 회사, 원고 6 회사의 상고 및 피고의 나머지 상고를 각 기각한다.  상고비용 중 원고 1 회사, 원고 2 회사, 원고 4 회사, 원고 6 회사의 상고로 인한 부분은 위 원고들이 부담한다.\n\n【이    유】  상고이유(제출기간이 지난 준비서면과 상고이유보충서의 각 기재는 이를 보충하는 범위 내에서)를 판단한다.\n  1. 사안의 개요\n  가. 감사원은 2016. 6. 20.부터 2016. 7. 15.까지 충청남도에 대한 기관운영감사를 하면서, 기존에 충청남도가 발주하여 도급한 건설공사에 관하여 2013. 1.경부터 2016. 6.경까지 이루어진 하도급을 대상으로 하도급 관계 법령 위반 여부를 점검하였다. \n  나. 감사원은 원고들을 포함한 일부 건설업자(원수급인 겸 하도급인)들이 구 건설산업기본법(2017. 12. 26. 법률 제15306호로 개정되기 전의 것, 이하 같다) 제29조 제4항에 따른 하도급계약 통보를 함에 있어, 실제 ‘하도급 계약금액’이 ‘도급계약 중 하도급 부분에 상당하는 금액’(이하 ‘하도급 부분금액’이라 한다)의 82% 미만임에도 그 이상인 것처럼 부풀려서 통보하였다고 판단하고, 피고로 하여금 위 건설업자들에게 제재처분 등을 하도록 요구하였다. \n  다. 피고는 감사원의 위 요구에 따라, 기존에 원고들로부터 통보받은 하도급공사계약에 대하여 ‘하도급 부분금액’ 및 ‘하도급 계약금액의 하도급 부분금액에 대한 비율’(= 하도급 계약금액 ÷ 하도급 부분금액)(이하 ‘하도급률’이라 한다)을 각각 재산정하였다.\n  라. 피고는 2017. 8. 24. 원고들에게, 원심판결 별지 1 처분내역표 ‘하도급공사명(하수급인)’란 기재 각 하도급공사(이하 ‘이 사건 각 공사’라 한다)에 관하여 하도급률이 82%에 이르지 못함에도, 원고들이 하도급 부분금액에 포함되어야 할 항목이나 금액을 제외하여 하도급 부분금액을 축소시키는 방법으로 하도급률을 82% 이상으로 산정하여 통보하였고, 이는 구 건설산업기본법 \"제29조 제4항에 따른 통보를 거짓으로 한 경우\"에 해당한다는 이유로, 구 건설산업기본법 제82조 제1항 제4호에 따라 원심판결 별지 1 처분내역표 ‘처분’란 기재와 같이 각 과징금 부과처분(이하 ‘이 사건 각 처분’이라 한다)을 하였다.\n  2. 관련 법리\n  가. 구 건설산업기본법 제82조 제1항 제4호, 제29조 제4항 본문에서 규제하는 하도급계약 거짓 통보의 대상에는 구 건설산업기본법 시행규칙(2019. 3. 26. 국토교통부령 제614호로 개정되기 전의 것, 이하 같다) [별지 제23호 서식] ‘건설공사의 하도급계약 통보서’ 중 ‘하도급내용’ 부분에 기재하도록 되어 있는 ‘하도급 부분금액’, ‘하도급 계약금액’, ‘하도급률’ 등 모든 항목이 포함되고, ‘하도급 부분금액’에는 간접노무비, 기타경비, 산출경비, 건설기계대여금 지급보증서 발급액, 일반관리비, 이윤 등의 개별 원가계산 항목이 포함된다. \n  나. 나아가, 국민연금보험료, 국민건강보험료, 노인장기요양보험료(통칭하여 이하 ‘이 사건 각 사회보험료’라 한다)도 ‘하도급 부분금액’을 구성하는 개별 원가계산 항목으로서 하도급계약 통보의 대상이 된다. 그 구체적인 이유는 다음과 같다.\n  1) 구 건설산업기본법 시행규칙 [별지 제23호 서식]에서는 하도급계약에서 정한 직접노무비 등에 일정 요율을 반영한 이 사건 각 사회보험료의 반영금액을 기재하도록 되어 있는바, 이에 대응하는 원도급계약의 ‘하도급 부분금액’에도 원칙적으로 이 사건 각 사회보험료가 포함되어야 한다.\n  2) 만일 이 사건 각 사회보험료에 대한 사후정산이 예정되어 있다거나, 하수급인의 대부분이 건강보험 등의 적용대상이 되지 않는다는 원수급인의 주장만으로 하도급계약 통보의 대상인 ‘하도급 부분금액’에서 이 사건 각 사회보험료를 제외시키는 것을 허용한다면, 대개의 경우 원수급인보다 약자의 지위에 있는 하수급인으로서는 이 사건 각 사회보험료를 ‘하도급 계약금액’에서 제외하자는 원수급인의 요구를 거절하기 어렵게 되어, 하수급인의 근로자들이 국민건강보험법 등에서 정한 보호를 받지 못하게 되는 부당한 결과가 초래될 염려가 있다.\n  3) 구 건설산업기본법 시행령(2019. 3. 26. 대통령령 제29665호로 개정되기 전의 것) 제34조 제1항 제1호와 위 [별지 제23호 서식]의 유의사항에서는 ‘하도급 부분금액’을 ‘도급하려는 공사 부분에 대하여 수급인의 도급금액 산출내역서의 계약단가(직접·간접 노무비, 재료비 및 경비를 포함한다)를 기준으로 산출한 금액에 일반관리비, 이윤 및 부가가치세를 포함한 금액을 말하며, 수급인이 하수급인에게 직접 지급하는 자재의 비용과 법 제34조 제3항에 따른 하도급대금 지급보증서 발급에 드는 금액 등 관계 법령에 따라 수급인이 부담하는 금액은 제외’된 것이라고 규정하고 있다. 위 각 규정은 하도급계약 통보의 대상이 되는 ‘하도급 부분금액’에서 ‘관계 법령에 따라 수급인이 부담하는 금액’을 제외하고 있을 뿐, ‘사후정산’ 대상이 되는 금액을 제외하고 있지 않다. 그런데 구 건설산업기본법 제22조 제7항은 이 사건 각 사회보험료에 대하여 ‘사후정산’을 할 수 있다고 규정하고 있을 뿐, 수급인이 이 사건 각 사회보험료를 부담한다고 규정하지 않고 있다. 나아가 고용보험료, 산업재해보상보험료, 퇴직공제부금비와는 다르게, 이 사건 각 사회보험료는 도급사업에 관하여 원수급인을 사업주로 보아 그 비용을 일괄하여 부담시키는 명시적인 규정을 두고 있지도 않다. 따라서 이 사건 각 사회보험료가 ‘관계 법령에 따라 수급인이 부담하는 금액’으로서 하도급계약 통보의 대상인 ‘하도급 부분금액’에서 제외되는 금액에 해당한다고 볼 수 없다.\n  다. 다만 구 산업안전보건법(2019. 1. 15. 법률 제16272호로 전부 개정되기 전의 것) 제30조 제1항, 제3항, 구 산업안전보건법 시행규칙(2019. 12. 26. 고용노동부령 제272호로 전부 개정되기 전의 것) 제32조 제1항의 내용을 종합하여 보면, 산업안전보건관리비는 원칙적으로 ‘하도급 부분금액’에 포함되는 원가계산 항목이기는 하나, 예외적으로 원수급인이 이를 직접 부담한 경우 ‘관계 법령에 따라 수급인이 부담하는 금액’으로서 ‘하도급 부분금액’에서 제외할 수 있다. 또한 건설기술 진흥법 제66조 제3항, 제4항, 구 건설기술 진흥법 시행규칙(2018. 6. 18. 국토교통부령 제521호로 개정되기 전의 것) 제61조 제1항 내지 제4항, [별표 8]의 내용과 환경보전비의 특성에 비추어 보면, 환경보전비 역시 원칙적으로 ‘하도급 부분금액’에 포함되는 원가계산 항목이지만, 예외적으로 원수급인이 이를 직접 부담한 경우 ‘관계 법령에 따라 수급인이 부담하는 금액’으로서 ‘하도급 부분금액’에서 제외할 수 있다.\n  라. 한편 하도급계약 통보를 ‘거짓으로 한 때’에 해당하기 위해서는, 그 통보서가 단순히 사실과 다르게 기재되었다는 것만으로는 부족하고, 그 기재 내용이 사실과 다르다는 점을 인식하였거나 충분히 인식할 수 있었으면서도 사실과 다른 내용의 기재를 하였다고 평가할 수 있어야 한다.\n  3. 원고 5 회사를 제외한 나머지 원고들의 상고이유에 관한 판단\n  가. 원고 1 회사, 원고 3 회사, 원고 4 회사, 원고 6 회사(이하 ‘원고 1 회사 등’이라 한다)의 제1 내지 3 상고이유, 원고 2 회사의 제1 상고이유에 관하여\n  1) 원심의 판단\n  원심은, 다음과 같은 이유로 이 사건 각 처분 중 원고 1 회사, 원고 2 회사, 원고 4 회사, 원고 6 회사 부분, 원고 3 회사의 석공사, 금속공사 부분의 처분사유가 각각 인정된다고 판단하였다. \n  가) 원고 1 회사는 간접노무비, 건설기계대여금 지급보증서 발급액 전부, 산출경비 중 일부를, 원고 2 회사는 기타경비 전부를, 원고 3 회사는 ◇◇◇연구소 신축공사 중 석공사에 관하여 산출경비, 건설기계대여금 지급보증서 발급액 전부, 위 신축공사 중 금속공사에 관하여 건설기계대여금 지급보증서 발급액 전부를, 원고 4 회사는 간접노무비, 건설기계대여금 지급보증서 발급액, 기타경비, 일반관리비, 이윤 전부를, 원고 6 회사는 간접노무비, 기타경비, 일반관리비 전부를 각각 ‘하도급 부분금액’에서 누락한 채로 하도급계약 통보를 하였다.\n  나) 위 각 원가계산 항목 금액을 포함시켜 ‘하도급 부분금액’과 ‘하도급률’을 다시 계산하면, 이 사건 각 공사 중 원고 1 회사, 원고 2 회사, 원고 4 회사, 원고 6 회사 부분, 원고 3 회사의 석공사, 금속공사 부분에 관하여 통보된 ‘하도급률’은 82% 이상이나 실제 ‘하도급률’은 82%에 미달한다. \n  다) 이와 같은 사정들에 위 원고들이 이와 같은 누락에 관한 합리적인 설명을 하지 못하고 있는 점 등을 더하여 보면, 이 사건 각 공사 중 원고 1 회사, 원고 2 회사, 원고 4 회사, 원고 6 회사 부분, 원고 3 회사의 석공사, 금속공사 부분에 관한 각 하도급계약 통보 당시 위 원고들은 ‘하도급 부분금액’에서 일부 원가계산 항목을 누락시키는 등으로 그 기재 내용의 일부가 사실과 다르다는 점을 충분히 인식할 수 있는 상태에서 사실과 다른 통보를 한 것으로 인정된다.\n  2) 대법원의 판단\n  원심판결의 이유를 앞서 본 법리와 기록에 비추어 살펴보면, 이러한 원심의 판단은 정당하고, 거기에 하도급계약 거짓 통보의 대상 및 그 판단 기준, ‘하도급 부분금액’에서 제외될 수 있는 개별 원가계산 항목에 관한 법리를 오해하거나 논리와 경험의 법칙을 위반하여 자유심증주의의 한계를 벗어나는 등으로 판결에 영향을 미친 잘못이 없다.\n  나. 원고 1 회사 등의 제4 상고이유에 관하여\n  원심은, 원고 1 회사 등이 하도급계약 통보를 거짓으로 함에 있어 원고 1 회사 등에게 의무 위반을 탓할 수 없는 정당한 사유가 인정되지 않는다고 판단하였다. \n  원심판결의 이유를 관련 법리와 기록에 비추어 살펴보면, 이러한 원심의 판단은 정당하고, 거기에 의무 위반을 탓할 수 없는 정당한 사유에 관한 법리를 오해하거나 논리와 경험의 법칙을 위반하여 자유심증주의의 한계를 벗어나는 등으로 판결에 영향을 미친 잘못이 없다. \n  다. 원고 1 회사 등의 제5 상고이유 및 원고 2 회사의 제2 상고이유에 관하여\n  원심은, 이 사건 각 처분 중 원고 1 회사, 원고 2 회사, 원고 4 회사, 원고 6 회사 부분, 원고 3 회사의 석공사, 금속공사 부분에 비례의 원칙, 형평의 원칙, 신뢰보호의 원칙 등을 위반하여 재량권을 일탈·남용한 위법이 없다고 판단하였다.\n  원심판결의 이유를 관련 법리와 기록에 비추어 살펴보면, 이러한 원심의 판단은 정당하고, 거기에 재량권 일탈·남용에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. \n  4. 피고의 상고이유에 관한 판단\n  가. 제1 상고이유에 관하여\n  1) 원심의 판단\n  원심은, 이 사건 각 사회보험료가 하도급계약 통보의 ‘하도급 부분금액’을 산정함에 있어 제외할 수 있는 개별 원가계산 항목에 해당한다는 전제에서, 이 사건 각 공사 중 원고 5 회사 부분, 원고 3 회사의 ◇◇◇연구소 신축공사 중 기계설비공사 부분의 각 하도급률은 82% 이상이어서, 원고 5 회사, 원고 3 회사가 각 하도급계약 통보를 거짓으로 한 경우에 해당한다고 볼 수 없다는 이유로, 이 사건 각 처분 중 위 각 부분은 처분사유가 인정되지 않아 위법하다고 판단하였다.  \n  2) 대법원의 판단\n  그러나 앞서 본 법리에 의하면, 이 사건 각 사회보험료는 하도급계약 통보의 ‘하도급 부분금액’을 산정함에 있어 포함하여야 할 원가계산 항목에 해당한다. 이 사건 각 사회보험료를 ‘하도급 부분금액’에 포함시켜 다시 정당한 ‘하도급률’을 계산하여 보면, 이 사건 각 공사 중 원고 5 회사 부분, 원고 3 회사의 ◇◇◇연구소 신축공사 중 기계설비공사 부분의 각 ‘하도급률’은 82%에 미달하게 되는바, 이 사건 각 처분 중 위 각 부분의 처분사유는 인정된다고 할 것이다. 이와 다른 전제에 선 원심판단에는 하도급계약 통보에 있어 ‘하도급 부분금액’에서 제외할 수 있는 원가계산 항목에 관한 법리를 오해하여 판결의 결론에 영향을 미친 잘못이 있다.\n  나. 제2 상고이유에 관하여\n  원심은, 원수급인이 산업안전보건관리비, 환경보전비를 직접 부담한 경우, 해당 금액을 하도급계약 통보의 대상이 되는 ‘하도급 부분금액’에서 제외할 수 있다는 전제에서, 이 사건 각 공사 중 원고 5 회사 부분, 원고 3 회사의 자동크린넷 설치공사, 기계설비공사 부분의 산업안전보건관리비, 환경보전비가 원고 5 회사, 원고 3 회사가 부담한 비용으로서 ‘하도급 부분금액’에서 제외될 수 있다고 판단하였다.\n  원심판결의 이유를 앞서 본 법리와 기록에 비추어 살펴보면, 이러한 원심의 판단은 정당하고, 거기에 상고이유 주장과 같이 산업안전보건관리비 및 환경보전비의 하도급계약 통보에 관한 법리를 오해하거나 논리와 경험의 법칙을 위반하여 자유심증주의의 한계를 벗어나는 등으로 판결에 영향을 미친 잘못이 없다.  \n  5. 결론 \n  원심판결 중 원고 5 회사 부분, 원고 3 회사의 기계설비공사 부분을 파기하고, 이 부분 사건을 다시 심리·판단하도록 원심법원에 환송하며, 원고 5 회사를 제외한 나머지 원고들의 상고와 피고의 나머지 상고를 기각하고, 상고비용 중 원고 1 회사, 원고 2 회사, 원고 4 회사, 원고 6 회사의 상고로 인한 부분은 위 원고들이 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오경미(재판장) 권영준 박영재(주심)"
  },

    "판시사항": "[1] 구 국민건강보험법 제41조의4에서 정한 선별급여가 같은 법 제41조 제3항에서 보건복지부령에 위임한다고 말하는 요양급여에 포함되는지 여부(적극) / 보건복지부고시 ‘요양급여의 적용기준 및 방법에 관한 세부사항’이 상위법령의 위임 및 근거에 따라 고시된 것인지 여부(적극)\n [2] 요양급여대상을 선별급여대상으로 변경한 보건복지부고시 ‘요양급여의 적용기준 및 방법에 관한 세부사항’에 요양급여대상 약제를 비급여대상 약제로 변경할 때 적용되는 구 국민건강보험 요양급여의 기준에 관한 규칙 제13조 제4항 제9호, 제5항 제4호의 절차가 적용되는지 여부(소극)\n [3] 구 국민건강보험법상 요양급여대상인 약제를 선별급여대상으로 변경할 경우, 행정절차법에 따른 처분의 사전통지나 의견제출의 기회를 주어야 하는지 여부(소극)\n [4] 구 국민건강보험법상 선별급여 항목 및 본인부담률을 결정할 때 기준이 되는 약제의 임상적 유용성, 대체가능성 등에 관한 행정청의 판단은 존중되어야 하는지 여부(원칙적 적극)",
    "판결요지": "[1] 구 국민건강보험법(2023. 5. 19. 법률 제19420호로 개정되기 전의 것, 이하 같다) 제41조 제3항에서는 요양급여의 방법·절차·범위·상한 등의 기준은 보건복지부령으로 정한다고 규정하고, 그 위임을 받은 구 국민건강보험 요양급여의 기준에 관한 규칙(2020. 10. 8. 보건복지부령 제755호로 개정되기 전의 것) 제5조 제2항에서는 요양급여의 적용기준 및 방법에 관한 세부사항은 의약계·공단 및 건강보험심사평가원의 의견을 들어 보건복지부장관이 정하여 고시한다고 규정하고 있다. 이에 따라 보건복지부장관은 요양급여대상인 약제와 그 약제의 급여 상한금액에 관하여는 ‘약제 급여 목록 및 급여 상한금액표’를 고시하여 결정하고, 이와 같이 요양급여대상으로 결정·고시된 약제에 대한 요양급여가 어떠한 기준과 방법, 범위 내에서 지급되는지 등에 관한 세부사항에 관하여는 ‘요양급여의 적용기준 및 방법에 관한 세부사항’(이하 ‘요양급여적용기준’이라 한다)을 고시하여 결정한다.\n  한편 구 국민건강보험법 제41조의4 제1항에서는 요양급여를 결정하는 데에 경제성 또는 치료효과성 등이 불확실하여 그 검증을 위하여 추가적인 근거가 필요하거나 경제성이 낮아도 가입자와 피부양자의 건강회복에 잠재적 이익이 있는 등 대통령령으로 정하는 경우에는 예비적인 요양급여인 선별급여로 지정하여 실시할 수 있다고 규정한다. 그리고 구 ‘선별급여 지정 및 실시 등에 관한 기준’(2020. 8. 12. 보건복지부고시 제2020-172호로 개정되기 전의 것, 이하 ‘구 선별급여지정기준’이라 한다) 제3조 제2항에서는 선별급여로 지정된 항목 및 본인부담률은 [별표 2]와 같고, 다만 앞서 본 ‘요양급여적용기준’에서 급여대상 이외 선별급여를 별도로 정하여 실시하는 경우는 해당 항목의 세부인정사항에 따른다고 규정한다. 그리하여 보건복지부장관은 선별급여의 대상 및 본인부담률을 ‘구 선별급여지정기준’에서 정하거나 혹은 ‘요양급여적용기준’에서 별도로 정하여 고시함으로써 이를 실시할 수 있다.\n  이러한 관련 규정의 내용과 체계, 선별급여제도의 도입배경 및 입법 취지 등을 종합하면, 선별급여는 구 국민건강보험법 제41조 제3항에서 말하는 요양급여에 포함되는 것으로서, 요양급여적용기준은 위와 같은 규정 등을 포함한 상위법령의 위임 및 근거에 따라 고시된 것이다. \n [2] 구 국민건강보험법(2023. 5. 19. 법률 제19420호로 개정되기 전의 것) 제41조의4 제1항에서는 선별급여를 ‘예비적인 요양급여’라고 하여 요양급여의 일종으로 규정하고 있다. 그 결과 요양급여대상 약제를 선별급여대상 약제로 변경하더라도 요양급여대상 약제가 결정·고시되는 ‘약제 급여 목록 및 급여 상한금액표’에 여전히 요양급여대상 약제로서 등재가 유지되고, 국민건강보험공단의 보험재정에서 그 약제비용의 일부가 지출된다. \n  이러한 사정에 비추어 보면 요양급여대상인 약제를 선별급여대상으로 변경하는 것을 두고 요양급여대상을 비급여대상으로 변경한 것이라고 할 수는 없다. 따라서 요양급여대상을 선별급여대상으로 변경한 ‘요양급여의 적용기준 및 방법에 관한 세부사항’에 요양급여대상 약제를 비급여대상 약제로 변경할 때 적용되는 구 국민건강보험 요양급여의 기준에 관한 규칙(2020. 10. 8. 보건복지부령 제755호로 개정되기 전의 것) 제13조 제4항 제9호, 제5항 제4호의 절차가 적용된다고 볼 수는 없다.\n [3] 보건복지부고시 ‘요양급여의 적용기준 및 방법에 관한 세부사항’이 있을 당시 구 국민건강보험법(2023. 5. 19. 법률 제19420호로 개정되기 전의 것) 등 관련 규정에서는 요양급여대상인 약제를 선별급여대상으로 변경할 경우 거쳐야 할 절차에 관하여 아무런 규정을 두고 있지 않다. 그런데 ‘고시’의 방법으로 불특정 다수인을 상대로 의무를 부과하거나 권익을 제한하는 처분은 성질상 처분의 사전통지나 의견제출의 기회를 주어야 하는 상대방을 특정할 수 없으므로, 이와 같은 처분에서까지 상대방에게 행정절차법에 따른 처분의 사전통지나 의견제출의 기회를 주어야 하는 것은 아니다.\n [4] 구 ‘선별급여 지정 및 실시 등에 관한 기준’(2020. 8. 12. 보건복지부고시 제2020-172호로 개정되기 전의 것, 이하 ‘구 선별급여지정기준’이라 한다) 제3조 제1항 제3호에 따르면, 약제의 선별급여 항목 및 본인부담률은 임상적 유용성, 대체가능성 등을 종합적으로 평가하여 결정하되, 그 평가기준은 [별표 1]에서 구체적으로 정하고 있다.\n  선별급여 항목 및 본인부담률을 결정할 때의 기준이 되는 약제의 임상적 유용성, 대체가능성 등에 관한 판단에는 고도의 의료·보건상의 전문성이 필요하므로, 행정청이 국민의 건강을 보호·증진하고, 국민건강보험재정의 건전성을 유지하고자 하는 목적에서 국민건강보험법의 위임에 따른 구 선별급여지정기준이 정하는 바에 따라 전문적인 판단을 하였다면, 그 판단은 기초가 된 사실인정에 중대한 오류가 있거나 판단이 객관적으로 불합리하거나 부당하다는 등의 특별한 사정이 없는 한 존중되어야 한다.",
    "참조조문": "[1] 구 국민건강보험법(2023. 5. 19. 법률 제19420호로 개정되기 전의 것) 제41조 제3항, 제41조의4 제1항, 구 국민건강보험 요양급여의 기준에 관한 규칙(2020. 10. 8. 보건복지부령 제755호로 개정되기 전의 것) 제5조 제2항 / [2] 구 국민건강보험법(2023. 5. 19. 법률 제19420호로 개정되기 전의 것) 제41조의4 제1항, 구 국민건강보험 요양급여의 기준에 관한 규칙(2020. 10. 8. 보건복지부령 제755호로 개정되기 전의 것) 제13조 제4항 제9호, 제5항 제4호 / [3] 구 국민건강보험법(2023. 5. 19. 법률 제19420호로 개정되기 전의 것) 제41조 제3항, 제41조의4 제1항, 행정절차법 제21조 제1항, 제22조 제3항 / [4] 구 국민건강보험법(2023. 5. 19. 법률 제19420호로 개정되기 전의 것) 제41조의4 제1항, 행정소송법 제27조, 행정기본법 제21조",
    "참조판례": "[3] 대법원 2014. 10. 27. 선고 2012두7745 판결(공2014하, 2265) / [4] 대법원 2016. 1. 28. 선고 2013두21120 판결(공2016상, 368)",
    "판례내용": "【원고, 상고인】 별지 원고들 명단 기재와 같다. (소송대리인 법무법인(유한) 세종 외 13인)\n【피고, 피상고인】 보건복지부장관\n【피고보조참가인】 국민건강보험공단 외 1인 (소송대리인 변호사 추미숙 외 1인)\n【원심판결】 서울고법 2024. 5. 10. 선고 2022누57420 판결\n【주    문】\n  상고를 모두 기각한다.  상고비용은 보조참가로 인한 부분을 포함하여 원고들이 부담한다. \n\n【이    유】  상고이유를 판단한다.\n  1. 사건의 개요\n  원심이 인정한 사실관계는 다음과 같다.\n  가. 원고 1 내지 19는 콜린알포세레이트(Choline Alfoscerate) 성분의 경구·시럽·주사제에 해당하는 원심 판시 이 사건 약제를 구 국민건강보험법(2023. 5. 19. 법률 제19420호로 개정되기 전의 것, 이하 같다)에 따른 요양급여대상 약제로 제조·판매하는 회사들이고, 나머지 원고들은 구 국민건강보험법 적용을 받는 건강보험 가입자 또는 피부양자로서 이 사건 약제를 처방받아 복용하고 있는 환자들이다.\n  나. 이 사건 약제는 당초 구 「국민건강보험 요양급여의 기준에 관한 규칙」(2020. 10. 8. 보건복지부령 제755호로 개정되기 전의 것, 이하 ‘구 요양급여기준규칙’이라 한다) 제8조 제2항에 따라 피고가 고시하는 「약제 급여 목록 및 급여 상한금액표」(이하 ‘약제급여목록표’라 한다)에 등재되어 국민건강보험법상 요양급여대상으로 됨으로써 이를 처방받은 외래환자는 30%의 본인부담률을 적용받아 왔다. \n  다. 피고는 2020. 8. 26. 보건복지부고시 제2020-183호로 「요양급여의 적용기준 및 방법에 관한 세부사항」(이하 ‘요양급여적용기준’이라 한다)을 개정함으로써 이 사건 약제의 요양급여대상 세부인정기준과 방법을 변경하였다. 그 결과 이 사건 약제를 치매 진단을 받은 환자의 \"뇌혈관 결손에 의한 2차 증상 및 변성 또는 퇴행성 뇌기질성 정신증후군: 기억력저하와 착란, 의욕 및 자발성 저하로 인한 방향감각장애, 의욕 및 자발성 저하, 집중력감소\"에 대해 투여하는 경우에 한하여 기존과 동일하게 요양급여대상으로 인정되고, 그 이외의 질환에 대해서는 선별급여대상으로 지정되어 환자 본인부담률이 80%로 상향되었다(이와 같이 개정된 요양급여적용기준 고시를 이하 ‘이 사건 고시’라 한다). 즉 이 사건 고시는 기존에 요양급여대상이었던 이 사건 약제에 관하여 특정 질환에 대해서는 종전과 같이 그대로 요양급여대상으로 유지하면서, 그 외의 질환에 대해서는 선별급여대상으로 변경한 것이다.\n  2. 이 사건 고시의 근거 법령에 대한 판단\n구 국민건강보험법 제41조 제3항에서는 요양급여의 방법·절차·범위·상한 등의 기준은 보건복지부령으로 정한다고 규정하고, 그 위임을 받은 구 요양급여기준규칙 제5조 제2항에서는 요양급여의 적용기준 및 방법에 관한 세부사항은 의약계·공단 및 건강보험심사평가원의 의견을 들어 보건복지부장관이 정하여 고시한다고 규정하고 있다. 이에 따라 보건복지부장관은 요양급여대상인 약제와 그 약제의 급여 상한금액에 관하여는 앞서 본 바와 같은 ‘약제급여목록표’를 고시하여 결정하고, 이와 같이 요양급여대상으로 결정·고시된 약제에 대한 요양급여가 어떠한 기준과 방법, 범위 내에서 지급되는지 등에 관한 세부사항에 관하여는 ‘요양급여적용기준’을 고시하여 결정한다.\n한편 구 국민건강보험법 제41조의4 제1항에서는 요양급여를 결정하는 데에 경제성 또는 치료효과성 등이 불확실하여 그 검증을 위하여 추가적인 근거가 필요하거나 경제성이 낮아도 가입자와 피부양자의 건강회복에 잠재적 이익이 있는 등 대통령령으로 정하는 경우에는 예비적인 요양급여인 선별급여로 지정하여 실시할 수 있다고 규정한다. 그리고 구 「선별급여 지정 및 실시 등에 관한 기준」(2020. 8. 12. 보건복지부고시 제2020-172호로 개정되기 전의 것, 이하 ‘구 선별급여지정기준’이라 한다) 제3조 제2항에서는 선별급여로 지정된 항목 및 본인부담률은 그 기준 [별표 2]와 같고, 다만 앞서 본 ‘요양급여적용기준’에서 급여대상 이외 선별급여를 별도로 정하여 실시하는 경우는 해당 항목의 세부인정사항에 따른다고 규정한다. 그리하여 보건복지부장관은 선별급여의 대상 및 본인부담률을 ‘구 선별급여지정기준’에서 정하거나 혹은 ‘요양급여적용기준’에서 별도로 정하여 고시함으로써 이를 실시할 수 있다.\n이러한 관련 규정의 내용과 체계, 선별급여제도의 도입배경 및 입법 취지 등을 종합하여 보면, 선별급여는 구 국민건강보험법 제41조 제3항에서 말하는 요양급여에 포함되는 것으로서, 이 사건 고시(요양급여적용기준)는 위와 같은 규정 등을 포함한 상위법령의 위임 및 근거에 따라 고시된 것으로 봄이 옳다.\n  같은 취지의 원심판단은 정당하고, 이와 다른 전제에서 이 사건 고시가 법적 근거가 없어 위법하다는 취지의 이 부분 상고이유 주장은 받아들일 수 없다. \n  3. 이 사건 고시의 절차적 하자 유무에 관한 판단\n  가. 앞서 본 바와 같이 구 국민건강보험법 제41조의4 제1항에서는 선별급여를 ‘예비적인 요양급여’라고 하여 요양급여의 일종으로 규정하고 있다. 그 결과 요양급여대상 약제를 선별급여대상 약제로 변경하더라도 요양급여대상 약제가 결정·고시되는 ‘약제급여목록표’에 여전히 요양급여대상 약제로서의 등재가 유지되고, 국민건강보험공단의 보험재정에서 그 약제비용의 일부가 지출된다. \n이러한 사정에 비추어 보면 요양급여대상인 약제를 선별급여대상으로 변경하는 것을 두고 요양급여대상을 비급여대상으로 변경한 것이라고 할 수는 없다. 따라서 요양급여대상을 선별급여대상으로 변경한 이 사건 고시에 요양급여대상 약제를 비급여대상 약제로 변경할 때 적용되는 구 요양급여기준규칙 제13조 제4항 제9호, 제5항 제4호의 절차가 적용된다고 볼 수는 없다.\n  나. 한편 이 사건 고시가 있을 당시 구 국민건강보험법 등 관련 규정에서는 요양급여대상인 약제를 선별급여대상으로 변경할 경우 거쳐야 할 절차에 관하여 아무런 규정을 두고 있지 않다. 그런데 이 사건과 같이 ‘고시’의 방법으로 불특정 다수인을 상대로 의무를 부과하거나 권익을 제한하는 처분은 그 성질상 처분의 사전통지나 의견제출의 기회를 주어야 하는 상대방을 특정할 수 없으므로, 이와 같은 처분에서까지 그 상대방에게 행정절차법에 따른 처분의 사전통지나 의견제출의 기회를 주어야 하는 것은 아니다(대법원 2014. 10. 27. 선고 2012두7745 판결 참조).\n  나아가 원심이 그 판결 이유에서 인정한 사실관계에서 알 수 있는 다음과 같은 사정에 비추어 보면, 피고는 요양급여대상 약제를 선별급여대상으로 변경할 경우 약제를 판매하는 제약회사들의 권익이 제한될 수 있다는 점을 고려하여 이 사건 고시를 개정하기에 앞서 제약회사들에 사전통지와 의견제출 기회는 물론, 이의신청의 기회까지 보장하였다. 이 사건 고시에 따라 권익을 제한받는 자들은 이러한 과정을 통해 충분히 자신의 의견을 개진할 기회를 보장받았으므로, 피고의 이 사건 고시 개정 과정에 이해관계인들의 절차적 권리가 침해당했다고 볼 수도 없다.\n  1) 피고는 2020. 5. 18. 이 사건 약제에 대한 건강보험 약제 급여적정성 재평가를 추진한다고 공고하였다. 그에 따라 건강보험심사평가원장은 같은 날 이 사건 약제를 판매하는 제약회사들에 대하여 이 사건 약제의 임상적 유용성 등에 관한 자료를 제출하여 달라는 요청을 하여 제약회사들로부터 이를 제출받았다.\n  2) 약제급여평가위원회는 2020. 6. 11. 이 사건 약제에 관하여 이 사건 고시와 동일한 내용으로 일부 질환에 대해서는 선별급여대상으로 변경하기로 의결하였다. 건강보험심사평가원장은 그 무렵 이 사건 약제를 판매하는 제약회사에 이를 통지하면서, 이견이 있으면 구 요양급여기준규칙 제11조의2 제1항 제2호에서 정한 재평가 신청이 가능하다고 안내하였다.\n  3) 제약회사들의 재평가 신청에 따라 2020. 7. 23. 개최된 약제급여평가위원회는 제약회사를 비롯한 관련 학회와 단체가 추가로 제출한 의견을 검토한 뒤 이 사건 약제에 관한 기존 의결을 유지하기로 하였다. 건강보험정책심의위원회가 다음 날 이를 피고에게 보고하자, 피고는 2020. 8. 26. 앞서와 같이 이 사건 고시를 개정하였다.\n  다. 이러한 사정을 고려하여 보면, 이 사건 고시에 절차적 하자가 없다고 본 원심판단은 정당하다. 여기에 상고이유 주장과 같이 이 사건 고시에 적용되어야 하는 절차에 관한 법리를 오해한 잘못이 없다. \n  4. 선별급여대상 지정의 실체적 요건을 충족하였는지에 대한 판단\n구 선별급여지정기준 제3조 제1항 제3호에 의하면, 약제의 선별급여 항목 및 본인부담률은 임상적 유용성, 대체가능성 등을 종합적으로 평가하여 결정하되, 그 평가기준은 [별표 1]에서 구체적으로 정하고 있다.\n선별급여 항목 및 본인부담률을 결정할 때의 기준이 되는 약제의 임상적 유용성, 대체가능성 등에 대한 판단에는 고도의 의료·보건상의 전문성이 필요하므로, 행정청이 국민의 건강을 보호·증진하고, 국민건강보험재정의 건전성을 유지하고자 하는 목적에서 국민건강보험법의 위임에 따른 구 선별급여지정기준이 정하는 바에 따라 전문적인 판단을 하였다면, 그 판단은 기초가 된 사실인정에 중대한 오류가 있거나 판단이 객관적으로 불합리하거나 부당하다는 등의 특별한 사정이 없는 한 존중되어야 한다(대법원 2016. 1. 28. 선고 2013두21120 판결 등 참조). \n  원심은 이러한 전제 아래 이 사건 약제의 임상적 유용성과 대체가능성 등에 관한 피고의 판단이 위법하다고 볼 수 없다고 판단하였다. 관련 법리와 기록에 비추어 보면, 원심판단은 충분히 수긍할 수 있고, 거기에 상고이유 주장과 같이 이 사건 약제의 임상적 유용성과 대체가능성 등에 관한 채증법칙 위반, 심리미진 등의 잘못이 없다. \n  5. 행정행위 철회에 관한 판단\n  원심이 그 판결 이유에서 인정한 사실관계에 의하여 알 수 있는 다음과 같은 사정을 고려하여 보면, 피고가 이 사건 약제를 요양급여대상으로 지정하였던 수익적 행정처분을 이 사건 고시를 통해 일부 철회한 것으로 본다 하더라도, 철회권 행사가 그 한계를 일탈하여 위법한 것이라고 보기 어렵다. 이와 결론을 같이한 원심판단에 판결에 영향을 미친 잘못이 없다.\n  가. 앞서 본 바와 같이 피고가 치매 관련 질환을 제외한 나머지 경우에는 이 사건 약제의 임상적 유용성이 미흡하고 비용효과성이 인정되지 않으며, 대체가능성이 있다고 평가한 것이 부당하다고 보기 어렵다. 더욱이 미국, 영국, 프랑스 등 의약품 관련 주요 8개 선진국 중 이 사건 약제와 같은 콜린알포세레이트 제재를 의약품으로 인정하는 국가는 이를 최초로 개발한 회사가 속한 이탈리아만이 유일하고 현재까지도 나머지 국가에서는 이를 의약품으로 인정하지 않고 있다. \n  나. 이 사건 약제가 1995년경부터 요양급여대상으로 지정되어 상당히 오랜 기간 요양급여대상 약제로서의 지위를 유지하고 있었기는 하나, 이 사건 약제를 판매하는 제약회사들이나 복용하고 있던 환자들이 추후 이 사건 약제의 임상적 유용성이 의심스럽다고 밝혀진 경우까지 이 사건 약제가 계속 요양급여대상으로 유지될 것이라는 기대를 하였다거나 그러한 기대가 정당하다고 보기 어렵다.\n  다. 이 사건 고시는 이 사건 약제를 비급여대상으로 변경한 것이 아니고, 치매 관련 질환을 제외한 나머지 질환에 대해서만 선별급여대상으로 변경하였으며, 선별급여대상으로 지정된 그 질환에 대하여도 약제비용의 일부를 국민건강보험공단에서 부담하고 있다.\n  라. 이러한 사정을 고려하면, 이 사건 고시로 초래되는 원고들의 불이익이 적지 않다 하더라도 그에 비해 임상적 유용성이 의심스러운 약제에 대하여 국민건강보험공단의 보험재정 지출을 미연에 방지함으로써 보험재정의 건전성을 도모할 공익상의 필요는 더욱 크다고 보아야 한다. \n  6. 재량권 일탈·남용의 위법 여부에 관한 판단\n  원심은 피고에게 이 사건 약제에 대한 요양급여비용 지원 여부 및 그 정도를 결정할 광범위한 재량이 있다는 전제 아래, 이 사건 고시가 국민건강보험재정의 건전성을 도모하기 위한 것으로 목적의 정당성과 수단의 적합성이 인정되고, 이 사건 약제의 일부 질환에 대한 본인부담률을 80%로 정하였다고 하여 침해 최소성이나 법익 균형성 원칙에 위배된다고 볼 수 없다는 이유로 이 사건 고시가 과잉금지 원칙에 반한다거나 재량권을 일탈·남용한 것이라 볼 수 없다고 판단하였다. \n  기록에 비추어 보면, 원심판단은 정당하다. 거기에 행정행위의 재량권 일탈·남용에 관한 법리를 오해한 잘못이 없다. 원고들의 이 부분 상고이유도 받아들일 수 없다. \n  7. 결론\n  상고를 모두 기각하고, 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.   \n[별   지] 원고들 명단: 생략\n\n대법관 서경환(재판장) 노태악 신숙희 노경필(주심)"

    "판례내용": "【원고, 상고인】 ○○○ 아일랜드 리미티드(△△△ Ireland Limited) (소송대리인 변호사 김용덕 외 7인\n【피고, 피상고인】 개인정보보호위원회 (소송대리인 법무법인 민후 담당변호사 김경환 외 4인)\n【피고보조참가인】 피고보조참가인 1 외 2인 (소송대리인 법무법인 지향 담당변호사 김기탁 외 6인)\n【원심판결】 서울고법 2024. 9. 13. 선고 2023누64906 판결\n【주    문】\n  상고를 기각한다.  상고비용은 보조참가로 인한 부분을 포함하여 원고가 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 제2, 3, 5 상고이유에 관한 판단\n  가. 원심은 판시와 같은 이유로 다음과 같은 사정을 들어 이 사건 처분에 처분사유가 존재한다고 본 다음, 원고가 제출한 증거만으로는 중대한 사실오인이나 이익형량의 하자 등으로 재량권을 일탈·남용한 위법이 있다고 볼 수 없다고 판단하였다.\n  1) 원고는 영리를 목적으로 정보통신망을 통해 대한민국 국민 등 이용자들에게 정보통신서비스인 페이스북 서비스를 제공하고 있는 자로서, 구 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」(2020. 2. 4. 법률 제16955호로 개정되기 전의 것, 이하 ‘구 정보통신망법’이라 한다) 제2조 제1항 제3호의 정보통신서비스 제공자이다.\n  2) 원고가 페이스북 서비스 이용자의 친구(Friends, 이하 ‘친구’라 한다)의 개인정보를 제3자 앱에 제공한 행위는 구 정보통신망법 제24조의2 제1항이 정한 ‘개인정보를 제3자에게 제공하는 행위’에 해당한다.\n  3) 설령 제3자 앱에 제공된 개인정보가 친구 스스로 이미 공개한 개인정보라고 하더라도, 원고가 그 개인정보를 제3자 앱에 제공한 행위는 정보주체인 친구의 별도 동의를 받지 않더라도 친구의 동의가 있었다고 객관적으로 인정되는 범위 내에 해당한다고 보기 어렵다. 원고가 친구의 동의 없이 그 개인정보를 제3자 앱에 제공한 것은 친구의 개인정보자기결정권을 침해한 위법한 행위라고 보아야 한다.\n  나. 원심판단에 상고이유 주장과 같이 구 정보통신망법 제24조의2 제1항이 정한 개인정보 제공의 주체 및 행위 요건, 정보주체의 동의 요건, 재량권 일탈·남용 등에 관한 법리를 오해하여 필요한 심리를 다하지 않거나 논리와 경험 법칙을 위반하여 자유심증주의 한계를 벗어나 판결에 영향을 미친 잘못이 없다.\n  2. 제1 상고이유에 관한 판단\n  원심은 판시와 같은 이유로 이 사건 시정명령 처분은 의무 내용이 명확하지 않다거나 충분히 특정되지 않아 이행이 불가능하다고 할 수 없고, 오히려 이 사건 시정명령에서 명한 조치가 개인정보자기결정권 침해 상태를 제거하기 위한 적절한 시정 방안이라고 볼 수 있어 적법하다고 판단하였다.\n  원심판결 이유를 관련 법리에 비추어 살펴보면, 원심판단에 상고이유 주장과 같이 이 사건 시정명령의 대상과 범위, 시정조치를 명한 의무의 특정 및 그 이행가능성에 관한 법리오해, 판단누락 등으로 판결에 영향을 미친 잘못이 없다.\n  3. 제4 상고이유에 관한 판단\n  원심은 판시와 같은 이유로 ‘피고가 과징금 산정 시 위반행위와 관련한 매출액의 범위를 페이스북 로그인 서비스의 매출액에 한정하지 않았고, 그 관련 매출액을 객관적으로 산정하기 곤란함에도 정액과징금을 부과하지 않았으므로, 이 사건 과징금 처분은 위법하다.’는 취지의 원고 주장을 배척한 다음, 이 사건 과징금 처분에 위반행위의 중대성, 추가적인 가중사유 등 과징금 산정의 기초가 되는 사실을 오인하거나 비례의 원칙을 위반하여 재량권을 일탈·남용한 위법이 없다고 판단하였다.\n  원심판결 이유를 관련 법리에 비추어 살펴보면, 원심판단에 상고이유 주장과 같이 구 정보통신망법 제64조의3 제1항, 제2항 등이 정한 위반행위와 관련한 매출액의 범위 및 정액과징금 부과사유, 과징금 산정기준과 가중사유, 비례의 원칙, 재량권 일탈·남용 등에 관한 법리를 오해하여 필요한 심리를 다하지 않거나 논리와 경험 법칙을 위반하여 자유심증주의 한계를 벗어나 판결에 영향을 미친 잘못이 없다.\n  4. 결론\n  상고를 기각하고, 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.  \n\n대법관 서경환(재판장) 노태악 신숙희 노경필(주심)"
  },

    "사건명": "학교용지부담금부과처분취소[주택법에 따른 개발사업의 개발사업시행자에게 학교용지부담금을 부과한 사건]",

    "판결유형": "판결",
    "판시사항": "[1] 시·도지사가 개발사업지역에서 공동주택을 분양하는 자에게 부과할 학교용지부담금을 산정할 때 반드시 개발사업으로 증가하는 공동주택의 세대수를 기준으로 삼아야 하는지 여부(소극)\n [2] 시·도지사가 개발사업시행자에게 부과할 학교용지부담금을 산정할 때 개발사업으로 인한 세대수 증가분 외에 고려할 사항\n [3] 학교용지 확보 등에 관한 특례법 제5조 제1항 단서에 따라 학교용지부담금 부과·징수 대상에서 제외되는 개발사업을 규정하고 있는 각호가 열거적 성격인지 여부(적극) 및 위 조항 단서가 주택법에 따른 개발사업분에 유추적용될 수 있는지 여부(소극)",
    "판결요지": "[1] 학교용지 확보 등에 관한 특례법(이하 ‘학교용지법’이라 한다) 제5조 제1항 본문은 \"시·도지사는 개발사업지역에서 단독주택을 건축하기 위한 토지를 개발하여 분양하거나 공동주택을 분양하는 자에게 부담금을 부과·징수할 수 있다.\"라고 규정하고 있고, 문언상 위 규정에 따른 학교용지부담금(이하 ‘부담금’이라 한다) 부과는 재량행위로 해석된다. 또한 학교용지법 제5조 제1항 본문에 따른 부담금의 산정기준에 관한 학교용지법 제5조의2는 공동주택의 부담금은 세대별 공동주택 분양가격에 1천분의 8을 곱한 금액으로 산정하도록 규정하고 있을 뿐, 그 부담금 산정의 기준이 되는 세대수를 개발사업으로 공급하는 공동주택 세대수에서 해당 개발사업지역 내 거주하고 있던 기존 세대수를 공제하는 방법으로 산정하여야 한다는 취지로 규정하고 있지는 않다. 그러므로 시·도지사가 공동주택의 부담금을 산정할 때 반드시 개발사업으로 인하여 증가하는 공동주택의 세대수를 기준으로 삼아야만 하는 것은 아니다. \n [2] 개발사업시행자에게 학교용지부담금을 부과하는 것은 개발사업으로 인하여 학교시설 확보의 필요성이 유발되었기 때문이고, 개발사업으로 인하여 증가하는 세대수는 이러한 학교시설 확보의 필요성 및 그 정도를 평가하는 데 고려될 수 있다. 그러나 개발사업으로 인하여 유발된 학교시설 확보의 필요성 및 그 정도가 언제나 개발사업으로 인한 세대수 증가분에 정확하게 비례하는 것은 아니다. 따라서 시·도지사는 그 외에도 해당 지역의 상황 및 변화 가능성, 취학인구의 증감 추이, 개발사업으로 해당 지역에 유입될 인구의 연령별 분포 및 취학인구의 비중, 교육환경에 대한 사회적 인식과 교육정책의 변화 등 여러 요소들을 종합적으로 고려하여 재량권의 범위 내에서 학교용지부담금을 산정할 수 있다.\n [3] 학교용지 확보 등에 관한 특례법(이하 ‘학교용지법’이라 한다) 제5조 제1항 단서는 제5조 제1항 본문에도 불구하고 학교용지부담금(이하 ‘부담금’이라 한다) 부과·징수 대상에서 제외되는 개발사업분을 각호에서 규정하고 있는데, 이는 부담금의 감면요건도 법문대로 엄격하게 해석해야 한다는 원칙에 비추어 열거적인 성격을 띠는 것으로 보아야 한다. 따라서 위 단서는 주택법에 따른 개발사업분과 같이 각호에 규정되지 않은 개발사업분에 대해서는 적용되지 않으므로 주택법에 따른 개발사업분에 대한 부담금은 학교용지법 제5조 제1항 본문에 따라 부과·징수되면 충분하다. \n학교용지법 제5조 제1항 단서가 주택법에 따른 개발사업분에 유추적용된다고 할 수도 없다. 유추적용은 법적 규율이 없는 사안과 법적 규율이 있는 사안 사이에 공통점 또는 유사점이 있고, 법규범의 내용과 체계, 입법 의도와 법률의 목적 등에 비추어 유추적용이 정당하다고 평가되는 경우에 인정할 수 있다. 학교용지법 제5조 제1항 단서 각호에 규정된 도시개발법에 따른 도시개발사업, 도시 및 주거환경정비법(이하 ‘도시정비법’이라 한다)에 따른 재개발·재건축사업, 빈집 및 소규모주택 정비에 관한 특례법(이하 ‘소규모주택정비법’이라 한다)에 따른 소규모재건축사업 등은 근거 법률 및 해당 사업의 목적과 내용, 해당 사업시행자의 지위 등에 비추어 볼 때 주택법에 따른 주택건설사업에 비해 공공성이 강하다. 학교용지법 제5조 제1항 단서 각호 개발사업의 특성은 그 사업이 일정한 요건 아래 부담금 부과·징수 대상에서 제외되는 단서의 규율과 밀접하게 관련되어 있으므로, 이와 특성을 달리하는 주택법에 따른 주택건설사업에 위 단서가 당연히 유추적용된다고 할 수 없다. \n  설령 학교용지법 제5조 제1항 단서가 주택법에 따른 개발사업분에 적용 또는 유추적용된다고 하더라도, 이러한 단서 규정만으로는 개발사업으로 인한 세대수 증가분에 상응하여 공동주택의 부담금을 산정하여야 한다는 결론을 도출할 수 없다. 학교용지법 제5조 제1항 단서 제3호, 제5호는 개발사업 중 도시개발법에 따른 도시개발사업, 도시정비법에 따른 재개발·재건축사업, 소규모주택정비법에 따른 소규모재건축사업 등의 경우 그 사업 시행 결과 해당 도시개발구역, 정비구역, 사업시행구역 내 세대수가 증가하지 않는다면 부담금을 부과하지 않도록 규정하고 있다. 그러나 위 각 규정은 개발사업 시행 결과 해당 개발사업지역 내 세대수가 증가하지 아니할 경우 부과·징수 대상에서 제외된다는 취지일 뿐이고, 개발사업으로 세대수가 증가할 경우 그 세대수 증가분에 상응하는 부담금만 부과할 수 있다는 취지로 해석할 수는 없다. 그리고 학교용지법 제5조 제1항 단서의 나머지 각호는 세대수 미증가 여부를 부담금 부과·징수 대상에서 제외되는 개발사업의 요건으로 삼고 있지 않다.",
    "참조조문": "[1] 학교용지 확보 등에 관한 특례법 제5조 제1항, 제5조의2 / [2] 학교용지 확보 등에 관한 특례법 제5조 제1항, 제5조의2 / [3] 학교용지 확보 등에 관한 특례법 제5조 제1항, 제5조의2",
    "참조판례": "[1] 대법원 2022. 12. 29. 선고 2020두49041 판결(공2023상, 379) / [2] 대법원 2017. 12. 28. 선고 2017두30122 판결(공2018상, 438)",
    "판례내용": "【원고, 피상고인】 ○○○ 지역주택조합 (소송대리인 법무법인(유한) 영진 담당변호사 강정민)\n【피고, 상고인】 울산광역시 남구청장 (소송대리인 변호사 김재권)\n【원심판결】 부산고법 2023. 6. 29. 선고 (울산)2022누10838 판결\n【주    문】\n  원심판결 중 피고 패소 부분을 파기하고, 이 부분 사건을 부산고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다. \n  1. 사안의 개요 \n  원심판결 이유와 기록에 의하면 다음과 같은 사실을 알 수 있다.  \n  가. 원고는 울산 남구 (이하 생략) 외 100필지(이하 ‘이 사건 사업구역’이라 한다) 지상에서 기존 주택을 철거하고 아파트를 신축하는 사업(이하 ‘이 사건 사업’이라 한다)을 시행할 목적으로 설립되어, 2017. 9. 14. 피고로부터 주택법 제11조 제1항에 따라 설립인가를 받은 지역주택조합이다.   \n  나. 원고는 피고로부터, 2020. 6. 12. 주택법 제15조 제1항에 따라 이 사건 사업구역 지상에 총 384세대의 아파트 5동을 건축하는 내용 등으로 사업계획승인을 받고, 2020. 9. 17. 주택법 제54조 제1항에 따라 입주자모집 승인을 받았다. \n  다. 피고는 원고로부터 이 사건 사업에 따라 건축할 아파트 384세대 전부에 관한 분양자료를 제출받고, 2021. 6. 16. 원고에 대하여 「학교용지 확보 등에 관한 특례법」(이하 ‘학교용지법’이라 한다) 제5조 제1항 본문, 제5조의2에 따라 위 384세대 아파트 전부에 관한 학교용지부담금 1,476,850,330원을 부과하였다. \n  2. 상고이유에 관한 판단 \n  가. 관련 법령 \n  1) 학교용지법 제2조 제2호 (라)목은 주택법에 따라 시행하는 사업 중 100세대 규모 이상의 공동주택을 건설하는 사업을 학교용지법에 따른 개발사업으로 규정하고 있다. 그리고 학교용지법 제2조 제3호는 위와 같은 개발사업에 대하여 특별시장·광역시장·특별자치시장·도지사 또는 특별자치도지사가 학교용지를 확보하거나, 학교용지를 확보할 수 없는 경우 가까운 곳에 있는 학교를 증축하기 위하여 개발사업을 시행하는 자에게 징수하는 경비를 학교용지부담금(이하 ‘부담금’이라 한다)이라고 규정하고 있다. \n  2) 학교용지법 제5조 제1항 본문은 \"시·도지사는 개발사업지역에서 단독주택을 건축하기 위한 토지를 개발하여 분양하거나 공동주택을 분양하는 자에게 부담금을 부과·징수할 수 있다.\"라고 규정하고, 같은 항 단서는 \"다만 다음 각호의 어느 하나에 해당하는 개발사업분의 경우에는 그러하지 아니하다.\"라고 규정하고 있다. 단서의 각호에는 ① 도시개발법 제2조 제1항 제2호에 따른 도시개발사업 시행 결과 해당 도시개발구역 내 세대수가 증가하지 아니하는 경우(제3호), ② 「도시 및 주거환경정비법」(이하 ‘도시정비법’이라 한다) 제2조 제2호 (가)목에 따른 주거환경개선사업의 경우(제4호), ③ 도시정비법 제2조 제2호 (나)목부터 (다)목까지의 규정에 따른 정비사업 및 「빈집 및 소규모주택 정비에 관한 특례법」(이하 ‘소규모주택정비법’이라 한다) 제2조 제1항 제3호 (나)·(다)목에 따른 소규모주택정비사업 시행 결과 해당 정비구역 및 사업시행구역 내 세대수가 증가하지 아니하는 경우(제5호), ④ 주택법 제2조 제11호 (다)목에 따른 리모델링주택조합의 구성원에게 분양하는 경우(제6호) 등이 포함되어 있다. \n  나. 이 사건의 쟁점 \n  이 사건의 쟁점은, 주택법에 따른 개발사업에 관하여 학교용지법에 따른 부담금 산정 시 그 개발사업으로 공급하는 세대수에서 해당 개발사업지역 내에 거주하고 있던 기존 세대수를 공제하는 방법으로 산정하여야 하는지 등이다.\n  다. 원심의 판단 \n  원심은 그 판시와 같은 이유로 주택법에 따른 개발사업인 이 사건 사업에서 학교용지법에 따른 부담금 산정 시 기준이 되는 세대수는 이 사건 사업으로 공급하는 공동주택의 세대수에서 이 사건 사업 시행 전에 이 사건 사업구역에 거주하고 있던 기존 세대수를 공제하는 방법으로 산정하여야 한다고 판단하였다. \n  라. 대법원의 판단 \n  그러나 원심의 판단은 다음과 같은 이유로 수긍할 수 없다. \n  1) 관련 법리 \n  조세나 부과금 등의 부담금에 관한 법률의 해석에 관하여, 그 부과요건이거나 감면요건을 막론하고 특별한 사정이 없는 한 법문대로 해석하여야 하고 합리적 이유 없이 확장해석하거나 유추해석하는 것은 허용되지 않는다(대법원 2022. 12. 29. 선고 2022다218585 판결 등 참조). \n  2) 학교용지법 제5조 제1항 본문에 따른 부담금 산정의 원칙\n학교용지법 제5조 제1항 본문은 앞서 본 바와 같이 \"시·도지사는 개발사업지역에서 단독주택을 건축하기 위한 토지를 개발하여 분양하거나 공동주택을 분양하는 자에게 부담금을 부과·징수할 수 있다.\"라고 규정하고 있고, 그 문언상 위 규정에 따른 부담금 부과는 재량행위로 해석된다(대법원 2022. 12. 29. 선고 2020두49041 판결 등 참조). 또한 학교용지법 제5조 제1항 본문에 따른 부담금의 산정기준에 관한 학교용지법 제5조의2는 공동주택의 부담금은 세대별 공동주택 분양가격에 1천분의 8을 곱한 금액으로 산정하도록 규정하고 있을 뿐, 그 부담금 산정의 기준이 되는 세대수를 개발사업으로 공급하는 공동주택 세대수에서 해당 개발사업지역 내 거주하고 있던 기존 세대수를 공제하는 방법으로 산정하여야 한다는 취지로 규정하고 있지는 않다. 그러므로 시·도지사가 공동주택의 부담금을 산정할 때 반드시 개발사업으로 인하여 증가하는 공동주택의 세대수를 기준으로 삼아야만 하는 것은 아니다. \n  한편 개발사업시행자에게 부담금을 부과하는 것은 개발사업으로 인하여 학교시설 확보의 필요성이 유발되었기 때문이고(대법원 2017. 12. 28. 선고 2017두30122 판결 등 참조), 개발사업으로 인하여 증가하는 세대수는 이러한 학교시설 확보의 필요성 및 그 정도를 평가하는 데 고려될 수 있다. 그러나 개발사업으로 인하여 유발된 학교시설 확보의 필요성 및 그 정도가 언제나 개발사업으로 인한 세대수 증가분에 정확하게 비례하는 것은 아니다. 따라서 시·도지사는 그 외에도 해당 지역의 상황 및 그 변화 가능성, 취학인구의 증감 추이, 개발사업으로 해당 지역에 유입될 인구의 연령별 분포 및 취학인구의 비중, 교육환경에 대한 사회적 인식과 교육정책의 변화 등 여러 요소들을 종합적으로 고려하여 재량권의 범위 내에서 부담금을 산정할 수 있다.\n  3) 학교용지법 제5조 제1항 단서의 적용 또는 유추 적용 여부\n학교용지법 제5조 제1항 단서는 제5조 제1항 본문에도 불구하고 부담금 부과·징수 대상에서 제외되는 개발사업분을 각호에서 규정하고 있는데, 이는 부담금의 감면요건도 법문대로 엄격하게 해석하여야 한다는 원칙에 비추어 열거적인 성격을 띠는 것으로 보아야 한다. 따라서 위 단서는 주택법에 따른 개발사업분과 같이 각호에 규정되지 않은 개발사업분에 대해서는 적용되지 않으므로 주택법에 따른 개발사업분에 대한 부담금은 학교용지법 제5조 제1항 본문에 따라 부과·징수되면 충분하다. \n학교용지법 제5조 제1항 단서가 주택법에 따른 개발사업분에 유추적용된다고 할 수도 없다. 유추적용은 법적 규율이 없는 사안과 법적 규율이 있는 사안 사이에 공통점 또는 유사점이 있고, 법규범의 내용과 체계, 입법 의도와 법률의 목적 등에 비추어 유추적용이 정당하다고 평가되는 경우에 인정할 수 있다. 학교용지법 제5조 제1항 단서 각호에 규정된 도시개발법에 따른 도시개발사업, 도시정비법에 따른 재개발·재건축사업, 소규모주택정비법에 따른 소규모재건축사업 등은 그 근거 법률 및 해당 사업의 목적과 내용, 해당 사업시행자의 지위 등에 비추어 볼 때 주택법에 따른 주택건설사업에 비해 공공성이 강하다. 학교용지법 제5조 제1항 단서 각호의 개발사업의 특성은 그 사업이 일정한 요건 아래 부담금 부과·징수 대상에서 제외되는 단서의 규율과 밀접하게 관련되어 있으므로, 이와 특성을 달리하는 주택법에 따른 주택건설사업에 위 단서가 당연히 유추적용된다고 할 수 없다. \n설령 학교용지법 제5조 제1항 단서가 주택법에 따른 개발사업분에 적용 또는 유추적용된다고 하더라도, 이러한 단서 규정만으로는 개발사업으로 인한 세대수 증가분에 상응하여 공동주택의 부담금을 산정하여야 한다는 결론을 도출할 수 없다. 학교용지법 제5조 제1항 단서 제3호, 제5호는 개발사업 중 도시개발법에 따른 도시개발사업, 도시정비법에 따른 재개발·재건축사업, 소규모주택정비법에 따른 소규모재건축사업 등의 경우 그 사업 시행 결과 해당 도시개발구역, 정비구역, 사업시행구역 내 세대수가 증가하지 않는다면 부담금을 부과하지 않도록 규정하고 있다. 그러나 위 각 규정은 개발사업 시행 결과 해당 개발사업지역 내 세대수가 증가하지 아니할 경우 부과·징수 대상에서 제외된다는 취지일 뿐이고, 개발사업으로 세대수가 증가할 경우 그 세대수 증가분에 상응하는 부담금만 부과할 수 있다는 취지로 해석할 수는 없다. 그리고 학교용지법 제5조 제1항 단서의 나머지 각호는 세대수 미증가 여부를 부담금 부과·징수 대상에서 제외되는 개발사업의 요건으로 삼고 있지 않다. \n  4) 원심판단의 당부\n  그런데도 원심은 그 판시와 같은 이유만으로 학교용지법에 따른 부담금을 산정함에 있어 기준이 되는 세대수를 이 사건 사업으로 공급하는 공동주택의 세대수에서 이 사건 사업 시행 전에 이 사건 사업구역에 거주하고 있던 기존 세대수를 공제하는 방법으로 산정하여야 한다고 판단하였다. 원심의 이러한 판단에는 학교용지법에 따른 부담금 산정에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 피고의 상고이유 주장은 이유 있다. \n  3. 결론\n  그러므로 원심판결 중 피고 패소 부분을 파기하고, 이 부분 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.   \n\n대법관 박영재(재판장) 오경미 권영준(주심)"
  },

    "판시사항": "[1] 부당해고 구제신청 후 사용자가 해고를 취소하여 원직복직을 명하고 임금 상당액을 지급한 경우, 근로자가 금전보상명령을 받을 구제이익이 소멸하는지 여부(원칙적 소극)\n [2] 중앙노동위원회가 부당해고 구제명령을 받을 구제이익이 있는지 판단하는 기준 시기(=재심판정 당시)",
    "판결요지": "[1] 근로기준법 제30조 제3항은 노동위원회는 부당해고에 대한 구제명령을 할 때에 근로자가 원직복직을 원하지 않으면 원직복직을 명하는 대신 근로자가 해고기간 동안 근로를 제공했더라면 받을 수 있었던 임금 상당액(이하 ‘임금 상당액’이라 한다) 이상의 금품을 근로자에게 지급하도록 명할 수 있다고 규정하고 있다. 이러한 금전보상명령은 원직복직명령을 대신하는 것이고 그 금액도 임금 상당액 이상의 금액이므로, 부당해고 구제신청 후 사용자가 해고를 취소하여 원직복직을 명하고 임금 상당액을 지급했더라도 특별한 사정이 없는 한 근로자가 금전보상명령을 받을 구제이익이 소멸하는 것은 아니다.\n [2] 부당해고 구제명령을 받을 구제이익은 구제명령을 할 당시를 기준으로 판단해야 하므로, 중앙노동위원회는 재심판정 당시를 기준으로 구제이익이 있는지를 판단해야 한다.",
    "참조조문": "[1] 근로기준법 제30조 제3항, 행정소송법 제12조 / [2] 근로기준법 제30조 제1항, 행정소송법 제12조",
    "참조판례": "[2] 대법원 2004. 1. 15. 선고 2003두11247 판결, 대법원 2009. 12. 10. 선고 2008두22136 판결(공2010상, 133)",
    "판례내용": "【원고, 피상고인】 원고 (소송대리인 법무법인 이루 담당변호사 김진석)\n【피고, 상고인】 중앙노동위원회위원장\n【피고보조참가인】 피고보조참가인\n【원심판결】 서울고법 2024. 8. 21. 선고 2023누60218 판결\n【주    문】\n  상고를 기각한다.  상고비용 중 보조참가로 인한 부분은 피고보조참가인이, 나머지는 피고가 각 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 의하면 다음과 같은 사실을 알 수 있다.\n  가. 원고는 직업환경의학 전문의로, 2021. 5. 7. 피고보조참가인(이하 ‘참가인’이라 한다)과 계약기간을 같은 날부터 2022. 5. 6.까지로 정한 근로계약을 체결하고 참가인이 운영하는 의원에서 근무하였다.\n  나. 참가인은 2021. 6. 29. 원고에게 문자메시지로 해고를 통지하였고(이하 ‘이 사건 해고’라 한다) 원고는 이 사건 해고가 부당하다고 주장하면서 2021. 9. 10. 충남지방노동위원회에 부당해고 구제신청을 하였다.\n  다. 참가인은 원고에게 문자메시지로 해고를 통보한 것은 절차위반이라고 판단하여 적법한 절차를 거쳐 다시 해고하기 위해 2021. 9. 30. 18:26 원고에게 카카오톡 메시지, 문자메시지, 이메일로 ‘복직 및 출근명령’(이하 ‘이 사건 복직명령’이라 한다)을 보냈다.\n  라. 원고의 대리인은 2021. 9. 30. 21:11 충남지방노동위원회에 이메일로 근로기준법 제30조 제3항에 따른 금품지급명령(이하 ‘금전보상명령’이라 한다) 신청서를 제출하였고, 충남지방노동위원회는 2021. 10. 1. 참가인의 대리인에게 원고가 금전보상명령신청을 한 사실을 서면으로 알렸다.\n  마. 참가인은 2021. 10. 1. 원고에게 같은 날 18:00로 지정된 인사위원회에 출석할 것을 요구하는 출석요구서를 보냈고, 원고는 2021. 10. 1. 참가인에게 ‘발신일을 복직일로 하는 복직명령은 구제신청에 대한 회피 목적이고, 이 사건 복직명령 이전에 금전보상명령을 신청하였으므로 이 사건 복직명령 및 인사위원회 출석요구에 따른 의무가 없다.’는 내용의 문서를 보냈다.\n  바. 충남지방노동위원회는 2021. 11. 18. 원고가 신청한 금전보상액 중 일부를 받아들이는 금전보상명령을 하였으나, 중앙노동위원회는 2022. 2. 28. ‘참가인이 충남지방노동위원회로부터 금전보상신청명령서를 송달받기 전에 이 사건 복직명령을 하여 이 사건 해고를 취소하였고, 이 사건 복직명령에 진정성이 있으므로 원고의 구제신청은 구제이익이 인정되지 않는다.’는 이유로 초심판정을 취소하고 원고의 구제신청을 기각하였다(이하 ‘이 사건 재심판정’이라 한다).\n  사. 한편 참가인은 이 사건 복직명령을 하며 해고기간 동안의 임금 상당액을 지급하겠다는 의사를 표시하였으나, 이 사건 재심판정일까지 실제로 지급하지는 않았다.\n  2. 관련 법리\n  가. 근로기준법 제30조 제3항은 노동위원회는 부당해고에 대한 구제명령을 할 때에 근로자가 원직복직을 원하지 아니하면 원직복직을 명하는 대신 근로자가 해고기간 동안 근로를 제공하였더라면 받을 수 있었던 임금 상당액(이하 ‘임금 상당액’이라 한다) 이상의 금품을 근로자에게 지급하도록 명할 수 있다고 규정하고 있다. 이러한 금전보상명령은 원직복직명령을 대신하는 것이고 그 금액도 임금 상당액 이상의 금액이므로, 부당해고 구제신청 후 사용자가 해고를 취소하여 원직복직을 명하고 임금 상당액을 지급하였더라도 특별한 사정이 없는 한 근로자가 금전보상명령을 받을 구제이익이 소멸하는 것은 아니다.\n  나. 부당해고 구제명령을 받을 구제이익은 구제명령을 할 당시를 기준으로 판단하여야 하므로, 중앙노동위원회는 재심판정 당시를 기준으로 구제이익이 있는지를 판단하여야 한다(대법원 2004. 1. 15. 선고 2003두11247 판결, 대법원 2009. 12. 10. 선고 2008두22136 판결 참조).\n  3. 상고이유에 관한 판단\n  기록에 의하면, 원고의 대리인이 이 사건 재심판정일 이전에 금전보상명령을 신청하였고, 참가인이 임금 상당액 이상의 정당한 금전보상을 하지 아니한 이상 금전보상명령의 구제이익이 소멸되었다고 볼 수 없고, 이 사건 복직명령과 원고의 금전보상명령 신청의 선후 관계, 이 사건 복직명령에 진정성이 있는지 등은 그 구제이익에 영향을 미치지 않는다. 원심판결 이유에 적절하지 않은 부분은 있으나, 구제이익을 인정한 원심판결의 결론은 정당하고, 상고이유 주장과 같이 금전보상명령의 구제이익에 관한 법리를 오해하는 등으로 판결에 영향을 미친 잘못이 없다.\n  4. 결론\n  피고의 상고는 이유 없어 이를 기각하고 상고비용 중 보조참가로 인한 부분은 피고보조참가인이, 나머지는 피고가 각 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 엄상필(재판장) 이흥구(주심) 오석준 이숙연"
  },

    "판시사항": "행정청이 과거 상대방에게 한 특정한 처분으로 그에게 유리한 사실관계가 형성되었음을 인식하고도 이를 반영하지 않은 채 재량권을 행사한 경우, 재량권 일탈·남용에 해당하여 위법한지 여부(적극) 및 행정청이 상대방에게 그와 같은 사실관계에 관한 자료 제출을 요청했으나 그가 이를 제대로 이행하지 않은 경우라도 마찬가지인지 여부(원칙적 적극)",
    "판결요지": "재량행위에 대한 법원의 사법심사는 당해 행위가 사실오인, 비례·평등의 원칙 위배, 당해 행위의 목적 위반이나 부정한 동기 등에 근거하여 이루어짐으로써 재량권을 일탈·남용한 위법이 있는지 여부만을 심사하게 되는 것이나, 법원의 심사 결과 행정청의 재량행위가 사실오인 등에 근거한 것이라고 인정된다면 이는 재량권을 일탈·남용한 것으로서 위법하여 취소를 면치 못한다. 만약 행정청이 과거 상대방에게 한 특정한 처분으로 인하여 그에게 유리한 사실관계가 형성되었음을 인식하고 있었음에도 이를 반영하지 않은 채 재량권을 행사했다면, 이는 행정청의 사실오인에 기초한 것으로서 재량권 일탈·남용에 해당하여 위법하다. 행정청이 상대방에게 그와 같은 사실관계에 관한 자료의 제출을 요청했으나 그가 이를 제대로 이행하지 않은 경우라고 하더라도, 그러한 사정으로 인하여 행정청이 사실오인을 일으켰다는 등의 특별한 사정이 없는 한, 마찬가지이다.",

    "판례내용": "【원고, 상고인】 ○○○ 주식회사 (소송대리인 법무법인(유한) 해광 담당변호사 최창영 외 3인)\n【피고, 피상고인】 인천광역시장 외 1인 (소송대리인 법무법인 새얼 담당변호사 최영식)\n【원심판결】 서울고법 2024. 9. 26. 선고 2022누71952 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  가. 피고 인천광역시는 2009. 8.부터 ‘인천광역시 시내버스 수입금공동관리 준공영제’(이하 ‘이 사건 준공영제’라 한다)를 시행하고 있다. 원고는 이 사건 준공영제에 참여한 버스운송사업자로서, 인천광역시 내 노선번호 (노선번호 1 생략), (노선번호 2 생략), (노선번호 3 생략), (노선번호 4 생략), (노선번호 5 생략) 및 (노선번호 6 생략) 등 6개의 버스 노선을 운영하고 있다.\n  나. 피고 인천광역시는 이 사건 준공영제에 따라 각 버스운송사업자들에게 실제 지출한 연료비를 재정지원금으로 정산해 주었다. 피고 인천광역시장은 2015. 4. 무렵 연료비 절감을 위하여 표준연료비를 기준으로 연료비를 정산하는 내용의 ‘표준연비제 시행계획’을 마련하고, 2015. 6. 26. 원고를 비롯한 버스운송사업자들에게 이를 통지하였다. 여기서 ‘표준연료비’는 ‘(표준이동거리 ÷ 표준연비) × 경유·CNG 단가 × 운행횟수’의 공식으로 계산이 되고, ‘표준이동거리’는 ‘평균 노선운행거리 + 평균 공차거리’의 공식으로 계산이 된다.\n  다. 소외 회계법인은 피고 인천광역시장의 위임에 따라 표준연비제 시행을 위하여 2017. 10. 25. 2016. 4.부터 2017. 3.까지의 노선별·차량별·월별 운행기록을 기초로 노선별 표준연비 및 표준이동거리를 산정하였다. 피고 인천광역시장은 2018. 8. 무렵 원고 등에게 ‘2018. 준공영제 시내버스 표준연비제 시행계획’을 통지하였는데, 그 계획에는 소외 회계법인이 산정한 노선별 표준연비 및 표준이동거리가 포함되어 있었다. \n  라. 피고 인천광역시장은 원고에게, ① 2017. 3. 9. (노선번호 1 생략) 버스 노선을 변경하여 해당 노선의 인가 운행거리를 63.7km에서 58km로 단축하는 내용이 포함된 노선조정 개선명령을, ② 2017. 3. 29. (노선번호 6 생략) 버스 노선을 변경하여 해당 노선의 인가 운행거리를 24.6km에서 23.5km로 단축하는 내용이 포함된 노선조정 개선명령을, ③ 2017. 7. 7. (노선번호 1 생략) 버스 노선을 변경하여 해당 노선의 인가 운행거리를 58km에서 63.7km로 연장하는 내용이 포함된 노선조정 개선명령을, ④ 같은 날 (노선번호 3 생략) 버스 노선을 변경하여 해당 노선의 인가 운행거리를 23km에서 27.8km로 연장하는 내용이 포함된 노선조정 개선명령을, ⑤ 2018. 5. 15. (노선번호 1 생략) 버스 노선을 변경하여 해당 노선의 인가 운행거리를 63.7km에서 67.4km로 연장하는 내용이 포함된 노선조정 개선명령을, ⑥ 2019. 3. 13. (노선번호 2 생략) 버스 노선을 변경하여 해당 노선의 인가 운행거리를 33.1km에서 36.5km로 연장하는 내용이 포함된 노선조정 개선명령을 각각 통보하였다(위 각 개선명령을 각 순번에 따라 이하 ‘이 사건 제○ 개선명령’이라 하고, 모두 합하여 부를 때에는 ‘이 사건 각 개선명령’이라 한다).\n  마. 피고 인천광역시장은 원고 등 버스운송사업자들에게, 2018. 8. 31. ‘표준연비제 시행에 따른 협조 및 제출자료 안내’, 2018. 9. 14. ‘표준연비 조사표 제출 및 신규·변경 노선에 대한 표준연비 적용 기준통보’, 2019. 4. 22. ‘여객자동차 운송사업 개선명령 등에 따른 신규·변경 노선 표준연비 재산정을 위한 자료 제출요청’을 보내는 등의 방법으로 신규 노선과 변경 노선에 대한 표준연비 산정 및 재산정에 필요한 자료제출을 요청하였고, 2019. 11. 18. 표준연비 및 표준이동거리 재조정 요청을 2019. 11. 20.까지 마감한다는 내용의 ‘표준연비 및 표준이동거리 재조정 요청 마감 안내’를 보냈다. 그러나 원고는 요청받은 변경 노선에 관한 자료를 피고 인천광역시장이 제시한 양식에 맞추어 제출하지 않았다. \n  바. 피고 인천광역시장은 2020. 9. 9. 원고에게, 이 사건 제⑤, ⑥ 개선명령에 따라 연장된 인가 운행거리를 반영하지 않은 표준연비 및 표준이동거리에 기초하여 2018. 10. 1.부터 2019. 9. 30.까지의 기간 동안 원고에게 초과지급된 표준연료비를 173,808,910원으로 계산하고, 그 초과지급액을 2020. 9.부터 2020. 12.까지 4개월간 피고 인천광역시가 원고에게 지급하여야 할 재정지원금에서 분할공제하여 정산하는 내용이 포함된 ‘표준연비 연정산 세부계획 통보’를 하였다. \n  사. 피고 인천광역시장은 2021. 4. 26. 원고에게, 이 사건 제⑤, ⑥ 개선명령에 따라 연장된 인가 운행거리를 반영하지 않은 표준연비 및 표준이동거리에 기초하여 2019. 10. 1.부터 2020. 12. 31.까지의 기간 동안 원고에게 초과지급된 표준연료비를 153,749,500원으로 계산하고, 그 초과지급액을 2021. 5.부터 2021. 8.까지 4개월간 피고 인천광역시가 원고에게 지급하여야 할 재정지원금에서 분할공제하여 정산하는 내용이 포함된 ‘표준연비제 2차 표준 연료비 정산 시행계획 알림’ 통보를 하였다(피고 인천광역시장이 원고에게 한 위 각 정산통보를 합쳐 이하 ‘이 사건 각 정산처분’이라 한다).\n  2. 피고 인천광역시장에 대한 제1 상고이유에 관한 판단\n  원심은 이 사건 제①부터 ④까지의 개선명령에 따른 인가 운행거리 등의 변경이 이 사건 각 정산처분에 적용된 표준연비 및 표준이동거리에 적절히 반영되었음을 전제로, 이 사건 각 정산처분 중 이 사건 제①부터 ④까지의 개선명령과 관련된 부분에는 피고 인천광역시장의 재량권의 일탈·남용이 존재하지 않는다고 판단하였다. \n  원심판결의 이유를 관련 법리와 기록에 비추어 보면, 위와 같은 원심의 판단은 정당하고, 상고이유 주장과 같이 재량권 행사에 관한 법리를 오해하거나 재량권 일탈·남용 여부에 관하여 필요한 심리를 다하지 아니한 채 논리와 경험의 법칙을 위반하여 자유심증주의의 한계를 벗어나는 등으로 판결에 영향을 미친 잘못이 없다.\n  3. 피고 인천광역시장에 대한 제2 상고이유에 관한 판단\n  가. 사실오인에 기초한 재량권 일탈·남용의 법리\n재량행위에 대한 법원의 사법심사는 당해 행위가 사실오인, 비례·평등의 원칙 위배, 당해 행위의 목적 위반이나 부정한 동기 등에 근거하여 이루어짐으로써 재량권을 일탈·남용한 위법이 있는지 여부만을 심사하게 되는 것이나, 법원의 심사 결과 행정청의 재량행위가 사실오인 등에 근거한 것이라고 인정된다면 이는 재량권을 일탈·남용한 것으로서 위법하여 그 취소를 면치 못한다(대법원 2001. 7. 27. 선고 99두2970 판결 등 참조). 만약 행정청이 과거 상대방에게 한 특정한 처분으로 인하여 그에게 유리한 사실관계가 형성되었음을 인식하고 있었음에도 이를 반영하지 않은 채 재량권을 행사하였다면, 이는 행정청의 사실오인에 기초한 것으로서 재량권 일탈·남용에 해당하여 위법하다. 행정청이 상대방에게 그와 같은 사실관계에 관한 자료의 제출을 요청하였으나 그가 이를 제대로 이행하지 않은 경우라고 하더라도, 그러한 사정으로 인하여 행정청이 사실오인을 일으켰다는 등의 특별한 사정이 없는 한, 마찬가지라고 할 것이다.\n  나. 원심의 판단\n  원심은, 피고 인천광역시장이 원고에게 이 사건 제⑤, ⑥ 개선명령을 각각 통보한 사실, 피고 인천광역시장이 이 사건 제⑤, ⑥ 개선명령에 따른 (노선번호 1 생략), (노선번호 2 생략) 버스의 각 노선변경 내용을 반영하지 않은 표준연비 및 표준이동거리를 적용하여 이 사건 각 정산처분을 하였던 사실은 당사자 사이에 다툼이 없지만, 원고가 피고 인천광역시장이 제출하라는 자료를 적시에 제대로 제출하지 않았던 사정에 비추어 보면, 이 사건 제⑤, ⑥ 개선명령과 관련된 (노선번호 1 생략), (노선번호 2 생략) 버스의 각 노선변경이 반영되지 않았다고 하더라도 이 사건 각 정산처분에 피고 인천광역시장의 재량권 일탈·남용이 있다고 볼 수 없다고 판단하였다. \n  다. 대법원의 판단\n  그러나 원심의 판단은 그대로 받아들이기 어렵다. 그 이유는 다음과 같다.\n  1) ‘표준이동거리’를 ‘인가 운행거리’와 동일하게 산정하여야 한다고 판단한 원심에 따르면, ‘표준연료비’는 ‘(표준이동거리 ÷ 표준연비) × 경유·CNG 단가 × 운행횟수’의 공식으로 계산되므로, 이 사건 제⑤, ⑥ 개선명령에 따른 ‘인가 운행거리’의 연장은 바로 ‘표준이동거리’와 ‘표준연료비’의 증가로 연결된다. 피고 인천광역시장은 실제 발생한 연료비가 ‘표준연료비’보다 많을 경우 재정지원금에서 초과분을 공제하였고, 실제 발생한 연료비가 ‘표준연료비’보다 적을 경우 차액을 추가로 지급하였는바, ‘표준연료비’의 증가는 이 사건 각 정산처분의 상대방인 원고에게 유리하게 반영되어야 할 사정이다. \n  2) 이 사건 각 개선명령과 이 사건 각 정산처분 관련 업무는 피고 인천광역시 소속 버스정책과가 담당한 것이고, 피고 인천광역시장은 그 명의로 이 사건 각 개선명령을 내렸다. 따라서 피고 인천광역시장은 이 사건 각 정산처분 당시 이 사건 제⑤, ⑥ 개선명령에 따른 (노선번호 1 생략), (노선번호 2 생략) 버스의 각 노선변경을 인식하고 있었다고 보아야 한다.\n  3) 피고 인천광역시장이 ‘표준연료비’를 계산함에 있어 이 사건 제⑤, ⑥ 개선명령으로 인하여 늘어난 ‘인가 운행거리’를 확인하고, 반영하는 데에 특별한 시간이나 노력이 필요한 것으로 보이지 아니한다.\n  4) 비록 원고가 피고 인천광역시장이 요청한 버스 노선변경에 관한 자료를 적시에 제대로 제출하지는 않았던 것으로 보이나, 그러한 사정만으로 피고 인천광역시장이 ‘표준이동거리’ 및 ‘표준연료비’를 산정하면서 이 사건 제⑤, ⑥ 개선명령의 내용을 반영할 수 없었다고 하기도 어렵다. 나아가 원고는 표준이동거리 등 재조정 요청 마감기한인 2019. 11. 20. 이전에 피고 인천광역시장이 요구한 양식에 따른 것은 아니라고 하더라도, 이 사건 제⑤, ⑥ 개선명령에 따라 ‘인가 운행거리’가 연장된다는 사정을 충분히 확인할 수 있는 자료를 제출하기도 하였다.\n  5) 따라서 피고 인천광역시장이 원고에게 이 사건 제⑤, ⑥ 개선명령에 따라 연장된 (노선번호 1 생략), (노선번호 2 생략) 버스 노선의 운행거리를 반영하지 않은 ‘표준이동거리’ 및 ‘표준연료비’를 적용하여 이 사건 각 정산처분을 하였다면, 원심으로서는 이 사건 각 정산처분 중 이 사건 제⑤, ⑥ 개선명령과 관련된 부분은 사실오인에 기초한 것으로서 원칙적으로 재량권 일탈·남용에 해당한다고 보았어야 한다. 만약 원심이 이 사건 각 정산처분에 있어 사실오인으로 인한 재량권 일탈·남용을 인정할 수 없다고 하려면 원고의 이 사건 제⑤, ⑥ 개선명령 관련 자료 미제출 또는 부실제출이 피고 인천광역시장의 (노선번호 1 생략), (노선번호 2 생략) 버스 노선 ‘인가 노선거리’의 연장에 관한 인식에 어떠한 영향을 미쳤는지를 심리하였어야 한다.\n  6) 그럼에도 그에 관한 심리를 하지 않고 곧바로 이 사건 각 정산처분에 있어 피고 인천광역시장의 재량권 일탈·남용을 인정할 수 없다고 판단한 원심판결에는, 사실오인으로 인한 재량권 일탈·남용 등에 관한 법리를 오해하여 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 있다.\n  4. 결론 \n  원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 신숙희(재판장) 노태악(주심) 서경환 노경필"

    "판례내용": "【원고, 상고인】 주식회사 ○○○ (소송대리인 법무법인 뉴탑 담당변호사 노갑식 외 1인)\n【피고, 피상고인】 강원시설단장\n【원심판결】 서울고법 2024. 6. 26. 선고 (춘천)2022누1383 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 준비서면의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사건의 개요 \n  원심판결 이유와 기록에 의하면 다음과 같은 사실을 알 수 있다. \n  가. 원고는 2009. 8. 17. 공군 제△△전투비행단과 사이에, 원고가 □□체력단련장(비행단 내에 있는 골프장을 말한다. 이하 ‘체력단련장’이라 한다)에 전자유도카트시스템을 설치하고 이를 기부채납하는 대가로 원고가 그 전자유도카트시스템을 운영하면서 받는 수익금이 당사자들이 합의한 기초가액(이는 원고가 설치한 전자유도카트시스템의 설치비용 또는 그 감정평가액을 의미한다)에 이르러 더 이상 정산금이 남아 있지 않을 때까지 원고가 위 전자유도카트시스템(이하 ‘이 사건 시설’이라 한다)과 그 부지(이하 ‘이 사건 토지’라 한다)를 무상으로 사용·수익할 수 있다는 내용의 합의(이하 ‘이 사건 합의’라 한다)를 하였다. \n  나. 체력단련장의 시설과 부지에 대한 사용·수익 허가권을 가지는 피고는 원고가 이 사건 시설을 설치하고 기부채납하자, 원고에 대하여 이 사건 시설 및 토지에 대한 사용·수익 허가(이하 ‘이 사건 허가’라 한다)를 하였다. \n  다. 공군 제△△전투비행단장은 2017. 8. 30. 원고에 대하여 원고가 이 사건 시설을 운영하면서 받은 수익금이 이 사건 합의에서 정한 기초가액을 넘어 더 이상 정산금이 남지 않았다고 통보하였다. 피고는 2018. 2. 8. 원고에게 이 사건 시설과 이 사건 토지에 대한 무상사용 허가기간이 2017. 10. 31. 자로 만료되었다고 통보하였고, 2018. 2. 28.부터 원고가 이를 사용하지 못하도록 하였다. \n  라. 원고는 2020. 8. 4. 피고에게 이 사건 시설의 사용료로 정산되어야 할 금액 550,926,569원이 남아 있으므로 원고의 수익금이 위 금액에 이를 때까지인 약 3년 동안 이 사건 시설 및 토지의 무상사용 허가를 신청(이하 ‘이 사건 허가신청’이라 한다)하였다. 이에 피고는 2020. 10. 20. 원고에게 기부채납된 재산에 대한 정산이 2018. 2.경 최종 만료되었고, 모든 절차가 적법하게 진행된 것으로 판단되므로 무상사용 허가신청 대상이 아니라는 취지로 원고의 무상사용 허가신청에 대한 거부처분(이하 ‘이 사건 처분’이라 한다)을 하였다.  \n  2. 상고이유에 대한 판단\n  가. 원심은 국유재산법에 따른 행정재산의 사용허가에는 행정청의 광범위한 재량이 인정된다는 전제 아래 설령 이 사건 합의에서 정한 정산금 채무가 남아 이에 관한 별도의 법률관계가 발생할 수 있다고 하더라도 그 정산금 채무의 존부에 관한 법적 분쟁이 발생할 여지가 있는 이상 피고가 원고에 대하여 새롭게 이 사건 시설 및 토지에 대한 무상사용을 허가하여야 할 의무가 있다거나 피고의 이 사건 처분에 재량권 일탈·남용의 위법이 있다고 볼 수 없다고 판단하였다. \n  나. 그러나 이와 같은 원심의 판단은 다음과 같은 이유에서 수긍하기 어렵다. \n  1) 행정청이 행정재산에 대한 사용허가를 할 것인지는 재량행위로서, 재량행위에 대한 법원의 사법심사는 그 행위가 사실오인, 비례·평등의 원칙 위배, 해당 행위의 목적 위반이나 부정한 동기 등에 근거하여 이루어짐으로써 재량권의 일탈·남용이 있는지 여부만을 심사하게 되는 것이나, 법원의 심사 결과 행정청의 재량행위가 사실오인 등에 근거한 것이라고 인정되는 경우에는 이는 재량권을 일탈·남용한 것으로서 위법하여 취소를 면치 못한다 할 것이다(대법원 2001. 7. 27. 선고 99두8589 판결 등 참조). \n  한편 공법상 계약 체결에 따른 권리를 취득한 상대방이 그러한 권리의 실질적 보장을 위한 방법의 하나로 공법상 계약의 상대방 측인 행정청을 상대로 수익적 행정행위를 신청하였고 그러한 신청이 공법상 계약에 따른 권리·의무의 이행방식에 위배되는 것이 아니라면, 수익적 행정행위 형식으로 공법상 계약의 권리를 실현시키기 어려운 사정변경이 생겼거나 중대한 공익상의 필요가 발생한 경우와 같이 특별한 사정이 없는 이상, 행정청으로서는 수익적 행정행위에 관한 재량권을 공법상 계약에 반하지 않는 범위에서 행사하여야 한다.\n  2) 그렇다면 피고가 이 사건 처분을 할 때 행사할 수 있는 재량의 내용과 범위도 원고에게 이 사건 시설 및 토지를 무상으로 사용허가하기 어려운 사정변경이 생겼거나 중대한 공익상의 필요가 발생한 것이 아닌 이상 공군 제△△전투비행단장을 법적으로 구속하는 원고와의 합의 내용에 따라 정해진다고 할 것이다. 피고 스스로도 이를 전제로 이 사건 합의에서 정한 원고의 정산금이 더 이상 남아 있지 않았다는 점을 이 사건 처분의 처분사유로 삼았고, 그 외에 피고가 이 사건 처분에 이르게 된 재량권 행사 과정에서 다른 요소들을 고려하였다고 볼 만한 사정도 없다. 따라서 이 사건 처분에서 원고의 정산금이 남아 있는 것으로 판단된다면, 이 사건 처분은 사실오인에 근거한 것으로 재량권 일탈·남용의 위법이 있다고 보아야 하므로, 원심으로서는 원고의 정산금이 남아 있는지를 심리하였어야 했다. \n  3) 그럼에도 원심은 이 사건 처분에 관하여 피고에게 광범위한 재량권이 있다는 이유만으로 피고가 이 사건 처분에서 제시한 처분사유에 사실오인의 위법이 있는지를 심리하지 않은 채 만연히 이 사건 처분에 재량권 일탈·남용의 위법이 없다고 판단하였다. \n  다. 이와 같은 원심의 판단에는 재량행위의 처분사유 존부에 관하여 필요한 심리를 다하지 아니한 잘못이 있다. 이 점을 지적하는 원고의 상고이유는 이유 있다. \n  3. 결론\n  그러므로 원심판결을 파기하고 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 엄상필(재판장) 이흥구(주심) 오석준 이숙연"
  },

    "판결요지": "도시 및 주거환경정비법(이하 ‘도시정비법’이라 한다)상 재건축사업이나 재개발사업의 사업시행자가 조합인 경우 조합과 토지 등 소유자 사이에 조합원 지위에 관하여 분쟁이 발생하면 토지 등 소유자는 조합을 상대로 공법상의 당사자소송에 의하여 조합원 자격의 확인을 구할 수 있다. 이에 반해 도시정비법상 재개발사업이나 재건축사업의 사업시행자가 도시정비법 제27조 제1항에 따른 신탁업자인 경우에는 사업시행을 위한 조합이 설립되지 않으므로 조합원의 지위가 예정되어 있지 않으나, 도시정비법 제39조 제1항은 재개발사업 또는 재건축사업의 사업시행자가 신탁업자인 경우에는 위탁자가 앞서 본 조합원에 해당한다고 규정하고 있다. \n  따라서 도시정비법 제27조 제1항에 따라 신탁업자가 사업시행자인 재개발사업 또는 재건축사업에서 신탁업자와 토지 등 소유자 사이에 ‘위탁자’의 지위에 관한 분쟁이 발생하는 경우, 토지 등 소유자는 사업시행자인 신탁업자를 상대로 마찬가지로 공법상 당사자소송에 의하여 앞서 본 ‘조합원’ 개념에 대응되는 ‘위탁자’ 지위의 확인을 구하는 소를 제기할 수 있다고 보아야 한다.",
    "참조조문": "도시 및 주거환경정비법 제25조 제2항, 제27조 제1항, 제39조 제1항, 행정소송법 제3조 제2호",
    "참조판례": "대법원 1996. 2. 15. 선고 94다31235 전원합의체 판결(공1996상, 768)",
    "판례내용": "【원고, 피상고인】 원고 1 외 6인 (소송대리인 법무법인 율맥 담당변호사 심창주)\n【피고, 상고인】 ○○○신탁 주식회사 (소송대리인 변호사 김조영 외 1인)\n【원심판결】 서울고법 2024. 7. 25. 선고 2023누52934 판결\n【주    문】\n  상고를 모두 기각한다.  상고비용은 피고가 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 위탁자 지위의 확인을 구하는 소송형태에 관한 판단 \n  가. 「도시 및 주거환경정비법」(이하 ‘도시정비법’이라 한다) 제25조 제2항은 재개발사업 또는 재건축사업을 조합이 시행하는 것을 원칙으로 하면서 제27조 제1항 각호의 어느 하나에 해당하는 때에는 「사회기반시설에 대한 민간투자법」 제2조 제12호에 따른 민관합동법인 또는 신탁업자로서 대통령령으로 정하는 요건을 갖춘 자를 사업시행자로 지정하여 정비사업을 시행할 수 있도록 하고 있다. \n  나. 도시정비법상 재건축사업이나 재개발사업의 사업시행자가 조합인 경우 조합과 토지 등 소유자 사이에 조합원 지위에 관하여 분쟁이 발생하면 토지 등 소유자는 조합을 상대로 공법상의 당사자소송에 의하여 그 조합원 자격의 확인을 구할 수 있다(대법원 1996. 2. 15. 선고 94다31235 전원합의체 판결 등 참조). 이에 반해 도시정비법상 재개발사업이나 재건축사업의 사업시행자가 도시정비법 제27조 제1항에 따른 신탁업자인 경우에는 사업시행을 위한 조합이 설립되지 않으므로 조합원의 지위가 예정되어 있지 않으나, 도시정비법 제39조 제1항은 재개발사업 또는 재건축사업의 사업시행자가 신탁업자인 경우에는 위탁자가 앞서 본 조합원에 해당한다고 규정하고 있다.  \n따라서 도시정비법 제27조 제1항에 따라 신탁업자가 사업시행자인 재개발사업 또는 재건축사업에서 신탁업자와 토지 등 소유자 사이에 ‘위탁자’의 지위에 관한 분쟁이 발생하는 경우, 토지 등 소유자는 사업시행자인 신탁업자를 상대로 마찬가지로 공법상 당사자소송에 의하여 앞서 본 ‘조합원’ 개념에 대응되는 ‘위탁자’ 지위의 확인을 구하는 소를 제기할 수 있다고 보아야 한다. \n  다. 피고는 도시정비법 제2조 제9호에서 신탁업자가 사업시행자로 지정된 경우 ‘토지 등 소유자가 정비사업을 목적으로 신탁업자에게 신탁한 토지 또는 건축물에 대하여는 위탁자를 토지 등 소유자로 본다.’고 규정하고 있음을 근거로 토지 등 소유자가 토지 또는 건축물을 신탁업자에게 실제 신탁하지 않은 이상 그 토지 등 소유자를 ‘위탁자’의 지위에 있다고 볼 수 없다고 주장한다. \n  그러나 도시정비법 제2조 제9호의 위 규정은 도시정비법상 ‘토지 등 소유자’의 개념이 정비구역에 위치한 토지 또는 건축물의 소유자를 의미하는데, 신탁업자가 사업시행자로 지정되어 토지 등 소유자가 토지 또는 건축물에 관하여 수탁자 앞으로 신탁을 원인으로 한 소유권이전등기를 마치게 되면 대내외적으로 소유권이 수탁자에게 완전히 이전되므로(대법원 2002. 4. 12. 선고 2000다70460 판결 등 참조), 신탁을 원인으로 한 소유권이전등기에도 불구하고 여전히 위탁자가 도시정비법상 토지 등 소유자의 지위를 갖는다는 것을 확인하는 규정으로 해석된다. \n  또한 도시정비법 제39조 제1항은 재건축사업 또는 재개발사업의 사업시행자가 신탁업자인 경우 위탁자는 토지 등 소유자로 한다고 규정하고 있어서 위탁자의 지위가 반드시 신탁업자와 신탁계약을 체결하였다거나 신탁을 원인으로 한 소유권이전등기를 마친 토지 등 소유자로 제한하고 있지 않다. 원고들이 피고와 신탁계약을 체결하였거나 신탁을 원인으로 한 소유권이전등기를 마치지 않은 이상 위탁자 지위의 확인을 구할 수 없다는 취지의 피고의 주장은 받아들일 수 없다.\n  라. 이와 같은 원심의 판단은 정당하고, 거기에 상고이유 주장과 같이 도시정비법상 위탁자 개념에 관한 법리를 오해하는 등의 잘못이 없다. \n  2. 원심의 구분소유권 인정에 관한 판단 \n  원심은 그 채택 증거를 종합하여 판시와 같은 사실을 인정한 다음, 이 사건 상가를 구성하는 6개 점포에 대하여 해당 점포가 개별적으로 매매가 이루어지기 시작한 1984년경부터 구조상·이용상 독립성을 갖추고 구분소유권의 객체로 하려는 구분행위도 있었다고 볼 수 있다는 이유로 그 무렵부터 그 개별 점포를 구분소유권의 대상으로 하는 구분소유가 성립하였다고 판단하였다. \n  관련 법리와 기록에 비추어 살펴보면, 이와 같은 원심의 판단은 정당하고, 거기에 상고이유 주장과 같이 구분소유권 성립에 관한 심리미진의 잘못이 있다고 볼 수 없다. \n  3. 분양신청권과 형평성에 관한 판단 \n  원심은, 「서울특별시 도시 및 주거환경정비 조례」가 다가구주택이 다세대주택으로 전환되어 구분등기가 된 경우 분양대상자를 제한하고 있다고 하나, 다가구주택에 관한 건축법 규정의 내용이나 취지 및 범위는 이 사건 상가에 적용되는 「집합건물의 소유 및 관리에 관한 법률」에서 구분소유를 인정하는 요건이나 그 효과, 입법 취지와 국면을 달리하므로, 이 사건 상가에 관하여 구분소유적 공유관계를 유지하던 원고들에게 복수의 위탁자의 지위를 인정할 것인지를 판단하면서 다가구주택과의 형평성을 고려하여야 한다고 볼 수 없다고 판단하였다. \n  관련 법리와 기록에 비추어 살펴보면, 이와 같은 원심의 판단은 정당하고 거기에 상고이유 주장과 같이 다가구주택에서 분양대상자와의 형평성에 관한 법리를 오해한 잘못이 없다. \n  4. 결론\n  상고를 기각하고, 상고비용은 패소자가 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 노태악(재판장) 서경환 신숙희(주심) 노경필"
  },

    "판결요지": "사립학교법 제53조의2 제7항 전문에서 재임용 심의사유를 학칙이 정하는 객관적인 사유에 근거하도록 규정한 취지는, 대학교원으로서의 재임용 자격 내지 적격성 유무가 임용권자의 자의가 아니라 학생교육에 관한 사항, 학문연구에 관한 사항과 학생지도에 관한 사항에 대한 평가 등 객관적인 사유에 의하여 심의되어야 할 뿐만 아니라, 해당 교원에게 사전에 심사방법의 예측가능성을 제공하고 사후에는 재임용 거부결정이 합리적인 기준에 의하여 공정하게 이루어졌는지를 심사할 수 있도록 재임용 심사기준이 사전에 객관적인 규정으로 마련되어 있어야 함을 요구하는 것으로 보아야 한다.\n  사립대학 교원에 대한 재임용 거부의 객관적 사유, 즉 재임용 심사기준에 미달된다는 사유가 전혀 존재하지 않거나 그 사유가 존재한다 하더라도 교원으로서의 능력과 자질을 검증하여 적격성 유무를 심사하기 위한 재임용 심사에서의 재량권을 일탈·남용한 결과 합리적인 기준에 기초한 공정한 심사가 결여된 것으로 인정되어 그 사법상의 효력 자체를 부정하는 것이 사회통념상 타당하다고 인정될 경우에는 그 재임용 거부결정은 무효라고 볼 수 있다. 재량권의 일탈·남용으로 인한 재임용 거부결정의 무효 사유에 관하여는 이를 주장하는 사람이 증명책임을 부담한다.",

    "판례내용": "【원고, 피상고인】 원고\n【피고, 상고인】 교원소청심사위원회 (소송대리인 정부법무공단 담당변호사 김재학 외 3인)\n【피고보조참가인, 상고인】 학교법인 ○○○학원 (소송대리인 법무법인(유한) 바른 담당변호사 신은령 외 1인)\n【원심판결】 서울고법 2024. 8. 29. 선고 2023누56813 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  피고와 피고보조참가인의 상고이유를 함께 판단한다.\n  1. 사안의 개요 \n  원심이 인정한 사실관계는 다음과 같다.\n  가. 피고보조참가인(이하 ‘참가인’이라 한다)은 ○○○대학교를 설립하여 운영하는 학교법인이다. 원고는 2007. 3. 1. ○○○대학교△△전공 전임강사로 신규 임용된 후 조교수를 거쳐 2015. 4. 1. 부교수로 승진 임용되었다. 원고의 임용기간 만료일은 2022. 2. 28.이다.\n  나. 참가인은 2021. 12. 8. ○○○대학교□□교정 교원인사위원회(이하 ‘교원인사위원회’라 한다)를 개최하여, 원고의 연구업적이 일반전임교수 재임용을 위한 필수학술논문 발표기준인 ‘단독논문을 기준으로 국내 A급 이상 7편’ 중 6편이 부족하여 재임용에 부적합한 것으로 심의하였다.\n  다. 교원인사위원회는 2021. 12. 9. 원고에 대하여 필수연구업적 미충족으로 재임용이 거부되는 것으로 의결하였다. ○○○대학교 총장은 2021. 12. 17. 참가인에게 원고에 대한 재임용 거부안을 제청하였다. 참가인은 2021. 12. 20. 이사회를 개최하여 원고의 재임용을 거부하기로 의결한 후 같은 날 원고에게 재임용 거부를 통지하였다(이하 ‘이 사건 재임용 거부통지’라 한다).\n  라. 원고는 2021. 12.경 2편의 논문[①논문: (논문명 1 생략), ②논문: (논문명 2 생략)]을 국내 등재학술지에 게재하고, 2022. 1.경 교무처에 그 논문 별쇄본을 제출하였다.\n  마. 원고는 이 사건 재임용 거부통지 당시 필수학술논문 발표기준에 부족했던 6편의 논문 중 별쇄본으로 제출한 2편(①논문, ②논문)을 제외한 나머지 4편의 논문[③논문: (논문명 3 생략), ④논문: (논문명 4 생략), ⑤논문: (논문명 5 생략), ⑥논문: (논문명 6 생략)]에 관하여, 2022. 2. 28. 게재예정증명서(논문 발간 예정일 모두 2022. 2. 28. 자임)를 발급받아 교무처에 제출하였다.\n  4편의 논문은 한국연구재단 등재학술지에 게재되었는데, ③논문은 2022. 2. 28. 18:21:50경, ④논문은 2022. 3. 21. 09:39:26경, ⑤논문은 2022. 3. 12. 15:14:02경, ⑥논문은 2022. 3. 11. 14:16:24경 한국학술지인용색인(Korea Citation Index, 이하 ‘KCI’라 한다)에 최초로 등록되어 통합검색 등 온라인으로 확인할 수 있는 상태가 되었다.\n  바. 교무처장은 2022. 2. 28. △△과 학과장을 통해 원고에게 ‘재임용에서 탈락되었다.’는 취지로 안내하고, 2022. 3. 3. 원고에 대하여 ‘2022. 2. 28.까지 4편의 논문에 관한 별쇄본이 제출되지 않았고, 2022. 3. 2. KCI 사이트에서 검색되는 논문이 1편(③논문)에 불과하다.’는 이유로, ○○○대학교 교원인사규정(이하 ‘교원인사규정’이라 한다) 제38조에 근거하여 최종적으로 퇴직 처리하였다.\n  사. 원고는 2022. 3. 30. 피고에게 이 사건 재임용 거부처분의 취소를 구하는 소청심사를 청구하였다(이하 ‘이 사건 소청심사 청구’라 한다). 피고는 2022. 7. 6. 원고가 임용기간 만료일까지 4편의 논문에 대한 게재예정증명서만을 제출하였을 뿐 교원인사규정 제38조 제3호에서 규정한 ‘임용기간 내 원본을 제출하는 조건’을 충족하지 못하여 이 사건 재임용 거부처분이 적법하다는 이유로 이 사건 소청심사 청구를 기각하였다(이하 ‘이 사건 결정’이라 한다).\n  2. 원심 판단\n  원심은 판시와 같은 이유로, 원고가 재임용 심사를 위한 필수학술논문 발표기준을 충족시켰다고 볼 수 없고, 그 판단의 근거가 되는 연구실적물의 인정기간에 관한 교원인사규정 제38조 제3호가 무효라고 볼 수도 없다고 판단하면서도, 참가인이 원고에 대한 재임용 심사과정에서 원고의 연구업적을 적정하게 반영하기 위하여 합리적인 기준에 따른 공정한 심사를 거치지 않은 채 이 사건 재임용 거부통지를 하여 재량권을 일탈·남용하였으므로 이와 다른 전제에서 이 사건 소청심사 청구를 기각한 이 사건 결정은 위법하다고 판단하였다.\n  3. 대법원 판단 \n  가. 관련 규정과 법리\n사립학교법 제53조의2 제7항은 교원인사위원회가 사립학교 교원의 재임용 여부를 심의할 때에는 학문연구에 관한 사항에 대한 평가(제2호) 등 객관적인 사유로서 학칙에서 정하는 사유에 근거하여야 한다고 규정하고 있다. 이 조항의 위임에 따른 학칙인 교원인사규정 제34조 제1항, 제29조 제4항 및 「□□교정 교원인사규정 시행세칙」 제2조 제1항 [별표 1-2-3]은 재임용 대상 교원의 심사기준 중 하나인 ‘연구업적’의 요소로서 ‘필수논문충족’을 명시하면서 일반전임교수의 경우 필수학술논문 발표기준으로 ‘단독논문을 기준으로 국내 A급 이상 7편’을 규정하고 있다. 교원인사규정 제38조 제3호는 재임용 등 심사 대상이 되는 연구실적물의 인정기간에 관하여 ‘승진 및 재임용 대상자의 논문 인정기간은 임용기간 내 발표된 논문에 한하여 인정한다. 단, 게재 예정인 논문의 경우는 게재 확정일이 임용기간 이내임을 입증할 수 있는 게재예정증명서를 교수업적평가위원회에 제출하여야 하며 임용기간 내 원본을 제출하는 조건으로 인정한다.’고 규정하고 있다.\n사립학교법 제53조의2 제7항 전문에서 재임용 심의사유를 학칙이 정하는 객관적인 사유에 근거하도록 규정한 취지는, 대학교원으로서의 재임용 자격 내지 적격성 유무가 임용권자의 자의가 아니라 학생교육에 관한 사항, 학문연구에 관한 사항과 학생지도에 관한 사항에 대한 평가 등 객관적인 사유에 의하여 심의되어야 할 뿐만 아니라, 해당 교원에게 사전에 심사방법의 예측가능성을 제공하고 사후에는 재임용 거부결정이 합리적인 기준에 의하여 공정하게 이루어졌는지를 심사할 수 있도록 재임용 심사기준이 사전에 객관적인 규정으로 마련되어 있어야 함을 요구하는 것으로 보아야 한다(대법원 2011. 1. 13. 선고 2010두1835 판결 등 참조).\n사립대학 교원에 대한 재임용 거부의 객관적 사유, 즉 재임용 심사기준에 미달된다는 사유가 전혀 존재하지 않거나 그 사유가 존재한다 하더라도 교원으로서의 능력과 자질을 검증하여 적격성 유무를 심사하기 위한 재임용 심사에서의 재량권을 일탈·남용한 결과 합리적인 기준에 기초한 공정한 심사가 결여된 것으로 인정되어 그 사법상의 효력 자체를 부정하는 것이 사회통념상 타당하다고 인정될 경우에는 그 재임용 거부결정은 무효라고 볼 수 있다(대법원 2013. 3. 14. 선고 2012두13498 판결 참조). 재량권의 일탈·남용으로 인한 재임용 거부결정의 무효 사유에 관하여는 이를 주장하는 사람이 증명책임을 부담한다(대법원 2010. 10. 14. 선고 2008두2231 판결 참조).\n  나. 이 사건의 판단\n  원심판결 이유와 기록에 의하여 알 수 있는 다음과 같은 사정을 관련 법리에 비추어 살펴보면, ○○○대학교 학칙인 교원인사규정 제38조 제3호는 사립학교법 제53조의2 제7항의 위임에 따라 규정된 것으로서 그 내용이 법령에 위배되거나 학교교육의 본질에 반하는 등의 특별한 사정이 없으므로, 재임용 심사에서 대학교원으로서의 재임용 자격 내지 적격성 유무를 판단하는 데 구속력을 가진다. 원고에 대한 이 사건 재임용 심사 및 거부통지가 사립학교법 제53조의2 제7항 및 교원인사규정 제38조 제3호 등에 근거하여 이루어진 이상 합리적인 기준에 기초한 공정한 심사가 결여되어 재임용 심사에서의 재량권을 일탈·남용한 것이라고 보기 어렵다.\n  1) 대학의 자율성 및 학교교육의 성질에 관하여 규정한 헌법조항과 교육에 대하여 규정하고 있는 관계 법령의 내용 등을 종합하여 볼 때, 사립대학의 학칙은 그 내용이 법령에 위배되거나 학교교육의 본질에 반하는 등의 특별한 사정이 없는 한 구속력을 가진다(대법원 1998. 11. 10. 선고 96다37268 판결 참조). ○○○대학교 학칙인 교원인사규정 제34조 제1항, 제29조 제4항, 제38조 제3호 및 「□□교정 교원인사규정 시행세칙」 제2조 제1항, [별표 1-2-3]에 따르면, 교원인사위원회는 교원의 재임용 여부를 심의할 때 학문연구에 관한 사항으로서 필수학술논문 발표기준인 ‘단독논문을 기준으로 국내 A급 이상 7편’을 충족하였는지를 객관적인 사유로 삼아야 한다. 다만 게재 예정인 논문의 경우 임용기간 내에 그 원본까지 제출되어야 심사 대상인 연구실적물로 인정된다. \n  2) 교원인사규정 등에서 필수학술논문 발표기준을 심사 요소로 삼는 것은 국내 A급 이상 학술지에 등재된 논문의 경우 발간 주체인 학술단체 등에서 해당 논문의 학술적 가치, 중복·표절 여부 등에 대해 사전 심사하여 게재를 허가한다는 점을 고려한 것이다. 교원인사규정 등에서 원고에게 약 7년의 임용기간 중 최소 7건의 논문을 게재하도록 요구한 것이 과다하다고 볼 수도 없다. 나아가 재임용 대상 교원이 임용기간 내 필수학술논문 발표기준을 충족하였는지 여부는 사립학교법이 정한 재임용 심사기준 중 하나인 ‘학문연구에 관한 사항’으로서 연구실적을 평가하기 위한 기본적이고 핵심적인 요소일 뿐만 아니라, 학생들의 건전한 지식과 인격의 신장을 목표로 하여 학문연구 결과 등을 전수하고 그들을 지도하며 가르치는 대학교육의 본질과 이러한 대학교육을 담당하는 교원의 역할에 부합하는 심사 요소이다. \n  3) 교원인사규정 제38조 제3호에 따르면 해당 논문이 재임용 심사 대상인 연구실적물로 인정받기 위해서는 적어도 임용기간 만료일까지 그 원본이 제출되어야 한다. 교원의 재임용 여부를 심사하는 임용권자 또는 교원인사위원회로서는 원고가 재임용기간 만료일에 제출한 게재예정증명서만으로 구체적인 논문의 내용을 알 수 없을 뿐만 아니라, 만약 교원인사위원회 등이 게재가 확정되지 않은 논문 초안만으로 심사를 실시한다면 교원인사규정 제38조 제3호에서 정한 인정기간에 발표되지 않은 논문을 심사 대상인 연구실적물로 인정하는 것이어서 그 자체로 심사의 공정성을 저해하게 될 여지가 크다.\n  4) 원고는 교원인사규정 등에서 정한 필수학술논문 발표기준인 ‘단독논문을 기준으로 국내 A급 이상 7편’ 중 4편의 논문에 관하여 임용기간 만료일까지 게재예정증명서만 제출하였을 뿐 게재가 확정된 논문의 원본을 제출하지 못하여 연구실적에 관한 심사기준을 충족하지 못하였다. 그에 따라 원고는 이 사건 재임용 심사과정에서 4편의 논문 내용에 대해서는 학술적 가치 등을 심사받을 수 있는 기회를 제공받지 못하게 되었는데, 이는 교원인사위원회 등이 그러한 기회를 부여하지 않았기 때문이 아니라 원고가 임용기간 만료일에서야 논문의 구체적인 내용을 알 수 없는 게재예정증명서만 교무처에 제출하였기 때문이다.\n  5) 특별한 사정이 없는 한 사립학교 교원은 임용기간의 만료로 교원의 신분을 당연히 상실하게 되므로(대법원 2010. 7. 29. 선고 2007다42433 판결 등 참조), 비록 원고가 임용기간 만료일 이후에 필수학술논문 발표기준을 충족하였다고 하더라도 그러한 사정은 이 사건 재임용 심사에서 고려할 수 없다.\n  그럼에도 원심은 그 판시와 같은 사정만으로 이 사건 재임용 거부통지가 합리적 기준에 따른 공정한 심사를 거치지 않은 것이어서 재량권을 일탈·남용한 것이라고 판단하였다. 이러한 원심판결에는 사립학교법 제53조의2 제7항 및 교원인사규정 제38조 제3호 등에서 정한 재임용 대상 교원의 심사기준에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 상고이유 주장은 이유 있다.\n  4. 결론\n  원심판결을 파기하고 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.  \n\n대법관 서경환(재판장) 노태악 신숙희 노경필(주심)"

    "판시사항": "보조금의 교부결정이 취소된 경우 보조금의 반환에 관하여 2013. 7. 16. 개정된 구 지방재정법 제17조의2 제2항이 시행되기 전에 甲 군수가 들뫼꽃 재배 등을 목적으로 설립된 乙 단체에 임산물생산기반시설 지원사업 보조금을 지급했다가 乙 단체가 부정한 방법으로 보조금을 수령했다는 이유로 위 개정규정이 시행된 이후에 보조금 교부결정을 취소하고 지급한 보조금을 환수하는 처분을 한 사안에서, 지방재정법 부칙(2013. 7. 16.) 제2조 제1항이 개정규정 시행 후 최초로 교부결정이 ‘취소’되는 보조금부터 적용한다고 명확하게 규정하고 있음에도, 문언에 반하여 이를 개정규정이 시행된 이후에 ‘교부’된 보조금에 한하여 적용하는 것임을 전제로 환수처분 중 이자 부분이 위법하다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례",
    "판결요지": "보조금의 교부결정이 취소된 경우 보조금의 반환에 관하여 2013. 7. 16. 법률 제11900호로 개정된 구 지방재정법 제17조의2 제2항(이하 ‘개정규정’이라 한다)이 시행되기 전에 甲 군수가 들뫼꽃 재배 등을 목적으로 설립된 乙 단체에 임산물생산기반시설 지원사업 보조금을 지급했다가 乙 단체가 부정한 방법으로 보조금을 수령했다는 이유로 위 개정규정이 시행된 이후에 보조금 교부결정을 취소하고 지급한 보조금을 환수하는 처분을 한 사안에서, 지방재정법 부칙(2013. 7. 16.) 제2조 제1항(이하 ‘부칙조항’이라 한다)은 개정규정 시행 후 최초로 교부결정이 ‘취소’되는 보조금부터 적용한다고 명확하게 규정하고 있고, 법률 문언이 다의적이거나 불명확하다고 볼 수 없어 문언에 따라 해석해야 하는 점, 행정처분은 처분 당시의 법령이 적용되는 것이 원칙이고, 甲 군수는 환수처분 당시에 시행된 부칙조항과 개정규정에 따라 이자에 대한 환수처분을 하였으므로, 행정법규 불소급 원칙에 반한다고 볼 수도 없는 점, 보조금 교부결정이 취소되면 취소의 소급효에 따라 이미 교부받은 보조금은 법률상 원인 없이 받은 이익이 되어 부당이득 반환의 대상이 되고, 악의의 수익자는 부당이득으로 반환해야 할 원금에 이자를 붙여 반환하는 것이 원칙인 점, 부칙조항과 개정규정은 보조금 교부결정의 취소에 따른 보조금 정산이 개정규정 시행 이후 이루어지는 경우에는 이자 반납을 의무화하도록 명확하게 하기 위해 마련된 것으로, 지방세 징수의 예에 따라 징수하도록 개정되었다고 해서 국민의 권리·의무에 중대한 불이익이 발생한다거나 법적 안정성을 침해한다고 보기 어려운 점을 종합하면, 부칙조항의 문언에 반하여 이를 개정규정이 시행된 이후에 ‘교부’된 보조금에 한하여 적용하는 것임을 전제로 환수처분 중 이자 부분이 위법하다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례.",
    "참조조문": "구 지방재정법(2014. 5. 28. 법률 제12687호로 개정되기 전의 것) 제17조의2 제1항 제3호(현행 지방자치단체 보조금 관리에 관한 법률 제12조 제1항 제3호 참조), 제2항(현행 지방자치단체 보조금 관리에 관한 법률 제31조 제1항 참조), 제4항(현행 지방자치단체 보조금 관리에 관한 법률 제36조 참조), 지방재정법 부칙(2013. 7. 16.) 제2조 제1항",
    "참조판례": "",
    "판례내용": "【원고, 피상고인 겸 상고인】 ○○○ (소송대리인 변호사 조창학)\n【피고, 상고인 겸 피상고인】 영양군수 (소송대리인 변호사 신용길)\n【원심판결】 대구고법 2022. 5. 13. 선고 2021누4114 판결\n【주    문】\n  원심판결 중 피고 패소 부분을 파기하고, 이 부분 사건을 대구고등법원에 환송한다.  원고의 상고를 기각한다.\n\n【이    유】  1. 원고의 상고이유에 대하여\n  원심은 판시와 같은 이유로 이 사건 보조금에 관한 피고의 원고에 대한 환수권의 소멸시효 기산일은 이 사건 취소처분의 처분일인 ‘2020. 4. 22.’이라고 할 것이므로, 그로부터 5년의 소멸시효 기간 내에 이루어진 이 사건 환수처분은 적법하다고 판단하였다.\n  관련 법리와 기록에 비추어 살펴보면, 이러한 원심의 판단에 상고이유 주장과 같이 소멸시효 기산점에 관한 법리를 오해하는 등의 잘못이 없다.\n  2. 피고의 상고이유에 대하여\n  가. 관련 규정 및 쟁점\n  1) 2013. 7. 16. 법률 제11900호로 개정된 구 지방재정법(2014. 5. 28. 법률 제12687호로 개정되기 전의 것, 이하 ‘구 지방재정법’이라 한다) 제17조의2 제1항은 \"지방자치단체의 장은 제17조 제1항에 따른 보조금을 교부받아 보조사업을 수행하는 자가 다음 각호의 어느 하나에 해당하는 경우에는 보조금 교부결정의 전부 또는 일부를 취소할 수 있다.\"라고 규정하면서 제3호에서 ‘거짓 신청이나 그 밖의 부정한 방법으로 보조금을 교부받은 경우’를 규정하고 있다. 나아가 같은 조 제2항은 \"지방자치단체의 장은 보조금의 교부결정을 취소한 경우에 그 취소된 부분의 보조사업에 대하여 이미 보조금이 교부되었을 때에는 기한을 정하여 그 취소된 부분에 해당하는 보조금과 이로 인하여 발생한 이자의 반환을 명하여야 한다.\"라고 규정하고(이하 ‘이 사건 개정규정’이라 한다), 같은 조 제4항은 \"지방자치단체의 장은 제2항 또는 제3항에 따라 보조사업자가 반환하여야 할 보조금을 지방세 징수의 예에 따라 징수할 수 있다. 이 경우 반환금 징수는 국세와 지방세를 제외하고는 다른 공과금에 우선한다.\"라고 규정하고 있다. 한편 지방재정법 부칙(2013. 7. 16. 제11900호) 제2조 제1항은 \"제17조의2 제2항의 개정규정은 같은 개정규정 시행 후 최초로 교부결정이 취소되는 보조금부터 적용한다.\"라고 규정하고 있다(이하 ‘이 사건 부칙조항’이라 한다).\n  2) 이 부분 쟁점은 이 사건 개정규정이 시행되기 전에 피고가 원고에게 교부한 이 사건 보조금에 대하여 이 사건 개정규정이 시행된 이후에 교부결정을 취소하고 이 사건 환수처분을 하면서 이 사건 부칙조항과 이 사건 개정규정을 적용하여 이자의 반환을 명한 부분이 위법한지 여부이다.\n  나. 원심의 판단\n  원심은, 침익적 행정처분 근거 규정에 대한 엄격해석의 원칙과 행정법규 불소급의 원칙 등에 따라 이 사건 부칙조항은 이 사건 개정규정이 시행된 이후에 ‘교부’된 보조금에 한하여 적용되기 때문에 이 사건 개정규정이 시행되기 전에 교부된 이 사건 보조금을 환수하는 경우에는 적용될 수 없다는 이유로, 이 사건 환수처분 중 이자 부분은 법령상 근거가 없어 위법하다고 보아 그 취소를 구하는 원고의 주장을 받아들였다.\n  다. 대법원의 판단\n  1) 원심의 위와 같은 판단은 아래와 같은 이유로 수긍하기 어렵다.\n  가) 거짓·부정을 이유로 하는 보조금 환수는 침익적 행정처분이고, 침익적 행정처분의 근거가 되는 행정법규는 엄격하게 해석·적용하여야 하며, 그 의미가 불명확한 경우 행정처분의 상대방에게 불리한 방향으로 해석·적용하여서는 아니 되나(대법원 2019. 2. 21. 선고 2014두12697 전원합의체 판결 등 참조), 그 의미가 명확하다면 그 문언에 따라 해석·적용하여야 하는 것이 원칙이다. 그런데 이 사건 부칙조항은 이 사건 개정규정 시행 후 최초로 교부결정이 ‘취소’되는 보조금부터 적용한다고 명확하게 규정하고 있고, 법률 문언이 다의적이거나 불명확하다고 볼 수 없어 그 문언에 따라 해석하여야 한다.\n  나) 행정처분은 처분 당시의 법령이 적용되는 것이 원칙이고(대법원 2001. 3. 15. 선고 99두4594 전원합의체 판결 등 참조), 피고는 이 사건 환수처분 당시에 시행된 이 사건 부칙조항과 이 사건 개정규정에 따라 이자에 대한 환수처분을 하였으므로, 행정법규 불소급 원칙에 반한다고 볼 수도 없다.\n  다) 보조금 교부결정이 취소되면 취소의 소급효에 따라 이미 교부받은 보조금은 법률상 원인 없이 받은 이익이 되어 부당이득 반환의 대상이 되고, 악의의 수익자는 부당이득으로 반환해야 할 원금에 이자를 붙여 반환하는 것이 원칙이다.\n  라) 이러한 보조금 교부결정 취소처분의 소급효와 보조금 환수의 실질이 부당이득 반환이라는 점에 비추어 보면, 이 사건 부칙조항과 이 사건 개정규정은 보조금 교부결정의 취소에 따른 보조금 정산이 이 사건 개정규정 시행 이후 이루어지는 경우에는 이자 반납을 의무화하도록 명확하게 하기 위해 마련된 것으로, 지방세 징수의 예에 따라 징수하도록 개정되었다고 해서 국민의 권리·의무에 중대한 불이익이 발생한다거나 법적 안정성을 침해한다고 보기 어렵다.\n  2) 그런데도 원심은 이 사건 부칙조항의 문언에 반하여 이 사건 부칙조항을 이 사건 개정규정이 시행된 이후에 ‘교부’된 보조금에 한하여 적용하는 것임을 전제로 이 사건 환수처분 중 이자 부분이 위법하다고 판단하였다. 이러한 원심판단에는 이 사건 부칙조항과 이 사건 개정규정의 해석·적용에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 피고의 상고이유는 이유 있다.\n  3. 결론\n  원심판결 중 피고 패소 부분을 파기하고, 이 부분 사건을 다시 심리·판단하도록 원심법원에 환송하며, 원고의 상고를 기각하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오경미(재판장) 권영준 박영재(주심)"
  },

    "판시사항": "甲 농수산물도매시장의 청과부류 도매시장법인인 乙 주식회사 등이 ‘서울특별시 농수산물도매시장 조례 시행규칙’ 제59조 제1항 [별표 11] 중 거래금액의 일정비율로 징수하는 위탁수수료와 함께 품목, 규격 및 중량별로 구분하여 일정액을 추가 징수할 수 있는 위탁수수료의 징수한도를 정하고 비고 제2항에서 ‘위탁수수료 한도가 정해지지 않은 품목(품종)은 유사 품목(품종) 및 규격의 위탁수수료 한도를 준용’한다고 정한 부분의 무효확인을 구하는 소를 제기한 사안에서, 위 조례 시행규칙 제59조 제1항 및 [별표 11]에서 甲 시장의 청과부류 도매시장법인에 대한 위탁수수료의 최고한도를 규정한 부분이 명확성 원칙에 위반되어 무효라고 본 원심판단에 법리오해의 잘못이 있다고 한 사례",
    "판결요지": "甲 농수산물도매시장의 청과부류 도매시장법인인 乙 주식회사 등이 ‘서울특별시 농수산물도매시장 조례 시행규칙’ 제59조 제1항 [별표 11] 중 거래금액의 일정비율로 징수하는 위탁수수료(정률수수료)와 함께 품목, 규격 및 중량별로 구분하여 일정액을 추가 징수할 수 있는 위탁수수료(정액수수료)의 징수한도를 정하고 비고 제2항에서 ‘위탁수수료 한도가 정해지지 않은 품목(품종)은 유사 품목(품종) 및 규격의 위탁수수료 한도를 준용’한다고 정한 부분의 무효확인을 구하는 소를 제기한 사안에서, 위 조례 시행규칙 [별표 11]에서 거래될 수 있는 모든 품목별로 모든 규격 및 중량을 특정하여 징수한도를 규정하는 것은 현실적으로 불가능하므로 위 조례 시행규칙 제59조 제1항 및 [별표 11]에서 위탁수수료 징수한도를 규정하면서 정률수수료와 정액수수료를 구분하여 함께 징수하는 체계를 전제할 수밖에 없다면 위 비고 조항과 같은 입법형식은 입법기술상 불가피한 점, 위 조례 시행규칙 제59조 제1항 및 [별표 11]의 주된 수범자(도매시장법인)는 일반인에 비하여 상대적으로 위탁수수료, 그중에서도 특히 정액수수료의 산정 및 부과기준의 준용 또는 유추적용이 그리 어렵지 않으므로 그 규정의 명확성에 대한 요구는 다소 완화될 수 있는 점, 위 비고 조항이 정액수수료가 규정된 품목(품종)과의 유사성을 판단할 수 있는 기준이나 표지를 제시하고 있지 않더라도 위 조례 시행규칙 제59조 제1항 및 [별표 11]의 개정취지 및 개정경과에 비추어 이를 충분히 예측할 수 있고, 특히 그 조항 등의 주된 수범자이자 개정과정에 계속 참여하였던 乙 회사 등은 예측가능성이 매우 높은 점을 종합하면, 위 비고 조항의 ‘유사성’을 판단할 때 위 조례 시행규칙 제59조 제1항 및 [별표 11]의 개정취지 및 개정경과, 수범자의 범위, [별표 11]의 규정기준 등을 종합적으로 고려하여 乙 회사 등을 포함한 위 조례 시행규칙 제59조 제1항 및 [별표 11]의 주된 수범자가 합리적이고 객관적인 해석의 기준을 충분히 마련할 수 있으므로, 위 비고 조항은 명확성 원칙에 위배된다고 볼 수 없음에도, 위 조례 시행규칙 제59조 제1항 및 [별표 11]에서 甲 시장의 청과부류 도매시장법인에 대한 위탁수수료의 최고한도를 규정한 부분이 명확성 원칙에 위반되어 무효라고 본 원심판단에 법리오해의 잘못이 있다고 한 사례.",
    "참조조문": "헌법 제12조, 제13조, 농수산물 유통 및 가격안정에 관한 법률 제42조 제1항 제3호, 제2항, 농수산물 유통 및 가격안정에 관한 법률 시행규칙 제39조 제4항 제2호",
    "참조판례": "",
    "판례내용": "【원고, 피상고인】 주식회사 ○○○ 외 3인 (소송대리인 법무법인(유한) 태평양 담당변호사 차한성 외 4인)\n【피고, 상고인】 서울특별시장 (소송대리인 법무법인 휘명 담당변호사 한봉희)\n【피고보조참가인, 상고인】 서울특별시농수산식품공사 (소송대리인 법무법인(유한) 지평 외 1인)\n【환송판결】 대법원 2021. 7. 8. 선고 2019두36384 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다. \n  1. 사안의 개요\n  원심판결의 이유와 기록에 의하면, 다음과 같은 사실을 알 수 있다. \n  가. 피고는 △△동 농수산물도매시장(이하 ‘이 사건 시장’이라 한다)의 개설자이고, 피고보조참가인(이하 ‘참가인’이라 한다)은 피고로부터 이 사건 시장에 대한 관리권한을 위탁받은 시장관리자이며, 원고들은 피고로부터 이 사건 시장의 청과부류에 속한 품목을 출하자에게서 위탁받거나 매수하여 이를 도매하도록 지정받은 도매시장법인이다. \n  나. 「농수산물 유통 및 가격안정에 관한 법률」(이하 ‘농수산물유통법’이라 한다)은 도매시장법인 등이 출하자로부터 거래액의 일정비율 또는 일정액에 해당하는 위탁수수료 외에는 어떠한 명목으로도 금전을 징수할 수 없도록 하고(제42조 제1항 제3호), 위탁수수료의 요율을 시행규칙에서 정하도록 하였다(제42조 제2항). 그 위임에 따라 「농수산물 유통 및 가격안정에 관한 법률 시행규칙」 제39조 제4항 제2호는 청과부류의 경우 위탁수수료의 최고한도를 거래금액의 1천분의 70으로 하면서, 도매시장의 개설자로 하여금 그 한도에서 업무규정으로 위탁수수료를 정할 수 있도록 하였다. 「서울특별시 농수산물도매시장 조례 시행규칙」은 제59조 제1항(이하 ‘이 사건 조항’이라 한다)에서 이 사건 시장 청과부류 도매시장법인에 대하여 [별표 11](이하 ‘이 사건 별표’라 하고, ‘이 사건 조항’과 합하여 ‘이 사건 조항 등’이라 한다) 기재 위탁수수료 한도를 적용하도록 하였는데, 이 사건 별표는 거래금액의 일정비율로 징수하는 위탁수수료(이하 ‘정률수수료’라 한다)의 경우 양배추, 총각무는 거래금액의 1천분의 70, 무, 배추는 거래금액의 1천분의 60, 위 각 품목을 제외한 나머지 전 품목은 거래금액의 1천분의 40을 각 징수한도로 정하였고, 양배추, 총각무, 무, 배추를 제외한 나머지 전 품목에 대하여 정률수수료에 덧붙여 품목, 규격 및 중량별로 구분하여 일정액을 추가 징수할 수 있는 위탁수수료(이하 ‘정액수수료’라 한다)의 징수한도를 정하였다. 이 사건 별표의 비고 제2항(이하 ‘이 사건 비고 조항’이라 한다)은 \"위탁수수료 한도가 정해지지 않은 품목(품종)은 유사 품목(품종) 및 규격의 위탁수수료 한도를 준용\"한다고 되어 있다. \n  2. 원심의 판단\n  원심은 피고가 이 사건 조항 등에서 이 사건 시장의 청과부류 도매시장법인에 적용되는 위탁수수료의 최고한도를 거래금액의 일정비율 외에 일정액도 포함하여 정한 것이 농수산물유통법이나 같은 법 시행규칙의 위임 범위를 벗어난 것이라고 볼 수는 없으나, 이 사건 별표의 정액수수료 부분에서 열거되지 않은 품목의 징수한도가 얼마인지, 이 사건 비고 조항이 정한 ‘유사 품목(품종) 및 규격’이 무엇인지 그 의미·내용을 합리적으로 파악할 수 있는 해석 기준을 얻기 어려워 이 사건 조항 등은 명확성 원칙에 위반되어 무효라는 취지로 판단하였다. \n  3. 대법원의 판단\n  가. 원심의 판단은 다음과 같은 이유로 수긍할 수 없다. \n  1) 이 사건 시장에서 거래되는 품목(품종)은 지극히 다양하고, 새로 거래되는 품목(품종) 또한 계속 생기기 마련이어서 이 사건 별표에서 거래될 수 있는 모든 품목별로 모든 규격 및 중량을 특정하여 징수한도를 규정하는 것은 현실적으로 불가능하다. 따라서 이 사건 조항 등에서 위탁수수료 징수한도를 규정함에 있어 정률수수료와 정액수수료를 구분하여 함께 징수하는 체계를 전제할 수밖에 없다면 이 사건 비고 조항과 같은 입법형식은 입법기술상 불가피하다. \n  2) 이 사건 조항 등은 농수산물의 생산자, 즉 출하자를 보호하기 위하여 이 사건 시장 청과부류의 도매시장법인이 징수할 수 있는 위탁수수료의 한도를 규정한 것으로, 그 주된 수범자는 원고들을 포함한 이 사건 시장 청과부류의 도매시장법인이다. 이들은 청과류의 거래 및 유통 상황에 대해 전문적 지식이 있는 거래주체이며, 이 사건 별표의 정액수수료 산정의 기초가 되었던 하역비의 부과기준을 협상하는 일방 당사자이다. 즉 이 사건 조항 등의 주된 수범자는 일반인에 비하여 상대적으로 위탁수수료, 그중에서도 특히 정액수수료의 산정 및 부과기준의 준용 또는 유추적용이 그리 어렵지 않을 것이므로 그 규정의 명확성에 대한 요구는 다소 완화될 수 있다. \n  3) 이 사건 별표에 규정되어 있지 않은 품목(품종)의 경우 이 사건 비고 조항은 ‘품목(품종)의 유사성’을 기준으로 이 사건 별표에 규정되어 있는 품목(품종)의 정액수수료를 준용하도록 정하고 있다. ‘유사’는 어떤 기준에 의하여 어떠한 방법으로 비교하는지 여부에 따라 그 판단이 달라질 수 있는 개념이기는 하다. 그러나 일반적으로 ‘유사’는 ‘서로 비슷함’이라는 문언적 의미를 가지는 점, 이 사건 조항 등은 표준하역비의 전가를 막아 출하자의 부담을 경감시키고 농수산물의 적정한 가격을 유지하도록 하기 위해 마련된 규정인 점, 이 사건 별표의 정액수수료가 2016. 2. 시행되고 있던 품목별 표준하역비를 반영하여 정해진 점 등을 고려해 보면, 정액수수료를 정함에 있어서의 품목(품종)의 유사성은 청과물의 크기, 모양 및 경도, 포장방법, 하역난이도 등에 있어서의 유사성을 의미한다는 것을 어렵지 않게 알 수 있다. 따라서 이 사건 비고 조항이 정액수수료가 규정된 품목(품종)과의 유사성을 판단할 수 있는 기준이나 표지를 제시하고 있지 아니하더라도 이 사건 조항 등의 개정취지 및 개정경과에 비추어 이를 충분히 예측할 수 있고, 특히 이 사건 조항 등의 주된 수범자이자 이 사건 조항 등의 개정과정에 계속 참여하였던 원고들로서는 그 예측가능성이 매우 높다 할 것이다. \n  4) 따라서 이 사건 비고 조항의 ‘유사성’을 판단함에 있어 이 사건 조항 등의 개정취지 및 개정경과, 수범자의 범위, 이 사건 별표의 규정기준 등을 종합적으로 고려하여 원고들을 포함한 이 사건 조항 등의 주된 수범자가 합리적이고 객관적인 해석의 기준을 충분히 마련할 수 있을 것으로 보이므로, 이 사건 비고 조항은 명확성 원칙에 위배된다고 볼 수 없다. \n  나. 그런데도 원심은 그 판시와 같은 이유로 이 사건 조항 등에서 이 사건 시장의 청과부류 도매시장법인에 대한 위탁수수료의 최고한도를 규정한 부분이 명확성 원칙에 위반되어 무효라고 판단하였다. 이러한 원심의 판단에는 명확성 원칙에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 취지의 상고이유 주장은 이유 있다. \n  4. 결론\n  나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 엄상필(재판장) 오석준(주심) 이숙연"
  },
  {

    "사건명": "제재처분취소[행정청이 동시에 한 학술진흥법에 따른 사업비 환수처분과 학술지원 대상자 선정제외처분 중 사업비 환수처분만을 취소한 원심판결의 당부가 문제된 사건]",
    "선고일자": "20250213",
    "법원명": "대법원",
    "사건종류명": "일반행정",
    "판결유형": "판결",
    "판시사항": "[1] 교육부장관이 대학의 산학협력단을 학술지원 대상자로 선정하고 학술지원 사업비를 지원하였다가, 참여교수가 사업비를 용도 외로 사용했다는 이유로 산학협력단에 대하여 학술지원 사업비 전부 또는 일부에 대한 환수처분을 한 경우, 해당 비위를 저지른 것으로 지목된 참여교수가 환수처분의 취소를 구할 원고적격이 인정되기 위한 법률상 보호되는 이익을 침해받았다고 볼 수 있는지 여부(적극)\n [2] 행정청이 학술지원 사업비 환수처분과 학술지원 대상자 선정제외처분을 하였다가 사후에 학술지원 사업비 환수처분만 취소된 경우, 학술지원 대상자 선정제외처분은 효력을 유지하는지 여부(소극)",
    "판결요지": "[1] 구 학술진흥법(2020. 12. 22. 법률 제17669호로 개정되기 전의 것, 이하 같다) 제1조, 제2조, 제4조, 제5조 제1항, 제6조 제1항, 제2항, 제19조 제1항, 제2항, 제20조와 산업교육진흥 및 산학연협력촉진에 관한 법률 제25조 제1항, 제27조 제1항의 내용을 종합하면, 교육부장관이 대학의 산학협력단을 학술지원 대상자로 선정하고 학술지원 사업비를 지원하였다가, 참여교수가 사업비를 용도 외로 사용했다는 이유로 산학협력단에 대하여 학술지원 사업비 전부 또는 일부에 대한 환수처분을 한 경우, 해당 비위를 저지른 것으로 지목된 참여교수는 학술지원 사업비 환수처분의 상대방이 아니라고 하더라도, 그 환수처분으로 인하여 구 학술진흥법에서 보호하는 개별적·직접적·구체적 이익을 침해받았다고 보는 것이 타당하다.\n [2] 구 학술진흥법(2020. 12. 22. 법률 제17669호로 개정되기 전의 것, 이하 같다) 제20조 제1항은 ‘구 학술진흥법 제19조 제1항 각호 또는 제2항 각호의 어느 하나에 해당하여 사업비 지급이 중지되거나 지급한 사업비의 전부 또는 일부가 환수된 경우에 학술지원 대상자 선정에서 제외하여야 한다.’라고 규정하고 있으므로, 학술지원 대상자 선정제외처분은 학술지원 사업비 환수처분의 존재를 발령요건 내지 처분사유로 하고 있다고 해석된다. 따라서 행정청이 학술지원 사업비 환수처분과 아울러 학술지원 대상자 선정제외처분을 하였는데, 사후적으로 학술지원 사업비 환수처분만이 취소된 경우, 학술지원 대상자 선정제외처분은 발령요건 내지 처분사유를 상실하게 되어 더 이상 효력을 유지할 수 없다.",
    "참조조문": "[1] 구 학술진흥법(2020. 12. 22. 법률 제17669호로 개정되기 전의 것) 제1조, 제2조, 제4조, 제5조 제1항, 제6조 제1항, 제2항, 제19조 제1항, 제2항, 제20조, 산업교육진흥 및 산학연협력촉진에 관한 법률 제25조 제1항, 제27조 제1항 / [2] 구 학술진흥법(2020. 12. 22. 법률 제17669호로 개정되기 전의 것) 제19조, 제20조 제1항",
    "참조판례": "",
    "판례내용": "【원고, 상고인 겸 피상고인】 원고 (소송대리인 법무법인 시대로 담당변호사 정희원 외 3인)\n【피고, 피상고인 겸 상고인】 교육부장관 (소송대리인 정부법무공단 담당변호사 조철호)\n【제1심판결】 서울행법 2022. 3. 17. 선고 2021구합53641 판결\n【주    문】\n  원심판결 중 원고 패소 부분을 파기하고, 제1심판결 중 원고 패소 부분을 취소한다.  피고가 2020. 12. 10. 원고에 대하여 한 2년의 학술지원 대상자 선정제외처분을 취소한다.  피고의 상고를 기각한다.  소송총비용은 피고가 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  기록에 의하면, 다음의 사실이 인정된다.\n  가. 피고의 구 학술진흥법(2020. 12. 22. 법률 제17669호로 개정되기 전의 것, 이하 같다)에 따른 학술지원사업에 관한 업무를 대행하는 재단법인 한국연구재단은 ○○대학교 산학협력단과 학술지원사업인 ‘BK21 플러스 사업(미래기반 창의인재양성형)’의 일환으로 ‘(과제명 생략)’이라는 과제(이하 ‘이 사건 과제’라 한다)에 관하여 사업비를 연간 1,925,534,000원, 총사업기간을 2016. 3. 1.부터 2020. 8. 31.까지로 정한 협약을 체결하고, 협약에 따라 연도별 사업비를 지급하였다.\n  나. 원고는 ○○대학교△△△부 교수로 재직하던 중 이 사건 과제에 연구책임자로 참여하였다.\n  다. ○○대학교 산학협력단은 이 사건 과제를 포함한 학술지원사업 및 국가연구개발사업과 관련하여, 국가로부터 사업비를 수령한 다음 그중 일부를 참여연구원들의 인건비로 참여연구원들 명의 인건비 계좌에 직접 지급하였다. 그럼에도 원고는, 이 사건 과제를 포함한 학술지원사업 및 국가연구개발사업의 참여연구원으로 등록된 원고 연구실 소속 학생들로 하여금 2014. 3.경부터 2018. 3.경까지 인건비 계좌의 인터넷뱅킹 아이디와 비밀번호를 동일하게 설정하여 원고 연구실 선임연구원에게 알려주게 하고, 입금된 인건비 중 사전에 협의된 금액(석사과정 월평균 약 600,000원, 박사과정 월평균 약 800,000원)만을 자신의 계좌로 이체하여 사용하게 하였다. 원고 연구실 선임연구원은 인건비 계좌에 남은 금액을 공동관리하면서 연구실 비품 구입 등 운영비와 학회·출장 경비 등으로 사용하고 원고에게 입출금내역과 잔액 등을 보고하였다. 2014. 3.경부터 2018. 3.경까지 이 사건 과제를 포함한 학술지원사업 및 국가연구개발사업을 통틀어 원고가 공동관리한 원고 연구실 소속 학생들의 인건비 합계금액은 118,754,769원이다.\n  라. 피고는 2020. 12. 10. 위와 같이 이 사건 과제 사업비 중 원고 연구실 소속 학생들의 인건비가 용도 외로 사용되었다는 이유로, ○○대학교 산학협력단장에 대하여는 6,727,716원의 사업비 환수처분(이하 ‘이 사건 환수처분’이라 한다)을, 원고에 대하여는 2년의 학술지원 대상자 선정제외처분(이하 ‘이 사건 선정제외처분’이라 한다)을 각각 하였다.\n  2. 피고의 상고이유에 대한 판단\n  가. 제1 상고이유에 관하여\n  1) 행정처분의 직접 상대방이 아닌 제3자라 하더라도 당해 행정처분으로 인하여 법률상 보호되는 이익을 침해당한 경우에는 그 처분의 취소나 무효확인을 구하는 행정소송을 제기하여 그 당부의 판단을 받을 자격이 있다. 여기에서 말하는 법률상 보호되는 이익이라 함은 당해 처분의 근거 법규 및 관련 법규에 의하여 보호되는 개별적·직접적·구체적 이익이 있는 경우를 말한다(대법원 2006. 12. 22. 선고 2006두14001 판결 등 참조).\n  2) 구 학술진흥법 제1조, 제2조, 제4조, 제5조 제1항, 제6조 제1항, 제2항, 제19조 제1항, 제2항, 제20조와 「산업교육진흥 및 산학연협력촉진에 관한 법률」 제25조 제1항, 제27조 제1항의 내용을 종합하여 보면, 피고가 대학의 산학협력단을 학술지원 대상자로 선정하고 학술지원 사업비를 지원하였다가, 참여교수가 그 사업비를 용도 외로 사용하였다는 이유로 산학협력단에 대하여 학술지원 사업비 전부 또는 일부에 대한 환수처분을 한 경우, 해당 비위를 저지른 것으로 지목된 참여교수는 학술지원 사업비 환수처분의 상대방이 아니라고 하더라도, 그 환수처분으로 인하여 구 학술진흥법에서 보호하는 개별적·직접적·구체적 이익을 침해받았다고 봄이 타당하다.\n  3) 원심은, 이 사건 환수처분으로 자신의 법률상 지위에 영향을 받는 원고로서는 위 처분의 취소를 구할 수 있는 개별적·직접적·구체적 이해관계가 있으므로, 원고에게는 이 사건 환수처분의 취소를 구할 원고적격이 인정된다고 판단하였다.\n  4) 원심판결의 이유를 앞서 본 법리에 비추어 보면, 위와 같은 원심판단은 정당하고, 거기에 상고이유 주장과 같이 구 학술진흥법 제19조에 따른 학술지원 사업비 환수처분에 관한 원고적격에 대한 법리오해로 판결에 영향을 미친 잘못이 없다.\n  나. 제2 상고이유에 관하여\n  원심은, 이 사건 환수처분을 통해 얻게 될 공익보다 원고가 입게 될 불이익이 지나치게 크고, 그 결과가 처분사유인 위반행위의 내용 및 관계 법령의 규정과 취지에 비추어 현저히 부당한 경우에 해당하므로, 이 사건 환수처분은 비례의 원칙을 위반하여 재량권을 일탈·남용한 것으로서 위법하다고 판단하였다.\n  원심판결의 이유를 관련 법리와 기록에 비추어 보면, 위와 같은 원심의 판단은 정당하고, 거기에 상고이유 주장과 같이 재량권 일탈·남용 내지 비례의 원칙에 관한 법리를 오해하거나 자유심증주의의 한계를 벗어나 판결에 영향을 미친 잘못이 없다.\n  3. 원고 패소 부분에 관한 직권 판단\n  원고의 상고이유에 대한 판단에 앞서 직권으로 본다.\n  가. 구 학술진흥법 제20조 제1항은 ‘구 학술진흥법 제19조 제1항 각호 또는 제2항 각호의 어느 하나에 해당하여 사업비 지급이 중지되거나 지급한 사업비의 전부 또는 일부가 환수된 경우에 학술지원 대상자 선정에서 제외하여야 한다.’라고 규정하고 있으므로, 학술지원 대상자 선정제외처분은 학술지원 사업비 환수처분의 존재를 그 발령요건 내지 처분사유로 하고 있다고 해석된다. 따라서 행정청이 학술지원 사업비 환수처분과 아울러 학술지원 대상자 선정제외처분을 하였는데, 사후적으로 학술지원 사업비 환수처분만이 취소된 경우, 학술지원 대상자 선정제외처분은 그 발령요건 내지 처분사유를 상실하게 되어 더 이상 그 효력을 유지할 수 없다.\n  나. 원심은 구 학술진흥법 제19조 제2항 제1호에 따른 이 사건 환수처분이 재량권 일탈·남용에 해당한다고 보아 이 사건 환수처분을 취소하면서도, 구 학술진흥법 제20조 제1항에 따른 이 사건 선정제외처분을 취소하지 않았다.\n  다. 그러나 이 사건 환수처분을 취소하는 판결이 확정되면 이 사건 환수처분이 처분 시에 소급하여 소멸하면서 이 사건 선정제외처분은 그 발령요건 내지 처분사유가 그 발령 시부터 존재하지 않게 되므로, 이 사건 환수처분을 취소하면서 이 사건 선정제외처분을 취소하지 않은 원심판결 중 원고 패소 부분에는 구 학술진흥법 제20조 제1항의 학술지원 대상자 선정제외처분의 발령요건 내지 처분사유에 관한 법리오해로 판결에 영향을 미친 잘못이 있다.\n  4. 결론\n  원고의 상고이유에 대한 판단을 생략한 채 원심판결 중 원고 패소 부분을 파기하고, 이 부분은 대법원이 직접 재판하기에 충분하므로 민사소송법 제437조에 따라 자판하기로 한다. 이 사건 환수처분을 취소하면서 이 사건 선정제외처분을 취소하지 않은 제1심판결 중 원고 패소 부분 역시 위법하므로 위 부분을 취소하고, 이 사건 선정제외처분을 취소한다. 나아가 피고의 상고를 기각하고, 소송총비용을 패소자인 피고가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오경미(재판장) 권영준 박영재(주심)"

    "판시사항": "[1] 산업재해보상보험법 제5조 제1호가 정하는 업무상의 사유에 따른 질병으로 인정하기 위한 업무와 질병 사이의 인과관계에 관한 증명책임의 소재 및 증명의 정도 / 업무와 질병 사이의 인과관계를 판단하는 방법 및 판단의 기준이 되는 자\n [2] 산업재해보상보험 지급 여부의 결정적 요건인 업무와 질병 사이의 인과관계를 판단하는 과정에서 산업재해보상보험제도의 목적과 사회적 기능이 규범적으로 조화롭게 반영되어야 하는지 여부(적극) \n [3] 근로자에게 발병한 질병에 관한 연구결과가 충분하지 않아 발병원인으로 의심되는 요소들과 근로자의 질병 사이에 인과관계를 명확하게 규명하는 것이 곤란하다는 이유만으로 인과관계를 부정할 수 있는지 여부(소극) \n [4] 배전전기원으로 근무하던 甲이 ‘상시적으로 22,900V의 특고압 전기가 흐르는 상태에서 작업을 하면서 극저주파 전자기장 등 전자파에 노출되었고, 전기를 만진다는 강박감과 과도한 스트레스로 갑상선 유두상암이 발병하였다.’며 근로복지공단에 요양급여를 신청하였으나, 근로복지공단이 ‘극저주파 자기장 노출과 갑상선암 발생과의 인과성을 뒷받침할 연구가 부족하고 갑상선암과 관련 있는 것으로 알려진 유해인자의 직업적 노출이 없다.’는 등의 이유로 요양을 불승인하는 결정을 한 사안에서, 제반 사정을 종합하면 甲의 업무와 상병의 발병·악화 사이에 상당인과관계를 긍정할 여지가 있다고 한 사례",

    "판례내용": "【원고, 상고인】 원고 (소송대리인 법무법인 여는 담당변호사 김하경 외 2인)\n【피고, 피상고인】 근로복지공단\n【원심판결】 서울고법 2024. 6. 11. 선고 2022누55868 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유를 판단한다. \n  1. 관련 법리 \n  가. 산업재해보상보험법 제5조 제1호가 정하는 업무상의 사유에 따른 질병으로 인정하려면 업무와 질병 사이에 인과관계가 있어야 하고 그 증명책임은 원칙적으로 근로자 측에 있다. 여기에서 말하는 인과관계는 반드시 의학적·자연과학적으로 명백히 증명되어야 하는 것은 아니고 법적·규범적 관점에서 상당인과관계가 인정되면 그 증명이 있다고 보아야 한다. 산업재해의 발생원인에 관한 직접적인 증거가 없더라도 근로자의 취업 당시 건강상태, 질병의 원인, 작업현장에 존재하는 유해요소의 성격이나 그 정도, 근무 기간 등의 여러 사정을 고려하여 경험칙과 사회통념에 따라 합리적인 추론을 통하여 그 질병이 업무상의 사유에 따른 것이라고 추정할 수 있는 경우에는 인과관계를 인정할 수 있다. 또한 질병의 주된 발생원인이 업무수행과 직접적인 관계가 없더라도 업무상의 과로나 스트레스가 질병의 주된 발생원인에 겹쳐서 질병을 유발 또는 악화시켰다면 그 사이에 인과관계가 있다고 보아야 할 것이다. 이때 업무와 질병과의 인과관계의 유무는 보통평균인이 아니라 당해 근로자의 건강과 신체조건을 기준으로 판단하여야 한다. \n  나. 근로자가 업무수행 과정에서 겪을 수 있는 이른바 ‘직업병’에 대하여는 경험적·이론적 연구결과가 없거나 상대적으로 부족한 경우가 많다. 전통적인 산업분야에서는 산업재해 발생의 원인이 어느 정도 규명되어 있기는 하나, 그중에서도 해당 산업에 종사하는 근로자의 수가 적거나, 기술의 발달 및 사업구조의 변화로 기존의 작업환경이 더 이상 유지되지 않는 경우에는 인과관계를 입증할 만한 연구가 이루어지기 위한 표본 자체가 부족할 수 있고, 연구의 필요성도 적어지기 때문이다. 그 당시의 의학과 자연과학 수준에서 유해성이 인정되지 않던 요소의 위험성이 과학기술의 발달로 뒤늦게 밝혀지는 경우도 있다. \n이러한 산업재해의 특성상 근로자는 업무수행 과정에서 불확실한 위험을 감수해야 하는 상황에 부딪칠 수 있는데, 산업재해보상보험은 이러한 위험을 대비하는 기능을 한다. 산업재해보상보험제도는 작업장에서 발생할 수 있는 산업안전보건상의 위험을 사업주나 근로자 어느 일방에 전가하는 것이 아니라 공적 보험을 통해 산업과 사회 전체가 이를 분담함으로써 근로자의 안전과 건강을 위한 최소한의 사회적 안전망을 제공하여 사회 전체의 갈등과 비용을 줄이고 산업 발전과 경제성장에 기여하고 있다. \n이러한 산업재해보상보험의 사회적 기능은 산업재해보상보험의 지급 여부에 결정적인 요건으로 작용하는 인과관계를 판단하는 과정에서 규범적으로 조화롭게 반영되어야 한다. \n  다. 산업재해보상보험법상 상당인과관계의 판단 기준과 제도의 목적·기능을 종합적으로 고려할 때, 근로자에게 발병한 질병에 관한 연구결과가 충분하지 않아 발병원인으로 의심되는 요소들과 근로자의 질병 사이에 인과관계를 명확하게 규명하는 것이 곤란하더라도 그것만으로 인과관계를 쉽사리 부정할 수 없다. 특히 인과관계와 관련하여 상반되는 연구결과가 동시에 존재하는 등 현재의 의학과 자연과학 수준에서 어느 한 쪽으로 단정하기 어려운 경우에는 더욱더 그러하다. 나아가, 작업환경에 일정 수준 이상의 유해요소가 존재하는 경우, 그 유해요소와 특정 질환 간의 직접적인 연관성이 규명되지 않았다고 하더라도 그것이 근로자의 체질이나 기초질병 및 다른 유해요인과 결합하여 특정 질환의 발병이나 악화에 복합적·누적적으로 작용할 가능성을 간과해서는 안 된다(대법원 2007. 4. 12. 선고 2006두4912 판결, 대법원 2008. 5. 15. 선고 2008두3821 판결, 대법원 2017. 8. 29. 선고 2015두3867 판결 등 참조).\n  2. 인정 사실 \n  원심판결 이유와 기록에 따르면 다음 사실을 알 수 있다. \n  가. 원고(1969. 3.생 남자)는 1995년부터 유한회사 ○○ 등에서 배전전기원으로 근무하였다. 원고는 배전전기원으로 근무하면서 1998년까지는 정전 상태에서 작업하였으나, 이후 약 18년간은 전기가 통하는 상태의 전신주에서 송·배선전로의 유지·보수를 하는 ‘무정전 작업’을 ‘활선(活線, live line)공법’으로 수행하였다. 활선공법은 배전전기원이 직접 충전부에서 작업을 수행하는 직접활선공법과 전기원의 안전을 위해 스틱을 사용하는 간접활선공법으로 구분되는데, 주로 간접활선공법을 이용하는 미국, 일본과 달리 우리나라의 경우 직접활선공법이 널리 이용되었다. 전국건설노동조합을 비롯한 전기 노동자들이 직접활선공법으로 인한 감전 등 사고의 위험성과, 전자파로 인한 직업병 문제를 제기함에 따라 한국전력공사는 2016년부터 직접활선공법을 원칙적으로 폐지하고 간접활선공법으로 단계적 전환을 해 나가기로 하였다. \n  나. 원고는 활선 작업차에 혼자 탑승하여 자가 조종하며 배전공사를 수행하였고, 근무일마다 기자재 교체 작업의 경우 전봇대 2~30개, 전선 교체 작업의 경우 전봇대 7~8개를 점검한 것으로 보인다. 원고는 2009년 전에는 7시 30분부터 19시까지 주 6일 근무하였고, 2009년 이후에는 8시부터 18시까지 주 5일 근무하였으며, 전신주가 넘어지거나 여름철 전력수요의 증가로 변압기가 고장나는 경우에는 돌발작업을 수시로 하였던 것으로 보인다. \n  다. 원고는 배전전기원으로 일하던 중인 2015. 11.경 갑상선 유두상암(이하 ‘이 사건 상병’이라 한다)을 진단받았고, 2015. 12. 4. △△대학교 병원에서 갑상선 전 절제술과 중앙 림프절 곽청술을 받았으며 이후 방사선 치료를 하였다. 원고는 이 사건 상병 진단 전에 이 사건 상병과 관련된 기저질환으로 치료를 받은 내역이 없다. \n  라. 갑상선암은 2020년 기준 우리나라에서 가장 많이 발생한 암으로 국내 암 발생의 11.8%를 차지한다. 갑상선암은 여자가 남자에 비해 3배 이상 많이 생기고 40대에서 가장 많이 발병하는 것으로 알려져 있다. 이 사건 상병은 전체 갑상선암 중에서도 70% 정도를 차지한다. \n  방사선은 갑상선암의 대표적인 직업적·환경적 위험인자로 알려져 있다. 방사선 요오드와 X-선, 감마선 등 전리방사선은 갑상선암의 대표적인 발암인자로 알려져 있는 반면, 극저주파 전자기장과 같은 비전리방사선에의 노출이 갑상선암의 발병·악화에 영향을 미친다고 볼 만한 뚜렷한 연구결과는 없다. \n  다만 극저주파 전자기장에 노출된 그룹에서 혈중 갑상선호르몬 수치가 대조군에 비해 유의미하게 낮게 나타난다는 연구결과와, 전기공들의 좌측 갑상선엽의 전후방 직경이 유의미하게 높게 나타나고 혈중 FT4 수치가 유의미하게 낮게 관찰된다는 연구결과가 존재하는데, 이는 극저주파 전자기장을 비롯한 전자기장이 갑상선에 영향을 줄 수 있음을 의미한다. \n  한편 국제암연구소는 극저주파 전자기장을 발암 가능물질(Group 2B)로 분류하고 있으며, 유럽환경의학학술원은 2016년 기준 극저주파 자기장에 대한 노출 권고기준을 주간 노출 평균 0.1μT, 야간 노출 평균 0.1μT, 민감 인구집단의 경우 0.03μT를 상한으로 삼고 있다. \n  마. 산업안전보건연구원이 2017년 실시한 활선작업자 건강상태 및 관련 실태조사에 따르면, 활선 상태에서 케이블을 교체하거나 연결하는 작업을 하는 배전작업자의 작업환경에서 산술평균 1.3μT의 극저주파 자기장이 측정되었다. 이는 일반 회사원의 평균값인 0.05μT, 반도체 공장에서 가공·조립공정에 직접 종사하는 근로자의 평균값인 0.73μT, 변전소 근무자의 평균값인 0.43μT보다 현저히 높은 수치이다. 위 연구에 따르면 배전작업자의 경우 최고노출수준 값의 범위가 8.5~1,671μT로 측정되었는데, 이 또한 반도체 공장 근로자의 최고치 123.3μT, LCD공장 근로자의 최고치 43.5μT, 변전소 근무자의 최고치 23μT보다도 훨씬 높은 수준이다. \n  바. 원고는 ‘상시적으로 22,900V의 특고압 전기가 흐르는 상태에서 작업을 하면서 극저주파 전자기장 등 전자파에 노출되었고, 전기를 만진다는 강박감과 과도한 스트레스로 인하여 이 사건 상병이 발병하였다.’고 주장하면서 피고에게 요양급여를 신청하였다. 피고는 산업안전보건연구원의 위 조사결과와 현재까지의 관련 연구결과 등을 종합적으로 검토하여 2020. 3. 4. 원고에게 ‘원고가 전기원 업무를 수행하면서 배전선로에서 발생된 극저주파 자기장에 노출되었을 것으로 추정되나 극저주파 자기장 노출과 갑상선암 발생과의 인과성에 대해서는 아직 이를 뒷받침할 연구가 부족하고 갑상선암과 관련 있는 것으로 알려진 유해인자의 직업적 노출은 없으며, 그 외 직업적 요인도 확인되지 않는다. 타 직종과 비교해 볼 때 전기공 직업군에서 갑상선암이 특이하게 높게 나타나지 않으며 갑상선암 발병은 직업적 요인 외에도 검진 등과 같은 여러 가지 요인이 기여하는 바가 크기에 신청 상병과 업무와의 상당인과관계가 인정되지 않는다.’는 이유로 요양을 불승인하는 결정(이하 ‘이 사건 처분’이라 한다)을 하였다. \n  3. 대법원의 판단 \n  가. 위에서 본 법리와 사정들을 종합하면, 원고의 업무와 이 사건 상병의 발병·악화 사이에 상당인과관계를 긍정할 여지가 있다. 그 이유는 다음과 같다. \n  1) 극저주파 전자기장 노출과 갑상선암 발병·악화 사이의 상당인과관계를 인정하기 어렵다는 판단의 주된 근거는 극저주파 전자기장 노출이 이 사건 상병 발생에 영향을 미치는지 여부에 관하여는 상반되는 연구결과가 존재하는 등 명확한 상관관계가 아직 증명되지 않았다는 것이다. \n  그러나 산업재해보상보험제도의 목적과 기능에 비추어 보았을 때, 연구결과가 충분하지 않아 현재의 의학과 자연과학 수준에서 발병원인으로 의심되는 요소들과 근로자의 질병 사이에 인과관계를 명확하게 규명하는 것이 곤란하더라도 그것만으로 원고의 업무와 이 사건 상병 사이의 인과관계를 부정할 수는 없다. 제1심 감정의는 현재까지의 연구결과를 바탕으로 했을 때 극저주파 전자기장 노출과 갑상선암 발병·악화 사이의 상당인과관계를 인정하기 어렵다면서도, 극저주파 전자기장을 비롯한 전자기장에의 노출이 갑상선 기능에 영향을 줄 수 있다는 연구결과가 지속적으로 나오고 있어 추후 극저주파 전자기장과 갑상선암 사이의 유의미한 연관성을 인정할 수 있는 연구결과가 나올 가능성이 있다는 견해를 밝히기도 하였다. \n  2) 피고는 배전전기원이 다른 직업군과 비교하여 갑상선암 발병률이 특별히 높다고 볼 수도 없다는 점을 인과관계 부정의 또 다른 근거로 들고 있다. 그러나 국내에서 직접활선작업은 1990년대 후반에 시작되어 그 위험성을 이유로 2016년경까지만 시행되었는바, 원고와 같이 직접활선공법으로 십수 년 동안 일하였던 근로자의 수가 매우 제한적일 수밖에 없어 배전전기원의 갑상선암 발병률이 다른 직업군에 비하여 유의미하게 높은지 여부를 제대로 연구할 수 없는 사정이 있다. \n  이러한 이유로 극저주파 전자기장에의 노출이 이 사건 상병에 영향을 미치는지 여부를 확인할 만한 자료 자체가 없는 것을 두고 의학적·과학적 근거가 없다고 해석하여 근로자에게 불리하게 판단하는 것은 산업재해보상보험제도의 취지에 비추어 타당하지 않다.\n  3) 현재까지의 연구결과를 종합하여 보더라도 극저주파 전자기장과 갑상선암 사이의 상당인과관계가 인정되지 않는다고 단정하기는 어려워 보인다. 극저주파 전자기장의 유해성을 고려하여 이를 ‘명백한 발암물질(Group 1)’로 분류해야 한다는 주장이 나오고 있으며, 극저주파 전자기장이 갑상선 호르몬에 영향을 미친다는 취지의 연구결과도 존재한다. 제1심 감정의도 극저주파 전자기장으로 인한 활성산소 발생과 산화 스트레스가 암유전자의 발현을 촉진시킬 수 있다는 데는 많은 과학자들이 동의하고 있다는 소견을 밝혔다. \n  4) 제1심 감정의는 한편으로 ‘극저주파 전자기장이 조혈기계에 영향을 줄 수 있다는 연구결과가 있고, 2010년경 이루어진 건강검진 결과 원고에게서 경미한 백혈구감소증이 나타나는데, 이는 장기간의 극저주파 전자기장 노출이 원고의 신체에 전신적 영향을 주었을 가능성을 시사한다.’는 소견도 제시하였다. \n  이러한 사정에 비추어 보았을 때 설령 극저주파 전자기장과 이 사건 상병 사이의 연관성이 규명되지 않았다고 하더라도, 장기간 높은 수준의 극저주파 전자기장에 노출된 것이 원고의 신체 상태에 악영향을 주고, 이것이 원고의 체질이나 기초질병 등 다른 요인과 결합하여 이 사건 상병의 발병이나 악화에 복합적·누적적으로 작용하였을 가능성을 간과해서는 안 된다. \n  5) 고압의 전류가 흐르는 활선 상태의 전선을 다루는 배전전기원은 상시적으로 감전 사고의 위험에 노출되어 있고, 16m 높이의 전주에서 작업을 수행하다보니 그에 따른 사고 위험도 적지 않다. 감전이나 추락 사고의 경우 치명적인 부상으로 이어질 가능성이 높아서, 배전전기원은 근로시간 내내 정신적 긴장이 큰 상태에서 근무할 수밖에 없다. 원고는 약 18년 동안 하루 8시간 이상 근무하면서 22,900V 고압의 전류가 흐르는 전선을 다루었는바 필연적으로 과도한 정신적 스트레스에 노출되었을 것으로 보인다. 과도한 스트레스는 그 자체로 질병을 촉발하거나 신체의 면역력을 저하해 질병의 발병·악화에 부정적인 영향을 미칠 수 있으므로, 업무로 인한 스트레스가 이 사건 상병의 발병이나 진행을 촉진하는 원인의 하나로 작용하였을 가능성도 배제할 수 없다. \n  6) 갑상선암은 내분비계 암 중에 가장 흔한 암이고, 원고는 이 사건 상병 진단 당시 만 46세로 갑상선암의 호발연령에 해당하기는 하나, 원고와 같은 성별로 한정하면 같은 해 기준 남성 갑상선암 발생자는 전체 암 발생의 5.7%이고, 발생 순위도 6위에 그칠 뿐이다. 원고에게 이 사건 상병과 관련한 병력이나 유전적 소인, 가족력이 있다고 볼 만한 증거도 없다. \n  나. 그럼에도 원심은 이와 달리 원고의 요양급여신청을 불승인한 이 사건 처분이 적법하다고 판단하였다. 이러한 원심판단에는 산업재해보상보험법상 업무와 재해 사이의 상당인과관계에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 상고이유 주장은 이유 있다. \n  4. 결론 \n  그러므로 원심판결을 파기하고 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.  \n\n대법관 오석준(재판장) 이흥구 엄상필 이숙연(주심)"
  },

    "판시사항": "[1] 대통령기록물 관리에 관한 법률 제17조에 따라 대통령지정기록물을 지정하고 이에 대하여 보호기간을 정한 대통령 행위의 효력 유무에 대한 사법심사가 대통령기록물 관리에 관한 법률에 의해 배제되는지 여부(소극)\n [2] 정보공개 거부처분을 다투는 항고소송에서 해당 정보를 대통령지정기록물로 지정하고 보호기간을 정한 행위의 적법성을 심사하기 위해 공공기관의 정보공개에 관한 법률 제20조 제2항에 따라 비공개 열람·심사가 이루어지는 경우, 행정청이 대통령기록물 관리에 관한 법률 제17조 제4항을 근거로 자료제출을 거부할 수 있는지 여부(소극) / 이때 법원이 비공개 열람·심사를 진행하기 위한 전제 및 취해야 할 조치",
    "판결요지": "[1] 대통령기록물 관리에 관한 법률(이하 ‘대통령기록물법’이라 한다) 제17조에서 정한 대통령지정기록물 보호기간 제도의 취지는 외교적·정치적으로 민감한 사안에 대한 기록이 대통령의 임기가 끝난 직후 곧바로 공개될 경우 또 다른 정쟁의 대상이 될 수 있고 그 때문에 대통령이 임기 내에 민감한 사안에 관하여 기록 자체를 생산하지 않을 수 있으므로, 대통령이 지정한 일정한 범위의 기록물에 대하여는 퇴임 후 일정기간 철저하게 보호함으로써 대통령의 원활한 기록 생산을 도모하려는 데에 있다. \n  그런데 보호기간이 정해진 대통령지정기록물이 다른 일반적인 정보와 마찬가지로 공개가 원칙이라고 이해될 경우 위와 같은 대통령지정기록물 보호기간 제도의 취지에 역행하는 결과가 초래될 수 있다. 따라서 대통령지정기록물을 지정하고 이에 대하여 보호기간을 정한 대통령의 행위(이하 ‘보호기간 설정행위’라 한다)가 현저히 불합리하다고 볼 만한 명백한 사정이 없는 한, 법원으로서는 원칙적으로 그 결정을 최대한 존중함으로써 보호기간 설정행위의 효력이 사후에 함부로 부정되지 않도록 하는 것이 바람직하다.\n  그러나 대통령지정기록물 보호기간 제도의 취지가 퇴임 후의 정쟁 등을 미연에 방지하기 위해 일정기간 공개를 제한하는 것이라고 하더라도, 대통령의 보호기간 설정행위는 대통령기록물법에서 정한 절차와 요건을 준수해야만 비로소 적법하게 효력을 갖게 되는 것이므로, 보호기간 설정행위의 효력 유무에 대한 사법심사가 대통령기록물법에 의해 배제된다고 볼 수는 없다. \n [2] 대통령기록물 관리에 관한 법률(이하 ‘대통령기록물법’이라 한다) 제17조 제4항은 보호기간이 정해진 대통령지정기록물의 경우 보호기간 동안 다른 법률에 따른 자료제출의 요구 대상에 포함되지 않는다고 규정하고 있다. 그러나 대통령이 특정 정보를 대통령지정기록물로 지정하여 보호기간을 정한 행위(이하 ‘보호기간 설정행위’라 한다)에 대한 사법심사 과정에서 적법성을 의심할 만한 상당한 이유가 있음에도 행정청이 법원에 대하여 그 정보의 제출을 거부할 수 있다고 한다면, 보호기간 설정행위의 적법성에 관한 실질적인 재판이 이루어질 수 없어 헌법 제27조 제1항이 보장한 국민의 재판청구권이 침해될 수 있다. 더구나 법원이 공공기관의 정보공개에 관한 법률(이하 ‘정보공개법’이라 한다) 제20조 제2항에 따라 보호기간이 정해진 대통령지정기록물을 비공개로 열람·심사할 경우 대통령지정기록물이 공개됨으로써 초래되는 외교적·정치적 혼란을 피할 수 있으므로 법원의 심사과정에서 공익에 대한 위해가 발생한다고 보기도 어렵다.  \n  따라서 정보공개 거부처분을 다투는 항고소송에서, 해당 정보를 대통령지정기록물로 지정하고 보호기간을 정한 행위의 적법성을 심사하기 위해 정보공개법 제20조 제2항에 따라 비공개 열람·심사가 이루어지는 경우에는 행정청이 대통령기록물법 제17조 제4항을 근거로 자료제출을 거부할 수 없다고 해석하는 것이 헌법을 최고법규로 하는 통일적인 법질서의 형성을 위한 합헌적 법률해석의 원칙에 부합한다.\n  다만 보호기간 중에 있는 대통령지정기록물의 열람 및 제출을 엄격히 제한하는 대통령기록물법 제17조 제4항의 취지를 고려할 때, 법원으로서는 우선 피고로 하여금 다툼의 대상이 되는 정보의 유형, 해당 정보를 대통령지정기록물로 보아 보호기간을 정한 절차 및 실질적인 이유, 이를 공개하지 않는 사유, 동종의 정보에 대하여 보호기간을 정한 사례의 유무 등의 간접사실에 의하여 해당 정보에 적법하게 보호기간이 정해졌는지를 증명하도록 하여야 한다. 법원은 피고가 제출한 간접사실만으로 증명이 충분하지 않아 보호기간을 정한 행위의 적법성을 의심할 만한 상당한 이유가 있는 때에 비로소 정보공개법 제20조 제2항에 따라 피고로 하여금 다툼의 대상이 된 정보를 제출하도록 하여 비공개 열람·심사를 진행할 수 있다.",
    "참조조문": "[1] 대통령기록물 관리에 관한 법률 제17조, 공공기관의 정보공개에 관한 법률 제9조 제1항 제1호 / [2] 헌법 제27조 제1항, 대통령기록물 관리에 관한 법률 제17조 제4항, 정보공개에 관한 법률 제20조 제2항",
