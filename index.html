<title>대법원 행정법 판례 모음</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5fa;
  --surface: #ffffff;
  --fg: #1a1c27;
  --muted: #6b7280;
  --border: #e7e8f0;
  --accent: #3652d9;
  --accent-fg: #ffffff;
  --accent-soft: #ecefff;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 2px 8px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101119;
    --surface: #181a25;
    --fg: #e8e9f2;
    --muted: #9296a8;
    --border: #262838;
    --accent: #93a6ff;
    --accent-fg: #10121e;
    --accent-soft: #1e2340;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.35);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  line-height: 1.7;
  letter-spacing: -0.01em;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.wiki-page {
  max-width: 880px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

.site-header { margin-bottom: 20px; }
.site-title {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0 0 8px;
}
.site-subtitle { color: var(--muted); font-size: 15px; margin: 0; }

.site-notice {
  background: var(--accent-soft);
  border-radius: 12px;
  padding: 16px 18px;
  margin: 20px 0 32px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--fg);
}
.site-notice p { margin: 6px 0; }
.site-notice strong { color: var(--accent); }
.site-notice-updated { color: var(--muted); font-size: 12.5px; }
.site-notice-signature { text-align: right; color: var(--muted); font-size: 12.5px; margin-top: 10px !important; }

.doc-card-list {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.case { border-bottom: 1px solid var(--border); }
.case:last-child { border-bottom: none; }

.doc-card {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 14px 18px;
  cursor: pointer;
}
.doc-card:hover { background: var(--accent-soft); }
.doc-date { font-size: 12.5px; color: var(--muted); white-space: nowrap; min-width: 76px; }
.doc-title { flex: 1; font-size: 14.5px; font-weight: 600; }
.doc-tag { font-size: 11.5px; color: var(--accent); white-space: nowrap; }

.case-body {
  display: none;
  padding: 4px 18px 20px;
}
.case-body.open { display: block; }

.field { margin-top: 16px; }
.field h4 {
  font-size: 12.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--muted);
  border-left: 3px solid var(--accent);
  padding-left: 8px;
  margin: 0 0 8px;
}
.field p {
  margin: 0;
  white-space: pre-wrap;
  font-size: 13.5px;
  color: var(--fg);
}
.field .box {
  background: var(--accent-soft);
  border-radius: 10px;
  padding: 12px 14px;
}
.full-text {
  max-height: 340px;
  overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}

@media (max-width: 600px) {
  .wiki-page { padding: 24px 16px 56px; }
  .site-title { font-size: 25px; }
  .doc-card { padding: 13px 14px; gap: 8px 10px; flex-wrap: wrap; }
  .doc-date { min-width: 62px; font-size: 11.5px; }
  .doc-title { font-size: 13.5px; flex-basis: 100%; order: 3; }
}
</style>
</head>

[

    "법원명": "대법원",

    "판시사항": "시간선택제채용공무원이 통상의 근무시간에 수행하는 시간외근무에 공무원수당 등에 관한 규정 제15조 제5항 제2호 (나)목을 적용할 수 있는지 여부(소극)",
    "판결요지": "현업공무원 등 외의 공무원이 공휴일 및 토요일 외의 날에 시간외근무를 하는 경우 해당 일의 시간외근무시간에서 1시간을 뺀 시간을 더하여 월별 시간외근무시간을 산정하도록 정한 공무원수당 등에 관한 규정 제15조 제5항 제2호 (나)목(이하 ‘공제조항’이라 한다)은 시간선택제채용공무원이 통상의 근무시간(9시부터 18시까지 중 점심시간 1시간을 제외한 8시간을 말한다. 이하 같다)에 수행하는 시간외근무에는 적용되지 않는다. 그 이유는 다음과 같다.\n ① 통상의 근무시간 외에 수행하는 시간외근무의 경우, 업무의 관행상 조기출근을 하더라도 정식 업무개시시각 이전에는 실제로 업무를 수행하지 않거나 정식의 퇴근시간 이후에도 시간외근무를 시작하기까지에는 실제로 업무를 수행하지 않는 어느 정도의 시간이 존재하는 경우가 많고, 시간외근무의 수행 시에 대부분 석식 내지 휴게시간을 가진다고 볼 수 있다. 공제조항은 실제로 업무를 수행하지 않는 이러한 시간을 공제하여 실제 업무를 수행하는 시간에 대하여서만 시간외근무수당을 지급하기 위한 것이다.\n ② 통상의 근무시간 중 일부만 근무하도록 되어 있는 시간선택제채용공무원의 경우에는 시간외근무수당이 지급되는 1일 4시간의 시간외근무가 대부분 통상의 근무시간 내에 이루어지게 된다. 전일제공무원들이 정상적으로 근무하는 통상의 근무시간 중에는 석식 시간이 필요하지 않고 상급자의 지휘ㆍ감독 아래 전일제공무원들의 조직적 업무수행이 계속되는 가운데 시간선택제채용공무원만 휴게시간을 갖는 일도 흔히 있을 수 있다고 보이지 않는다.\n ③ 통상의 근무시간에 수행하는 시간외근무와 그 이외의 시간에 수행하는 시간외근무 사이에는 실제로 업무를 수행하지 않는 시간이 있을 개연성이나 상급자의 업무 지휘ㆍ감독 가능성, 근무 강도 등에 적지 않은 차이가 존재한다. 그럼에도 시간선택제채용공무원이 통상의 근무시간에 수행한 시간외근무시간에 대하여 공제조항을 동일하게 적용하는 것에는 합리적 이유가 있다고 보기 어렵다. 이는 국가공무원법 제47조 제1항 제2호에서 ‘공무원의 수당에 관한 사항은 대통령령으로 정한다.’고 규정하여, 공무원이 지급받는 수당의 구체적 내용에 관하여 대통령령에 광범위한 재량을 부여하고 있음을 고려하더라도 마찬가지이다.\n ④ 시간선택제채용공무원이 실제 저녁식사를 하지 않고 19시 무렵까지 계속 시간외근무를 하다가 퇴근한 경우에 공제조항을 적용하게 되면 공제조항의 입법 취지에 반하는 결과가 발생하기는 한다. 그러나 이러한 문제는 전일제공무원에게도 동일하게 나타나므로 시간선택제채용공무원에 대한 차별로 볼 수 없고, 현재의 근태관리 체계에서는 시간외근무시간에 실제 업무를 수행하였는지를 일일이 파악하는 것이 현실적으로 어렵다는 점에서 공무원 개인의 구체적 사정을 고려하지 않고 일정한 기준에 따라 일률적으로 시간외근무시간을 산정할 필요가 있음을 부정할 수 없다. 따라서 공제조항을 시간선택제채용공무원이 통상의 근무시간 중 수행하는 시간외근무에 적용하는 것은 시간선택제채용공무원의 평등권을 침해하지만, 그 외 시간의 시간외근무에 대해서 적용하는 것이 이들의 권리를 침해한다고 볼 수는 없다(만일 통상의 근무시간 외에 수행한 시간외근무시간이 1시간에 미달하는 경우에는 그 시간만을 공제하면 될 것이다).",
    "참조조문": "헌법 제11조 제1항, 국가공무원법 제47조 제1항 제2호, 공무원수당 등에 관한 규정 제15조 제5항 제2호 (나)목",
    "참조판례": "헌법재판소 2002. 10. 31. 선고 2002헌라2 전원재판부 결정(헌공74, 894)",
    "판례내용": "【원고, 상고인】                원고 1 외 1인 (소송대리인 변호사 차현일 외 1인)\n【피고, 피상고인】 대한민국 (소송대리인 정부법무공단 담당변호사 조철호 외 3인)\n【원심판결】  서울고법 2021. 11. 17. 선고 2020누37187 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유를 판단한다. \n  1. 사안의 개요\n  가. 원고들은 전일제공무원의 통상적인 근무시간(1일 8시간, 1주 40시간)보다 짧은 시간을 근무하기로 하여 임용된 시간선택제채용공무원으로, 9시부터 14시까지 1일 4시간(점심시간 제외), 1주 20시간을 근무하기로 정하여 임용되었다.\n  나. 공무원수당 등에 관한 규정 제15조는 근무명령에 따라 규정된 근무시간 외에 근무한 사람에게는 예산의 범위에서 시간외근무수당을 지급하되(제1항 본문), 원칙적으로 시간외근무수당이 지급되는 근무명령 시간은 1일 4시간, 1개월 57시간을 초과할 수 없으며(제4항), 현업공무원 등 외의 공무원이 공휴일 및 토요일 외의 날에 시간외근무를 하는 경우 해당 일의 시간외근무시간에서 1시간을 뺀 시간을 더하여 월별 시간외근무시간을 산정한다[제5항 제2호 (나)목, 이하 ‘이 사건 공제조항’이라 한다]고 규정한다.\n  다. 원고들은 원심판결 별지 ‘시간외근무내역’ 기재와 같이 시간외근무를 하였는데, 피고는 이 사건 공제조항에 따라 원고들의 해당 일 시간외근무시간에서 1시간을 뺀 시간을 더하여 월별 시간외근무시간을 산정하고, 이에 따른 시간외근무수당을 원고들에게 지급하였다. \n  라. 원고들은 아래와 같이 주장하면서 피고가 이 사건 공제조항에 따라 공제한 시간외근무시간에 대한 시간외근무수당을 청구하는 이 사건 소를 제기하였다. \n  1) 이 사건 공제조항은 전일제공무원의 시간외근무가 통상의 근무시간(9시부터 18시까지 중 점심시간 1시간을 제외한 8시간을 말한다. 이하 같다) 외에 이루어짐으로써 시간외근무시간 중 저녁식사 시간이나 휴게시간을 가지게 되는 업무관행을 전제로 한 것이다. \n  2) 그러나 원고들과 같은 시간선택제채용공무원은 14시 이후 전일제공무원의 통상의 근무시간에 속하는 시간외근무를 하더라도 별도의 식사시간이나 휴게시간을 가질 수 없다.\n  3) 그런데도 통상의 근무시간에 수행한 시간외근무에 이 사건 공제조항을 그대로 적용하는 것은 원고들의 평등권과 재산권을 침해하므로 위 시간외근무에 이 사건 공제조항을 적용해서는 안 된다.\n  마. 원심은 시간선택제채용공무원인 원고들의 시간외근무에 대하여 이 사건 공제조항을 적용하는 것이 원고들의 평등권이나 재산권을 침해한다고 보기 어렵다는 이유로 원고들의 청구를 모두 기각하는 취지의 판결을 선고하였고, 원고들이 상고하였다.\n  2. 이 사건 공제조항을 시간선택제채용공무원이 통상의 근무시간에 수행하는 시간외근무에도 적용할 수 있는지 여부\n  가. 헌법 제11조 제1항에서 말하는 평등의 원칙은 본질적으로 같은 것을 다르게, 다른 것을 같게 자의적으로 취급함을 금지하는 것으로서, 입법을 하고 법을 적용할 때에 합리적인 근거가 없는 차별을 하여서는 아니 된다는 상대적 평등을 뜻한다(대법원 2007. 10. 29. 선고 2005두14417 전원합의체 판결 등 참조).\n  나. 이 사건 공제조항은 시간선택제채용공무원이 통상의 근무시간에 수행하는 시간외근무에는 적용되지 않는다고 봄이 타당하다. 그 이유는 다음과 같다. \n  1) 통상의 근무시간 외에 수행하는 시간외근무의 경우, 업무의 관행상 조기출근을 하더라도 정식 업무개시시각 이전에는 실제로 업무를 수행하지 않거나 정식의 퇴근시간 이후에도 시간외근무를 시작하기까지에는 실제로 업무를 수행하지 않는 어느 정도의 시간이 존재하는 경우가 많고, 시간외근무의 수행 시에 대부분 석식 내지 휴게시간을 가진다고 볼 수 있다. 이 사건 공제조항은 실제로 업무를 수행하지 않는 이러한 시간을 공제하여 실제 업무를 수행하는 시간에 대하여서만 시간외근무수당을 지급하기 위한 것이다(헌법재판소 2002. 10. 31. 선고 2002헌라2 전원재판부 결정 참조).\n  2) 통상의 근무시간 중 일부만 근무하도록 되어 있는 시간선택제채용공무원의 경우에는 시간외근무수당이 지급되는 1일 4시간의 시간외근무가 대부분 통상의 근무시간 내에 이루어지게 된다. 전일제공무원들이 정상적으로 근무하는 통상의 근무시간 중에는 석식 시간이 필요하지 않고 상급자의 지휘ㆍ감독 아래 전일제공무원들의 조직적 업무수행이 계속되는 가운데 시간선택제채용공무원만 휴게시간을 갖는 일도 흔히 있을 수 있다고 보이지 않는다. \n  3) 통상의 근무시간에 수행하는 시간외근무와 그 이외의 시간에 수행하는 시간외근무 사이에는 실제로 업무를 수행하지 않는 시간이 있을 개연성이나 상급자의 업무 지휘ㆍ감독 가능성, 근무 강도 등에 적지 않은 차이가 존재한다. 그럼에도 시간선택제채용공무원이 통상의 근무시간에 수행한 시간외근무시간에 대하여 이 사건 공제조항을 동일하게 적용하는 것에는 합리적 이유가 있다고 보기 어렵다. 이는 국가공무원법 제47조 제1항 제2호에서 ‘공무원의 수당에 관한 사항은 대통령령으로 정한다.’고 규정하여, 공무원이 지급받는 수당의 구체적 내용에 관하여 대통령령에 광범위한 재량을 부여하고 있음을 고려하더라도 마찬가지이다.\n  가) 이 사건 공제조항의 취지는 실제 업무를 수행한 시간에 대하여만 시간외근무수당을 지급하고자 하는 것인데, 앞서 본 바와 같이 시간선택제채용공무원이 통상의 근무시간에 수행하는 시간외근무 중에는 전일제공무원이 통상의 근무시간 외에 수행하는 시간외근무와 달리 석식 시간이나 휴게시간이 흔히 포함된다고 보기 어렵다. 그럼에도 이러한 경우에까지 이 사건 공제조항을 적용하는 것은 입법 취지에 부합한다고 볼 수 없고, 시간선택제채용공무원이 통상의 근무시간 외에 수행한 시간외근무에 대하여만 1시간을 공제하더라도 이 사건 공제조항의 목적은 충분히 달성될 수 있다.\n  나) 공무원수당 등에 관한 규정 제15조 제6항 및 그 위임을 받은 공무원보수 등의 업무지침(인사혁신처 예규)은 이 사건 공제조항에서 일괄적으로 시간외근무시간에서 1시간을 공제하도록 함에 따라 실제로 업무를 수행한 자가 받게 되는 불이익을 보전하기 위하여 월 10시간에 해당하는 정액의 시간외근무수당을 별도로 지급하도록 정하였다. 그러나 이는 ‘정규 근무일을 기준으로 월간 출근(또는 출장) 근무일수가 15일 이상인 공무원’에게 지급하도록 규정되어 있어, 시간외근무를 전혀 하지 않아 이 사건 공제조항으로 인한 불이익이 없는 공무원에게도 동일하게 지급된다. 이처럼 시간외근무로 인한 이 사건 공제조항 적용 여부와 무관하게 정액의 시간외근무수당을 일괄적으로 지급하도록 하는 위 규정만으로는 시간선택제채용공무원과 전일제공무원의 시간외근무 형태 차이에도 불구하고 이 사건 공제조항을 일률적으로 적용함으로써 발생하는 시간선택제채용공무원의 불이익이 온전히 보전된다고 보기 어렵다.\n  또한 별도의 정액 시간외근무수당은 이 사건 공제조항의 일률적 적용으로 인한 불이익을 상쇄하기 위하여 지급되는 것으로 소정근로시간에 비례하여 지급되어야 할 성질의 것은 아니다. 따라서 전일제공무원과 비교하여 시간선택제채용공무원의 시간외근무시간이 일반적으로 더 짧다는 사정이 인정되지 않는 이상 시간선택제채용공무원이 소정근로시간의 차이에도 불구하고 전일제공무원과 동일한 정액 시간외근무수당을 받는다 하여 앞서 본 바와 같은 상대적 불이익이 상쇄된다고 단정하기도 어렵다.\n  다) 통상의 근무시간에 시간외근무를 수행하게 되는 공무원이 시간선택제채용공무원만 있는 것은 아니다. 그러나 전일제공무원 중 탄력근무자나 시간선택제전환공무원 등이 스스로 그러한 근무형태를 선택하고 원할 때 벗어날 수 있는 것과 달리, 시간선택제채용공무원은 그 근무형태를 임의로 바꿀 수 없다. 여기에 시간선택제채용공무원의 시간외근무가 빈번히 발생하고, 시간외근무시간을 포함하면 전체 근무시간이 전일제공무원의 정규 근무시간에 육박하는 경우도 있는 점까지 고려하면, 이 사건 공제조항으로 인해 시간선택제채용공무원이 받는 불이익이 정당화된다고 보기 어렵다.\n  4) 시간선택제채용공무원이 실제 저녁식사를 하지 않고 19시 무렵까지 계속 시간외근무를 하다가 퇴근한 경우에 이 사건 공제조항을 적용하게 되면 이 사건 공제조항의 입법 취지에 반하는 결과가 발생하기는 한다. 그러나 이러한 문제는 전일제공무원에게도 동일하게 나타나므로 시간선택제채용공무원에 대한 차별로 볼 수 없고, 현재의 근태관리 체계에서는 시간외근무시간에 실제 업무를 수행하였는지 여부를 일일이 파악하는 것이 현실적으로 어렵다는 점에서 공무원 개인의 구체적 사정을 고려하지 않고 일정한 기준에 따라 일률적으로 시간외근무시간을 산정할 필요가 있음을 부정할 수 없다. 따라서 이 사건 공제조항을 시간선택제채용공무원이 통상의 근무시간 중 수행하는 시간외근무에 적용하는 것은 시간선택제채용공무원의 평등권을 침해하지만, 그 외 시간의 시간외근무에 대해서 적용하는 것이 이들의 권리를 침해한다고 볼 수는 없다(만일 통상의 근무시간 외에 수행한 시간외근무시간이 1시간에 미달하는 경우에는 그 시간만을 공제하면 될 것이다).\n  다. 따라서 원심에서 원고들이 통상의 근무시간에 수행한 시간외근무에 대해서까지 이 사건 공제조항이 적용된다고 판단한 것은 앞서 본 바와 같은 평등권 및 이 사건 공제조항의 적용 범위에 관한 법리 등을 오해하여 판결에 영향을 미친 잘못이 있다. 그러나 원심이 원고들이 18시 이후 수행한 시간외근무에 대하여 이 사건 공제조항이 적용된다고 판단한 것은 이유 설시가 적절하지 않은 부분이 있으나 결과적으로 정당한 것으로서 수긍할 수 있고, 거기에 위 법리 등을 오해하여 판결에 영향을 미친 잘못이 없다.\n  3. 파기의 범위\n  시간외근무수당이 지급되는 시간외근무시간은 월별로 산정하되, 1일 시간외근무시간을 분 단위까지 더하여 월별 시간외근무시간을 산정한 후 1시간 미만을 버리는 방식에 의하고, 월별 시간외근무시간은 1개월에 57시간을 초과할 수 없다(공무원수당 등에 관한 규정 제15조 제4항, 제5항). 따라서 원고들의 시간외근무수당 청구의 구체적인 인용 범위는 환송 후 원심에서 파기 취지를 고려하여 위와 같은 상한과 산정방법에 따라서 다시 산정되어야 하므로 결국 원심판결을 전부 파기하여야 한다.\n  4. 결론\n  나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 서경환(재판장) 천대엽 신숙희 마용주(주심)"

    "판결요지": "[1] 침익적 행정처분의 근거 규정은 엄격하게 해석ㆍ적용해야 하고 처분상대방에게 불리한 방향으로 지나치게 확장해석하거나 유추해석해서는 안 되지만, 목적론적 해석이 배제되는 것은 아니므로 문언의 가능한 의미를 벗어나지 않는 범위에서 입법 취지와 목적 등을 고려할 수 있다. 침익적 행정처분의 일종인 시정명령의 내용과 범위를 판단할 때에는 그 근거 규정의 구체적인 문언을 기초로 하여 시정명령을 규정한 개별 법률의 취지와 목적 등을 고려한 해석이 이루어져야 한다.\n [2] 구 영유아보육법(2023. 12. 26. 법률 제19840호로 개정되기 전의 것, 이하 같다) 제44조의 문언, 영유아보육법의 목적 및 관련 법령의 규정 내용과 체제 등에 비추어 살펴보면, 구 영유아보육법 제24조 제1항에 따른 어린이집 운영기준을 위반한 행위가 있었더라도 그 위반행위가 이미 중지되고 그로 인한 위법한 결과나 상태가 더 이상 존재하지 않는 경우에는 구 영유아보육법 제44조에 근거하여 그 위반행위와 동일한 유형의 위반행위 반복금지를 명하는 시정명령을 할 수 없다고 보아야 한다. 구체적인 이유는 다음과 같다.\n ① 구 영유아보육법 제44조는 어린이집이 각 호의 어느 하나에 해당하면(제4호에서 ‘제24조 제1항에 따른 어린이집의 운영기준을 위반한 경우’를 정하고 있다) 보건복지부장관 등은 어린이집의 원장 또는 설치ㆍ운영자에게 ‘기간을 정하여’ ‘그’ 시정 또는 변경을 명할 수 있다고 규정하고 있을 뿐, 동일한 유형의 위반행위를 반복하지 말 것까지 시정명령의 내용으로 삼을 수 있다고 규정하고 있지는 않다. ‘시정’의 사전적 의미는 ‘잘못된 것을 바로잡음’이고, 원칙적으로 시정명령은 과거의 특정한 법규 위반을 대상으로 그 위반행위를 바로잡도록 함으로써 정상적인 법질서 회복을 목적으로 한다. 위와 같은 규정의 문언과 체계 및 시정명령의 목적ㆍ취지에 비추어 보면, 구 영유아보육법 제44조의 시정명령은 장래 동일한 유형의 위반행위 반복금지 명령을 허용하는 것이 아니라 당해 위반행위를 중지하게 하거나 그로 인하여 현실로 존재하는 위법한 결과나 상태를 바로잡기 위한 것이라고 보아야 한다.\n ② 구 영유아보육법 제45조 제1항 제3호는 어린이집을 설치ㆍ운영하는 자가 제44조에 따른 시정명령을 위반한 경우 보건복지부장관 등이 1년 이내의 어린이집 운영정지나 폐쇄를 명할 수 있다고 규정할 뿐, 제24조 제1항에 따른 어린이집 운영기준 위반행위 자체를 사유로 하여 운영정지 또는 폐쇄를 명할 수 있다고 규정하고 있지 않다. 그런데 운영기준 위반행위가 중지되고 그로 인한 위법한 결과나 상태가 더는 존재하지 않음에도 장래 동일한 유형의 위반행위 반복금지를 명하는 시정명령이 가능하다고 본다면, 그러한 시정명령을 통해서 향후 다시 발생하는 운영기준 위반행위 자체를 사유로 하여 운영정지 또는 폐쇄를 명하는 것이 우회적으로 허용되는 결과가 되어, 영유아보육법이 당초 예정한 제재의 범위가 부당하게 확대될 수 있다. 이익침해적 제재규정의 엄격해석 원칙 등에 비추어 볼 때 그와 같은 해석은 받아들이기 어렵고, 그 위반행위 자체 또는 반복된 위반행위를 대상으로 제재처분을 하려면 별도의 근거 규정을 두어야 한다.",

    "판례내용": "【원고, 피상고인】                원고            \n【피고, 상고인】 김포시장 (소송대리인 법무법인 지혜로 담당변호사 김지원)\n【원심판결】  서울고법 2023. 7. 19. 선고 2022누65322 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 피고가 부담한다. \n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 준비서면의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 제1, 2 상고이유에 대하여\n  원심은 판시와 같은 이유로 다음과 같이 판단하였다. 이 사건 어린이집을 운영하는 원고가 ‘어린이집 운영에 관한 규정’(이하 ‘운영규정’이라 한다) 및 ‘통합안전점검표(급식)’를 어린이집에 갖춰 두지 않아 구 영유아보육법(2023. 12. 26. 법률 제19840호로 개정되기 전의 것, 이하 ‘구 영유아보육법’이라 한다) 제24조 제1항, 영유아보육법 시행규칙 제23조, [별표 8] 제2호 (아)목 10), 11)을 위반(이하 ‘이 사건 위반행위’라 한다)하기는 하였으나, 이 사건 처분 이전에 운영규정 및 통합안전점검표(급식)를 작성하여 이 사건 어린이집에 갖춰 둠으로써 이 사건 위반행위를 중지하였다. 이미 중지된 위반행위에 대해 피고가 구 영유아보육법 제44조를 근거로 그 위반행위의 중지를 명하는 시정명령을 할 수는 없으므로, 이 사건 처분 중 ‘7일 이내에 운영규정 및 통합안전점검표(급식)를 비치하라.’는 내용으로 이 사건 위반행위의 중지를 명한 부분은 위법하다. \n  관련 법리와 기록에 비추어 살펴보면, 이러한 원심의 판단에 상고이유 주장과 같이 위반행위 존부의 판단 시점에 관한 법리오해 및 위반행위 시정 여부에 관한 채증법칙 위반, 심리미진 등으로 판결에 영향을 미친 잘못이 없다.\n  2. 제3 상고이유에 대하여\n  가. 침익적 행정처분의 근거 규정은 엄격하게 해석ㆍ적용해야 하고 처분상대방에게 불리한 방향으로 지나치게 확장해석하거나 유추해석해서는 안 되지만, 목적론적 해석이 배제되는 것은 아니므로 문언의 가능한 의미를 벗어나지 않는 범위에서 입법 취지와 목적 등을 고려할 수 있다(대법원 2012. 2. 23. 선고 2011두23337 판결, 대법원 2024. 5. 30. 선고 2021두58202 판결 등 참조). 침익적 행정처분의 일종인 시정명령의 내용과 범위를 판단함에 있어서는 그 근거 규정의 구체적인 문언을 기초로 하여 시정명령을 규정한 개별 법률의 취지와 목적 등을 고려한 해석이 이루어져야 한다.\n  나.                구 영유아보육법 제44조의 문언, 영유아보육법의 목적 및 관련 법령의 규정 내용과 체제 등에 비추어 살펴보면, 구 영유아보육법 제24조 제1항에 따른 어린이집 운영기준을 위반한 행위가 있었더라도 그 위반행위가 이미 중지되고 그로 인한 위법한 결과나 상태가 더 이상 존재하지 않는 경우에는 구 영유아보육법 제44조에 근거하여 그 위반행위와 동일한 유형의 위반행위 반복금지를 명하는 시정명령을 할 수 없다고 보아야 한다. 구체적인 이유는 다음과 같다. \n  1)                구 영유아보육법 제44조는 어린이집이 그 각 호의 어느 하나에 해당하면(제4호에서 ‘제24조 제1항에 따른 어린이집의 운영기준을 위반한 경우’를 정하고 있다) 보건복지부장관 등은 어린이집의 원장 또는 그 설치ㆍ운영자에게 ‘기간을 정하여’ ‘그’ 시정 또는 변경을 명할 수 있다고 규정하고 있을 뿐, 동일한 유형의 위반행위를 반복하지 말 것까지 시정명령의 내용으로 삼을 수 있다고 규정하고 있지는 않다. ‘시정’의 사전적 의미는 ‘잘못된 것을 바로잡음’이고, 원칙적으로 시정명령은 과거의 특정한 법규 위반을 대상으로 그 위반행위를 바로잡도록 함으로써 정상적인 법질서 회복을 목적으로 한다. 위와 같은 규정의 문언과 체계 및 시정명령의 목적ㆍ취지에 비추어 보면, 구 영유아보육법 제44조의 시정명령은 장래 동일한 유형의 위반행위 반복금지 명령을 허용하는 것이 아니라 당해 위반행위를 중지하게 하거나 그로 인하여 현실로 존재하는 위법한 결과나 상태를 바로잡기 위한 것이라고 보아야 한다.\n  2)                구 영유아보육법 제45조 제1항 제3호는 어린이집을 설치ㆍ운영하는 자가 제44조에 따른 시정명령을 위반한 경우 보건복지부장관 등이 1년 이내의 어린이집 운영정지나 폐쇄를 명할 수 있다고 규정할 뿐, 제24조 제1항에 따른 어린이집 운영기준 위반행위 자체를 사유로 하여 운영정지 또는 폐쇄를 명할 수 있다고 규정하고 있지 않다. 그런데 운영기준 위반행위가 중지되고 그로 인한 위법한 결과나 상태가 더는 존재하지 않음에도 장래 동일한 유형의 위반행위 반복금지를 명하는 시정명령이 가능하다고 본다면, 그러한 시정명령을 통해서 향후 다시 발생하는 운영기준 위반행위 자체를 사유로 하여 운영정지 또는 폐쇄를 명하는 것이 우회적으로 허용되는 결과가 되어, 영유아보육법이 당초 예정한 제재의 범위가 부당하게 확대될 수 있다. 이익침해적 제재규정의 엄격해석 원칙 등에 비추어 볼 때 그와 같은 해석은 받아들이기 어렵고, 그 위반행위 자체 또는 반복된 위반행위를 대상으로 제재처분을 하려면 별도의 근거 규정을 두어야 한다.\n  다. 원심은 판시와 같은 이유로, 당해 위반행위가 중지되고 그로 인한 위법한 결과가 소멸한 후에는 피고가 구 영유아보육법 제44조에 근거하여 재발방지를 목적으로 장래 동일한 유형의 위반행위 반복금지를 명하는 내용의 시정명령을 할 수 없다고 보아, 이 사건 처분 중 이미 중지된 이 사건 위반행위와 동일한 유형의 위반행위 반복금지를 명한 부분은 위법하다고 판단하였다.\n  라. 앞서 본 법리에 비추어 보면, 이러한 원심의 판단은 정당하고 거기에 상고이유 주장과 같이 영유아보육법상 시정명령에 관한 법리오해 등으로 판결에 영향을 미친 잘못이 없다. 상고이유에서 들고 있는 대법원 판례들은 이 사건에 적용되는 구 영유아보육법 제44조에 따른 시정명령에 관한 것이 아니어서 원용하기에 적절하지 않다.\n  3. 결론 \n  상고를 기각하고 상고비용은 패소자가 부담하게 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오경미(재판장) 권영준 엄상필(주심) 박영재"

    "판시사항": "국유재산법 시행령 제29조 제6항 본문의 ‘경쟁입찰로 사용허가를 하는 경우 2차 연도 이후 기간의 사용료 계산식’에서 ‘입찰 당시의 재산가액’은 ‘입찰로 결정된 첫해 사용료의 산정기준이 된 재산가액 결정 당시의 해당 재산가액’이 아닌 ‘입찰이 이루어진 해의 개별공시지가’를 기초로 산출해야 하는지 여부(적극)",
    "판결요지": "국유재산법 제32조 제1항 본문, 국유재산법 시행령 제29조 제2항 제1호, 제6항 본문의 문언, 체계 및 입법 취지 등을 종합하면, 위 시행령 제29조 제6항 본문의 ‘경쟁입찰로 사용허가를 하는 경우 2차 연도 이후 기간의 사용료 계산식’[(입찰로 결정된 첫해의 사용료) × (제2항에 따라 산출한 해당 연도의 재산가액) ÷ (입찰 당시의 재산가액)]에서 ‘입찰 당시의 재산가액’은 ‘입찰이 이루어진 해의 개별공시지가’를 기초로 산출하여야 한다고 보는 것이 타당하다. 구체적인 이유는 다음과 같다.\n ① 위 계산식에서의 ‘입찰 당시의 재산가액’은 ‘입찰이 이루어진 때의 재산가액’이라고 해석하는 것이 문언상 자연스럽다. 이를 ‘입찰로 결정된 첫해 사용료의 산정기준이 된 재산가액 결정 당시의 해당 재산가액’이라고 보는 것은 ‘입찰 당시’라는 문언의 통상적인 의미를 벗어난다.\n ② 경쟁입찰로 사용허가를 하는 경우 입찰 예정가격은 입찰 참가를 위한 최저한도를 의미할 뿐이고 통상적으로 낙찰가격은 예정가격보다 높게 형성된다. 그렇다면 비록 예정가격이 입찰공고 시점으로부터 가장 최근에 공시된 개별공시지가를 적용하여 산출되었더라도, ‘입찰로 결정된 첫해의 사용료’는 위와 같은 개별공시지가와 직접적으로 관련되지 않는 셈이다. 즉 ‘입찰로 결정된 첫해의 사용료’는 낙찰가인 최고 입찰가격으로 결정되는 것이지 가장 최근에 공시된 개별공시지가를 적용하여 산출된 예정가격과 연동하여 결정되는 것은 아니다.\n ③ 국유재산법 시행령 제29조 제6항 본문이 2차 연도 이후의 사용료를 위 계산식에 따라 산출하도록 규정한 취지는 낙찰가에 해당하는 ‘입찰로 결정된 첫해의 사용료’를 기준으로 매년 재산가액의 변동률을 2차 연도 이후의 사용료에 반영하고자 하는 데 있다. 그런데 만약 ‘입찰 당시의 재산가액’을 ‘입찰로 결정된 첫해 사용료의 산정기준이 된 재산가액 결정 당시의 해당 재산가액’으로 해석한다면 국유재산의 사용기간에 포함되지 않은 기간의 재산가액 변동률까지 추가적으로 고려하여 사용료가 산정될 수 있을 뿐만 아니라 2년치의 재산가액 증가분이 한꺼번에 반영될 여지도 있어 위 계산식을 둔 입법 목적과 취지에 부합하지 않는다.\n ④ 위 계산식에서의 ‘입찰 당시의 재산가액’을 ‘입찰이 이루어진 때의 재산가액’으로 해석할 경우 재산가액 증가분 중 일부가 제대로 반영되지 못하게 될 우려가 있더라도, 이는 법령의 개정을 통해 해결할 문제이지 법령 해석으로 해결할 수 있는 문제가 아니다.",

    "판례내용": "【원고, 상고인】                ○○역사 주식회사 (소송대리인 변호사 김의환 외 2인)\n【피고, 피상고인】 국가철도공단 (소송대리인 변호사 권경현)\n【원심판결】  서울고법 2023. 8. 31. 선고 2022누64459 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위 내에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 의하면 다음과 같은 사실을 알 수 있다.\n  가. 원고는 1987년경부터 △△△역사(○○백화점 △△△점으로 사용 중인 부분)를 점용하여 온 회사이고, 피고는 철도산업발전기본법 제19조 제2항 등에 따라 △△△역사에 대한 관리 업무를 위임받은 공공기관이다.\n  나. 피고는 2019. 5. 3.부터 같은 해 6. 3.까지 △△△역사 신규 사용인 선정을 위한 △△△역사 사용허가 공모를 실시하였는데, 건물에 관하여는 2019년도 시가표준액을 적용하고 토지에 관하여는 입찰공고일인 2019. 5. 3. 당시 2019년도 개별공시지가가 아직 공시되지 않아 2018년도 개별공시지가를 적용하여 예정가격을 산출하면서 예정가격 이상으로 입찰한 자 중 최고가격 입찰자를 낙찰자로 결정한다고 명시하였다. \n  다. 공모 결과 최고 입찰가격을 제시한 원고가 2019. 6. 28.경 △△△역사의 사용인으로 최종 선정되어, 피고는 2019. 12. 26. 원고에게 서울 △△△구 △△△동 (지번 생략) 외 6필지 토지 및 지상 건물에 관하여 사용기간을 2020. 1. 1.부터 2024. 12. 31.까지로, 2020년도 사용료를 낙찰가인 25,150,020,000원(부가가치세 별도)으로 하되 다음 연도의 사용료는 국유재산법 시행령 제29조 및 제31조에 따라 매년 결정하기로 정하여 사용ㆍ수익허가를 하였다. 이후 2020년도 사용료는 토지 면적의 일부 축소로 인해 25,039,894,617원(부가가치세 별도)으로 감액되었다. \n  라. 피고는 원고에 대하여 2020. 12. 22. 2021년도 사용료 30,022,833,640원(부가가치세 포함), 2021. 12. 9. 2022년도 사용료 32,724,888,660원(부가가치세 포함)을 각 부과하였다(이하 위 각 사용료 부과처분을 통틀어 ‘이 사건 처분’이라고 한다). \n  2. 관련 규정 및 쟁점\n  가. 국유재산법 제32조 제1항 본문은 \"행정재산을 사용허가한 때에는 대통령령으로 정하는 요율과 산출방법에 따라 매년 사용료를 징수한다.\"라고 규정하고 있다. 그 위임에 따른 국유재산법 시행령 제29조 제2항 제1호는 사용료를 계산할 때 토지의 재산가액은 ‘사용료 산출을 위한 재산가액 결정 당시의 개별공시지가’를 적용하여 산출한다고 규정하고, 같은 조 제6항 본문은 경쟁입찰로 사용허가를 하는 경우 첫해의 사용료는 최고입찰가로 결정하며 2차 연도 이후 기간의 사용료는 [(입찰로 결정된 첫해의 사용료) × (제2항에 따라 산출한 해당 연도의 재산가액) ÷ (입찰 당시의 재산가액)]의 계산식(이하 ‘이 사건 계산식’이라고 한다)에 따라 산출한다고 규정하고 있다.\n  나. 피고는 이 사건 계산식 중 ‘입찰 당시의 재산가액’을 산출하면서, 입찰이 이루어진 2019년도 개별공시지가가 아니라 입찰 예정가격 산정의 기준이 된 2018년도 개별공시지가를 적용하였다. 따라서 이 사건의 쟁점은 이 사건 계산식 중 ‘입찰 당시의 재산가액’을 ‘입찰이 이루어진 해의 개별공시지가’를 기초로 산출하여야 하는지 아니면 ‘입찰 예정가격 산정의 기준이 된 재산가액 결정 당시의 개별공시지가’를 기초로 산출하여야 하는지 여부이다. \n  3. 원심의 판단\n  원심은 아래와 같은 이유 등을 들어, 이 사건 계산식에서 ‘입찰 당시의 재산가액’은 ‘입찰로 결정된 첫해 사용료 산정의 기준이 된 재산가액 결정 당시의 해당 재산가액’으로 해석하여야 하므로, 첫해 사용료 산정의 기준이 된 2018년도 개별공시지가를 토대로 2021년도 및 2022년도 사용료를 산정한 이 사건 처분이 적법하다고 판단하였다.\n  가. 이 사건 계산식은 2차 연도 이후의 사용료를 산정할 때 ‘입찰로 결정된 첫해의 사용료’를 기준으로 매년 재산가액의 변동률을 반영하고자 하는 취지이므로, ‘입찰 당시의 재산가액’을 산정할 경우에도 ‘입찰로 결정된 첫해의 사용료’에 반영된 예정가격의 산정기준과 동일한 기준의 개별공시지가가 적용된다고 해석하는 것이 위와 같은 취지에 부합한다. \n  나. 만일 위와 같이 해석하지 아니하면, 재산가치 변동을 반영하지 못한 사용료가 산출되거나 입찰공고 시점에 개별공시지가가 공시되었는지 여부라는 우연한 사정에 따라 2차 연도 이후의 사용료가 달라지는 부당한 결과가 초래될 수 있다.\n  다. 실제로 원고는 2018년도 개별공시지가가 반영된 예정가격을 바탕으로 최고 입찰가격을 제시하여 위 국유재산을 낙찰 받았는데, 이러한 경위 등에 비추어 보면 낙찰가에 해당하는 ‘입찰로 결정된 첫해의 사용료’가 예정가격과 별개로 정해졌다고 볼 수 없으므로, 예정가격을 ‘입찰 당시의 재산가액’에 고려할 필요가 있다.\n  4. 대법원의 판단\n  가. 침익적 행정처분은 상대방의 권익을 제한하거나 상대방에게 의무를 부과하는 것이므로 헌법상 요구되는 명확성의 원칙에 따라 그 근거가 되는 행정법규를 더욱 엄격하게 해석ㆍ적용해야 하고, 행정처분의 상대방에게 지나치게 불리한 방향으로 확대해석이나 유추해석을 해서는 아니 된다. 그 입법 취지와 목적 등을 고려한 목적론적 해석이 전적으로 배제되는 것은 아니라고 하더라도 그 해석이 문언의 통상적인 의미를 벗어나서는 아니 된다(대법원 2023. 6. 29. 선고 2023두31782 판결 등 참조).\n  나. 앞서 본 관련 규정의 문언, 체계 및 입법 취지 등을 종합하면, 이 사건 계산식에서 ‘입찰 당시의 재산가액’은 ‘입찰이 이루어진 해의 개별공시지가’를 기초로 산출하여야 한다고 봄이 타당하다. 그 구체적인 이유는 다음과 같다.\n  1) 이 사건 계산식에서의 ‘입찰 당시의 재산가액’은 ‘입찰이 이루어진 때의 재산가액’이라고 해석하는 것이 문언상 자연스럽다. 원심과 같이 이를 ‘입찰로 결정된 첫해 사용료의 산정기준이 된 재산가액 결정 당시의 해당 재산가액’이라고 보는 것은 ‘입찰 당시’라는 문언의 통상적인 의미를 벗어난다. \n  2) 경쟁입찰로 사용허가를 하는 경우 입찰 예정가격은 입찰 참가를 위한 최저한도를 의미할 뿐이고 통상적으로 낙찰가격은 예정가격보다 높게 형성된다. 그렇다면 비록 예정가격이 입찰공고 시점으로부터 가장 최근에 공시된 개별공시지가를 적용하여 산출되었다고 하더라도, ‘입찰로 결정된 첫해의 사용료’는 위와 같은 개별공시지가와 직접적으로 관련되지 않는 셈이다. 즉 ‘입찰로 결정된 첫해의 사용료’는 낙찰가인 최고 입찰가격으로 결정되는 것이지 가장 최근에 공시된 개별공시지가를 적용하여 산출된 예정가격과 연동하여 결정되는 것은 아니다.\n  3)                국유재산법 시행령 제29조 제6항 본문이 2차 연도 이후의 사용료를 이 사건 계산식에 따라 산출하도록 규정한 취지는 낙찰가에 해당하는 ‘입찰로 결정된 첫해의 사용료’를 기준으로 매년 재산가액의 변동률을 2차 연도 이후의 사용료에 반영하고자 하는 데 있다. 그런데 만약 ‘입찰 당시의 재산가액’을 원심과 같이 해석한다면 국유재산의 사용기간에 포함되지 않은 기간의 재산가액 변동률까지 추가적으로 고려하여 사용료가 산정될 수 있을 뿐만 아니라 2년치의 재산가액 증가분이 한꺼번에 반영될 여지도 있어 이 사건 계산식을 둔 입법 목적과 취지에 부합하지 않는다. \n  4) 이 사건 계산식에서의 ‘입찰 당시의 재산가액’을 ‘입찰이 이루어진 때의 재산가액’으로 해석할 경우 재산가액 증가분 중 일부가 제대로 반영되지 못하게 될 우려가 있다고 하더라도, 이는 법령의 개정을 통해 해결할 문제이지 법령 해석으로 해결할 수 있는 문제가 아니다. \n  다. 그런데도 원심은 그 판시와 같은 이유만으로 이 사건 계산식 중 ‘입찰 당시의 재산가액’을 ‘입찰로 결정된 첫해 사용료의 산정기준이 된 재산가액 결정 당시의 해당 재산가액’으로 해석하여야 한다고 본 나머지, 2019년도가 아닌 2018년도 개별공시지가를 토대로 2021년도 및 2022년도 사용료를 산정한 이 사건 처분이 적법하다고 판단하였다. 이러한 원심의 판단에는 국유재산법 시행령 제29조 제6항에서 규정한 ‘입찰 당시의 재산가액’의 해석 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. \n  5. 결론\n  원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 천대엽(재판장) 신숙희 마용주(주심)"

    "판시사항": "[1] 구 군인사망급여금규정 제2조의 ‘그 지급사유가 발생한 날’로부터의 의미\n\n [2] 1955. 9. 2. 대통령령 제1086호로 개정된 군인사망급여금규정 제2조의 개정 취지 및 구 군인사망급여금규정 제1조에 따라 발생한 군인사망급여금 청구권의 소멸시효가 개정 군인사망급여금규정 제2조의 시행 당시 완성되지 않은 경우, 그 소멸시효에 관하여 개정 군인사망급여금규정 제2조가 적용되는지 여부(적극)",
    "판결요지": "[1] 구 군인사망급여금규정(1955. 9. 2. 대통령령 제1086호로 개정되기 전의 것, 이하 같다) 제1조에 따른 군인사망급여금은 군인 등이 전사 등으로 사망한 때 지급되는 것으로서, 유족은 그러한 지급사유가 발생한 때 군인사망급여금 청구권을 취득한다. 원칙적으로 소멸시효는 권리를 행사할 수 있는 때로부터 진행하는 것인데(민법 제166조 제1항), 군인사망급여금의 지급사유가 발생했는지가 객관적으로 분명하지 아니하여 유족이 과실 없이 그 지급사유의 발생을 알 수 없었던 경우에도, 구 군인사망급여금규정 제2조를 문언 그대로만 해석하여 지급사유가 발생한 날부터 소멸시효가 진행한다고 보는 것은 정의와 형평에 맞지 않을 뿐만 아니라 헌법상 재산권 보장이나 평등의 원칙, 소멸시효 제도의 존재이유에도 부합한다고 할 수 없다. 따라서 구 군인사망급여금규정 제2조의 ‘그 지급사유가 발생한 날’로부터의 의미는 유족이 군인 등의 사망 당시 그 지급사유 발생 사실을 안 때에는 그때부터 소멸시효가 진행하고, 객관적으로 보아 유족이 군인사망급여금의 지급사유가 발생한 사실을 확인할 수 없는 사정이 있는 경우에는 유족이 그 지급사유의 발생을 알았거나 알 수 있었던 때부터 소멸시효가 진행한다는 의미로 해석해야 한다.\n\n [2] 1955. 9. 2. 대통령령 제1086호로 개정된 군인사망급여금규정(이하 ‘개정 규정’이라 한다) 제2조의 개정 취지는, 6ㆍ25 전쟁이라는 특수한 상황에서 군인이 전사로 사망하더라도 유족으로서는 국가가 사망통지서 등을 통해서 그러한 사실을 객관적으로 확인하여 주지 않는 한 그 군인의 사망 여부 및 사유를 정확히 알기 어려운데도, 구 군인사망급여금규정(1955. 9. 2. 대통령령 제1086호로 개정되기 전의 것, 이하 같다) 제2조에서 전사 등 군인사망급여금의 지급사유가 발생한 날을 일괄적으로 소멸시효의 기산점으로 삼는 것은 그 자체로 부당하거나 불합리한 결과를 피할 수 없기 때문이다. 이러한 개정은 불평등 등을 시정하려는 반성적 고려의 결과이고, 이로써 군인사망급여금 청구권의 소멸시효 기산점은 유족이 국가로부터 사망통지서를 받아 군인사망급여금의 지급사유가 발생한 사실을 알았거나 알 수 있게 된 때가 되었다.\n  나아가 위와 같은 입법 연혁 및 취지 등에 비추어 보면, 개정 규정이 부칙에서 과거의 사실관계나 법률관계에도 적용되는지 명시하고 있지는 않지만, 개정 규정 제2조는 현재 진행 중인 사실관계나 법률관계를 대상으로 하는 부진정소급입법에 해당한다고 보아야 한다. 따라서 구 군인사망급여금규정 제1조에 따라 발생한 군인사망급여금 청구권의 소멸시효가 개정 규정 제2조의 시행 당시 완성되지 않은 경우, 그 소멸시효에 관하여는 개정 규정 제2조가 적용된다.",
    "참조조문": "[1] 구 군인사망급여금규정(1955. 9. 2. 대통령령 제1086호로 개정되기 전의 것) 제1조(현행 군인 재해보상법 제1조 참조), 제2조(현행 군인 재해보상법 제39조, 제49조 제1항 참조), 민법 제166조 제1항 / [2] 구 군인사망급여금규정(1955. 9. 2. 대통령령 제1086호로 개정되기 전의 것) 제1조(현행 군인 재해보상법 제1조 참조), 제2조(현행 군인 재해보상법 제39조, 제49조 제1항 참조), 구 군인사망급여금규정(1970. 3. 23. 대통령령 제4775호로 전부 개정되기 전의 것) 제2조(현행 군인 재해보상법 제39조, 제49조 제1항 참조), 부칙(1951. 2. 28.), 부칙(1953. 11. 10.)",
    "참조판례": "",
    "판례내용": "【원고, 상고인】                원고            \n【피고, 피상고인】 국군재정관리단장\n【원심판결】  서울고법 2024. 5. 17. 선고 2024누32463 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 의하면, 다음과 같은 사실을 알 수 있다. \n  가. 고 소외인(이하 ‘망인’이라 한다)은 1949. 2. 1. 육군에 입대하였고, 1950. 8. 6. 사망하였는데, 당초 망인의 사망은 ‘실종’으로 구분되었다. 이후 1963. 1. 3. 망인에 대한 사망신고가 이루어졌고, 육군본부는 1998. 3. 31. 망인의 사망을 ‘전사’로 처리하는 결정을 하였다.   \n  나. 망인의 자녀인 원고는 2022. 7. 25. 피고에게 망인에 관한 군인사망급여금의 지급을 청구하였다. 피고는 2022. 7. 29. 원고에게 \"구 군인사망급여금규정(1955. 9. 2. 대통령령 제1086호로 개정되기 전의 것, 이하 ‘이 사건 규정’이라 한다)에 따라 지급사유 발생일인 망인의 사망일 1950. 8. 6.부터 5년이 경과함으로써 소멸시효가 완성되어 망인에 대한 군인사망급여금의 지급이 불가하다.\"라는 결정을 통지하였다(이하 ‘이 사건 처분’이라 한다).   \n  다. 원고는 이 사건 처분에 불복하여 2022. 8. 3. 군인재해보상연금재심위원회에 심사를 청구하였으나, 위 위원회는 2022. 12. 16. ‘망인의 사망일인 1950. 8. 6.부터 5년이 경과하였고, 망인이 군 복무 중 실종되었음이 법률상 장애에 해당하여 소멸시효의 정지가 인정되더라도, 제적등본상 망인의 사망신고일 1963. 1. 3. 또는 육군의 전사 결정일 1998. 3. 31.부터 5년이 경과함으로써 소멸시효가 완성되어, 원고는 군인사망급여금 청구권을 행사할 수 없으므로, 이 사건 처분은 위법ㆍ부당하다고 할 수 없다.’고 보아 원고의 심사 청구를 기각하였다. \n  2. 판단 \n  가. 관련 규정\n  이 사건 규정은 제1조에서 군인ㆍ사관후보생 및 군속이 전사, 전병사 또는 군무수행 중 중대한 과실에 의하지 아니한 원인으로 사망한 때에는 사망급여금을 그 유족에게 지급하도록 규정하면서, 제2조에서 사망급여금은 ‘그 지급사유가 발생한 날’로부터 5년 이내에 청구하지 아니한 경우에는 지급하지 아니한다고 규정하였다.  \n  6ㆍ25 전쟁 중인 1951. 2. 28. 제정된 군인사망급여금규정은 부칙(1951. 2. 28.)에서 위 규정을 1950. 11. 20. 이후 사망한 자부터 소급하여 적용하기로 정하였다가, 6ㆍ25 전쟁의 휴전 후인 1953. 11. 10. 대통령령 제831호로 이 사건 규정과 같이 개정되면서 부칙(1953. 11. 10.)에서 이 사건 규정을 6ㆍ25 전쟁이 시작된 1950. 6. 25.부터 소급하여 적용하는 것으로 변경하였다. \n  이후 이 사건 규정이 1955. 9. 2. 대통령령 제1086호로 개정되면서(이하 위와 같이 개정된 군인사망급여금규정을 ‘이 사건 개정 규정’이라 한다), 제1조는 그대로 유지되었으나 제2조의 경우 사망급여금은 ‘사망통지서를 받은 날’로부터 5년 이내에 청구하지 아니한 경우 지급하지 아니한다고 변경되었다.\n  나. 관련 법리 \n  1)                이 사건 규정 제1조에 따른 군인사망급여금은 군인 등이 전사 등으로 사망한 때 지급되는 것으로서, 유족은 그러한 지급사유가 발생한 때 군인사망급여금 청구권을 취득한다. 원칙적으로 소멸시효는 권리를 행사할 수 있는 때로부터 진행하는 것인데(민법 제166조 제1항), 군인사망급여금의 지급사유가 발생하였는지 여부가 객관적으로 분명하지 아니하여 유족이 과실 없이 그 지급사유의 발생을 알 수 없었던 경우에도, 이 사건 규정 제2조를 문언 그대로만 해석하여 그 지급사유가 발생한 날부터 소멸시효가 진행한다고 보는 것은 정의와 형평에 맞지 않을 뿐만 아니라 헌법상 재산권 보장이나 평등의 원칙, 소멸시효 제도의 존재이유에도 부합한다고 할 수 없다. 따라서 이 사건 규정 제2조의 ‘그 지급사유가 발생한 날’로부터의 의미는 유족이 군인 등의 사망 당시 그 지급사유 발생 사실을 안 때에는 그때부터 소멸시효가 진행하고, 객관적으로 보아 유족이 군인사망급여금의 지급사유가 발생한 사실을 확인할 수 없는 사정이 있는 경우에는 유족이 그 지급사유의 발생을 알았거나 알 수 있었던 때부터 소멸시효가 진행한다는 의미로 해석하여야 한다.  \n  2)                이 사건 개정 규정 제2조의 개정 취지는, 6ㆍ25 전쟁이라는 특수한 상황에서 군인이 전사로 사망하더라도 유족으로서는 국가가 사망통지서 등을 통해서 그러한 사실을 객관적으로 확인하여 주지 않는 한 그 군인의 사망 여부 및 사유를 정확히 알기 어려운데도, 이 사건 규정 제2조에서 전사 등 군인사망급여금의 지급사유가 발생한 날을 일괄적으로 그 소멸시효의 기산점으로 삼는 것은 그 자체로 부당하거나 불합리한 결과를 피할 수 없기 때문이다. 이러한 개정은 불평등 등을 시정하려는 반성적 고려의 결과이고, 이로써 군인사망급여금 청구권의 소멸시효 기산점은 유족이 국가로부터 사망통지서를 받아 군인사망급여금의 지급사유가 발생한 사실을 알았거나 알 수 있게 된 때가 되었다.  \n  나아가 위와 같은 입법 연혁 및 취지 등에 비추어 보면, 이 사건 개정 규정이 그 부칙에서 과거의 사실관계나 법률관계에도 적용되는지 명시하고 있지는 않지만, 이 사건 개정 규정 제2조는 현재 진행 중인 사실관계나 법률관계를 대상으로 하는 부진정소급입법에 해당한다고 보아야 한다. 따라서 이 사건 규정 제1조에 따라 발생한 군인사망급여금 청구권의 소멸시효가 이 사건 개정 규정 제2조의 시행 당시 완성되지 않은 경우, 그 소멸시효에 관하여는 이 사건 개정 규정 제2조가 적용된다. \n  다. 이 사건의 판단 \n  1) 원심은, 이 사건 규정 제1조에 따라 망인의 유족인 원고에게 군인사망급여금 청구권이 발생하였다고 인정한 다음, 망인의 사망일인 1950. 8. 6.부터 원고가 위 청구권을 행사할 수 없는 상황이 계속되던 상황임을 전제로, 그 이후 망인에 대한 사망신고가 이루어진 1963. 1. 3. 또는 늦어도 망인에 대한 전사 결정이 있었던 1998. 3. 31. 무렵 원고가 위 청구권을 행사할 수 있었다고 보아, 위 각 일자를 소멸시효의 기산점으로 하여 시효기간인 5년이 도과함으로써 원고의 군인사망급여금 청구권은 소멸시효가 완성되었다고 판단하였다.\n  2) 앞서 본 사실관계를 관련 법리에 비추어 살펴보면, 원고가 망인의 사망일인 1950. 8. 6.부터 이 사건 개정 규정 제2조의 시행일인 1955. 9. 2.까지 망인의 전사에 따른 군인사망급여금 청구권이 발생한 사실을 알았거나 알 수 있었다고 볼 만한 사정을 발견할 수 없으므로, 이 사건 개정 규정 제2조의 시행일까지 원고의 위 청구권은 소멸시효가 완성되었다고 할 수 없다. 따라서 그 소멸시효의 기산점에 관하여는 이 사건 개정 규정 제2조가 적용된다고 보아야 한다.   \n  3) 그런데도 원심은, 위와 같이 이 사건 개정 규정 제2조가 적용됨을 간과한 나머지, 그 소멸시효 기산점인 원고가 국가로부터 망인의 사망통지서 또는 이에 준하는 통지를 받았거나 군인사망급여금의 지급사유가 발생한 사실을 알았거나 알 수 있게 된 때가 언제인지에 관하여 심리하지 아니한 채, 판시와 같은 이유만으로 소멸시효가 완성되었다고 판단하였다. 이러한 원심판단에는 군인사망급여금 청구권의 소멸시효 기산점 등에 관한 법리를 오해하여 필요한 심리를 다하지 아니함으로써 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 상고이유 주장은 이유 있다.\n  3. 결론 \n  원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 천대엽(재판장) 서경환 신숙희(주심) 마용주"
  },

    "판시사항": "행정청의 행위가 항고소송의 대상이 될 수 있는지 결정하는 방법 / 증명청이 인감증명서 발급신청을 거부하는 행위 및 등록된 인감을 말소하는 행위가 항고소송의 대상이 되는 행정처분에 해당하는지 여부(적극)",
    "판결요지": "행정청의 어떤 행위가 항고소송의 대상이 될 수 있는지의 문제는 추상적ㆍ일반적으로 결정할 수 없고, 구체적인 경우 행정처분은 행정청이 공권력의 주체로서 행하는 구체적 사실에 관한 법집행으로서 국민의 권리의무에 직접적으로 영향을 미치는 행위라는 점을 염두에 두고, 관련 법령의 내용과 취지, 그 행위의 주체ㆍ내용ㆍ형식ㆍ절차, 그 행위와 상대방 등 이해관계인이 입는 불이익과의 실질적 견련성, 그리고 법치행정의 원리와 당해 행위에 관련한 행정청 및 이해관계인의 태도 등을 참작하여 개별적으로 결정해야 한다. 인감증명은 인감 자체의 동일성을 증명함과 동시에 거래행위자의 동일성과 거래행위가 행위자의 의사에 의한 것임을 확인하는 자료로서 일반인의 거래상 매우 중요한 기능을 수행하고 있다. 인감의 등록은 인감증명제도를 활용하기 위한 전제요건으로서 해당 인감 출원자의 실체적 권리관계에 밀접하게 관련되어 있으므로, 증명청이 인감증명서 발급신청을 거부하는 행위뿐 아니라 등록된 인감을 말소하는 행위도 국민의 권리관계에 영향을 미치는 것으로서 항고소송의 대상이 되는 행정처분에 해당한다.",
    "참조조문": "행정기본법 제2조 제4호, 행정소송법 제2조 제1항 제1호",
    "참조판례": "대법원 1992. 1. 17. 선고 91누1714 판결(공1992, 916), 대법원 2008. 7. 24. 선고 2006다63273 판결(공2008하, 1223), 대법원 2010. 11. 18. 선고 2008두167 전원합의체 판결(공2010하, 2279), 대법원 2025. 5. 15. 선고 2024두35989 판결(공2025하, 1086)",
    "판례내용": "【원고, 상고인】                원고            \n【피고, 피상고인】 서울특별시 동작구청장 (소송대리인 법무법인 이유 담당변호사 변민혁 외 5인)\n【원심판결】  서울고법 2025. 10. 2. 선고 2025누6390 판결         \n【주    문】\n  원심판결 중 인감직권말소처분의 무효확인청구 및 부존재확인청구 부분과 손해배상청구 부분을 파기하고, 이 부분 사건을 서울고등법원에 환송한다.  원고의 나머지 상고를 기각한다.\n\n【이    유】상고이유(상고이유서 제출기간이 지난 다음 제출된 각 서면의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사건의 개요\n  원심판결 이유와 기록에 의하면, 다음 사실을 알 수 있다.\n  가. 원고는 국내거소신고를 한 재외국민으로서, 2012. 2. 27. 구 인감증명법(2015. 1. 20. 법률 제13018호로 개정되기 전의 것, 이하 같다) 제3조 제4항에 따라 원고의 국내거소를 관할하는 증명청인 피고에게 인감신고를 하였다.\n  나. 원고는 영주귀국하여 2012. 12. 17. 종전에 거소지로 신고한 주소로 주민등록을 재등록하였다.\n  다. 원고의 대리인은 2023. 4. 20. 서울 동작구 상도1동 주민센터에서 인감증명서 대리발급을 신청하였으나, 위 주민센터의 직원은 원고의 인감이 직권말소되었다는 이유로 인감증명서의 발급을 거부하였다.\n  라. 원고는 피고가 2012. 12. 17.경 법령상 근거 없이 원고의 주민등록 재등록을 이유로 원고의 인감을 직권말소(이하 ‘이 사건 직권말소’라 한다)하였다고 주장하며 피고를 상대로 이 사건 직권말소의 무효확인을 구하는 이 사건 소를 제기하였다. 원고는 원심에 이르러 이 사건 직권말소에 대한 부존재확인청구를 예비적으로 추가하고, 말소된 인감에 대한 원상회복청구와 손해배상청구도 추가하였다.\n  2. 이 사건 소 중 이 사건 직권말소의 무효 등 확인청구와 손해배상청구 부분의 적법 여부\n  가. 원심의 판단\n  원심은 다음과 같은 이유를 들어 이 사건 소 중 이 사건 직권말소의 무효확인청구 및 부존재확인청구 부분을 부적법하다고 판단하고, 본래의 항고소송인 무효 등 확인소송이 모두 부적법한 이상 이에 병합된 관련청구소송인 손해배상청구도 소송요건을 갖추지 못하여 부적법하다고 판단하였다.\n  1) 구 인감증명법상 인감대장은 인감증명에 관한 행정상 사무처리의 편의와 사실증명의 자료로 삼기 위한 것으로 그 내용의 변경 또는 삭제로 인하여 출원자의 실체상 권리관계에 변동을 가져오는 것이 아니고 출원자의 특정 권리관계나 법률상 지위가 인감대장의 기재만으로 증명되는 것도 아니므로, 증명청이 인감을 직권말소하는 행위는 항고소송이 되는 행정처분으로 볼 수 없다.\n  2) 인감증명의 무효확인을 받아들인다 하더라도 이로써 이미 침해된 출원자의 일정한 권리가 회복되거나 또는 곧바로 이와 관련된 새로운 권리가 발생하는 것이 아니고, 영주귀국하여 주민등록을 재등록함으로써 국내거소신고자가 아니게 된 원고로서는 이 사건 직권말소의 무효확인을 받는다고 하더라도 재외국민 국내거소신고자용 인감에 기한 인감증명서 발급 등은 받을 수 없어 그 무효확인을 구할 법률상 이익이 없다.\n  나. 대법원의 판단\n  원심의 판단은 다음과 같은 이유로 받아들이기 어렵다.\n  1) 행정청의 어떤 행위가 항고소송의 대상이 될 수 있는지의 문제는 추상적ㆍ일반적으로 결정할 수 없고, 구체적인 경우 행정처분은 행정청이 공권력의 주체로서 행하는 구체적 사실에 관한 법집행으로서 국민의 권리의무에 직접적으로 영향을 미치는 행위라는 점을 염두에 두고, 관련 법령의 내용과 취지, 그 행위의 주체ㆍ내용ㆍ형식ㆍ절차, 그 행위와 상대방 등 이해관계인이 입는 불이익과의 실질적 견련성, 그리고 법치행정의 원리와 당해 행위에 관련한 행정청 및 이해관계인의 태도 등을 참작하여 개별적으로 결정하여야 한다(대법원 1992. 1. 17. 선고 91누1714 판결, 대법원 2010. 11. 18. 선고 2008두167 전원합의체 판결 등 참조). 인감증명은 인감 자체의 동일성을 증명함과 동시에 거래행위자의 동일성과 거래행위가 행위자의 의사에 의한 것임을 확인하는 자료로서 일반인의 거래상 매우 중요한 기능을 수행하고 있다(대법원 2008. 7. 24. 선고 2006다63273 판결 등 참조). 인감의 등록은 인감증명제도를 활용하기 위한 전제요건으로서 해당 인감 출원자의 실체적 권리관계에 밀접하게 관련되어 있으므로, 증명청이 인감증명서 발급신청을 거부하는 행위뿐 아니라 등록된 인감을 말소하는 행위도 국민의 권리관계에 영향을 미치는 것으로서 항고소송의 대상이 되는 행정처분에 해당한다.\n  2) 항고소송의 경우 처분 등을 취소하거나 무효로 확인하는 확정판결은 그 사건에 관하여 당사자인 행정청과 그 밖의 관계행정청을 기속한다(행정소송법 제30조 제1항, 제38조). 어떤 처분을 위법하다고 판단하여 취소하거나 무효임을 확인하는 판결이 확정되면 행정청은 기속력에 따라 그 판결에서 확인된 위법사유를 배제한 상태에서 다시 처분을 하거나 그 밖에 위법한 결과를 제거하는 조치를 할 의무가 있다(대법원 2020. 12. 24. 선고 2019두55675 판결 등 참조).\n  이 사건 직권말소가 위법ㆍ무효의 처분임을 확인하는 판결이 확정된다면 피고로서는 원고가 국내거소신고를 한 재외국민의 지위에서 신고한 인감을 복구하는 등의 조치를 하여야 한다. 따라서 특별한 사정이 없는 이상 이 사건 직권말소의 무효확인을 구할 법률상 이익이 있다고 보아야 한다(원심이 인용한 대법원 2001. 7. 10. 선고 2000두2136 판결은 ‘인감증명 행위’에 대한 무효확인을 구할 법률상 이익 존부에 관한 판단이므로 이 사건과 사안을 달리하여 원용하기에 적절하지 않다).\n  3) 그런데도 이와 달리 이 사건 직권말소가 항고소송의 대상이 되는 행정처분에 해당하지 않고 그 무효확인을 구할 법률상 이익도 없다는 이유에서 이 사건 소 중 이 사건 직권말소의 무효확인청구 및 부존재확인청구 부분과 손해배상청구 부분이 부적법하다고 본 원심판단에는 행정처분 및 법률상 이익에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다.\n  3. 이 사건 소 중 원상회복청구 부분의 적법 여부\n  원심은, 원고가 피고를 상대로 2012. 12. 17. 직권말소한 원고의 인감을 원상으로 회복하라는 취지의 원상회복청구는 현행 행정소송법상 허용되지 않는 의무이행소송에 해당하여 부적법하다고 판단하였다.\n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 원심판단에 관련 법리를 오해하는 등으로 판결에 영향을 미친 잘못이 없다. \n  4. 결론\n  원심판결 중 인감직권말소처분의 무효확인청구 및 부존재확인청구 부분과 손해배상청구 부분을 파기하되, 행정소송법 제8조 제2항, 민사소송법 제418조 단서에 해당할 수 있는 여지가 있으므로 이 부분 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하며, 원고의 나머지 상고를 기각하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 마용주(재판장) 천대엽 서경환(주심) 신숙희"

    "판결유형": "판결",
    "판시사항": "근로자가 산업재해보상보험법상 장해급여를 받을 수 있는 수급권자가 되었으나 이를 청구하지 못한 채 사망하고, 미지급 보험급여에 관한 산업재해보상보험법령 조항에 따라 미지급 장해급여의 수급권자로 결정된 선순위 유족마저 사망한 경우, 그 유족의 상속인에게 미지급 장해급여의 수급권이 상속되는지 여부(적극)",
    "판결요지": "헌법상 재산권 보장의 원칙과 산업재해보상보험법(이하 ‘산재보험법’이라 한다) 제36조 제1항 제3호, 제2항, 제57조 제1항, 제81조 제1항, 제2항, 제5조 제3호, 제65조, 산업재해보상보험법 시행령(이하 ‘산재보험법 시행령’이라 한다) 제77조의 내용, 미지급 보험급여 제도의 입법 목적 및 취지 등을 종합하여 보면, 근로자가 산재보험법상 장해급여의 지급요건에 해당하여 장해급여를 받을 수 있는 수급권자가 되었으나 이를 청구하지 못한 채 사망하였고, 미지급 보험급여에 관한 산재보험법령 조항에 따라 이러한 미지급 장해급여의 수급권자로 결정된 선순위 유족마저 사망한 경우, 재산권의 상속에 관한 일반법인 민법이 적용되어 그 유족의 상속인에게 미지급 장해급여의 수급권이 상속된다고 보아야 한다. 이유는 다음과 같다.\n  ① 경제적ㆍ재산적 가치가 있는 공법상 권리로서 헌법상 재산권의 보호대상이 되는 산재보험법상 보험급여 수급권 중 장해급여와 같은 급여는 손해배상 또는 손실보상적 성격을 갖고 있어 재산권적인 보호의 필요성은 강한 반면, 사회보장적 성격은 상대적으로 약하다.\n  ② 미지급 장해급여 수급권은 이미 장해급여의 지급요건을 충족하여 발생한 권리의 청구 또는 지급이 지연된 상태에서 수급권자가 사망한 경우로서 재산권적인 보호의 필요성이 특히 강하므로, 상속에 관한 명시적 규정이 없다는 이유만으로 그 상속성을 부정하는 것은 헌법상 재산권 보장의 원칙에 부합한다고 할 수 없다. 산재보험법이 제58조 제1호에서 장해보상연금의 수급권자가 사망한 경우 그 수급권이 소멸한다고 규정하고 있고, 같은 법 제64조 제1항 제1호에서 유족보상연금 수급자격자인 유족이 사망한 경우 그 자격을 상실한다고 규정하고 있기는 하나, 이는 장래에 향하여 정기적ㆍ계속적으로 지급되는 연금 형태의 보험급여 수급권에 관한 것으로서 이미 보험급여의 지급요건을 충족하여 발생한 미지급 보험급여 수급권과 법적 성질이 같다고 볼 수 없다.\n  ③ 산재보험법 시행령 제77조가 산재보험법 제65조의 각 항 중 제3항만을 준용 범위에서 제외하고 있으나, 상위법의 구체적 위임에 따른 것이 아니어서 수급권의 소멸을 의미한다고 볼 수 없다. 오히려 산재보험법 제81조 제1항의 괄호 부분에서 미지급 ‘유족급여’의 경우에 한정하여 ‘그 유족급여를 받을 수 있는 다른 유족’의 청구에 따라 이를 지급하도록 정하고 있으므로, ‘유족에 대한 일시금 형태 보험급여’의 수급권자가 사망한 경우 다른 유족에게 그 수급권을 이전시키는 규정인 산재보험법 제65조 제3항을 준용한 경우와 실질적으로 동일한 상황이 되는 점을 고려했다고 볼 수 있다. 따라서 위와 같은 유족급여를 제외한 나머지 종류의 미지급 보험급여에 관하여 수급권자인 유족이 사망한 경우에는 상속에 관한 일반법인 민법이 적용된다.\n  ④ 미지급 장해급여 수급권이 그 수급권자로 결정된 선순위 유족이 사망함과 함께 그대로 소멸한다고 해석할 경우, 미지급 장해급여 수급권의 지급 지연에 따라 그 수급권자인 유족에 대한 생활보장이 충분히 이루어지지 않아 발생한 채무가 그 상속인들에게 상속될 수 있는 것과 균형이 맞지 않아 부당한 결과가 발생할 수 있다. 따라서 미지급 장해급여 수급권을 선순위 유족의 상속인에게 민법상 상속 규정에 따라 상속시키더라도 산재보험법령의 입법 취지 등에 어긋난다고 볼 수 없다.",
    "참조조문": "헌법 제23조 제1항, 산업재해보상보험법 제5조 제3호, 제36조 제1항 제3호, 제2항, 제57조 제1항, 제58조 제1호, 제64조 제1항 제1호, 제65조, 제81조, 산업재해보상보험법 시행령 제77조",
    "참조판례": "헌법재판소 2023. 10. 26. 선고 2020헌바310 전원재판부 결정(헌공325호, 1638)",
    "판례내용": "【원고, 피상고인】                원고 1 외 3인 (소송대리인 법무법인 사람앤스마트 담당변호사 강유진 외 3인)\n【피고, 상고인】 근로복지공단\n【원심판결】  서울고법 2024. 3. 14. 선고 2023누50655 판결         \n【주    문】\n  상고를 모두 기각한다.  상고비용은 피고가 부담한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 서면의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거에 의하면, 다음 사실을 알 수 있다.\n  가. 대한석탄공사 ○○광업소에서 광산근로자로 근무하였던 망 소외 1은 2000. 7. 10. 병형 1/0의 진폐증, 합병증 활동성 폐결핵(tba)으로 진단받고 요양하던 중 2014. 12. 7. 사망하였다.\n  나. 망 소외 1의 배우자인 망 소외 2는 2018. 11. 17. 사망하였다.\n  다. 망 소외 1과 망 소외 2의 자녀인 원고들은 2019. 2. 27. 피고에게 망 소외 2가 선순위 유족으로서 받을 수 있었던 망 소외 1에 대한 장해등급 제13급에 해당하는 미지급 장해급여를 청구하였고, 피고는 2019. 6. 19. 원고 2에게 3,678,560원, 나머지 원고들에게 각 3,678,530원 합계 14,714,150원의 장해급여를 지급하였다.\n  라. 피고는 2022. 3. 28. 원고들에게, ‘미지급 보험급여의 수급권자인 망 소외 2가 사망하여 그 수급권이 소멸하였음에도 불구하고 피고가 원고들에게 착오로 지급한 위 보험급여 14,714,150원을 부당이득금으로 징수한다.’는 결정(이하 ‘이 사건 처분’이라 한다)을 하였다.\n  2. 관련 규정\n  산업재해보상보험법(이하 ‘산재보험법’이라 한다) 제36조 제1항은 본문 각 호에서 보험급여의 종류를 열거하면서 그중 하나로 장해급여를 규정하고(제3호), 같은 조 제2항은 ‘보험급여 중 장해급여는 제57조 및 제60조에 따른 보험급여를 받을 수 있는 사람(이하 ‘수급권자’라 한다)의 청구에 따라 지급한다.’고 규정하고 있다. 그리고 산재보험법 제57조 제1항은 \"장해급여는 근로자가 업무상의 사유로 부상을 당하거나 질병에 걸려 치유된 후 신체 등에 장해가 있는 경우에 그 근로자에게 지급한다.\"라고 규정하고 있다.\n  한편 ‘미지급 보험급여’에 관한 산재보험법 제81조는 제1항에서 \"보험급여의 수급권자가 사망한 경우에 그 수급권자에게 지급하여야 할 보험급여로서 아직 지급되지 아니한 보험급여가 있으면 그 수급권자의 유족(유족급여의 경우에는 그 유족급여를 받을 수 있는 다른 유족)의 청구에 따라 그 보험급여를 지급한다.\"라고 규정하고, 제2항에서 \"제1항의 경우에 그 수급권자가 사망 전에 보험급여를 청구하지 아니하면 같은 항에 따른 유족의 청구에 따라 그 보험급여를 지급한다.\"라고 규정하고 있다.\n  산재보험법상 ‘유족’은 ‘사망한 사람의 배우자(사실상 혼인 관계에 있는 사람을 포함한다. 이하 같다)ㆍ자녀ㆍ부모ㆍ손자녀ㆍ조부모 또는 형제자매’를 의미하고(같은 법 제5조 제3호), 산재보험법 시행령 제77조는 산재보험법 제81조의 규정에 따른 미지급 보험급여 수급권자의 결정에 관하여 산재보험법 제65조 제1항, 제2항 및 제4항의 규정을 준용하도록 규정하고 있다.\n  여기서의 산재보험법 제65조 제1항, 제2항, 제4항은 모두 ‘수급권자인 유족의 순위’에 관한 규정이다. 산재보험법 제65조 제1항은 일시금 형태의 보험급여인 장해보상연금 차액일시금(같은 법 제57조 제5항), 유족보상일시금(같은 법 제62조 제2항) 및 유족보상연금 차액일시금(같은 법 제62조 제4항)에 관하여 유족 사이 수급권의 순위를 정한 규정이고, 제2항은 그중에서도 양부모(養父母) 및 실부모(實父母)와 관련된 경우로서 부모 또는 조부모 사이 순위를 결정하기 위한 규정이며, 제4항은 근로자가 유언으로 보험급여를 받을 유족을 지정한 경우 앞서의 규정에도 불구하고 그 지정에 따른다는 규정이다.\n  한편 산재보험법 제65조 제3항은 \"수급권자인 유족이 사망한 경우 그 보험급여는 같은 순위자가 있으면 같은 순위자에게, 같은 순위자가 없으면 다음 순위자에게 지급한다.\"라고 하여 수급권의 이전(移轉)에 관하여 규정하고 있다. 그런데 산재보험법 시행령 제77조는 앞서 본 바와 같이 미지급 보험급여 수급권자의 결정에 관하여 산재보험법 제65조 제1항, 제2항, 제4항은 준용하면서도 같은 조 제3항은 준용하고 있지 아니하다.\n  3. 관련 법리\n  헌법상 재산권 보장의 원칙과 앞서 본 관련 규정의 내용, 미지급 보험급여 제도의 입법 목적 및 취지 등을 종합하여 보면, 근로자가 산재보험법상 장해급여의 지급요건에 해당하여 장해급여를 받을 수 있는 수급권자가 되었으나 이를 청구하지 못한 채 사망하였고, 미지급 보험급여에 관한 산재보험법령 조항에 따라 이러한 미지급 장해급여의 수급권자로 결정된 선순위 유족마저 사망한 경우, 재산권의 상속에 관한 일반법인 민법이 적용되어 그 유족의 상속인에게 미지급 장해급여의 수급권이 상속된다고 보아야 한다. 그 이유는 다음과 같다.\n  가. 경제적ㆍ재산적 가치가 있는 공법상 권리로서 헌법상 재산권의 보호대상이 되는 산재보험법상 보험급여 수급권 중 장해급여와 같은 급여는 손해배상 또는 손실보상적 성격을 갖고 있어 재산권적인 보호의 필요성은 강한 반면, 사회보장적 성격은 상대적으로 약하다(헌법재판소 2023. 10. 26. 선고 2020헌바310 전원재판부 결정 참조).\n  나. 미지급 장해급여 수급권은 이미 장해급여의 지급요건을 충족하여 발생한 권리의 청구 또는 지급이 지연된 상태에서 그 수급권자가 사망한 경우로서 재산권적인 보호의 필요성이 특히 강하므로, 상속에 관한 명시적 규정이 없다는 이유만으로 그 상속성을 부정하는 것은 헌법상 재산권 보장의 원칙에 부합한다고 할 수 없다. 산재보험법이 제58조 제1호에서 장해보상연금의 수급권자가 사망한 경우 그 수급권이 소멸한다고 규정하고 있고, 같은 법 제64조 제1항 제1호에서 유족보상연금 수급자격자인 유족이 사망한 경우 그 자격을 상실한다고 규정하고 있기는 하나, 이는 장래에 향하여 정기적ㆍ계속적으로 지급되는 연금 형태의 보험급여 수급권에 관한 것으로서 이미 보험급여의 지급요건을 충족하여 발생한 미지급 보험급여 수급권과 그 법적 성질이 같다고 볼 수 없다.\n  다.                산재보험법 시행령 제77조가 산재보험법 제65조의 각 항 중 제3항만을 준용 범위에서 제외하고 있으나, 상위법의 구체적 위임에 따른 것이 아니어서 수급권의 소멸을 의미한다고 볼 수 없다. 오히려 산재보험법 제81조 제1항의 괄호 부분에서 미지급 ‘유족급여’의 경우에 한정하여 ‘그 유족급여를 받을 수 있는 다른 유족’의 청구에 따라 이를 지급하도록 정하고 있으므로, ‘유족에 대한 일시금 형태 보험급여’의 수급권자가 사망한 경우 다른 유족에게 그 수급권을 이전시키는 규정인 산재보험법 제65조 제3항을 준용한 경우와 실질적으로 동일한 상황이 되는 점을 고려하였다고 볼 수 있다. 따라서 위와 같은 유족급여를 제외한 나머지 종류의 미지급 보험급여에 관하여 그 수급권자인 유족이 사망한 경우에는 상속에 관한 일반법인 민법이 적용된다고 보아야 한다.\n  라. 미지급 장해급여 수급권이 그 수급권자로 결정된 선순위 유족이 사망함과 함께 그대로 소멸한다고 해석할 경우, 미지급 장해급여 수급권의 지급 지연에 따라 그 수급권자인 유족에 대한 생활보장이 충분히 이루어지지 않아 발생한 채무가 그 상속인들에게 상속될 수 있는 것과 균형이 맞지 않아 부당한 결과가 발생할 수 있다. 따라서 미지급 장해급여 수급권을 선순위 유족의 상속인에게 민법상 상속 규정에 따라 상속시킨다고 하더라도 산재보험법령의 입법 취지 등에 어긋난다고 볼 수 없다.\n  4. 판단\n  가. 원심은 판시와 같은 이유로, 망 소외 1이 사망할 당시 생계를 같이 하고 있던 배우자인 망 소외 2가 선순위 유족으로서 망 소외 1에게 지급되지 않은 미지급 장해급여의 수급권을 승계하였고, 망 소외 2가 사망함으로써 원고들이 민법에 따라 위 망 소외 2의 미지급 장해급여 수급권을 상속하여 원고들이 망 소외 1이 지급받지 못한 미지급 장해급여 수급권을 취득하였다고 보아야 하므로, 망 소외 2의 사망으로 미지급 보험급여 수급권이 소멸하였다는 전제 아래 이루어진 이 사건 처분은 위법하다고 판단하였다.\n  나. 앞서 본 관련 규정과 법리 및 원심이 적법하게 채택하여 조사한 증거에 비추어 살펴보면, 원심의 이유 설시에 일부 적절하지 않은 부분이 있으나, 원고들이 망 소외 2의 미지급 보험급여 수급권을 상속하였다는 결론은 정당하다. 거기에 상고이유 주장과 같이 산재보험법 제81조 및 산재보험법 시행령 제77조, 민법상 상속과 산재보험법상 미지급 보험급여 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  5. 결론\n  그러므로 상고를 모두 기각하고 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 권영준(재판장) 천대엽(주심) 오경미 엄상필"

    "판시사항": "구 국민건강보험법 제57조 제2항에서 정한 ‘같은 항에 따른 징수금’의 의미 및 위 조항 제1호에 따라 실질적 개설자에게 개설명의자와 연대하여 납부하게 할 수 있는 부당이득징수금을 같은 조 제1항에 따라 개설명의자인 요양기관에 부과되는 부당이득징수금을 초과하는 금액으로 정할 수 있는지 여부(적극)",
    "판결요지": "구 국민건강보험법(2020. 12. 29. 법률 제17772호로 개정되기 전의 것, 이하 같다) 제57조 제1항, 제2항에 따른 부당이득징수처분은 재량행위로서, 요양기관이 실시한 요양급여 내용과 요양급여비용 액수, 의료기관 개설ㆍ운영 과정에서 개설명의자와 실질적 개설자의 각 역할과 불법성의 정도, 의료기관 운영 성과의 귀속 여부와 개설명의자가 얻은 이익의 정도 등에 따라 개설명의자 등의 책임과 실질적 개설자의 책임이 달라질 수 있다.\n  한편 실질적 개설자에 대한 부당이득징수규정인 구 국민건강보험법 제57조 제2항 제1호의 요건으로서 구 의료법(2020. 3. 4. 법률 제17069호로 개정되기 전의 것, 이하 같다) 제33조 제2항이 금지하는 ‘비의료인의 의료기관 개설행위’는 비의료인이 의료기관의 시설 및 인력 충원ㆍ관리, 개설신고, 의료업 시행, 필요한 자금 조달, 운영 성과 귀속 등을 주도적으로 처리하는 것을 의미한다. 즉, 의료인인 개설명의자는 실질적 개설자에게 자신의 명의를 제공할 뿐 의료기관 개설과 운영에 관여하지 않으며, 그에게 고용되어 근로 제공의 대가를 받을 뿐 의료기관 운영에 따른 손익이 그대로 귀속되지도 않는다. 이 점을 반영하여, 구 의료법은 제33조 제2항 위반행위의 주체인 실질적 개설자를 10년 이하의 징역이나 1억 원 이하의 벌금에 처하도록 규정한 반면, 개설명의자에 관하여는 제90조에서 ‘의료기관의 개설자가 될 수 없는 자에게 고용되어 의료행위를 한 자’로서 500만 원 이하의 벌금에 처하도록 규정하고 있다.\n  이상과 같은 구 국민건강보험법 부당이득징수규정의 법적 성질ㆍ내용과 체계, 입법 취지, 그 규정에 따른 처분 시 고려 요소 등을 종합하면, 실질적 개설자는 부당이득징수처분에 따라 개설명의자와 독립하여 부당이득반환의무를 부담하되 개설명의자인 요양기관과 연대책임을 지는 관계에 있다. 그러므로 구 국민건강보험법 제57조 제2항에서 정한 ‘같은 항에 따른 징수금’이란, ‘실질적 개설자가 요양기관에 대한 종속적 지위에서, 요양기관에 부과된 부당이득징수금 범위 내에서 부담하는 징수금’이 아니라, ‘실질적 개설자가 요양기관을 통해 속임수나 그 밖의 부당한 방법으로 받은 보험급여비용 중 책임의 경중에 대한 재량적 판단을 거쳐 정해진 그 전부 또는 일부’를 의미한다. 결국 구 국민건강보험법 제57조 제2항 제1호에 따라 실질적 개설자로 하여금 개설명의자와 연대하여 납부하게 할 수 있는 부당이득징수금은, 책임의 경중에 대한 재량적 판단으로 말미암아 같은 조 제1항에 따라 개설명의자에게 부과되는 부당이득징수금을 초과하는 금액으로 정해질 수도 있다.",
    "참조조문": "구 국민건강보험법(2020. 12. 29. 법률 제17772호로 개정되기 전의 것) 제57조 제1항, 제2항, 구 의료법(2020. 3. 4. 법률 제17069호로 개정되기 전의 것) 제33조 제2항, 행정기본법 제21조",
    "참조판례": "대법원 2018. 11. 29. 선고 2018도10779 판결(공2019상, 248), 대법원 2020. 6. 4. 선고 2015두39996 판결(공2020하, 1367), 대법원 2020. 7. 9. 선고 2018두44838 판결(공2020하, 1609), 대법원 2020. 9. 3. 선고 2015다230730 판결",
    "판례내용": "【원고, 상고인】                ○○○의료소비자생활협동조합 외 5인 (소송대리인 법무법인 로컴 담당변호사 손창환 외 4인)\n【피고, 피상고인】 국민건강보험공단\n【원심판결】  광주고법 2024. 7. 25. 선고 2023누12766 판결         \n【주    문】\n  상고를 모두 기각한다.  상고비용은 원고들이 부담한다. \n\n【이    유】  상고이유를 판단한다.\n  1. 원심판결 이유와 원심이 적법하게 채택하여 조사한 증거에 따르면 다음 사실을 알 수 있다.\n  가. 원고 ○○○의료소비자생활협동조합(2020. 12. 7. 「협동조합 기본법」 제57조의2 제2항 본문에 따라 해산 간주되었다. 이하 ‘원고 1 조합’이라 한다)은 2015. 5. 14. 광주광역시장으로부터 조합설립인가를 받은 후 2015. 6. 11. ○○○요양병원(이하 ‘이 사건 병원’이라 한다) 개설허가를 받아 이를 개설ㆍ운영하였다. 원고 1 조합이 해산 간주될 때까지 원고 4는 원고 1 조합의 이사장, 원고 2, 원고 3, 원고 5, 원고 6은 각각 원고 1 조합의 이사였다.\n  나. 피고는 이 사건 병원이 구 의료법(2020. 3. 4. 법률 제17069호로 개정되기 전의 것) 제33조 제2항을 위반하여 개설된 요양기관임을 이유로, 원고 1 조합에 대하여는 구 국민건강보험법(2020. 12. 29. 법률 제17772호로 개정되기 전의 것, 이하 ‘구 국민건강보험법’이라 한다) 제57조 제1항에 따라, 원고 2, 원고 3, 원고 4, 원고 5, 원고 6에 대하여는 각각 같은 조 제2항 제1호에 따라, 합계 1,383,785,320원의 요양급여비용 부당이득징수처분(2015. 6. 12.부터 2016. 1. 27.까지의 요양급여비용 984,656,780원에 대한 2016. 3. 17. 자 부당이득징수처분, 2016. 1. 28.부터 2016. 8. 25.까지의 요양급여비용 346,935,710원에 대한 2016. 11. 28. 자 부당이득징수처분, 2016. 9. 21.부터 2016. 10. 25.까지의 요양급여비용 52,192,830원에 대한 2017. 2. 3. 자 부당이득징수처분이 순차로 이루어졌는데, 이하 이를 통틀어 ‘이 사건 각 당초 처분’이라 한다)을 하였다.\n  다. 원고들은 피고를 상대로 이 사건 각 당초 처분의 취소를 구하는 소를 제기하였으나(광주지방법원 2016구합11537호), 2017. 6. 15. 및 2018. 7. 5. 원고들의 청구를 모두 기각하는 판결이 선고되었다. 이 판결에 불복하여 원고들이 항소하였고(광주고등법원 2017누4375호), 2020. 10. 30. 항소심법원은 ‘구 국민건강보험법 제57조 제1항, 제2항이 정한 부당이득징수는 재량행위로서, 재량판단에 앞서 고려해야 할 요소들을 고려하지 않은 채 원고들로부터 일률적으로 요양급여비용 전액을 징수한 것은 위법하다.’는 이유로 제1심판결 및 이 사건 각 당초 처분을 취소하는 판결을 선고하였으며, 그 무렵 위 판결이 그대로 확정되었다(이하 ‘이 사건 취소판결’이라 한다).\n  라. 2023. 11. 21.경 피고는 대법원 2020. 6. 4. 선고 2015두39996 판결 등의 취지에 따라 부당이득징수금 산정 시 본인부담금을 감경대상에 포함하고 감경비율을 확대하며 감경항목별 구간을 세분화하는 등의 내용으로 ‘불법개설 기관 처분(감면) 업무처리지침’(이하 ‘이 사건 재량준칙’이라 한다)을 마련한 후, 그에 따라 원고 1 조합, 원고 4, 원고 5, 원고 6에 대하여는 각 감경비율 65%, 원고 2에 대하여는 감경비율 50%, 원고 3에 대하여는 감경비율 55%를 각각 당초 처분의 부당이득징수금에 적용하기로 하였다. \n  마. 2024. 2. 27. 피고는 원고 1 조합, 원고 4, 원고 5, 원고 6에 대한 부당이득징수금을 각 484,324,860원으로, 원고 2에 대한 부당이득징수금을 691,892,630원으로, 원고 3에 대한 부당이득징수금을 622,703,390원으로 각각 감경하는 처분을 하였다(이하 이 사건 각 당초 처분 중 위와 같이 감경되지 않고 남은 부분을 ‘이 사건 각 처분’이라 한다). \n  2. 제1 상고이유에 대하여 \n  가. 관련 규정 및 법리\n  1) 무자격자의 의료기관 운영과 관련한 보험급여비용 반환 규정은 특수한 형태의 부당이득반환의무에 관한 규정이다(헌법재판소 2011. 6. 30. 선고 2010헌바375 전원재판부 결정 참조). 부당이득금을 의료기관 개설명의자로부터 징수할 것인지, 그 실질적 개설ㆍ운영자(이하 ‘실질적 개설자’라 한다)로부터 징수할 것인지는 원칙적으로 입법 재량의 영역에 해당한다[헌법재판소 2015. 7. 30. 선고 2014헌바298, 357, 2015헌바120(병합) 전원재판부 결정 참조]. \n  2) 구 국민건강보험법 제57조 제1항은 \"공단은 속임수나 그 밖의 부당한 방법으로 보험급여를 받은 사람이나 보험급여 비용을 받은 요양기관에 대하여 그 보험급여나 보험급여 비용에 상당하는 금액의 전부 또는 일부를 징수한다.\"라고 규정하고, 2013. 5. 22. 법률 제11787호로 신설된 같은 조 제2항은 \"공단은 제1항에 따라 속임수나 그 밖의 부당한 방법으로 보험급여 비용을 받은 요양기관이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 요양기관을 개설한 자에게 그 요양기관과 연대하여 같은 항에 따른 징수금을 납부하게 할 수 있다.\"라고 규정하면서 제1호로 ‘의료법 제33조 제2항을 위반하여 의료기관을 개설할 수 없는 자가 의료인의 면허나 의료법인 등의 명의를 대여받아 개설ㆍ운영하는 의료기관’을 정하고 있다. 이와 같이 신설된 부당이득징수규정은 경제적 이익의 실질 귀속자로부터 그 이익을 직접 환수할 수 있도록 함으로써 환수 비용 절감 및 시간 단축 등을 통해 권리행사의 실효성을 높이는 한편, 개설명의자와 실질적 개설자가 동일한 내용의 급부를 독립하여 부담하는 채무의 책임 관계가 연대책임이라는 점을 명확히 하고 있다.\n  3)                구 국민건강보험법 제57조 제1항, 제2항에 따른 부당이득징수처분은 재량행위로서(대법원 2020. 7. 9. 선고 2018두44838 판결 참조), 요양기관이 실시한 요양급여 내용과 요양급여비용 액수, 의료기관 개설ㆍ운영 과정에서 개설명의자와 실질적 개설자의 각 역할과 불법성의 정도, 의료기관 운영 성과의 귀속 여부와 개설명의자가 얻은 이익의 정도 등에 따라 개설명의자 등의 책임과 실질적 개설자의 책임이 달라질 수 있다(대법원 2020. 6. 4. 선고 2015두39996 판결, 대법원 2020. 9. 3. 선고 2015다230730 판결 등 참조).\n  4) 한편 실질적 개설자에 대한 부당이득징수규정인 구 국민건강보험법 제57조 제2항 제1호의 요건으로서 구 의료법 제33조 제2항이 금지하는 ‘비의료인의 의료기관 개설행위’는 비의료인이 의료기관의 시설 및 인력 충원ㆍ관리, 개설신고, 의료업 시행, 필요한 자금 조달, 운영 성과 귀속 등을 주도적으로 처리하는 것을 의미한다(대법원 2018. 11. 29. 선고 2018도10779 판결 참조). 즉, 의료인인 개설명의자는 실질적 개설자에게 자신의 명의를 제공할 뿐 의료기관 개설과 운영에 관여하지 않으며, 그에게 고용되어 근로 제공의 대가를 받을 뿐 의료기관 운영에 따른 손익이 그대로 귀속되지도 않는다. 이 점을 반영하여, 구 의료법은 제33조 제2항 위반행위의 주체인 실질적 개설자를 10년 이하의 징역이나 1억 원 이하의 벌금에 처하도록 규정한 반면, 개설명의자에 관하여는 제90조에서 ‘의료기관의 개설자가 될 수 없는 자에게 고용되어 의료행위를 한 자’로서 500만 원 이하의 벌금에 처하도록 규정하고 있다.\n  5) 이상과 같은 부당이득징수규정의 법적 성질ㆍ내용과 체계, 입법 취지, 그 규정에 따른 처분 시 고려 요소 등을 종합하면, 실질적 개설자는 부당이득징수처분에 따라 개설명의자와 독립하여 부당이득반환의무를 부담하되 개설명의자인 요양기관과 연대책임을 지는 관계에 있다. 그러므로 구 국민건강보험법 제57조 제2항에서 정한 ‘같은 항에 따른 징수금’이란, ‘실질적 개설자가 요양기관에 대한 종속적 지위에서, 요양기관에 부과된 부당이득징수금 범위 내에서 부담하는 징수금’이 아니라, ‘실질적 개설자가 요양기관을 통해 속임수나 그 밖의 부당한 방법으로 받은 보험급여비용 중 책임의 경중에 대한 재량적 판단을 거쳐 정해진 그 전부 또는 일부’를 의미한다고 봄이 타당하다. 결국 구 국민건강보험법 제57조 제2항 제1호에 따라 실질적 개설자로 하여금 개설명의자와 연대하여 납부하게 할 수 있는 부당이득징수금은, 책임의 경중에 대한 재량적 판단으로 말미암아 같은 조 제1항에 따라 개설명의자에게 부과되는 부당이득징수금을 초과하는 금액으로 정해질 수도 있다.\n  나. 판단\n  이와 같은 취지에서 원심은 이 사건 각 처분 중 원고 2, 원고 3에 대한 부분에 원고들이 주장하는 하자가 없다고 판단하였다. 이러한 원심의 판단에 이 부분 상고이유 주장과 같이 구 국민건강보험법 제57조 제2항 제1호 등에 관한 법리를 오해하거나 이유불비 등으로 판결에 영향을 미친 잘못이 없다.\n  3. 제2 상고이유에 대하여\n  원심은 판시와 같은 이유로, 이 사건 각 처분에 재량권을 일탈ㆍ남용한 위법이 없다고 판단하였다. 원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 원심판단에 행정기본법 제21조에 따른 재량행사의 기준 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  4. 제3 상고이유에 대하여 \n  원심은 판시와 같은 이유로, 피고가 이 사건 취소판결의 취지에 따라 구 국민건강보험법 제57조에 따른 부당이득징수처분을 할 때 고려해야 할 요소를 참작하여 징수금을 감액하는 처분을 하였다면 이러한 처분까지 취소판결의 기속력에 반한다고 할 수 없고, 이 사건 각 처분은 이 사건 각 당초 처분 중에서 하자 있는 부분에 해당하는 부당이득징수금을 감액하는 것으로서 그 실질은 종래의 위법한 부분을 제거하는 처분이므로 하자의 치유와는 차이가 있으며, 이 사건 재량준칙이 헌법 또는 법률에 합치되지 않거나 객관적으로 합리적이지 않다고 보기 어렵고, 이 사건 재량준칙에 따른 이 사건 각 처분이 재량권을 행사함에 있어 고려하여야 할 사정들을 제대로 고려하지 아니하여 비례의 원칙을 위반하였다고 보기도 어렵다고 판단하였다. \n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 이러한 원심의 판단에 필요한 심리를 다하지 아니한 채 논리와 경험의 법칙을 위반하여 자유심증주의의 한계를 벗어나거나 직권조사사항, 행정소송법 제30조에 따른 기속력, 하자의 치유 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  5. 결론\n  상고를 모두 기각하고 상고비용은 패소자가 부담하게 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오경미(재판장) 천대엽 권영준 엄상필(주심)"

    "판시사항": "[1] 노인복지법 시행규칙 제22조 제1항 [별표 4] 제6호 비고 7.에서 말하는 ‘세탁물을 전량 위탁하여 처리하는 경우’의 의미 및 위생원이 아닌 종사자가 장기요양기관에서 발생한 세탁물 중 입소자의 개인 의류를 시설 내에서 직접 처리하는 것을 ‘세탁물을 전량 위탁하여 처리하는 경우’에 해당한다고 볼 수 있는지 여부(원칙적 소극)\n\n [2] 구 노인장기요양보험법 제43조 제1항 제4호에 따른 부당이득 환수처분이 기속행위에 해당하는지 여부(적극)",
    "판결요지": "[1] 구 노인장기요양보험법(2021. 12. 21. 법률 제18610호로 개정되기 전의 것) 제31조 제1항에 따르면, 장기요양기관으로 지정받아 이를 운영하려는 자는 보건복지부령으로 정하는 장기요양에 필요한 시설 및 인력을 갖추어야 하고, 그 위임에 따른 구 노인장기요양보험법 시행규칙(2025. 2. 28. 보건복지부령 제1095호로 개정되기 전의 것) 제23조 제2항 제2호는 시설급여를 제공하려는 자는 노인복지법 시행규칙 제22조 제1항 [별표 4]에 따른 시설 및 인력을 갖추어야 한다고 규정하고 있다. 노인복지법 시행규칙 제22조 제1항 [별표 4] 제6호 직원의 배치기준은 입소자가 30명 이상인 노인요양시설의 경우 위생원을 1명(입소자 100명 초과할 때마다 1명 추가) 두도록 규정하고 있고, 비고 7.은 이에 대한 예외로 ‘세탁물을 전량 위탁하여 처리하는 경우에는 위생원을 두지 않을 수 있다.’고 규정하고 있다. \n  위 [별표 4] 제6호 비고 7.에서 말하는 ‘세탁물을 전량 위탁하여 처리하는 경우’란 장기요양기관을 운영하면서 발생하는 세탁물을 전부 위탁하여 처리하는 경우를 의미한다. 따라서 위생원이 아닌 종사자가 장기요양기관에서 발생한 세탁물 중 입소자의 개인 의류를 시설 내에서 직접 처리하는 것은 특별한 사정이 없는 한 ‘세탁물을 전량 위탁하여 처리하는 경우’에 해당한다고 볼 수 없다. \n\n [2] 구 노인장기요양보험법(2021. 12. 21. 법률 제18610호로 개정되기 전의 것, 이하 같다) 제43조 제1항 제4호에 따른 부당이득 환수처분은 거짓이나 그 밖의 부정한 방법으로 청구하여 지급받은 장기요양급여비용을 전액 징수해야 하는 기속행위로 해석된다. 구체적인 이유는 다음과 같다. \n  ① 구 노인장기요양보험법 제43조 제1항은 거짓이나 그 밖의 부정한 방법으로 지급받은 ‘급여비용에 상당하는 금액을 징수한다.’라고 규정하고 있으므로, 그와 같은 방법으로 수령한 장기요양급여비용에 상당하는 금액의 ‘전부 또는 일부’를 ‘징수할 수 있다’는 의미로 해석하기보다는 그와 같은 금액 ‘전부’를 ‘징수하여야 한다’는 의미로 해석하는 것이 자연스럽다. \n  ② 구 노인장기요양보험법 제43조 제1항 제4호는 장기요양기관이 부정한 방법으로 장기요양급여비용을 청구하는 것을 방지함으로써 고령이나 노인성 질병 등의 사유로 일상생활을 혼자서 수행하기 어려운 노인 등의 노후의 건강증진 및 생활안정에 쓰이는 보험재정의 건전성을 확보하려는 데 입법 취지가 있다. 그런데 거짓이나 그 밖의 부정한 방법으로 청구하여 지급받은 장기요양급여비용에 대한 환수 여부 및 범위에 재량권이 부여되어 있다고 본다면 이러한 입법 취지를 효과적으로 달성하기 어렵다.\n  ③ 장기요양보험은 노인장기요양문제라는 사회적 위험에 대응하기 위한 공적 사회보험제도로서 그 재원이 보험가입자인 국민으로부터 징수된 보험료와 국가의 보조금으로 마련되고 있으므로(제8조, 제58조), 보험재정의 건전성을 도모할 공익상의 필요가 중대하다. \n  ④ 환수 대상은 그동안 지급받은 장기요양급여비용 전액이 아니라 법률상 원인 없이 지급받은 장기요양급여비용, 즉 거짓이나 그 밖의 부정한 방법으로 청구하여 지급받은 장기요양급여비용에 한정되므로 그 침해의 정도가 과도하다고 볼 수 없다.",
    "참조조문": "[1] 구 노인장기요양보험법(2021. 12. 21. 법률 제18610호로 개정되기 전의 것) 제31조 제1항, 구 노인장기요양보험법 시행규칙(2025. 2. 28. 보건복지부령 제1095호로 개정되기 전의 것) 제23조 제2항 제2호, 노인복지법 시행규칙 제22조 제1항 [별표 4] / [2] 구 노인장기요양보험법(2021. 12. 21. 법률 제18610호로 개정되기 전의 것) 제43조 제1항 제4호, 행정소송법 제27조",
    "참조판례": "",
    "판례내용": "【원고, 피상고인】                원고 1 외 1인 (소송대리인 변호사 박병철)\n【피고, 상고인】 국민건강보험공단\n【원심판결】  서울고법 2024. 8. 29. 선고 2023누55469 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 아래의 사실을 알 수 있다. \n  가. 원고들은 장기요양기관 지정을 받은 노인요양시설인 ‘(상호 생략)’(이하 ‘이 사건 요양원’이라 한다)을 운영하고 있다. 이 사건 요양원의 정원은 48명이고, 현원은 평균적으로 약 46명이다.\n  나. 이 사건 요양원은 2018. 10.부터 2021. 11.까지 입소자들의 개인 의류 등을 세탁업체에 위탁하여 세탁하지 않고 시설 내에서 세탁하면서도 위생원을 두지 않았다.\n  다. 피고는, 원고들이 2018. 10.부터 2021. 11.까지 위생원을 배치하지 않고 세탁물을 전량 위탁하지 않았음에도 세탁물을 전량 위탁한 것처럼 사실과 다르게 신고함으로써, 인력배치기준 및 인력추가배치 가산기준을 위반하고 장기요양급여비용을 부당하게 청구하여 이를 지급받았다는 사유로, 구 노인장기요양보험법(2021. 12. 21. 법률 제18610호로 개정되기 전의 것, 이하 같다) 제43조 제1항 제4호에 따라 2022. 4. 7. 원고들에게 합계 616,733,800원을 환수하는 처분(이하 ‘이 사건 환수처분’이라 한다)을 하였다.\n  2. 제1 상고이유에 대한 판단\n  가. 관련 규정 및 이에 대한 정당한 해석\n                 구 노인장기요양보험법 제31조 제1항에 따르면, 장기요양기관으로 지정받아 이를 운영하려는 자는 보건복지부령으로 정하는 장기요양에 필요한 시설 및 인력을 갖추어야 하고, 그 위임에 따른 구 「노인장기요양보험법 시행규칙」(2025. 2. 28. 보건복지부령 제1095호로 개정되기 전의 것) 제23조 제2항 제2호는 시설급여를 제공하려는 자는 「노인복지법 시행규칙」[별표 4]에 따른 시설 및 인력을 갖추어야 한다고 규정하고 있다. 「노인복지법 시행규칙」[별표 4] 6. 직원의 배치기준은 입소자가 30명 이상인 노인요양시설의 경우 위생원을 1명(입소자 100명 초과할 때마다 1명 추가) 두도록 규정하고 있고, 비고 7.은 이에 대한 예외로 ‘세탁물을 전량 위탁하여 처리하는 경우에는 위생원을 두지 않을 수 있다.’고 규정하고 있다(이하 비고 7.을 ‘이 사건 규정’이라 한다). \n  이 사건 규정에서 말하는 ‘세탁물을 전량 위탁하여 처리하는 경우’란 장기요양기관을 운영하면서 발생하는 세탁물을 전부 위탁하여 처리하는 경우를 의미한다. 따라서 위생원이 아닌 종사자가 장기요양기관에서 발생한 세탁물 중 입소자의 개인 의류를 시설 내에서 직접 처리하는 것은 특별한 사정이 없는 한 ‘세탁물을 전량 위탁하여 처리하는 경우’에 해당한다고 볼 수 없다. \n  나. 판단 \n  1) 원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하여 알 수 있는 다음과 같은 사정들을 위와 같은 법리에 비추어 살펴보면, 원고들은 세탁물을 전량 위탁하여 처리한 경우에 해당한다고 보기 어렵다.\n  가) 원고들은 2018. 10.경 ○○기업과 이 사건 요양원의 세탁물 처리에 관한 계약을 체결하였다. 원고들은 처음에는 이 사건 요양원에서 발생하는 세탁물 전량을 위탁하였으나, 계약 초기 세탁물의 위탁처리 과정에서 입소자들의 개인 의류가 분실ㆍ손상되어 입소자들의 불만이 제기되는 등의 문제가 발생하자 침구류 등 세탁물만 위탁하고, 입소자들의 개인 의류 등 나머지 세탁물은 이 사건 요양원에서 직접 세탁하였다. 즉, 이 사건 요양원은 입소자들의 개인 의류 중 신속히 세탁할 필요가 있는 일부 세탁물만 자체 세탁한 것이 아니라, 입소자들의 개인 의류 전부를 자체 세탁하였다.\n  나) 위탁하지 않은 세탁물은 이 사건 요양원의 요양보호사들이 세탁하였다. 원고들은 2019년까지 세탁물을 처리하는 요양보호사를 별도로 지정하지 않았으나, 2020년부터는 전체 21명의 요양보호사들 중 3명을 지정하여 기존 업무 외에 입소자들의 개인 의류 등을 세탁하는 업무를 추가로 수행하도록 하고, 시간 외 근무에 대하여 추가수당을 지급하였다.\n  구체적으로 원고들은 요양보호사 3명과 사이에 2020년에는 주 3회 20분씩 조기 출근하여 초과근무시간 동안 위탁하지 않은 세탁물을 처리하는 내용의 근로계약을 체결하였고, 2021년에는 주 4회 25분씩 조기 출근하여 초과근무시간 동안 위탁하지 않은 세탁물을 처리하는 내용의 근로계약을 체결하였다. 그러나 요양보호사 3명은 당시 시설장이었던 원고 2와 협의하여, 실제로는 근로계약서에서 정한 것과 달리 정규근무시간 중 입소자들의 목욕이 끝난 후인 11시경부터 세탁물을 처리하였다.   \n  다) 2022. 1. 4.부터 2022. 1. 7.까지 실시된 현지조사 당시, 세탁업무를 추가로 수행했던 요양보호사 소외 1은 ‘건조기가 1대라 세탁을 그날 다 수행할 수 없는 경우가 있었다. 그러면 다음 날 조기 출근하여 전날 빨래를 정리하였다.’고 진술하였고, 세탁업무를 추가로 수행했던 다른 요양보호사 소외 2는 ‘어르신 목욕 후 11시부터 근무시간까지 세탁을 수행하였다.’는 내용의 사실확인서를 작성하였다. \n  2) 그런데도 원심은 판시와 같은 이유만으로, 원고들이 입소자들의 개인 의류 등 일부 세탁물을 요양보호사들을 통하여 자체적으로 세탁하였다 하더라도, 이를 들어 세탁물을 전량 위탁하여 처리하지 않았다고 평가하기는 어렵다고 판단하였다. 원심판단에는 ‘세탁물을 전량 위탁하여 처리하는 경우’의 해석에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. \n  3. 제2 상고이유에 대한 판단\n  가. 원심 판단\n  원심은, 설령 원고들이 세탁물을 전량 위탁하여 처리하였다고 볼 수 없어 처분사유가 인정된다고 하더라도, 그 판시와 같은 사정들을 종합하여 보면, 원고들에게는 의무 위반을 탓할 수 없는 정당한 사유가 인정되므로, 그와 같은 이유로도 이 사건 환수처분은 위법하다고 판단하였다.\n  나. 대법원 판단\n  1) 원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하여 알 수 있는 다음과 같은 사정들에 비추어 보면, 원고들이 제출한 자료만으로는 원고들에게 그 의무 위반을 탓할 수 없는 정당한 사유가 있다고 보기 어렵다.\n  가) 「노인복지법 시행규칙」[별표 4] 6. 직원의 배치기준 중 이 사건 규정과 같은 내용은 장기요양보험제도의 시행을 위하여 「노인복지법 시행규칙」이 2008. 1. 28. 보건복지부령 제437호로 개정될 당시부터 이미 규정되어 있었다. 이후 이 조항이 여러 차례 개정되었으나, 그 개정은 자구 수정 또는 조문 위치의 변경에 불과하였고, 그동안 이 사건 규정에 대하여 해석ㆍ적용상 혼란이 있었다고 볼 만한 자료는 없다.\n  나) 이 사건 규정은 ‘세탁물의 전량 위탁처리’의 요건을 충족하는 경우 위생원을 두지 않을 수 있는 효과가 발생하는 구조이다. ‘세탁물의 전량 위탁처리’는 장기요양기관이 세탁물을 모두 위탁하여 처리하는 경우라고 해석되고, 다르게 해석될 여지는 크지 않아 보인다.  \n  다) 보건복지부의 2017. 7. 27. 자 국민신문고 질의회신은, 시설 내 세탁물을 전량 위탁하여 처리하는 것이 원칙이지만 다만 ‘입소자들의 위생 관리를 위해 일부 세탁물(속옷 등)’을 시설의 판단하에 처리할 수 있을 것으로 사료된다는 내용이다. 이는 속옷 등의 극히 개인적인 세탁물은 애초에 장기요양기관에서 처리하여야 할 세탁물에서 제외할 수 있다는 취지로서, 세탁물의 분실ㆍ손상 등을 이유로 입소자들의 개인 의류 전부를 자체 세탁하는 것까지 허용된다는 취지는 아니라고 해석된다. 또한 이 질의회신은 원고들에 대한 것이 아니고, 원고들이 별도로 보건복지부나 피고 측에 이 질의회신의 내용이나 이 사건 규정의 해석에 관하여 문의하였다고 볼 만한 자료도 없다. \n  라) 위탁계약을 체결한 세탁물 처리업체의 세탁물 처리방식상 입소자들의 개인 의류 세탁물이 손상되기 쉬웠다면, 원고들로서는 위탁업체를 변경하거나 위생원을 고용하는 방안, 입소자들의 개인 의류를 별도의 개인 의류 전문 세탁물 처리업체에 위탁하여 처리하는 방안 등을 활용하여 문제를 해결할 수 있었다. 그럼에도 원고들이 이와 같은 문제 해결 방안의 도입을 고려하였다고 볼 만한 아무런 자료가 없다.\n  마) 원고들이 세탁업무를 추가로 수행하는 요양보호사들에게 지급한 추가수당은 정규 근무시간 외에 수행되는 초과근무에 대한 대가로 지급된 것이고, 추가수당을 고려하더라도 원고들이 2018. 9. 이전에 위생원을 고용했을 때와 비교하여 세탁업무에 지출되는 비용은 감소하였다. 이러한 사정을 감안하면, 원고들이 오로지 입소자들의 편의와 위생을 위하여 자체 세탁을 한 것이라고 추단하기도 어렵다.\n  2) 그런데도 원고들에게 의무 위반을 탓할 수 없는 정당한 사유가 인정된다고 본 원심의 판단에는 정당한 사유에 관한 법리를 오해하는 등으로 판결에 영향을 미친 잘못이 있다. \n  4. 제3 상고이유에 대한 판단\n  가. 관련 법리\n  1) 행정행위가 그 재량성의 유무 및 범위와 관련하여 이른바 기속행위와 재량행위로 구분된다고 할 때, 그 구분은 해당 행위의 근거가 된 법규의 체제ㆍ형식과 그 문언, 해당 행위가 속하는 행정 분야의 주된 목적과 특성, 해당 행위 자체의 개별적 성질과 유형 등을 모두 고려하여 판단하여야 한다(대법원 2020. 10. 15. 선고 2019두45739 판결 참조). \n  2)                구 노인장기요양보험법 제43조 제1항 제4호에 따른 부당이득 환수처분은 거짓이나 그 밖의 부정한 방법으로 청구하여 지급받은 장기요양급여비용을 전액 징수하여야 하는 기속행위로 해석된다. 그 구체적인 이유는 다음과 같다. \n  가)                구 노인장기요양보험법 제43조 제1항은 거짓이나 그 밖의 부정한 방법으로 지급받은 ‘급여비용에 상당하는 금액을 징수한다.’라고 규정하고 있으므로, 그와 같은 방법으로 수령한 장기요양급여비용에 상당하는 금액의 ‘전부 또는 일부’를 ‘징수할 수 있다’는 의미로 해석하기보다는 그와 같은 금액 ‘전부’를 ‘징수하여야 한다’는 의미로 해석하는 것이 자연스럽다. \n  나)                구 노인장기요양보험법 제43조 제1항 제4호는 장기요양기관이 부정한 방법으로 장기요양급여비용을 청구하는 것을 방지함으로써 고령이나 노인성 질병 등의 사유로 일상생활을 혼자서 수행하기 어려운 노인 등의 노후의 건강증진 및 생활안정에 쓰이는 보험재정의 건전성을 확보하려는 데 입법 취지가 있다. 그런데 거짓이나 그 밖의 부정한 방법으로 청구하여 지급받은 장기요양급여비용에 대한 환수 여부 및 그 범위에 재량권이 부여되어 있다고 본다면 이러한 입법 취지를 효과적으로 달성하기 어렵다.\n  다) 장기요양보험은 노인장기요양문제라는 사회적 위험에 대응하기 위한 공적 사회보험제도로서 그 재원이 보험가입자인 국민으로부터 징수된 보험료와 국가의 보조금으로 마련되고 있으므로(제8조, 제58조), 보험재정의 건전성을 도모할 공익상의 필요가 중대하다. \n  라) 환수 대상은 그동안 지급받은 장기요양급여비용 전액이 아니라 법률상 원인 없이 지급받은 장기요양급여비용, 즉 거짓이나 그 밖의 부정한 방법으로 청구하여 지급받은 장기요양급여비용에 한정되므로 그 침해의 정도가 과도하다고 볼 수 없다.\n  나. 원심 판단\n  원심은, 설령 원고들이 세탁물을 전량 위탁하여 처리하였다고 볼 수 없어 처분사유가 인정된다고 하더라도, 이 사건 환수처분은 그 판시와 같이 재량행위로 해석하여야 하므로, 이를 기속행위로 보아 아무런 재량적 고려 없이 이루어진 이 사건 환수처분은 재량권의 불행사로서 그 자체로 재량권을 일탈ㆍ남용한 것이므로, 이와 같은 이유로도 이 사건 환수처분은 위법하다고 판단하였다.   \n  다. 대법원 판단\n  구 노인장기요양보험법 제43조 제1항 제4호에 따른 이 사건 환수처분이 기속행위에 해당함은 앞서 본 것과 같다. 피고가 원고들에게 거짓이나 그 밖의 부정한 방법으로 청구하여 지급받은 장기요양급여비용 전액을 징수하는 이 사건 환수처분을 한 것에 재량권을 일탈ㆍ남용한 위법이 있다고 볼 수 없다. \n  그런데도 구 노인장기요양보험법 제43조 제1항 제4호에 따른 부당이득 환수처분이 재량행위에 해당한다는 전제에서, 이 사건 환수처분이 재량권을 일탈ㆍ남용한 것이라고 본 원심판단에는, 구 노인장기요양보험법상 부당이득 환수처분의 기속행위성에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다.\n  5. 결론\n  원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 이흥구(재판장) 오석준 노경필(주심) 이숙연"

    "판례내용": "【원고, 상고인】                원고 (소송대리인 법무법인 유화 담당변호사 송현우)\n【피고, 피상고인】 부산광역시 강서구청장 (소송대리인 법무법인 무한 담당변호사 백태균 외 2인)\n【원심판결】  부산고법 2025. 9. 26. 선고 2025누2336 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 원고가 부담한다.\n\n【이    유】  「화물자동차 운수사업법」 이 2004. 1. 20. 법률 제7100호로 개정되면서 화물자동차 운송사업이 종전 등록제에서 허가제로 전환되었다. 이에 따라 위 개정 법률 제3조 제1항은 \"화물자동차 운송사업을 경영하고자 하는 자는 건설교통부령이 정하는 바에 따라 건설교통부장관의 허가를 받아야 한다.\"라고 규정하고, 같은 조 제5항 제1호에서 그 허가의 기준으로 ‘건설교통부장관이 화물의 운송수요를 감안하여 제4항의 규정에 의한 업종별로 고시하는 공급기준에 적합할 것’을 규정하였다. 이는 화물자동차 운송사업의 초과공급에 따른 불균형을 해소하기 위한 것이다. \n  위 개정 법률 부칙(2004. 1. 20.) 제3조 제2항(이하 ‘이 사건 부칙 규정’이라고 한다)에서는 \"이 법 공포 당시 화물자동차 운송사업을 경영하는 자에게 명의신탁한 화물자동차에 의하여 화물자동차 운송사업을 위탁받은 자 중 2004. 12. 31.부터 당해 명의신탁 및 위ㆍ수탁계약을 해지하고 당해 차량으로 화물자동차 운송사업을 경영하고자 하는 자는 제3조 제5항 제1호의 개정규정에 불구하고 건설교통부장관에게 허가를 신청할 수 있으며, 허가신청을 받은 건설교통부장관은 당해 허가신청자에 대하여 화물자동차 운송사업의 허가를 할 수 있다.\"라고 규정하고 있다. 이로써 2004. 1. 20. 이전에 명의신탁 및 위ㆍ수탁계약을 체결한 기존의 위ㆍ수탁차주가 명의신탁 및 위ㆍ수탁계약을 해지하고 운송사업의 허가를 신청하는 경우에는 건설교통부장관이 고시하는 공급기준에 적합하지 않더라도 이를 허가할 수 있도록 하여 기존 위ㆍ수탁차주에 대한 특례를 인정하고 있다.\n  이 사건 부칙 규정이 위와 같이 기존 위ㆍ수탁차주에 대한 특례를 인정하고 있는 것은 화물자동차에 관하여 명의신탁 및 위ㆍ수탁계약이 체결된 경우 화물자동차 운송사업에 관한 대외적인 권리ㆍ의무는 화물자동차 운송사업자에게 귀속되지만, 그 운송사업에 관한 경제적 손익은 위ㆍ수탁차주에게 귀속되므로, 운송사업의 수행과 관련하여 위ㆍ수탁차주가 운송사업자보다 더 실질적인 이해관계를 가지는 점을 고려한 것이다(대법원 2014. 4. 10. 선고 2011두31604 판결 참조).\n  이 사건 부칙 규정의 문언, 입법에 이르게 된 배경과 그 취지에 기존 위ㆍ수탁차주의 화물자동차 운송사업에 관한 실질적 이해관계와 화물자동차 운송사업을 경영하는 자의 허가대수 감소라는 불이익 사이의 균형을 도모할 필요성까지 더하여 보면, 이 사건 부칙 규정이 정한 ‘당해 명의신탁 및 위ㆍ수탁계약’은 위 개정 법률 공포 당시(2004. 1. 20.) 체결되어 있던 ‘당해 계약 및 이후 영업양도, 계약이전 등으로 동일성을 유지하고 있는 계약’을 의미하고, ‘당해 차량’은 위 공포 당시의 ‘당해 차량 및 그와 자동차등록번호로 표상되는 영업권의 동일성이 인정되는 차량’을 의미한다고 보아야 한다. \n  원심은, 원고가 주식회사 ○○통운과 사이에 종전 화물차에 관하여 2004. 1. 20. 이전에 체결한 명의신탁 및 위ㆍ수탁계약을 해지한 다음 2004. 3. 19. △△기업 주식회사와 사이에 이 사건 화물차에 관하여 별개의 새로운 명의신탁 및 위ㆍ수탁계약을 체결한 사실을 인정한 후, △△기업 주식회사와 사이에 체결한 명의신탁 및 위ㆍ수탁계약은 2004. 1. 20. 당시 체결되어 있던 명의신탁 및 위ㆍ수탁계약이 아니고, 이 사건 화물차는 종전 화물차와 차량 종류 및 자동차등록번호가 달라 동일성이 인정된다고 볼 수 없다고 보아, 원고가 이 사건 부칙 규정에 따른 화물자동차 운송사업의 허가대상에 해당하지 않는다고 판단하였다. \n  원심판결 이유를 위 법리와 기록에 비추어 살펴보면 원심의 위와 같은 판단은 충분히 수긍할 수 있고, 거기에 상고이유 주장과 같이 이 사건 부칙 규정의 해석에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. \n  그러므로 상고를 기각하고 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 엄상필(재판장) 천대엽 오경미(주심) 권영준"
  },

    "판결유형": "판결",
    "판시사항": "[1] 구 관세법에 따른 의무사항을 위반하는 경우뿐 아니라 위반할 우려가 있는 경우, 곧 ‘풍속을 해칠 우려’가 있는 경우에도 세관장이 구 관세법 제237조 제3호에 따라 해당 물품의 통관을 보류할 수 있는지 여부(적극)\n\n [2] 여성의 신체 외관을 본뜬 전신 인형 형태의 남성용 자위기구인 이른바 ‘리얼돌’이 구 관세법 제234조 제1호의 ‘풍속을 해치는 물품’으로서 통관보류의 대상이 될 수 있는 경우 / ‘풍속을 해치는 물품’에 해당하지 않는 ‘리얼돌’에 대하여 세관장이 ‘풍속을 해칠 우려’를 이유로 통관을 보류하는 처분을 하려는 경우, 조사 및 확인해야 할 사항",
    "판결요지": "",
    "참조조문": "[1] 구 관세법(2020. 12. 22. 법률 제17649호로 개정되기 전의 것) 제234조 제1호, 제237조 제3호(현행 제237조 제1항 제3호 참조) / [2] 구 관세법(2020. 12. 22. 법률 제17649호로 개정되기 전의 것) 제234조 제1호, 제237조 제3호(현행 제237조 제1항 제3호 참조)",
    "참조판례": "[2] 대법원 2009. 6. 23. 선고 2008두23689 판결, 대법원 2021. 11. 25. 선고 2021두46421 판결(공2022상, 117)",
    "판례내용": "【원고, 피상고인】                주식회사 ○○○ (소송대리인 법무법인 대호 담당변호사 신동욱)\n【피고, 상고인】 김포공항세관장\n【원심판결】  서울고법 2021. 8. 12. 선고 2021누39203, 2021누39210(병합) 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 피고가 부담한다.\n\n【이    유】  상고이유를 판단한다. \n  1. 사안의 개요\n  원심판결의 이유 및 원심이 적법하게 채택하여 조사한 증거 등에 따르면 다음 사실을 알 수 있다.\n  가. 원고는 2020. 3. 16. 및 2020. 3. 31. 여성 전신과 비슷한 모양의 인형들인 이 사건 물품을 수입하기 위하여 각 수입신고를 하였다. \n  나. 피고는 2020. 4. 16. 및 2020. 5. 13. 성인용품 통관심사위원회의 심사 결과를 이유로 구 관세법(2020. 12. 22. 법률 제17649호로 개정되기 전의 것, 이하 ‘구 관세법’이라고만 한다) 제237조에 따라 이 사건 물품의 수입통관을 각 보류하고, 그 무렵 원고에게 이를 통지하였다(이하 ‘이 사건 처분’이라 한다). \n  2. 원심의 판단 \n  원고는 이 사건 물품이 구 관세법 제234조 제1호에서 수입을 금지하는 ‘풍속을 해치는 물품’에 해당하지 않음에도 그 수입통관을 보류한 이 사건 처분이 재량권을 일탈ㆍ남용한 위법한 처분에 해당한다고 주장하며 피고를 상대로 이 사건 처분의 취소를 구하였고, 피고는 이 사건 물품이 음란한 물건으로서 ‘풍속을 해치는 물품’에 해당한다고 주장하며 이를 다투었다. \n  원심은 판시와 같은 이유로 다음과 같이 판단하였다. 이 사건 물품을 사용하는 공간, 주변 환경, 사용 주체, 용도 등을 충분히 고려하지 않은 채 그 형상만을 기준으로 성풍속을 해친다고 보는 것은 타당하지 않다. 이 사건 물품을 전체적으로 관찰하여 볼 때 그 모습이 상당히 저속하고 문란한 느낌을 주지만 이를 넘어서서 사람의 존엄성과 가치를 심각하게 훼손ㆍ왜곡하였다고 평가할 수 있을 정도로 노골적인 방법에 의하여 성적 부위나 행위를 적나라하게 표현ㆍ묘사한 것이라고 볼 수는 없다. 이 사건 물품의 수입통관을 보류한 이 사건 처분은 위법하다. \n  3. 대법원의 판단 \n  가.                구 관세법 제234조 제1호는 ‘헌법질서를 문란하게 하거나 공공의 안녕질서 또는 풍속을 해치는 서적ㆍ간행물ㆍ도화, 영화ㆍ음반ㆍ비디오물ㆍ조각물 또는 그 밖에 이에 준하는 물품은 수출하거나 수입할 수 없다.’라고, 제237조 제3호는 ‘세관장은 이 법에 따른 의무사항을 위반하거나 국민보건 등을 해칠 우려가 있는 경우에는 해당 물품의 통관을 보류할 수 있다.’라고 각각 규정하고 있다.\n  위와 같은 관련 법령의 체제ㆍ형식과 문언, 수입물품 통관보류처분의 목적과 사전적ㆍ예방적 잠정처분으로서의 성격 등에 비추어 보면, 세관장은 해당 물품이 ‘풍속을 해치는 물품’에 해당하여 이를 수입하는 것이 관세법에 따른 의무사항을 위반하는 경우뿐만 아니라, 해당 물품을 수입하는 것이 관세법에 따른 의무사항을 위반할 우려가 있는 경우, 즉 ‘풍속을 해칠 우려’가 있는 경우에도 구 관세법 제237조 제3호에 따라 해당 물품의 통관을 보류할 수 있다고 봄이 타당하다. \n  나. 여성의 신체 외관을 본뜬 전신 인형 형태의 남성용 자위기구인 이른바 ‘리얼돌’은 그 자체로 사람의 존엄성과 가치를 심각하게 훼손ㆍ왜곡하였다고 평가할 수 있을 정도로 노골적인 방법에 의하여 성적 부위를 적나라하게 표현 또는 묘사하여 음란성을 띠거나, ‘16세 미만 미성년자의 신체 외관을 사실적으로 본뜬 성행위 도구’에 해당한다면, ‘풍속을 해치는 물품’으로서 통관보류의 대상이 될 수 있다(대법원 2009. 6. 23. 선고 2008두23689 판결, 대법원 2021. 11. 25. 선고 2021두46421 판결 등 참조). \n  ‘풍속을 해치는 물품’에 해당하지 않는 ‘리얼돌’이라고 하더라도, 그것이 개인의 사생활 영역에서 성행위 도구로 은밀하게 사용되지 않고 유통되어 사적인 공간 외에서 사용된다면 ‘풍속을 해칠 우려’가 인정될 여지가 있다. 따라서 세관장으로서는 ‘풍속을 해칠 우려’를 이유로 ‘리얼돌’의 통관을 보류하는 처분을 하려는 경우 해당 물품의 수입 목적, 사용 주체, 사용될 공간과 환경, 사용 방법 및 태양 등을 조사하여 ‘풍속을 해칠 우려’가 있다고 볼 구체적 근거가 인정되는지를 확인하여야 한다.\n  다. 원심판결 이유 및 기록에 의하여 알 수 있는 아래와 같은 사정을 앞서 본 법리에 비추어 살펴보면, 이 사건 처분이 위법하다고 본 원심의 판단을 수긍할 수 있고 거기에 상고이유 주장과 같이 관세법의 해석ㆍ적용이나 음란성에 관한 법리를 오해하는 등으로 판결에 영향을 미친 잘못이 없다. \n  1) 이 사건 물품은 여성의 신체 외관을 본뜬 전신 인형 형태의 남성용 자위기구인 리얼돌로서 전체적으로 여성의 모습을 자세히 표현하고 있다. 그러나 이 사건 물품이 그 자체로 사람의 존엄성과 가치를 심각하게 훼손ㆍ왜곡하였다고 평가할 수 있을 정도로 노골적인 방법에 의하여 성적 부위를 적나라하게 표현 또는 묘사하여 음란성을 띤다거나, 16세 미만 미성년자의 신체 외관을 본뜬 것이라고 보기는 어렵다. \n  2) 이 사건 물품이 수입 후 유통되어 사적인 공간 외에서 사용된다면 통관보류 사유로서 ‘풍속을 해칠 우려’가 인정될 여지가 있다. 그러나 피고는 이 사건 물품의 수입 목적, 사용 주체, 사용될 공간과 환경, 사용 방법 및 태양 등 ‘풍속을 해칠 우려’의 존부를 확인할 수 있는 구체적 근거에 관하여는 별다른 조사를 진행하지 않은 채 이 사건 물품의 외관에 대한 검사 결과만으로 이 사건 처분을 하였다. \n  4. 결론 \n  상고를 기각하고 상고비용은 패소자가 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 노태악(재판장) 서경환 신숙희(주심) 마용주"
  },

    "판시사항": "[1] 사립학교법 제53조의2 제7항 전문에서 재임용 심의사유를 학칙이 정하는 객관적인 사유에 근거하도록 규정한 취지\n\n [2] 학칙에 재임용 심의사유 중 학문연구에 관한 사항이 업적물의 게재 또는 게재예정된 학술지 유형 등에 따라 평가점수를 산정해 기준점수 충족 여부를 따지는 정량적(定量的) 심사방법으로 규정되어 있는 경우, 임용권자가 게재업적물 또는 게재예정업적물의 내용을 심사하여 이를 바탕으로 재임용 여부를 심의ㆍ결정할 수 있는지 여부(원칙적 소극) / 재임용 심사 과정에서 소속 교원의 연구부정행위가 의심되는 업적물이 발견된 경우, 정성적(定性的) 심사를 통해 업적물의 연구부정행위 해당 여부를 검증할 수 있는지 여부(적극) 및 그 결과 연구부정행위에 해당하는 경우, 임용권자는 해당 업적물을 정량적 심사대상에서 제외할 수 있는지 여부(적극)",
    "판결요지": "[1] 사립학교법 제53조의2 제7항 전문에서 재임용 심의사유를 학칙이 정하는 객관적인 사유에 근거하도록 규정한 취지는, 대학교원으로서의 재임용 자격 내지 적격성의 유무가 임용권자의 자의가 아니라 ‘학생교육에 관한 사항, 학문연구에 관한 사항, 학생지도에 관한 사항’에 관한 평가 등 객관적인 사유에 의하여 심의되어야 할 뿐만 아니라, 해당 교원에게 사전에 심사방법의 예측가능성을 제공하고 사후에는 재임용거부결정이 합리적인 기준에 의하여 공정하게 이루어졌는지를 심사할 수 있도록 재임용 심사기준이 사전에 객관적인 규정으로 마련되어 있어야 함을 요구하는 것이다.\n\n [2] 학칙에 재임용 심의사유 중 학문연구에 관한 사항이 업적물의 내용을 심사하여 학술적 가치나 학술적 공헌도(기여도)를 평가하는 정성적(定性的) 심사방법이 아니라, 오로지 해당 논문 등 업적물이 게재 또는 게재예정된 학술지의 유형 등에 따라 평가점수를 산정해 기준점수의 충족 여부를 따지는 정량적(定量的) 심사방법으로 규정되어 있는 경우, 임용권자가 게재업적물 또는 게재예정업적물의 내용을 심사하여 이를 바탕으로 재임용 여부를 심의ㆍ결정하는 것은 해당 교원의 재임용 심사기준에 관한 사전 예측가능성과 공정한 심사를 요구할 권리를 침해하는 것이므로, 다른 특별한 사정이 없는 한 사립학교법 제53조의2 제7항 전문에 위반되어 허용되지 않는다.\n  다만 게재업적물 또는 게재예정업적물에 표절ㆍ부당한 저자표시ㆍ부당한 중복게재 등의 연구부정행위가 있는 경우, 그와 같은 업적물은 학술지에 게재가 되었거나 게재예정증명서가 발급되었다고 하더라도 내재되어 있는 하자로 인하여 애초부터 정량적 심사대상에 포함된다고 할 수 없다. 따라서 학칙에 명시적으로 학문연구에 관한 사항에서 업적물에 대한 연구부정행위 해당 여부를 정성적으로 심사할 수 있다는 취지의 규정이 없다고 하더라도, 소속 교원의 연구부정행위에 대한 검증 책임을 부담하는 대학의 임용권자는 재임용 심사 과정에서 연구부정행위가 의심되는 업적물이 발견된 경우, 해당 교원으로 하여금 문제 되는 업적물을 제출하게 한 후 자체 연구윤리지침이 규정하고 있는 절차에 따른 정성적 심사를 통해 업적물의 연구부정행위 해당 여부를 검증할 수 있다. 그 결과 해당 업적물이 연구부정행위에 해당된다고 판정되면, 임용권자는 해당 업적물을 정량적 심사대상에서 제외할 수 있다.",

    "판례내용": "【원고, 상고인】                원고 (소송대리인 변호사 신광렬)\n【피고, 피상고인】 교원소청심사위원회\n【피고보조참가인】                학교법인 ○○학원 (소송대리인 변호사 유현정)\n【원심판결】  서울고법 2023. 6. 22. 선고 2022누55288 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 보조참가로 인한 부분을 포함하여 원고가 부담한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위 내에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 아래의 각 사실을 알 수 있다. \n  가. 당사자의 지위\n  1) 원고는 2010. 3. 1. ○○대학교(이하 ‘이 사건 대학’이라 한다) △△대학 △△학과 조교수로 신규임용되어 2012. 3. 1. 재임용되었고(임용기간: 2012. 3. 1.∼2015. 2. 28.), 2015. 3. 1. 다시 재임용되었으며(임용기간: 2015. 3. 1.∼2018. 2. 28.), 2015. 9. 1. 부교수로 승진임용되었다(임용기간: 2015. 9. 1.∼2020. 8. 31.). \n  2) 피고 보조참가인(이하 ‘참가인’이라 한다)은 이 사건 대학을 설치ㆍ경영하는 학교법인이다.\n  나. 원고에 대한 재임용절차 개시 및 연구윤리진실성위원회의 조사\n  1) 이 사건 대학은 2020. 3. 23. 원고에게 재임용 심사 신청을 안내하였고, 원고는 2020. 3. 29. 재임용 심사 신청서, 2020. 4. 9. 자기평가서, 2020. 4. 29.부터 2020. 5. 8.까지 제1심판결 별지1 표 기재 9편의 논문에 대한 게재예정증명서를 제출하였다. \n  2) 이 사건 대학의 본부 교원심사위원회는 2020. 5. 19. ‘학과와 단과대학의 심사 단계에서 연구실적 부족(취득 0점/재임용 기준 1,125점)으로 기준점수에 상응하는 연구실적에 대한 게재예정증명서 및 연구실적을 기한 내에 제출할 것을 조건으로 하여 재임용을 추천하는 의견이 올라왔고, 본부 심사 단계에서 원고가 게재예정증명서를 제출한 이상 조건부로 원고의 재임용을 추천하되, 짧은 기간에 다수의 논문을 투고한 점, 게재예정증명서 발급시기의 의문점 등을 고려할 때, 교원인사위원회에 원고의 연구업적에 대한 별도의 조사가 필요하다는 의견을 부가한다.’는 의결을 하였다.\n  3) 원고는 2020. 5. 20.경 위 각 게재예정증명서에 의하여 증명되는 각 논문을 제출하였다. 이 사건 대학의 교원인사위원회는 2020. 5. 21. ‘원고가 자기평가서를 제출할 당시 연구실적 점수가 0점이었고, 그로부터 1개월 내에 9편의 논문이 작성되어 학과 심사부터 본부 심사 단계에 이르기까지 9편의 논문에 대한 게재예정증명서가 제출되었는데, 일부 논문에 자기표절 등 부정행위 가능성에 대한 의견이 있어 검토가 필요하다. 따라서 원고에 대한 재임용 심의는 보류하고, 연구윤리진실성위원회에 원고의 연구업적에 대한 검증을 의뢰하며, 그 결과에 따라 재심사를 진행하기로 한다.’는 의결을 하였다.\n  4) 이 사건 대학의 연구윤리진실성위원회는 예비조사위원회를 결성하여 2020. 6. 11.경부터 원고가 이 사건 대학의 재임용 절차에서 교원인사위원회에 제출한 위 표 기재 9편의 논문에 대하여 연구부정행위 해당 여부를 조사하였다. 예비조사위원회는 2020. 7. 14. ‘위 표 연번 2번 기재 논문을 제외한 나머지 8편의 논문(합하여 이하 ‘이 사건 각 논문’이라 한다) 사이에 문서유사율이 최소 6%에서 최대 70%에 달하는 것으로 나타나 광범위하고도 전면적인 상호 간 표절, 중복 또는 논문 쪼개기의 근거가 상당하므로, 이는 연구부정행위에 해당한다.’는 조사 결과를 통보하였다. \n  5) 이 사건 대학의 교원인사위원회는 2020. 8. 18. 연구윤리진실성위원회의 최종 조사 결과를 확인한 후 다시 원고에 대한 재임용 심의를 진행하기로 하고, 원고를 2020. 9. 1.부터 한시적으로 재임용하기로 의결하였다.  \n  6) 이 사건 대학의 연구윤리진실성위원회는 이 사건 각 논문의 연구부정행위 해당 여부에 대한 최종 조사를 위해 본조사위원회를 결성하였다. 본조사위원회는 2020. 12. 14. ‘연구윤리진실성위원회의 주된 조사 대상은 2020. 5. 20.경 제출된 9편의 논문이고, 논문들 사이에 유사도가 높다는 것은 분명하며, 원고가 유사성에 대해 인지하지 못했다고 볼 수 없으므로, 이 사건 각 논문의 제출에 있어 연구부정행위가 있다.’는 조사 결과를 통보하였다. \n  다. 원고에 대한 재임용 거부처분 및 소청심사 청구\n  1) 이 사건 대학의 교원인사위원회는 2020. 12. 10. 연구윤리진실성위원회의 조사 결과 등을 참고하여 원고의 재임용을 추천하지 않는 것으로 결론을 내리되, 원고의 의견진술을 들은 후 최종 재임용 여부를 심의ㆍ의결하기로 하였다.\n  2) 이 사건 대학의 교원인사위원회는 2020. 12. 28. 원고에게 의견진술의 기회를 부여한 후, 이 사건 각 논문의 광범위하고 전면적인 유사성이 연구부정행위에 해당하여 이를 연구업적으로 인정하지 아니하고, 이에 따라 원고가 재임용 요건을 충족하지 못한 것으로 보아 재임용을 추천하지 않는 것으로 의결하였다. \n  3) 참가인은 2021. 2. 23. 다음과 같은 내용의 재임용을 위한 기준점수 미충족 및 연구부정행위의 사유로 원고의 재임용을 거부하는 처분(이하 ‘이 사건 재임용 거부처분’이라 한다)을 하였다. ① 재임용 심사를 위해 교원인사위원회에 제출된 이 사건 각 논문에 대한 연구윤리진실성위원회 검증 결과 연구부정행위로 판정되었다. ② 일부 논문의 게재예정증명서 발급일이 논문심사일과 상이하고, 게재예정증명서 발급 이후 수정된 논문의 내용이 게재예정증명서와 함께 제출되었던 게재예정논문과 통상적으로 용인되는 범위를 벗어나 완전히 다른 논문이 되었음에도 추가 재심사 없이 게재되었다.\n  4) 원고는 이 사건 재임용 거부처분에 불복하여 피고에게 소청심사를 청구하였으나, 피고는 2021. 5. 26. 원고의 소청심사청구를 기각하는 결정을 하였다.\n  2. 제1, 2, 3 상고이유에 관한 판단\n  가. 관련 규정과 법리\n  1) 사립학교법 제53조의2 제7항 전문은, 교원인사위원회가 같은 조 제6항의 규정에 의하여 해당 교원에 대한 재임용 여부를 심의함에 있어서는 ‘학생교육에 관한 사항, 학문연구에 관한 사항, 학생지도에 관한 사항’에 관한 평가 등 객관적인 사유로서 학칙이 정하는 사유에 근거하여야 한다고 규정하고 있다. 이 조항에 따른 학칙인 「○○대학교 교원인사에 관한 시행규칙」(2019. 1. 1. 개정된 후 2021. 3. 1. 개정되기 전의 것, 이하 ‘이 사건 시행규칙’이라 한다) 제18조 제4항 [별표 3]은 인문사회계열 일반교원의 연구영역에 관한 재임용 심사기준을 ‘국제 및 국내저명학술지 225점 × 직급별 재직일수’로 하되, ‘재임용 심사 시 인정 업적물’을 ① 기승인된 업적물과 ② 자기평가서 제출예정목록에 기록된 업적물 중 게재예정증명서(Accept Letter 포함)가 있는 업적물로 규정하고 있다.  \n                 사립학교법 제53조의2 제7항 전문에서 재임용 심의사유를 학칙이 정하는 객관적인 사유에 근거하도록 규정한 취지는, 대학교원으로서의 재임용 자격 내지 적격성의 유무가 임용권자의 자의가 아니라 ‘학생교육에 관한 사항, 학문연구에 관한 사항, 학생지도에 관한 사항’에 관한 평가 등 객관적인 사유에 의하여 심의되어야 할 뿐만 아니라, 해당 교원에게 사전에 심사방법의 예측가능성을 제공하고 사후에는 재임용거부결정이 합리적인 기준에 의하여 공정하게 이루어졌는지를 심사할 수 있도록 재임용 심사기준이 사전에 객관적인 규정으로 마련되어 있어야 함을 요구하는 것으로 보아야 한다(대법원 2021. 2. 10. 선고 2015다254231 판결, 대법원 2025. 2. 20. 선고 2024두55877 판결 등 참조).\n  2) 학칙에 재임용 심의사유 중 학문연구에 관한 사항이 업적물의 내용을 심사하여 학술적 가치나 학술적 공헌도(기여도)를 평가하는 정성적(定性的) 심사방법이 아니라, 오로지 해당 논문 등 업적물이 게재 또는 게재예정된 학술지의 유형 등에 따라 평가점수를 산정해 기준점수의 충족 여부를 따지는 정량적(定量的) 심사방법으로 규정되어 있는 경우, 임용권자가 게재업적물 또는 게재예정업적물의 내용을 심사하여 이를 바탕으로 재임용 여부를 심의ㆍ결정하는 것은 해당 교원의 재임용 심사기준에 관한 사전 예측가능성과 공정한 심사를 요구할 권리를 침해하는 것이므로, 다른 특별한 사정이 없는 한 사립학교법 제53조의2 제7항 전문에 위반되어 허용되지 않는다.\n  다만 게재업적물 또는 게재예정업적물에 표절ㆍ부당한 저자표시ㆍ부당한 중복게재 등의 연구부정행위가 있는 경우, 그와 같은 업적물은 학술지에 게재가 되었거나 게재예정증명서가 발급되었다고 하더라도 내재되어 있는 하자로 인하여 애초부터 정량적 심사대상에 포함된다고 할 수 없다. 따라서 학칙에 명시적으로 학문연구에 관한 사항에서 업적물에 대한 연구부정행위 해당 여부를 정성적으로 심사할 수 있다는 취지의 규정이 없다고 하더라도, 소속 교원의 연구부정행위에 대한 검증 책임을 부담하는 대학의 임용권자는 재임용 심사 과정에서 연구부정행위가 의심되는 업적물이 발견된 경우, 해당 교원으로 하여금 문제 되는 업적물을 제출하게 한 후 자체 연구윤리지침이 규정하고 있는 절차에 따른 정성적 심사를 통해 업적물의 연구부정행위 해당 여부를 검증할 수 있다. 그 결과 해당 업적물이 연구부정행위에 해당된다고 판정되면, 임용권자는 해당 업적물을 정량적 심사대상에서 제외할 수 있다고 보아야 한다.\n  나. 판단\n  1) 원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하여 알 수 있는 다음의 사정들을 앞서 본 관련 규정과 법리에 비추어 살펴보면, 임용권자인 참가인 측이 재임용 심의 과정에서 원고로부터 이 사건 각 논문을 제출받아 그 연구부정행위 해당 여부를 검증ㆍ판정한 후, 재임용을 위한 기준점수 미충족 및 연구부정행위의 사유로 이 사건 재임용 거부처분을 한 것이 사립학교법 제53조의2 제7항 전문에 위반된다고 보기 어렵다.\n  가) 이 사건 대학의 재임용 심사기준 중 학문연구에 관한 사항을 규정하고 있는 이 사건 시행규칙 제18조 제4항 [별표 3]은 오로지 정량적 심사방법만을 명시적으로 규정하고 있다. 따라서 참가인이 원고의 업적물 내용을 구체적으로 심사하여 그 학문적 가치나 학문적 공헌도(기여도)를 평가한 후, 그 평가 내용을 재임용 심사 중 학문연구 부분에 반영하는 것은 원칙적으로 허용되지 않는다.\n  나) 그러나 학칙이 재임용 심사 중 학문연구 부분에 있어 오로지 정량적 심사방법만을 규정하고 있다고 하더라도, 이 사건 시행규칙 제18조 제4항 [별표 3]과 같이 정량적 심사의 대상이 학술지에 게재된 논문 또는 게재예정논문 등의 업적물로 규정되어 있는 이상, 해당 교원은 임용권자의 요구에 따라 게재논문 또는 게재예정논문을 제출하여야 할 의무를 부담한다. 원고가 이 사건 대학에 재임용 심사 과정에서 제출한 자기평가서 양식의 ‘제출예정 연구실적 목록’란에는 \"심사를 위하여 출력물은 전문을 제출하여 주시기 바랍니다.\"라고 부동문자로 기재되어 있으므로, 원고가 재임용 심사 과정에서 게재논문 또는 게재예정논문의 제출이 필요하지 않은 것으로 예측하였다고 보기도 어렵다.\n  다) 원고가 2020. 4. 9. 제출한 자기평가서에는 ‘연구’의 ‘논문’란에 8편의 논문 제목과 개요만이 기재되어 있고, 각 논문이 어떠한 학술지에 게재될 예정인지 특정되어 있지 않았다. 원고는 2020. 4. 29.부터 2020. 5. 8.까지 총 9편의 논문에 관한 게재예정증명서를 논문을 첨부하지 않고 제출하였다. 원고는 2020. 5. 20.경이 되어서야 게재예정논문 9편을 한꺼번에 제출하였는데, 그중 이 사건 각 논문 사이에 유사성이 강하게 의심되었다. 이 사건 대학은 그 무렵 원고가 제출한 업적물 관련 연구부정행위의 가능성을 인지한 것으로 보이므로, 이 사건 대학이 자체 연구윤리지침인 「○○대학교 연구윤리진실성위원회 규정」(2019. 12. 1. 개정된 것, 이하 ‘이 사건 위원회 규정’이라 한다)에 따라 이 사건 각 논문 제출에 관한 연구부정행위 검증 절차를 개시한 것이 자의적이라거나 불공정한 것이라고 보기 어렵다.\n  라) 이 사건 대학의 연구윤리진실성위원회 예비조사위원회는 이 사건 각 논문이 상호 간 표절, 중복 또는 논문 쪼개기로써 연구부정행위에 해당한다는 조사 결과를 통보하였다. 원고의 불복으로 계속된 연구윤리진실성위원회 본조사위원회 조사에서, 본조사위원회는 예비조사위원회의 조사 결과를 추인하면서, ‘원고가 2020. 7. 3.경까지 이 사건 각 논문을 수정하여 그들 사이의 유사도를 낮춘 것으로 보이기는 하나, 연구윤리진실성위원회의 주된 조사대상은 2020. 5. 20.경 제출된 이 사건 각 논문이고, 그들 사이의 유사도가 높다는 것은 분명하며, 원고가 유사성에 대해 인지하지 못했다고 볼 수 없으므로, 원고의 이 사건 각 논문 관련 행위는 연구부정행위에 해당한다.’는 조사 결과를 통보하였다. 이 사건 대학이 위와 같이 개시한 이 사건 각 논문의 연구부정행위 검증 절차에서 원고의 이 사건 각 논문 관련 행위를 연구부정행위로 판정한 것은 학술진흥법령과 이 사건 대학의 자체 연구윤리지침인 이 사건 위원회 규정에 따른 것으로서 그 절차 및 판정 결과가 자의적이라거나 불공정하다고 볼 수 없다.\n  마) 원고가 재임용 심의를 통과하기 위하여 상호 유사도가 높은 이 사건 각 논문과 그에 관한 각 게재예정증명서를 제출한 행위는 이 사건 위원회 규정 제4조 제1항 제5호의 ‘부당한 중복게재’ 또는 같은 항 제8호의 ‘그 밖에 각 학문분야에서 통상적으로 용인되는 범위를 심각하게 벗어난 행위’로서 연구 수행단계에서의 연구부정행위에 해당한다. 따라서 이 사건 각 논문은 재임용 심사 중 학문연구 부분에 있어 정량적 심사대상에 포함될 수 없다. \n  바) 이 사건 시행규칙 제18조 제4항 [별표 3]에서 규정하고 있는 게재예정증명서는 논문이 해당 학술지에 게재될 예정임을 확인하는 공식 문서로서, 최종 게재 승인 후 연구자의 요청으로 발급되는 것이므로, 그 증명서가 발급될 당시에 작성되어 있는 논문이 게재심사가 종료된 상태에서 그대로 게재가 될 예정임을 증명하는 것이다. 원고가 2020. 5. 20.경 참가인에게 게재예정증명서들에 의하여 증명되는 이 사건 각 논문을 제출한 후 2020. 7. 3.까지 이 사건 각 논문을 수정하여 유사도를 낮추었다고 하더라도, 재임용 심사대상은 게재예정증명서에 의하여 증명되는 이 사건 각 논문이지 원고가 게재예정증명서 제출 이후 수정한 논문들이 아니므로, 원고의 위와 같은 수정으로 이미 발생한 연구부정행위가 치유된다고 보기도 어렵다.\n  2) 원심은, 그 판시와 같은 이유로, 이 사건 시행규칙 제18조 제4항 [별표 3]이 재임용 심사 중 학문연구에 관한 사항을 오로지 학회지 게재 등에 따른 정량적 심사방법만으로 규정하고 있더라도 재임용 심사의 대상이 되는 것은 결국 업적물의 내용이라는 전제에서, 참가인이 원고의 이 사건 각 논문 관련 행위를 연구부정행위에 해당한다고 보고, 이 사건 각 논문을 제외할 경우 원고가 재임용을 위한 연구영역 점수를 충족하지 못하였다는 사유로 이 사건 재임용 거부처분을 한 것은 적법하다고 판단하였다. \n  앞서 본 관련 규정과 법리에 비추어 살펴보면, 이와 같은 원심의 이유 설시에는 일부 적절하지 않은 부분이 있으나, 임용권자인 참가인 측이 원고의 이 사건 각 논문 관련 행위를 연구부정행위에 해당한다고 검증ㆍ판정한 것이 적법하다는 전제에서, 이 사건 재임용 거부처분을 적법하다고 판단한 원심의 결론은 정당하다. 거기에 상고이유 주장과 같이 교원지위법정주의나 사립학교법 제53조의2 제7항에서 규정하는 재임용 심의, 학술진흥법령상 중복게재ㆍ자기표절, 연구부정행위 판정에 관한 법리를 오해하여 판결에 영향을 미친 위법이 없다.\n  3. 제4 상고이유에 관한 판단\n  원심은 그 판시와 같은 이유로, 이 사건 각 논문의 연구부정행위를 검증한 이 사건 대학 연구윤리진실성위원회 본조사위원회의 구성이 관련 법령이나 학칙에 위반되지 않는다고 판단하였다.\n  관련 법리 및 적법하게 채택한 증거들에 비추어 살펴보면, 원심의 판단에 상고이유 주장과 같이 학술진흥법령상 연구윤리진실성위원회 본조사위원회의 구성에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.  \n  4. 결론\n  상고를 기각하고 상고비용은 패소자가 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.   \n\n대법관 노태악(재판장) 신숙희 마용주(주심)"

    "판결요지": "개발제한구역의 지정 및 관리에 관한 특별조치법(이하 ‘개발제한구역법’이라 한다) 제12조 제1항 제1호 (나)목, (다)목, 제21조 제1항 제2호, 제24조 제2항, 제4항, 구 개발제한구역의 지정 및 관리에 관한 특별조치법 시행령(2019. 5. 21. 대통령령 제29778호로 개정되기 전의 것, 이하 ‘구 개발제한구역법 시행령’이라 한다) 제13조 제1항 [별표 1] 제2호 (가)목, 제3호 (하)목, 제36조 제1항 제1호 (나)목, (다)목의 문언과 체계, 연혁 및 입법 취지 등에 비추어 보면, 구 개발제한구역법 시행령 제36조 제1항 제1호 (다)목에 따라 개발제한구역법 제24조 제2항에서 정한 보전부담금 계산식의 ‘허가 받은 토지형질변경 면적’에서 제외되는 \"[별표 1] 제3호 (하)목에 따른 공사용 임시 가설건축물과 임시시설(이하 ‘공사용 임시시설’이라 한다)의 부지로서 그 공사의 사업부지에 있는 토지\"란, 공사용 임시시설의 부지로서 그 임시시설의 목적이 되는 공사(이하 ‘본공사’라 한다)의 사업부지에 있는 토지를 의미하고, 여기에서 ‘본공사의 사업부지’는 개발제한구역법령에 따른 행위허가를 받아 본공사가 이루어지는 부지를 뜻한다.",
    "참조조문": "개발제한구역의 지정 및 관리에 관한 특별조치법 제12조 제1항 제1호 (나)목, (다)목, 제21조 제1항 제2호, 제24조 제2항, 제4항, 구 개발제한구역의 지정 및 관리에 관한 특별조치법 시행령(2019. 5. 21. 대통령령 제29778호로 개정되기 전의 것) 제13조 제1항 [별표 1] 제2호 (가)목, 제3호 (하)목, 제36조 제1항 제1호 (나)목, (다)목[현행 제36조 제1항 제1호 (라)목 참조]",

    "판례내용": "【원고, 피상고인 겸 상고인】                ○○○철도 주식회사 (소송대리인 법무법인(유한) 광장 담당변호사 이인형 외 4인)\n【피고, 상고인 겸 피상고인】 고양시장 (소송대리인 법무법인 목성 담당변호사 이창석 외 3인)\n【원심판결】  서울고법 2023. 2. 15. 선고 2021누33496 판결         \n【주    문】\n  상고를 모두 기각한다.  상고비용 중 원고의 상고로 인한 부분은 원고가, 피고의 상고로 인한 부분은 피고가 각 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 다음과 같은 사실을 알 수 있다.\n  가. 대한민국(주무관청: 국토교통부장관)은 2015. 12. 18. ‘(구간 생략) 복선전철 민간투자시설사업’(이하 ‘이 사건 복선전철사업’이라 한다)에 관하여 사업시행자인 원고와 실시협약을 체결하였다. 원고는 이 사건 복선전철사업에 관하여 「사회기반시설에 대한 민간투자법」 제15조 제1항 등에 따라 주무관청으로부터, 2016. 7. 4. 처음 실시계획에 대한 승인을 받았고, 2017. 12. 4. 실시계획에 대한 변경승인을 받았다. 변경승인이 된 실시계획에 따르면, 이 사건 복선전철사업의 사업시행지역은 고양시 덕양구(이하 ‘덕양구’라 하고, 그 구청장을 ‘덕양구청장’이라 한다), 부천시 및 서울 강서구의 각 일부 동이었고, 사업면적은 총 425,983.5㎡(= 수용 39,644.4㎡ + 사용 328,073.1㎡ + 임시사용 58,266㎡)이었다.\n  나. 원고는 이 사건 복선전철사업의 시행을 위하여 2016. 11. 18.경 「개발제한구역의 지정 및 관리에 관한 특별조치법」(이하 ‘개발제한구역법’이라 한다) 제12조 제1항 단서 제1호 (나)목에 근거하여 덕양구의 개발제한구역 내에 있는 △△동 (상세주소 생략) 외 199필지 중 일부 면적에 대하여 토지의 형질변경 등에 관한 행위허가를 신청하였고, 그 무렵 행위허가를 받았다. 원고는 2017. 10. 17.경 위 행위허가에 관하여 형질변경 면적 등을 변경하는 내용으로 변경신청을 하였고, 이에 대하여 덕양구청장은 2017. 12. 27.경 위 행위허가의 면적을 기존 45,760㎡에서 49,456㎡로 변경하는 내용의 변경허가를 하였다(이하 위와 같이 변경된 행위허가를 ‘본노선 허가’라 한다).\n  다. 원고는 본노선 허가와는 별개로, 2017. 12. 7.경 덕양구청장에게 개발제한구역법 제12조 제1항 단서 제1호 (다)목에 근거하여 마찬가지로 덕양구의 개발제한구역 내에 있는 △△동 (상세주소 생략) 외 199필지 중 28,535㎡(본노선 허가의 면적 49,456㎡와는 다른 토지 부분이다)에 대하여 토지의 형질변경 등에 관한 행위허가를 신청하였다. 덕양구청장은 2018. 1. 22. 원고에게 허가 목적을 ‘공사용 임시시설[(구간 생략) 복선전철 공사용 가도]’로, 허가 면적을 위 28,535㎡로 하여 행위허가를 하였다(이하 ‘임시시설 허가’라 한다).\n  라. 피고는 본노선 허가에 관하여 원고에게 개발제한구역법 제21조 제1항 제2호에 따라 개발제한구역 보전부담금(이하 ‘보전부담금’이라 한다)을 부과하였다. 이와 별도로 피고는 임시시설 허가에 관하여 2018. 2. 5. 원고에게 개발제한구역법 제21조 제1항 제2호에 따라 보전부담금으로 2,583,678,380원을 부과하였다. 이후 피고는 2018. 5. 4. 임시시설 허가의 면적 28,535㎡ 중 일부가 구 「개발제한구역의 지정 및 관리에 관한 특별조치법 시행령」(2019. 5. 21. 대통령령 제29778호로 개정되기 전의 것, 이하 ‘구 개발제한구역법 시행령’이라 한다) 제36조 제1항 제1호 (나)목에서 정한 ‘이미 토지의 형질변경 허가를 받은 부지에서 다시 형질변경하는 토지(이미 부담금이 부과되어 납부된 토지 또는 2000. 7. 1. 전에 허가를 받아 형질변경한 토지에서 허가된 사업 외의 사업을 위하여 허가를 받아 형질변경하는 경우를 포함한다)’에 해당하여 보전부담금의 산정 면적에서 제외된다는 이유로, 위 보전부담금 2,583,678,380원을 1,623,415,590원으로 감액하였다(이하 위와 같이 감액되어 남아 있는 피고의 2018. 2. 5. 자 보전부담금 부과처분을 ‘이 사건 부과처분’이라 하고, 임시시설 허가의 면적 28,535㎡ 중 보전부담금의 산정 면적에서 제외된 부분을 뺀 나머지를 ‘이 사건 토지들’이라 한다).\n  2. 관련 법령\n  가. 개발제한구역법 제12조 제1항은, 본문으로 개발제한구역에서는 건축물의 건축, 공작물의 설치, 토지의 형질변경 등을 할 수 없다고 규정하면서, 단서로 다만 다음 각 호의 어느 하나에 해당하는 행위를 하려는 자는 시장ㆍ군수ㆍ구청장 등의 허가를 받아 그 행위를 할 수 있다고 규정한다. 그리고 각 호 중 제1호에서 (나)목으로 ‘도로, 철도 등 개발제한구역을 통과하는 선형시설과 이에 필수적으로 수반되는 시설로서 대통령령으로 정하는 건축물의 건축 또는 공작물의 설치와 이에 따르는 토지의 형질변경’을, (다)목으로 ‘개발제한구역이 아닌 지역에 입지가 곤란하여 개발제한구역 내에 입지하여야만 그 기능과 목적이 달성되는 시설로서 대통령령으로 정하는 건축물의 건축 또는 공작물의 설치와 이에 따르는 토지의 형질변경’을 각각 규정한다. 이러한 위임을 받아 구 개발제한구역법 시행령 제13조 제1항 [별표 1]은 허가의 대상이 되는 건축물 또는 공작물로서 제2호(개발제한구역을 통과하는 선형시설과 필수시설)에서 (가)목으로 철도를, 제3호(개발제한구역에 입지하여야만 기능과 목적이 달성되는 시설)에서 (하)목으로 공사용 임시 가설건축물 및 임시시설을 각각 규정한다.\n  나. 개발제한구역법 제21조 제1항 제2호는 같은 법 제12조 제1항 단서에 따른 허가(토지의 형질변경 허가나 건축물의 건축 허가가 이에 해당한다)를 받은 자에게 보전부담금을 부과ㆍ징수한다고 규정한다. 그리고 같은 법 제24조는 제2항에서 위 보전부담금은 ‘(개발제한구역이 있는 특별자치시ㆍ특별자치도ㆍ시ㆍ군 또는 자치구의 개발제한구역 외의 지역에 위치하는 같은 지목에 대한 개별공시지가의 평균치 - 허가 대상 토지의 개별공시지가) × 허가 받은 토지형질변경 면적과 건축물 바닥면적의 2배 면적 × 100분의 150의 범위에서 [별표]에서 규정하는 시설별 부과율’의 계산식에 따른 금액으로 한다고 규정하고, 제4항에서 그 밖에 보전부담금 산정에 관하여 필요한 사항은 대통령령으로 정한다고 규정한다. 이러한 위임을 받아 구 개발제한구역법 시행령 제36조 제1항은 보전부담금 산정에 관한 세부기준을 규정하는데, 그중 제1호는 위 계산식의 ‘허가 받은 토지형질변경 면적’에 다음 각 목의 토지의 면적은 포함하지 아니할 것으로 규정하면서, (나)목에서 ‘이미 토지의 형질변경 허가를 받은 부지에서 다시 형질변경하는 토지(이미 부담금이 부과되어 납부된 토지 또는 2000. 7. 1. 전에 허가를 받아 형질변경한 토지에서 허가된 사업 외의 사업을 위하여 허가를 받아 형질변경하는 경우를 포함한다)’를, (다)목에서 ‘[별표 1] 제3호 (하)목에 따른 공사용 임시 가설건축물과 임시시설의 부지로서 그 공사의 사업부지에 있는 토지’를 각각 규정한다.\n  3. 원고의 상고이유에 대하여\n  가. 관련 법령의 문언과 체계, 연혁 및 입법 취지 등에 비추어 보면, 구 개발제한구역법 시행령 제36조 제1항 제1호 (다)목(이하 ‘이 사건 시행령 조항’이라 한다)에 따라 개발제한구역법 제24조 제2항이 정한 보전부담금 계산식의 ‘허가 받은 토지형질변경 면적’에서 제외되는 \"[별표 1] 제3호 (하)목에 따른 공사용 임시 가설건축물과 임시시설(이하 ‘공사용 임시시설’이라고만 한다)의 부지로서 그 공사의 사업부지에 있는 토지\"란, 공사용 임시시설의 부지로서 그 임시시설의 목적이 되는 공사(이하 ‘본공사’라 한다)의 사업부지에 있는 토지를 의미하고, 여기에서 ‘본공사의 사업부지’는 개발제한구역법령에 따른 행위허가를 받아 본공사가 이루어지는 부지를 뜻한다고 보아야 한다. 그 구체적인 이유는 다음과 같다.\n  1) 개발제한구역법 제12조 제1항 단서에 따른 행위허가를 받아 건축물의 건축, 공작물의 설치, 토지의 형질변경 등을 하는 것도 하나의 ‘사업’에 해당한다. 이 사건 시행령 조항은 위와 같은 행위허가를 받아 수행하는 사업에 대하여 같은 법 제21조 제1항 제2호에 따라 부과되는 보전부담금의 예외를 설정하기 위한 규정이다. 이러한 점들을 고려하면, 이 사건 시행령 조항에서 말하는 ‘본공사의 사업부지’는 위와 같은 행위허가를 받아 본공사로서 건축물의 건축, 공작물의 설치, 토지의 형질변경 등이 이루어지는 일이 일어나는 부지를 의미한다고 봄이 타당하다. \n  2) 이와 달리 이 사건 시행령 조항에 있는 ‘사업’의 의미를 별도의 다른 법령에 따라 해석할 필연적인 근거가 없다. 만일 ‘본공사의 사업부지’를 개발제한구역법령이 아니라 본공사에 적용되는 별도의 다른 법령에 따라 확정하여야 한다면, 사안에 따라 일관된 해석이 불가능하다. 즉 개발제한구역법령 외에 본공사에 적용되는 별도의 다른 법령이 존재하는지, 그 다른 법령이 사업 또는 사업의 범위를 정의하고 있는지, 그 다른 법령에서 사업에 영향을 미치는 당사자나 행정청의 어떠한 행위(예컨대 실시협약, 실시계획 등)를 예정하고 있는지 또는 그러한 행위가 실제로 어떻게 이루어졌는지와 같은 우연하고 임의적인 사정에 따라 ‘본공사의 사업부지’가 확정되고 보전부담금의 부과 여부가 달라지게 된다. 이러한 결론은 쉽게 받아들이기 어렵다.\n  3) 연혁적으로 보면, 이 사건 시행령 조항은 「개발제한구역의 지정 및 관리에 관한 특별조치법 시행령」이 2003. 11. 4. 대통령령 제18119호로 개정되면서 신설되었다(신설 당시의 문언은 ‘[별표 1] 제9호 (저)목의 규정에 의한 공사용 임시가설건축물 및 임시시설의 부지로서 그 공사의 사업부지 안의 토지’였다). 그런데 위 대통령령의 개정이유는 위 조항을 신설한 이유를 \"개발제한구역 훼손부담금(이후 보전부담금으로 명칭이 변경되어 현재에 이르고 있다)의 ‘이중부과 방지’를 위하여 ‘사업부지 안’에 설치하는 공사용 임시가설건축물에 대하여는 개발제한구역 훼손부담금의 부과 대상에서 제외함\"으로 밝히고 있다. 즉 당시 규정을 신설한 행정입법자는 보전부담금을 이중으로 부과하는 것을 피하기 위하여 사업부지의 안과 밖으로 나누어, 공사용 임시가설건축물 및 임시시설의 부지가 본공사의 ‘사업부지 안’에 있는 경우에는 이중부과가 되므로 이를 보전부담금 산정 대상 면적에서 제외하고, ‘사업부지 밖’에 있는 경우에는 이중부과가 되지 않으므로 이를 보전부담금 산정 대상 면적에 포함하도록 하였다. 그런데 이처럼 사업부지의 안인지 밖인지에 따라 보전부담금의 이중부과 여부가 달라진다고 보았다는 것은, 그 ‘사업부지’를 보전부담금의 부과 대상이 되는 개발제한구역법령에 따른 행위허가가 이루어진 토지로 상정하였음을 전제로 한다. 그렇다면 행정입법자는 위 조항의 ‘본공사의 사업부지’를 개발제한구역법령에 따른 행위허가를 받아 본공사가 이루어지는 부지로 보았음이 분명하고, 이러한 연혁과 입법 취지를 고려하더라도 이 사건 시행령 조항에 관한 다른 해석은 가능하지 않다.\n  4) 공사용 임시시설이 한시적ㆍ부수적으로 설치되는 것이라고 하더라도, 이로 인해 토지의 형질이 외형상으로 사실상 변경되고 그 변경으로 말미암아 원상회복이 어려운 상태가 되는 이상(대법원 2007. 2. 23. 선고 2006두4875 판결 참조), 개발제한구역의 훼손은 이미 발생하는바, 그 훼손을 억제하고 이를 관리하기 위한 재원을 확보할 필요는 여전히 인정되므로 공사용 임시시설의 부지에 대하여 보전부담금을 부과하는 의미가 있고, 행위자에게 사후적인 원상복구의 의무가 있다고 하여 달리 볼 수 없다. 공사용 임시시설의 한시적인 성격 등은 개발제한구역법 제24조 제2항이 정한 보전부담금 계산식의 ‘[별표]에서 규정하는 시설별 부과율’에 이미 반영되어, 이에 대해서는 상대적으로 낮은 부과율로 산정한 보전부담금이 부과되도록 규정하고 있다[개발제한구역법 [별표] 제3호 (가)목 참조]. 그 밖에 달리 앞서 본 이중부과의 방지 외에 공사용 임시시설의 부지에 대하여 보전부담금을 부과하지 않아야 할 근거를 찾기 어렵다.\n  나. 원심은, 이 사건 토지들의 면적은 이 사건 시행령 조항에 따라 보전부담금 산정 대상 면적에서 제외되어야 한다는 원고의 주장에 대하여, 이 사건 시행령 조항의 \"공사용 임시시설의 부지로서 ‘그 공사의 사업부지’에 있는 토지\"에서 ‘그 공사의 사업부지’는 개발제한구역법령에 따른 행위허가를 받아 본공사가 이루어지는 부지를 뜻한다는 전제하에, 이 사건 토지들은 본노선 허가를 받아 공사가 이루어지는 부지(49,456㎡)에 있는 토지가 아니고, 달리 이 사건 토지들에 관하여 개발제한구역법령에 따른 행위허가에 기한 보전부담금이 부과되었음을 인정할 자료가 없으므로, 이 사건 토지들에 대해서는 이 사건 시행령 조항이 적용되지 아니하여 이를 근거로는 그 면적이 보전부담금 산정 대상 면적에서 제외되지 않는다는 취지로 판단하였다.\n  다. 이러한 원심의 판단은 앞서 본 법리에 기초한 것으로서, 거기에 상고이유 주장과 같이 이 사건 시행령 조항의 해석ㆍ적용에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  4. 피고의 상고이유에 대하여\n  원심은 판시와 같은 이유로, 이 사건 토지들 중 일부가 구 개발제한구역법 시행령 제36조 제1항 제1호 (나)목이 정한 ‘이미 토지의 형질변경 허가를 받은 부지에서 다시 형질변경하는 토지(이미 부담금이 부과되어 납부된 토지 또는 2000. 7. 1. 전에 허가를 받아 형질변경한 토지에서 허가된 사업 외의 사업을 위하여 허가를 받아 형질변경하는 경우를 포함한다)’에 해당한다고 보아, 그 일부의 면적은 위 시행령 조항에 따라 보전부담금 산정 대상 면적에서 제외되어야 하므로 이 사건 부과처분 중 그 일부의 면적에 대한 보전부담금 1,044,502,200원 부분은 위법하여 취소되어야 한다고 판단하였다.\n  원심판결 이유를 관련 법령과 법리 및 원심이 적법하게 채택하여 조사한 증거 등에 비추어 살펴보면, 원심의 판단에 상고이유 주장과 같이 지목변경의 허용요건에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  5. 결론 \n  그러므로 상고를 모두 기각하고, 상고비용 중 원고의 상고로 인한 부분은 원고가, 피고의 상고로 인한 부분은 피고가 각 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오석준(재판장) 이흥구 노경필 이숙연(주심)"

    "판시사항": "[1] 행정청이 침해적 행정처분을 하면서 당사자에게 사전통지를 하지 않거나 의견제출 기회를 주지 않은 경우, 그 처분이 위법한지 여부(원칙적 적극) 및 사전통지를 하지 않거나 의견제출 기회를 주지 않아도 되는 예외적인 경우인 ‘의견청취가 현저히 곤란하거나 명백히 불필요하다고 인정될 만한 상당한 이유가 있는지’ 판단하는 방법\n\n [2] 당사자가 사전통지를 받을 기회를 포기한다는 의사를 표시한 경우, 행정절차법에서 정한 사전통지를 하지 않을 수 있는 예외적인 경우에 해당한다고 볼 수 있는지 여부(원칙적 소극) 및 위와 같은 사정으로 사전통지를 하지 않은 채 이루어진 처분이 위법한지 여부(적극)",
