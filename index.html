<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대법원 행정법 판례 모음</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5fa;
  --surface: #ffffff;
  --fg: #1a1c27;
  --muted: #6b7280;
  --border: #e7e8f0;
  --accent: #3652d9;
  --accent-fg: #ffffff;
  --accent-soft: #ecefff;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 2px 8px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101119;
    --surface: #181a25;
    --fg: #e8e9f2;
    --muted: #9296a8;
    --border: #262838;
    --accent: #93a6ff;
    --accent-fg: #10121e;
    --accent-soft: #1e2340;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.35);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  line-height: 1.7;
  letter-spacing: -0.01em;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.wiki-page {
  max-width: 880px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

.site-header { margin-bottom: 20px; }
.site-title {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0 0 8px;
}
.site-subtitle { color: var(--muted); font-size: 15px; margin: 0; }

.site-notice {
  background: var(--accent-soft);
  border-radius: 12px;
  padding: 14px 18px;
  margin: 20px 0 32px;
  font-size: 13.5px;
  color: var(--fg);
}
.site-notice strong { color: var(--accent); }

.doc-card-list {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.case { border-bottom: 1px solid var(--border); }
.case:last-child { border-bottom: none; }

.doc-card {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 14px 18px;
  cursor: pointer;
}
.doc-card:hover { background: var(--accent-soft); }
.doc-date { font-size: 12.5px; color: var(--muted); white-space: nowrap; min-width: 76px; }
.doc-title { flex: 1; font-size: 14.5px; font-weight: 600; }
.doc-tag { font-size: 11.5px; color: var(--accent); white-space: nowrap; }

.case-body {
  display: none;
  padding: 4px 18px 20px;
}
.case-body.open { display: block; }

.field { margin-top: 16px; }
.field h4 {
  font-size: 12.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--muted);
  border-left: 3px solid var(--accent);
  padding-left: 8px;
  margin: 0 0 8px;
}
.field p {
  margin: 0;
  white-space: pre-wrap;
  font-size: 13.5px;
  color: var(--fg);
}
.field .box {
  background: var(--accent-soft);
  border-radius: 10px;
  padding: 12px 14px;
}
.full-text {
  max-height: 340px;
  overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}

@media (max-width: 600px) {
  .wiki-page { padding: 24px 16px 56px; }
  .site-title { font-size: 25px; }
  .doc-card { padding: 13px 14px; gap: 8px 10px; flex-wrap: wrap; }
  .doc-date { min-width: 62px; font-size: 11.5px; }
  .doc-title { font-size: 13.5px; flex-basis: 100%; order: 3; }
}
</style>
</head>
<body>
<div class="wiki-page">
  <header class="site-header">
    <h1 class="site-title">대법원 행정법 판례 모음</h1>
    <p class="site-subtitle">국가법령정보센터 Open API로 수집한 대법원 행정 판례 아카이브</p>
  </header>

  <div class="site-notice" id="notice"></div>

  <div class="doc-card-list" id="list"></div>
</div>

<script>
  fetch('data/cases.json')
    .then(res => res.json())
    .then(cases => {
      document.getElementById('notice').innerHTML = `<strong>총 ${cases.length}건</strong> · 2026년 대법원 행정 판례부터 수집 중`;
      const list = document.getElementById('list');
      cases.forEach((c, i) => {
        const div = document.createElement('div');
        div.className = 'case';
        const date = c.선고일자 ? `${c.선고일자.slice(0,4)}.${c.선고일자.slice(4,6)}.${c.선고일자.slice(6,8)}` : '';
        div.innerHTML = `
          <div class="doc-card" data-idx="${i}">
            <span class="doc-date">${date}</span>
            <span class="doc-title">${c.사건명}</span>
            <span class="doc-tag">${c.사건번호}</span>
          </div>
          <div class="case-body" id="body-${i}">
            ${field('판시사항', c.판시사항)}
            ${field('판결요지', c.판결요지)}
            ${field('참조조문', c.참조조문)}
            ${field('참조판례', c.참조판례)}
            ${field('전문', c.판례내용, true)}
          </div>
        `;
        list.appendChild(div);
      });

      list.addEventListener('click', (e) => {
        const header = e.target.closest('.doc-card');
        if (!header) return;
        const body = document.getElementById(`body-${header.dataset.idx}`);
        body.classList.toggle('open');
      });
    });

  function field(label, text, isFullText) {
    if (!text) return '';
    return `
      <div class="field">
        <h4>${label}</h4>
        <p class="${isFullText ? 'full-text' : 'box'}">${escapeHtml(text)}</p>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
