    "판시사항": "[1] 다른 약사에 대한 약국개설등록처분으로 처방약 조제 기회를 전부 또는 일부 상실하게 된 기존 약국개설자에게 해당 처분의 취소를 구할 법률상 이익이 있는지 여부(원칙적 적극)\n\n [2] 신규 약국개설등록처분으로 인해 의료기관의 처방약 조제 기회를 공정하게 배분받을 기존 약국개설자의 이익이 침해될 우려가 있는지 판단하는 방법",
    "판결요지": "[1] 약국개설등록과 관련하여 약사법 제20조 제5항 제2호, 제3호, 제4호는 의료기관과 약국 사이에 일정한 장소적 관련성이 있는 경우 약국을 개설하지 못하도록 하고 있다. 이는 약사법 제23조, 제23조의2, 제24조, 제24조의2, 제26조 등 관련 규정의 체계나 내용 등에 비추어, 의료기관과 담합행위를 할 가능성이 큰 약국의 개설을 금지함으로써 의료기관의 처방전에 대한 인근 약국개설자들의 접근 기회가 공정하게 배분되도록 하고, 나아가 인근 약국개설자가 약사법이 정하는 바에 따라 의료기관으로부터 독립하여 조제업무를 수행할 수 있도록 하는 취지도 있다. 따라서 ‘의료기관의 처방약 조제 기회를 공정하게 배분받을 기존 약국개설자의 이익’은 약국개설등록처분의 근거 법규 및 관련 법규에 의하여 보호되는 개별적·직접적·구체적 이익이라고 할 수 있다. 그러므로 다른 약사에 대한 약국개설등록처분으로 인하여 조제 기회를 전부 또는 일부라도 상실하게 된 기존 약국개설자는 특별한 사정이 없는 한 해당 처분의 취소를 구할 법률상 이익이 있다.\n\n [2] 신규 약국개설등록처분으로 인해 의료기관의 처방약 조제 기회를 공정하게 배분받을 기존 약국개설자의 이익이 침해될 우려가 있는지를 판단할 때에는, 약사법 제20조 제5항 제2호, 제3호, 제4호 위반이 문제 되는 개별 의료기관을 기준으로 신설 약국 및 기존 약국의 위치·규모·운영형태, 의료기관과 각 약국 사이의 거리·접근 방법, 인근의 약국 분포 등을 종합적으로 고려해야 한다. 이때 반드시 기존 약국개설자의 주된 매출이 해당 의료기관이 발행한 처방전에 기초하고 있었다거나 해당 의료기관이 발행한 처방전에 관한 기존 약국개설자의 매출 감소가 상당해야만, 그와 같은 이익이 침해될 우려가 있다고 볼 것은 아니다.\n  만약 기존 약국개설자가 운영하는 약국이, 약사법 제20조 제5항 제2호, 제3호, 제4호 위반이 문제 되는 신규 약국개설등록처분 당시를 전후하여 기준이 되는 개별 의료기관이 발행한 처방전에 따라 의약품을 조제한 적이 있다면, 그 약국은 신규 약국개설등록처분으로 인하여 해당 의료기관이 발행한 처방전에 대한 조제 기회가 감소할 것이라고 충분히 예상할 수 있다. 이러한 경우 기존 약국개설자는 특별한 사정이 없는 한 해당 처분의 취소를 구할 원고적격이 있다.",
    "참조조문": "[1] 약사법 제20조 제5항 제2호, 제3호, 제4호, 제23조, 제23조의2, 제24조, 제24조의2, 제26조, 행정소송법 제12조 / [2] 약사법 제20조 제5항 제2호, 제3호, 제4호, 행정소송법 제12조",
    "참조판례": "",
    "판례내용": "【원고, 상고인】                원고 1 외 1인 (소송대리인 법무법인(유한) 예율 담당변호사 박근영)\n【피고, 피상고인】 서울특별시 영등포구보건소장 (소송대리인 법무법인 우성 담당변호사 김민정)\n【피고보조참가인】                피고보조참가인            \n【원심판결】  서울고법 2024. 1. 25. 선고 2022누70812 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결의 이유 및 원심이 적법하게 채택하여 조사한 증거 등에 따르면, 다음 사실을 알 수 있다.\n  가. 원고 1은 서울 영등포구 (주소 1 생략)에 있는 ○○빌딩 1층에서 ‘(상호 1 생략)약국’이라는 명칭으로, 원고 2는 서울 영등포구 (주소 2 생략)에 있는 △△빌딩 1층에서 ‘(상호 2 생략)약국’이라는 명칭으로 각 약국개설등록을 하고 이를 운영하고 있는 약사이다(이하 원고들이 운영하는 위 각 약국을 모두 ‘원고들 약국’이라 한다).\n  나. 소외인은 2020. 7. 무렵까지 서울 영등포구 (주소 3 생략)에 있는 □□빌딩(이하 ‘이 사건 건물’이라 한다) 4층 (호수 1 생략)호에서 산부인과 및 피부과 외래환자를 주로 진료하는 ‘◇◇◇의원’(이하 ‘이 사건 의원’이라 한다)을 운영하던 의사이다. 소외인은 2020. 7. 17. 이 사건 건물 4층 (호수 2 생략)호, (호수 3 생략)호로 이 사건 의원의 소재지를 변경하였고, 2020. 12. 이후 이 사건 건물 4층 (호수 4 생략)호 중 좌측 분할 부분 일부에 이 사건 의원을 확장하여, 현재 이 사건 건물 4층 (호수 2 생략)호, (호수 3 생략)호와 (호수 4 생략)호 중 좌측 분할 부분 일부에서 이 사건 의원을 운영하고 있다.\n  다. 피고 보조참가인은 2020. 4. 24. 소외인 측으로부터 이 사건 건물 4층 (호수 4 생략)호 중 우측 분할 부분을 임차하고, 위 장소에 ‘(상호 3 생략)약국’이라는 명칭으로 약국(이하 ‘이 사건 약국’이라 한다)을 개설하기 위하여 2020. 7. 10. 피고에게 약국개설등록신청을 하였다.\n  라. 피고는 2020. 7. 15. 피고 보조참가인에게 위 신청을 수리하는 내용의 약국개설등록처분(이하 ‘이 사건 처분’이라 한다)을 하였다.\n  2. 관련 법리\n  가. 취소소송은 처분 등의 취소를 구할 법률상 이익이 있는 자가 제기할 수 있다(행정소송법 제12조 전문). 행정처분의 직접 상대방이 아닌 제3자라 하더라도 당해 행정처분으로 인하여 ‘법률상 보호되는 이익’을 침해당한 경우에는 취소소송을 제기하여 그 당부의 판단을 받을 자격이 있고, ‘법률상 보호되는 이익’은 당해 처분의 근거 법규 및 관련 법규에 의하여 보호되는 개별적·직접적·구체적 이익을 말한다(대법원 2006. 3. 16. 선고 2006두330 전원합의체 판결, 대법원 2025. 2. 13. 선고 2024두57996 판결 등 참조).\n  나. 약국개설등록과 관련하여 약사법 제20조 제5항 제2호, 제3호, 제4호는 의료기관과 약국 사이에 일정한 장소적 관련성이 있는 경우 약국을 개설하지 못하도록 하고 있다. 이는 약사법 제23조, 제23조의2, 제24조, 제24조의2, 제26조 등 관련 규정의 체계나 내용 등에 비추어, 의료기관과 담합행위를 할 가능성이 큰 약국의 개설을 금지함으로써 의료기관의 처방전에 대한 인근 약국개설자들의 접근 기회가 공정하게 배분되도록 하고, 나아가 인근 약국개설자가 약사법이 정하는 바에 따라 의료기관으로부터 독립하여 조제업무를 수행할 수 있도록 하는 취지도 있다. 따라서 ‘의료기관의 처방약 조제 기회를 공정하게 배분받을 기존 약국개설자의 이익’은 약국개설등록처분의 근거 법규 및 관련 법규에 의하여 보호되는 개별적·직접적·구체적 이익이라고 할 수 있다. 그러므로 다른 약사에 대한 약국개설등록처분으로 인하여 조제 기회를 전부 또는 일부라도 상실하게 된 기존 약국개설자는 특별한 사정이 없는 한 해당 처분의 취소를 구할 법률상 이익이 있다. 그 구체적인 이유는 다음과 같다.\n  1) 의약분업은 2000. 7. 1. 의사와 약사가 환자 치료를 위한 역할을 분담하여 처방 및 조제 내용을 서로 점검·협력함으로써 불필요하거나 잘못된 투약을 방지하고, 의사의 처방전을 공개함으로써 환자에게 처방된 약의 정보를 알 수 있게 하려는 목적에서 실시되었다(대법원 2007. 9. 6. 선고 2005두13940, 13957 판결 참조). 이를 위하여 약사법은 약국의 약사만이 의료법 제18조에 따라 처방전이 교부된 외래환자를 위하여 의약품을 조제할 수 있도록 하고 있다(제23조). 약사가 의약품을 조제하는 경우 의약품정보를 미리 확인하도록 하고(제23조의2), 약사가 처방전을 발행한 의사의 동의를 받아 변경하거나 수정하여 조제할 수 있도록 하며(제26조 제1항), 처방전에 의심스러운 점이 있는 경우 처방전을 발행한 의사에게 이를 확인한 후 조제하도록 하는(제26조 제2항) 등 약사가 일정한 범위 내에서 조제업무를 독립적으로 수행하도록 하고 있다.\n  2) 의약분업의 핵심인 의사와 약사 사이의 상호 견제·보완 및 이중 점검의 기능이 제대로 작동하기 위해서는 먼저 의료기관에서 처방전을 발행함에 따라 발생하는 조제 기회가 공정하게 배분되도록 하여 약사의 독립성을 보호할 필요가 있다. 외래환자의 처방전에 기초한 의약품 조제 매출은 대부분의 약국 운영에 필수적인데, 약국은 조제 기회를 스스로 창출할 수 없고 인근 의료기관에서 발행한 처방전을 유치하여야 하기 때문이다. 그런데 의료기관과 약국이 결탁하여 특정 의료기관의 처방전이 특정 약국에 집중되어 인근의 다른 약국개설자가 해당 의료기관의 처방전을 유치하는 것이 어렵게 되면, 인근 약국개설자들이 해당 의료기관의 처방전을 견제·보완하거나 점검하는 것이 사실상 불가능에 가깝게 된다. 이 경우 약사법이 약사에게 부여한 독립적인 지위가 유명무실하게 되고, 종국적으로 약국이 의료기관에 종속될 가능성이 높아지게 된다.\n  3) 이에 약사법은 약국과 의료기관 사이의 일정한 담합행위를 금지하고 있고(제24조 제2항, 제24조의2), 이를 위반하면 업무정지, 자격정지 등 행정처분과 형사처벌의 대상이 된다(제76조 제1항 제3호, 제79조 제2항 제1호, 제3항 제1호의2, 제81조, 제94조 제1항 제2호, 제2호의2 등). 그렇지만 일반적인 행정감독으로는 양자 사이의 구체적인 담합행위를 적발해 내기가 매우 어렵고, 담합행위 등을 사후적으로 규제하는 것만으로는 의료기관과 약국의 결탁에 의한 조제 기회의 집중과 독점을 막는 것이 불가능하므로, 사전에 이를 방지할 필요가 있다. 약국이 의료기관 내에 있거나 의료기관과 장소적으로 밀접하게 연관되어 있으면, 약국과 의료기관이 담합할 가능성이 크고, 상호 결탁한 것과 같은 외관을 가지게 된다. 이에 따라 약사법 제20조 제5항은 장소적 연관성에 따른 담합·결탁 가능성을 사전에 최소화하기 위하여 ‘약국을 개설하려는 장소가 의료기관의 시설 안 또는 구내인 경우(제2호)’, ‘의료기관의 시설 또는 부지의 일부를 분할·변경 또는 개수(改修)하여 약국을 개설하는 경우(제3호)’, ‘의료기관과 약국 사이에 전용(專用) 복도·계단·승강기 또는 구름다리 등의 통로가 설치되어 있거나 이를 설치하는 경우(제4호)’에 약국의 개설등록을 받는 것을 금지하고 있다(헌법재판소 2003. 10. 30. 선고 2001헌마700 등 전원재판부 결정, 대법원 2009. 6. 11. 선고 2009두4265 판결 참조). 이를 위반하여 약국을 개설한 경우 그 약국은 등록취소의 대상이 된다(약사법 제76조 제1항 제2호, 제3항, 「약사법 시행규칙」 제50조 [별표 3] Ⅱ. 개별기준 7.).\n  결국 위 규정들은 의약분업제도가 효율적으로 실현될 수 있는 환경을 조성함과 동시에 조제 기회의 공정한 배분을 통하여 의료기관으로부터 독립하여 조제업무를 수행할 수 있는 인근 약국개설자의 경제적 기반도 보호하고 있는 것이다.\n  다. 신규 약국개설등록처분으로 인해 의료기관의 처방약 조제 기회를 공정하게 배분받을 기존 약국개설자의 이익이 침해될 우려가 있는지를 판단함에 있어서는, 약사법 제20조 제5항 제2호, 제3호, 제4호 위반이 문제 되는 개별 의료기관을 기준으로 신설 약국 및 기존 약국의 위치·규모·운영형태, 의료기관과 각 약국 사이의 거리·접근 방법, 인근의 약국 분포 등을 종합적으로 고려하여야 한다. 이때 반드시 기존 약국개설자의 주된 매출이 해당 의료기관이 발행한 처방전에 기초하고 있었다거나 해당 의료기관이 발행한 처방전에 관한 기존 약국개설자의 매출 감소가 상당하여야만, 그와 같은 이익이 침해될 우려가 있다고 볼 것은 아니다.\n  만약 기존 약국개설자가 운영하는 약국이, 약사법 제20조 제5항 제2호, 제3호, 제4호 위반이 문제 되는 신규 약국개설등록처분 당시를 전후하여 기준이 되는 개별 의료기관이 발행한 처방전에 따라 의약품을 조제한 적이 있다면, 그 약국은 신규 약국개설등록처분으로 인하여 해당 의료기관이 발행한 처방전에 대한 조제 기회가 감소할 것이라고 충분히 예상할 수 있다. 이러한 경우 기존 약국개설자는 특별한 사정이 없는 한 해당 처분의 취소를 구할 원고적격이 있다.\n  3. 원심의 판단\n  원심은 다음과 같은 사정 등을 들어, 원고들 약국이 이 사건 약국의 인근 건물에 위치해 있다는 사실만으로는 이 사건 처분으로 인하여 원고들의 ‘의료기관으로부터 독립적으로 조제업무에 종사할 수 있는 법적 지위’가 침해될 가능성을 인정하기에 부족하다는 이유로, 원고들의 원고적격을 부정하였다.\n  원고들 약국과 이 사건 약국은 각각 다른 건물에 위치하고 있다. 원고들 약국 인근의 다른 건물에 다른 약사들이 운영하는 약국들이 존재한다. 이 사건 의원이 발행하는 전체 처방전 중 원고들 약국이 차지하는 비율은 극히 일부에 불과하고, 원고들 약국의 주된 매출이 이 사건 의원의 처방전에 대한 의약품 조제에 기초한다고 볼 수 없다.\n  이 사건 처분 전후 상당기간의 처방전 비율을 비교해 보더라도, 이 사건 약국 개설로 인한 원고들 약국의 매출 중 이 사건 의원이 발행한 처방전 관련 비중 감소가 유의미하다고 평가하기는 어렵다.\n  4. 대법원의 판단\n  그러나 원심의 판단은 다음과 같은 이유로 그대로 받아들이기 어렵다.\n  원심이 인정한 사실관계에 따르더라도, 원고들 약국은 이 사건 의원이 있는 이 사건 건물에 인접한 건물 또는 두 번째로 인접한 건물에 위치하고 있고, 이 사건 처분이 있었던 2020. 7. 무렵을 전후하여 이 사건 의원이 발행한 처방전을 여러 번 받아 의약품을 조제하였다는 것이다. 이러한 사정들을 앞서 본 법리에 비추어 살펴보면, 위 각 약국을 운영하는 원고들은 이 사건 처분의 취소를 구할 원고적격이 있고, 원고들 약국의 주된 매출이 이 사건 의원의 처방전에 따른 의약품 조제에 기초한다고 볼 수 없다거나, 이 사건 처분에 따른 이 사건 약국 개설로 인한 원고들 약국의 매출 감소가 크지 않다는 사정만으로 원고들의 원고적격을 부정하기는 어렵다. 따라서 원심으로서는 원고들의 원고적격을 인정하여 본안에 관한 심리·판단을 하였어야 한다.\n  그런데도 원고들에게 이 사건 처분의 취소를 구할 원고적격이 없다고 보아 이 사건 소를 모두 각하한 원심의 판단에는 약국개설등록처분에 있어 제3자의 원고적격에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다.\n  5. 결론\n  나머지 상고이유에 대한 판단을 생략한 채, 원심판결을 파기하고 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 신숙희(재판장) 노태악(주심) 마용주"

    "판례내용": "【원고, 피상고인】 한국토지주택공사 (소송대리인 변호사 안성훈 외 1인)\n【피고, 상고인】 인천광역시장 (소송대리인 법무법인 서래 외 1인)\n【원심판결】  서울고법 2022. 10. 13. 선고 2022누30340 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유(제출기간이 지난 상고이유보충서의 기재는 이를 보충하는 범위 내에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거에 따르면, 다음 사실을 알 수 있다.\n  가. 원고는 1997. 2. 27. 택지개발예정지구로 지정된 인천 남동구 논현동, 고잔동 일원의 인천논현(2) 지구(이하 ‘이 사건 예정지구’라 한다)에서 택지개발사업(이하 ‘이 사건 택지개발사업’이라 한다)을 시행한 시행자이다. 피고는 2000. 3. 31. 원고에게 이 사건 택지개발사업에 관한 택지개발계획 승인을 하면서 \"서해안고속도로를 연결하는 소래아이씨(소래IC, 이하 ‘소래나들목’이라 한다) 설치는 도시계획결정 노선으로 계획하고 그 설치 및 비용부담에 대하여는 실시계획인가 전까지 인천광역시와 별도로 협의한다.\"라는 내용의 ‘개발계획 승인조건’을 부관으로 부가하였다(이하 ‘이 사건 제1차 부관’이라 한다).\n  나. 원고는 피고에게 ‘이 사건 예정지구와 서해안고속도로를 연결하는 소래나들목을 건설하여 광역교통을 처리한다.’는 내용이 포함된 교통영향평가서를 제출하였다. 이에 대하여 피고는 2000. 12. 12. 원고에게 ‘소래나들목은 원고의 책임하에 시행한다.’는 내용으로 심의·의결한다는 취지가 포함된 심의필증을 교부하면서 교통영향평가서의 교통개선대책 및 심의결과에 따른 조치사항을 사업계획에 반영하여야 한다고 통보하였다. 이후 피고는 2002. 1. 25. 원고에게 이 사건 택지개발사업에 관한 택지개발사업실시계획 승인 등을 하면서 ‘서해안고속도로를 연결하는 소래나들목 설치에 대하여는 교통영향평가 심의결과에 따라 원고의 책임하에 시공하되 구체적인 사항은 인천광역시와 별도로 협의한다.’는 내용의 ‘승인조건’을 부관으로 부가하였다(이하 ‘이 사건 제2차 부관’이라 한다).\n  다. 원고는 2010. 8. 무렵 피고에게 소래나들목 설치 이행확약서(이하 ‘이 사건 이행확약서’라 한다)를 제출하였다. 그 문서에는 ‘관계기관 협의결과 등에 따라 소래나들목을 영업소가 포함되지 않는 형태로 설치할 경우에는 원고가 설치비용 전액을 부담하되, 영업소를 포함하여 설치할 경우에는 비용 부담에 대하여 상호 협의하여 결정하겠다.’는 내용, ‘소래나들목을 설치하지 않는 방안으로 결정될 경우에는 해당 사업비(약 450억 원)를 인천광역시에 납부하겠다.’는 내용 및 ‘소래나들목 설치와 관련한 관계기관 협의 및 방침 결정은 인천광역시 주관하에 실시하고 원고는 방침 결정을 위한 용역 시행 등에 적극 협조하겠다.’는 내용 등이 기재되어 있었다.\n  라. 피고는 2021. 3. 26. 원고에게 한국도로공사와 소래나들목 건설 시행 방안에 관하여 협의한 결과를 통보하면서 ‘이 사건 이행확약서에 따라 소래나들목 기본·실시설계 용역을 재개하여 조치 계획이나 보완 사항을 2021. 4. 9.까지 제출하여 달라.’고 요청하였다(이하 ‘이 사건 제1차 통보’라 한다). 이후 피고는 2021. 4. 19. 원고에게 이 사건 택지개발사업에 관한 교통영향평가 심의에 따른 소래나들목 설치 의무를 이행하라는 취지를 통보하면서 ‘「도시교통정비 촉진법」상 이행조치명령을 받고도 이행하지 않은 경우 공사중지를 명하거나 과태료가 부과될 수 있으므로 소래나들목 설계 용역을 재개하여 달라.’고 요청하였다(이하 ‘이 사건 제2차 통보’라 한다).\n  마. 한편 이 사건 택지개발사업이 시행되던 무렵 이 사건 예정지구 밖에 인접하여 자동차 전용의 고속국도로서 서해안고속도로(이후 고속국도 노선 개편에 따라 현재는 영동고속도로에 속한다. 이하 ‘서해안고속도로’라고만 한다)가 개설되어 있었다.\n  2. 원심의 판단\n  가. 원고의 주장요지는 다음과 같다.\n  구 택지개발촉진법(2003. 5. 29. 법률 제6916호로 개정되기 전의 것, 이하 ‘구 택지개발촉진법’이라 한다) 제14조 제1항, 구 주택건설촉진법(2003. 5. 29. 법률 제6916호 주택법으로 전부 개정되기 전의 것, 이하 ‘구 주택건설촉진법’이라 한다) 제36조 제1항 제1호, 제3항 제1문, 제4항, 구 주택건설촉진법 시행령(2003. 11. 29. 대통령령 제18146호 주택법 시행령으로 전부 개정되기 전의 것, 이하 ‘구 주택건설촉진법 시행령’이라 한다) 제35조 제1항, 제4항 [별표 6] 제1호에 따르면, 소래나들목을 설치하고 그 설치비용을 부담할 의무는 지방자치단체인 인천광역시에 있다. 그런데 이 사건 제1차, 제2차 부관은 위 법령을 위반하여 원고에게 소래나들목 설치 및 설치비용 부담 의무를 부과한 중대·명백한 하자가 있으므로 무효이다. 따라서 위 각 부관이 유효함을 전제로 이루어진 이 사건 제1차, 제2차 통보 역시 처분사유가 존재하지 아니하여 위법하다. \n  나. 원심은 원고들의 이와 같은 주장을 그대로 받아들여, 이 사건 제1차, 제2차 부관은 위 법령을 위반한 중대·명백한 하자가 있으므로 무효이고, 이에 따라 이 사건 제1차, 제2차 통보 역시 처분사유가 존재하지 아니하여 위법하다고 보았다. 이러한 판단을 바탕으로 원심은 이 사건 제1차, 제2차 부관의 각 무효 확인과 이 사건 제1차, 제2차 통보의 각 취소를 구하는 원고의 청구를 모두 인용하였다.\n  3. 대법원의 판단\n  가. 관련 법령 및 법리\n  1) 택지개발사업을 규율하는 구 택지개발촉진법 제2조 제4호에 따르면 ‘간선시설’은 구 주택건설촉진법 제3조 제8호에서 정하는 시설을 말하고, 구 택지개발촉진법 제14조 제1항에서 간선시설의 설치에 관하여 구 주택건설촉진법 제36조를 준용하고 있다.\n  구 주택건설촉진법 제3조 제8호에 따르면, ‘간선시설’은 도로·상하수도·전기시설·가스시설·통신시설 및 지역난방시설 등 주택단지(둘 이상의 주택단지를 동시에 개발하는 경우에는 각각의 주택단지를 말한다) 안의 기간시설과 그 기간시설을 당해 주택단지 밖에 있는 동종의 기간시설에 연결시키는 시설을 말한다. 또한 구 주택건설촉진법 제36조에 따르면, 사업주체가 대통령령으로 정하는 호수 이상의 주택을 건설하거나 대통령령으로 정하는 면적 이상의 대지를 조성하는 경우에 지방자치단체는 간선시설인 도로를 설치하여야 하고(제1항 제1호), 간선시설의 설치비용은 설치의무자가 이를 부담하는데(제3항) 간선시설의 종류별 설치범위는 대통령령으로 정한다(제4항). 이러한 위임에 따라 구 주택건설촉진법 시행령 제35조 제4항 [별표 6] 제1호(이하 ‘이 사건 시행령 조항’이라 한다)는 간선시설 중 ‘도로’의 설치범위를 ‘주택단지 밖의 기간이 되는 도로로부터 동 단지 경계선(단지의 주된 출입구를 말한다. 이하 같다)까지로 하되, 그 길이가 200m를 초과하는 경우로서 그 초과 부분에 한한다.’고 규정하고 있다.\n  한편 이 사건 시행령 조항과 마찬가지로 구 주택건설촉진법의 위임을 받은 구 주택건설기준 등에 관한 규정(2002. 12. 26. 대통령령 제17816호로 개정되기 전의 것, 이하 ‘구 주택건설기준규정’이라 한다) 제2조 제7호에 따르면, ‘기간도로’는 보행자 및 자동차의 통행이 가능한 도로로서 ‘도시계획법에 의한 주간선도로·보조간선도로·집산도로 및 폭 8m 이상인 국지도로’, ‘도로법에 의한 일반국도·특별시도·광역시도 또는 지방도’, ‘기타 관계법령에 의하여 설치된 도로로서 위 각 도로에 준하는 것으로 인정되는 도로’ 중 어느 하나에 해당하는 도로를 말한다.\n  2) 이 사건 시행령 조항의 근거 법률인 구 주택건설촉진법 제36조의 입법 취지는, 도로 등 일정한 간선시설의 설치비용을 사업주체에게 부담시켜 주택 또는 택지의 수분양자들에게 그 비용을 전가하는 것을 방지함으로써, 주택 또는 택지의 저렴한 공급을 보장하고 궁극적으로 국민의 복리 향상에 필수적인 주거 생활의 안정을 실현하고자 함이다(대법원 2009. 1. 15. 선고 2006다69363, 69370 판결 참조). 이와 같은 입법 취지를 고려하면, 이 사건 시행령 조항은 택지개발사업 등으로 만들어지는 주택단지에 입주하는 주민들의 생활에 필수적이거나 통상적으로 필요한 도로 중 일부를 지방자치단체가 설치하고 그 설치비용을 부담하게 함으로써 해당 주민들의 주거 생활 안정을 실현하기 위한 것으로서, 위 조항의 ‘기간이 되는 도로’는 구 주택건설기준규정 제2조 제7호에서 규정한 ‘기간도로’를 의미한다고 봄이 타당하다(대법원 2006. 9. 28. 선고 2004다35069 판결 참조).\n  그렇다면 어떤 시설이 이 사건 시행령 조항의 적용을 받아 지방자치단체에 그 설치 및 설치비용 부담 의무가 있다고 하기 위해서는, 그 시설이 주택단지 밖의 ‘기간도로’로부터 해당 주택단지 경계선까지를 연결하는 도로에 해당하여야 하고, 여기서 위 ‘기간도로’는 구 주택건설기준규정 제2조 제7호에 따라 보행자 및 자동차의 통행이 가능한 도로여야 한다.\n  나. 구체적 판단\n  앞서 본 사실관계를 위와 같은 법리에 비추어 살펴본다. \n  소래나들목은 이 사건 예정지구 내 주택단지 밖에 위치한 서해안고속도로를 그 예정지구와 연결하는 도로인데, 서해안고속도로는 자동차 전용도로로서 구 주택건설기준규정 제2조 제7호의 ‘기간도로’에 속하지 않는다. 따라서 소래나들목은 위 ‘기간도로’로부터 이 사건 예정지구 내 주택단지 경계선까지를 연결하는 도로에 해당하지 아니하여 이 사건 시행령 조항이 적용되지 않고, 이에 따라 지방자치단체에 그 설치 및 설치비용 부담 의무가 있다고 할 수 없다.\n  그런데도 원심은, 이 사건 시행령 조항이 소래나들목에 적용된다고 보아 이를 설치하고 그 설치비용을 부담할 의무는 지방자치단체인 인천광역시에 있다는 전제에서, 이 사건 제1차, 제2차 부관이 위 조항 등 법령을 위반한 중대·명백한 하자가 있어 무효이고, 이에 따라 이 사건 제1차, 제2차 통보 역시 처분사유가 존재하지 아니하여 위법하다고 판단하였다. 이러한 원심판단에는 이 사건 시행령 조항의 해석·적용에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 취지의 상고이유 주장은 이유 있다(한편 앞서 본 사실관계만으로는 이 사건 제1차 통보 또는 이 사건 제2차 통보가 항고소송의 대상인 처분인지 분명하지 않으므로, 환송 후 원심으로서는 위 각 통보의 근거, 양자 간의 관계, 그에 따른 요청 불이행의 효과 등을 구체적으로 살펴 이 사건 소 중 위 각 통보에 대한 부분이 각각 항고소송의 대상적격을 구비하였는지를 명확히 심리할 필요가 있음을 지적하여 둔다).\n  4. 결론\n  나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 신숙희(재판장) 노태악(주심) 서경환 마용주"
  },

    "사건종류명": "일반행정",
    "판결유형": "판결",
    "판시사항": "[1] 사립학교 교원의 임용권자가 소속 교원의 구체적인 행위가 징계사유에 해당하는지에 관하여 충분한 조사를 거친 결과 징계사유에 해당하는 것이 명백한 경우, 관할 교원징계위원회 등에 징계의결을 요구할 의무가 있는지 여부(적극) 및 사립학교 교원의 구체적인 행위가 징계사유에 해당한다고 의심할 만한 상당한 이유가 있음에도 임용권자가 충분한 조사를 거치지 않은 채 징계의결을 요구하지 않은 경우, 사립학교법상 징계의결 요구 의무를 위반한 것인지 여부(적극)\n\n [2] 사립학교법 제27조에 따라 준용되는 민법 제61조에서 정한 ‘선량한 관리자의 주의’의 의미 및 학교법인의 이사장이 소속 교원의 징계혐의에 대하여 충분한 조사를 거친 결과 그 행위가 징계사유에 해당함이 분명해졌음에도 징계의결을 요구하지 않거나, 사립학교 교원의 구체적인 행위가 징계사유에 해당한다고 의심할 만한 상당한 이유가 있음에도 충분한 조사를 거치지 않은 채 징계의결을 요구하지 않은 경우, 선량한 관리자의 주의의무를 위반한 것인지 여부(적극)\n\n [3] 甲 학교법인이 설치ㆍ운영하는 고등학교 교감 乙과 사무직원이 관할 검찰청, 경찰서, 감사원에 전 교장 丙과 교사 丁에 관한 ‘비위사실조사 협조 요청’ 공문을 보내 그 결과를 회신받은 사실에 대하여 丁이 문제를 제기하고 서울특별시교육청에 민원을 제기하자, 서울특별시교육청이 ‘위 행위는 개인정보 보호법, 사립학교법 등을 위반한 비위행위에 해당하고 이를 알았음에도 관련자들에 대한 징계의결 요구를 하지 않아 선량한 관리자로서 주의의무를 다하지 못하였다.’는 이유로 甲 법인에 대하여 기관경고 처분을, 이사장인 戊에 대하여 경고 처분을 한 사안에서, 사립학교 교원인 乙의 위 행위가 개인정보 보호법 제15조 제1항을 위반하여 개인정보를 처리한 경우에 해당한다면, 사립학교법 제61조 제1항 제1호에서 정한 징계사유에 해당하고, 甲 법인과 이사장 戊가 위 행위와 관련하여 소속 교원인 乙에 대하여 징계의결 요구를 하지 않은 것은 사립학교 교원의 임용권자인 학교법인의 법령상 징계의결 요구 의무 및 학교법인 이사장의 선관주의의무를 위반한 것으로 평가할 여지가 크다고 한 사례",
    "판결요지": "[1] 사립학교법 제61조 제1항, 제64조, 제66조, 제70조의5에 따르면, 사립학교 교원 또는 사무직원이 징계사유에 해당할 때에는 해당 교원 또는 사무직원의 임용권자는 미리 충분한 조사를 한 후 관할 교원징계위원회 또는 징계위원회에 징계의결을 요구해야 하고, 해당 교원징계위원회 또는 징계위원회는 임용권자로부터 징계의결 요구가 있는 경우에 징계 여부 및 징계양정에 관하여 심의ㆍ의결을 해야 하며, 임용권자는 원칙적으로 그 심의ㆍ의결 결과에 따라야 한다.\n  위와 같은 사립학교 교원 등에 대한 징계 관련 규정의 내용에다가 이러한 관련 규정의 입법 취지가 임용권자의 자의적인 징계운영을 견제하려는 데 있는 점까지 보태어 보면, 사립학교 교원의 임용권자는 소속 교원의 구체적인 행위가 징계사유에 해당하는지에 관하여 판단할 재량은 있지만, 충분한 조사를 거친 결과 그 행위가 징계사유에 해당하는 것이 명백한 경우에는 관할 교원징계위원회 또는 징계위원회에 징계의결을 요구할 의무가 있다고 보아야 한다. 또한 앞서 살핀 입법 취지 등에 비추어 보면, 사립학교 교원의 구체적인 행위가 징계사유에 해당한다고 의심할 만한 상당한 이유가 있음에도 불구하고 해당 교원의 임용권자가 충분한 조사를 거치지 않은 채 징계의결을 요구하지 않은 경우에는 위와 같은 법령상의 징계의결 요구 의무를 위반한 것으로 평가할 수 있다.\n\n [2] 사립학교법 제19조 제1항은 \"이사장은 학교법인을 대표하고 이 법과 정관에 규정된 직무를 수행하며 그 밖에 학교법인 내부의 사무를 총괄한다.\"라고 규정하고 있고, 사립학교법 제27조에 따라 준용되는 민법 제61조는 \"이사는 선량한 관리자의 주의로 그 직무를 행하여야 한다.\"라고 규정하고 있다. 여기서 선량한 관리자의 주의란 보통의 주의력을 가진 행위자가 구체적인 상황에서 통상 가져야 할 주의의 정도를 말하는 것이다. 그러므로 학교법인의 이사장이 소속 교원의 징계혐의에 대하여 충분한 조사를 거친 결과 그 행위가 징계사유에 해당함이 분명해졌음에도 징계의결을 요구하지 않는다면, 이는 선량한 관리자의 주의의무를 위반한 것으로 보아야 한다. 또한 사립학교 교원의 구체적인 행위가 징계사유에 해당한다고 의심할 만한 상당한 이유가 있음에도 불구하고 학교법인의 이사장이 충분한 조사를 거치지 않은 채 징계의결을 요구하지 않은 경우에도 위와 같은 선량한 관리자의 주의의무를 위반한 것으로 평가할 수 있다.\n\n [3] 甲 학교법인이 설치ㆍ운영하는 고등학교 교감 乙과 사무직원이 관할 검찰청, 경찰서, 감사원(이하 ‘수사기관 등’이라 한다)에 전 교장 丙과 교사 丁에 관한 ‘비위사실조사 협조 요청’ 공문을 보내 그 결과를 회신받은 사실에 대하여 丁이 문제를 제기하고 서울특별시교육청에 민원을 제기하자, 서울특별시교육청이 ‘위 행위는 개인정보 보호법 제15조 제1항, 사립학교법 제61조의2 제1항 등을 위반한 비위행위에 해당하고 이를 알았음에도 관련자들에 대한 징계의결 요구를 하지 않아 선량한 관리자로서 주의의무를 다하지 못하였다.’는 이유로 甲 법인에 대하여 기관경고 처분을, 이사장인 戊에 대하여 경고 처분을 한 사안에서, 교감인 乙은 사립학교 교원이므로, 乙이 사무직원과 함께 수사기관 등에 丙과 丁에 관한 비위사실 조회를 요청하여 회신을 받은 위 행위가 개인정보 보호법 제15조 제1항을 위반하여 개인정보를 처리한 경우에 해당한다면, 이는 국가공무원법 제56조의 성실의무를 위반한 것으로서 사립학교법 제61조 제1항 제1호에서 정한 징계사유에 해당하고, 제반 사정에 비추어 보면, 甲 법인과 이사장 戊가 적어도 丁에 관하여 수사기관 등에 비위사실을 조회하여 회신을 받은 행위와 관련하여 소속 교원인 乙에 대하여 징계의결 요구를 하지 않은 것은 사립학교 교원의 임용권자인 학교법인의 법령상 징계의결 요구 의무 및 학교법인 이사장의 선관주의의무를 위반한 것으로 평가할 여지가 큰데도, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례.",
    "참조조문": "[1] 사립학교법 제61조 제1항, 제64조, 제66조, 제70조의5 / [2] 사립학교법 제19조 제1항, 제27조, 민법 제61조 / [3] 개인정보 보호법 제15조 제1항, 국가공무원법 제56조, 사립학교법 제19조 제1항, 제27조, 제61조 제1항 제1호, 제64조, 제66조, 제70조의5, 민법 제61조",
    "참조판례": "[1] 대법원 2007. 7. 12. 선고 2006도1390 판결(공2007하, 1309) / [2] 대법원 1985. 3. 26. 선고 84다카1923 판결(공1985, 621)",
    "판례내용": "【원고, 피상고인】                학교법인 ○○학원 외 1인 (소송대리인 변호사 이명웅)\n【피고, 상고인】 서울특별시교육감 (소송대리인 법무법인 진성 담당변호사 이재화 외 1인)\n【원심판결】  서울고법 2024. 12. 6. 선고 2023누71232 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 적법하게 채택된 증거에 따르면, 다음 사실을 알 수 있다.\n  가. 원고 학교법인 ○○학원(이하 ‘원고 1 학원’이라 한다)은 △△△중학교와 △△△고등학교(이하 △△△고등학교를 ‘이 사건 학교’라 한다)를 설치ㆍ운영하는 학교법인이고, 원고 2는 원고 1 학원의 이사장이다.\n  나. 원고 1 학원 소속의 이 사건 학교 교감(교장 직무대리) 소외 1, 같은 학교 행정실장 직무대리 소외 2, 같은 학교 주무관 소외 3(이하 소외 1, 소외 2, 소외 3을 통틀어 지칭할 때는 ‘이 사건 관련자들’이라 한다)은 ① 2020. 1. 9. 이 사건 학교장 명의로 서울□□지방검찰청, 서울◇◇경찰서, 감사원(이하 통틀어 ‘수사기관 등’이라 한다)에 이 사건 학교의 전 교장 소외 4가 형사사건으로 기소 중인지 여부 또는 내사, 조사, 수사 중인지 여부에 대한 확인을 요청하는 ‘비위사실조사 협조 요청’ 공문을 보내어 그 무렵 ‘수사 진행 중인 사건 미발견’ 또는 ‘해당 없음’의 결과를 회신받고, ② 2020. 6. 16. 이 사건 학교장 명의로 수사기관 등에 이 사건 학교 교사 소외 5가 형사사건으로 기소 중인지 여부 또는 내사, 조사, 수사 중인지 여부에 대한 확인을 요청하는 ‘비위사실조사 협조 요청’ 공문을 보내어 그 무렵 수사기관 등으로부터 ‘해당 없음’의 결과를 회신 받았다(이하에서는 이 사건 관련자들이 소외 4에 관하여 수사기관 등에 비위사실을 조회하여 회신을 받은 행위를 ‘이 사건 제1행위’라 하고, 소외 5에 관하여 수사기관 등에 비위사실을 조회하여 회신을 받은 행위를 ‘이 사건 제2행위’라 하며, 위 두 행위를 통틀어 지칭할 때는 ‘이 사건 각 행위’라 한다).\n  다. 소외 5는 2021. 10. 19. 서울특별시교육청 공익제보센터를 방문하여 ‘이 사건 관련자들이 소외 4와 자신에 관하여 수사기관 등에 비위사실조사 협조 요청 공문을 보내 회신을 받았고, 이에 대하여 문제를 제기하자 이 사건 학교가 비위행위 은폐를 시도하였다.’는 취지로 민원을 제기하였다.\n  라. 피고는 위와 같은 민원제보에 따라 실시된 서울특별시교육청 감사관의 감사결과를 토대로 2022. 3. 16.경 ‘이 사건 관련자들의 이 사건 각 행위는 「개인정보 보호법」 제15조 제1항, 사립학교법 제61조의2 제1항, 「공익신고자 보호법」 제15조 제1항을 위반한 비위행위에 해당하고, 원고들은 2020. 6.경 또는 적어도 2020. 11.경에는 위법한 이 사건 각 행위를 알았음에도 이 사건 관련자들에 대한 징계의결 요구를 하지 아니하여 선량한 관리자로서의 주의의무를 다하지 못하였다.’는 점을 처분사유로 하여, 「서울특별시교육청 감사 규정」제5조 제1항 제4호, 제2항 제1호, 제3호에 따라 원고 1 학원에 대하여 기관경고 처분을, 이사장인 원고 2에 대하여 경고 처분을 하였다(이하 원고들에 대한 처분을 통틀어 ‘이 사건 각 처분’이라 한다).\n  2. 원심의 판단\n  원심은 판시와 같은 이유로, 이 사건 관련자들의 이 사건 각 행위가 피고가 주장하는 바와 같이 사립학교법 제61조 제1항 제1호에서 정한 징계사유에 해당한다고 단정하기 어려울 뿐만 아니라, 법률전문가가 아닌 원고들로서는 더더욱 이 사건 관련자들에게 사립학교법 제61조 제1항 제1호에서 정한 징계사유가 존재한다고 인식할 수 없었던 이상, 원고들이 이 사건 각 행위의 존재를 알게 되었음에도 이 사건 관련자들에 대하여 징계의결 요구를 하지 않았다고 하여 선량한 관리자의 주의의무를 게을리한 것으로 평가하기는 어렵다고 판단하였다.\n  3. 대법원의 판단\n  원심의 위와 같은 판단은 다음과 같은 이유에서 그대로 수긍하기 어렵다.\n  가. 이 사건 각 행위가 사립학교법 제61조 제1항 제1호에서 정한 징계사유에 해당하는지에 관한 판단\n  사립학교법 제55조 제1항에 의하여 사립학교 교원의 복무에 관하여 준용되는 국가공무원법 제56조는 사립학교 교원에 대하여 법령을 준수하고 성실히 직무를 수행할 의무를 부과하고 있고, 사립학교법 제61조 제1항은 \"사립학교 교원이 다음 각 호의 어느 하나에 해당할 때에는 해당 교원의 임용권자는 징계의결을 요구하여야 하고, 징계의결의 결과에 따라 징계처분을 하여야 한다.\"라고 규정하며, 제1호에서 ‘이 법과 그 밖의 교육 관계 법령을 위반하여 교원의 본분에 어긋나는 행위를 하였을 때’를 들고 있다.\n  그런데 이 사건 관련자들 중 교감인 소외 1은 사립학교 교원이므로, 소외 1이 사무직원인 소외 2, 소외 3과 함께 수사기관 등에 소외 4와 소외 5에 관한 비위사실 조회를 요청하여 회신을 받은 이 사건 각 행위가 「개인정보 보호법」 제15조 제1항을 위반하여 개인정보를 처리한 경우에 해당한다면, 이는 국가공무원법 제56조의 성실의무를 위반한 것으로서 사립학교법 제61조 제1항 제1호에서 정한 징계사유에 해당한다(대법원 2023. 6. 29. 선고 2023두31782 판결 참조).\n  그럼에도 원심은 판시와 같은 이유만으로 이 사건 각 행위가 「개인정보 보호법」 제15조 제1항을 위반한 행위에 해당하더라도 법령의 해석 여하에 따라 사립학교법 제61조 제1항 제1호의 징계사유에 해당하지 않는다고 볼 여지도 충분하다고 판단하였다. 이러한 원심의 판단에는 사립학교법 제61조 제1항 제1호에서 정한 징계사유에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다.\n  나. 원고들이 징계의결 요구 의무를 위반하였는지에 관한 판단\n  1)                사립학교법 제61조 제1항, 제64조, 제66조, 제70조의5에 따르면, 사립학교 교원 또는 사무직원이 징계사유에 해당할 때에는 해당 교원 또는 사무직원의 임용권자는 미리 충분한 조사를 한 후 관할 교원징계위원회 또는 징계위원회에 징계의결을 요구하여야 하고, 해당 교원징계위원회 또는 징계위원회는 임용권자로부터 징계의결 요구가 있는 경우에 징계 여부 및 징계양정에 관하여 심의ㆍ의결을 하여야 하며, 임용권자는 원칙적으로 그 심의ㆍ의결 결과에 따라야 한다.\n  위와 같은 사립학교 교원 등에 대한 징계 관련 규정의 내용에다가 이러한 관련 규정의 입법 취지가 임용권자의 자의적인 징계운영을 견제하려는 데 있는 점까지 보태어 보면, 사립학교 교원의 임용권자는 소속 교원의 구체적인 행위가 징계사유에 해당하는지 여부에 관하여 판단할 재량은 있지만, 충분한 조사를 거친 결과 그 행위가 징계사유에 해당하는 것이 명백한 경우에는 관할 교원징계위원회 또는 징계위원회에 징계의결을 요구할 의무가 있다고 보아야 한다(대법원 2007. 7. 12. 선고 2006도1390 판결 참조). 또한 앞서 살핀 입법 취지 등에 비추어 보면, 사립학교 교원의 구체적인 행위가 징계사유에 해당한다고 의심할 만한 상당한 이유가 있음에도 불구하고 해당 교원의 임용권자가 충분한 조사를 거치지 않은 채 징계의결을 요구하지 않은 경우에는 위와 같은 법령상의 징계의결 요구 의무를 위반한 것으로 평가할 수 있다.\n  한편                사립학교법 제19조 제1항은 \"이사장은 학교법인을 대표하고 이 법과 정관에 규정된 직무를 수행하며 그 밖에 학교법인 내부의 사무를 총괄한다.\"라고 규정하고 있고, 사립학교법 제27조에 따라 준용되는 민법 제61조는 \"이사는 선량한 관리자의 주의로 그 직무를 행하여야 한다.\"라고 규정하고 있다. 여기서 선량한 관리자의 주의라 함은 보통의 주의력을 가진 행위자가 구체적인 상황에서 통상 가져야 할 주의의 정도를 말하는 것이다(대법원 1985. 3. 26. 선고 84다카1923 판결 참조). 그러므로 학교법인의 이사장이 소속 교원의 징계혐의에 대하여 충분한 조사를 거친 결과 그 행위가 징계사유에 해당함이 분명해졌음에도 징계의결을 요구하지 않는다면, 이는 선량한 관리자의 주의의무를 위반한 것으로 보아야 한다. 또한 사립학교 교원의 구체적인 행위가 징계사유에 해당한다고 의심할 만한 상당한 이유가 있음에도 불구하고 학교법인의 이사장이 충분한 조사를 거치지 않은 채 징계의결을 요구하지 않은 경우에도 위와 같은 선량한 관리자의 주의의무를 위반한 것으로 평가할 수 있다.\n  원심이 피고의 처분사유에 따라 원고 1 학원이 선량한 관리자의 주의의무를 부담한다는 전제에서 판시한 점은 적절치 않으나, 기록에 의하면 앞서 살펴본 바와 같이 원고 1 학원에 대한 피고의 처분사유는 원고 1 학원이 징계의결을 요구하지 않아 결과적으로 법령상 의무를 위반하였다는 취지로 이해된다. 따라서 이하에서는 원고 1 학원이 법령상의 징계의결 요구 의무를 위반하였는지 및 원고 1 학원 이사장인 원고 2가 징계의결 요구에 관한 선량한 관리자의 주의의무를 위반하였는지에 관하여 본다.\n  2) 원심판결 이유와 기록에 의하면, 다음과 같은 사실을 알 수 있다.\n  가) 소외 5는 2020. 6.경 수사기관 등이 이 사건 관련자들의 소외 5에 관한 비위사실조사 협조 요청 공문에 대하여 회신을 보내온 것을 우연히 알게 되어 이 사건 학교 측에 문제를 제기하였다.\n  나) 원고 1 학원은 2020. 6. 30. 이 사건 학교장 직무대리인 소외 1의 전보 동의 및 △△△중학교장의 전보 제청에 따라 이 사건 관련자들 중 1명인 소외 3을 △△△중학교로 전보 발령하였다.\n  다) 원고 1 학원은 2020. 11. 2.경 수사기관으로부터 소외 5가 ‘원고 1 학원 이사장이 수사기관 등에 소외 5에 관한 비위사실조사 협조 요청을 한 것은 부당하다.’고 호소하고 있음을 통보받고, 2020. 11. 중순경 이 사건 관련자들 중 소외 1과 소외 2를 상대로 소외 5에 관한 비위사실 조회를 한 경위와 목적 등을 묻는 질의서를 보냈다. 위 질의서에는 ‘이 사건 학교장 직무대리인 소외 1은 2019. 10.에 직접 교원 소외 5에 대한 중징계를 제청하여 징계가 진행 중인 상황에서 놀랍게도 소외 5의 인권을 침해하는 비위사실 조회를 수사기관 등에 요청하였다.’라는 내용이 기재되어 있다.\n  라) 소외 1과 소외 2는 그 무렵 위 질의서에 대한 답변서를 작성하여 원고 1 학원에 제출하였는데, 이들이 작성한 답변서에는 ‘위 비위사실 조회는 소외 5에 대한 징계 처리 절차의 하나로서, 사립학교 교원 징계업무 표준 매뉴얼상 교원징계 제청서에 첨부하도록 되어 있는 비위사실조사서를 외부기관에 요청하여 회신받는 것으로 잘못 알고 수사기관 등에 조회 요청을 하게 되었다.’라는 내용이 기재되어 있다.\n  3) 위와 같은 사실관계를 관련 법리에 비추어 살펴보면, 원고들이 적어도 이 사건 제2행위와 관련하여 소속 교원인 소외 1에 대하여 징계의결 요구를 하지 아니한 것은 사립학교 교원의 임용권자인 학교법인의 법령상 징계의결 요구 의무 및 학교법인 이사장의 선관주의의무를 위반한 것으로 평가할 여지가 크다. 그 이유는 다음과 같다.\n  가) 원고 1 학원이 이사장 명의로 소외 1과 소외 2에게 보낸 위 질의서 내용에 따르더라도, 원고들은 소외 5에 대한 중징계 제청이 이미 이루어져 징계절차가 진행 중인 상황에서 이 사건 관련자들이 수사기관 등에 소외 5에 관한 비위사실을 조회한 것은 그 필요성이 인정되지 않는 인권침해 소지가 있는 행위임을 인식하고 있었던 것으로 보인다.\n  나) 원고 1 학원은 소외 5가 자신에 관한 비위사실 조회 요청 사실과 관련하여 이 사건 학교 측에 문제 제기를 한 직후 이 사건 관련자들 중 1명인 소외 3을 이 사건 학교와 지역적으로 떨어져 있는 △△△중학교로 전보 발령하였다. 이에 관하여 소외 1은 소외 3의 개인 사정을 반영한 전보 발령으로 알고 있다고 진술한 반면, 소외 3은 갑작스런 전보 발령이었고 발령 사유도 듣지 못하였다는 입장이어서 서로 진술이 엇갈리고 있다.\n  다) 원고 1 학원은 소외 1과 소외 2를 상대로는 질의서를 보내어 이 사건 각 행위의 목적과 경위를 파악하려 한 반면에 소외 3을 상대로는 아무런 조사를 하지 않았다. 또한 소외 1과 소외 2는 소외 5에 관한 비위사실 조회 요청이 표준 매뉴얼에 따른 조치였다고 변명하였으므로, 원고들로서는 소외 5와 비슷한 시기에 징계처분을 받은 다른 교원들의 사례를 조사함으로써 위 변명에 타당성이 있는지 검증해 보았어야 함에도, 그러한 추가 조사에 나아가지 아니한 채 이 사건 제2행위가 단순한 행정착오에 기인한 것이라고 섣불리 단정해 버렸다.\n  라) 이 사건 제2행위가 정보주체의 동의 또는 법률의 특별한 규정과 같은 「개인정보 보호법」 제15조 제1항 각 호의 사유에 해당함이 없이 소외 5의 개인정보를 수집한 행위임이 인정될 경우, 이는 앞서 살펴본 바와 같이 사립학교법 제61조 제1항 제1호의 징계사유에 해당할 여지가 충분하다. 따라서 교원 소외 1의 임용권자인 원고 1 학원의 이사장인 원고 2가 통상 가져야 할 주의를 기울였다면 이 사건 제2행위가 사립학교법상의 징계사유에 해당할 여지가 상당하다는 점을 충분히 의심할 수 있었다고 보인다. 그런데 원고 2는 앞서 본 바와 같이 소외 3에 대한 조사를 누락하고, 비슷한 시기에 징계처분을 받은 다른 교원들에 관한 사례 조사를 생략하는 등 이 사건 제2행위 이후에도 계속하여 선량한 관리자의 주의를 기울여 직무를 행하지 않았다.\n  4) 그럼에도 원심은 판시와 같은 이유만으로 원고들이 이 사건 제2행위의 존재를 알게 되었음에도 이 사건 관련자들에 대하여 징계의결 요구를 하지 않은 것을 선량한 관리자의 주의의무 위반으로 평가하기는 어렵다고 판단하였다. 이러한 원심의 판단에는 학교법인의 징계의결 요구 의무 및 학교법인 이사장의 선관주의의무에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다.\n  4. 결론\n  나머지 상고이유에 관한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 노태악(재판장) 서경환 신숙희(주심) 마용주"

    "판시사항": "[1] 상호저축은행법 제10조의6 제3항에서 정한 대주주적격성 유지의무 위반을 이유로 한 대주주적격성 유지요건 충족명령과 일정한 주식에 대한 처분명령 등의 근거가 되는 행정법규의 해석·적용 방법\n\n [2] 상호저축은행법 제10조의6 제3항에서 정한 대주주적격성 유지의무를 위반했는지 판단하는 기준(=형사재판에서 선고된 형의 경중)\n\n [3] 2010. 3. 22. 개정된 상호저축은행법 제10조의6 제3항의 적용 대상 / 형사재판에서 개정 상호저축은행법 시행 전후에 걸쳐 발생한 범죄행위에 대하여 하나의 벌금형이 선고·확정된 경우, 대주주적격성 유지요건을 심사하는 행정청 또는 행정재판을 담당하는 법원이 사후에 개정 상호저축은행법 시행 후 발생한 범죄행위만으로 1,000만 원 이상의 벌금형이 선고될 수 있는지를 따져 대주주적격성 유지의무의 위반 여부를 판단할 수 있는지 여부(소극)",
    "판결요지": "[1] 2010. 3. 22. 법률 제10175호로 개정된 상호저축은행법에 따라 적격성 유지요건의 충족 여부를 심사한 결과 대주주적격성 유지의무를 위반했다고 인정되면 해당 대주주는 적격성 유지요건 충족명령을 받을 수 있고, 이 경우 상호저축은행의 의결권 있는 발행주식 총수의 100분의 10 이상 보유하는 주식에 대하여는 의결권을 행사할 수 없으며, 충족명령을 이행하지 않는 경우 해당 대주주가 보유하는 상호저축은행의 의결권 있는 발행주식 총수의 100분의 10 이상에 해당하는 주식에 대한 처분명령을 받을 수 있다. 나아가 주식처분명령을 받은 자가 해당 명령을 이행하지 않는 때에는 이행기간의 종료일 다음 날부터 주식처분을 이행하는 날까지의 기간에 대한 이행강제금도 부과받을 수 있다(제10조의6 제3항, 제6항 내지 제8항 및 제38조의8 참조). 이와 같이 대주주적격성 유지의무를 위반했다고 인정되는 경우 해당 대주주가 입는 불이익이 중대하므로, 그 근거가 되는 행정법규는 엄격하게 해석·적용해야 하고 행정처분의 상대방에게 불리한 방향으로 지나치게 확장해석이나 유추해석을 해서는 안 된다.\n\n [2] 2010. 3. 22. 법률 제10175호로 개정된 상호저축은행법 제10조의6 제3항의 위임에 따라 상호저축은행법 시행령 제7조의4 제8항 [별표 3] 제2호 (다)목은 금융기관 외의 내국법인인 대주주의 적격성 유지요건 중 하나로 \"제1호 (라)목의 요건을 충족할 것\"을 정하고 있고, 같은 별표의 제1호 (라)목 1)은 대주주적격성 유지요건으로 \"최근 5년간 금융관련법령, 「독점규제 및 공정거래에 관한 법률」(이하 ‘공정거래법’이라 한다) 및 「조세범 처벌법」을 위반하여 1,000만 원 벌금형 이상에 상당하는 형사처벌을 받은 사실이 없을 것\"을 들면서 \"그 위반 등의 정도가 경미하다고 인정되는 경우는 제외한다.\"라고 정하였다. 이와 같이 상호저축은행법 시행령 [별표 3] 제1호 (라)목 1)은 ‘공정거래법 위반 등 범죄 그 자체’의 경중이 아니라 ‘공정거래법 위반 등 범죄에 대하여 형사재판에서 선고된 형’의 경중에 따라 적격성 유지요건 충족 여부를 결정하도록 하였으므로, 위 조항에서 정한 대주주적격성 유지의무의 위반 여부는 형사재판에서 선고된 형을 기준으로 판단해야 한다.\n\n [3] 2010. 3. 22. 법률 제10175호로 개정된 상호저축은행법은 부칙(2010. 3. 22.) 제1조에 따라 공포 후 6개월이 지난 2010. 9. 23.부터 시행되었고, 제10조의6 제3항의 개정규정은 같은 부칙 제3조에 따라 개정 상호저축은행법 시행 후 최초로 대주주적격성 유지요건을 갖추지 못하게 된 기존 대주주부터 적용된다. 형사재판에서 개정 상호저축은행법 시행 전후에 걸쳐 발생한 범죄행위에 대하여 포괄일죄로 하나의 벌금형이 선고되어 확정된 경우, 대주주적격성 유지요건을 심사하는 행정청 또는 행정재판을 담당하는 법원이 사후에 개정 상호저축은행법 시행 후 발생한 범죄의 ‘양형조건을 별도로 고려하여’ 1,000만 원 이상의 벌금형이 선고될 만한 경우에 해당하는지를 따져 대주주적격성 유지의무의 위반 여부를 판단하는 것은, 구체적 사실관계에 따라 합리적인 결론을 도출할 수 있는 장점은 있으나, 형사재판에서 ‘선고된 형’의 경중에 따라 적격성 유지요건 충족 여부를 결정하도록 규정한 명확한 문언과 불리한 확장해석을 금하는 법리에 비추어 허용하기 어렵다. 이로 인하여 초래되는 불합리는 법 개정을 통하여 해결할 문제이다.",
    "참조조문": "[1] 상호저축은행법 제10조의6 제3항, 제6항, 제7항, 제8항, 제38조의8 / [2] 상호저축은행법 제10조의6 제3항, 상호저축은행법 시행령 제7조의4 제8항 [별표 3] 제1호 (라)목, 제2호 (다)목 / [3] 상호저축은행법 제10조의6 제3항, 부칙(2010. 3. 22.) 제1조, 제3조, 상호저축은행법 시행령 제7조의4 제8항 [별표 3] 제1호 (라)목, 제2호 (다)목",
    "참조판례": "[1] 대법원 2017. 5. 30. 선고 2015두48884 판결(공2017하, 1386)",
    "판례내용": "【원고, 상고인】                주식회사 ○○ (소송대리인 법무법인(유한) 화우 외 1인)\n【피고, 피상고인】 금융위원회 (소송대리인 법무법인(유한) 동인 외 1인)\n【원심판결】  서울고법 2025. 2. 6. 선고 2024누37291 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 상고이유 보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 의하면, 다음 사실을 알 수 있다.\n  가. 원고는 상호저축은행법에 따라 상호저축은행의 인가를 받은 주식회사 △△저축은행(이하 ‘소외 저축은행’이라 한다)의 최대주주로서 상호저축은행법 제10조의6 제3항에 따른 대주주적격성 유지요건 심사대상이다. \n  나. 원고는 2009. 5.경부터 2016. 1.경까지 총 8회에 걸쳐 가격담합으로 인한 부당한 공동행위를 하였다는 범죄사실(이하 ‘이 사건 위반행위’라 한다)에 대해 각 행위를 통틀어 「독점규제 및 공정거래에 관한 법률」(이하 ‘공정거래법’이라 한다) 위반의 포괄일죄로 인정되어 벌금 4,500만 원의 형을 받았고, 위 판결은 2021. 2. 4.경 확정되었다(이하 ‘관련 형사판결’이라 한다).\n  다. 피고는 상호저축은행법 제10조의6 제3항에 따라 원고의 대주주적격성 유지요건 충족 여부를 심사한 결과 ‘원고가 관련 형사판결의 확정으로 공정거래법을 위반하여 1,000만 원 벌금형 이상의 형사판결을 받은 자에 해당하여 상호저축은행법 시행령 [별표 3] 제1호 (라)목 1)에서 정한 대주주적격성 유지요건을 충족하지 못하고 있다.’고 보아, 원고에 대하여 2022. 12. 8. 대주주적격성 유지요건의 충족을 명하고, 2023. 2. 2. 위 대주주적격성 유지요건 충족명령을 이행하지 않았음을 들어 원고 보유의 소외 저축은행 주식 중 484,464주의 처분을 명하였다(이하 위 대주주적격성 유지요건 충족명령과 주식처분명령을 통틀어 ‘이 사건 각 처분’이라 한다).\n  2. 대주주적격성 유지요건 충족 여부를 다투는 상고이유에 관하여\n  가. 원심의 판단\n  원심은, 이 사건 위반행위 중 2010. 3. 22. 법률 제10175호로 개정된 상호저축은행법(이하 ‘개정 상호저축은행법’이라 한다) 시행 전인 2009. 5.경과 2010. 9. 초순경에 있었던 2차례의 담합행위를 제외하더라도 나머지 위반행위만으로 벌금 1,000만 원을 상회하는 유죄판결이 선고되었을 가능성이 충분하고 그 위반 등의 정도가 경미하다고 인정되는 경우에 해당하지 않는다는 이유로, ‘원고가 공정거래법을 위반하여 벌금 1,000만 원 이상의 형을 받아 대주주적격성 유지요건을 충족하지 못하였다.’는 이 사건 각 처분의 처분사유가 인정된다고 판단하였다.\n  나. 대법원의 판단\n  원심의 판단은 다음과 같은 이유에서 받아들이기 어렵다.\n  1) 개정 전의 상호저축은행법은 상호저축은행의 대주주가 되려는 자의 대주주 자격을 심사·승인하고 있었으나 대주주가 된 후에는 자격요건 유지의무가 없어 대주주의 불법행위 등에 따른 상호저축은행의 부실이 자주 나타나는 문제가 지적됨에 따라 상호저축은행의 경영투명성 제고와 소비자 보호를 위하여 대주주의 자격요건 유지를 의무화할 필요성이 제기되었다. 이에 따라 개정 상호저축은행법은 상호저축은행의 대주주 경영권 승인 이후 주기적으로 대주주적격성을 심사하여 자격 미달 시 의결권을 제한하고 시정명령 등의 조치를 취할 수 있도록 규정하였다. 이는 부적격자가 된 대주주의 경영권을 제한함으로써 상호저축은행의 건전 경영을 유도하는 데에 그 취지가 있다. \n  2) 그런데 개정 상호저축은행법에 따라 적격성 유지요건의 충족 여부를 심사한 결과 대주주적격성 유지의무를 위반하였다고 인정되면 해당 대주주는 적격성 유지요건 충족명령을 받을 수 있고, 이 경우 상호저축은행의 의결권 있는 발행주식 총수의 100분의 10 이상 보유하는 주식에 대하여는 의결권을 행사할 수 없으며, 충족명령을 이행하지 아니하는 경우 해당 대주주가 보유하는 상호저축은행의 의결권 있는 발행주식 총수의 100분의 10 이상에 해당하는 주식에 대한 처분명령을 받을 수 있다. 나아가 주식처분명령을 받은 자가 해당 명령을 이행하지 아니하는 때에는 이행기간의 종료일 다음 날부터 주식처분을 이행하는 날까지의 기간에 대한 이행강제금도 부과받을 수 있다(제10조의6 제3항, 제6항 내지 제8항 및 제38조의8 참조). 이와 같이 대주주적격성 유지의무를 위반하였다고 인정되는 경우 해당 대주주가 입는 불이익이 중대하므로, 그 근거가 되는 행정법규는 엄격하게 해석·적용하여야 하고 행정처분의 상대방에게 불리한 방향으로 지나치게 확장해석이나 유추해석을 해서는 안 된다(대법원 2017. 5. 30. 선고 2015두48884 판결 등 참조).\n  3) 개정 상호저축은행법 제10조의6 제3항의 위임에 따라 상호저축은행법 시행령 제7조의4 제8항 [별표 3] 제2호 (다)목은 금융기관 외의 내국법인인 대주주의 적격성 유지요건 중 하나로 \"제1호 (라)목의 요건을 충족할 것\"을 정하고 있고, 같은 별표의 제1호 (라)목 1)은 대주주적격성 유지요건으로 \"최근 5년간 금융관련법령, 공정거래법 및 「조세범 처벌법」을 위반하여 1,000만 원 벌금형 이상에 상당하는 형사처벌을 받은 사실이 없을 것\"을 들면서 \"그 위반 등의 정도가 경미하다고 인정되는 경우는 제외한다.\"라고 정하였다. 이와 같이 상호저축은행법 시행령 [별표 3] 제1호 (라)목 1)은 ‘공정거래법 위반 등 범죄 그 자체’의 경중이 아니라 ‘공정거래법 위반 등 범죄에 대하여 형사재판에서 선고된 형’의 경중에 따라 적격성 유지요건 충족 여부를 결정하도록 하였으므로, 위 조항에서 정한 대주주적격성 유지의무의 위반 여부는 형사재판에서 선고된 형을 기준으로 판단하여야 한다. \n  4) 개정 상호저축은행법은 그 부칙(2010. 3. 22.) 제1조에 따라 공포 후 6개월이 지난 2010. 9. 23.부터 시행되었고, 제10조의6 제3항의 개정규정은 같은 부칙 제3조에 따라 개정 상호저축은행법 시행 후 최초로 대주주적격성 유지요건을 갖추지 못하게 된 기존 대주주부터 적용된다. 형사재판에서 개정 상호저축은행법 시행 전후에 걸쳐 발생한 범죄행위에 대하여 포괄일죄로 하나의 벌금형이 선고되어 확정된 경우, 대주주적격성 유지요건을 심사하는 행정청 또는 행정재판을 담당하는 법원이 사후에 개정 상호저축은행법 시행 후 발생한 범죄의 ‘양형조건을 별도로 고려하여’ 1,000만 원 이상의 벌금형이 선고될 만한 경우에 해당하는지를 따져 대주주적격성 유지의무의 위반 여부를 판단하는 것은, 구체적 사실관계에 따라 합리적인 결론을 도출할 수 있는 장점은 있으나, 형사재판에서 ‘선고된 형’의 경중에 따라 적격성 유지요건 충족 여부를 결정하도록 규정한 명확한 문언과 불리한 확장해석을 금하는 법리에 비추어 허용하기 어렵다. 이로 인하여 초래되는 불합리는 법 개정을 통하여 해결할 문제이다.\n  5) 위와 같은 ‘상호저축은행 대주주에 대한 주기적 적격성 심사제도’가 도입된 경위와 그 취지, 대주주적격성 유지의무 위반에 따른 제재의 내용과 불이익의 정도, 침익적 행정처분의 근거 법령에 관한 엄격해석의 원칙, 구체적인 대주주적격성 유지요건을 정하고 있는 관련 규정의 각 문언과 해석 등을 종합적으로 고려할 때, 관련 형사판결에서 개정 상호저축은행법 시행 전후에 걸쳐 발생한 이 사건 위반행위로 하나의 형을 선고받은 원고에 대해 원심이 들고 있는 사정만으로 개정 상호저축은행법 시행 후 발생한 위반행위로 1,000만 원 이상의 벌금형을 선고받고 확정된 경우에 해당하여 상호저축은행법 시행령 [별표 3] 제1호 (라)목 1)에서 정한 대주주적격성 유지의무를 위반하였다고 단정하기 어렵다.\n  6) 그럼에도 원심은 그 판시와 같은 이유를 들어 원고가 대주주적격성 유지요건을 충족하지 못하였다는 처분사유가 인정된다고 보아, 그와 같은 처분사유에 근거한 이 사건 각 처분이 적법하다고 판단하였다. 이러한 원심의 판단에는 개정 상호저축은행법에 따른 대주주적격성 유지요건의 해석에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 이 부분 상고이유 주장은 이유 있다.\n  3. 결론\n  나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 마용주(재판장) 노태악 서경환(주심) 신숙희"

    "판례내용": "【원고, 상고인】                주식회사 ○○○ (변경 전 상호: 주식회사 △△) (소송대리인 변호사 홍승면 외 3인)\n【피고, 피상고인】 광주광역시 (소송대리인 법무법인 이우스 외 1인)\n【피고보조참가인】                □□□ 주식회사 (소송대리인 변호사 박병대 외 7인)\n【원심판결】  광주고법 2024. 9. 12. 선고 2023누10890 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 보조참가로 인한 부분을 포함하여 원고가 부담한다.\n\n【이    유】  직권으로 판단한다. \n  1. 사건의 개요\n  원심이 인정한 사실관계는 다음과 같다.\n  가. 피고 시장은 2018. 5. 11. 원심 판시 이 사건 사업에 관한 협상대상자 선정을 위한 민간 제안서 접수를 위한 공고(이하 ‘이 사건 공고’라 한다)를 하였다. 이 사건 사업은 「도시공원 및 녹지 등에 관한 법률」 제21조, 제21조의2에 따라 민간공원추진자가 도시공원 또는 공원시설을 설치하고 이를 기부채납하는 조건으로 당초 공원부지로 예정된 면적 중 일부에 주거시설과 같은 비공원시설을 설치할 수 있도록 하는 사업이다.  \n  나. 이 사건 공고에 따르면, 여러 사업자가 컨소시엄을 구성하여 협상대상자로 선정되기 위한 제안서를 접수할 수 있는데, 그 컨소시엄에 시공사가 포함되지 않을 경우 향후 공원사업시행을 위한 업체 선정 시 사전에 피고의 승인을 받아야 하고(제21조 제7항), 협상대상자 선정을 위한 제안서 평가 과정에는 사업 수행능력에 대한 평가는 물론 지역업체 참여 여부에 따른 가점을 하며(제16조), 피고의 승인 없이 제안서 내용을 변경하거나, 컨소시엄 구성원의 지분 또는 대표사가 변경되는 경우 피고가 협상대상자 선정을 취소할 수 있다(제22조 제1항 제3호, 제5호). \n  다. 원고는 ◇◇◇ 주식회사 등과 함께 ‘△△ 컨소시엄’이라는 컨소시엄을 구성하여 2018. 9. 14. 피고에게 이 사건 사업의 협상대상자 선정을 위한 제안서(이하 ‘이 사건 제안서’라 한다)를 제출하였다. 이 사건 제안서에는 원고가 대표 제안자이자 시공사로 기재되어 있었다. 피고 시장은 2018. 12. 28. △△ 컨소시엄을 이 사건 사업의 협상대상자로 선정하면서 △△ 컨소시엄의 제안서를 수용하겠다고 통보(이하 ‘이 사건 제안수용통보’라 한다)하였다.\n  라. △△ 컨소시엄의 구성원들은 2020. 1. 10. 이 사건 사업 수행을 위한 특수목적법인으로 피고 보조참가인(이하 ‘참가인’이라 한다)을 설립하면서, 원고가 지명한 소외 1을 대표이사로 선임하였다. 참가인은 2020. 1. 17. 피고와 사이에 이 사건 사업에 관한 협약을 체결하였다. \n  마. 그러던 중 2021. 1. 4. 참가인의 대표이사를 ◇◇◇ 주식회사의 대표자 사내이사 소외 2로 변경하는 등기가 이루어졌고, 2021. 4. 12. 개최된 참가인의 임시주주총회에서는 이 사건 사업 중 비공원시설(공동주택)의 신축사업에 관하여 ☆☆☆ 주식회사와 공사도급약정을 체결하겠다는 안건이 가결되었다. \n  2. 확인의 이익에 관한 판단\n  원고는, 이 사건 제안서에 이 사건 사업의 시공사이자 대표 제안자가 원고라고 기재되어 있고 피고가 이 사건 제안수용통보를 한 이상, 이 사건 사업의 진행 과정에서 참가인이 피고 동의 없이 일방적으로 시공사를 변경할 수 없으며, 이를 위반할 경우 피고가 이 사건 공고에서 정한 내용에 따라 각종 관리·감독 권한을 행사할 의무가 있다는 내용의 공법상 법률관계가 형성되었고, 그에 따라 원고가 그러한 공법상 법률관계에 따른 ‘공법상 시공사 지위’에 있다는 이유로, 피고를 상대로 그 확인을 구하고 있다. \n  확인의 소에는 권리보호요건으로서 확인의 이익이 있어야 하고 확인의 이익은 확인판결을 받는 것이 원고의 권리 또는 법률상 지위에 현존하는 불안·위험을 제거하는 가장 유효적절한 수단일 때에 인정된다(대법원 2017. 3. 15. 선고 2014다208255 판결 등 참조).\n  원고의 주장과 같이 이 사건 사업의 진행 과정에서 이 사건 제안서에 기재된 시공사나 대표 제안자 또는 그 구성원이 피고의 요청이나 승인 없이 일방적으로 변경된 경우 피고가 그에 대한 관리·감독 권한을 행사할 의무가 있다면, 원고로서는 피고에 소속된 권한 있는 행정청에 관리·감독 권한을 행사할 것을 구하는 신청을 하여 그에 따른 행정청의 후속조치를 얻어낼 수 있고, 만일 그러한 후속조치가 이루어지지 않거나 후속조치의 내용이 위법·부당한 경우 이에 불복하는 취지의 항고소송 등을 제기함으로써 원고 자신의 권리 또는 법률상 지위에 현존하는 불안·위험을 제거할 수 있다.  \n  원고가 이 사건에서처럼 항고소송이 아닌, 당사자소송을 통해 피고를 상대로 원고 주장과 같은 ‘공법상 시공사 지위’에 있다는 확인판결을 받아 그 판결이 확정된다고 하더라도, 피고에게 이 사건 공고 등을 근거로 구체적인 관리·감독 의무의 이행을 구하기 위해서는 다시 피고에 소속된 권한 있는 행정청을 상대로 앞서 본 것과 같이 그 권한 행사를 신청하고 이에 따른 행정청의 작위 또는 부작위에 불복하는 소를 제기하여야 하는 것이며, 이를 위해 원고 주장과 같은 ‘공법상 시공사 지위’의 확인이 선행되어야 하는 것은 아니다. 따라서 원고가 피고를 상대로 당사자소송을 통해 그 주장과 같은 ‘공법상 시공사 지위’의 확인판결을 받는 것은 원고의 법률상 지위에 관한 불안·위험을 제거하는 데 필요하고도 가장 적절하다고 볼 수 없다. \n  그럼에도 원심은 원고에게 피고를 상대로 원고 주장과 같은 ‘공법상 시공사 지위’의 확인을 구할 이익이 있다고 판단하였다. 원심판단에는 공법상 당사자소송에서 확인의 이익에 관한 법리를 오해한 잘못이 있다. 다만 원심은 본안에 관한 원고의 주장을 배척하면서도, 이 사건 소를 각하한 제1심판결에 대하여 원고만이 항소하였으므로 불이익변경금지의 원칙에 따라 원고의 항소를 기각하였다. 이 사건 소를 각하한 제1심판결에 대한 항소를 기각한 원심의 결론은 정당하고 원심의 앞서와 같은 잘못은 판결에 영향을 미치지 않았다. \n  3. 결론\n  상고이유에 대한 판단을 생략한 채 상고를 기각하고, 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 이흥구(재판장) 오석준 노경필(주심) 이숙연"
  },

    "판례일련번호": "612081",
    "사건번호": "2025두33478",
    "사건명": "도시계획시설사업실시계획인가취소",
    "선고일자": "20250814",
    "법원명": "대법원",
    "사건종류명": "일반행정",
    "판결유형": "판결",
    "판시사항": "선행처분인 도시계획시설결정에 하자가 있는 경우, 그 하자가 후행처분인 실시계획인가에 승계되는지 여부(원칙적 소극)",
    "판결요지": "",
    "참조조문": "국토의 계획 및 이용에 관한 법률 제43조 제1항, 제2항, 제64조, 제88조 제3항, 행정소송법 제1조[행정처분일반], 제19조",
    "참조판례": "대법원 2017. 7. 18. 선고 2016두49938 판결(공2017하, 1733)",
    "판례내용": "【원고, 상고심당사자】                원고            \n【원고승계참가인, 상고인】                원고승계참가인 1 외 1인 (소송대리인 법무법인 정언 담당변호사 권성환 외 4인)\n【피고, 피상고인】 도봉구청장 (소송대리인 서울종합법무법인 담당변호사 김호성)\n【원심판결】  서울고법 2025. 3. 21. 선고 2024누30931 판결         \n【주    문】\n  상고를 모두 기각한다.  상고비용은 원고승계참가인들이 부담한다. \n\n【이    유】  상고이유를 판단한다. \n  1. 사안의 개요\n  원심이 인정한 사실관계는 다음과 같다.\n  가. 원고는 2020. 6. 22.부터 소유하던 서울 도봉구 (이하 생략) 대 97.6㎡(이하 ‘이 사건 토지’라 한다) 및 그 지상 건물을 2023. 12. 18. 원고승계참가인들에게 매도하였고, 원고승계참가인들은 2024. 1. 3. 이 사건 토지 및 그 지상 건물에 관하여 소유권이전등기를 마쳤다.\n  나. 서울특별시장은 2022. 7. 7. 서울특별시 고시 제2022-296호로 이 사건 토지 등에 관하여 용도지역을 제2종일반주거지역(7층 이하)으로 변경하고, 문화시설(문화예술회관)을 도시계획시설로 신설하는 내용의 도시관리계획[용도지역, 도시계획시설(문화시설, 공원)] 결정(변경)을 고시하였다(이하 ‘이 사건 도시관리계획결정’이라 한다).\n  다. 피고는 2022. 10. 6. 이 사건 도시관리계획결정에 따른 도시계획시설사업의 사업시행자로 자신을 지정하고, 이 사업에 관한 실시계획을 인가(이하 ‘이 사건 처분’이라 한다)한 후 이를 고시하였다(도봉구고시 제2022-193호).\n  2. 원심판단\n  원고승계참가인들은 이 사건 도시계획시설의 차량 진출입로를 확보하기 위해서는 이 사건 토지가 아닌, 다른 토지를 확보하는 것이 훨씬 그 목적에 부합하는 등 다른 대안이 있음에도 피고가 이를 고려하지 않고 이 사건 토지를 수용할 수 있는 이 사건 처분을 함으로써 재량권을 일탈·남용하였다며 이 사건 처분의 취소를 구한다. 이에 대하여 원심은 이익형량에 하자가 없는 이 사건 처분에는 재량권을 일탈·남용한 위법이 있다고 보기 어렵다며 원고승계참가인들의 청구를 모두 기각하였다. \n  3. 선행처분 하자와 그 승계\n  가. 관련 법리\n  도시계획시설은 도시관리계획결정에 따라 설치되는데, 도시계획시설결정은 「국토의 계획 및 이용에 관한 법률」등에 따라 도시관리계획결정에 일반적으로 요구되는 기초조사, 주민과 지방의회의 의견 청취, 관계 행정기관장과의 협의나 도시계획위원회 심의 등의 절차를 밟아야 한다. 이러한 절차를 거쳐 도시계획시설결정이 이루어지면 도시계획시설의 종류에 따른 사업대상지의 위치와 면적이 확정되고, 그 사업대상지에서는 원칙적으로 도시계획시설이 아닌 건축물의 건축 등의 허가가 금지된다(같은 법 제64조).\n  반면 실시계획인가는 도시계획시설결정에 따른 특정 사업을 구체화하여 이를 실현하는 것으로서, 시·도지사는 도시계획시설사업의 시행자가 작성한 실시계획이 도시계획시설의 결정·구조 및 설치의 기준 등에 적합하다고 인정하는 경우에는 이를 인가하여야 한다(같은 법 제88조 제3항, 제43조 제2항). 이러한 실시계획인가를 통해 사업시행자에게 도시계획시설사업을 실시할 수 있는 권한과 사업에 필요한 토지 등을 수용할 수 있는 권한이 부여된다.\n  이러한 도시계획시설결정과 실시계획인가는 도시계획시설사업을 위하여 이루어지는 단계적 행정절차에서 별도의 요건과 절차에 따라 별개의 법률효과를 발생시키는 독립적인 행정처분이라고 할 수 있다. 그러므로 선행처분인 도시계획시설결정에 하자가 있더라도 그것이 당연무효가 아닌 한 원칙적으로 후행처분인 실시계획인가에 승계되지 않는다(대법원 2017. 7. 18. 선고 2016두49938 판결 참조).\n  나. 상고이유에 관한 판단\n  앞서 본 사실관계와 원심판결 이유를 이러한 법리에 비추어 살펴보면, 이 사건 도시계획시설(문화예술회관)의 위치와 면적을 확정하는 것은 후행처분인 이 사건 처분이 아니라 선행처분인 이 사건 도시관리계획결정이고, 이 사건 토지의 사업부지 포함 여부에 관한 이익형량 역시 선행처분의 심의·결정 과정에서 이루어지게 된다. 따라서 원고승계참가인들의 주장은 이 사건 처분의 위법사유가 아니라 이 사건 도시관리계획결정의 위법사유에 관한 것에 불과하다. 나아가 원고승계참가인들의 주장을 이 사건 도시관리계획결정의 위법성 및 그 하자 승계를 주장한 것으로 선해하더라도 선행처분인 이 사건 도시관리계획결정의 하자는 원칙적으로 독립적인 후행처분인 이 사건 처분에 승계되지 않을 뿐 아니라, 이 사건 도시관리계획결정에 중대·명백한 하자가 존재한다고 볼 만한 자료도 찾을 수 없다.\n  원심이 이 사건 도시계획시설에 이 사건 토지를 포함시킨 것이 위법하다는 취지의 원고승계참가인들의 주장과 관련하여, 먼저 선행처분인 이 사건 도시관리계획결정의 하자와 그 승계 여부를 판단하지 아니한 채 그것이 후행처분인 이 사건 처분의 고유한 하자임을 전제로 이 사건 처분의 재량권 일탈·남용 여부를 판단한 부분은 부적절하나, 이 사건 처분이 위법하지 않다는 이유로 원고승계참가인들의 주장을 배척한 결론은 정당하다. 거기에 상고이유 주장과 같이 변론재개 여부, 직권심리주의, 재량권 일탈·남용 여부 판단 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. \n  4. 결론 \n  상고를 모두 기각하고 상고비용은 패소자들이 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 이흥구(재판장) 오석준 노경필(주심) 이숙연"
  },

    "판시사항": "지적재조사에 관한 특별법 제14조 제1항 제1호에서 정한 ‘지상경계에 대하여 다툼이 없는 경우’의 의미",
    "판결요지": "지적재조사에 관한 특별법(이하 ‘지적재조사법’이라 한다) 제1조는 \"이 법은 토지의 실제 현황과 일치하지 아니하는 지적공부의 등록사항을 바로 잡고 종이에 구현된 지적을 디지털 지적으로 전환함으로써 국토를 효율적으로 관리함과 아울러 국민의 재산권 보호에 기여함을 목적으로 한다.\"라고 규정하고 있고, 제2조 제2호는 \"지적재조사사업이란 「공간정보의 구축 및 관리 등에 관한 법률」 제71조부터 제73조까지의 규정에 따른 지적공부의 등록사항을 조사·측량하여 기존의 지적공부를 디지털에 의한 새로운 지적공부로 대체함과 동시에 지적공부의 등록사항이 토지의 실제 현황과 일치하지 아니하는 경우 이를 바로 잡기 위하여 실시하는 국가사업을 말한다.\"라고 규정하고 있다.\n  지적재조사법 제14조 제1항은 \"지적소관청은 다음 각 호의 순위로 지적재조사를 위한 경계를 설정하여야 한다.\"라고 규정하면서 \"지상경계에 대하여 다툼이 없는 경우 토지소유자가 점유하는 토지의 현실경계\"(제1호), \"지상경계에 대하여 다툼이 있는 경우 등록할 때의 측량기록을 조사한 경계\"(제2호), \"지방관습에 의한 경계\"(제3호)로 그 순위를 정하고 있다.\n  또한 지적재조사법 제20조 제1항은 \"지적소관청은 제18조에 따른 경계 확정으로 지적공부상의 면적이 증감된 경우에는 필지별 면적 증감내역을 기준으로 조정금을 산정하여 징수하거나 지급한다.\"라고 규정하고 있다.\n  이러한 지적재조사사업의 목적, 관련 규정의 문언과 체계 등을 종합하면, 지적재조사법 제14조 제1항 제1호에서 정한 ‘지상경계에 대하여 다툼이 없는 경우’는 ‘토지 지상에 설치된 둑, 담장 등 구조물이나 경계점표지 등에 의하여 구분되는 현실경계 자체에 대하여 다툼이 없는 경우’를 의미하는 것으로 보아야 하고, ‘현실경계가 해당 토지의 소유권이 미치는 실제 경계라는 점에 대하여 다툼이 없는 경우’를 의미한다고 볼 수 없다.",

    "판례내용": "【원고, 피상고인】                원고 (소송대리인 법무법인 제이케이엘파트너스 담당변호사 이충표)\n【피고, 상고인】 양구군수 (소송대리인 법무법인 한일 담당변호사 김정기)\n【원심판결】  서울고법 2024. 12. 18. 선고 (춘천)2024누520 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요 \n  원심판결의 이유와 기록에 의하면 다음과 같은 사실을 알 수 있다.\n  가. 소외인은 강원 양구군 ○○면 △리 (지번 생략) 전 724㎡(이하 ‘이 사건 토지’라 한다)에 관하여 1990. 3. 29. 소유권이전등기를 마쳤다. \n  나. 피고는 「지적재조사에 관한 특별법」(이하 ‘지적재조사법’이라 한다)에 기하여 2020년경 이 사건 토지가 포함된 강원 양구군 ○○면 △리 2지구 278,297.1㎡에 대하여 지적재조사사업을 시행하였다. 이 사건 토지에 대한 지적재조사측량결과에 따르면, 이 사건 토지 중 일부는 아스콘으로 포장되어 도로로 사용되고 있고 일부는 콘크리트로 조성된 화단과 식재된 나무로 구분된 채 다른 토지 방면으로 통하는 진입로로 사용되고 있었다.\n  다. 피고는 이 사건 토지가 ‘지상경계에 다툼이 없는 경우’에 해당한다고 보아 지적재조사법 제14조 제1항 제1호에 따라 경계를 설정하였다. \n  라. 피고는 2021. 10. 6. 소외인에게 이 사건 토지에 관하여 \"지적재조사법 제15조 제2항에 따라 기존 지적공부상의 종전 토지면적이 724㎡이고, 지적재조사를 통하여 종전 토지면적에 비하여 143.3㎡가 감소된 것으로 산정된 토지면적 580.7㎡가 ‘강원 양구군 ○○면 △리 (지번 생략) 전’이 된다는 점\" 등을 표시한 지적확정예정조서를 송부하였다. 이 사건 토지의 면적에서 제외된 위 143.3㎡는 이 사건 토지 중 도로와 진입로로 사용되는 부분에 해당하는 면적이다. \n  마. 원고는 2021. 12. 22. 소외인으로부터 이 사건 토지를 매수하여 2021. 12. 30. 매매를 원인으로 하여 이 사건 토지에 관한 소유권이전등기를 마쳤다.\n  바. 피고는 2022. 2. 8. 지적재조사법 제14조 제1항 제1호에 따라 이 사건 토지 중 도로와 진입로로 사용되는 부분 143.3㎡를 제외하는 내용으로 토지의 경계를 결정한 후 원고에게 이를 통지하였다(이하 ‘이 사건 경계결정’이라 한다).\n  사. 원고는 2022. 2. 22. 이 사건 경계결정에 불복하여 이의신청을 하였고, 양구군 경계결정위원회는 2022. 6. 10. 원고의 이의신청을 기각하였으며, 피고는 2022. 6. 17. 원고에게 이를 통지하였다. \n  2. 원심의 판단 \n  원심은 ‘지상경계에 대하여 다툼이 없는 경우’는 경계 설정 당시를 기준으로 지적공부의 기재사항과 다른 지상경계 내지 현실경계가 그 해당 토지의 소유권이 미치는 실제 경계라는 점에 대하여 그 토지소유자 및 인접 토지소유자들 사이에 다툼이 없는 경우를 의미한다고 전제한 다음, 이 사건 경계결정은 현실경계 자체에 다툼이 없더라도 권리관계에 다툼이 없다고 인정하기 부족하므로 지적재조사법 제14조 제1항 제1호의 요건을 갖추지 못한 것으로 위법하다고 보았다.  \n  3. 대법원의 판단 \n  가.                지적재조사법 제1조는 \"이 법은 토지의 실제 현황과 일치하지 아니하는 지적공부의 등록사항을 바로 잡고 종이에 구현된 지적을 디지털 지적으로 전환함으로써 국토를 효율적으로 관리함과 아울러 국민의 재산권 보호에 기여함을 목적으로 한다.\"라고 규정하고 있고, 제2조 제2호는 \"지적재조사사업이란 「공간정보의 구축 및 관리 등에 관한 법률」 제71조부터 제73조까지의 규정에 따른 지적공부의 등록사항을 조사·측량하여 기존의 지적공부를 디지털에 의한 새로운 지적공부로 대체함과 동시에 지적공부의 등록사항이 토지의 실제 현황과 일치하지 아니하는 경우 이를 바로 잡기 위하여 실시하는 국가사업을 말한다.\"라고 규정하고 있다. \n                 지적재조사법 제14조 제1항은 \"지적소관청은 다음 각 호의 순위로 지적재조사를 위한 경계를 설정하여야 한다.\"라고 규정하면서 \"지상경계에 대하여 다툼이 없는 경우 토지소유자가 점유하는 토지의 현실경계\"(제1호), \"지상경계에 대하여 다툼이 있는 경우 등록할 때의 측량기록을 조사한 경계\"(제2호), \"지방관습에 의한 경계\"(제3호)로 그 순위를 정하고 있다.\n  또한 지적재조사법 제20조 제1항은 \"지적소관청은 제18조에 따른 경계 확정으로 지적공부상의 면적이 증감된 경우에는 필지별 면적 증감내역을 기준으로 조정금을 산정하여 징수하거나 지급한다.\"라고 규정하고 있다. \n  나. 이러한 지적재조사사업의 목적, 관련 규정의 문언과 체계 등을 종합하면, 지적재조사법 제14조 제1항 제1호에서 정한 ‘지상경계에 대하여 다툼이 없는 경우’는 ‘토지 지상에 설치된 둑, 담장 등 구조물이나 경계점표지 등에 의하여 구분되는 현실경계 자체에 대하여 다툼이 없는 경우’를 의미하는 것으로 보아야 하고, ‘현실경계가 해당 토지의 소유권이 미치는 실제 경계라는 점에 대하여 다툼이 없는 경우’를 의미한다고 볼 수 없다. 그 이유는 다음과 같다. \n  1) 지적재조사사업은 새로운 지적공부로의 전환뿐 아니라, 토지의 실제 현황과 일치하지 않는 지적공부의 등록사항을 바로잡기 위한 목적에서 시행되고 있다. 한편 앞서 살핀 지적재조사법 제14조 제1항의 경계 설정 순위는 지적재조사사업에서 토지소유자가 점유하는 토지의 현실경계를 경계설정 기준의 우선순위로 삼고 있다.\n  지적재조사사업의 목적에 비추어 볼 때, 지적재조사법 제14조 제1항 제1호에서 ‘토지소유자가 점유하는 현실경계’를 기준으로 경계를 설정하도록 한 것은, 경계를 같이하는 토지소유자들 사이에 오랜 기간 현실의 경계를 기준으로 한 토지의 실제 현황에 대하여 다툼이 없었다면, 그러한 현실경계를 지적공부의 새로운 경계로 확정하는 것이 토지의 효율적 관리에 부합한다고 볼 수 있기 때문이다. \n  2) 지적재조사법 제14조 제1항 제1호는 ‘지상경계에 다툼이 없는 경우’라고 규정하고 있을 뿐 ‘지상경계’에 대한 정의를 두고 있지 않다. 한편 지적재조사법 제3조 제2항은 \"지적재조사사업을 시행할 때 이 법에서 규정하지 아니한 사항에 대하여는 「공간정보의 구축 및 관리 등에 관한 법률」에 따른다.\"라고 규정하고 있고, 「공간정보의 구축 및 관리 등에 관한 법률」 제65조 제1항은 \"토지의 지상경계는 둑, 담장이나 그 밖에 구획의 목표가 될 만한 구조물 및 경계점표지 등으로 구분한다.\"라고 규정하고 있다. \n  3) 만일 지적재조사법 제14조 제1항 제1호의 ‘지상경계에 다툼이 없는 경우’를 지상경계와 해당 토지의 소유권이 미치는 범위가 일치하는 데 다툼이 없는 경우로 해석한다면, 이는 토지의 실제 현황과 일치하지 않는 지적공부의 등록사항을 바로 잡기 위한 지적재조사사업의 목적에 부합하지 아니한다. 또한 그와 같은 해석은 점유현황에 따른 현실경계를 경계설정 기준의 우선순위로 설정한 지적재조사법 제14조 제1항 제1호의 입법 취지를 퇴색시키고, 소유권을 경계설정 기준의 우선순위로 끌어들이는 것으로 타당하지 않다.\n  4) 물론 토지소유자들 사이에 지적재조사법 제15조에 의한 지적재조사측량 이전부터 현실경계와 토지소유자의 소유권이 미치는 지적공부상의 경계가 다르다는 이유로 다툼이 있었던 경우는 지적재조사법 제14조 제1항 제2호의 ‘지상경계에 대하여 다툼이 있는 경우’로 볼 수 있다. 그러나 이는 ‘지상경계에 대하여 다툼이 있는 경우’의 유형 중 하나에 해당하는 것으로, ‘현실경계와 해당 토지의 소유권이 미치는 범위가 다르다.’는 주장은 다툼의 발생 원인에 해당할 뿐이다.\n  5) 경계설정으로 인한 토지 면적의 증감 또는 감소는 지적재조사법 제20조 제1항의 조정금을 통하여 해결할 수 있다. 지적재조사법은 지적재조사 사업지구 지정에 일정 수 이상의 토지소유자의 동의를 요구하는 절차를 마련하고 있고(제7조 제2항), 토지소유자로 구성된 토지소유자협의회에 조정금 산정기준에 대한 의견 제출 권한 등 일정한 권한을 부여하고 있다(제13조 제3항 제5호). 또한 조정금의 산정은 개별공시지가 또는 감정평가액을 기준으로 하도록 하면서(제20조 제3항) 시·군·구 지적재조사위원회의 심의를 거칠 것을 요구하고 있으므로(제20조 제4항), 지적재조사법에 따른 조정금 제도가 토지소유자의 재산권을 과도하게 제한한다고 보기도 어렵다. \n  다. 그럼에도 원심은 이와 달리, 지적재조사법 제14조 제1항 제1호의 ‘지상경계에 대하여 다툼이 없는 경우’에 관하여 토지소유자들 사이에서 그 현실경계가 해당 토지의 소유권이 미치는 실제 경계와 일치한다는 데에 다툼이 없는 경우를 의미한다고 판단하였다. 원심의 이러한 판단에는 지적재조사법 제14조 제1항 제1호에서 정한 ‘지상경계에 대하여 다툼이 없는 경우’에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 취지의 상고이유 주장은 이유 있다.\n  4. 결론\n  원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 마용주(재판장) 노태악 서경환(주심) 신숙희"

    "판결유형": "판결",
    "판시사항": "[1] 구 사립학교법 시행령 제9조의6 제4항 제1호에서 ‘협의체의 총인원수를 해당 학교법인 이사정수의 과반수’로 한다는 부분의 의미 및 학교법인의 생존한 종전이사만으로 전현직이사협의체의 총인원수인 ‘해당 학교법인 이사정수의 과반수’를 충족하지 못하는 경우, 사학분쟁조정위원회가 생존해 있는 종전이사들만으로 전현직이사협의체를 구성하여 후보자 추천에 관한 의견을 청취해야 하는지 여부(적극)\n [2] 행정청이 처분절차에서 관계 법령의 절차 규정을 위반했으나 처분상대방이나 관계인의 의견진술권이나 방어권 행사에 실질적으로 지장이 초래되었다고 볼 수 없는 특별한 사정이 있는 경우, 해당 처분을 취소해야 하는지 여부(소극)\n [3] 甲 학교법인의 전직 이사인 乙 등이, 사학분쟁조정위원회가 전현직이사협의체를 구성하는 절차를 거치지 않았다는 이유로 교육부장관이 한 甲 법인의 정식이사 선임처분의 취소를 구하는 소송을 제기한 사안에서, 구 사립학교법 시행령 제9조의6 제4항 제1호의 절차 규정 위반으로 乙 등의 의견진술권 행사에 실질적으로 지장이 초래되었다고 볼 수 없는 특별한 사정이 있다고 볼 수 있는데도, 전현직이사협의체의 구성을 생략한 사학분쟁조정위원회의 절차적 위법으로 바로 위 처분이 절차적 정당성을 상실하여 취소되어야 한다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례",
    "판결요지": "[1] 구 사립학교법(2020. 12. 22. 법률 제17659호로 개정되기 전의 것) 제25조의3 제1항, 구 사립학교법 시행령(2020. 9. 25. 대통령령 제31049호로 개정되기 전의 것) 제9조의6 제4항 제1호, 제5항 제1호의 문언과 내용 및 취지 등을 종합해 보면, ‘협의체의 총인원수를 해당 학교법인 이사정수의 과반수’로 한다는 부분의 의미는, 해당 학교법인의 일정한 전현직 정식이사(이하 합하여 지칭할 때는 ‘종전이사’라 한다)로 구성된 협의체(이하 ‘전현직이사협의체’라 한다) 구성원 수의 상한이 해당 학교법인 이사정수의 과반수가 된다는 것이지, 생존하고 있는 종전이사가 해당 학교법인 이사정수의 과반수에 달하여야만 전현직이사협의체를 구성할 수 있다는 것이 아니다. 따라서 사망 등의 사유로 인하여 해당 학교법인의 생존한 종전이사만으로 전현직이사협의체의 총인원수인 ‘해당 학교법인 이사정수의 과반수’를 충족하지 못하는 경우에도, 사학분쟁조정위원회는 생존하여 있는 종전이사들만으로 전현직이사협의체를 구성하여 그로부터 후보자 추천에 관한 의견을 청취해야 한다. \n [2] 행정청이 처분절차에서 관계 법령의 절차 규정을 위반하여 절차적 정당성이 상실된 경우에는 해당 처분은 위법하고 원칙적으로 취소해야 한다. 다만 처분상대방이나 관계인의 의견진술권이나 방어권 행사에 실질적으로 지장이 초래되었다고 볼 수 없는 특별한 사정이 있는 경우에는, 절차 규정 위반으로 인하여 처분절차의 절차적 정당성이 상실되었다고 볼 수 없으므로, 해당 처분을 취소할 것은 아니다.\n [3] 甲 학교법인의 전직 이사인 乙 등이, 사학분쟁조정위원회가 전현직이사협의체를 구성하는 절차를 거치지 않았다는 이유로 교육부장관이 한 甲 법인의 정식이사 선임처분의 취소를 구하는 소송을 제기한 사안에서, 乙 등은 구 사립학교법 시행령(2020. 9. 25. 대통령령 제31049호로 개정되기 전의 것, 이하 같다) 제9조의6 제5항 제1호 (가)목에서 규정하고 있는 해당 학교법인이 설치·경영하는 학교의 운영에 중대한 장애를 야기한 것으로 평가되는 인원(이하 ‘물의인원’이라 한다)에 해당하는 점, 전체 후보자 수 중 전현직이사협의체의 추천 후보자 수를, 전현직이사협의체에 물의인원이 없는 경우 과반수가 되도록, 물의인원이 있는 경우 과반수 미만이 되도록 하는 제한 내에서 정식이사 후보자에 대한 의견 제출·청취의 절차 및 방법을 정할 수 있는 재량을 가진 사학분쟁조정위원회는 乙 등이 물의인원에 해당하므로 위 정식이사 선임처분에 앞서 乙 등으로 하여금 전현직이사협의체를 구성하도록 했어도, 乙 등에게 과반수 미만이라는 제한 내에서 정식이사 후보자 추천에 관한 의견 제출권을 부여할 수밖에 없었던 점, 물의인원이 있는 종전이사들에 대하여 전현직이사협의체 구성을 생략하고 ‘그 밖에 조정위원회가 인정하는 이해관계인’으로서 의견을 제출하게 했다면, 절차, 방법 및 결과에서 전현직이사협의체로 구성하여 의견을 제출하게 한 경우와 크게 다르다고 보기 어려우므로, 종전이사들의 정식이사 후보자에 대한 의견 제출권 행사에 실질적으로 지장이 초래되었다고 볼 수 없는 특별한 사정이 있었는지를 살펴 볼 필요가 있는 점을 종합하면, 정식이사 후보자 추천의견 청취과정에서 구 사립학교법 시행령 제9조의6 제4항 제1호의 전현직이사협의체를 구성해야 한다는 절차 규정 위반으로 乙 등의 의견진술권 행사에 실질적으로 지장이 초래되었다고 볼 수 없는 특별한 사정이 있다고 볼 수 있는데도, 전현직이사협의체의 구성을 생략한 사학분쟁조정위원회의 절차적 위법으로 바로 위 처분이 절차적 정당성을 상실하여 취소되어야 한다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례.",
    "참조조문": "[1] 구 사립학교법(2020. 12. 22. 법률 제17659호로 개정되기 전의 것) 제25조의3 제1항, 구 사립학교법 시행령(2020. 9. 25. 대통령령 제31049호로 개정되기 전의 것) 제9조의6 제4항 제1호(현행 제9조의7 제4항 제1호 참조), 제5항 제1호(현행 삭제) / [2] 행정소송법 제19조, 제27조[행정소송재판일반] / [3] 구 사립학교법(2020. 12. 22. 법률 제17659호로 개정되기 전의 것) 제25조의3 제1항, 구 사립학교법 시행령(2020. 9. 25. 대통령령 제31049호로 개정되기 전의 것) 제9조의6 제4항 제1호(현행 제9조의7 제4항 제1호 참조), 제5항 제1호(현행 삭제), 행정소송법 제19조, 제27조[행정소송재판일반]",
    "참조판례": "[1] 대법원 2023. 1. 12. 선고 2022두55958 판결(공2023상, 443) / [2] 대법원 2018. 3. 13. 선고 2016두33339 판결(공2018상, 697)",
    "판례내용": "【원고, 피상고인】 원고 1 외 3인 (소송대리인 법무법인(유한) 태평양 외 4인)\n【피고, 상고인】 교육부장관 (소송대리인 법무법인(유한) 지평 담당변호사 박성철 외 1인)\n【피고참가인】 사학분쟁조정위원회\n【피고보조참가인, 상고인】 학교법인 ○○학원 외 2인 (소송대리인 변호사 손영실 외 1인)\n【피고보조참가인】 피고보조참가인 4 외 1인\n【원심판결】 서울고법 2021. 12. 9. 선고 2020누67492 판결\n【주    문】\n원고 1과 피고 사이의 소송은 2021. 12. 19. 원고 1의 사망으로, 원고 2와 피고 사이의 소송은 2022. 5. 31. 원고 2의 사망으로 각각 종료되었다.  원심판결 중 원고 3, 원고 4에 대한 부분을 파기하고, 이 부분 사건을 서울고등법원에 환송한다.  \n\n【이    유】  1. 이 사건 소송 중 원고 1, 원고 2 부분에 대하여 \n  직권으로 판단한다.\n  기록에 의하면, 원심판결은 2021. 12. 9. 선고되었고, 원고 1은 2021. 12. 19.에, 원고 2는 2022. 5. 31.에 각각 사망하였음이 명백하다. \n  전현직이사협의체를 구성하여 정식이사 후보자에 관한 의견을 제출할 원고 1, 원고 2의 권리 또는 지위는 그들의 피고보조참가인 학교법인 ○○학원(이하 ‘피고보조참가인 1 학교법인’이라 한다) 전직 정식이사라는 지위에서 파생되는 것이라고 할 것인데, 전직 정식이사의 지위는 일신전속적인 것이어서 상속의 대상이 되지 않는다(대법원 2004. 4. 27. 선고 2003다64381 판결 참조). \n  따라서 자신들이 전직 정식이사라는 전제에서, 참가행정청이 전현직이사협의체를 구성하는 절차를 거치지 않았음을 이유로, 피고가 2018. 8. 14.에 한 피고보조참가인 1 학교법인의 정식이사 선임처분(이하 ‘이 사건 처분’이라 한다)의 취소를 구하는 이 사건 소송 중 원고 1, 원고 2 부분은 위 원고들의 사망과 동시에 종료되었고, 위 원고들의 상속인들에 의하여 승계될 여지도 없다. \n  2. 이 사건 소송 중 원고 3, 원고 4 부분에 대하여\n  상고이유(제출기간이 지난 각 상고이유보충서의 기재는 이를 보충하는 범위에서)를 판단한다.\n  가. 정식이사 후보자 추천의견 청취절차 관련 규정의 내용 및 해석\n  1) 구 사립학교법(2020. 12. 22. 법률 제17659호로 개정되기 전의 것) 제25조의3 제1항은 임시이사가 선임된 학교법인에 대하여 임시이사 선임사유가 해소되었다고 인정할 때에 관할청이 사학분쟁조정위원회(이하 ‘조정위원회’라고 한다)의 심의를 거쳐 정식이사를 선임하도록 규정하고 있다. \n구 사립학교법 시행령(2020. 9. 25. 대통령령 제31049호로 개정되기 전의 것, 이하 같다) 제9조의6 제4항, 제5항에 의하면, 조정위원회가 정식이사 선임을 심의하려는 경우, 해당 학교법인의 일정한 전현직 정식이사(이하 합하여 지칭할 때는 ‘종전이사’라 한다)로 구성된 협의체(이하 ‘전현직이사협의체’라 한다), 해당 학교법인이 설치·경영하는 학교의 교직원 대표기구 및 학생·학부모 대표기구, 개방이사추천위원회, 해당 학교법인, 관할청, 그 밖에 조정위원회가 인정하는 이해관계인 등으로부터 정식이사 후보자 추천의견을 청취하여야 한다. 이때, 구체적인 의견 제출·청취의 절차 및 방법은 조정위원회가 정하되, 전현직이사협의체의 구성원 중 해당 학교법인이 설치·경영하는 학교의 운영에 중대한 장애를 야기한 것으로 평가되는 구 사립학교법 시행령 제9조의6 제5항 제1호 각 목에 해당하는 인원(이하 합하여 지칭할 때는 ‘물의인원’이라 한다)이 있는 경우에는 전현직이사협의체로 하여금 추천하도록 하는 후보자 수가 전체 후보자 수의 과반수 미만이 되도록 하여야 하고, 그 외의 경우에는 전현직이사협의체로 하여금 추천하도록 하는 후보자 수가 전체 후보자 수의 과반수가 되도록 하여야 한다. \n  한편 구 사립학교법 시행령 제9조의6 제4항 제1호는, 전현직이사협의체의 ‘총인원수는 해당 학교법인 이사정수의 과반수’로 하되, ① 해당 학교법인의 현직 정식이사[같은 호 (가)목], ② 퇴직일이 가장 최근인 해당 학교법인의 전직 정식이사[같은 호 (나)목]의 순서에 따라 포함하여 구성하고, 현직 정식이사만으로 인원수가 초과되거나 전직 정식이사 중 마지막으로 구성원으로 포함될 사람들의 퇴직일이 동일하여 인원수가 초과되는 경우에는 그 초과된 인원을 포함한 인원수를 협의체의 총인원수로 본다고 규정하고 있다. \n  2) 위 법령 규정들의 문언과 내용 및 취지 등을 종합하여 보면, ‘협의체의 총인원수를 해당 학교법인 이사정수의 과반수’로 한다는 부분의 의미는, 전현직이사협의체 구성원 수의 상한이 해당 학교법인 이사정수의 과반수가 된다는 것이지, 생존하고 있는 종전이사가 해당 학교법인 이사정수의 과반수에 달하여야만 전현직이사협의체를 구성할 수 있다는 것이 아니다. 따라서 사망 등의 사유로 인하여 해당 학교법인의 생존한 종전이사만으로 전현직이사협의체의 총인원수인 ‘해당 학교법인 이사정수의 과반수’를 충족하지 못하는 경우에도, 조정위원회는 생존하여 있는 종전이사들만으로 전현직이사협의체를 구성하여 그로부터 후보자 추천에 관한 의견을 청취하여야 한다. 그 구체적인 이유는 다음과 같다.\n  가) 구 사립학교법 시행령 제9조의6 제4항, 제5항의 취지는, 교육의 공공성이라는 목표 아래 사립학교 운영의 투명성과 합리성 실현을 위해 별도의 기관으로서 독립성과 전문성을 갖춘 조정위원회가, 임시이사가 선임된 학교법인의 정상화 과정에서 정식이사 선임에 관하여 심의하도록 하되, 그 과정에서 학교법인의 설립목적을 승계하였다고 볼 수 있는 종전이사 측의 의견 제출권을 보장함으로써, 사립학교에서 교육의 자주성 및 자율성을 도모하여 사립학교 설립 및 운영의 자유를 실질적으로 구현할 수 있도록 하기 위함이다.\n  나) 구 사립학교법 시행령 제9조의6 제4항 제1호 후문은 전현직이사협의체의 총인원수를 ‘해당 학교법인 이사정수의 과반수’로 한다고 규정하고 있을 뿐, 해당 학교법인의 생존하는 종전이사의 수가 이사정수의 과반수에 이르는 경우에 전현직이사협의체를 구성한다고 규정하고 있지 아니하다. \n  해당 규정의 취지와 앞뒤 문맥에 비추어 보면, 구 사립학교법 시행령 제9조의6 제4항 제1호는, 생존하는 종전이사의 수가 많아 해당 학교법인 이사정수의 과반수를 초과하는 경우에, 이들 모두를 협의체에 참여시키는 것은 현실적으로 불가능하거나 심의에 지나친 비효율을 초래할 수 있고 전현직이사협의체에 참여하려는 종전이사들 사이에 새로운 분쟁을 야기할 수도 있으므로, 전현직이사협의체의 총인원수, 즉 구성원의 상한을 원칙적으로 해당 학교법인 이사정수의 과반수에 해당하는 숫자로 제한하면서 전현직이사협의체 구성에 관한 일련의 과정을 규정하고 있을 뿐이지, 생존하는 종전이사의 수가 해당 학교법인 이사정수의 과반수에 미달하는 경우에 대하여 규정하고 있다고 볼 수는 없다. \n  그러므로 단순히 생존 종전이사의 수가 해당 학교법인 이사정수 과반수에 미지치 못한다는 이유로, 조정위원회가 구 사립학교법 시행령 제9조의6 제4항 제1호 후문을 들어 전현직이사협의체의 구성 및 그로부터의 의견 청취를 생략하는 것은 허용되지 않는다고 보아야 한다. 구 사립학교법 시행령 제9조의6 제4항 제1호 전문이 전현직이사협의체로 하여금 조정위원회로부터 인정을 받도록 규정하고 있다고 하더라도 달리 보기는 어렵다. \n  다) 물의인원이 없다면, 전현직이사협의체는 정식이사 선임 절차에서 정식이사 전체 후보자 중 과반수 후보자 추천에 관한 의견 제출권을 부여받을 수 있다. 그런데 종전이사 다수가 사망하였다는 등의 우연한 사정이 있다고 하여 그 구성을 생략할 수 있다는 해석은, 사립학교 설립 및 운영의 자유 보장과 사립학교의 공공성 및 공적 개입 필요성의 조화를 통하여 사립학교 분쟁의 해결을 도모하는 조정위원회 및 전현직이사협의체 제도의 취지에 부합하지 않는다. \n  종전이사들이 해당 학교법인 이사정수의 과반수만큼 생존하고 있는 경우와 그렇지 않은 경우 사이에 사립학교 정상화의 가능성, 관할청 및 조정위원회의 개입 필요성 및 정도, 향후 정상화의 방향 등에 있어 본질적인 차이가 있다고 보기도 어렵다.\n  라) 구 사립학교법 시행령 제9조의6 제5항은 전현직이사협의체 구성원들에게 과반수 정식이사 후보자에 관한 의견 제출권을 부여하기에 부적합한 사유가 있는 경우, 즉 구성원들 중 물의인원이 있는 경우 과반수 미만의 정식이사 후보자만을 추천하도록 규정하고 있다. 또한 조정위원회는 합리적인 범위에서 정식이사 후보자에 대한 의견 제출·청취의 절차 및 방법을 정할 수 있는 재량을 가지고 있고(대법원 2023. 1. 12. 선고 2022두55958 판결 참조), 관할청 역시 구 사립학교법 시행령 제9조의6 제4항 각호의 여러 주체들이 추천한 사람들 중에서 정식이사를 선택할 수 있는 재량을 가지고 있다. \n  이에 비추어 보면, 해당 학교법인 이사정수 과반수에 미치지 못하는 종전이사로 하여금 전현직이사협의체를 구성하여 정식이사 후보자 추천에 관한 의견 제출권을 행사하게 하더라도, 전현직이사협의체의 후보자 추천권 오남용으로 인한 문제가 발생할 가능성은 크지 않을 것으로 보인다.\n  나. 절차 규정 위반의 효과 \n행정청이 처분절차에서 관계 법령의 절차 규정을 위반하여 절차적 정당성이 상실된 경우에는 해당 처분은 위법하고 원칙적으로 취소하여야 한다. 다만 처분상대방이나 관계인의 의견진술권이나 방어권 행사에 실질적으로 지장이 초래되었다고 볼 수 없는 특별한 사정이 있는 경우에는, 절차 규정 위반으로 인하여 처분절차의 절차적 정당성이 상실되었다고 볼 수 없으므로, 해당 처분을 취소할 것은 아니다(대법원 2018. 3. 13. 선고 2016두33339 판결 등 참조).\n  다. 원심의 판단\n  원심은, 그 판시와 같은 사실 및 사정들에 비추어 볼 때, 해당 학교법인의 생존하는 종전이사 인원이 사망 등의 사유로 인하여 해당 학교법인 이사정수의 과반수에 미치지 못하는 경우에도 구 사립학교법 시행령 제9조의6 제4항 제1호의 전현직이사협의체를 구성하여야 함을 전제로, 생존 종전이사인 원고들이 피고보조참가인 1 학교법인의 이사정수 9인의 과반수인 5인에 미달한다는 이유로 참가행정청이 전현직이사협의체의 구성을 생략하고 2018. 8. 6.에 한 피고보조참가인 1 학교법인 정식이사 선임의결은, 구 사립학교법 시행령 제9조의6 제4항 제1호를 위반하여 위법하고, 이에 근거한 피고의 이 사건 처분 역시 위와 같은 절차적 하자가 매우 중대하여 위법하므로, 취소되어야 한다고 판단하였다.\n  라. 대법원의 판단\n  1) 정식이사 후보자 추천의견 청취과정에서, 해당 학교법인의 생존하는 종전이사 인원이 사망 등의 사유로 인하여 해당 학교법인 이사정수의 과반수에 미치지 못하는 경우에도, 구 사립학교법 시행령 제9조의6 제4항 제1호의 전현직이사협의체를 구성하여야 한다는 원심의 판단은 앞서 본 관계 규정의 해석에 부합하는 것으로서 정당하다.\n  2) 그러나 원심이 적법하게 채택한 증거들에 의하여 알 수 있는 다음과 같은 사정들을 앞서 본 법리에 비추어 살펴보면, 그런 절차 규정 위반으로 인하여 원고들의 의견진술권 행사에 실질적으로 지장이 초래되었다고 볼 수 없는 특별한 사정이 있다고 볼 소지가 있다. 따라서 원심으로서는 피고가 제출한 증거를 토대로 그와 같은 특별한 사정이 있었는지를 심리·판단하였어야 함에도, 원심은 그와 같은 사정에 관한 심리 없이 전현직이사협의체의 구성을 생략한 참가행정청의 절차적 위법으로 인하여 바로 이 사건 처분이 절차적 정당성을 상실하였다고 보아 취소되어야 한다고 판단하였다. 이러한 원심의 판단에는 전현직이사협의체의 정식이사 후보자 추천의견 청취절차에 관한 법리를 오해하여 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 있다.\n  가) 원고들은 모두 1990. 6. 9. 자로 4년 임기의 피고보조참가인 1 학교법인 정식이사로 선임되었다. 그러나 피고는 1993. 6. 4. ‘실태조사에 따른 피고의 시정지시를 피고보조참가인 1 학교법인이 이행하지 아니하여 극심한 학내 소요사태가 계속되어 행정이 마비되고 재학생 전원이 유급될 위기에 처하는 등으로 학교법인의 설립목적을 달성할 수 없게 되었다.’는 등의 이유로 구 사립학교법(2005. 12. 29. 법률 제7802호로 개정되기 전의 것) 제20조의2에 의하여 원고들에 대한 1990. 6. 9. 자 이사취임승인을 취소하였다. 따라서 원고들은 구 사립학교법 시행령 제9조의6 제5항 제1호 (가)목에서 규정하고 있는 물의인원에 해당한다.\n  나) 참가행정청은 전체 후보자 수 중 전현직이사협의체의 추천 후보자 수를, 전현직이사협의체에 물의인원이 없는 경우 과반수가 되도록, 물의인원이 있는 경우 과반수 미만이 되도록 하는 제한 내에서 정식이사 후보자에 대한 의견 제출·청취의 절차 및 방법을 정할 수 있는 재량이 있다. 그런데 원고들은 물의인원에 해당하므로, 참가행정청으로서는 이 사건 처분에 앞서 원고들로 하여금 전현직이사협의체를 구성하도록 하였어도, 원고들에게 과반수 미만이라는 제한 내에서 정식이사 후보자 추천에 관한 의견 제출권을 부여할 수밖에 없었다. \n  다) 참가행정청은 2018. 7. 23. 피고보조참가인 1 학교법인 정식이사 9명에 관하여 후보자를 추천받으면서, 원고들을 구 사립학교법 시행령 제9조의6 제4항 제6호에서 규정한 ‘그 밖에 조정위원회가 인정하는 이해관계인’으로 인정하고, 원고들로부터 1명, ○○대학교 대학평의원회로부터 2명, △△△대학교 대학평의원회로부터 1명, □□□고등학교 운영위원회로부터 1명, 피고보조참가인 1 학교법인 개방이사추천위원회로부터 3명, 관할청인 피고로부터 1명을 각각 추천받는 것으로 의결하였다. 원고들이 그 무렵 전현직이사협의체를 구성하였다고 하더라도, 원고들에 대하여 더 많은 의견 제출권이 부여되었을 것이라고 볼 만한 자료는 없다. 나아가 참가행정청이 전현직이사협의체를 구성한 원고들에게 위와 동일한 내용의 의견 제출권을 부여하였더라도, 그와 같은 조치가 참가행정청의 정식이사 후보자에 대한 의견 제출·청취 방법에 관한 재량권을 일탈·남용한 것에 해당한다고 볼 만한 자료도 없다. \n  라) 전현직이사협의체의 구성원이 되는 종전이사들 중 물의인원이 없는 경우, 전현직이사협의체는 과반수의 후보자 추천에 관한 의견 제출권을 부여받을 수 있으므로, 전현직이사협의체 구성을 생략하고 물의인원이 없는 종전이사들을 ‘그 밖에 조정위원회가 인정하는 이해관계인’으로 보아 과반수 미만의 후보자 추천에 관한 의견만을 제출하게 하였다면, 종전이사들의 의견진술권 행사에 실질적으로 지장이 초래되었다고 볼 수 있다. \n  그러나 그들 중 물의인원이 있는 경우, 전현직이사협의체는 총후보자 중 과반수 미만이라는 제한 내에서 후보자 제출에 관한 의견 제출권을 부여받을 수 있고, 그 구체적인 내용은 참가행정청이 재량으로 정하게 된다. 물의인원이 있는 종전이사들에 대하여 전현직이사협의체 구성을 생략하고, 그들로 하여금 ‘그 밖에 조정위원회가 인정하는 이해관계인’으로서 의견을 제출하게 하였다면, 그 절차, 방법 및 결과에 있어 그들로 하여금 전현직이사협의체로 구성하여 의견을 제출하게 한 경우와 크게 다르다고 보기 어려우므로, 종전이사들의 정식이사 후보자에 대한 의견 제출권 행사에 실질적으로 지장이 초래되었다고 볼 수 없는 특별한 사정이 있었는지를 살펴 볼 필요가 있다.\n  3. 결론\n원고 1, 원고 2와 피고 사이의 소송은 원고 1, 원고 2의 사망으로 종료되었음을 선언하고, 원심판결 중 원고 3, 원고 4 부분을 파기하고 이 부분 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.  \n\n대법관 마용주(재판장) 노태악 서경환(주심) 신숙희"

    "판결유형": "판결",
    "판시사항": "[1] 단체협약의 명문 규정을 근로자에게 불리하게 변형 해석할 수 있는지 여부(소극) 및 단체협약 문언의 객관적인 의미가 명확하게 드러나지 않고 문언 해석을 둘러싼 이견이 있는 경우, 이를 해석하는 방법\n [2] 노동조합 및 노동관계조정법 제29조의4 제1항에서 사용자와 교섭대표노동조합에 부과하고 있는 공정대표의무의 취지와 기능 / 단체교섭의 과정이나 그 결과물인 단체협약의 내용뿐만 아니라 단체협약의 이행과정에서도 공정대표의무가 준수되어야 하는지 여부(적극) / 교섭대표노동조합이나 사용자가 소수노동조합 등을 차별한 것으로 인정되는 경우, 그와 같은 차별에 합리적인 이유가 있다는 점에 관한 주장·증명책임의 소재(=교섭대표노동조합이나 사용자)\n [3] 징계위원회를 노사 동수로 구성하고 근로자 측 위원을 노동조합이 지명·위촉하도록 규정한 단체협약을 체결한 사용자와 교섭대표노동조합이 ‘소수노동조합 소속 조합원’에 대한 징계 절차에서 소수노동조합의 조합원들을 배제하고 교섭대표노동조합의 조합원들만을 근로자 측 위원으로 선임한 경우, 공정대표의무에 위배되는지 여부(원칙적 적극) 및 사용자가 위와 같은 공정대표의무를 위반하여 구성된 징계위원회의 의결을 거쳐 징계처분을 한 경우, 그 징계권 행사의 효력(무효)",
    "판결요지": "[1] 단체협약은 근로자의 경제적·사회적 지위 향상을 위하여 노동조합과 사용자가 단체교섭을 거쳐 체결하는 것이므로, 그 명문 규정을 근로자에게 불리하게 변형 해석할 수 없다. 다만 단체협약 문언의 객관적인 의미가 명확하게 드러나지 않고 문언 해석을 둘러싼 이견이 있는 경우에는, 해당 문언의 내용, 단체협약이 체결된 동기 및 경위, 노동조합과 사용자가 단체협약에 의하여 달성하려는 목적과 진정한 의사 등을 종합적으로 고려하여, 논리와 경험의 법칙에 따라 합리적으로 해석해야 한다. \n [2] 교섭창구 단일화 제도 아래에서 교섭대표노동조합이 되지 못한 노동조합은 독자적으로 단체교섭권을 행사할 수 없으므로, 노동조합 및 노동관계조정법은 교섭대표노동조합이 되지 못한 노동조합을 보호하기 위해 사용자와 교섭대표노동조합에 교섭창구 단일화 절차에 참여한 노동조합(이하 ‘소수노동조합’이라 한다) 또는 그 조합원(이하 소수노동조합과 함께 ‘소수노동조합 등’이라 한다)을 합리적 이유 없이 차별하지 못하도록 공정대표의무를 부과하고 있다(제29조의4 제1항). 공정대표의무는 헌법이 보장하는 단체교섭권의 본질적 내용이 침해되지 않도록 하기 위한 제도적 장치로 기능하고, 교섭대표노동조합과 사용자가 체결한 단체협약의 효력이 교섭창구 단일화 절차에 참여한 다른 노동조합에도 미치는 것을 정당화하는 근거가 된다. 이러한 공정대표의무의 취지와 기능 등에 비추어 보면, 공정대표의무는 단체교섭의 과정이나 그 결과물인 단체협약의 내용뿐만 아니라 단체협약의 이행과정에서도 준수되어야 한다. 또한 교섭대표노동조합이나 사용자가 소수노동조합 등을 차별한 것으로 인정되는 경우, 그와 같은 차별에 합리적인 이유가 있다는 점은 교섭대표노동조합이나 사용자에게 주장·증명책임이 있다.\n [3] 단체협약에서 징계위원회를 노사 동수로 구성하고 근로자 측 위원을 노동조합이 지명·위촉하도록 규정하고 있는 경우, 사용자와 교섭대표노동조합이 ‘교섭창구 단일화 절차에 참여한 노동조합(이하 ‘소수노동조합’이라 한다) 소속 조합원’에 대한 징계 절차에서 소수노동조합의 조합원들을 배제하고 교섭대표노동조합의 조합원들만을 근로자 측 위원으로 선임했다면, 이는 다른 특별한 사정이 없는 한 징계 절차에서 소수노동조합 또는 그 조합원을 합리적 이유 없이 차별한 것으로 공정대표의무에 위배된다. \n  나아가 위 단체협약 규정은 근로자의 근로권과 방어에 영향을 줄 수 있는 중요한 절차에 관한 사항에 해당한다. 사용자가 공정대표의무를 위반하여 구성된 징계위원회의 의결을 거쳐 징계처분을 했다면, 그러한 징계권의 행사는 징계사유가 인정되는지와 관계없이 위 단체협약 규정을 위반하여 해당 근로자의 방어권 행사를 제약하여 이루어진 것으로 절차상 중대한 하자가 있어 무효라고 보아야 한다.",
    "참조조문": "[1] 노동조합 및 노동관계조정법 제34조 / [2] 노동조합 및 노동관계조정법 제29조의2 제1항, 제29조의4 제1항 / [3] 노동조합 및 노동관계조정법 제29조의4 제1항",
    "참조판례": "[1] 대법원 2022. 3. 11. 선고 2021두31832 판결 / [2] 대법원 2018. 8. 30. 선고 2017다218642 판결(공2018하, 1914), 대법원 2025. 5. 15. 선고 2022두64693 판결(공2025하, 1071) / [3] 대법원 2008. 5. 29. 선고 2008도2171 판결",
    "판례내용": "【원고, 상고인】 원고 (소송대리인 변호사 이학준)\n【피고, 피상고인】 중앙노동위원회위원장\n【피고보조참가인】 ○○○ 주식회사 (소송대리인 변호사 반희성 외 2인)\n【원심판결】 서울고법 2023. 11. 17. 선고 2022누71006 판결\n【주    문】\n  원심판결 중 부당승무정지 관련 부분을 파기하고, 이 부분 사건을 서울고등법원에 환송한다.  나머지 상고를 기각한다. \n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요 \n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 따르면, 다음 사실을 알 수 있다. \n  가. 피고보조참가인(이하 ‘참가인’이라 한다)은 시내버스 운수업을 목적으로 하는 법인이다. 참가인의 사업장에는 소외 1 노동조합과 소외 2 노동조합(이하 ‘이 사건 노동조합’이라 한다)이 있는데, 교섭창구 단일화 절차를 통하여 소외 1 노동조합이 교섭대표노동조합이 되었다. 원고는 이 사건 노동조합의 조합원이다.  \n  나. 참가인이 2019. 6. 28. 소외 1 노동조합과 체결한 단체협약(이하 ‘이 사건 단체협약’이라 한다)은 다음과 같이 규정하고 있다. \n  1) 참가인은 조합원이 ‘참가인의 지시에 위반하였을 때’, ‘직무상 의무를 위반하거나 직무를 태만히 하였을 때’ 등의 사유에 해당하면 징계할 수 있고(제28조 제1항, 제2항), 징계 종류로는 ‘견책, 승무정지, 징계해고’가 있다(제29조). 징계는 상벌위원회를 통하여 한다(제30조 제1항). \n  2) 참가인은 정당한 이유 없이 조합원에 대하여 ‘승무정지’ 또는 ‘대기발령’을 하지 아니한다(제33조).\n  3) 참가인은 근로자가 ‘정당한 이유 없이 무단결근 3일 이상’ 등의 행위를 하였을 경우 상벌위원회의 의결을 거쳐 징계해고를 할 수 있고(제34조), ‘정당한 이유 없이 지각 또는 조퇴하여 차량 운행에 지장을 주었을 때(2회부터 적용)’ 등의 행위를 하였을 경우 상벌위원회의 의결을 거쳐 대기 조치할 수 있으며, 대기기간은 20일 이내로 하며 그 기간은 무임금으로 한다(제35조).\n  4) 상벌위원회 위원은 노사 각 3인으로 구성한다(제38조 단서).\n  다. 참가인과 소외 1 노동조합은 이 사건 단체협약 체결 당시 상벌위원회규정도 함께 체결하였는데, 그 제4조는 \"위원회는 사용자 측 위원 3인과 근로자 측 위원 3인으로 구성하며, 사용자 측 위원은 대표이사가 위촉하고 근로자 측 위원은 노동조합에서 지부장이 위촉한다.\"라고 규정하고 있다.  \n  라. 원고는 2020. 4. 8. 출근하였다가 관리과장 소외 3과 다툰 후 버스를 운행하지 않고 귀가하였다(이하 ‘이 사건 조퇴’라 한다). \n  마. 참가인은 2020. 4. 22. 상벌위원회(이하 ‘이 사건 상벌위원회’라 한다)를 개최하여 원고에 대하여 이 사건 조퇴가 이 사건 단체협약 제28조 제1항, 제2항 등에서 정한 징계사유에 해당한다는 이유로 승무정지 5일의 징계처분(이하 ‘이 사건 징계’라 한다)을 하였다. \n  바. 참가인은 2020. 6. 1. 원고를 운행 일정이 고정된 고정기사에서 운행 일정이 고정되지 않은 예비기사로 근무할 것을 명하는 내용의 인사발령(이하 ‘이 사건 인사발령’이라 한다)을 하였다. \n  2. 이 사건 징계에 대한 판단 \n  가. 이 사건 조퇴에 정당한 이유가 있는지 여부(제1, 2 상고이유) \n  원심은 판시와 같은 이유로 원고가 참가인의 승인 없이 이 사건 조퇴를 하였고, 그에 정당한 이유가 없다고 판단하였다. \n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 원심의 판단에 상고이유 주장과 같이 산업안전보건법상 작업중지권에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없고, 그에 관한 원심의 증거취사와 사실인정을 다투는 취지의 주장은 적법한 상고이유가 되지 못한다. \n  나. 이 사건 징계가 이 사건 단체협약 제35조에 위배되는지 여부(제3 상고이유)  \n  1) 원심의 판단 \n  원심은 다음과 같은 이유로 5일의 승무정지를 내용으로 하는 이 사건 징계가 이 사건 단체협약 제35조에 위배되지 않는다고 판단하였다. \n  가) 이 사건 단체협약 제35조는 정당한 이유 없이 조퇴한 경우 2회부터 대기 조치를 할 수 있다고 규정하고 있다. \n  나) ① 대기와 승무정지는 실질적 효과 면에서 유사하지만, 이 사건 단체협약은 문언상 승무정지와 대기발령을 구별하고 있다. ② 징계처분의 일종인 승무정지는 상벌위원회를 거쳐야 하나, 인사조치의 일종인 대기는 인사권 행사의 수단인 인사명령으로 할 수 있다. ③ 소외 1 노동조합의 대표자도 이 사건 상벌위원회 당시 근로자 측 위원으로 참여하였음에도, 이 사건 징계에 대하여 이의하지 않았던 점에 비추어, 참가인과 소외 1 노동조합은 징계인 승무정지와 인사명령인 대기가 구분된다는 전제 아래 이 사건 단체협약을 체결한 것으로 보인다. 따라서 참가인은 이 사건 조퇴 횟수가 1회라도 징계처분으로 승무정지를 할 수 있다. \n  2) 대법원의 판단 \n  가) 단체협약은 근로자의 경제적·사회적 지위 향상을 위하여 노동조합과 사용자가 단체교섭을 거쳐 체결하는 것이므로, 그 명문 규정을 근로자에게 불리하게 변형 해석할 수 없다. 다만 단체협약 문언의 객관적인 의미가 명확하게 드러나지 않고 문언 해석을 둘러싼 이견이 있는 경우에는, 해당 문언의 내용, 단체협약이 체결된 동기 및 경위, 노동조합과 사용자가 단체협약에 의하여 달성하려는 목적과 그 진정한 의사 등을 종합적으로 고려하여, 논리와 경험의 법칙에 따라 합리적으로 해석하여야 한다(대법원 2022. 3. 11. 선고 2021두31832 판결 참조). \n  나) 앞서 본 사실관계를 위와 같은 법리에 비추어 살펴보면, 원심의 판단은 다음과 같은 이유로 수긍하기 어렵다.   \n  ① 이 사건 단체협약 제29조는 징계 종류 중 하나로 승무정지만을 규정하고 있다. 그런데 이 사건 단체협약은 제33조에서 ‘대기제한’이라는 표제 아래 ‘승무정지 또는 대기발령’에 관하여 함께 규정하고 있으므로, 문언상 ‘승무정지’를 포함하는 의미로 ‘대기’라는 용어를 사용하고 있다.   \n  ② 이 사건 단체협약상 대기와 승무정지는 해당 기간 승무 업무가 정지되고 임금이 지급되지 않는다는 점에서 효과가 같고, 상벌위원회의 의결을 거쳐야 하므로 절차도 동일하다. 이 사건 단체협약 제35조는 ‘상벌위원회의 의결을 거쳐’ 대기 조치할 수 있다고 명문으로 규정하고 있고, 그러한 절차에 대한 문언은 징계해고에 관한 이 사건 단체협약 제34조의 문언과 거의 동일하다. 그러므로 이 사건 단체협약 제35조의 명문 규정을 참가인이 상벌위원회의 의결을 거치지 아니한 채 인사명령 형식으로 대기 조치를 취할 수 있다는 취지로 근로자에게 불리하게 변형·축소하여 해석할 수 없다.  \n  ③ 이 사건 단체협약은 제29조에서 징계의 종류로 견책, 승무정지, 해고를 규정하고 있는데, 제34조에서 가장 중한 징계인 해고의 구체적 사유에 관하여 규정한 후, 바로 다음 규정인 제35조에서 대기의 구체적 사유에 관하여 규정하고 있을 뿐, 해고 다음으로 중한 징계인 승무정지의 구체적 사유에 관하여 별도의 규정이 없다. 대기 사유 중 하나로 ‘정당한 이유 없이 지각 또는 조퇴하여 차량 운행에 지장을 주었을 때(2회부터 적용)’가 규정되어 있는데, 이는 징계해고 사유 중 하나로 규정된 ‘정당한 이유 없이 무단결근 3일 이상’과 비교하더라도, 그 정도가 가볍지 않은 비위행위에 해당한다. \n  ④ 일반적으로 근로관계에서 징계란 사용자가 근로자의 과거 비위행위에 대하여 기업질서 유지를 목적으로 하는 징벌적 제재를 말한다(대법원 2021. 1. 14. 선고 2020두48017 판결 참조). 이 사건 단체협약 제35조의 대기는 무단조퇴 2회 등의 비위행위에 대하여 20일 이내 임금 미지급이라는 징벌적 제재를 가하는 것일 뿐만 아니라, 징계와 동일하게 상벌위원회의 의결 절차를 거쳐야 하므로, 징계를 준비하기 위한 잠정적 조치로서 인사명령에 불과하다고 볼 수 없고, 징계의 일종으로 보아야 한다. 소외 1 노동조합과 참가인도 이 사건 단체협약의 대기가 징계임을 전제로 이 사건 단체협약 제35조를 통하여 대기를 할 수 있는 사유 또는 대상을 그 정도가 비교적 중한 비위행위로 제한하려고 한 것으로 보인다. \n  ⑤ 결국 이 사건 단체협약 제35조의 대기 사유는 사실상 승무정지의 사유를 정한 것으로 볼 수 있다. 이 사건 단체협약이 징계의 종류로 ‘견책, 승무정지, 징계해고’만을 들고 있다고 하더라도, 이 사건 단체협약상 대기와 승무정지는 동일한 의미로서, 승무정지 역시 무단지각 또는 무단조퇴 2회부터 적용된다고 봄이 타당하다. 따라서 참가인이 그 횟수가 1회인 이 사건 조퇴를 사유로 이 사건 징계를 한 것은 이 사건 단체협약 제35조에 위배된다. \n  다) 그런데도 원심은 그 판시와 같은 이유로, 이 사건 징계가 이 사건 단체협약 제35조에 위배되지 않는다고 판단하였으니, 이러한 원심의 판단에는 단체협약의 해석 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 취지의 상고이유 주장은 이유 있다.\n  다. 이 사건 징계의 절차에 중대한 하자가 있는지 여부(제4 상고이유 중 일부)\n  1) 원심의 판단 \n  원심은 다음과 같은 이유로 이 사건 상벌위원회의 구성을 비롯하여 이 사건 징계의 절차에 이 사건 단체협약 제38조 단서나 공정대표의무 등에 위배되는 하자가 없다고 판단하였다. \n  가) 이 사건 노동조합과 소외 1 노동조합의 조합원 수가 13배 이상 차이나고 근로자 측 위원은 3인에 불과하므로, 참가인이 이 사건 노동조합의 조합원을 이 사건 상벌위원회의 근로자 측 위원으로 선임해야 하는 것은 아니다. \n  나) 참가인이 이 사건 노동조합의 감사인 원고에게 이 사건 상벌위원회의 개최 사실을 통지하였던 이상, 이 사건 노동조합은 원고를 위하여 필요한 조치를 취할 수 있었으므로, 이 사건 징계 당시 정보제공 및 의견수렴 절차를 완벽하게 거치지 않았다고 하여 공정대표의무를 위반하였다고 볼 수 없다.  \n  2) 대법원의 판단 \n  원심의 판단은 다음과 같은 이유로 수긍하기 어렵다. \n  가) (1) 「노동조합 및 노동관계조정법」(이하 ‘노동조합법’이라 한다)은 복수 노동조합에 대하여 교섭창구 단일화 제도를 도입하여 단체교섭 절차를 일원화하도록 하고 있다(제29조의2 제1항 본문). 이는 복수 노동조합이 독자적인 단체교섭권을 행사할 경우 발생할 수도 있는 노동조합 간 혹은 노동조합과 사용자 간 반목·갈등, 단체교섭의 효율성 저하 및 비용 증가 등의 문제점을 효과적으로 해결함으로써 효율적이고 안정적인 단체교섭 체계를 구축함에 목적이 있다(대법원 2017. 10. 31. 선고 2016두36956 판결 참조). \n교섭창구 단일화 제도 아래에서 교섭대표노동조합이 되지 못한 노동조합은 독자적으로 단체교섭권을 행사할 수 없으므로, 노동조합법은 교섭대표노동조합이 되지 못한 노동조합을 보호하기 위해 사용자와 교섭대표노동조합에 교섭창구 단일화 절차에 참여한 노동조합(이하 ‘소수노동조합’이라 한다) 또는 그 조합원(이하 소수노동조합과 함께 ‘소수노동조합 등’이라 한다)을 합리적 이유 없이 차별하지 못하도록 공정대표의무를 부과하고 있다(제29조의4 제1항). 공정대표의무는 헌법이 보장하는 단체교섭권의 본질적 내용이 침해되지 않도록 하기 위한 제도적 장치로 기능하고, 교섭대표노동조합과 사용자가 체결한 단체협약의 효력이 교섭창구 단일화 절차에 참여한 다른 노동조합에도 미치는 것을 정당화하는 근거가 된다. 이러한 공정대표의무의 취지와 기능 등에 비추어 보면, 공정대표의무는 단체교섭의 과정이나 그 결과물인 단체협약의 내용뿐만 아니라 단체협약의 이행과정에서도 준수되어야 한다. 또한 교섭대표노동조합이나 사용자가 소수노동조합 등을 차별한 것으로 인정되는 경우, 그와 같은 차별에 합리적인 이유가 있다는 점은 교섭대표노동조합이나 사용자에게 주장·증명책임이 있다(대법원 2018. 8. 30. 선고 2017다218642 판결 참조).\n  (2) 단체협약에서 징계위원회를 노사 동수로 구성하고 근로자 측 위원을 노동조합이 지명·위촉하도록 규정(이하 ‘이 사건 규정’이라 한다)하고 있는 경우, 사용자와 교섭대표노동조합이 ‘소수노동조합 소속 조합원’에 대한 징계 절차에서 소수노동조합의 조합원들을 배제하고 교섭대표노동조합의 조합원들만을 근로자 측 위원으로 선임하였다면, 이는 다른 특별한 사정이 없는 한 징계 절차에서 소수노동조합 등을 합리적 이유 없이 차별한 것으로 공정대표의무에 위배된다고 봄이 타당하다. 그 이유는 다음과 같다. \n  ① 이 사건 규정은 징계에 대한 노동조합과 근로자들의 참여권을 보장함으로써 절차적 공정성을 확보함과 아울러 사용자의 징계권 남용을 견제하기 위한 것이다(대법원 2006. 11. 23. 선고 2006다48069 판결, 대법원 2009. 3. 12. 선고 2008두2088 판결 등 참조).\n  ② 교섭대표노동조합이 독자적으로 단체교섭을 한 결과물인 단체협약에 해당하는 이 사건 규정의 효력이 소수노동조합에 미치는 것을 정당화하기 위해서는, 소수노동조합 소속의 근로자에 대한 징계 절차에서 이 사건 규정에 따른 참여권을 소수노동조합 등에 대하여 실질적으로 보장할 필요가 있다. 사용자와 교섭대표노동조합이 이 사건 규정에 따라 근로자 측 위원을 선임하면서 소수노동조합의 조합원을 배제한 채 오로지 교섭대표노동조합의 조합원만을 선임하는 경우, 소수노동조합은 독자적으로 단체교섭권을 행사하지 못하는 것을 넘어, 소속 조합원의 근로조건에 관하여 중대한 영향을 미치는 징계처분에 관하여 이 사건 규정에서 보장한 참여권조차 실질적으로 행사하지 못하게 되는 결과에 이르게 된다. 노동조합 간에 조합원 확보 등을 위하여 단순히 경쟁하는 차원을 넘어 반목·갈등하는 경우가 많은 현실을 고려할 때, 교섭대표노동조합의 조합원만을 근로자 측 위원으로 선임할 경우, 징계의 절차적 공정성을 확보함과 아울러 사용자의 징계권 남용을 견제하고자 한 이 사건 규정의 취지가 제대로 달성되지 못할 우려도 크다.\n  ③ 그러므로 사용자와 교섭대표노동조합은 소수노동조합 소속의 조합원에 대한 징계 절차에서 이 사건 규정에 따라 근로자 측 위원을 선임할 경우, 다른 특별한 사정이 없는 한 소수노동조합 소속의 조합원을 1인 이상 근로자 측 위원으로 선임함으로써 이 사건 규정에 따른 소수노동조합 등의 참여권을 실질적으로 보장하여야 한다. 이와 달리 소수노동조합 조합원을 배제한 채 오로지 교섭대표노동조합 소속 조합원들만 근로자 측 위원으로 선임하였다면, 이는 징계 절차에서 소수노동조합 등을 합리적 이유 없이 차별한 것으로 공정대표의무에 위배된다고 봄이 타당하다. \n  (3) 나아가 이 사건 규정은 근로자의 근로권과 그 방어에 영향을 줄 수 있는 중요한 절차에 관한 사항에 해당한다(대법원 2008. 5. 29. 선고 2008도2171 판결 참조). 사용자가 공정대표의무를 위반하여 구성된 징계위원회의 의결을 거쳐 징계처분을 하였다면, 그러한 징계권의 행사는 징계사유가 인정되는지 여부와 관계없이 이 사건 규정을 위반하여 해당 근로자의 방어권 행사를 제약하여 이루어진 것으로 절차상 중대한 하자가 있어 무효라고 보아야 한다.  \n  나) 앞서 본 사실관계 및 원심이 적법하게 채택하여 조사한 증거 등에 따라 인정되는 다음 사정을 위와 같은 법리에 비추어 살펴본다.  \n  ① 상벌위원회규정은 근로자의 근로조건인 상벌의 심의, 결정 등에 관하여 정한 것으로 서면으로 작성되어 참가인과 교섭대표노동조합인 소외 1 노동조합의 각 대표자가 그에 날인하였으므로, 이는 단체협약에 해당한다. 이 사건 단체협약 제38조 단서 및 상벌위원회규정 제4조는 상벌위원회를 노사 각 3인 동수로 구성하고 근로자 측 위원은 노동조합의 대표자가 위촉하도록 규정하고 있다.  \n  ② 참가인은 소외 1 노동조합에만 근로자 측 위원을 위촉해 달라고 요청한 후, 소외 1 노동조합의 대표자가 위촉한 그 소속 조합원 3인을 이 사건 상벌위원회의 근로자 측 위원으로 선정하여 이 사건 징계를 의결하였다. 이 사건 노동조합의 조합원은 이 사건 징계 당시 12명으로 그중 일부를 근로자 측 위원으로 선임할 수 없었다거나, 선임되는 것을 거부하였다는 등의 특별한 사정을 발견할 수 없다. 따라서 참가인과 소외 1 노동조합은 이 사건 노동조합 소속의 조합원을 1인이라도 근로자 측 위원으로 참여시켰어야 하고, 소외 1 노동조합의 조합원 수가 이 사건 노동조합보다 13배 이상 많았다는 사정만으로 달리 볼 수 없다. 그럼에도 참가인과 소외 1 노동조합이 이 사건 노동조합의 조합원을 근로자 측 위원으로 전혀 선임하지 않음으로써, 이 사건 노동조합은 이 사건 징계에 대한 참여권을 실질적으로 행사할 수 없었다. 이는 소수노동조합인 이 사건 노동조합과 그 조합원을 합리적 이유 없이 차별한 것으로 공정대표의무에 위배된다.  \n  ③ 결국 참가인은 공정대표의무를 위반하여 이 사건 징계에 관한 절차에서 이 사건 노동조합의 참여권을 보장하지 않은 채 이 사건 징계를 하였으므로, 이 사건 징계는 징계사유가 인정되는지 여부와 관계없이 절차상 중대한 하자가 있어 무효라고 보아야 한다.  \n  다) 그런데도 원심은 그 판시와 같은 이유만으로 이 사건 징계에 절차적 위법이 없다고 판단하였으니, 이러한 원심의 판단에는 공정대표의무 및 징계 절차의 정당성에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 이 부분 상고이유 주장 역시 이유 있다. \n  3. 이 사건 인사발령 부분에 대한 판단\n  원심은 그 판시와 같은 이유로, 이 사건 인사발령은 근로기준법 제23조에 위배되지 않고, 원고와 참가인 사이에 어떠한 사유가 있더라도 더 이상 예비기사로 인사발령을 하지 않기로 하는 합의가 있었다고 볼 수도 없다고 판단하였다. \n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 원심의 이유 설시에 일부 적절하지 않은 부분이 있으나 이 부분 원심의 결론은 정당하고, 거기에 근로기준법 제23조에 관한 법리를 오해한 잘못이 없다. \n  4. 결론\n  나머지 상고이유에 대한 판단을 생략한 채, 원심판결 중 부당승무정지 관련 부분을 파기하고, 이 부분 사건을 다시 심리·판단하도록 원심법원에 환송하며, 나머지 상고를 기각하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 마용주(재판장) 노태악 서경환(주심) 신숙희"
  },

    "판시사항": "토석채취허가를 받기 위해 도로 또는 철도와 토석채취허가 신청지 사이에 인공적 시설이나 일시적 자연물을 설치하여 토석채취허가 신청지를 도로 또는 철도에서 보이지 않게 한 경우, 토석채취허가 신청지가 산지관리법상 연변가시지역에 해당하는지 판단하는 방법",
    "판결요지": "산지관리법 제25조의3 제1항 제2호, 산지관리법 시행령 제32조의3 제2항 제2호의 내용과 체계에 도로 또는 철도를 통행하는 사람들에게 보이는 산지의 경관을 보호함으로써 공공의 이익을 증진하려는 관련 규정의 취지를 보태어 보면, 토석채취허가를 받으려는 목적으로 도로 또는 철도와 토석채취허가 신청지 사이에 인공적 시설이나 수목 등 일시적 자연물을 설치하여 토석채취허가 신청지를 도로 또는 철도에서 보이지 않게 한 경우에는 특별한 사정이 없는 한 인공적 시설이나 일시적 자연물이 없다고 가정한 상태에서 토석채취허가 신청지의 연변가시지역(沿邊可視地域: 도로 또는 철도에서 눈에 보이는 지역) 해당 여부를 판단해야 한다.",
    "참조조문": "산지관리법 제25조의3 제1항 제2호, 산지관리법 시행령 제32조의3 제2항 제2호",
    "참조판례": "",
    "판례내용": "【원고, 상고인】 유한회사 ○○○ (소송대리인 변호사 권순탁 외 1인)\n【피고, 피상고인】 의성군수 (소송대리인 변호사 이양수)\n【원심판결】 대구고법 2025. 1. 24. 선고 2024누11939 판결\n【주    문】\n  상고를 기각한다.  상고비용은 원고가 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심이 인정한 사실관계는 다음과 같다. \n  가. 원고는 2016. 1.경 경북 의성군 △△면□□리(지번 1 생략) 일대에서 운영되던 채석장과 28호 일반국도 사이에 일반국도를 따라 길이 약 80m, 폭 약 20m, 높이 약 5m의 둔덕(이하 ‘이 사건 둔덕’이라 한다)을 설치하고, 이 사건 둔덕 위에 잣나무(이하 ‘이 사건 수목’이라 한다)를 식재하였다.\n  나. 원고는 2022. 7. 7. 피고에게 경북 의성군 △△면□□리(지번 1 생략) 임야 287,504㎡ 중 98,160㎡ 및 같은 리 (지번 2 생략) 임야 99㎡의 합계 98,259㎡(이하 ‘이 사건 신청지’라 한다)에서 10년간 토석을 채취하기 위한 토석채취허가신청을 하였다.\n  다. 피고는 2023. 6. 28. 원고가 설치한 인공적 시설인 이 사건 둔덕 및 수목이 없다고 가정할 경우 이 사건 신청지의 대부분이 28호 일반국도에서 눈에 보이는 연변가시지역(沿邊可視地域)에 해당한다는 등의 사유로 원고의 토석채취허가신청을 불허가하는 처분을 하였다(이하 ‘이 사건 처분’이라 한다).\n  2. 관련 규정과 법리\n산지관리법 제25조의3 제1항은 공공의 이익증진을 위하여 보전이 특히 필요하다고 인정되는 다음 각호의 산지는 토석채취가 제한되는 지역으로 한다고 규정하면서, 제2호에서 ‘「철도산업발전기본법」 제3조 제1호에 따른 철도 등 대통령령으로 정하는 시설의 연변가시지역(沿邊可視地域)을 보호하기 위하여 그 시설의 경계로부터 대통령령으로 정하는 거리 이내의 산지’를 토석채취제한지역으로 정하고 있다. 그 위임에 따른 산지관리법 시행령 제32조의3 제2항 제2호는 토석채취가 제한되는 산지로 ‘일반국도 연변가시지역의 경우에는 1,000m 이내의 산지’를 정하고 있다. \n  연변가시지역이란 도로 또는 철도에서 눈에 보이는 지역을 의미한다. 앞서 살핀 산지관리법령의 내용과 체계에 도로 또는 철도를 통행하는 사람들에게 보이는 산지의 경관을 보호함으로써 공공의 이익을 증진하려는 관련 규정의 취지를 보태어 보면, 토석채취허가를 받으려는 목적으로 도로 또는 철도와 토석채취허가 신청지 사이에 인공적 시설이나 수목 등 일시적 자연물을 설치하여 토석채취허가 신청지를 도로 또는 철도에서 보이지 않게 한 경우에는 특별한 사정이 없는 한 인공적 시설이나 일시적 자연물이 없다고 가정한 상태에서 토석채취허가 신청지의 연변가시지역 해당 여부를 판단하여야 한다.\n  3. 이 사건 처분의 위법 여부에 대한 판단\n  원심은 판시와 같은 이유로, 이 사건 둔덕 및 수목은 28호 일반국도에서 보이는 이 사건 신청 채석장을 차폐하기 위한 목적으로 설치된 인공적 시설이거나 일시적 자연물이므로 이 사건 둔덕 및 수목이 없다고 가정한 상태에서 연변가시지역 해당 여부를 판단하여야 하고, 이 사건 신청지 중 일반국도 경계로부터 1,000m 이내 연변가시지역을 제외한 나머지 부분만으로는 토석채취허가 기준을 충족하지 못한다는 이유로 이 사건 처분이 적법하다고 판단하였다.\n  앞서 본 법리와 기록에 비추어 살펴보면, 원심판단은 정당하고, 거기에 상고이유 주장과 같은 산지관리법 해석에 관한 법리오해 등의 잘못이 없다. \n  4. 결론\n  상고를 기각하고 상고비용은 패소자가 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 이흥구(재판장) 오석준 노경필(주심) 이숙연"
  }
]
</script>
<script>
  (function() {
    const cases = JSON.parse(document.getElementById('cases-data').textContent);
    document.getElementById('notice-count').innerHTML = `<strong>총 ${cases.length}건</strong> · 2025년 하반기 대법원 행정 판례부터 수집 중`;
    const list = document.getElementById('list');
    cases.forEach((c, i) => {
      const div = document.createElement('div');
      div.className = 'case';
      const date = c.선고일자 ? `${c.선고일자.slice(0,4)}.${c.선고일자.slice(4,6)}.${c.선고일자.slice(6,8)}` : '';
      div.innerHTML = `
        <div class="doc-card" data-idx="${i}">
          <span class="doc-date">${date}</span>
          <span class="doc-title">${c.사건명}</span>
          <span class="doc-tag">${c.사건번호}</span>
        </div>
        <div class="case-body" id="body-${i}">
          ${field('판시사항', c.판시사항)}
          ${field('판결요지', c.판결요지)}
          ${field('참조조문', c.참조조문)}
          ${field('참조판례', c.참조판례)}
          ${field('전문', c.판례내용, true)}
        </div>
      `;
      list.appendChild(div);
    });

    list.addEventListener('click', (e) => {
      const header = e.target.closest('.doc-card');
      if (!header) return;
      const body = document.getElementById(`body-${header.dataset.idx}`);
      body.classList.toggle('open');
    });
  })();

  function field(label, text, isFullText) {
    if (!text) return '';
    return `
      <div class="field">
        <h4>${label}</h4>
        <p class="${isFullText ? 'full-text' : 'box'}">${escapeHtml(text)}</p>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
