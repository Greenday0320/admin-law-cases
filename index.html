    "참조판례": "[1] 대법원 2000. 11. 14. 선고 99두5870 판결(공2001상, 56), 대법원 2013. 1. 16. 선고 2011두30687 판결(공2013상, 350), 대법원 2016. 10. 27. 선고 2016두41811 판결(공 2016하, 1824)",
    "판례내용": "【원고, 피상고인】                ○○○대학 산학협력단 (소송대리인 법무법인 위너스 담당변호사 손교명 외 2인)\n【피고, 상고인】 서울지방고용노동청 서울서부지청장\n【원심판결】  서울고법 2025. 10. 17. 선고 2024누60192 판결         \n【주    문】\n  상고를 기각한다. 상고비용은 피고가 부담한다. \n\n【이    유】  상고이유를 판단한다.\n  1. 절차적 하자 관련 상고이유에 관하여 \n  가. 관련 규정 및 법리 \n  1)                행정절차법 제21조 제1항, 제4항, 제22조에 따르면, 행정청이 당사자에게 의무를 과하거나 권익을 제한하는 처분을 하는 경우에는 미리 ‘처분하고자 하는 원인이 되는 사실과 처분의 내용 및 법적 근거’, ‘이에 대하여 의견을 제출할 수 있다는 뜻과 의견을 제출하지 아니하는 경우의 처리방법’ 등의 사항을 당사자 등에게 통지하여야 하고, 다른 법령 등에서 필수적으로 청문을 실시하거나 공청회를 개최하도록 규정하고 있지 아니한 경우에도 당사자 등에게 의견제출 기회를 주어야 하되, ‘해당 처분의 성질상 의견청취가 현저히 곤란하거나 명백히 불필요하다고 인정될 만한 상당한 이유가 있는 경우’ 등에 한하여 처분의 사전통지나 의견청취를 아니할 수 있다. 따라서 행정청이 침해적 행정처분을 하면서 당사자에게 위와 같은 사전통지를 하지 아니하거나 의견제출 기회를 주지 아니하였다면, 사전통지를 하지 않거나 의견제출 기회를 주지 아니하여도 되는 예외적인 경우에 해당하지 아니하는 한, 그 처분은 위법하여 취소를 면할 수 없다(대법원 2016. 10. 27. 선고 2016두41811 판결 등 참조). \n  ‘의견청취가 현저히 곤란하거나 명백히 불필요하다고 인정될 만한 상당한 이유가 있는지 여부’는 해당 행정처분의 성질에 비추어 판단하여야 하는 것이고(대법원 2001. 4. 13. 선고 2000두3337 판결 참조), 처분상대방이 이미 행정청에 위반사실을 시인하였다거나 처분의 사전통지 이전에 의견을 진술할 기회가 있었다는 사정을 고려하여 판단할 것은 아니다(대법원 2000. 11. 14. 선고 99두5870 판결, 대법원 2013. 1. 16. 선고 2011두30687 판결 참조).\n  2) 행정절차법은 국민의 행정 참여를 도모함으로써 행정의 공정성ㆍ투명성 및 신뢰성을 확보하고 국민의 권익을 보호함을 목적으로 하고(제1조), 행정절차법이 당사자에게 의무를 부과하거나 권익을 제한하는 처분을 하는 경우에 사전통지 및 의견청취를 하도록 규정한 것은 불이익처분 상대방의 방어권 행사를 실질적으로 보장하기 위함이다(대법원 2020. 4. 29. 선고 2017두31064 판결 참조).\n  3) 행정절차법 제21조 제4항은 처분의 사전통지를 하지 아니할 수 있는 예외적인 사유로 ‘공공의 안전 또는 복리를 위하여 긴급히 처분을 할 필요가 있는 경우’(제1호), ‘법령 등에서 요구된 자격이 없거나 없어지게 되면 반드시 일정한 처분을 하여야 하는 경우에 그 자격이 없거나 없어지게 된 사실이 법원의 재판 등에 의하여 객관적으로 증명된 경우’(제2호), ‘해당 처분의 성질상 의견청취가 현저히 곤란하거나 명백히 불필요하다고 인정될 만한 상당한 이유가 있는 경우’(제3호)를 규정하고 있다. 행정절차법 제21조 제4항 및 제5항의 위임에 따라 행정절차법 시행령 제13조에서도 사전통지를 하지 아니할 수 있는 구체적인 사항을 규정하고 있다.\n  4) 행정절차법 제22조 제4항은 \"제1항부터 제3항까지의 규정에도 불구하고 제21조 제4항 각 호의 어느 하나에 해당하는 경우와 당사자가 의견진술의 기회를 포기한다는 뜻을 명백히 표시한 경우에는 의견청취를 하지 아니할 수 있다.\"라고 규정하고, 행정절차법 시행령 제14조는 \"당사자는 법 제22조 제4항의 규정에 의하여 의견진술의 기회를 포기한 때에는 의견진술포기서 또는 이에 준하는 문서를 행정청에 제출하여야 한다.\"라고 규정하고 있으나, 행정절차법은 당사자가 사전통지를 받을 기회를 포기한다는 뜻을 명백히 표시한 경우에 대하여는 별도의 규정을 두고 있지 않다. \n  나. 판단 \n  1) 앞서 살핀 관련 규정의 문언과 체계, 행정절차법의 목적과 같은 법이 사전통지 및 의견청취를 하도록 규정한 취지, 행정절차법령이 사전통지를 받을 기회의 포기에 관하여 별도로 규정하지 않은 반면 의견진술 기회의 포기와 관련하여 그 의사의 명백성을 요구하면서 문서에 의하도록 정하고 있는 점 등을 종합하여 보면, 처분의 사전통지를 생략할 수 있는 예외적인 경우는 엄격한 기준에 따라 인정하여야 한다.\n  한편 행정절차법 제21조 제4항 제3호가 정하고 있는 ‘의견청취가 현저히 곤란하거나 명백히 불필요하다고 인정될 만한 상당한 이유가 있는 경우’에 해당하는지는 그 행정처분의 성질에 비추어 판단하여야 하는데, 사전통지를 받을 기회를 포기하는 의사를 표시하였는지 아닌지는 해당 행정처분의 성질과 관련이 없고 이러한 사정이 행정절차법 제21조 제4항이 정하고 있는 다른 예외사유에 해당한다고 볼 수도 없다. \n  그렇다면 당사자가 사전통지를 받을 기회를 포기한다는 의사를 표시하였다고 하더라도 특별한 사정이 없는 한 행정절차법에서 정한 사전통지를 하지 않을 수 있는 예외적인 경우에 해당한다고 볼 수 없고, 따라서 사전통지를 하지 않은 채 이루어진 처분은 위법하여 취소함이 원칙이다. \n  2) 원심은 피고가 원고에 대하여 별도의 사전통지나 의견진술 기회 부여 절차를 거치지 아니한 채 당사자에게 의무를 과하거나 권익을 제한하는 이 사건 각 처분을 한 사실을 인정한 다음, 원고 대표자가 전화로 처분의 사전통지 절차를 받지 않겠다는 의사를 표시하였다고 하더라도 이러한 사정이 법령이 정한 당사자에게 처분의 사전통지를 하지 아니하거나 의견제출 기회를 주지 아니하여도 되는 예외적인 경우에 해당한다고 볼 수 없는바, 피고가 이 사건 각 처분을 하면서 원고에게 행정절차법에 따른 적법한 사전통지를 하거나 의견제출 기회를 부여하였다고 볼 수 없으므로 이 사건 각 처분은 위법하다고 판단하였다.\n  원심의 판단은 앞서 본 법리에 따른 것으로서 정당하고, 상고이유 주장과 같이 사전통지 제도의 목적과 포기의 효력 등에 관한 법리를 오해하는 등의 잘못이 없다.\n  2. 실체적 하자 관련 상고이유에 관하여\n  원심은 위와 같이 원고의 절차적 하자 주장을 받아들여 이 사건 각 처분을 취소하였고 처분사유에 관한 실체적 판단을 하지 않았다. 이 사건 각 처분에 관하여 실체적으로 정당한 사유가 있다는 상고이유는 더 나아가 판단할 필요 없이 받아들일 수 없다.\n  3. 결론\n  상고를 기각하고 상고비용은 패소자가 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 신숙희(재판장) 노태악(주심) 서경환 마용주"
  },

    "참조판례": "[1] 대법원 2016. 7. 29. 선고 2014두3532 판결, 대법원 2017. 6. 19. 선고 2016두30866 판결, 대법원 2018. 12. 27. 선고 2018두49796 판결 / [2] 대법원 2017. 3. 15. 선고 2016두55490 판결(공2017상, 778), 대법원 2019. 12. 24. 선고 2019두45579 판결(공2020상, 359)",
    "판례내용": "【원고, 피상고인】                원고 1 외 14인 (소송대리인 법무법인 무영 담당변호사 강경구 외 2인)\n【피고, 상고인】 의령군수 (소송대리인 법무법인 금정 담당변호사 이혜영)\n【원심판결】  부산고법 2025. 5. 16. 선고 (창원)2024누10440 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 부산고등법원에 환송한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 서면의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결의 이유와 기록에 의하면, 다음과 같은 사실을 알 수 있다.\n  가. 원고들은 경남 의령군 ○○면 △△리 (지번 1 생략) 일원에서 태양광발전사업을 시행하고자 피고에게 발전사업 허가신청을 하였고, 2021. 10. 13. 피고로부터 원동력의 종류를 태양광으로, 설비용량을 99.45kw로 하는 내용의 발전사업 허가증을 받았다. \n  나. 원고들은 2022. 3. 7. 피고에게 경남 의령군 ○○면 △△리 (지번 1 생략) 중 10,511㎡(이하 ‘이 사건 태양광발전시설 부지’라 한다)에 태양광발전시설을 설립하고, 경남 의령군 ○○면 △△리 (지번 1 생략) 외 11필지 중 11,326㎡(이하 ‘이 사건 진입도로 부지’라 하고, 이 사건 태양광발전시설 부지를 모두 포함하여 ‘이 사건 신청지’라 한다)에 진입도로를 개설하기 위하여 토질형질변경의 개발행위허가신청(이하 ‘이 사건 신청’이라 한다)을 하였다. \n  다. 원고들은 2022. 4.경 소규모 환경영향평가서를 작성하여 피고에게 제출하였고, 피고는 2022. 5. 6. 낙동강유역환경청장에게 소규모 환경영향평가 협의를 요청하였다. 낙동강유역환경청은 2022. 6. 27. 원고들에게 위 소규모 환경영향평가서에 관하여 입지환경, 법정보호종, 수목훼손 부분에 대한 보완요청을 하였고, 이에 원고들은 2022. 8.경 이 사건 신청지에 원형녹지를 설정하고, 인위적인 비탈면 발생에 따른 보강토 옹벽 설치 계획을 제외하되 훼손 수목 중 15주를 이식하기로 하는 등 낙동강유역환경청의 보완요청을 반영한 소규모 환경영향평가서를 다시 제출하였다. 낙동강유역환경청은 2022. 9. 5. 피고에게 소규모 환경영향평가 협의가 완료되었음을 통보하였다. \n  라. 원고들은 2022. 8.경 피고에게 재해영향평가심의위원회의 의견을 반영하여 재해영향평가서를 제출하였고, 피고는 2022. 8. 24. 원고들에게 재해영향평가 협의가 완료되었음을 통보하였다. \n  마. 의령군계획위원회는 2022. 10. 24. 이 사건 신청에 대하여 심의한 결과 이를 부결하였고, 피고는 2022. 11. 1. 원고들에게 다음과 같은 이유로 이 사건 신청을 불허가하는 처분(이하 ‘이 사건 처분’이라 한다)을 하였다.\n  1) 이 사건 신청 계획은 사업부지 대비 진입도로의 규모가 크고, 개발행위로 인해 생태ㆍ환경ㆍ경관 훼손이 심각할 것으로 판단되며, 집중호우 및 동결 시 도로부의 유실ㆍ관리가 어려울 것으로 예상되고, 토사유출 및 붕괴 등 재해발생이 우려된다. \n  2)「국토의 계획 및 이용에 관한 법률」(이하 ‘국토계획법’이라 한다) 제58조 개발행위허가 기준에 부적합하고, 의령군계획위원회 심의 결과 부결되었다. \n  바. 이 사건 신청지는 표고분석결과 약 20m 내지 190m 범위의 보전관리지역 및 농림지역이다. 그 하부에는 지방도 1040호선이 설치되어 있고, 농가가 형성되어 있으며, 인근에는 남강이 흐르고 있다. 한편 이 사건 신청지에서 400m 가량 떨어져 있는 경남 의령군 ○○면 △△리 (지번 2 생략) 일원에는 기존 태양광발전시설이 설치되어 있다. \n  사. 이 사건 신청지는 생태ㆍ자연도 2등급이면서 식생보전등급 Ⅲ등급 이상인 지역으로 소나무 군락이 밀도 높게 분포한 지역이다. 원고들의 당초 계획에 따르면 태양광발전시설 및 진입도로를 설치하기 위해서 훼손되는 수목량은 약 3,570주이고, 훼손면적은 소나무군락 20,930㎡, 소나무-굴참나무 군락 1,627㎡, 굴참나무군락 350㎡이며, 원고들이 소규모 환경영향평가 과정에서 보완한 계획에 따르더라도 훼손되는 수목량은 약 2,896주에 이른다. \n  아. 이 사건 신청지의 평균 경사도는 약 7.4도이나, 5도 내지 18도의 완경사지 및 경사지가 상당하고, 산사태위험등급구분 2등급에 해당하는 부지도 산재되어 있으며, 배수시설이 설치되어 있지 않다. 이 사건 신청지에 대한 재해위험도 평가점수는 40점으로 재해위험성이 없으나 주기적인 관리가 필요한 B등급(21점～40점) 범위 내에서 가장 높은 점수에 해당하고, 재해위험성이 있어 지속적인 점검과 필요시 정비계획 수립이 필요한 C등급(41점～60점)에 가깝다. \n  자. 이 사건 태양광발전시설 부지가 산 정상부에 위치하여 그 진입도로는 산 능선을 가로질러 개설될 수밖에 없는데, 이는 산 능선을 따라서 대략 폭 6.5m, 길이 5km 정도로 연결되고, 이에 따라 절토되는 토사량이 8,030.6㎥에 달한다. \n  2. 원심의 판단\n  원심은 다음과 같은 이유를 들어 이 사건 처분에 재량권을 일탈ㆍ남용한 위법이 있다고 판단하였다.\n  가. 이 사건 신청지는 자연환경보전법에 따른 1등급 권역에 해당하지 않고, 식생보전등급과 관련하여서도 보존가치가 높은 ⅠㆍⅡ 등급의 수목은 확인되지 않았으며, 인근에 자연공원 또는 생태ㆍ경관 보전지역으로 지정된 지역이 없고, 환경부 예규인 「개발사업 등에 관한 자연경관심의 지침」 에 따른 ‘자연경관영향 심의대상’에도 해당하지 않는다. 원고들은 소규모 환경영향평가 협의 과정에서 낙동강유역환경청의 요구에 따라 사업계획을 보완하는 등 소규모 환경영향평가 협의를 완료하였다. \n  나. 피고는 원고들의 이 사건 신청 약 8개월 이전에 동일한 구역에 대해 태양광발전시설의 진출입로 개설을 위한 사도개설허가 및 도로점용(연결)허가를 하였을 뿐만 아니라, 진출입로의 규모와 예상되는 증가 통행량에 비추어 보더라도 이 사건 신청으로 인해 진입도로가 개설된다고 하여 집중호우 및 동결 시에 도로의 유실ㆍ관리가 어려워진다고 보기는 어렵다. 이 사건 신청지의 대부분은 ‘산사태 위험도 1, 2등급’에 해당하지 않고, 원고들은 피고 소속 재해영향평가 심의위원회의 지적사항에 따라 재해저감 대책을 통해 이를 보완하여 최종적으로 재해영향평가에서 재해위험성이 없다는 취지의 검토의견을 받았다. \n  다. 피고가 이 사건 처분의 근거로 삼은 의령군계획위원회 심의 결과에는 구체적인 근거 없이 추상적으로 의견이 제시되고, 재해영향평가 과정에서 이미 협의가 완료된 사항에 대하여 지적하거나 잘못된 사실을 전제로 지적한 사항도 상당수 존재한다. \n  3. 대법원의 판단\n  가.                국토계획법 제56조는 개발행위의 허가대상을, 제57조는 개발행위허가의 절차를 규정하고, 제58조는 제1항에서 개발행위허가의 기준을 규정하면서 제3항에서 구체적인 허가기준의 설정을 대통령령에 위임하고 있다. 이러한 개발행위허가는 그 허가기준 및 금지요건 등이 불확정개념으로 규정된 부분이 많아 그 요건ㆍ기준에 부합하는지의 판단에 관하여 행정청에 재량권이 부여되어 있으므로, 그 요건에 해당하는지는 행정청의 재량판단 영역에 속한다. 그러므로 그에 대한 사법심사는 행정청의 공익판단에 관한 재량의 여지를 감안하여 원칙적으로 재량권의 일탈이나 남용이 있는지만을 대상으로 하고, 사실오인과 비례ㆍ평등의 원칙 위반 등이 그 판단 기준이 된다(대법원 2017. 6. 19. 선고 2016두30866 판결, 대법원 2018. 12. 27. 선고 2018두49796 판결 등 참조). 그리고 자유재량에 의한 행정처분이 그 재량권의 한계를 벗어난 것이어서 위법하다는 점은 그 행정처분의 효력을 다투는 자가 이를 주장ㆍ증명하여야 하고 처분청이 그 재량권의 행사가 정당한 것이었다는 점까지 주장ㆍ증명할 필요는 없다(대법원 2016. 7. 29. 선고 2014두3532 판결 등 참조). \n  특히 환경의 훼손이나 오염을 발생시킬 우려가 있는 개발행위에 대한 행정청의 허가와 관련하여 재량권의 일탈ㆍ남용 여부를 심사할 때에는 해당 지역 주민들의 토지이용실태와 생활환경 등 구체적 지역 상황과 상반되는 이익을 가진 이해관계자들 사이의 권익 균형 및 환경권의 보호에 관한 각종 규정의 입법 취지 등을 종합하여 신중하게 판단하여야 한다. ‘환경오염 발생 우려’와 같이 장래에 발생할 불확실한 상황과 파급효과에 대한 예측이 필요한 요건에 관한 행정청의 재량적 판단은 그 내용이 현저히 합리성을 결여하였다거나 상반되는 이익이나 가치를 대비해 볼 때 형평이나 비례의 원칙에 뚜렷하게 배치되는 등의 사정이 없는 한 폭넓게 존중하여야 한다(대법원 2017. 3. 15. 선고 2016두55490 판결, 대법원 2019. 12. 24. 선고 2019두45579 판결 등 참조).\n  나. 이러한 법리와 기록에 비추어 살펴보면, 원심의 판단은 다음과 같은 이유로 수긍하기 어렵다.\n  1) 이 사건 신청지 최고 표고점은 약 190m로서, 그 하부에는 지방도 1040호선이 설치되어 있고, 농가가 형성되어 있으며, 인근에는 남강이 흐르고 있어 평소 사람들의 통행이 빈번한 지역이다. 이러한 현황에서 표고점이 높은 곳에 설치되는 이 사건 태양광발전시설의 경우 차폐림이나 완충녹지의 존재만으로 주변경관이나 미관이 훼손되지 않는다고 단정하기 어렵다.\n  2) 이 사건 신청지는 자연환경보전법에 따른 생태ㆍ자연도 2등급 권역이면서 식생보전등급 Ⅲ등급 이상인 지역으로서 자연환경 훼손의 최소화를 고려할 필요가 있는 곳이고, 2018. 8. 1.부터 시행된 「육상태양광발전사업 환경성평가 협의지침」 에 따르더라도 태양광발전시설의 입지를 회피하여야 할 지역에 해당한다. \n  3) 이 사건 진입도로 개설을 위해서는 대규모의 절토 및 성토작업이 수반되고 이에 따라 인위적인 비탈면의 발생 등 지형적인 변화가 불가피하여 사면 붕괴나 집중호우로 인한 피해발생의 우려가 기존의 상태에 비해 유의미하게 높아진다고 볼 수 있다. 이 사건 신청지는 산지로서, 그 하부에는 도로와 농가 등이 존재하고 있으므로 집중호우 등으로 인하여 피해가 발생할 경우 그 피해의 정도가 작다고 단정하기도 어렵다. 한편 원고들은 당초 안정성 강화를 위해 보강토 옹벽 설치를 계획하였으나, 소규모 환경영향평가에서 경관 부조화를 이유로 보완요구를 받자 보강토 옹벽 설치 계획을 제외하되 훼손 수목 중 15주를 이식하는 것으로 계획을 변경하였음에도, 이에 따른 추가적인 재해방지 방안을 강구하지 아니하였다. \n  4) 의령군계획위원회는 소규모 환경영향평가나 재해영향평가의 결과에 구속되지 않으므로, 설령 군계획위원회가 심의를 거쳐 그와 달리 판단하였다고 하더라도 이를 두고 위법하다고 볼 수 없다. 나아가 이 사건 신청에 대한 소규모 환경영향평가 및 재해영향평가 협의가 완료되었다거나 군계획위원회 심의 결과 부결되었다는 사정 등은 모두 피고가 이 사건 신청을 허가할지를 판단할 때 고려할 여러 사정 중의 하나에 불과하다. \n  5) 이 사건 신청지로부터 400m 가량 떨어진 곳에 피고가 기존에 허가한 태양광발전시설이 설치되어 있기는 하지만, 이는 산지 하부 중 기존 도로와 가까운 위치에 있어 그 현황이나 입지적 특성이 같지 않다. 또한 각 태양광발전시설의 규모나 개발사업의 규모가 다르고, 특히 이 사건 신청은 기존의 태양광발전시설 부지보다 진입도로 부지가 더 넓고 대규모의 절토공사를 예정하고 있다. 따라서 이 사건 처분은 기존의 태양광발전시설의 경우와 달리 볼 합리적 이유가 있으므로, 피고가 인근 지역에 기존의 태양광발전시설의 개발행위를 허가하였다는 사정만으로, 이 사건 처분이 평등원칙에 반한다고 볼 수 없다. 피고가 제시한 이 사건 처분사유는 환경피해 등을 예방하기 위한 공익상의 필요에 관한 것으로서, 이 사건 처분으로 인한 원고들의 불이익이 주민의 환경피해 등을 예방하기 위한 공익상의 필요보다 커 비례의 원칙에 반한다고 단정하기도 어렵다. \n  6) 원고들은 우려되는 피해들에 대하여 그 주장내용과 같이 이를 방지하거나 저감하는 대책을 제시하기는 하였으나, 그러한 피해방지대책들이 과연 예상되는 환경상의 피해를 제대로 방지할 수 있을지 불확실할 뿐만 아니라, 계획대로 실행되지 않을 경우에는 환경상의 피해를 피할 수 없게 되며 한 번 훼손된 환경은 쉽게 회복되지 않는다는 점도 고려되어야 한다. \n  7) 사정이 이와 같다면, 원심으로서는 이 사건 신청을 받아들일 경우 생태ㆍ환경ㆍ경관 훼손, 재해발생 등의 우려가 있다는 피고의 재량적 판단이 현저히 합리성을 결여하였거나 형평이나 비례의 원칙에 뚜렷하게 배치되는 등의 사정이 있는지에 관하여 추가 심리하거나 원고의 증명책임으로 돌려 원고의 청구를 배척하여야 한다. 그런데도 그 판시와 같은 사정만으로 이 사건 처분에 재량권을 일탈ㆍ남용한 위법이 있다고 판단한 원심판단에는 재량권 일탈ㆍ남용에 관한 법리 등을 오해하고 필요한 심리를 다하지 아니하여 판결에 영향을 미친 잘못이 있다. \n  4. 결론\n  원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 서경환(재판장) 노태악 신숙희 마용주(주심)"
  },

    "판결유형": "판결",
    "판시사항": "[1] 근로기준법상의 근로자에 해당하는지 판단하는 기준 및 이때 종속적인 관계가 있는지 판단하는 방법 / 위 법리가 협동조합법에 따라 설립된 협동조합 조합원의 경우에도 마찬가지로 적용되는지 여부(적극) / 택시운송사업자인 협동조합의 조합원으로서 택시운수종사자의 지위에 있는 사람이 근로기준법상 근로자인지를 판단하는 경우, 고려할 사항\n\n [2] 영업양도가 이루어진 경우, 해당 근로자들의 근로관계가 양수하는 기업에 포괄적으로 승계되는지 여부(원칙적 적극) 및 영업양도가 이루어졌는지 결정하는 기준 / 영업양도 당사자 사이에 근로관계의 일부를 승계의 대상에서 제외하기로 하는 특약에 따라 영업양도 자체만을 사유로 삼아 근로자를 해고하는 경우, 근로기준법 제23조 제1항에서 정한 정당한 이유가 있는 경우에 해당하는지 여부(소극) / 협동조합이 인적ㆍ물적 조직을 동일성은 유지하면서 다른 협동조합에 일체로서 이전하는 경우에도 위와 같은 근로관계 승계에 관한 법리가 적용될 수 있는지 여부(적극)",
    "판결요지": "[1] 근로기준법상의 근로자에 해당하는지는 계약의 형식이 고용계약인지 도급계약인지보다 그 실질에서 근로자가 사업 또는 사업장에 임금을 목적으로 종속적인 관계에서 사용자에게 근로를 제공했는지에 따라 판단해야 한다. 여기에서 종속적인 관계가 있는지는 업무 내용을 사용자가 정하고 취업규칙 또는 복무(인사)규정 등의 적용을 받으며 업무 수행 과정에서 사용자가 상당한 지휘ㆍ감독을 하는지, 사용자가 근무시간과 근무장소를 지정하고 근로자가 이에 구속을 받는지, 노무제공자가 스스로 비품ㆍ원자재나 작업도구 등을 소유하거나 제3자를 고용하여 업무를 대행케 하는 등 독립하여 자신의 계산으로 사업을 영위할 수 있는지, 노무 제공을 통한 이윤의 창출과 손실의 초래 등 위험을 스스로 안고 있는지와 보수의 성격이 근로 자체의 대상적 성격인지, 기본급이나 고정급이 정해졌는지 및 근로소득세의 원천징수 여부 등 보수에 관한 사항, 근로제공관계의 계속성과 사용자에 대한 전속성의 유무와 정도, 사회보장제도에 관한 법령에서 근로자로서 지위를 인정받는지 등의 경제적ㆍ사회적 여러 조건을 종합하여 판단해야 한다. 전체적으로 보아 임금을 목적으로 종속적 관계에서 사용자에게 근로를 제공했다고 인정되는 이상, 근로자에 대한 위 여러 징표 중 일부 사정이 결여되었거나 다른 지위를 아울러 가지고 있다고 해도 그러한 사유만으로 근로기준법상 근로자가 아니라고 할 수는 없다. \n  이와 같은 법리는 협동조합 기본법(이하 ‘협동조합법’이라 한다)에 따라 설립된 협동조합의 조합원의 경우에도 마찬가지로 적용된다. 이유는 다음과 같다.\n  ① 협동조합법에 따른 협동조합이란 재화 또는 용역의 구매ㆍ생산ㆍ판매ㆍ제공 등을 협동으로 영위함으로써 조합원의 권익을 향상하고 지역 사회에 공헌하고자 하는 사업조직으로(제2조 제1호), 협동조합의 설립 목적에 동의하고 그에 따른 의무를 다하고자 하는 조합원들로 구성된다(제20조). 협동조합의 조합원은 협동조합법과 정관 등에 따라 의결권ㆍ선거권과 사업의 이용, 잉여금의 배당 등에 관한 권리를 행사할 수 있다. 그런데 이는 조합원과 협동조합 사이의 조합관계에 관련된 것일 뿐이므로, 그러한 조합관계가 존재한다는 사정만으로 근로관계의 존재 가능성이 당연히 부정되는 것은 아니다.  \n  ② 오히려 협동조합은 사업 수행 과정에서 조합원과 조합관계 외에도 다양한 법률관계를 맺을 수 있고 여기에는 근로관계도 포함된다. 근로기준법상 근로자에 해당하는지는 근로제공관계의 실질에 따라 판단되어야 하므로, 조합원이 협동조합에 임금을 목적으로 종속적인 관계에서 근로를 제공했다면 조합원의 지위와 별도로 근로자의 지위도 인정될 수 있다. 이는 출자를 통해 회사의 지분을 소유하고 있는 주주나, 회사로부터 일정한 사무처리를 위임받은 임원이라 하더라도, 그러한 다른 지위를 아울러 가지고 있다는 사유만으로 근로자성이 부정되지 않는 것과 본질적으로 다르지 않다.\n  택시운송사업자인 협동조합의 조합원으로서 택시운수종사자의 지위에 있는 사람이 근로기준법상 근로자인지를 판단하는 경우에는, 근로자성 판단 요소들을 적용함에 있어 협동조합이 아닌 택시운송사업자 소속의 근로자성이 인정되는 일반적인 택시운수종사자와 비교할 때 업무 내용, 보수의 책정 및 지급 방식, 노무관리 등에서 어떠한 차이가 있는지를 살펴봄과 아울러, 사업장 밖에서 근로함에 따라 업무수행과정에서 실시간으로 지휘ㆍ감독이 어려운 택시운전업무의 특성 등도 고려해야 한다. \n\n [2] 영업의 양도라 함은 일정한 영업목적에 의하여 조직화된 업체, 즉 인적ㆍ물적 조직을 동일성은 유지하면서 일체로서 이전하는 것으로서, 이러한 영업양도가 이루어진 경우에는 원칙적으로 해당 근로자들의 근로관계가 양수하는 기업에 포괄적으로 승계된다. 영업양도가 이루어졌는지는 단지 어떠한 영업재산이 어느 정도로 이전되어 있는가에 의하여 결정되어야 하는 것이 아니고 거기에 종래의 영업조직이 유지되어 그 조직이 전부 또는 중요한 일부로서 기능할 수 있는가에 의하여 결정되어야 한다. 따라서 영업재산의 일부를 유보한 채 영업시설을 양도했어도 양도한 부분만으로도 종래의 조직이 유지되어 있다고 사회관념상 인정되면 그것을 영업의 양도라 보아야 하고, 반면에 영업재산의 전부를 양도했어도 그 조직을 해체하여 양도했다면 영업의 양도로 볼 수 없다.\n  영업이 양도되면 반대의 특약이 없는 한 양도인과 근로자 사이의 근로관계는 원칙적으로 양수인에게 포괄적으로 승계되고, 영업양도 당사자 사이에 근로관계의 일부를 승계의 대상에서 제외하기로 하는 특약이 있는 경우에는 그에 따라 근로관계의 승계가 이루어지지 않을 수 있다. 그러나 그러한 특약은 실질적으로 해고나 다름이 없으므로 근로기준법 제23조 제1항에서 정한 정당한 이유가 있어야 유효하며, 영업양도 그 자체만을 사유로 삼아 근로자를 해고하는 것은 정당한 이유가 있는 경우에 해당한다고 볼 수 없다. \n  협동조합 기본법상 협동조합은 설립 목적인 사업의 수행을 위한 활동을 협동으로 영위하는 조직이다(제2조 제1호, 제45조 제1항 참조). 따라서 협동조합이 인적ㆍ물적 조직을 동일성은 유지하면서 다른 협동조합에 일체로서 이전하는 경우에도 위와 같은 근로관계 승계에 관한 법리가 적용될 수 있다.",
    "참조조문": "[1] 근로기준법 제2조 제1항 제1호, 협동조합 기본법 제2조 제1호, 제20조 / [2] 근로기준법 제2조 제1항 제1호, 제23조 제1항, 협동조합 기본법 제2조 제1호, 제45조 제1항",
    "참조판례": "[1] 대법원 2006. 12. 7. 선고 2004다29736 판결(공2007상, 104), 대법원 2009. 2. 12. 선고 2008도7794 판결, 대법원 2009. 4. 23. 선고 2008도11087 판결, 대법원 2013. 6. 27. 선고 2010다57459 판결 / [2] 대법원 2002. 3. 29. 선고 2000두8455 판결(공2002상, 1019)",
    "판례내용": "【원고, 피상고인】                ○○○협동조합 (소송대리인 변호사 강신무)\n【피고, 상고인】 중앙노동위원회위원장\n【피고보조참가인, 상고인】                피고보조참가인 1 외 1인 (소송대리인 대전종합법무법인 담당변호사 안병진 외 2인)\n【원심판결】  대전고법 2023. 9. 7. 선고 2022누13655 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 대전고등법원에 환송한다. \n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 준비서면의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 따르면, 다음 사실을 알 수 있다. \n  가. △△△협동조합(이하 ‘소외 조합’이라 한다)은 2017. 1. 10. 협동조합 기본법(이하 ‘협동조합법’이라 한다)에 따라 여객자동차 운수사업 등을 목적으로 설립된 협동조합으로 택시운송사업을 하였다.\n  나. 피고 보조참가인(이하 ‘참가인’이라 한다) 1은 2018. 6. 15., 참가인 2는 2018. 10. 1. 소외 조합에 각 출자금으로 25,100,000원, 25,300,000원을 납입하고 정조합원으로 가입하여 택시운전업무에 종사하였다. \n  다. 참가인들은 가입 당시 소외 조합과 ‘기준금규정확인서’라는 표제로 운행일, 운행형태, 기준금, 영업시간 등에 관한 사용계약(이하 ‘이 사건 사용계약’이라 한다)을 체결하였고, 각종 준수사항 및 확인사항 등이 기재된 기준금규정자술서(이하 ‘이 사건 규정’이라 한다)에 서명하여 소외 조합에 제출하였다.\n  라. 소외 조합은 2020. 12. 28. 임시총회를 개최하여, 정조합원 25명 중 참가인들을 포함한 24명이 출석한 가운데 출석자 전원의 찬성으로 소외 조합의 사업을 원고에게 양도하고 소외 조합은 해산하기로 의결하였다.\n  마. 소외 조합은 2020. 12. 30. 원고 창립준비위원회와 양도대금을 14억 원으로 하여 원고에게 사업권ㆍ영업권 등 자산 전부 및 출자금을 포함한 부채 중 약 21억 원을 양도하기로 하는 자산양수도계약(이하 ‘이 사건 양수도계약’이라 한다)을 체결하였다. 이후 원고는 2021. 1. 29. 협동조합 설립 신고를 하였다.\n  바. 원고는 2021. 2. 23. 소외 조합과 매매대금 정산서를 작성하면서 출자금 반환 채무 중 조합원 40명에 대한 900,140,000원만을 인수하기로 하였는데, 참가인들에 대한 부분은 이에 포함되지 않았다.\n  사. 원고는 2021. 2. 27. 참가인들에게 택시 운전을 중지하라고 구두로 통보(이하 ‘이 사건 통보’라 한다)하였고, 참가인들은 다음 날 원고에게 차량 열쇠를 반납하였다. \n  2. 참가인들의 근로기준법상 근로자성에 관하여(제1 상고이유)\n  가. 원심의 판단\n  원심은 다음과 같은 이유로 참가인들이 소외 조합의 근로기준법상 근로자에 해당하지 않는다고 판단하였다.\n  1) 참가인들은 배차시간 내에서 영업시간ㆍ휴식시간을 자유롭게 운영할 수 있었고, 출퇴근시간이 고정되지 않았으며, 소외 조합은 참가인들의 택시운전업무에 대해 직접적인 지휘ㆍ감독을 하지 아니하였다. \n  2) 참가인들은 택시 운행 실적에 비례한 돈을 지급받았고, 정관에 따라 조합원으로서 잉여금을 배당받을 수 있는 권리가 있었다. \n  3) 참가인들은 총회 의결권을 가진 정조합원으로서 소외 조합의 해산 결의에도 참석하여 의결권을 행사하였다. 참가인들은 소외 조합으로부터 제공받은 택시를 운행했을 뿐 차량을 소유하고 있지 않지만, 이는 택시면허의 특성에 따른 것이므로 택시 소유 여부를 근로자성 판단 기준으로 삼기 어렵고, 대신 참가인들은 출자금을 반환받을 권리가 있다.\n  4) 참가인들은 자신의 지위가 근로자가 아니라는 내용의 문구가 명시되어 있는 이 사건 사용계약과 이 사건 규정의 내용을 인지하고 자필로 서명했다. 소외 조합은 협동조합법상 협동조합으로 법인 택시운송사업자와 형태가 다른 점을 감안하면, 소외 조합이 근로기준법의 적용을 회피하려는 수단으로 위와 같은 문구를 기재했다고 보이지 않는다.\n  나. 대법원의 판단\n  원심의 판단은 다음과 같은 이유로 수긍하기 어렵다.\n  1) 관련 법리\n  가) 근로기준법상의 근로자에 해당하는지는 계약의 형식이 고용계약인지 도급계약인지보다 그 실질에 있어 근로자가 사업 또는 사업장에 임금을 목적으로 종속적인 관계에서 사용자에게 근로를 제공하였는지 여부에 따라 판단하여야 한다. 여기에서 종속적인 관계가 있는지는 업무 내용을 사용자가 정하고 취업규칙 또는 복무(인사)규정 등의 적용을 받으며 업무 수행 과정에서 사용자가 상당한 지휘ㆍ감독을 하는지, 사용자가 근무시간과 근무장소를 지정하고 근로자가 이에 구속을 받는지, 노무제공자가 스스로 비품ㆍ원자재나 작업도구 등을 소유하거나 제3자를 고용하여 업무를 대행케 하는 등 독립하여 자신의 계산으로 사업을 영위할 수 있는지, 노무 제공을 통한 이윤의 창출과 손실의 초래 등 위험을 스스로 안고 있는지와 보수의 성격이 근로 자체의 대상적 성격인지, 기본급이나 고정급이 정하여졌는지 및 근로소득세의 원천징수 여부 등 보수에 관한 사항, 근로제공관계의 계속성과 사용자에 대한 전속성의 유무와 그 정도, 사회보장제도에 관한 법령에서 근로자로서 지위를 인정받는지 등의 경제적ㆍ사회적 여러 조건을 종합하여 판단하여야 한다(대법원 2006. 12. 7. 선고 2004다29736 판결 등 참조). 전체적으로 보아 임금을 목적으로 종속적 관계에서 사용자에게 근로를 제공하였다고 인정되는 이상, 근로자에 대한 위 여러 징표 중 일부 사정이 결여되었거나 다른 지위를 아울러 가지고 있다고 하여도 그러한 사유만으로 근로기준법상 근로자가 아니라고 할 수는 없다(대법원 2009. 4. 23. 선고 2008도11087 판결 등 참조). \n  나) 이와 같은 법리는 협동조합법에 따라 설립된 협동조합의 조합원의 경우에도 마찬가지로 적용된다. 그 이유는 다음과 같다.\n  (1) 협동조합법에 따른 협동조합이란 재화 또는 용역의 구매ㆍ생산ㆍ판매ㆍ제공 등을 협동으로 영위함으로써 조합원의 권익을 향상하고 지역 사회에 공헌하고자 하는 사업조직으로(제2조 제1호), 협동조합의 설립 목적에 동의하고 그에 따른 의무를 다하고자 하는 조합원들로 구성된다(제20조). 협동조합의 조합원은 협동조합법과 정관 등에 따라 의결권ㆍ선거권과 사업의 이용, 잉여금의 배당 등에 관한 권리를 행사할 수 있다. 그런데 이는 조합원과 협동조합 사이의 조합관계에 관련된 것일 뿐이므로, 그러한 조합관계가 존재한다는 사정만으로 근로관계의 존재 가능성이 당연히 부정되는 것은 아니다.  \n  (2) 오히려 협동조합은 사업 수행 과정에서 조합원과 조합관계 외에도 다양한 법률관계를 맺을 수 있고 여기에는 근로관계도 포함된다. 근로기준법상 근로자에 해당하는지는 근로제공관계의 실질에 따라 판단되어야 하므로, 조합원이 협동조합에 임금을 목적으로 종속적인 관계에서 근로를 제공하였다면 조합원의 지위와 별도로 근로자의 지위도 인정될 수 있다. 이는 출자를 통해 회사의 지분을 소유하고 있는 주주나, 회사로부터 일정한 사무처리를 위임받은 임원이라 하더라도, 그러한 다른 지위를 아울러 가지고 있다는 사유만으로 근로자성이 부정되지 않는 것과 본질적으로 다르지 않다(대법원 2009. 2. 12. 선고 2008도7794 판결, 대법원 2013. 6. 27. 선고 2010다57459 판결 등 참조).\n  다) 택시운송사업자인 협동조합의 조합원으로서 택시운수종사자의 지위에 있는 사람이 근로기준법상 근로자인지를 판단하는 경우에는, 앞서 본 근로자성 판단 요소들을 적용함에 있어 협동조합이 아닌 택시운송사업자 소속의 근로자성이 인정되는 일반적인 택시운수종사자와 비교할 때 업무 내용, 보수의 책정 및 지급 방식, 노무관리 등에 있어 어떠한 차이가 있는지를 살펴봄과 아울러, 사업장 밖에서 근로함에 따라 업무수행과정에서 실시간으로 지휘ㆍ감독이 어려운 택시운전업무의 특성 등도 고려하여야 한다. \n  2) 앞서 본 사실관계 및 원심이 적법하게 채택하여 조사한 증거 등에 따르면, 다음과 같은 사실 또는 사정을 알 수 있다. \n  가) 이 사건 사용계약과 이 사건 규정에는 참가인들이 근로자가 아니라고 기재되어 있으나, 근로자에 해당하는지는 그와 같은 기재나 형식이 아니라 근로제공관계의 실질에 따라 판단하여야 한다. \n  나) 이 사건 사용계약은 ① 운행일(5일 영업, 1일 휴무), ② 배차시간 및 영업시간(1일 10시간 및 그중 6시간), ③ 만근일(26일) 및 휴가 일수(연 12일), ④ 운행형태의 종류와 각 형태별로 납입해야 할 기준금(교대제 1일 110,000원, 1인 1차제 1일 134,000원), ⑤ 월 지급금 중 고정금의 액수(801,800원) 및 그 지급일, ⑥ 기준금을 초과한 운송수입금의 배분 비율(소외 조합 80%, 조합원 20%) 등에 관하여 정하고 있다. 또한 이 사건 규정은 ‘결근 시 48시간 전 서면으로 조합의 허락을 받아야 하고, 조합의 불허에도 불구하고 결근할 경우 무단휴무, 업무지시 위반으로 징계한다.’고 정하고, 그 외에도 장시간 영업행위의 제한, 운행시간 외 차량 입고 의무, 운행시간 외 영업 금지 의무 등에 관하여 정하고 있다. \n  소외 조합이 이 사건 사용계약과 이 사건 규정을 통하여 위와 같은 내용을 정한 것은, 협동조합이 아닌 택시운송사업자가 취업규칙 또는 복무(인사)규정을 통하여 소속 택시운전근로자들의 소정근로시간, 소정근로일수 등 업무의 내용과 임금의 책정ㆍ지급방법 등 기본적인 근로조건과 복무규율에 관하여 사전에 정한 것과 실질적으로 별다른 차이가 없다.\n  다) 소외 조합이 참가인들의 택시 운행 과정에 대하여 실시간으로 지휘ㆍ감독을 하지는 않은 것으로 보이나, 이는 택시운전업무의 특성에 따른 것으로 근로자성을 부정할 만한 결정적인 사정이라고 보기 어렵다. 참가인들은 택시 운행에 있어 이 사건 규정에 정해진 구체적인 준수사항과 복무규율의 적용을 받았다. 구체적으로, 참가인들은 장시간 영업행위의 제한, 운행시간 외 차량 입고 의무, 운행시간 외 영업 금지 의무 등을 준수하여야 했고, 위반 시 징계 대상이 되는 등 제재를 받을 수 있었다.\n  라) 참가인들은 택시운행의 노선과 배차시간 내에서 휴식시간의 사용 등을 자율적으로 정할 수 있었던 것으로 보인다. 그러나 참가인들에 대하여는 배차시간 내에서 영업시간이 정해져 있었고, 연간 휴가 일수에도 상한이 정해져 있었으며, 결근하고자 할 때에는 사전에 소외 조합의 허락을 받아야 했다. 또한 참가인들은 사전에 정해진 일정 액수의 기준금을 소외 조합에 납입해야 했는데, 기준금의 액수에 비추어, 그 금액 상당의 운송수입금 매출을 올리기 위하여 일정 시간 이상 택시를 운행함이 불가피하였을 것으로 보인다. 이러한 점을 고려하면, 참가인들이 택시의 운행 여부나 운행 시간, 휴가 사용 여부를 자유롭게 선택할 수 있었다고 보기 어렵고, 소외 조합이 지정한 운행시간 등에 구속받았다고 볼 수 있다. \n  마) 참가인들은 기준금 전액을 소외 조합에 납입하는 경우, 매월 801,800원의 고정급에 기준금 초과 운송수입금의 일정 비율을 더한 금액을 보수로 지급받았던 것으로 보인다. 또한 기준금 전액을 납입하지 못할 경우 보수에서 미달 금액이 공제되었으며, 만근한 경우에는 만근장려금 50,000원을 지급받았다. 이러한 금품은 참가인들이 이 사건 사용계약에 따라 제공한 택시 운행이라는 근로 자체에 대한 대가로서의 성격을 갖는다. \n  바) 참가인들은 조합원으로서 의결권ㆍ선거권 및 출자금을 반환받을 권리가 있다. 그러나 앞서 본 영업시간, 기준금, 보수의 산정 방식 등에 비추어 볼 때, 조합원으로서 위와 같은 권리가 있다는 사정만을 들어, 참가인들이 독립하여 자신의 계산으로 사업을 영위하였다거나, 노무 제공을 통한 이윤의 창출과 손실의 초래 등 위험을 스스로 안고 있었다고 보기 어렵다. \n  3) 위와 같은 사정을 앞서 본 법리에 비추어 살펴보면, 소외 조합과 참가인들이 이 사건 사용계약에 따라 택시운전업무와 관련된 근로제공에 관하여 맺은 위와 같은 법률관계는, 협동조합이 아닌 택시운송사업자와 그 소속의 근로자성이 인정되는 일반적인 택시운수종사자 사이의 관계와 본질적으로 다르지 않고, 이는 조합원으로서의 지위에서 맺은 법률관계와 별도로 성립한 것으로 볼 수 있다. 그러므로 참가인들은 소외 조합의 조합원 지위와 아울러 근로자 지위에도 있었다고 볼 소지가 크다. \n  4) 그런데도 원심은 판시와 같은 이유만으로 참가인들이 소외 조합의 근로자 지위에 있지 않다고 판단하였다. 이러한 원심의 판단에는 근로기준법상 근로자 지위의 판단 기준 등에 관한 법리를 오해하여 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 있다. \n  3. 참가인들의 근로관계가 원고에게 승계되었는지 및 이 사건 통보가 정당한지에 관하여(제2 상고이유) \n  가. 원심의 판단\n  원심은 다음과 같은 이유로, 설령 참가인들이 소외 조합의 근로자라고 하더라도, 소외 조합과 참가인들 사이의 근로관계가 원고에게 승계되었다고 볼 수 없으므로, 이 사건 통보는 위법하지 않다고 판단하였다. \n  1) 원고가 2021. 2. 23. 인수하기로 한 소외 조합의 출자금 반환 채무 내역에서 참가인들에 관한 부분은 제외되어 있다. \n  2) 이에 따라 참가인들에 대한 출자금 반환 채무가 원고에게 승계되지 아니하였고, 참가인들이 원고에게 출자금을 별도로 납부하지도 않았기 때문에, 원고는 참가인들의 조합원 지위를 인정하지 않고 이 사건 통보를 한 것이다.\n  3) 만약 참가인들의 근로관계가 원고에게 승계되었다고 본다면, 참가인들은 출자금을 지급하지 않은 상태에서 택시 운행을 하여 수입을 거둘 수 있는 지위를 부여받게 되나, 이는 협동조합인 원고의 운영방식에 부합하지 않는다.\n  나. 대법원의 판단 \n  원심의 판단은 다음과 같은 이유로 수긍하기 어렵다.\n  1) 관련 법리\n  영업의 양도라 함은 일정한 영업목적에 의하여 조직화된 업체, 즉 인적ㆍ물적 조직을 그 동일성은 유지하면서 일체로서 이전하는 것으로서, 이러한 영업양도가 이루어진 경우에는 원칙적으로 해당 근로자들의 근로관계가 양수하는 기업에 포괄적으로 승계된다. 영업양도가 이루어졌는지는 단지 어떠한 영업재산이 어느 정도로 이전되어 있는가에 의하여 결정되어야 하는 것이 아니고 거기에 종래의 영업조직이 유지되어 그 조직이 전부 또는 중요한 일부로서 기능할 수 있는가에 의하여 결정되어야 한다. 따라서 영업재산의 일부를 유보한 채 영업시설을 양도했어도 그 양도한 부분만으로도 종래의 조직이 유지되어 있다고 사회관념상 인정되면 그것을 영업의 양도라 보아야 하고, 반면에 영업재산의 전부를 양도했어도 그 조직을 해체하여 양도했다면 영업의 양도로 볼 수 없다(대법원 2002. 3. 29. 선고 2000두8455 판결 등 참조).\n  영업이 양도되면 반대의 특약이 없는 한 양도인과 근로자 사이의 근로관계는 원칙적으로 양수인에게 포괄적으로 승계되고, 영업양도 당사자 사이에 근로관계의 일부를 승계의 대상에서 제외하기로 하는 특약이 있는 경우에는 그에 따라 근로관계의 승계가 이루어지지 않을 수 있다. 그러나 그러한 특약은 실질적으로 해고나 다름이 없으므로 근로기준법 제23조 제1항 소정의 정당한 이유가 있어야 유효하며, 영업양도 그 자체만을 사유로 삼아 근로자를 해고하는 것은 정당한 이유가 있는 경우에 해당한다고 볼 수 없다(위 2000두8455 판결 등 참조). \n  협동조합법상 협동조합은 그 설립 목적인 사업의 수행을 위한 활동을 협동으로 영위하는 조직이다(협동조합법 제2조 제1호, 제45조 제1항 참조). 따라서 협동조합이 그 인적ㆍ물적 조직을 동일성은 유지하면서 다른 협동조합에 일체로서 이전하는 경우에도 위와 같은 근로관계 승계에 관한 법리가 적용될 수 있다.\n  2) 앞서 본 사실관계와 기록에 따라 알 수 있는 다음 사정을 위와 같은 법리에 비추어 살펴본다. \n  가) 원고는 이 사건 양수도계약을 통하여 소외 조합의 여객자동차운송사업면허를 비롯한 사업권, 택시 35대를 포함한 차량, 사무비품, 차고지 등 자산 일체를 양수하고, 이를 이용하여 택시운송사업을 행하고 있다. 또한 소외 조합의 정조합원들은 원고에 대해 가입 의사를 밝히지 않은 경우 및 참가인들을 제외하고는 모두 원고로 승계되어 소외 조합에서와 동일하게 택시운전업무를 수행하고 있다. 이러한 사정들을 종합해 보면, 소외 조합의 인적ㆍ물적 조직은 동일성을 유지한 채 원고로 이전되어 원고가 영위하는 택시운송사업의 전부 또는 중요한 일부로서 기능하고 있으므로, 이는 영업양도에 해당한다고 봄이 타당하다. 따라서 소외 조합과 참가인들 사이의 근로관계도 원칙적으로 양수인인 원고에게 포괄승계되었다.\n  나) 원고가 2021. 2. 23. 인수하기로 한 소외 조합의 출자금 반환 채무 900,140,000원에 참가인들에 대한 부분은 제외되어 있다. 원고가 참가인들에 대한 출자금 반환 채무를 인수하지 않은 것을 참가인들과의 근로관계 승계 제외 특약으로 보게 되면, 그 특약의 실행은 실질적으로 해고에 해당한다. 그런데 참가인들의 조합원으로서의 지위와 근로자로서의 지위는 별개의 법률관계에 따라 인정되는 것이다. 그러므로 원고가 참가인들에 대한 출자금 반환 채무를 인수하지 아니하였다거나 참가인들이 원고에게 출자금을 추가로 납입하지 않았다 하더라도, 조합관계에 관한 그러한 사정이 소외 조합과 참가인들 사이의 근로관계가 원고에게 포괄적으로 승계되는 것을 부정하는 사유가 된다거나 해고의 정당한 이유가 된다고 볼 수 없다.  \n  다) 결국 이 사건 통보는 원고가 근로관계의 승계에 따라 원고의 근로자 지위에 있는 참가인들에게 그 의사에 반하여 일방적으로 근로관계의 종료를 통보한 것으로 해고에 해당한다. 그런데 원고는 참가인들을 해고함에 있어 근로기준법 제27조를 위반하여 해고사유 등을 서면으로 통지하지 않았고, 해고의 정당한 이유도 발견할 수 없다. 따라서 이 사건 통보는 위법한 해고로서 무효라고 볼 소지가 크다. \n  3) 그런데도 원심은 앞서 본 바와 같은 사정만으로 이 사건 통보가 위법하지 않다고 판단하였다. 이러한 원심의 판단에는 영업양도와 근로관계 승계에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. \n  4. 결론\n  그러므로 원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 엄상필(재판장) 오경미 권영준(주심)"
  },

    "판시사항": "[1] 구 독점규제 및 공정거래에 관한 법률 제23조 제1항 제7호 (가)목에서 금지하고 있는 ‘부당한 인력지원행위’를 인정하기 위해 주장ㆍ증명할 사실 및 이에 관한 증명책임자(=처분청)\n\n [2] 구 독점규제 및 공정거래에 관한 법률 제23조 제1항 제7호에서 규정하는 부당지원행위에서 ‘부당성’은 거래조건을 달리하는 개별행위별로 판단해야 하는지 여부(원칙적 적극) 및 이는 같은 법 제23조의2에서 규정하는 특수관계인에 대한 부당한 이익제공행위에서의 ‘부당성’ 판단에서도 마찬가지인지 여부(적극) / 동일한 객체에 대한 여러 개의 지원행위 또는 이익제공행위가 동일한 의도나 목적 아래 행해지는 경우, 그 행위들의 부당성을 전체적으로 판단해야 하는지 여부(적극)",
    "판결요지": "[1] 구 독점규제 및 공정거래에 관한 법률(2017. 4. 18. 법률 제14813호로 개정되기 전의 것) 제23조 제1항 제7호 (가)목은 부당하게 특수관계인 또는 다른 회사에 인력을 상당히 낮은 대가로 제공하는 행위를 통하여 특수관계인 또는 다른 회사를 지원하는 ‘부당한 인력지원행위’를 금지하고 있다. 이러한 형태의 ‘인력지원행위’가 인정되기 위해서는, 지원주체가 해당 인력으로 하여금 지원객체에 근로 등을 제공하게 하였음을 전제로, ‘해당 인력이 근로 등 제공의 대가로서 지원주체와 지원객체로부터 지급받은 급여 등의 합계액’보다 ‘지원객체가 해당 인력 또는 지원주체에 제공한 급여 등의 합계액’이 상당히 적다는 사실을 처분청이 주장ㆍ증명해야 한다.\n\n [2] 구 독점규제 및 공정거래에 관한 법률(2017. 4. 18. 법률 제14813호로 개정되기 전의 것, 이하 ‘구 공정거래법’이라 한다) 제23조 제1항 제7호에서 규정하는 부당지원행위에서 ‘부당성’은 거래조건을 달리하는 개별행위별로 판단하는 것이 원칙이고, 이는 구 공정거래법 제23조의2에서 규정하는 특수관계인에 대한 부당한 이익제공행위에서의 ‘부당성’ 판단에서도 마찬가지라고 보아야 한다. 다만 동일한 객체에 대한 여러 개의 지원행위 또는 이익제공행위가 동일한 의도나 목적 아래 행해지는 경우에는 이를 일련의 행위로 보아 그 행위들의 부당성을 전체적으로 판단하는 것이 타당하다.",
    "참조조문": "[1] 구 독점규제 및 공정거래에 관한 법률(2017. 4. 18. 법률 제14813호로 개정되기 전의 것) 제23조 제1항 제7호 (가)목[현행 제45조 제1항 제9호 (가)목 참조] / [2] 구 독점규제 및 공정거래에 관한 법률(2017. 4. 18. 법률 제14813호로 개정되기 전의 것) 제23조 제1항 제7호(현행 제45조 제1항 제9호 참조), 제23조의2(현행 제47조 참조)",
    "참조판례": "",
    "판례내용": "【원고, 상고인 겸 피상고인】                주식회사 ○○○리테일 외 1인 (소송대리인 법무법인(유한) 지평 담당변호사 김지홍 외 2인)\n【피고, 피상고인 겸 상고인】 공정거래위원회 (소송대리인 법무법인 봄 외 2인)\n【원심판결】  서울고법 2024. 8. 21. 선고 2022누47652 판결         \n【주    문】\n  상고를 모두 기각한다.  상고비용 중 원고들의 상고로 인한 부분은 원고들이, 피고의 상고로 인한 부분은 피고가 각 부담한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 각 준비서면의 기재는 이를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 의하면 다음 사실을 알 수 있다. \n  가. 원고들의 지위\n  1) 원고 주식회사 ○○○리테일(이하 회사명을 기재함에 있어 ‘주식회사’의 기재는 모두 생략한다)은 백화점과 할인점 등을 운영하는 대규모 유통업자이고, 원고 ○○○월드는 의류ㆍ잡화 등을 제조ㆍ판매하는 사업자이다. \n  2) 원고들은 모두 기업집단 ○○○(이하 ‘○○○ 그룹’이라 한다)에 속한 계열회사로, 구 「독점규제 및 공정거래에 관한 법률」(2017. 4. 18. 법률 제14813호로 일부 개정되어 2017. 7. 19. 시행되기 전의 것, 이하 ‘구 공정거래법’이라 한다) 제2조 제1호의 사업자에 해당한다.\n  3) ○○○ 그룹은 2012. 4. 상호출자제한기업집단으로 지정되었다가 2016. 9. 30. 제외되었고, 2017. 9. 1. 공시대상기업집단으로 지정되었다. 2021. 5. 1. 기준으로 ○○○ 그룹의 자산 총액은 약 9조 5천억 원으로서 71개 공시대상기업집단 중 45위에 해당한다.\n  4) ○○○ 그룹의 동일인은 소외 1이고, 동일인이 2020. 5. 기준으로 원고 ○○○월드 지분 40.7%를 보유하고 있다. 동일인이 원고 ○○○월드를 통해 ○○○ 그룹 전체를 지배하고 있으므로, 원고 ○○○월드는 사실상 ○○○ 그룹에서 지주회사 역할을 담당하고 있다. 동일인의 배우자는 2020년경 기준으로 원고 ○○○월드 지분 8.06%를 보유하고 있다. \n  나. 처분의 대상이 된 원고들의 행위 및 피고의 판단\n  1) 자금 무상 대여행위\n  가) 원고 ○○○리테일은 2016. 12. 31. 원고 ○○○월드로부터 그 소유의 인천 부평구 창고 건물과 전남 무안군 토지를 합계 670억 원에 매수하는 계약을 체결하면서 560억 원의 계약금을 지급하였다가, 2017. 6. 30. 매매계약을 해제하여 계약금을 돌려받았다.\n  나) 피고는, 원고들의 행위가 외형상 부동산 매매계약의 형태를 띠고 있으나 실질상으로는 원고 ○○○리테일이 원고 ○○○월드에 계약금 상당의 자금을 매매계약 체결 후부터 계약 해제 시까지 6개월 동안 무상으로 대여한 행위(이하 ‘제1 행위’라고 한다)로서 그 이자 상당액인 1,377,385,205원을 지원하였다고 판단하였다.\n  2) 자산 양도대금 지연 회수 및 지연이자 미수령 행위\n  가) 원고 ○○○리테일은 2014. 5. 27. 원고 ○○○월드와 의류 브랜드 ‘(명칭 생략)’ 관련 자산(이하 ‘이 사건 자산’이라 한다)의 양수도계약(이하 ‘이 사건 자산양수도계약’이라 한다)을 체결한 후, 2014. 7. 1. 기준으로 이 사건 자산을 이전하기로 하였다. 이후 2015. 1. 31.까지 4회에 걸친 원고 ○○○리테일의 재고자산 추가 매각으로 원고 ○○○리테일이 원고 ○○○월드로부터 지급받아야 할 양도대금은 약 511억 원이 되었다. 이처럼 원고 ○○○리테일이 2014. 7. 1. 원고 ○○○월드에 이 사건 자산을 양도하고 2014. 7. 31. 최초 양도대금 확정 합의가 이루어졌음에도 양도대금 최종 지급은 거의 3년이 지난 2017. 6. 19.에야 마무리되었다.\n  나) 원고 ○○○월드의 양도대금 지연지급과 관련하여, 원고 ○○○리테일은 계약 과정에서 원고 ○○○월드의 채무이행을 위한 재무적 안전장치 등을 설정하지 않았고 채무이행을 독촉하지 않았으며, 원고 ○○○월드도 지연이자를 전혀 지급하지 않았다. 이에 따라 원고 ○○○월드는 양도대금 중 미지급액(기간에 따라 최소 214억 4,200만 원부터 최대 506억 5,600만 원까지)에 해당하는 자금을 무이자로 제공받은 것과 같은 경제적 이익을 누리게 되었다.\n  다) 피고는, 위와 같이 양도대금을 지연 회수하고 그에 대한 지연이자를 수령하지 않는 행위(이하 ‘제2 행위’라 한다)를 통하여 원고 ○○○리테일이 원고 ○○○월드에 양도대금 지급기한인 2014. 7. 1.부터 지급완료일인 2017. 6. 19.까지의 지연이자 상당액 3,587,970,093원을 지원하는 한편, 2014. 7. 1.부터 2016. 9. 29.(○○○ 그룹이 상호출자제한기업집단에서 제외된 날의 전날)까지의 지연이자 상당액 1,712,792,000원을 지원함으로써 특수관계인인 동일인 및 그 배우자에게 부당한 이익을 귀속시켰다고 판단하였다.\n  3) 인력지원행위\n  가) 원고 ○○○리테일은 2013. 11. 11.부터 2016. 3. 28.까지 원고 ○○○리테일과 원고 ○○○월드의 대표이사를 겸임한 소외 2의 급여를 전부 부담하였다.\n  나) 피고는, 원고 ○○○리테일이 소외 2의 겸임기간 동안 급여를 전부 지급하는 행위(이하 ‘제3 행위’라 한다)를 통하여 원고 ○○○월드에 그 급여 상당액 185,144,473원을 지원하는 한편, 2015. 2. 14.부터 2016. 3. 28.까지의 급여 상당액 83,783,108원을 지원함으로써 특수관계인인 동일인 및 그 배우자에게 부당한 이익을 귀속시켰다고 판단하였다.\n  다. 피고의 시정명령 및 과징금납부명령\n  1) 부당지원행위 인정(제1, 2, 3 행위)\n  피고는, 원고 ○○○리테일의 제1, 2, 3 행위가 구 공정거래법 제23조 제1항 제7호에 해당하고[제3 행위 중 2013. 11. 11.부터 2015. 2. 13.까지의 행위는 구 「독점규제 및 공정거래에 관한 법률」(2013. 8. 13. 법률 제12095호로 개정되어 2014. 2. 14. 시행되기 전의 것) 제23조 제1항 제7호가 적용된다. 이하 같다], 원고 ○○○월드의 제1, 2 행위 및 제3 행위 중 2015. 2. 14.부터 2016. 3. 28.까지 부분이 구 공정거래법 제23조 제2항에 해당한다고 인정하였다.\n  2) 부당한 이익제공행위 인정(제2, 3 행위)\n  피고는, 원고 ○○○리테일의 제2 행위 중 2014. 7. 1.부터 2016. 9. 29.까지 부분, 제3 행위 중 2015. 2. 14.부터 2016. 3. 28.까지 부분이 구 공정거래법 제23조의2 제1항 제1호에 해당하고, 원고 ○○○월드의 제2 행위 중 2014. 7. 1.부터 2016. 9. 29.까지 부분 및 제3 행위 중 2015. 2. 14.부터 2016. 3. 28.까지 부분이 구 공정거래법 제23조의2 제3항에 해당한다고 인정하였다.\n  3) 시정명령 및 과징금납부명령\n  위와 같은 판단을 전제로 피고는, 원고들이 앞으로 위 각 행위와 동일 또는 유사한 행위를 할 가능성이 있다고 보아 구 공정거래법 제24조에 따라 원고들에게 향후 원심판결 별지 1 제1항 내지 제4항 기재와 같은 행위의 금지를 명하고, 구 공정거래법 제24조의2, 제55조의3, 구 「독점규제 및 공정거래에 관한 법률 시행령」(2016. 9. 29. 대통령령 제27529호로 개정되어 2017. 7. 1. 시행되기 전의 것) 제61조 제1항 [별표 2]에 따라 원고들에게 각각 원심판결 별지 1 제5항 기재와 같은 과징금을 부과하였다(위 행위금지명령과 과징금부과명령을 합하여 이하 ‘이 사건 처분’이라 한다).\n  2. 원고들의 상고이유에 대한 판단\n  가. 제1 상고이유에 대하여\n  원심은 그 판시와 같은 사실 및 사정들을 종합하여, 원고 ○○○리테일이 제2 행위를 통하여 원고 ○○○월드와 이 사건 자산양수도계약을 체결하고 그 양도대금을 지연 회수하면서 지연이자를 지급받지 않는 방식으로 원고 ○○○월드에 상당히 유리한 조건으로 거래함으로써 과다한 경제상 이익을 제공하였다고 판단하였다.\n  원심판결 이유를 관련 법리에 비추어 살펴보면, 원심판단에 상고이유 주장과 같이 계약의 해석, 동시이행관계, 지원행위 및 이익제공행위에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없고, 이와 관련된 이유가 모순되는 등의 잘못도 없다.\n  나. 제2 상고이유에 대하여\n  원심은 그 판시와 같은 사실 및 사정들을 종합하여, 제2 행위는 원고 ○○○리테일이 향후 안정적인 수익이 예상되던 이 사건 자산을 원고 ○○○월드에 이전함으로써 당시 유동성 위기에 빠져있던 원고 ○○○월드를 지원하려는 의도로 이루어진 것이라고 판단하였다.\n  원심판결 이유를 관련 법리에 비추어 살펴보면, 원심판단에 상고이유 주장과 같이 부당지원행위에 있어 지원 의도에 관한 법리오해 또는 논리와 경험의 법칙을 위반하고 자유심증주의의 한계를 벗어난 사실인정이나 심리미진으로 판결에 영향을 미친 잘못이 없다.\n  다. 제3 상고이유에 대하여\n  원심은 그 판시와 같은 사실 및 사정들을 종합하여, 제2 행위로 인하여 원고 ○○○월드가 속한 관련시장인 국내 의류ㆍ패션 시장에서 자유로운 경쟁의 기반이 침해됨으로써 경쟁이 저해되거나 경제력 집중이 야기되는 등으로 공정거래 저해 우려가 초래되었다고 판단하였다.\n  원심판결 이유를 관련 법리에 비추어 살펴보면, 원심판단에 상고이유 주장과 같이 부당지원행위 및 특수관계인에 대한 부당한 이익제공행위에 있어 부당성에 관한 법리를 오해하거나 이에 관하여 필요한 심리를 다하지 않아 판결에 영향을 미친 잘못이 없고, 이와 관련된 이유가 모순되는 등의 잘못도 없다.\n  3. 피고의 상고이유에 대한 판단\n  가. 제1 상고이유에 대하여\n  1) 행정청은 당초의 처분사유와 기본적 사실관계가 동일한 범위 내에서 다른 처분사유를 추가ㆍ변경할 수 있으나, 이는 사실심 변론종결 시까지만 허용된다(행정소송규칙 제9조).\n  제1 행위를 통하여 원고 ○○○월드가 원고 ○○○리테일에 대하여 부담하고 있던 선급금 관련 채무의 변제기를 연장해 주는 방법으로 부당한 자금지원행위를 하였다는 피고의 이 부분 상고이유 주장은 원심에서 하지 않았던 새로운 주장일 뿐만 아니라, 이러한 주장은 이 사건 처분 중 제1 행위 부분의 처분사유, 즉 제1 행위를 통하여 원고 ○○○리테일이 원고 ○○○월드에 계약금 상당의 자금을 무상으로 대여함으로써 그 이자 상당액을 지원하였다는 점과 기본적 사실관계의 동일성도 없으므로, 적법한 상고이유가 될 수 없다.\n  2) 나아가 원심은 그 판시와 같은 사실 및 사정들을 종합하여, 제1 행위 당시 매매계약의 형식을 빌려 원고 ○○○리테일의 기존 선급금 중 일부를 계약금으로 회계상 처리함으로써 선급금을 줄인 행위로 인하여 원고 ○○○월드가 원고 ○○○리테일로부터 제공받은 실질적인 경제적 이익이 전혀 없는바, 제1 행위는 원고 ○○○리테일의 원고 ○○○월드에 대한 부당한 자금지원행위에 해당한다고 볼 수 없으므로 이 사건 처분 중 제1 행위 부분은 위법하여 취소되어야 한다고 판단하였다.\n  원심판결 이유를 관련 법리에 비추어 살펴보면, 원심판단에 상고이유 주장과 같이 부당지원행위에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  나. 제2 상고이유 중 인력지원행위 성립 부분에 대하여\n  1)                구 공정거래법 제23조 제1항 제7호 (가)목은 부당하게 특수관계인 또는 다른 회사에 인력을 상당히 낮은 대가로 제공하는 행위를 통하여 특수관계인 또는 다른 회사를 지원하는 ‘부당한 인력지원행위’를 금지하고 있다. 이러한 형태의 ‘인력지원행위’가 인정되기 위해서는, 지원주체가 해당 인력으로 하여금 지원객체에 근로 등을 제공하게 하였음을 전제로, ‘해당 인력이 근로 등 제공의 대가로서 지원주체와 지원객체로부터 지급받은 급여 등의 합계액’보다 ‘지원객체가 해당 인력 또는 지원주체에 제공한 급여 등의 합계액’이 상당히 적다는 사실을 처분청이 주장ㆍ증명하여야 한다.\n  2) 원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하여 인정되는 다음 사정들에 비추어 보면, 피고가 제출한 증거들만으로는 원고 ○○○리테일이 소외 2로 하여금 원고 ○○○월드에 근로 등을 제공하게 한 사실이 증명되었다고 보기 어렵다. 그렇다면 비록 소외 2가 원고들의 대표이사를 겸임하면서 원고 ○○○월드로부터는 보수를 전혀 지급받지 않았다 하더라도, 원고 ○○○리테일이 원고 ○○○월드에 소외 2의 근로 등을 상당히 낮은 대가로 제공하여 과다한 경제상 이익을 제공하였다고 할 수는 없으므로, 원고 ○○○리테일의 원고 ○○○월드에 대한 ‘인력지원행위’는 성립하지 않는다. 따라서 이 사건 처분 중 제3 행위 관련 부당지원행위 부분은 그 처분사유가 인정되지 않아 위법하다.\n  가) 소외 2는 2013. 7. 19.부터 2019. 7. 19.까지 원고 ○○○리테일 대표이사로 선임ㆍ등기되었고, 그 기간 중인 2013. 11. 11.부터 2016. 3. 28.까지 원고 ○○○월드 대표이사를 겸임하였다. 이에 관하여 피고는 주식회사 대표이사의 직무가 회사 업무 전체를 포괄한다는 이유에서, 원고들의 대표이사 겸임 사실만으로 소외 2가 원고들 모두를 위하여 근로를 제공하였다고 인정하였다. 그러나 주식회사의 임원은 주주총회에서 주주 다수의 결의에 따라 선임되어 위임의 본지에 따라 선량한 관리자의 주의로써 위임사무를 처리하는 것이지 회사에 고용되어 업무집행권자인 대표이사 등의 지휘ㆍ감독 아래 근로를 제공하는 것이 아니므로, 소외 2가 위 기간 동안 원고들의 대표이사를 겸임하였다는 사실만으로는 원고 ○○○리테일이 소외 2로 하여금 원고 ○○○월드에 근로 등을 제공하게 하였음이 증명되었다고 볼 수 없다.\n  나) 만약 소외 2가 원고들과의 합의에 따라 원고들의 대표이사를 겸임하면서 구체적으로 원고 ○○○월드를 위하여 근로에 준하는 수임사무를 수행하였다면, 원고 ○○○월드에 근로 등을 제공한 것으로 볼 여지가 있다. 그런데 피고는 소외 2가 원고 ○○○월드 대표이사로서 원고 ○○○월드를 위하여 수행한 수임사무 등을 특정하지 않았고, 어떠한 수임사무를 수행하였는지 확인할 수 있는 자료도 제출하지 않았다. 원고들이 제출한 자료에 의하면 소외 2가 원고 ○○○월드 대표이사로 선임되어 있던 약 2년 4개월 동안 원고 ○○○월드에서 13건의 전자결재를 한 것으로 보이나, 그것만으로 근로에 준하는 수임사무를 수행하였다고 보기는 어렵다.\n  다) 소외 2가 대표이사로 등기되어 있던 기간 동안 원고 ○○○리테일에는 소외 2 외에 다른 1명의 각자대표이사가 선임되어 있었고, 원고 ○○○월드에는 다른 2명의 각자대표이사가 선임되어 있었는바, 소외 2의 대표이사 선임 사실만으로 원고 ○○○월드에서의 근로에 준하는 수임사무 담당 사실이 추인된다고 보기도 어렵다. \n  3) 원심은 그 판시와 같은 이유로, 원고들의 대표이사를 겸임한 소외 2의 급여를 원고 ○○○리테일이 모두 부담하였더라도 원고 ○○○월드에 과다한 경제상 이익을 제공하였다고 볼 수 없어 제3 행위는 인력지원행위에 해당하지 않는다고 판단하였다. 원심의 이유 설시에 일부 적절하지 않은 부분이 있으나 제3 행위가 인력지원행위에 해당하지 않는다고 본 결론은 정당하고, 거기에 상고이유 주장과 같이 부당한 인력지원행위 성립에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. \n  다. 제2 상고이유 중 부당성 부분 및 제3 상고이유에 대하여\n  1)                구 공정거래법 제23조 제1항 제7호에서 규정하는 부당지원행위에서 ‘부당성’은 거래조건을 달리하는 개별행위별로 판단하는 것이 원칙이고, 이는 구 공정거래법 제23조의2에서 규정하는 특수관계인에 대한 부당한 이익제공행위에서의 ‘부당성’ 판단에서도 마찬가지라고 보아야 한다. 다만 동일한 객체에 대한 여러 개의 지원행위 또는 이익제공행위가 동일한 의도나 목적 아래 행해지는 경우에는 이를 일련의 행위로 보아 그 행위들의 부당성을 전체적으로 판단함이 타당하다.\n  2) 원심은 제3 행위의 부당성을 제2 행위와 구분하여, 그 판시와 같은 사정에 비추어 볼 때 제3 행위만으로는 원고 ○○○월드가 속한 국내 의류ㆍ패션 시장에서의 경쟁이 저해되거나 경제력 집중이 야기되는 등으로 공정한 거래를 저해할 우려가 있다고 보기 어려워 구 공정거래법 제23조 제1항 제7호에서 규정하는 부당지원행위에 있어 부당성을 인정할 수 없고, 또한 변칙적인 부의 이전 등을 통해 ○○○ 그룹의 특수관계인을 중심으로 경제력 집중이 유지ㆍ심화될 우려가 있다고 보기도 어려워 구 공정거래법 제23조의2 제1항 제1호가 규정하는 특수관계인에 대한 부당한 이익제공행위에 있어 부당성도 인정할 수 없으므로, 이 사건 처분 중 제3 행위 부분은 부당지원행위와 특수관계인에 대한 부당한 이익제공행위 모두 처분사유가 인정되지 않아 위법하다고 판단하였다. \n  3) 원심판결 이유를 앞서 본 법리와 증거에 비추어 살펴보면, 제2 행위와 제3 행위가 동일한 의도나 목적 아래 이루어진 일련의 행위라고 보기 어렵다는 점을 전제로 제2 행위와 구분하여 제3 행위의 부당성을 부정한 원심의 위와 같은 판단은 정당하고, 거기에 상고이유 주장과 같이 부당지원행위 및 특수관계인에 대한 부당한 이익제공행위의 부당성 판단에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  4. 결론\n  상고를 모두 기각하고 상고비용은 패소자가 부담하게 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오경미(재판장) 권영준 엄상필(주심)"

    "판결유형": "판결",
    "판시사항": "[1] 행정권한의 위임과 행정권한 내부 위임의 차이 및 행정권한이 내부 위임된 경우, 수임관청이 자기의 이름으로 그 권한을 행사할 수 있는지 여부(소극)\n\n [2] 교육서비스업을 영위하는 甲이 고용노동부 소관 보조사업인 ‘청년 디지털 일자리 사업’ 위탁운영기관인 乙 주식회사와 위 사업 지원 협약을 체결하고 청년들을 채용하여 乙 회사로부터 지원금을 지급받았는데, 甲이 참여청년들에게 ‘수행업무 허위작성, 사전근로, 퇴직사실 은닉, 페이백’을 하였다는 이유로 乙 회사가 보조금 관리에 관한 법률 제33조에 따라 甲에게 지원금 반환명령을 하자, 관할 지방고용노동청장이 甲에게 위 법률 제31조의2 제2항 제1호, 제33조의2 제1항 제2호에 따라 5년간 보조금 지급을 제한하고 제재부가금을 부과하는 처분을 한 사안에서, 위 처분에 대한 권한이 고용노동부장관에게 있음에도 지방고용노동청장이 자기의 이름으로 한 위 처분은 권한 없는 자에 의한 것으로서 위법하다고 한 사례",
    "판결요지": "[1] 행정권한의 위임은 행정관청이 법률에 따라 특정한 권한을 다른 행정관청에 이전하여 수임관청의 권한으로 행사하도록 하는 것으로서 권한의 법적인 귀속을 변경하는 것이므로, 법률이 위임을 허용하고 있는 경우에 한하여 인정된다. 이에 반하여, 행정권한의 내부 위임은 법률이 위임을 허용하고 있지 않은 경우에도 행정관청의 내부적인 사무처리의 편의를 도모하기 위하여 그의 보조기관 또는 하급행정관청으로 하여금 그의 권한을 사실상 행사하게 하는 것이다. 그러므로 권한 위임의 경우에는 수임관청이 자기의 이름으로 그 권한행사를 할 수 있지만, 내부 위임의 경우 수임관청은 위임관청의 이름으로만 그 권한을 행사할 수 있을 뿐 자기의 이름으로는 그 권한을 행사할 수 없다.\n\n [2] 교육서비스업을 영위하는 甲이 고용노동부 소관 보조사업인 ‘청년 디지털 일자리 사업’ 위탁운영기관인 乙 주식회사와 위 사업 지원 협약을 체결하고 청년들을 채용하여 乙 회사로부터 지원금을 지급받았는데, 甲이 참여청년들에게 ‘수행업무 허위작성, 사전근로, 퇴직사실 은닉, 페이백’을 하였다는 이유로 乙 회사가 보조금 관리에 관한 법률(이하 ‘보조금법’이라 한다) 제33조에 따라 甲에게 지원금 반환명령을 하자, 관할 지방고용노동청장이 甲에게 보조금법 제31조의2 제2항 제1호, 제33조의2 제1항 제2호에 따라 5년간 보조금 지급을 제한하고 제재부가금을 부과하는 처분을 한 사안에서, 보조금법 제31조의2 제2항 제1호, 제33조의2 제1항 본문 제2호에 따르면, 고용노동부 소관 보조사업 또는 간접보조사업에 관한 보조금 지급 제한처분 및 제재부가금 부과처분 권한은 ‘중앙관서의 장’인 고용노동부장관에게 있는 점, 보조금법 제38조, 구 보조금 관리에 관한 법률 시행령(2024. 11. 5. 대통령령 제34979호로 개정되기 전의 것) 제17조 각 호 등은 보조금 지급 제한처분 및 제재부가금 부과처분 권한을 지방고용노동청장 또는 그 지청장에게 위임할 수 있는 법령상 근거가 될 수 없고, 달리 고용노동부장관이 지방고용노동청장 또는 그 지청장에게 그러한 권한을 위임하는 것을 허용하는 법령상 근거를 발견할 수 없는 점, 고용노동부훈령인 ‘고용노동분야 국고보조사업 관리규정’ 제44조 제1항 제2호, 제47조 제1항이 지방고용노동청장 또는 그 지청장을 보조금 지급 제한처분 및 제재부가금 부과처분의 주체로 규정하고 있더라도, 그 의미가 ‘행정권한의 위임’에 해당한다고 볼 수 없고 ‘행정권한의 내부 위임’에 불과하다고 보아야 하는 점, 행정권한의 위임 없이 내부 위임만 이루어진 위임관청의 권한을 수임관청이 자기의 이름으로 행사하는 행위는 처분권한의 귀속 주체를 정하고 있는 처분의 근거 법률을 위반한 것으로서 위법한 점, 특별지방행정기관이 내부 위임된 것에 불과한 중앙행정기관의 권한을 자기의 이름으로 행사하는 행위가 처분권한의 귀속 주체를 정하고 있는 처분의 근거 법률을 위반한 것임은 다른 행정관청의 경우와 마찬가지인 점을 종합하면, 위 처분에 대한 권한이 고용노동부장관에게 있음에도 지방고용노동청장이 자기의 이름으로 한 위 처분은 권한 없는 자에 의한 것으로서 위법하다고 본 원심판단을 정당하다고 한 사례.",
    "참조조문": "[1] 정부조직법 제6조 제1항, 행정권한의 위임 및 위탁에 관한 규정 제2조 제1호, 제3조 제1항 / [2] 보조금 관리에 관한 법률 제31조의2 제2항 제1호, 제33조, 제33조의2 제1항 제2호, 제38조, 구 보조금 관리에 관한 법률 시행령(2024. 11. 5. 대통령령 제34979호로 개정되기 전의 것) 제17조 제6호, 보조금 관리에 관한 법률 시행령 제17조 제7호, 제9호, 정부조직법 제3조 제1항, 제6조 제1항, 행정권한의 위임 및 위탁에 관한 규정 제3조 제1항, 고용노동부와 그 소속기관 직제 제2조 제1항, 고용노동부와 그 소속기관 직제 시행규칙 제14조",
    "참조판례": "[1] 대법원 1986. 12. 9. 선고 86누569 판결(공1987, 172), 대법원 1995. 11. 28. 선고 94누6475 판결(공1996상, 251)",
    "판례내용": "【원고, 피상고인】                원고 (소송대리인 법무법인 가나다 담당변호사 김현환 외 2인)\n【피고, 상고인】 대구지방고용노동청장\n【원심판결】  대구고법 2024. 10. 25. 선고 2024누11304 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 피고가 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거에 따르면, 다음의 사실을 알 수 있다.\n  가. 원고는 ‘(상호 생략)’이라는 상호로 교육서비스업을 영위하는 사람이다. 피고는 고용노동부장관의 하급행정관청으로, 고용노동부 소속 특별지방행정기관인 대구지방고용노동청의 청장이다. \n  나. 원고는 2020. 11. 5. 고용노동부 소관 보조사업인 ‘청년 디지털 일자리 사업’의 위탁운영기관인 주식회사 ○○○(이하 ‘소외 회사’라 한다)에 사업 참여 신청서를 제출하였고, 같은 날 소외 회사와 ‘표준 청년 디지털 일자리 사업 지원 협약’을 체결하였다. \n  다. 원고는 소외 회사에 참여청년 이○현, 최○민, 조○우를 채용하였다는 채용자 명단통보서를 제출하고, 2021. 2. 10. 및 2021. 3. 5. 소외 회사로부터 위 참여청년들에 대한 각 지원금 3,660,460원(2회분)의 합계 10,981,380원을 지급받았다.\n  라. 소외 회사는 2022. 12. 12. 원고가 위 참여청년들에 대하여 ‘수행업무 허위작성(비IT업무 수행), 사전근로, 퇴직사실 은닉, 페이백’을 하였다는 이유로 「보조금 관리에 관한 법률」(이하 ‘보조금법’이라 한다) 제33조에 따라 원고에게 10,981,380원의 반환명령을 하였다. \n  마. 피고는 사전통지 절차를 거쳐 2023. 2. 28. 원고에게 보조금법 제31조의2 제2항 제1호, 제33조의2 제1항 제2호에 따라 5년간 보조금 지급을 제한하고 54,906,900원의 제재부가금을 부과하는 처분(이하 ‘이 사건 처분’이라 한다)을 하였다. \n  2. 제1 상고이유에 대하여\n  가. 관련 법리\n  행정권한의 위임은 행정관청이 법률에 따라 특정한 권한을 다른 행정관청에 이전하여 수임관청의 권한으로 행사하도록 하는 것으로서 권한의 법적인 귀속을 변경하는 것이므로, 법률이 위임을 허용하고 있는 경우에 한하여 인정된다. 이에 반하여, 행정권한의 내부 위임은 법률이 위임을 허용하고 있지 아니한 경우에도 행정관청의 내부적인 사무처리의 편의를 도모하기 위하여 그의 보조기관 또는 하급행정관청으로 하여금 그의 권한을 사실상 행사하게 하는 것이다. 그러므로 권한 위임의 경우에는 수임관청이 자기의 이름으로 그 권한행사를 할 수 있지만, 내부 위임의 경우 수임관청은 위임관청의 이름으로만 그 권한을 행사할 수 있을 뿐 자기의 이름으로는 그 권한을 행사할 수 없다(대법원 1986. 12. 9. 선고 86누569 판결, 대법원 1995. 11. 28. 선고 94누6475 판결 참조).\n  나. 보조금 지급 제한처분과 제재부가금 부과처분 권한의 위임을 허용하는 법률이 존재하는지 여부\n  1) 보조금법 제31조의2 제2항 제1호, 제33조의2 제1항 본문 제2호에 의하면, 고용노동부 소관 보조사업 또는 간접보조사업에 관한 보조금 지급 제한처분 및 제재부가금 부과처분 권한은 ‘중앙관서의 장’인 고용노동부장관에게 있다.\n  2) 피고가 권한 위임의 근거라고 주장하는 다음 각 법령의 규정들은 보조금 지급 제한처분 및 제재부가금 부과처분 권한을 지방고용노동청장 또는 그 지청장에게 위임할 수 있는 법령상 근거가 될 수 없고, 달리 고용노동부장관이 지방고용노동청장 또는 그 지청장에게 그러한 권한을 위임하는 것을 허용하는 법령상 근거를 발견할 수 없다. \n  가) 보조금법 제38조, 구 「보조금 관리에 관한 법률 시행령」(2024. 11. 5. 대통령령 제34979호로 개정되기 전의 것, 이하 ‘구 보조금법 시행령’이라 한다) 제17조 각 호는 ‘보조금법 제31조의2에 따른 보조금의 지급 제한’, ‘보조금법 제33조의2에 따른 제재부가금의 부과’를 중앙관서의 장이 소속 관서의 장에게 위임할 수 있는 사무로 규정하고 있지 않다. \n  구 보조금법 시행령 제17조 제6호가 ‘보조금법 제31조에 따른 보조금의 반환에 관한 처분’을 중앙관서의 장이 소속 관서의 장에게 위임할 수 있는 사무로 규정하고 있기는 하다. 그러나 보조금 반환처분과 보조금 지급 제한처분, 제재부가금 부과처분은 근거조항이 서로 다르고 각 처분의 실질도 다른 점, 이 사건 처분 이후 구 보조금법 시행령이 2024. 11. 5. 대통령령 제34979호로 개정되면서 보조금 지급 제한처분 및 제재부가금 부과처분에 대한 명시적인 권한 위임 근거가 규정된 것은 보조금 지급 제한처분, 제재부가금 부과처분 사무의 하급행정기관의 장 등에 대한 위임 근거가 없다는 반성적 고려에 의한 것으로 보이는 점(위와 같이 개정된 시행령 제17조 제7호, 제9호 참조) 등에 비추어 보면, 구 보조금법 시행령 제17조 제6호의 ‘보조금의 반환에 관한 처분’ 사무에 보조금 지급 제한처분 및 제재부가금 부과처분에 관한 사무가 포함된다고 보기 어렵다.\n  나) 정부조직법 제6조 제1항과 이에 기한 「행정권한의 위임 및 위탁에 관한 규정」(이하 ‘행정위임위탁규정’이라 한다) 제3조 제1항은 행정권한의 위임에 관한 일반적인 근거 규정이 된다(대법원 1990. 2. 27. 선고 89누5287 판결, 대법원 2023. 10. 26. 선고 2023두38424 판결 등 참조). 그러나 행정기관의 장이 위 각 규정에 따라 하급행정기관의 장 등에게 위임할 수 있는 권한은 행정위임위탁규정 제3조 제1항에서 규정하고 있는 ‘허가ㆍ인가ㆍ등록 등 민원에 관한 사무, 정책의 구체화에 따른 집행사무 및 일상적으로 반복되는 사무로서 그가 직접 시행하여야 할 사무를 제외한 일부 권한’에 한정된다. \n  보조금 지급 제한처분 및 제재부가금 부과처분은 상대방의 권리를 제한하거나 의무를 부과하는 침익적 처분으로서 지급 제한기간이나 제재부가금액 등 처분의 내용에 관한 재량권이 행정청에 부여되어 있으므로, 구체적인 사안에 따라 처분권한을 가진 행정청이 공ㆍ사익을 형량하여 재량판단을 하여야 할 재량행위에 해당한다. 따라서 위 각 처분에 관한 사무권한이 행정위임위탁규정 제3조 제1항에서 규정하고 있는 허가ㆍ인가ㆍ등록 등 민원에 관한 사무, 정책의 구체화에 따른 집행사무, 일상적 반복사무에 관한 권한에 해당한다고 보기 어렵다. \n  다) 정부조직법 제3조 제1항, 「고용노동부와 그 소속기관 직제」 제2조 제1항, 「고용노동부와 그 소속기관 직제 시행규칙」 제14조 등은 특별지방행정기관의 설치 근거 또는 고용노동부 소속 특별지방행정기관인 지방고용노동청의 내부적인 사무분장을 정한 규정에 불과하다. \n  3) 따라서 고용노동부훈령인 「고용노동분야 국고보조사업 관리규정」(이하 ‘이 사건 관리규정’이라 한다) 제44조 제1항 제2호, 제47조 제1항이 고용노동부 소속 특별지방행정기관인 지방고용노동청장 또는 그 지청장을 보조금 지급 제한처분 및 제재부가금 부과처분의 주체로 규정하고 있다고 하더라도, 그 의미가 ‘행정권한의 위임’에 해당한다고 볼 수 없고, ‘행정권한의 내부 위임’에 불과하다고 보아야 한다.\n  다. 특별지방행정기관이 내부 위임된 권한을 자기의 이름으로 행사하는 것이 위법한지 여부  \n  1) 앞서 본 관련 법리에 따르면, 행정권한의 위임 없이 내부 위임만 이루어진 위임관청의 권한을 수임관청이 자기의 이름으로 행사하는 행위는 처분권한의 귀속 주체를 정하고 있는 처분의 근거 법률을 위반한 것으로서 위법하다.\n  2) 한편 ‘특별지방행정기관’은 특정한 중앙행정기관에 소속되어, 당해 관할구역 내에서 시행되는 소속 중앙행정기관의 권한에 속하는 행정사무를 관장하는 국가의 지방행정기관으로서(정부조직법 제3조 제1항, 「행정기관의 조직과 정원에 관한 통칙」 제2조 제2호), 중앙행정기관을 대신하여 당해 관할구역 내의 행정사무를 수행한다는 특수성을 지닌다. \n  3) 그러나 특별지방행정기관이 내부 위임된 것에 불과한 중앙행정기관의 권한을 자기의 이름으로 행사하는 행위가 처분권한의 귀속 주체를 정하고 있는 처분의 근거 법률을 위반한 것임은 다른 행정관청의 경우와 마찬가지이고, 위와 같은 특수성만으로 내부 위임된 권한의 위법한 직접 행사가 정당화된다고 할 수 없다.\n  라. 판단\n  원심은, 판시와 같은 이유로 이 사건 관리규정 제44조 제1항 제2호, 제47조 제1항이 고용노동부장관에게 속하는 보조금법 제31조의2 제2항 제1호의 보조금 지급 제한처분, 보조금법 제33조의2 제1항 제2호의 제재부가금 부과처분의 각 권한을 피고에게 ‘내부 위임’하고 있다는 전제에서, 이 사건 처분에 대한 권한은 고용노동부장관에게 있고, 피고가 고용노동부장관을 적법하게 대리하여 이 사건 처분을 하였다고 볼 수도 없으므로, 피고가 ‘특별지방행정기관’에 해당한다고 하더라도, 피고가 자기의 이름으로 한 이 사건 처분은 권한 없는 자에 의한 것으로서 위법하여 취소되어야 한다고 판단하였다.\n  원심판결 이유를 앞서 본 법리에 비추어 살펴보면, 원심의 위와 같은 판단은 정당하고, 상고이유 주장과 같이 처분권한에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  3. 제2 상고이유에 대하여\n  취소소송의 소송물은 그 처분의 취소원인이 되는 위법성 일반이고, 개개의 위법사유는 공격방어방법에 불과하므로, 개개의 위법사유를 판단할 때 원고가 정한 주장의 순서에 기속되어 그에 따라 판단할 필요는 없다. \n  원고는 주위적으로 이 사건 처분의 처분사유가 존재하지 않는다는 등의 주장을 하고, 예비적으로 피고가 적법한 처분권한을 보유하고 있지 않다는 주장을 하였는데, 원심이 원고의 예비적 주장을 받아들여 원고의 청구를 인용하고, 나머지 주장에 대하여는 판단하지 아니하였다고 하더라도, 그와 같은 원심의 판단에 상고이유 주장과 같이 주위적 주장에 관한 판단누락, 심리미진 또는 석명권의 불행사로 판결에 영향을 미친 잘못이 있다고 할 수 없다.\n  4. 제3 상고이유에 대하여\n  이 부분 상고이유는 원심이 판단하지 아니한 원고의 주위적 주장에 관한 것으로서 적법한 상고이유가 되지 못한다. \n  5. 결론\n  상고를 기각하고, 상고비용은 패소자가 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 노태악(재판장) 서경환 신숙희(주심) 마용주"
  },

    "사건종류명": "일반행정",
    "판결유형": "판결",
    "판시사항": "폐기물관리법 제17조 제9항에서 사업장폐기물사업자의 사업장을 인수한 자가 사업장폐기물배출자의 공법상 의무를 승계하는 대상으로 정한 ‘그 사업장폐기물’의 의미 및 여기에 인수 당시 해당 경매 목적물인 사업장이 아닌 다른 장소에 방치된 사업장폐기물도 포함되는지 여부(원칙적 적극) / 인수자에게 위와 같은 사업장폐기물에 관한 공법상 의무가 승계된다고 볼 수 없는 예외적인 경우",
    "판결요지": "폐기물관리법 제2조 제3호, 제17조 제1항에 따르면, ‘사업장폐기물’은 대기환경보전법, 물환경보전법 또는 소음ㆍ진동관리법에 따라 배출시설을 설치ㆍ운영하는 사업장이나 그 밖에 대통령령으로 정하는 사업장에서 발생하는 폐기물을 의미하고, ‘사업장폐기물배출자’는 사업장폐기물을 배출하는 사업자를 의미한다.\n  폐기물관리법 제17조 제9항은 \"민사집행법에 따른 경매, 채무자 회생 및 파산에 관한 법률에 따른 환가나 국세징수법ㆍ관세법 또는 지방세징수법에 따른 압류재산의 매각, 그 밖에 이에 준하는 절차에 따라 사업장폐기물배출자의 사업장 전부 또는 일부를 인수한 자는 그 사업장폐기물과 관련한 권리와 의무를 승계한다.\"라고 규정하고 있다. \n  폐기물관리법 제17조 제9항은, 폐기물관리법 제17조 제7항이 2010. 7. 23. 법률 제10389호로 개정되면서, 당초 \"민사집행법에 따른 경매 등에 따라 사업장폐기물배출자의 사업장 전부 또는 일부를 인수한 자는 ‘그 사업장에 방치된 폐기물’을 적절하게 처리하여야 한다.\"라고 규정하였던 것이 이와 같이 ‘그 사업장폐기물’과 관련한 권리와 의무를 승계한다고 변경된 것이다. \n  폐기물관리법 제17조 제9항은 방치되는 사업장폐기물의 발생을 예방하기 위하여 오염원인자 책임원칙을 확장한 특별규정으로서, 민사집행법에 따른 경매 등에 따라 사업장폐기물배출자의 사업장을 인수한 자가 사업장폐기물배출자의 공법상 권리ㆍ의무를 승계한다는 취지이다.\n  이와 같은 관련 규정의 내용, 개정 연혁, 입법 취지 등에 비추어 보면, 폐기물관리법 제17조 제9항에서 사업장폐기물사업자의 사업장을 인수한 자가 사업장폐기물배출자의 공법상 의무를 승계하는 대상으로 정한 ‘그 사업장폐기물’은 해당 경매 목적물인 사업장에서 발생된 사업장폐기물을 의미하고, 여기에는 인수 당시에 해당 경매 목적물인 사업장이 아닌 다른 장소에 방치된 사업장폐기물도 포함된다. \n  다만 인수자가 인수 당시에 경매 목적물인 사업장이 아닌 다른 장소에 방치된 사업장폐기물이 존재한다는 사실을 알지 못하였고 그와 같이 알지 못한 데 정당한 사유가 있었다는 등 특별한 사정이 있는 경우에는, 인수자에게 해당 사업장폐기물에 관한 공법상 의무까지 승계된다고 볼 수 없다.",
    "참조조문": "구 폐기물관리법(2010. 7. 23. 법률 제10389호로 개정되기 전의 것) 제17조 제7항(현행 제17조 제9항 참조), 폐기물관리법 제2조 제3호, 제17조 제1항, 제9항",
    "참조판례": "대법원 2002. 10. 22. 선고 2002다46331 판결(공2002하, 2797), 대법원 2021. 8. 26. 선고 2019다226548 판결",
    "판례내용": "【원고, 상고인】                유한회사 ○○산업 (소송대리인 법무법인 저스티스 담당변호사 유은상)\n【피고, 피상고인】 영산강유역환경청장 (소송대리인 법무법인(유한) 서울센트럴 담당변호사 천혜진 외 3인)\n【원심판결】  광주고법 2023. 12. 7. 선고 2023누11909 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 광주고등법원에 환송한다. \n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심이 인정한 사실관계는 다음과 같다.\n  가. 원고는 폐기물처리업(중간재활용업) 등을 목적으로 설립된 회사이고, 주식회사 △△△(이하 ‘소외 1 회사’라 한다)는 전남 장성군 (이하 생략) 및 그 지상 공장건물(이하 ‘이 사건 사업장’이라 한다)에서 폐기물처리업(종합재활용업) 등을 영위하던 회사이다. \n  나. 소외 1 회사는 2013. 10. 4.부터 2015. 5. 14.까지 여러 차례에 걸쳐 유한회사 □□환경(이하 ‘소외 2 회사’라 한다)에, 이 사건 사업장에서 이루어진 공정에서 발생한 지정폐기물인 광재 합계 10,303t(이하 ‘이 사건 폐기물’이라 한다)의 처리를 위탁하였다. 소외 2 회사는 위탁받은 이 사건 폐기물에 토사를 섞어 익산시 ◇◇면에 있는 폐석산(이하 ‘이 사건 매립지’라 한다)에 매립하였는데, 그곳에서 발생한 침출수가 인근 하천으로 유입되어 환경오염이 발생하였다. \n  다. 피고는 2016. 11. 30. 소외 1 회사에 대하여, ‘소외 2 회사가 폐기물의 처리 기준 등에 맞게 폐기물을 처리할 능력이 있는지를 확인하지 아니하고 소외 2 회사에 지정폐기물인 광재의 처리를 위탁하여 사업장폐기물배출자의 의무를 위반하였다.’는 이유로, 구 폐기물관리법(2017. 1. 17. 법률 제14532호로 개정되기 전의 것) 제48조 제2호에 따라 이 사건 폐기물의 처리 등을 명하는 조치명령을 하였으나, 소외 1 회사는 이 조치명령을 이행하지 않았다.\n  라. 원고는 2022. 1. 3. 임의경매절차에서 소외 1 회사 소유의 이 사건 사업장과 사업장에 있는 기계, 기구 등을 매수하여 소유권을 취득하였다. \n  마. 피고는 2022. 8. 25. 원고에 대하여, 폐기물관리법 제17조 제9항에 따라 ‘원고가 경매를 통하여 이 사건 사업장을 인수함으로써 소외 1 회사의 사업장폐기물인 이 사건 폐기물과 관련한 의무를 승계하였다.’는 이유로, 이 사건 매립지에 방치된 이 사건 폐기물 중 1,497.875t 및 침출수 1,846t을 처리할 것 등을 명하는 조치명령(이하 ‘이 사건 처분’이라 한다)을 하였다. \n  2. 판단\n  가. 관련 규정과 법리\n  1)                폐기물관리법 제2조 제3호, 제17조 제1항에 따르면, ‘사업장폐기물’은 대기환경보전법, 물환경보전법 또는 소음ㆍ진동관리법에 따라 배출시설을 설치ㆍ운영하는 사업장이나 그 밖에 대통령령으로 정하는 사업장에서 발생하는 폐기물을 의미하고, ‘사업장폐기물배출자’는 사업장폐기물을 배출하는 사업자를 의미한다.\n                 폐기물관리법 제17조 제9항(이하 ‘이 사건 조항’이라 한다)은 \"민사집행법에 따른 경매, 「채무자 회생 및 파산에 관한 법률」에 따른 환가나 국세징수법ㆍ관세법 또는 지방세징수법에 따른 압류재산의 매각, 그 밖에 이에 준하는 절차에 따라 사업장폐기물배출자의 사업장 전부 또는 일부를 인수한 자는 그 사업장폐기물과 관련한 권리와 의무를 승계한다.\"라고 규정하고 있다. \n  이 사건 조항은, 폐기물관리법 제17조 제7항이 2010. 7. 23. 법률 제10389호로 개정되면서, 당초 \"민사집행법에 따른 경매 등에 따라 사업장폐기물배출자의 사업장 전부 또는 일부를 인수한 자는 ‘그 사업장에 방치된 폐기물’을 적절하게 처리하여야 한다.\"라고 규정하였던 것이 이와 같이 ‘그 사업장폐기물’과 관련한 권리와 의무를 승계한다고 변경된 것이다. \n  이 사건 조항은 방치되는 사업장폐기물의 발생을 예방하기 위하여 오염원인자 책임원칙을 확장한 특별규정으로서, 민사집행법에 따른 경매 등에 따라 사업장폐기물배출자의 사업장을 인수한 자가 사업장폐기물배출자의 공법상 권리ㆍ의무를 승계한다는 취지이다(대법원 2002. 10. 22. 선고 2002다46331 판결, 대법원 2021. 8. 26. 선고 2019다226548 판결 등 참조).\n  2) 이와 같은 관련 규정의 내용, 개정 연혁, 입법 취지 등에 비추어 보면, 이 사건 조항에서 사업장폐기물사업자의 사업장을 인수한 자가 사업장폐기물배출자의 공법상 의무를 승계하는 대상으로 정한 ‘그 사업장폐기물’은 해당 경매 목적물인 사업장에서 발생된 사업장폐기물을 의미하고, 여기에는 인수 당시에 해당 경매 목적물인 사업장이 아닌 다른 장소에 방치된 사업장폐기물도 포함된다. \n  다만 인수자가 인수 당시에 경매 목적물인 사업장이 아닌 다른 장소에 방치된 사업장폐기물이 존재한다는 사실을 알지 못하였고 그와 같이 알지 못한 데 정당한 사유가 있었다는 등 특별한 사정이 있는 경우에는, 인수자에게 해당 사업장폐기물에 관한 공법상 의무까지 승계된다고 볼 수 없다. 그 구체적인 이유는 다음과 같다. \n  가) 헌법 제10조가 정하고 있는 행복추구권에서 파생되는 자기결정권 내지 일반적 행동자유권은 이성적이고 책임감 있는 사람의 자기 운명에 대한 결정ㆍ선택을 존중하되 그에 대한 책임은 스스로 부담하는 것을 전제로 한다. 자기책임의 원리는 이와 같이 자기결정권의 한계논리로서 책임부담의 근거로 기능하는 동시에, 자기가 결정하지 않은 것이나 결정할 수 없는 것에 대하여는 책임을 지지 않고, 책임부담의 범위도 스스로 결정한 결과 내지 그와 상관관계가 있는 부분에 국한됨을 의미하는 책임의 한정원리로 기능한다. 자기책임의 원리는 법적 제재가 위반행위에 대한 책임의 소재와 전혀 상관없이 이루어지도록 법률이 규정하는 것을 금지한다(헌법재판소 2004. 6. 24. 선고 2002헌가27 전원재판부 결정, 헌법재판소 2021. 1. 28. 선고 2017헌마592 전원재판부 결정 등 참조).\n  한편 법률의 해석은 헌법 규정과 그 취지를 반영하여야 하고, 어떤 법률조항에 대하여 여러 갈래의 해석이 가능한 경우에는 그중 헌법에 부합하는 의미를 채택함으로써 위헌성을 제거하는 합헌적 법률해석을 하여야 한다(대법원 2009. 2. 12. 선고 2004두10289 판결, 대법원 2024. 2. 29. 선고 2023다294791 판결 등 참조).\n  나) 폐기물관리법 제17조 제8항은 \"사업장폐기물배출자가 그 사업을 양도하거나 사망한 경우 또는 법인이 합병ㆍ분할한 경우에는 그 양수인ㆍ상속인 또는 합병ㆍ분할 후 존속하는 법인이나 합병ㆍ분할에 의하여 설립되는 법인은 그 사업장폐기물과 관련한 권리와 의무를 승계한다.\"라고 규정하고 있다. 이는 사업장폐기물배출자인 종전 사업자의 지위가 포괄적으로 승계되거나 기존 영업이 동일성을 유지한 채 계속되는 경우 사업장폐기물과 관련한 권리ㆍ의무의 승계를 규율하기 위한 규정이다. \n  그런데 이 사건 조항은 위와 달리 민사집행법에 따른 경매 등 절차에 따라 사업장을 구성하는 부동산이나 시설의 전부 또는 일부를 특정승계하는 경우를 규율대상으로 삼고 있다. 이러한 승계의 성격이나 그 내용상의 차이 등을 고려하면, 단순히 민사집행법에 따른 경매 등으로 사업장 전부 또는 일부를 매수한 인수자에게 승계되는 사업장폐기물 관련 권리ㆍ의무의 범위를 반드시 폐기물관리법 제17조 제8항이 적용되는 경우와 동일하게 보아야 하는 것은 아니다.\n  또한 환경보전과 국민생활의 질적 향상 등 공익적 목적을 위하여 이 사건 조항에 따라 민사집행법에 따른 경매 등으로 사업장폐기물배출자의 사업장을 인수한 자에게 그 사업장에서 발생된 사업장폐기물과 관련한 공법상 권리ㆍ의무가 승계된다고 하더라도, 아래에서 보는 것처럼 사업장폐기물이 방치된 장소가 해당 경매 등의 목적물인 사업장 안에 있는 경우와 그렇지 않은 경우는 승계의 범위를 다르게 해석할 필요가 있다.\n  다) 민사집행법에 따른 경매 등 절차에 참여하여 그 목적물인 사업장을 인수하려는 자는 장소가 특정 내지 한정된 사업장의 현황을 파악한 후 스스로 판단하여 자기의 책임하에 매수신청을 하는 것이 일반적이므로, 그 사업장에 사업장폐기물이 방치되었다면 인수자로서는 그와 같은 사업장폐기물의 존재를 알게 될 가능성이 크다. 또한 사업장폐기물배출자의 사업장을 구성하는 자산이 타인에게 인수된 경우, 해당 사업장에 방치된 사업장폐기물에 관하여는 현재의 소유자로서 그 장소를 지배하고 있는 인수자가 이를 효과적으로 제거할 수 있는 지위에 있게 된다. 나아가 그 사업장폐기물의 적정한 처리에 따른 해당 자산의 가치 상승이나 사용ㆍ수익의 이점 증대 등 경제적ㆍ기능적 이익은 해당 자산의 소유자인 인수자가 향유하게 된다.\n  이에 비하여 경매 등의 목적물인 사업장이 아닌 다른 장소에 사업장폐기물이 방치된 경우에는 그 소재지가 전국적 범위로 확장될 수 있으므로 인수자가 경매 등의 과정에서 그와 같이 방치된 사업장폐기물의 존재를 파악하는 것이 훨씬 어렵고, 이를 확인하는 것이 사실상 불가능할 수도 있다. 더욱이 사업장폐기물배출자의 사업장이 아닌 다른 장소에 방치된 사업장폐기물에 관하여는 일반적으로 경매 등의 목적물을 인수한 자의 지배가 미치지 않는다.\n  만약 이 사건 조항의 효력 범위를 적절히 제한하지 않는다면, 인수자가 사업장이 아닌 다른 장소에 방치된 사업장폐기물의 존재를 알지 못하였거나 예상하지 못하였음을 탓할 수 없는 경우에도 경매 등 목적물의 감정가와 매각대금의 차액을 훨씬 넘는 금액을 폐기물 처리비용으로 부담하게 될 수 있고, 인수자의 비용 부담으로 사업장폐기물이 적정하게 처리되더라도 인수자로서는 어떠한 경제적ㆍ기능적 이익을 얻지 못하게 되어, 인수자의 재산권을 과도하게 침해하는 결과를 초래할 수 있다.\n  라) 이상의 사정 등을 고려하면, 인수자가 경매 등의 목적물인 사업장이 아닌 다른 장소에 방치된 사업장폐기물의 존재를 알지 못하였고 그와 같이 알지 못한 데 정당한 사유가 있었다는 등 특별한 사정이 있는 경우에까지 인수자에게 그러한 사업장폐기물의 처리에 관한 공법상 의무가 승계된다고 이 사건 조항을 해석하는 것은, 인수자의 통제권 또는 결정권이 미치지 않는 영역에 대하여 책임을 지게 하는 것으로서 자기책임 원리와 과잉금지 원칙에 어긋나게 된다. \n  나. 이 사건에 관한 판단 \n  앞서 본 사실관계를 이러한 법리에 비추어 살펴본다.\n  원고가 임의경매로 인수한 이 사건 사업장은 전남 장성군에 위치하고 있는 반면, 소외 1 회사가 배출한 이 사건 폐기물은 이 사건 사업장이 아닌 익산시에 있는 이 사건 매립지에 방치되어 있다. 그러므로 원고가 인수 당시에 이 사건 폐기물이 존재한다는 사실을 알지 못하였고, 그와 같이 알지 못한 데 정당한 사유가 있었다는 등 특별한 사정이 인정된다면, 이 사건 폐기물은 이 사건 조항에 따라 원고에게 소외 1 회사의 그 처리에 대한 공법상 의무가 승계되는 사업장폐기물에 해당하지 아니한다고 볼 수 있다. 나아가 기록에 의하면, 원고는 원심에서 인수 당시에 이 사건 폐기물이 존재한다는 사실을 알지 못하였고 그와 같이 알지 못한 데 정당한 사유가 있었다는 취지로 주장하였다.\n  그럼에도 원심은, 민사집행법에 따른 경매 등에 따라 사업장폐기물배출자의 사업장을 인수한 자는 해당 사업장이 아닌 다른 장소에 방치된 사업장폐기물에 관하여도 이 사건 조항에 따라 일괄적으로 사업장폐기물배출자의 공법상 의무를 전부 승계한다고 단정한 나머지, 원고에게 이와 같은 정당한 사유가 있었다는 등 특별한 사정이 있었는지에 관하여 심리하지 아니한 채, 곧바로 이 사건 처분 사유가 존재한다고 판단하였다. 원심판단에는 이 사건 조항에서 규정한 민사집행법에 따른 경매 등에 따라 사업장폐기물배출자의 사업장을 인수한 자에게 승계되는 사업장폐기물과 관련한 권리ㆍ의무의 범위에 관한 법리를 오해하여 필요한 심리를 다하지 아니함으로써 판결에 영향을 미친 잘못이 있다. 이를 지적하는 취지의 상고이유 주장은 이유 있다.\n  3. 결론 \n  나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 이흥구(재판장) 오석준 노경필(주심) 이숙연"
  },

    "판례내용": "【원고, 상고인】                ○○○ 주식회사 (소송대리인 법무법인(유한) 해광 담당변호사 유헌종 외 1인)\n【피고, 피상고인】 익산시장 (소송대리인 법무법인(유한) 강남 담당변호사 박창신 외 1인)\n【원심판결】  광주고법 2025. 2. 12. 선고 (전주)2022누1505 판결         \n【주    문】\n  상고를 기각한다.  고비용은 원고가 부담한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심이 인정한 사실관계는 다음과 같다.\n  가. 원고는 합성고무 제조업 등을 목적으로 설립된 회사이고, 주식회사 △△△(이하 ‘소외 1 회사’라 한다)은 안산시 단원구에 있는 토지 및 그 지상 공장건물(이하 ‘이 사건 사업장’이라 한다)에서 철강주조 제조업 등을 영위하던 회사이다.\n  나. 소외 1 회사가 2012. 11.경부터 2015. 9.경까지 여러 차례에 걸쳐 유한회사 □□□(이하 ‘소외 2 회사’라 한다)에 이 사건 사업장에서 이루어진 공정에서 발생한 폐기물인 화학점결 폐주물사 합계 약 1,054,770kg(이하 ‘이 사건 폐기물’이라 한다)의 처리를 위탁하였다. 소외 2 회사는 위탁받은 이 사건 폐기물을 사용하여 성토재를 만든 후 익산시 낭산면에 있는 폐석산(이하 ‘이 사건 매립지’라 한다)에 매립하였는데, 그곳에서 환경오염이 발생하였다.\n  다. 안산시장이 2019. 9. 23. 소외 1 회사에 대하여 ‘소외 2 회사가 폐기물 처리기준 등에 맞게 폐기물을 처리할 능력이 있는지 확인하지 아니하고 소외 2 회사에 이 사건 폐기물의 처리를 위탁하였다.’는 이유로 이 사건 폐기물 중 일부의 처리 등을 명하는 조치명령을 하였으나, 소외 1 회사는 그 조치명령을 이행하지 않았다. 이에 피고가 2021. 5. 12.경부터 2021. 7. 30.경까지 이 사건 매립지에 부적정 처리된 폐기물 중 일부에 대한 행정대집행을 하였다.\n  라. 원고는 소외 1 회사 소유의 이 사건 사업장에 관한 임의경매절차에서 2021. 6. 22. 이를 매수하여 소유권을 취득하였다.\n  마. 피고는 2021. 7. 26. 원고에 대하여 ‘원고가 경매로 이 사건 사업장을 인수함으로써 소외 1 회사의 사업장폐기물인 이 사건 폐기물과 관련한 의무를 승계하였다.’는 이유로 폐기물관리법 제17조 제9항에 따라 위 행정대집행에 소요된 비용을 납부하라는 내용의 명령(이하 ‘이 사건 처분’이라 한다)을 하였다.\n  2. 제1 상고이유에 대하여\n  폐기물관리법 제17조 제9항(이하 ‘이 사건 조항’이라 한다)은 \"민사집행법에 따른 경매, 「채무자 회생 및 파산에 관한 법률」 에 따른 환가나 국세징수법ㆍ관세법 또는 지방세징수법에 따른 압류재산의 매각, 그 밖에 이에 준하는 절차에 따라 사업장폐기물배출자의 사업장 전부 또는 일부를 인수한 자는 그 사업장폐기물과 관련한 권리와 의무를 승계한다.\"라고 규정하고 있다.\n  원심은, 이 사건 조항에서 규정하고 있는 ‘사업장 전부 또는 일부를 인수한 자’에는 사업장을 구성하는 부동산만을 민사집행법에 따른 경매 등으로 인수한 자가 포함되고, 그 사업 자체의 인수 또는 그와 동일시할 수 있을 정도의 핵심 영업시설 인수를 요구하지 아니한다고 판단하였다. 관련 법리와 원심이 적법하게 채택하여 조사한 증거들에 비추어 살펴보면, 원심의 이러한 판단은 정당하고 거기에 상고이유 주장과 같이 이 사건 조항에서 정한 ‘사업장 전부 또는 일부를 인수한 자’의 해석에 관한 법리를 오해하는 등으로 판결에 영향을 미친 잘못이 없다.\n  3. 제2 상고이유에 대하여\n  가. 관련 규정과 법리\n  1)                폐기물관리법 제2조 제3호, 제17조 제1항에 따르면, ‘사업장폐기물’은 대기환경보전법, 물환경보전법 또는 소음ㆍ진동관리법에 따라 배출시설을 설치ㆍ운영하는 사업장이나 그 밖에 대통령령으로 정하는 사업장에서 발생하는 폐기물을 의미하고, ‘사업장폐기물배출자’는 그와 같은 사업장폐기물을 배출하는 사업자를 의미한다.\n  이 사건 조항으로 개정되기 전의 구 폐기물관리법(2010. 7. 23. 법률 제10389호로 개정되기 전의 것) 제17조 제7항은 민사집행법에 따른 경매 등 절차에 따라 사업장폐기물배출자의 사업장 전부 또는 일부를 인수한 자가 \"그 사업장에 방치된 폐기물을 적절하게 처리하여야 한다.\"라고 규정하고 있었으나, 이 사건 조항에서는 앞서 본 것처럼 \"그 사업장폐기물과 관련한 권리와 의무를 승계한다.\"라는 것으로 변경되었다.\n  이 사건 조항은 방치되는 사업장폐기물의 발생을 예방하기 위하여 오염원인자 책임원칙을 확장한 특별규정으로서, 민사집행법에 따른 경매 등 절차에 따라 사업장폐기물배출자의 사업장을 인수한 자가 사업장폐기물배출자의 공법상 권리ㆍ의무를 승계한다는 취지이다(대법원 2002. 10. 22. 선고 2002다46331 판결, 대법원 2021. 8. 26. 선고 2019다226548 판결 등 참조).\n  2) 위와 같은 관련 규정의 내용, 개정 연혁, 입법 취지 등에 비추어 보면, 이 사건 조항에서 사업장폐기물배출자의 사업장을 인수한 자에게 사업장폐기물배출자의 공법상 의무가 승계되는 대상으로 정한 ‘그 사업장폐기물’은 해당 경매 등의 목적물인 사업장에서 발생된 사업장폐기물을 의미하고, 여기에는 인수 당시 그 사업장이 아닌 다른 장소에 방치된 사업장폐기물도 포함된다.\n  다만 인수자가 인수할 당시 해당 경매 등의 목적물인 사업장이 아닌 다른 장소에 방치된 사업장폐기물이 존재한다는 사실을 알지 못하였고 그와 같이 알지 못한 데 정당한 사유가 있었다는 등 특별한 사정이 있는 경우에는, 그 사업장폐기물에 관한 공법상 의무까지 인수자에게 승계된다고 볼 수 없다. 구체적인 이유는 다음과 같다.\n  가) 헌법 제10조가 정하고 있는 행복추구권에서 파생되는 자기결정권 내지 일반적 행동자유권은 이성적이고 책임감 있는 사람의 자기 운명에 대한 결정ㆍ선택을 존중하되 그에 대한 책임은 스스로 부담하는 것을 전제로 한다. 자기책임 원리는 이와 같이 자기결정권의 한계논리로서 책임부담의 근거로 기능하는 동시에, 자기가 결정하지 않은 것이나 결정할 수 없는 것에 대하여는 책임을 지지 않고, 책임부담 범위도 스스로 결정한 결과 내지 그와 상관관계가 있는 부분에 국한됨을 의미하는 책임의 한정원리로 기능한다. 자기책임 원리는 법적 제재가 위반행위에 대한 책임의 소재와 전혀 상관없이 이루어지도록 법률이 규정하는 것을 금지한다(헌법재판소 2004. 6. 24. 선고 2002헌가27 전원재판부 결정, 헌법재판소 2021. 1. 28. 선고 2017헌마592 전원재판부 결정 등 참조).\n  한편 법률의 해석은 헌법 규정과 그 취지를 반영하여야 하고, 어떤 법률조항에 관하여 여러 갈래의 해석이 가능한 경우에는 그중 헌법에 부합하는 의미를 채택함으로써 위헌성을 제거하는 합헌적 법률해석을 하여야 한다(대법원 2009. 2. 12. 선고 2004두10289 판결, 대법원 2024. 2. 29. 선고 2023다294791 판결 등 참조).\n  나) 폐기물관리법 제17조 제8항은 \"사업장폐기물배출자가 그 사업을 양도하거나 사망한 경우 또는 법인이 합병ㆍ분할한 경우에는 그 양수인ㆍ상속인 또는 합병ㆍ분할 후 존속하는 법인이나 합병ㆍ분할에 의하여 설립되는 법인은 그 사업장폐기물과 관련한 권리와 의무를 승계한다.\"라고 규정하고 있다. 이는 사업장폐기물배출자인 종전 사업자의 지위가 포괄적으로 승계되거나 기존 영업이 동일성을 유지한 채 계속되는 경우에 사업장폐기물과 관련한 권리ㆍ의무의 승계를 규율하기 위한 규정이다.\n  이와 달리 이 사건 조항은 민사집행법에 따른 경매 등 절차에 따라 사업장을 구성하는 부동산이나 시설의 전부 또는 일부를 특정승계하는 경우를 규율대상으로 삼고 있다. 이러한 승계사유의 성격 차이를 고려하면, 단순히 민사집행법에 따른 경매 등으로 사업장 전부 또는 일부를 매수한 인수자에게 승계되는 사업장폐기물 관련 권리ㆍ의무의 범위를 반드시 폐기물관리법 제17조 제8항이 적용되는 경우와 동일하게 보아야 하는 것은 아니다.\n  또한 환경보전과 국민생활의 질적 향상 등 공익적 목적을 위하여 이 사건 조항에 따라 민사집행법에 따른 경매 등으로 사업장폐기물배출자의 사업장을 인수한 자에게 그 사업장에서 발생된 사업장폐기물과 관련한 공법상 권리ㆍ의무가 승계된다고 하더라도, 아래에서 보는 것처럼 사업장폐기물이 방치된 장소가 해당 경매 등의 목적물인 사업장 안에 있는 경우와 그렇지 않은 경우는 승계의 범위를 다르게 해석할 필요가 있다.\n  다) 민사집행법에 따른 경매 등 절차에 참여하여 그 목적물인 사업장을 인수하려는 자는 장소가 특정 내지 한정된 사업장의 현황을 파악한 후 스스로 판단하여 자기의 책임하에 매수신청을 하는 것이 일반적이므로, 그 사업장에 사업장폐기물이 방치되었다면 인수자로서는 그와 같은 사업장폐기물의 존재를 알게 될 가능성이 크다. 또한 사업장폐기물배출자의 사업장을 구성하는 자산이 타인에게 인수된 경우, 해당 사업장에 방치된 사업장폐기물에 관하여는 현재의 소유자로서 그 장소를 지배하고 있는 인수자가 이를 효과적으로 제거할 수 있는 지위에 있게 된다. 나아가 그 사업장폐기물의 적정한 처리에 따른 해당 자산의 가치 상승이나 사용ㆍ수익의 이점 증대 등 경제적ㆍ기능적 이익은 해당 자산의 소유자인 인수자가 향유하게 된다.\n  이에 비하여 경매 등의 목적물인 사업장이 아닌 다른 장소에 사업장폐기물이 방치된 경우에는 그 소재지가 전국적 범위로 확장될 수 있으므로 인수자가 경매 등의 과정에서 그와 같이 방치된 사업장폐기물의 존재를 파악하는 것이 훨씬 어렵고, 이를 확인하는 것이 사실상 불가능할 수도 있다. 더욱이 사업장폐기물배출자의 사업장이 아닌 다른 장소에 방치된 사업장폐기물에 관하여는 일반적으로 경매 등의 목적물을 인수한 자의 지배가 미치지 않는다.\n  만약 이 사건 조항의 효력 범위를 적절히 제한하지 않는다면, 인수자가 사업장이 아닌 다른 장소에 방치된 사업장폐기물의 존재를 알지 못하였거나 예상하지 못하였음을 탓할 수 없는 경우에도 경매 등 목적물의 감정가와 매각대금의 차액을 훨씬 넘는 금액을 폐기물 처리비용으로 부담하게 될 수 있고, 인수자의 비용 부담으로 사업장폐기물이 적정하게 처리되더라도 인수자로서는 어떠한 경제적ㆍ기능적 이익을 얻지 못하게 되어, 인수자의 재산권을 과도하게 침해하는 결과를 초래할 수 있다.\n  라) 이상의 사정 등을 고려하면, 인수자가 경매 등의 목적물인 사업장이 아닌 다른 장소에 방치된 사업장폐기물의 존재를 알지 못하였고 그와 같이 알지 못한 데 정당한 사유가 있었다는 등 특별한 사정이 있는 경우에까지 인수자에게 그러한 사업장폐기물의 처리에 관한 공법상 의무가 승계된다고 이 사건 조항을 해석하는 것은, 인수자의 통제권 또는 결정권이 미치지 않는 영역에 대하여 책임을 지게 하는 것으로서 자기책임 원리와 과잉금지 원칙에 어긋나게 된다. \n  나. 이 사건에 관한 판단\n  1) 원심은, 민사집행법에 따른 경매 등 절차에 따라 사업장폐기물배출자의 사업장을 인수한 자는 해당 사업장이 아닌 다른 장소에 방치된 사업장폐기물에 관하여도 이 사건 조항에 따라 사업장폐기물배출자의 공법상 의무를 전부 승계한다고 보았다. 나아가 원심은, 이 사건 사업장에 관한 임의경매절차에서 매각물건명세서에 ‘안산시가 소외 1 회사에 대하여 조치명령 처분을 진행 중이고, 익산시에서 불법폐기물 처리 행정대집행을 실시할 예정이다. 이 사건 조항에 의하면 민사집행법에 따른 경매로 이 사건 사업장을 인수한 자는 소외 1 회사에 대한 조치명령과 행정대집행에 따른 비용납부의무를 승계한다.’라는 취지의 내용이 기재되어 있었다는 등의 이유를 들어, 원고로서는 위 임의경매절차에서 이 사건 사업장을 인수하는 경우 이 사건 폐기물과 관련된 소외 1 회사의 의무를 승계하게 될 것임을 충분히 예상할 수 있었다고 판단하였다.\n  2) 원심판결 이유를 앞서 본 사실관계와 관련 법리에 비추어 살펴본다. \n  원고가 임의경매절차에서 인수한 이 사건 사업장은 안산시에 있는 반면, 소외 1 회사가 배출한 이 사건 폐기물은 익산시에 있는 이 사건 매립지에 방치되어 있었다. 따라서 원고가 사업장 인수 당시에 이 사건 폐기물의 존재를 알지 못하였고 그와 같이 알지 못한 데 정당한 사유가 있었다는 등 특별한 사정이 있다면 이 사건 폐기물은 그 처리와 관련한 소외 1 회사의 공법상 의무가 원고에게 승계되는 사업장폐기물에 해당하지 않게 된다. 그런데 원심이 적법하게 채택하여 조사한 증거 등에 비추어 보면, 원고로서는 임의경매절차에서 매각물건명세서의 기재 등을 통하여 이 사건 사업장을 인수하는 경우 이 사건 폐기물 관련 의무를 승계하게 될 것임을 충분히 예상할 수 있었다고 봄이 타당하다. \n  결국 원심이 이 사건 조항을 해석하면서 자기책임 원리를 고려함이 없이 사업장 인수자는 그 사업장이 아닌 다른 장소에 방치된 사업장폐기물과 관련한 사업장폐기물배출자의 공법상 의무도 전부 승계한다고 본 것은 잘못이나, 이 사건 조항에 따라 원고에게 이 사건 폐기물 처리와 관련한 소외 1 회사의 의무가 승계된다고 본 원심의 결론은 정당하고, 위와 같은 원심의 잘못은 판결 결과에 영향이 없다.\n  4. 제3 상고이유에 대하여 \n  원심은 판시와 같은 이유로, 이 사건 처분이 원고에게 부당하게 과도한 수준의 비용을 부담시키는 것으로 보기는 어렵다고 하여 이 사건 처분의 적법성을 인정하면서, 다만 피고로서는 향후 이 사건 폐기물과 관련하여 원고에게 추가로 조치명령을 내리거나 행정대집행에 따른 비용납부명령을 할 경우 비례 원칙과 평등 원칙에 어긋나지 않도록 적정한 재량권을 행사할 것이 요구된다고 판단하였다. 관련 법리와 원심이 적법하게 채택하여 조사한 증거 등에 비추어 살펴보면, 원심의 위와 같은 판단은 정당하고 거기에 상고이유 주장과 같이 폐기물관리법 제49조 제1항, 제2항 및 행정대집행법 제2조의 해석에 관한 법리오해 등으로 판결에 영향을 미친 잘못이 없다.\n  5. 결론\n  상고를 기각하고 상고비용은 패소자가 부담하게 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 오경미(재판장) 권영준 엄상필(주심) 박영재"

    "판시사항": "[1] 공공주택 특별법 부칙(2020. 12. 22.) 제6조 제1항에 따라 공공주택사업자가 아닌 자가 건설한 공공건설임대주택 중 분양전환이 완료되지 않은 세대의 분양전환에 관하여 2020. 12. 22. 법률 제17734호로 개정된 공공주택 특별법 제50조의3의 규정이 적용되게 되었더라도, 임대사업자에게 구 임대주택법 제21조 제2항 등에서 정하는 ‘부도 등’이 발생한 경우, 분양전환 승인권자인 시장 등이 구 임대주택법 제21조 제2항, 제4항, 제5항 등의 규정을 적용하여 임차인 등의 분양전환 승인신청에 대하여 이를 승인할 수 있는지 여부(적극)\n\n [2] 구 임대주택법 제21조에 따른 분양전환 승인이 행정처분에 해당하는지 여부(적극) 및 구 임대주택법 제21조 제1항에서 정한 ‘임대의무기간 경과’에 기초한 분양전환 승인이 있은 후 해당 임대사업자에 대하여 같은 조 제2항에서 정한 임대사업자의 ‘부도 등’의 사유가 발생한 경우, 이를 요건으로 같은 임대주택에 대하여 다시 분양전환 승인을 할 수 있는지 여부(적극)\n\n [3] 구 임대주택법 제21조에 따른 임대주택 분양전환 승인이 해당 임대주택을 임차인에게 우선 분양전환할 것인지, 제3자에게 매각할 것인지까지 승인하는 것인지 여부(소극)",
    "판결요지": "",
    "참조조문": "[1] 구 임대주택법(2015. 8. 28. 법률 제13499호 민간임대주택에 관한 특별법으로 전부 개정되기 전의 것) 제21조 제1항, 제2항, 제3항, 제4항, 제5항, 민간임대주택에 관한 특별법 부칙(2015. 8. 28.) 제6조 제2항 제1호, 구 임대주택법 시행령(2015. 12. 28. 대통령령 제26763호로 개정되기 전의 것) 제3조, 구 공공주택 특별법(2016. 1. 19. 법률 제13805호로 개정되기 전의 것) 제2조 제1호의2, 공공주택 특별법 제50조의3 제1항, 제4항, 부칙(2020. 12. 22.) 제6조 제1항 / [2] 구 임대주택법(2015. 8. 28. 법률 제13499호 민간임대주택에 관한 특별법으로 전부 개정되기 전의 것) 제21조 / [3] 구 임대주택법(2015. 8. 28. 법률 제13499호 민간임대주택에 관한 특별법으로 전부 개정되기 전의 것) 제21조",
    "참조판례": "[2][3] 대법원 2015. 3. 26. 선고 2012두20304 판결 / [2] 대법원 2020. 7. 23. 선고 2015두48129 판결",
    "판례내용": "【원고, 상고인】                ○○산업 주식회사 (소송대리인 법무법인(유한) 광장 담당변호사 문흥대 외 3인)\n【피고, 피상고인】 광양시장 (소송대리인 법무법인(유한) 동인 담당변호사 임수정 외 1인)\n【원심판결】  광주고법 2024. 12. 19. 선고 2024누10460 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 원고가 부담한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출한 서면의 기재는 상고이유를 보충하는 범위에서)를 판단한다. \n  1. 제1 상고이유에 관하여\n  원심은, 원고가 이 사건 처분에 관하여 행정절차법이 정한 ‘당사자 등’이 아니어서 행정절차법상 사전통지, 의견제출의 기회 부여, 고지 등의 대상에 해당하지 않고, 원고가 ‘당사자 등’에 해당한다고 하더라도 원고의 의견진술권이나 방어권 행사에 실질적으로 지장이 초래되었다고 볼 수 없는 특별한 사정이 있으므로, 이 사건 처분을 취소하여야 할 정도의 절차적 하자가 없다고 판단하였다.\n  원심판결 이유를 관련 법리와 적법하게 채택하여 조사한 증거들에 비추어 살펴보면, 원심의 이유 설시에 다소 적절하지 않은 부분이 있으나, 이 사건 처분을 취소하여야 할 정도의 절차적 하자가 없다고 본 원심의 결론은 정당하고, 거기에 상고이유 주장과 같이 절차적 하자에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. \n  2. 제2 상고이유에 관하여\n  가. 관련 규정\n  1) 임대사업자의 부도 등에 따른 우선 분양전환\n  구 임대주택법(2015. 8. 28. 법률 제13499호 「민간임대주택에 관한 특별법」 으로 전부 개정되기 전의 것, 이하 같다) 제21조는 제1항에서 \"임대사업자가 임대의무기간이 지난 후 주택법 제16조에 따라 사업계획승인을 받아 건설한 공공건설임대주택을 분양전환하는 경우에는 각 호의 어느 하나에 해당하는 임차인에게 우선 분양전환하여야 한다.\"라고, 제2항에서 \"제1항에도 불구하고 임대사업자의 부도 등[제2조 제7호 (나)목의 경우에는 같은 목에 따른 대통령령으로 정하는 기간에 1년을 더한 기간을 초과하여 이자를 내지 아니한 경우에만 부도 등으로 본다. 이하 이 조에서 같다], 파산, 그 밖에 대통령령으로 정하는 경우에는 분양전환 당시 해당 임대주택에 거주하는 임차인에게 우선 분양전환할 수 있다.\"라고 규정하고 있다. \n  이어 제3항에서 \"제1항 및 제2항에 따라 건설임대주택을 분양전환하고자 하는 경우 임대사업자(국가ㆍ지방자치단체ㆍ한국토지주택공사 또는 지방공사를 제외한다)는 국토교통부령으로 정하는 서류를 첨부하여 시장ㆍ군수ㆍ구청장에게 제출하고, 분양전환에 관한 승인(이하 ‘분양전환 승인’이라 한다)을 신청하여야 한다.\"라고, 제4항 전문에서 \"시장ㆍ군수ㆍ구청장은 분양전환 승인 신청을 받은 경우 30일 이내에 승인을 하여야 한다.\"라고, 제5항에서 \"임대사업자가 제1항에 따른 임대의무기간 경과 후 또는 부도 등, 파산, 그 밖에 대통령령으로 정하는 경우가 발생한 후 각각 6개월 이상 제3항에 따른 분양전환 승인을 신청하지 아니하는 경우에는 임차인(임차인대표회의가 구성된 경우는 임차인대표회의를 말한다)은 임차인 총수의 3분의 2 이상의 동의를 받아 직접 분양전환 승인을 신청할 수 있다.\"라고 규정하고 있다. \n  2) 2015년 관련 규정의 체계 변화와 경과 규정의 내용 \n  구 임대주택법이 2015. 8. 28. 법률 제13499호로 전부 개정되면서 2015. 12. 29. 시행된 「민간임대주택에 관한 특별법」(이하 ‘민간임대주택법’이라 한다)은 종전의 구 임대주택법 제21조 등과 같은 분양전환 관련 규정을 두지 않았다. 다만 민간임대주택법 부칙(2015. 8. 28.) 제6조 제2항 제1호는 ‘이 법 시행 당시 「공공주택 특별법」 에 따른 공공주택사업자가 아닌 자가 주택도시기금의 자금을 지원받아 공공건설임대주택으로 건설한 주택에 대하여는 종전의 임대주택법 제2조 제2호의2에 따른 공공건설임대주택으로 보아 종전의 규정을 적용한다.’고 규정하여, 공공주택사업자가 아닌 자(이하 ‘민간 임대사업자’라 한다)가 건설한 공공건설임대주택에 대하여 종전의 구 임대주택법이 적용되도록 하였다(이하 ‘이 사건 경과규정’이라 한다). \n  한편 구 「공공주택 특별법」(2015. 8. 28. 법률 제13498호로 개정되어 2015. 12. 29. 시행된 후 2016. 1. 19. 법률 제13805호로 개정되기 전의 것)은 제2조 제1호의2에서 \"공공건설임대주택이란 제4조에 따른 공공주택사업자가 직접 건설하여 공급하는 공공임대주택을 말한다.\"라고 규정하였고, 이에 따라 민간 임대사업자가 건설한 공공건설임대주택은 구 「공공주택 특별법」 이 적용되는 공공건설임대주택에서는 제외되었다.\n  3) 「공공주택 특별법」 의 개정과 공공주택사업자가 아닌 자의 공공건설임대주택에 대한 우선 분양전환에 관한 적용례\n  2020. 12. 22. 법률 제17734호로 개정된「공공주택 특별법」 제50조의3은 우선 분양전환자격이 있는 임차인의 요건을 법률에 명시하고(제1항), 임차인의 우선 분양전환권 유무와 관계없이 공공주택사업자가 해당 임대주택을 제3자에게 매각하는 경우에도 임차인에게 통보한 우선 분양전환 가격으로 매각하도록 하였다(제4항).\n  그리고 그 부칙(2020. 12. 22.) 제6조는 ‘공공주택사업자가 아닌 자의 공공건설임대주택에 대한 우선 분양전환에 관한 적용례’라는 제목 아래 제1항에서 \"이 사건 경과규정에도 불구하고 제50조의3 등의 개정 규정은 분양전환이 완료되지 아니한 이 사건 경과규정에 따라 공공건설임대주택으로 보는 주택에 대해서도 적용하고, 이 경우 ‘공공주택사업자’는 ‘임대사업자’로 보고, ‘분양전환’은 ‘임대사업자 외의 자에게 매각하는 것’으로 보며, 제50조의3 제2항 전단 중 ‘임대의무기간이 지난 후’는 ‘종전의 규정에 따라 분양전환 승인을 받은 후’로 본다.\"고 규정하였다(이하 ‘이 사건 적용례’라 한다). 그런데 위 개정된「공공주택 특별법」 제50조의3은 종전 구 임대주택법 제21조에서 규정하고 있던 임대사업자의 ‘부도 등’에 따른 우선 분양전환과 관련하여 별다른 규정을 두고 있지 않다. \n  나. 이 부분의 쟁점\n  이 부분의 쟁점은「공공주택 특별법」 제50조의3 또는 그 부칙 제6조 제1항이 임대사업자의 ‘부도 등’ 발생에 따른 임차인에 대한 우선 분양전환 및 분양전환 승인과 관련된 명시적 규정을 두고 있지 않음에도, 분양전환 승인권자인 시장ㆍ군수ㆍ구청장이 구 임대주택법 제21조 제2항, 제4항, 제5항에 근거하여 임차인 또는 임차인대표회의의 신청에 의하여 임대사업자의 ‘부도 등’ 발생에 기초한 분양전환 승인을 할 수 있는지이다.\n  다. 판단\n  1) 이 사건 적용례에 따라 이 사건 아파트 중 분양전환이 완료되지 아니한 세대의 분양전환에 관하여「공공주택 특별법」 제50조의3의 개정 규정이 적용되게 되었다고 하더라도, 임대사업자에게 구 임대주택법 제21조 제2항, 구 임대주택법 시행령(2015. 12. 28. 대통령령 제26763호 민간임대주택법 시행령으로 전부 개정되기 전의 것) 제3조 제1항에서 정하는 ‘부도 등’이 발생한 경우 분양전환 승인권자인 시장ㆍ군수ㆍ구청장이 구 임대주택법 제21조 제2항, 제4항, 제5항 등의 규정을 적용하여 임차인 또는 임차인대표회의의 분양전환 승인신청에 대하여 분양전환 승인을 할 수 있다고 해석된다. 그 이유는 다음과 같다.\n  가) 이 사건 적용례는 문언 자체로「공공주택 특별법」 제50조의3에서 규정하고 있지 않은 종전의 구 임대주택법령상 제도가 여전히 존재하고 있음을 전제로 하고 있다. 즉,「공공주택 특별법」 제50조의3 제2항 전단은 \"공공주택사업자는 공공건설임대주택의 임대의무기간이 지난 후 해당 주택의 임차인에게 제1항에 따른 우선 분양전환 자격, 우선 분양전환 가격 등 우선 분양전환에 관한 사항을 통보하여야 한다.\"라고 규정하고 있는데, 이 사건 적용례는 위 규정의 ‘임대의무기간이 지난 후’를 ‘종전의 규정에 따라 분양전환 승인을 받은 후’로 본다고 규정하고 있다. 이는 이 사건 적용례의 시행 전후를 막론하고 여전히 구 임대주택법이 적용되고 있던 민간 임대사업자가 건설한 공공건설임대주택에 관하여 구 임대주택법 제21조에 따른 분양전환 승인이 이루어질 수 있음을 전제로 한 것으로 해석된다.\n  나) 임대사업자의 부도 등에 따른 우선 분양전환 규정이나 이 사건 경과규정, 이 사건 적용례는 모두 민간 임대사업자가 건설한 공공건설임대주택의 임차인을 보호하고 그 임차인과 임대사업자 사이에서 발생할 수 있는 분쟁 예방을 위하여 마련된 것이다. 이와 같이 입법이 이루어진 경위나 그 취지에 비추어 볼 때 이 사건 적용례 중「공공주택 특별법」 제50조의3에 관한 부분 역시 종전의 구 임대주택법령상 ‘부도 등’ 발생에 따른 임차인의 우선 분양전환권 및 그와 관련된 분양전환 승인 제도를 폐지하고자 하는 취지라고 보기는 어렵다.\n  다)「공공주택 특별법」 제50조의3            에서 ‘공공주택사업자의 부도나 파산 등에 따른 우선 분양전환’ 또는 ‘시장 등의 공공주택사업자에 대한 분양전환 승인’을 두고 있지 않은 것은 민간 임대사업자와 달리 국가 등 공공주택사업자의 부도, 파산과 같은 상황을 쉽사리 상정하기 어려운 데다가, 시장 등의 분양전환 승인을 통하여 국가 등을 포함하는 공공주택사업자의 분양전환을 통제하는 것이 법령의 체계상 맞지 않기 때문으로 보인다. 그런데 「공공주택 특별법」 의 입법 과정에서 불가피하게 과거 민간 임대사업자가 건설한 공공건설임대주택에 대한 규율도 필요하다고 보아 이 사건 적용례가 그에 대해 규율하게 된 것이고 제50조의3이 규율하는 것은 아니다. \n  따라서「공공주택 특별법」 제50조의3에 종전의 구 임대주택법 제21조에 대응하는 규정이 모두 열거되어 있지 않다는 이유만으로 이 사건 적용례에 따라 민간 임대사업자가 건설한 공공건설임대주택에 대한 구 임대주택법 규정의 적용이 모두 배제된다고 해석하기는 어렵다. 오히려 이 사건 경과규정에 따라 그간 적용되고 있던 종전의 구 임대주택법 규정 중 개정된「공공주택 특별법」 제50조의3의 내용에 대응하지 않는 부분은 여전히 적용되고 있다고 해석하는 것이 자연스럽다.\n  2) 원심은 판시와 같은 이유로, 이 사건 적용례 중「공공주택 특별법」 제50조의3에 관한 부분이 이 사건 아파트의 우선 분양전환에 관한 구 임대주택법 제21조 제2항의 적용을 배제하고 있는 것으로 볼 수 없다고 판단하였다. 원심의 판단은 앞서 본 법리에 기초한 것으로서 상고이유 주장과 같이 구 임대주택법 제21조에 관한 법리를 오해한 잘못이 없다.\n  3. 제3 상고이유에 관하여\n  가.                구 임대주택법 제21조에 의한 분양전환 승인은 ‘해당 임대주택의 임대의무기간 경과(제1항) 또는 임대사업자의 부도 등, 파산, 그 밖에 대통령령으로 정하는 경우(제2항)와 같은 분양전환 요건을 충족하는지’ 및 ‘분양전환 승인신청서에 기재된 분양전환 가격이 임대주택법령의 규정에 따라 적법하게 산정되었는지’를 심사하여 승인하는 행정처분에 해당한다(대법원 2015. 3. 26. 선고 2012두20304 판결, 대법원 2020. 7. 23. 선고 2015두48129 판결 참조). \n                 구 임대주택법 제21조 제1항에서 정한 ‘임대의무기간 경과’에 기초한 분양전환 승인과 구 임대주택법 제21조 제2항에서 정한 임대사업자의 ‘부도 등’ 발생에 기초한 분양전환 승인은 그 법령상 근거와 요건, 우선 분양전환의 대상이 되는 임차인의 범위 등에서 서로 구별된다. 더구나 임대의무기간이 경과하여 임대사업자 또는 임차인의 신청에 따라 구 임대주택법 제21조 제1항에 기초한 분양전환 승인이 이루어진 이후라고 하더라도, 임대사업자에게 ‘부도 등’의 사유가 발생한 경우 임차인의 주거 불안과 보증금 회수 곤란 등의 위험성을 방지할 필요성도 여전히 존재한다. \n  따라서 같은 임대주택에 대하여 구 임대주택법 제21조 제1항에 기초한 분양전환 승인이 이미 있었다고 하더라도, 해당 임대사업자에 대하여 구 임대주택법 제21조 제2항이 규정한 사유가 발생하였다면 재차 이를 요건으로 하는 분양전환 승인을 하는 것이 가능하다고 보아야 한다.\n  나. 원심은 판시와 같은 이유로, 이 사건 아파트에 관하여 구 임대주택법 제21조 제1항에 기초한 분양전환 승인이 있는 경우에도 분양전환 승인권자인 피고는 여전히 구 임대주택법 제21조 제2항에 기초한 이 사건 처분을 할 수 있다고 판단하였다. 원심의 판단은 위 법리에 기초한 것으로서 상고이유 주장과 같이 구 임대주택법 제21조 및 분양전환 승인에 관한 법리를 오해한 잘못이 없다.\n  4. 제4 상고이유에 관하여\n  원심은 판시와 같은 이유로, 원고가 1년 6개월을 초과하여 이 사건 융자금에 대한 이자를 내지 아니하여 구 임대주택법 제21조 제2항에서 규정한 임대사업자의 ‘부도 등’이 발생하였다고 판단하였다. \n  원심판결 이유를 관련 법리와 적법하게 채택하여 조사한 증거들에 비추어 살펴보면, 이러한 원심의 판단에 상고이유 주장과 같이 논리와 경험의 법칙을 위반하여 자유심증주의의 한계를 벗어나거나 구 임대주택법 제21조 제2항의 ‘부도 등’에 관한 법리를 오해한 잘못이 없다. \n  5. 제5 상고이유에 관하여\n  가.                구 임대주택법 제21조의 분양전환 승인이 해당 임대주택에 관하여 우선 분양전환권 있는 임차인의 존재 여부 또는 임차인의 우선 분양전환권 포기 여부를 심사하여 해당 임대주택을 임차인에게 우선 분양전환할 것인지 아니면 제3자에게 매각할 것인지까지 승인하는 것은 아니다(대법원 2015. 3. 26. 선고 2012두20304 판결 참조). \n  나. 원심은 이 사건 처분의 대상이 된 이 사건 아파트 각 세대의 임차인 중 일부가 구 임대주택법 제21조 제2항에 해당하는 임차인이 아니라고 하여 이 사건 처분이 위법하게 되는 것은 아니라고 판단하였다. 원심판결 이유를 위 법리와 적법하게 채택하여 조사한 증거들에 비추어 살펴보면, 이러한 원심의 판단에 상고이유 주장과 같이 필요한 심리를 다하지 않은 채 구 임대주택법상 분양전환 승인에 관한 법리를 오해한 잘못이 없다. \n  6. 결론 \n  그러므로 상고를 기각하고, 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 박영재(재판장) 오경미 권영준(주심) 엄상필"
  },

    "판시사항": "구 건축법 제79조 제1항과 제80조 제1항에 따른 시정명령과 이행강제금을 부과하기 위해서는 건축법 등을 위반한 상대방에게 고의ㆍ과실이 있어야 하는지 여부(원칙적 소극) 및 대지나 건축물의 위법상태를 시정할 수 있는 법률상 또는 사실상의 지위에 있는 자는 이를 직접 초래하거나 이에 관여하지 않았더라도 시정명령 등의 상대방이 될 수 있는지 여부(적극)",
    "판결요지": "",
    "참조조문": "구 건축법(2019. 4. 23. 법률 제16380호로 개정되기 전의 것) 제79조 제1항, 제80조 제1항",
    "참조판례": "대법원 2013. 9. 13. 선고 2012두20137 판결, 대법원 2022. 10. 14. 선고 2021두45008 판결(공2022하, 2252)",
    "판례내용": "【원고, 피상고인】                주식회사 ○○○ (소송대리인 법무법인 인의 담당변호사 이학민 외 1인)\n【피고, 상고인】 서울특별시 중구청장 (소송대리인 법무법인(유한) 지평 담당변호사 정원 외 2인)\n【원심판결】  서울고법 2022. 6. 10. 선고 2021누36051 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거에 따르면, 다음과 같은 사실을 알 수 있다. \n  가. 서울 중구 (이하 주소 생략)에는 지하 2층, 지상 5층으로 된, ‘(건물명 생략)’이라는 명칭의 집합건물(이하 ‘이 사건 건물’이라 한다)이 있다. 이 사건 건물은 그 전체가 구 유통산업발전법(2017. 10. 31. 법률 제14997호로 개정되어 2018. 5. 1. 시행되기 전의 것, 이하 같다) 제2조 제3호의 대규모점포에 해당한다(이하 이 사건 건물에 들어선 대규모점포를 ‘이 사건 대규모점포’라 한다).\n  나. 이 사건 건물의 대지는 총 5필지인데, 2016년 이전부터 그 대지 중 공개 공지에 가설 노점이 설치되어 있었다(이하 ‘이 사건 공개 공지 훼손’이라 한다). 또한 이 사건 건물의 지상 1층에는 외벽 등에 가설 노점을 설치하는 방식으로 2000년경 및 2010년경 각각 3.2㎡ 및 6.2㎡ 면적의 증축이 무단으로 이루어졌다(이하 ‘이 사건 1층 무단 증축’이라 하고, 이 사건 공개 공지 훼손과 합하여 ‘이 사건 각 위반 사항’이라 하며, 위 각 가설 노점을 ‘이 사건 각 가설 노점’이라 한다).\n  다. 원고는 2016. 9. 7.부터 2018. 7. 31.까지 이 사건 대규모점포에 관하여 구 유통산업발전법 제12조 제3항 및 구 유통산업발전법 시행규칙(2018. 5. 1. 산업통상자원부령 제297호로 개정되기 전의 것) 제6조 제1항에 따라 신고를 한 대규모점포 등 관리자의 지위에 있었다. 한편 원고는 이 사건 건물의 지상 4층, 5층에 있는 구분건물 전부와 그 대지 중 3필지 전부 및 나머지 2필지의 일부 지분에 관하여 소유권이전등기를 마치고 위 기간에 수탁자와 신탁계약을 체결하여 이를 신탁한 위탁자의 지위에도 있었다.\n  라. 피고는 2016. 9. 21.경부터 원고에게 이 사건 각 위반 사항에 대하여 구 건축법(2019. 4. 23. 법률 제16380호로 개정되기 전의 것, 이하 같다) 제79조 제1항에 따른 시정명령 등을 하였다. 이후 피고는 원고에게 시정명령을 이행하지 않았다는 사유로 구 건축법 제80조 제1항에 따라 2017. 3. 7. 이 사건 공개 공지 훼손에 관하여, 2017. 4. 25. 이 사건 1층 무단 증축에 관하여, 각각 151,304,040원과 404,000원(3.2㎡ 부분), 217,000원(6.2㎡ 부분)의 이행강제금을 부과하였다. 피고는 2018. 1. 11. 원고에게 구 건축법 제80조 제5항, 제1항에 따라 이 사건 공개 공지 훼손에 관하여 반복하여 181,618,030원의 이행강제금을 부과하였다(이하 위 4건의 이행강제금 부과를 통틀어 ‘이 사건 각 처분’이라 한다).\n  2. 원심의 판단\n  원심은, 원고가 이 사건 각 가설 노점에 대해서까지 관리자의 지위에 있었다고 보기 어렵고, 구 유통산업발전법상 대규모점포 등 관리자의 지위에 있었을 뿐인 원고에게 이 사건 각 가설 노점에 대하여 철거 등 조치를 취하거나 청구할 권원이 있었다고 볼 수 없으며, 원고가 이 사건 건물 중 일부 구분건물에 관하여 소유권이전등기를 마친 적이 있으나 이를 신탁하였으므로 소유자의 지위에 있었다고 볼 수도 없다는 등 그 판시와 같은 이유로, 구 건축법 제79조 제1항에 따른 시정명령의 수범자에 해당하지 아니하여 같은 법 제80조 제1항에 따른 이행강제금 부과의 상대방이 될 수 없는 원고에게 이루어진 이 사건 각 처분은 위법하여 무효라고 판단하였다.\n  3. 대법원의 판단\n  원심의 판단은 다음과 같은 이유에서 그대로 수긍하기 어렵다.\n  가. 구 건축법 제43조 제1항 제2호에 따르면, 상업지역의 환경을 쾌적하게 조성하기 위하여 일정한 용도와 규모의 건축물은 일반이 사용할 수 있도록 소규모 휴식시설 등의 공개 공지(空地: 공터) 또는 공개 공간을 설치하여야 한다. 그리고 같은 법 제35조 제1항 본문에 따르면, 건축물의 소유자나 관리자는 건축물, 대지 등을 같은 법 제43조에 적합하도록 유지ㆍ관리하여야 한다. 또한 구 건축법 제11조 제1항, 제14조 제1항에 따르면, 증축을 포함하여 건축물을 건축하려는 자는 건축허가를 받거나 미리 건축신고를 하여야 한다.\n  한편 구 건축법 제79조 제1항에 따르면, 대지나 건축물이 건축법 등에 위반되는 경우 허가권자는 그 건축물의 건축주ㆍ공사시공자ㆍ현장관리인ㆍ소유자ㆍ관리자 또는 점유자에게 시정명령을 할 수 있다. 구 건축법 제80조 제1항에 따르면, 같은 법 제79조 제1항에 따른 시정명령을 이행하지 아니하는 경우 이행강제금을 부과한다. 그리고 구 건축법 제80조 제5항에 따르면, 일정한 요건하에 그 시정명령이 이행될 때까지 반복하여 같은 조 제1항에 따른 이행강제금을 부과ㆍ징수할 수 있다.\n  나.                구 건축법 제79조 제1항과 제80조 제1항은 건축물의 안전과 기능ㆍ미관을 향상시켜 공공복리의 증진을 도모하기 위한 것으로서, 건축법 등을 위반한 객관적 사실이 있으면 위 규정에 따른 시정명령 등을 할 수 있고, 원칙적으로 그 상대방에게 고의ㆍ과실을 요하지 않으며, 대지나 건축물의 위법상태를 직접 초래하거나 이에 관여한 바 없다고 하더라도 이러한 위법상태를 시정할 수 있는 법률상 또는 사실상 지위에 있는 자는 그 상대방이 될 수 있다(대법원 2013. 9. 13. 선고 2012두20137 판결, 대법원 2022. 10. 14. 선고 2021두45008 판결 등 참조).\n  다. 원심판결 이유와 원심이 적법하게 채택하여 조사한 증거에 의하여 알 수 있는 다음과 같은 사정들을 앞서 든 법령 및 법리에 비추어 살펴보면, 이 사건 각 처분 당시 원고는 이 사건 각 위반 사항에 관하여 이 사건 건물의 ‘관리자’로서 그 위법상태를 시정할 수 있는 법률상 또는 사실상 지위에 있었고, 나아가 구 건축법 제79조 제1항과 제80조 제1항에 따른 시정명령과 이행강제금 부과의 상대방이 될 수 있었다고 봄이 타당하다.\n  1) 원고는 이 사건 각 처분과 그 전제가 되는 시정명령 등이 이루어질 당시 이 사건 건물에 들어선 이 사건 대규모점포에 관하여 대규모점포 등 관리자의 지위에 있었다. 구 유통산업발전법 제12조 제3항, 제2항, 제1항에 따르면 대규모점포 등 관리자는 대규모점포 등을 유지ㆍ관리하기 위하여 필요한 업무를 수행하고, 실제로 원고는 입점상인들로부터 관리비를 징수하는 등 이러한 업무를 수행하였다. 이 사건 건물은 그 전체가 대규모점포를 이루고 있으므로, 이 사건 대규모점포의 유지ㆍ관리를 위한 업무 수행에는 이 사건 건물에 대한 유지ㆍ관리가 수반된다. 이 사건의 경우 대규모점포 등 관리자가 이 사건 각 위반 사항에 관하여 필요한 유지ㆍ관리 행위를 하는 것이 점포소유자들의 소유권 행사와 충돌이 되거나 구분소유자들의 소유권을 침해할 우려가 있어 ‘구분소유와 관련된 사항’(구 유통산업발전법 제12조 제4항 참조)으로서 대규모점포 등 관리자의 업무에서 제외된다고 볼 구체적인 사정을 찾을 수도 없다. 그렇다면 원고는 특별한 다른 사정이 없는 한 대규모점포 등 관리자로서 이 사건 각 위반 사항에 관하여 필요한 유지ㆍ관리 행위를 할 수 있다. \n  2) 원고는 이 사건 각 처분과 그 전제가 되는 시정명령 등이 이루어질 당시 이 사건 건물의 지상 4층, 5층에 있는 구분건물 전부와 그 대지 중 3필지 전부 및 나머지 2필지의 일부 지분을 수탁자에게 신탁한 위탁자의 지위에 있었다. 수탁자와 체결한 신탁계약 내용에 따르면, 위탁자인 원고가 신탁부동산에 대하여 시설관리, 수선 등 보존행위 및 그 밖의 유지ㆍ관리를 위한 여러 업무를 수행할 책임을 지고, 실제로 원고는 신탁부동산의 관리ㆍ사용을 위하여 수탁자를 대위하여 제3자에게 신탁부동산에 관한 방해금지 등 가처분 신청이나 인도 청구 등을 직접 제기하여 일부 인용을 받기도 하였다. 집합건물의 공용부분이나 구분소유자의 공유에 속하는 건물의 대지 또는 부속시설을 제3자가 불법으로 점유하는 경우에 그 제3자에 대하여 방해배제 등을 청구하는 소송은 원칙적으로 구분소유자가 각각 또는 전원의 이름으로 할 수 있으므로(대법원 2003. 6. 24. 선고 2003다17774 판결 등 참조), 원고는 집합건물인 이 사건 건물의 대지나 공용부분에서 발생한 이 사건 각 위반 사항에 관하여 특별한 다른 사정이 없는 한 구분소유자인 수탁자를 대위하여 방해배제 등을 청구할 수도 있다.\n  3) 이 사건 건물이 집합건물로서 완공된 1994년경부터 이 사건 각 처분이 이루어질 때까지 이 사건 건물에 관하여 「집합건물의 소유 및 관리에 관한 법률」 상 당연히 설립하는 관리단이 현실적으로 활동하지 않았다. 한편 이 사건 각 처분이나 그 전제가 된 시정명령 등이 있기 전에도, 이 사건 건물에 관하여 발생한 이 사건 각 위반 사항과 별개의 건축법 등 위반에 대하여, 관리단이 아닌 원고에게 구 건축법 제79조 제1항에 따른 시정명령이나 그 불이행을 사유로 하는 이행강제금 부과가 수차례 이루어졌는데, 원고는 그 이행강제금을 모두 납부하였다. 원고는 이 사건 소송에서도 ‘이 사건 건물의 신축 당시부터 원고가 그 건물 전체를 전반적으로 관리해 왔다.’는 취지의 피고 주장을 명시적으로 다투지 않고 있다. 그렇다면 적어도 이 사건 건물의 완공 이후 이 사건 각 처분이 있던 무렵까지는 원고가 실질적으로 이 사건 건물을 관리하였다고 충분히 볼 수 있다.\n  라. 그런데도 원심은 그 판시와 같은 이유만으로, 이 사건 각 처분이 구 건축법 제79조 제1항과 제80조 제1항에 따른 시정명령과 이행강제금 부과의 상대방이 될 수 없는 원고에게 이루어진 것이어서 위법하여 무효라고 판단하였다. 이러한 원심의 판단에는 위 각 조항에 따른 처분의 상대방에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 취지의 상고이유 주장은 이유 있다.\n  4. 결론\n  나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 서경환(재판장) 노태악 신숙희 마용주(주심)"
  }
]

  (function() {
    const cases = JSON.parse(document.getElementById('cases-data').textContent);
    document.getElementById('notice-count').innerHTML = `<strong>총 ${cases.length}건</strong> · 2026년 대법원 행정 판례부터 수집 중`;
    const list = document.getElementById('list');
    cases.forEach((c, i) => {
      const div = document.createElement('div');
      div.className = 'case';
      const date = c.선고일자 ? `${c.선고일자.slice(0,4)}.${c.선고일자.slice(4,6)}.${c.선고일자.slice(6,8)}` : '';
      div.innerHTML = `
        <div class="doc-card" data-idx="${i}">
          <span class="doc-date">${date}</span>
          <span class="doc-title">${c.사건명}</span>
          <span class="doc-tag">${c.사건번호}</span>
        </div>
        <div class="case-body" id="body-${i}">
          ${field('판시사항', c.판시사항)}
          ${field('판결요지', c.판결요지)}
          ${field('참조조문', c.참조조문)}
          ${field('참조판례', c.참조판례)}
          ${field('전문', c.판례내용, true)}
        </div>
      `;
      list.appendChild(div);
    });

    list.addEventListener('click', (e) => {
      const header = e.target.closest('.doc-card');
      if (!header) return;
      const body = document.getElementById(`body-${header.dataset.idx}`);
      body.classList.toggle('open');
    });
  })();

  function field(label, text, isFullText) {
    if (!text) return '';
    return `
      <div class="field">
        <h4>${label}</h4>
        <p class="${isFullText ? 'full-text' : 'box'}">${escapeHtml(text)}</p>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
