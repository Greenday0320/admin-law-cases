    "판결요지": "공증인법 제1조의2 제1호는 제2조에서 정하는 공증에 관한 직무를 수행할 수 있도록 법무부장관으로부터 제11조에 따라 임명을 받은 사람과 제15조의2에 따라 공증인가를 받은 자(이하 ‘인가공증인’이라고 한다)를 ‘공증인’으로 정의하고 있다. 인가공증인은 구성원 변호사 중에서 2명 이상의 공증담당변호사를 지정하여 소속 지방검찰청을 거쳐 법무부장관에게 신고하여야 하고(공증인법 제15조의3 제1항), 인가공증인의 직무는 그 주사무소에서 공증담당변호사가 수행하며(공증인법 제17조의2 제1항), 공증담당변호사 각자가 인가공증인을 대표한다(같은 조 제2항). 공증인법 시행령 제7조의2는 \"인가공증인은 공증에 관한 문서를 작성할 때 소속, 사무소의 소재지 및 명칭을 적고, 법 제15조의3에 따라 신고된 공증담당변호사가 공증담당변호사라고 표시한 뒤 서명날인하여야 한다.\"라고 규정하고 있다. 이와 같이 실제 인가공증인의 공증에 관한 직무가 공증담당변호사에 의해 이루어지는 점을 고려하여, 공증인법 제15조의5는 \"공증에 관한 법령을 적용할 때에는 그 성격에 반하지 아니하는 한 공증담당변호사를 공증인으로 본다.\"라고 규정하고 있다.\n공증인법 제7조 제1항은 \"공증인은 촉탁인으로부터 수수료, 일당 및 여비를 받는다.\"라고 규정하고 있고, 같은 조 제5항은 ‘수수료, 일당, 여비, 실비 및 보관료’에 관한 사항을 법무부령으로 정하도록 위임하고 있다. 공증인 수수료 규칙은 위와 같은 법률의 명시적 위임에 따라 제정된 것으로서, 공증 업무를 담당하는 공증인이라면 위 규칙을 준수할 의무가 있다.\n  앞서 살핀 공증인법령의 내용과 체계에 비추어, 총회의 의사록을 인증하는 등 인가공증인의 공증에 관한 직무를 실제로 수행하는 공증담당변호사는 앞서 본 공증인 수수료 규칙을 준수할 의무를 부담하고, 이러한 법령 적용이 공증인 수수료 규칙의 성격에 반하는 경우에 해당한다고 볼 만한 사정도 없다.",
    "참조조문": "공증인법 제1조의2 제1호, 제7조 제1항, 제5항, 제15조의3 제1항, 제15조의5, 제17조의2, 공증인법 시행령 제7조의2",
    "참조판례": "",
    "판례내용": "【원고, 상고인】 법무법인 ○○ 외 2인 (소송대리인 법무법인(유한) 엘케이비앤파트너스 담당변호사 박경용 외 2인)\n【피고, 피상고인】 법무부장관\n【원심판결】 서울고법 2024. 12. 13. 선고 2024누34346 판결\n【주    문】\n  상고를 모두 기각한다.  상고비용은 원고들이 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 따르면 아래 사실을 알 수 있다.\n  가. 원고 법무법인 ○○(이하 ‘원고 1 법무법인’이라고 한다)는 2004. 3. 19. 설립되어 피고로부터 2010. 2. 7. 공증인가를 받고 2015. 2. 7. 재인가를 받은 인가공증인이다. 원고 2, 원고 3은 원고 1 법무법인 소속 공증담당변호사이고, 소외인은 원고 1 법무법인의 구성원변호사 겸 공증담당변호사로 활동하다 2021. 4. 21. 탈퇴한 사람이다.\n  나. 소외인은 2020. 10. 24.부터 2020. 12. 23.까지 원고 1 법무법인의 공증담당변호사 자격으로 8회의 총회에 참석하여 총회의 진행, 결의의 절차 및 내용 등을 검사하였다.\n  다. 소외인이 2020. 12. 30. 퇴직금 지급 여부 등에 관한 분쟁을 이유로 사직서를 제출하자, 원고 1 법무법인은 소속 공증담당변호사인 원고 2, 원고 3으로 하여금 소외인이 참석하였던 총회의 의사록에 대하여 인증서를 작성하게 하였다.\n  라. 공증인법 제7조 제5항의 위임을 받아 ‘공증인의 수수료·일당, 여비 및 실비에 관한 사항’을 규정함을 목적으로 하는 「공증인 수수료 규칙」 제21조 제2항은 법인 등기에 필요한 의사록 인증의 수수료를 3만 원으로 정하고 있는데, 원고 1 법무법인은 원고 2, 원고 3이 인증서를 작성한 위 총회 의사록 공증 중 7건에 관하여 위 규칙을 초과한 수수료(150만 원 내지 200만 원)를 수령하였다.\n  마. 공증인법 제78조 제1항에 따라 공증인을 감독하는 피고는 2021. 3. 4. 원고 1 법무법인에 대하여 공증인법 제80조에 따라 공증서류 검열을 실시한 후, 원고들이 위 나. 내지 라.항 기재 행위를 함으로써 공증인법, 「법인의사록에 대한 인증사무 처리지침」, 「공증인 수수료 규칙」에서 정한 인증방식을 위반하고 수수료를 과다 수수하였음을 이유로, 공증인징계위원회에 원고들에 대한 징계의결을 요구하였다.\n  바. 공증인징계위원회는 2022. 2. 16. 원고들에 대한 징계를 의결하였고, 이에 따라 피고는 2022. 4. 21. 원고 1 법무법인, 원고 2에 대하여 각 과태료 200만 원, 원고 3에 대하여 견책 처분을 통지하였다(이하 ‘이 사건 각 징계처분’이라고 한다).\n  2. 원고 2, 원고 3이 「공증인 수수료 규칙」의 수범자에 해당하지 않는다는 주장에 관한 판단\n  가. 공증인법 제1조의2 제1호는 공증인법 제2조에서 정하는 공증에 관한 직무를 수행할 수 있도록 법무부장관으로부터 공증인법 제11조에 따라 임명을 받은 사람과 공증인법 제15조의2에 따라 공증인가를 받은 자(이하 ‘인가공증인’이라고 한다)를 ‘공증인’으로 정의하고 있다. 인가공증인은 구성원 변호사 중에서 2명 이상의 공증담당변호사를 지정하여 소속 지방검찰청을 거쳐 법무부장관에게 신고하여야 하고(공증인법 제15조의3 제1항), 인가공증인의 직무는 그 주사무소에서 공증담당변호사가 수행하며(공증인법 제17조의2 제1항), 공증담당변호사 각자가 인가공증인을 대표한다(같은 조 제2항). 공증인법 시행령 제7조의2는 \"인가공증인은 공증에 관한 문서를 작성할 때 소속, 사무소의 소재지 및 명칭을 적고, 법 제15조의3에 따라 신고된 공증담당변호사가 공증담당변호사라고 표시한 뒤 서명날인하여야 한다.\"라고 규정하고 있다. 이와 같이 실제 인가공증인의 공증에 관한 직무가 공증담당변호사에 의해 이루어지는 점을 고려하여, 공증인법 제15조의5는 \"공증에 관한 법령을 적용할 때에는 그 성격에 반하지 아니하는 한 공증담당변호사를 공증인으로 본다.\"라고 규정하고 있다.\n공증인법 제7조 제1항은 \"공증인은 촉탁인으로부터 수수료, 일당 및 여비를 받는다.\"라고 규정하고 있고, 같은 조 제5항은 ‘수수료, 일당, 여비, 실비 및 보관료’에 관한 사항을 법무부령으로 정하도록 위임하고 있다. 「공증인 수수료 규칙」은 위와 같은 법률의 명시적 위임에 따라 제정된 것으로서, 공증 업무를 담당하는 공증인이라면 위 규칙을 준수할 의무가 있다.\n앞서 살핀 공증인법령의 내용과 체계에 비추어, 총회의 의사록을 인증하는 등 인가공증인의 공증에 관한 직무를 실제로 수행하는 공증담당변호사는 앞서 본 「공증인 수수료 규칙」을 준수할 의무를 부담하고, 이러한 법령 적용이 「공증인 수수료 규칙」의 성격에 반하는 경우에 해당한다고 볼 만한 사정도 없다.\n  나. 원심은, 원고 1 법무법인 소속 공증담당변호사인 원고 2, 원고 3이 「공증인 수수료 규칙」의 수범자에 해당하므로, 위 규칙이 이 사건 각 징계처분의 근거 규정이 될 수 있다고 판단하였다.\n  다. 원심판단은 앞서 본 법리에 기초한 것으로서, 상고이유 주장과 같이 침익적 행정행위의 근거가 되는 행정법규 해석에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  3. 재량권 일탈·남용 주장에 관한 판단\n  원심은, 이 사건 각 징계처분이 재량권을 일탈·남용하여 위법하다고 보기 어렵다고 판단하였다.\n  관련 법리 및 적법하게 채택한 증거들에 비추어 보면 원심판단에 상고이유 주장과 같이 재량권 일탈·남용에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  4. 의무 해태를 탓할 수 없는 정당한 사유 주장에 관한 판단\n  원심은, 소외인이 2020. 12. 30. 퇴직금 지급 여부 등에 관한 분쟁을 이유로 사직서를 제출하자, 원고 1 법무법인이 원고 2, 원고 3으로 하여금 소외인이 참석하였던 총회의 의사록에 대하여 인증서를 작성하게 한 것에 대하여, 원고들에게 의무 해태를 탓할 수 없는 정당한 사유가 인정된다고 보기 어렵다고 판단하였다.\n  관련 법리 및 적법하게 채택한 증거들에 비추어 보면 원심판단에 상고이유 주장과 같이 의무 해태를 탓할 수 없는 정당한 사유에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  5. 양벌규정에 따른 법인의 면책사유 주장에 관한 판단\n  원심은, 원고 1 법무법인이 공증인법 제84조의2 단서에서 면책사유로 정한 ‘위반행위를 방지하기 위하여 해당 업무에 관한 상당한 주의와 감독’을 하였다고 보기 어렵다고 판단하였다.\n  관련 법리 및 적법하게 채택한 증거들에 비추어 보면 원심판단에 상고이유 주장과 같이 양벌규정에 따른 법인의 면책사유에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  6. 결론\n  그러므로 상고를 모두 기각하고 상고비용은 패소자들이 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 엄상필(재판장) 오경미(주심) 권영준 박영재"

    "판결유형": "판결",
    "판시사항": "[1] 항고소송의 대상인 ‘처분’의 의미 및 행정청의 행위가 항고소송의 대상이 될 수 있는지 결정하는 방법\n [2] 교육부가 국공립대학의 교육·연구 및 학생지도 비용에 대한 감사 결과를 바탕으로 甲 국립대학교 총장에게 소속 교원 乙 등에 대한 교육·연구 및 학생지도 비용 환수 및 신분상 조치를 하도록 요구함에 따라, 총장이 교내 이메일을 통해 乙 등에게 ‘환수금 납입 안내’라는 제목의 문서를 첨부하여 교육·연구 및 학생지도 비용에 관한 환수금을 납부해 달라는 요청을 통지한 사안에서, 위 환수 통지는 행정청이 행하는 구체적 사실에 관한 법집행으로서 공권력의 행사인 ‘처분’에 해당한다고 한 사례",
    "판결요지": "[1] 항고소송의 대상인 ‘처분’이란 \"행정청이 행하는 구체적 사실에 관한 법집행으로서의 공권력의 행사 또는 그 거부와 그 밖에 이에 준하는 행정작용\"을 말한다(행정소송법 제2조 제1항 제1호). 행정청의 행위가 항고소송의 대상이 될 수 있는지는 추상적·일반적으로 결정할 수 없고, 구체적인 경우에 관련 법령의 내용과 취지, 그 행위의 주체·내용·형식·절차, 그 행위와 상대방 등 이해관계인이 입는 불이익 사이의 실질적 견련성, 법치행정의 원리와 그 행위에 관련된 행정청이나 이해관계인의 태도 등을 고려하여 개별적으로 결정해야 한다.\n [2] 교육부가 국공립대학의 교육·연구 및 학생지도 비용에 대한 감사 결과를 바탕으로 甲 국립대학교 총장에게 소속 교원 乙 등에 대한 교육·연구 및 학생지도 비용 환수 및 신분상 조치를 하도록 요구함에 따라, 총장이 교내 이메일을 통해 乙 등에게 ‘환수금 납입 안내’라는 제목의 문서를 첨부하여 교육·연구 및 학생지도 비용에 관한 환수금을 납부해 달라는 요청을 통지한 사안에서, 국립대학의 장의 지급 결정이나 환수 통지는 교육·연구 및 학생지도 비용의 지급과 환수에 관한 교직원의 권리·의무에 영향을 미치는 점, 교육공무원인 乙 등은 국가공무원법상 성실 의무(제56조), 복종의 의무(제57조) 등을 부담하므로 환수 통지를 따라야 하고, 환수 통지에 따라 정해진 기한까지 환수금을 납부하지 않으면 환수금을 완납할 때까지 교육·연구 및 학생지도 비용을 지급받지 못하는 등 환수 통지로 직접적인 법적 불이익을 입는 점, 위 환수 통지는 국립대학의 회계 설치 및 재정 운영에 관한 법률 제28조 제2항, 국립대학의 회계 설치 및 재정 운영에 관한 법률 시행규칙 제22조 제5항의 순차 위임을 받아 총장이 제정한 甲 대학교 재정 및 회계의 운영에 관한 규정 제11조 제5항에 따라 이루어진 것인 점, 국립대학의 장의 환수 행위의 처분성을 인정하지 않으면 교직원이 교육·연구 및 학생지도 비용 환수에 관하여 다툼이 있는 경우, 법적 분쟁을 실효적으로 해결할 다른 구제수단을 찾기도 어려운 점을 종합하면, 위 환수 통지는 행정청이 행하는 구체적 사실에 관한 법집행으로서 공권력의 행사인 ‘처분’에 해당하는데도, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례.",
    "참조조문": "[1] 행정소송법 제2조 제1항 제1호 / [2] 행정소송법 제2조 제1항 제1호, 국립대학의 회계 설치 및 재정 운영에 관한 법률 제7조 제1항, 제11조 제1항, 제28조, 국립대학의 회계 설치 및 재정 운영에 관한 법률 시행규칙 제22조 제1항, 제5항, 제6항",
    "참조판례": "[1] 대법원 2010. 11. 18. 선고 2008두167 전원합의체 판결(공2010하, 2279), 대법원 2021. 1. 14. 선고 2020두50324 판결(공2021상, 391), 대법원 2023. 2. 23. 선고 2021두44548 판결(공2023상, 611)",
    "판례내용": "【원고, 상고인】 원고 1 외 3인 (소송대리인 변호사 박정민)\n【피고, 피상고인】 ○○대학교 총장 (소송대리인 법무법인 씨앤아이 담당변호사 문성식 외 2인)\n【원심판결】 대전고법 2024. 2. 1. 선고 2023누12949 판결\n【주    문】\n  원심판결을 파기한다.  제1심판결을 취소하고, 사건을 대전지방법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 관련 법리 및 법령\n  가. 항고소송의 대상인 ‘처분’이란 \"행정청이 행하는 구체적 사실에 관한 법집행으로서의 공권력의 행사 또는 그 거부와 그 밖에 이에 준하는 행정작용\"을 말한다(행정소송법 제2조 제1항 제1호). 행정청의 행위가 항고소송의 대상이 될 수 있는지는 추상적·일반적으로 결정할 수 없고, 구체적인 경우에 관련 법령의 내용과 취지, 그 행위의 주체·내용·형식·절차, 그 행위와 상대방 등 이해관계인이 입는 불이익 사이의 실질적 견련성, 법치행정의 원리와 그 행위에 관련된 행정청이나 이해관계인의 태도 등을 고려하여 개별적으로 결정하여야 한다(대법원 2010. 11. 18. 선고 2008두167 전원합의체 판결 참조).\n  나. 「국립대학의 회계 설치 및 재정 운영에 관한 법률」(이하 ‘국립대학회계법’이라 한다)에 따르면, 국립대학의 장은 법령의 범위에서 재정 및 회계의 운영에 관한 규정(이하 ‘재정·회계규정’이라 한다)을 제정하고(제7조 제1항), 국립대학의 재정을 안정적으로 확보하고 그 운용의 자율성과 효율성을 제고하기 위하여 각 국립대학에 국가 및 지방자치단체의 지원금과 대학의 자체수입금을 통합·운영하는 대학회계를 둔다(제11조 제1항). 국립대학의 장은 소속 교직원에게 대학회계의 재원으로 교육·연구 및 학생지도 등을 위한 비용을 지급할 수 있고(제28조 제1항), 그 비용 지급에 관한 기본적인 사항은 교육부령으로 정하며, 국립대학의 장은 교육부령으로 정하는 범위에서 세부적인 사항을 재정·회계규정으로 정할 수 있다(제28조 제2항).\n  이러한 위임을 받아 「국립대학의 회계 설치 및 재정 운영에 관한 법률 시행규칙」(이하 ‘국립대학회계법 시행규칙’이라 한다) 제22조는, 국립대학의 장은, 국립대학회계법 제28조에 따른 교육·연구 및 학생지도 등을 위한 비용(이하 ‘교육·연구 및 학생지도 비용’이라 한다)을 교직원에게 지급할 때에는 ‘교육·연구·학생지도 등을 위한 계획서와 그 계획서에 따른 실적에 따라 심사위원회의 심사를 거쳐 개인별로 차등지급할 것’, ‘통상의 업무 수행은 실적으로 인정해서는 안 되며, 급여보조성 경비로 지급하지 아니할 것’ 등의 일정한 사항을 준수하여야 하고(제1항), 교육·연구 및 학생지도 비용을 지급받는 개인별로 지급 명세를 작성하여 별도로 관리하여야 하며, 부당한 방법으로 지급받은 사람에 대한 환수조치 등의 방안을 마련하여야 하고(제5항), 실적의 인정 기간 및 인정 방법, 영역별 지급액, 지급시기 등 교육·연구 및 학생지도 비용의 지급에 필요한 세부적인 사항은 교육부장관과 협의하여 정한다(제6항)고 규정하고 있다.\n  한편 국립대학인 ○○대학교(「국립학교 설치령」이 2023. 11. 16. 대통령령 제33862호로 개정되면서 교명이 ‘국립○○대학교’로 변경되었다. 이하 ‘○○대학교’라고만 한다)의 장인 피고가 국립대학회계법 제7조 제1항, 제28조 제2항 등에 따라 제정한 「○○대학교 재정 및 회계의 운영에 관한 규정」(이하 ‘○○대학교 재정·회계규정’이라 한다) 제11조는, 총장은 예산의 범위 내에서 교직원에게 교육·연구 및 학생지도 비용을 지급할 수 있고(제1항), 교육·연구 및 학생지도 비용을 지급받으려는 교직원은 교육, 연구, 학생지도 등을 위한 각 영역별 활동 계획서를 총장에게 제출하여야 하며(제2항), 총장은 계획서를 제출하지 아니하거나 부정한 방법으로 실적을 제출한 경우와 계획서상의 목표를 달성하지 못한 경우에는 지급된 교육·연구 및 학생지도 비용을 환수하여야 한다(제5항)고 규정하고 있다.\n  2. 사실관계\n  원심판결 이유와 기록에 따르면, 다음과 같은 사실을 알 수 있다.\n  가. 원고들은 ○○대학교에 재직 중인 교원들이다. 원고들은 2018년도부터 2020년도까지 국립대학회계법 제28조에 따른 교육·연구 및 학생지도 비용을 지급받았다. 한편 피고가 국립대학회계법 시행규칙 제22조 제6항 등에 근거하여 2018년도부터 2021년도까지 매년 정한 각 ‘교육·연구(산학협력) 및 학생지도 비용 지급 기준’(이하 ‘이 사건 각 지급 기준’이라 한다)에는 ‘부정한 방법으로 실적을 제출하거나 심사위원회의 평가 결과 부적합으로 판정된 경우 지급된 교육·연구 및 학생지도 비용을 환수한다.’, ‘환수명령을 받은 교직원이 지정된 기한까지 해당 금액을 반납하지 아니하면 해당 금액을 완납할 때까지 교육·연구 및 학생지도 비용의 지급을 중지한다.’는 내용이 포함되어 있다.\n  나. 교육부는 2021. 5. 24.부터 2021. 7. 16.까지 ○○대학교를 포함한 전국의 국공립대학에 대하여 교육·연구 및 학생지도 비용 감사를 실시하였다. 교육부는 감사 결과를 바탕으로 2021. 11. 25. 피고에게 ‘학생지도비 실적 제출 부적정’, ‘연구영역 동일 실적물 중복 제출 부적정’ 등을 사유로 원고들에 대하여 교육·연구 및 학생지도 비용 환수 및 신분상 조치를 하도록 요구하였다.\n  다. 피고는 2022. 4. 27. 교내 이메일을 통하여 원고들에게 각각 ‘환수금 납입 안내’라는 제목의 문서를 첨부하여 교육·연구 및 학생지도 비용에 관한 환수금을 납부해 달라는 요청을 통지하였다(이하 ‘이 사건 각 환수 통지’라 한다). 이 사건 각 환수 통지에 첨부된 각 문서에는, 원고 1에 대해서 ‘학생지도비 실적 제출 부적정’을 사유로 교육·연구 및 학생지도 비용 552,000원을 환수한다는 내용이, 원고 2, 원고 3, 원고 4에 대해서 각각 ‘연구영역 동일 실적물 중복 제출 부적정’을 사유로 교육·연구 및 학생지도 비용 3,100,000원을 환수한다는 내용이 기재되어 있다.\n  3. 판단\n  가. 위와 같은 사실관계를 앞서 본 법리와 법령 등에 비추어 살피면, 이 사건 각 환수 통지는 행정청이 행하는 구체적 사실에 관한 법집행으로서의 공권력의 행사인 ‘처분’에 해당한다고 보아야 한다. 그 구체적인 이유는 다음과 같다.\n  1) 국립대학회계법 제28조에 따른 교육·연구 및 학생지도 비용은 국립대학의 장이 대학회계의 재원으로 구성되는 예산의 범위에서 계획서와 실적에 따라 차등적으로 지급할 수 있는 성격의 돈으로서 통상의 업무 수행에 대한 대가로 교직원에게 당연히 주어지는 것이 아니다. 교육·연구 및 학생지도 비용은 계획서와 실적을 비롯한 지급 요건에 대한 심사와 판단을 거친 후 국립대학의 장의 결정에 따라 지급된다. 지급된 교육·연구 및 학생지도 비용의 환수 역시 부당한 방법으로 이를 지급받았는지, 부정한 방법으로 실적을 제출하였는지, 계획서상의 목표를 달성하지 못하였는지 등의 환수 요건에 관한 판단이나 정성적 평가를 거쳐 이루어지고, 그 환수 여부나 범위 등이 법령에 일의적으로 규정되어 있지 않다.\n  결국 국립대학의 장의 지급 결정이나 환수 통지는 교육·연구 및 학생지도 비용의 지급과 환수에 관한 교직원의 권리·의무에 영향을 미친다.\n  2) 교육공무원인 원고들은 국가공무원법상 성실 의무(제56조), 복종의 의무(제57조) 등을 부담하므로 이 사건 각 환수 통지를 따라야 한다. 나아가 이 사건 각 환수 통지에 따라 정해진 기한까지 환수금을 납부하지 아니하면, 원고들은 이 사건 각 지급 기준에 의하여 환수금을 완납할 때까지 교육·연구 및 학생지도 비용을 지급받지 못한다. 즉 이 사건 각 환수 통지로 원고들은 직접적인 법적 불이익을 입는다.\n  3) 피고의 이 사건 각 환수 통지는 국립대학회계법 제28조 제2항, 국립대학회계법 시행규칙 제22조 제5항의 순차 위임을 받아 피고가 제정한 ○○대학교 재정·회계규정 제11조 제5항에 따라 이루어진 것이다.\n  4) 국립대학의 장의 환수 행위의 처분성을 인정하지 아니하면, 교직원이 교육·연구 및 학생지도 비용 환수에 관하여 다툼이 있는 경우에 법적 분쟁을 실효적으로 해결할 다른 구제수단을 찾기도 어렵다.\n  나. 그런데도 원심은 국립대학회계법상 이 사건 각 환수 통지를 할 수 있는 근거 조항이 없다거나 원고들의 교육·연구 및 학생지도 비용 반납 의무는 별개의 조치 없이도 이 사건 각 지급 기준에서 정한 환수 사유를 충족함으로써 발생한다는 등 그 판시와 같은 이유를 들어 이 사건 각 환수 통지가 항고소송의 대상인 ‘처분’에 해당하지 않는다고 판단하여, 이 사건 소를 각하한 제1심판결을 유지하였다. 이러한 원심의 판단에는 항고소송의 대상인 ‘처분’에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다.\n  4. 결론\n  원심판결을 파기하고, 같은 취지의 제1심판결을 취소하며, 행정소송법 제8조 제2항, 민사소송법 제425조, 제418조 본문에 따라 사건을 다시 심리·판단하도록 제1심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 이숙연(재판장) 이흥구 오석준(주심) 노경필"

    "판결유형": "판결",
    "판시사항": "[1] 노동조합 및 노동관계조정법 제29조의4 제1항에서 사용자와 교섭대표노동조합에 부과하고 있는 공정대표의무의 취지와 기능 및 공정대표의무는 단체협약의 이행과정에서도 준수되어야 하는지 여부(적극)\n [2] 甲 주식회사가 노사합의에 따라 교섭대표노동조합인 乙 노동조합과 소수노조인 丙 노동조합에 2019년 6월 조합비 일괄공제 내역에 따른 조합원 수를 기준으로 2019. 7. 1.부터 1년간 근로면제시간을 배분할 예정이니 조합원 수에 이의가 있다면 조합비 납부내역 등 추가자료를 제출해 달라고 통보하는 한편, 각 노동조합에 차량 3대를 임차비용 지급방식으로 지원하기로 하고 2019년 10월 조합비 일괄공제 내역에 따른 조합원 수를 기준으로 乙 조합과 丙 조합에 차량 사용기간 11:1의 비율로 배분한 사안에서, 甲 회사가 각 노동조합에 차량을 지원하면서 2019년 10월 조합비 일괄공제 내역에 따른 조합원 수를 기준으로 차량 사용기간을 배분한 것에는 합리적인 이유가 있다고 볼 여지가 큰데도, 이와 달리 공정대표의무를 위반했다고 본 원심판결에 법리오해의 잘못이 있다고 한 사례",
    "판결요지": "[1] 교섭창구 단일화 제도 아래에서 교섭대표노동조합이 되지 못한 노동조합은 독자적으로 단체교섭권을 행사할 수 없으므로, 노동조합 및 노동관계조정법은 교섭대표노동조합이 되지 못한 노동조합을 보호하기 위해 사용자와 교섭대표노동조합에 공정대표의무, 즉 교섭창구 단일화 절차에 참여한 노동조합 또는 그 조합원을 합리적 이유 없이 차별하지 않을 의무를 부과하고 있다(제29조의4 제1항). 공정대표의무는 헌법이 보장하는 단체교섭권의 본질적 내용이 침해되지 않도록 하기 위한 제도적 장치로 기능하고, 교섭대표노동조합과 사용자가 체결한 단체협약의 효력이 교섭창구 단일화 절차에 참여한 다른 노동조합에도 미치는 것을 정당화하는 근거가 된다. 이러한 공정대표의무의 취지와 기능 등에 비추어 보면, 공정대표의무는 단체교섭의 과정이나 그 결과물인 단체협약의 내용뿐만 아니라 단체협약의 이행과정에서도 준수되어야 한다.\n [2] 甲 주식회사가 노사합의에 따라 교섭대표노동조합인 乙 노동조합과 소수노조인 丙 노동조합에 2019년 6월 조합비 일괄공제 내역에 따른 조합원 수를 기준으로 2019. 7. 1.부터 1년간 근로면제시간을 배분할 예정이니 조합원 수에 이의가 있다면 조합비 납부내역 등 추가자료를 제출해 달라고 통보하는 한편, 각 노동조합에 차량 3대를 임차비용 지급방식으로 지원하기로 하고 2019년 10월 조합비 일괄공제 내역에 따른 조합원 수를 기준으로 乙 조합과 丙 조합에 차량 사용기간 11:1의 비율로 배분한 사안에서, 위 차량 지원은 교섭창구 단일화 시점으로부터 약 1년 후에 있었고 그 사이에 각 노동조합 조합원 수의 비율에 상당한 변동이 있었던 사정에 비추어, 甲 회사가 2019년 10월 조합원 수를 기준으로 위 차량 지원을 한 것은 합리적이라고 볼 수 있는 점, ‘조합원 수에 이의가 있다면 추가자료를 제출해 달라.’는 甲 회사의 거듭된 요청에도 丙 조합이 차량 지원 시까지 구체적인 증빙자료를 제출하지 않았고, 실제 조합원 수의 확인 방법에 관한 합리적 대안을 제시하면서 협의를 요청했다고 볼 만한 자료도 없는 상황에서 甲 회사가 일괄공제 내역에 따른 조합원 수를 기준으로 차량 지원을 한 것이 불합리하다고 볼 수 없는 점, 사용자로부터 장소를 제공받을 수밖에 없는 노동조합 사무실과 달리 차량은 노동조합이 스스로 임차하여 사용함에 특별한 제약이 없으며, 위 차량 지원도 실제로는 차량 임차비용을 지원하는 방식으로 이루어진 점을 종합하면, 甲 회사가 각 노동조합에 차량을 지원하면서 2019년 10월 조합비 일괄공제 내역에 따른 조합원 수를 기준으로 차량 사용기간을 배분한 것에는 합리적인 이유가 있다고 볼 여지가 큰데도, 이와 달리 공정대표의무를 위반했다고 본 원심판결에 법리오해의 잘못이 있다고 한 사례.",

    "참조판례": "[2] 대법원 2019. 10. 31. 선고 2017두37772 판결(공2019하, 2263)",
    "판례내용": "【원고, 상고인】 주식회사 ○○○(변경 후 상호: △△△ 주식회사)의 소송수계인 주식회사 ○○○ (소송대리인 법무법인(유한) 태평양 담당변호사 이욱래 외 4인)\n【피고, 피상고인】 중앙노동위원회위원장 (소송대리인 법무법인(유한) 원 담당변호사 김도형)\n【피고보조참가인】 □□□노동조합 (소송대리인 법무법인 여는 담당변호사 탁선호 외 7인)\n【원심판결】 서울고법 2022. 10. 13. 선고 2021누58990 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 상고이유 보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 따르면 다음과 같은 사실을 알 수 있다.\n  가. ○○○노동조합과 피고보조참가인의 ○○○지회(이하 ‘참가인 지회’라 하고, ○○○노동조합과 함께 ‘이 사건 각 노동조합’이라 한다)는 2019년 교섭창구 단일화 절차에 참여하였고, ○○○노동조합이 2018. 11. 16. 교섭대표노동조합이 되었다.\n  나. ○○○노동조합은 2017년 단체협약의 유효기간(2017. 7. 1.~2019. 6. 30.) 중인 2019. 1. 2. 원고에게 조합원 수 증가를 이유로 기존 근로시간 면제 한도 2,000시간을 조정해 달라며 교섭을 요구하였고, 2019. 2. 11. 원고와 다음과 같은 내용으로 합의하였다(이하 ‘이 사건 노사합의’라 한다). ① 근로시간 면제 한도를 연간 24,200시간으로 하고 2017년 단체협약 유효기간까지 변경하지 아니한다(제1조 제1항, 제2항). ② 면제되는 근로시간(이하 ‘근로면제시간’이라 한다)을 이 사건 각 노동조합의 합의에 따라 배분하되, 합의되지 않으면 이 사건 노사합의일의 노동조합별 조합원 수에 따라 임시로 배분한다(제1조 제4항, 제5항). ③ 이 사건 노사합의일의 조합원 수는 조합비 일괄공제(이른바 ‘체크오프’라고 하는데, 사용자가 근로자의 신청에 따라 임금에서 조합비를 미리 공제하는 방식이다. 이하 ‘일괄공제’라 한다) 내역 및 조합원 명부, 조합비 내역 등을 근거로 결정하고, 이 사건 각 노동조합에서 필요한 증빙을 갖추어 조합원 수를 통지하지 아니하는 경우 교섭 요구 노동조합 확정공고일 당시 조합원 수를 이 사건 노사합의일의 조합원 수로 본다(제1조 제6항). ④ 이 사건 노사합의는 차기 단체협약의 효력 발생일까지 유효하다(제6조 제1항).\n  다. 원고는 2019. 3. 7. 참가인 지회에, 이 사건 각 노동조합 사이의 합의가 없으면 2019년 2월 일괄공제 내역에 따른 조합원 수를 기준으로 근로면제시간을 배분할 예정이니 조합원 수에 이의가 있다면 조합비 납부내역 등 추가자료를 제출해 달라고 통보하였다.\n  라. 원고는 2019. 6. 24. 이 사건 각 노동조합에, 2019년 6월 일괄공제 내역에 따른 조합원 수를 기준으로 2019. 7. 1.부터 1년간 근로면제시간으로 ○○○노동조합에 18,982시간, 참가인 지회에 5,218시간을 배분할 예정이니, 조합원 수에 이의가 있다면 조합비 납부내역 등 추가자료를 제출해 달라고 통보하였다.\n  마. 원고는 2019. 10. 21. 이 사건 각 노동조합에 차량 3대를 임차비용 지급 방식으로 지원하기로 하고, 2019년 10월 일괄공제 내역에 따른 조합원 수를 기준으로 ○○○노동조합과 참가인 지회에 차량 사용기간 11:1의 비율로 배분하였다(이하 ‘이 사건 차량 지원’이라 한다).\n  2. 원심의 판단\n  원심은 다음과 같은 이유로, 원고가 이 사건 차량 지원에 관하여 합리적 이유 없이 참가인 지회를 차별함으로써 공정대표의무를 위반하였다고 판단하였다.\n  가. 이 사건 차량 지원의 기준에 관한 합의가 없는 상황에서, 이 사건 각 노동조합의 조합원 수를 기준으로 차량을 배분한 것은 합리성을 인정할 수 있다. 그러나 ① 「노동조합 및 노동관계조정법」(이하 ‘노동조합법’이라 한다) 제29조의4 제1항이 사용자인 원고에게 ‘교섭창구 단일화 절차에 참여’한 노동조합에 대한 차별금지의무를 부과하고 있는 점, ② 이 사건 차량 지원과 근로면제시간 배분은 노동조합의 활동을 지원하기 위한 것으로 유사한데, 이 사건 노사합의 제1조 제6항이 근로면제시간 배분 기준시점을 ‘교섭 요구 노동조합 확정공고일’로 정하고 있는 점에 비추어 볼 때, 이 사건 차량 지원에 있어서도 합리적인 배분 기준은 ‘교섭창구 단일화 절차 참여 시’의 조합원 수이다.\n  나. 참가인 지회의 지회장, 사무장 등이 2018. 12. 11. 부당해고됨에 따라 조합원들이 불이익 처분에 대한 염려로 일괄공제 신청을 하지 않았을 가능성이 높다. 공정대표의무를 부담하는 원고로서는 객관적인 제3자로 하여금 일괄공제 내역 외에 자금관리서비스(CMS, Cash Management Service) 내역을 확인하게 하는 등 참가인 지회의 조합원 수를 파악하기 위해 노력했어야 한다.\n  다. 원고의 주요 사업장들이 원거리에 분산되어 있으므로 노동조합 활동을 위하여 차량 지원이 필요하다. 특정 기간에만 사용하는 등의 방식으로는 참가인 지회가 차량을 실질적으로 사용할 수 없다.\n  3. 대법원의 판단\n  가. 교섭창구 단일화 제도 아래에서 교섭대표노동조합이 되지 못한 노동조합은 독자적으로 단체교섭권을 행사할 수 없으므로, 노동조합법은 교섭대표노동조합이 되지 못한 노동조합을 보호하기 위해 사용자와 교섭대표노동조합에 공정대표의무, 즉 교섭창구 단일화 절차에 참여한 노동조합 또는 그 조합원을 합리적 이유 없이 차별하지 않을 의무를 부과하고 있다(제29조의4 제1항). 공정대표의무는 헌법이 보장하는 단체교섭권의 본질적 내용이 침해되지 않도록 하기 위한 제도적 장치로 기능하고, 교섭대표노동조합과 사용자가 체결한 단체협약의 효력이 교섭창구 단일화 절차에 참여한 다른 노동조합에도 미치는 것을 정당화하는 근거가 된다. 이러한 공정대표의무의 취지와 기능 등에 비추어 보면, 공정대표의무는 단체교섭의 과정이나 그 결과물인 단체협약의 내용뿐만 아니라 단체협약의 이행과정에서도 준수되어야 한다(대법원 2019. 10. 31. 선고 2017두37772 판결 등 참조).\n  나. 원심판결 이유를 앞서 본 법리에 비추어 보면, 원심의 판단 중 원고가 사용자로서 참가인 지회에 대하여 공정대표의무를 부담한다는 부분은 정당하지만, 이 사건 차량 지원이 합리적 이유 없는 차별에 해당한다는 부분은 다음과 같은 이유로 수긍하기 어렵다.\n  1) 노동조합법 제29조의4 제1항은 ‘교섭창구 단일화 절차에 참여한 노동조합 또는 조합원’이 단체협약의 효력을 받는 점을 고려하여 이들을 사용자와 교섭대표노동조합이 부담하는 공정대표의무의 상대방으로 정한 것이지, 더 나아가 근로면제시간이나 시설·비품 등을 배분하는 기준시점을 ‘교섭창구 단일화 절차 참여 시’로 정한 취지라고 볼 수 없다. 이 사건 노사합의에서 정한 근로면제시간 배분 기준도 원칙적으로 ‘이 사건 노사합의일’, 즉 근로시간 면제 한도가 증가되어 배분이 가능하였던 시점의 조합원 수이다. 또한 2019. 7. 1.부터 1년간의 근로면제시간 배분이 그 시점에 가까운 2019년 6월 조합원 수를 기준으로 이루어진 점, 이 사건 차량 지원은 교섭창구 단일화 시점으로부터 약 1년 후에 있었고 그 사이에 이 사건 각 노동조합 조합원 수의 비율에 상당한 변동이 있었던 점에 비추어, 원고가 2019년 10월 조합원 수를 기준으로 이 사건 차량 지원을 한 것은 합리적이라고 볼 수 있다.\n  2) 조합원 수의 결정에 관하여 이 사건 노사합의 제1조 제6항은, 일괄공제 내역 및 조합원 명부, 조합비 내역 등을 근거로 한다고 규정하면서도 일괄공제 내역 외에 나머지 자료를 원고가 아니라 이 사건 각 노동조합이 보관하고 있는 점을 고려하여 이 사건 각 노동조합이 필요한 증빙을 갖추어 조합원 수를 통지하면 그에 따른 실제 조합원 수를 반영하도록 하고 있다. 이에 따라 원고는 2019. 3. 7. 및 2019. 6. 24. 참가인 지회에 ‘조합원 수에 이의가 있다면 추가자료를 제출해 달라.’고 거듭 요청하였다. 그런데도 참가인 지회는 원고에게 이 사건 차량 지원 시까지 구체적인 증빙자료를 제출하지 않았고, 실제 조합원 수의 확인 방법에 관한 합리적 대안을 제시하면서 협의를 요청하였다고 볼 만한 자료도 없다. 그와 같은 상황에서 원고가 일괄공제 내역에 따른 조합원 수를 기준으로 이 사건 차량 지원을 한 것이 불합리하다고 볼 수 없다.\n  3) 원심도 인정한 것처럼 원고가 이 사건 각 노동조합의 조합원 수를 기준으로 한정된 차량을 배분한 것 자체는 합리적이다. 또한 사용자로부터 장소를 제공받을 수밖에 없는 노동조합 사무실과 달리 차량은 노동조합이 스스로 임차하여 사용함에 특별한 제약이 없으며, 이 사건 차량 지원도 실제로는 차량 임차비용을 지원하는 방식으로 이루어졌다. 원고 사업장의 특성을 감안하더라도, 참가인 지회가 특정 기간에만 차량을 사용할 수 있었다는 사정을 들어 이 사건 차량 지원의 합리성을 부정하기는 어렵다.\n  다. 위와 같은 사정들을 종합해 보면, 원고가 이 사건 각 노동조합에 임차비용 지급 방식으로 차량을 지원하면서 2019년 10월 일괄공제 내역에 따른 조합원 수를 기준으로 차량 사용기간을 배분한 것에는 합리적인 이유가 있다고 볼 여지가 크다. 그런데도 원심은 이와 달리 원고가 공정대표의무를 위반하였다고 판단하였으니, 이 부분 원심판결에는 공정대표의무 위반의 판단 기준에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 상고이유 주장은 이유 있다.\n  4. 결론\n  원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 박영재(재판장) 오경미 엄상필(주심)"
  },

    "판결유형": "판결",
    "판시사항": "[1] 독점규제 및 공정거래에 관한 법률은 다른 법률에 특별한 정함이 없는 이상 모든 산업분야에 적용되어야 하는지 여부(적극)\n [2] 甲 외국회사와 乙 주식회사 등을 포함한 23개 해상 화물운송사업자들이 한국-동남아 항로에서 컨테이너를 통하여 화물을 운송하는 서비스의 가격을 합의하고 해양수산부장관에 대한 신고 없이 이를 실행함으로써 구 독점규제 및 공정거래에 관한 법률 제19조 제1항을 위반했다는 이유로 공정거래위원회가 甲 회사에 시정명령 및 과징금납부명령을 한 사안에서, 위 공동행위에 구 독점규제 및 공정거래에 관한 법률이 적용되지 않고 공정거래위원회에는 이를 규제할 권한이 없다고 보기는 어려운데도, 이와 달리 본 원심판결에 법리오해의 위법이 있다고 한 사례",
    "판결요지": "[1] 1980. 12. 31. 제정 당시 독점규제 및 공정거래에 관한 법률(이하 ‘공정거래법’이라 한다) 제47조는 \"이 법의 규정은 특정한 사업에 대하여 특별한 법률이 있거나, 특별한 법률에 의하여 설립된 사업자 또는 사업자단체가 법률 또는 그 법률에 의한 명령에 따라 행하는 정당한 행위에 대하여는 이를 적용하지 아니한다.\"(제1항)라고 하면서 \"제1항의 규정에 의한 특별한 법률은 따로 법률로 지정한다.\"(제2항)라고 규정하였으나, 그러한 특별한 법률을 따로 지정하는 법률은 만들어지지 않았다. 1986. 12. 31. 개정된 공정거래법 제47조는 \"이 법의 규정은 사업자 또는 사업자단체가 법률 또는 그 법률에 의한 명령에 따라 행하는 정당한 행위에 대하여는 이를 적용하지 아니한다.\"라고만 규정하였고, 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제58조도 \"이 법의 규정은 사업자 또는 사업자단체가 다른 법률 또는 그 법률에 의한 명령에 따라 행하는 정당한 행위에 대하여는 이를 적용하지 아니한다.\"라고 규정하였다.\n구 독점규제 및 공정거래에 관한 법률(1990. 1. 13. 법률 제4198호로 전부 개정된 후 1996. 12. 30. 법률 제5235호로 개정되기 전의 것)은 제61조에서 ‘금융 및 보험업을 영위하는 사업자에 대하여는 이 법의 일부 규정을 적용하지 아니한다.’는 내용의 규정을 두고 있었다. 그러나 자본·금융시장의 개방 등 경제자율화 조치의 확대로 인하여 야기될 수 있는 경제력 집중의 심화 현상을 방지하기 위하여 1996. 12. 30. 법률 개정으로 위 조항이 삭제되었고, 이후 공정거래법은 특정 산업분야에 대하여 적용을 제외하는 규정을 두고 있지 않다.\n  한편 특정한 경제주체나 경제활동에 대하여 특화된 규제가 필요하거나 공정거래위원회를 비롯한 복수의 규제기관에 의한 중복제재가 우려된다는 등의 이유로 개별 특별법령에서 공정거래법의 적용제외를 명시적으로 규정하는 경우가 있다. 예를 들어 해외건설 촉진법 제3조 제4항은 공정거래법 일부 규정의 적용을 제외하고 있으며, 전기통신사업법 제54조는 같은 법에 따른 시정조치 또는 과징금을 부과하는 경우 동일한 사업자의 동일한 행위에 대하여 동일한 사유로 공정거래법에 따른 시정조치 또는 과징금의 부과를 할 수 없다고 정하고 있다.\n  위와 같은 공정거래법의 입법 취지와 개정 경과, 공정거래법 적용제외를 명시한 특별법령의 존재 등에 비추어 볼 때, 공정거래법은 국민경제 전반에 걸쳐 헌법상 요구되는 사회적 시장경제질서를 구현하기 위한 법률로서, 다른 법률에 특별한 정함이 없는 이상 모든 산업분야에 적용되어야 한다. \n [2] 甲 외국회사와 乙 주식회사 등을 포함한 23개 해상 화물운송사업자들이 한국-동남아 항로에서 컨테이너를 통하여 화물을 운송하는 서비스의 가격을 합의하고 해양수산부장관에 대한 신고 없이 이를 실행함으로써 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법’이라 한다) 제19조 제1항을 위반했다는 이유로 공정거래위원회가 甲 회사에 시정명령 및 과징금납부명령을 한 사안에서, 해운법은 제29조에서 외항 정기 화물운송사업자들의 운임에 관한 공동행위와 그에 대한 신고 및 시행 중지 또는 내용 변경에 필요한 조치 등을 규정하고 있는데, 일반적으로 사업자들의 부당한 공동행위 등을 규율대상으로 삼는 독점규제 및 공정거래에 관한 법률(이하 ‘공정거래법’이라 한다)이 제정된 이후에도 해운법에서는 그러한 공동행위에 대하여 공정거래법 적용을 제외한다는 명시적 규정을 두고 있지 않은 점, 해운법이 외항 정기 화물운송사업자들의 운임에 관한 공동행위를 제한 없이 허용하는 것이 아니라 그 공동행위가 부당하게 경쟁을 실질적으로 제한하지 않는 범위 내에서만 허용하고 있고, 해운법 제29조를 포함한 관련 해운법령이 외항 정기 화물운송사업자들의 공동행위가 허용된 범위를 벗어나거나 필요한 정도를 넘는 부당한 경우에 대하여 이를 직접 금지하면서 그에 관한 규제권한의 소재와 구체적인 규제의 방법·절차까지 별도로 정하고 있는 것은 아니라고 보아야 하며, 최근에는 해운산업에 관해서도 경쟁법적 규제를 면제할 필요가 없고 오히려 경쟁원리에 따라 규율하는 것이 타당하다는 시각이 대두되고 있다는 이유에서, 해운법의 관련 규정 해석을 통하여 위 공동행위에 대한 공정거래법 적용제외, 즉 해운법의 배타적 적용을 인정할 수는 없는 점 등을 종합하면, 해운법이 제29조에서 외항 정기 화물운송사업자들의 운임에 관한 공동행위를 허용하면서 해당 공동행위에 대하여 해양수산부장관이 필요한 조치를 취할 수 있도록 규제의 방법과 절차를 정하고 있다는 사유만으로 위 공동행위에 구 공정거래법이 적용되지 않고 그 결과 공정거래위원회에는 이를 규제할 권한이 없다고 보기는 어려운데도, 이와 달리 본 원심판결에 법리오해의 위법이 있다고 한 사례.",
    "참조조문": "[1] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제58조(현행 제116조 참조), 해외건설 촉진법 제3조 제4항, 전기통신사업법 제54조 / [2] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제19조 제1항(현행 제40조 제1항 참조), 해운법 제29조",
    "참조판례": "",
    "판례내용": "【원고, 피상고인】 ○○○ 엘티디(△△△ Ltd.) (소송대리인 법무법인(유한) 율촌 담당변호사 박성범 외 5인)\n【원고보조참가인】 □□□ 주식회사 외 9인 (소송대리인 법무법인(유한) 태평양 외 1인)\n【피고, 상고인】 공정거래위원회 (소송대리인 법무법인 지음 외 2인)\n【원심판결】 서울고법 2024. 2. 1. 선고 2022누43742 판결\n【주    문】\n  원고보조참가인들의 보조참가를 허가한다.  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사건의 개요\n  피고는, 원고와 원고보조참가인들을 포함한 23개 해상 화물운송사업자들이 2003. 12.경부터 2018. 12.경까지(원고의 경우에는 2005. 8. 31.부터 2018. 1. 10.까지) 한국－동남아 항로에서의 해운동맹을 위한 단체인 아이에이디에이(IADA, Intra-Asia Discussion Agreement) 및 동남아정기선사협의회 내 회의를 통하여 120차례에 걸쳐 한국－동남아 항로에서 컨테이너를 통하여 화물을 운송하는 서비스의 가격(기본운임과 각종 부대비용 모두 포함)을 합의하고 이를 실행(이하 ‘이 사건 공동행위’라고 한다)함으로써 구 「독점규제 및 공정거래에 관한 법률」(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법’이라고 한다) 제19조 제1항을 위반하였다는 이유로, 원고에게 시정명령 및 과징금납부명령을 하였다.\n  2. 보조참가신청의 적법 여부\n행정소송법 제8조 제2항에 의하여 준용되는 민사소송법 제71조에 따르면, 소송결과에 이해관계가 있는 제3자는 한쪽 당사자를 돕기 위하여 법원에 계속 중인 소송에 참가할 수 있다. 여기에서 ‘이해관계’란 사실상·경제상 또는 감정상 이해관계가 아니라 법률상 이해관계를 말하는 것으로, 보조참가를 하려는 사람이 그 소송에서 한 판결의 기판력 또는 집행력을 당연히 받게 되거나 적어도 그 판결을 전제로 하여 자신의 법률상 지위가 결정되는 관계에 있는 경우를 의미한다(대법원 2017. 6. 22. 선고 2014다225809 전원합의체 판결 등 참조).\n  이 사건에서 원고보조참가인들은 원고와 함께 이 사건 공동행위를 하여 구 공정거래법 제19조 제1항 제1호를 위반하였다는 이유로 피고로부터 시정명령 및 과징금납부명령을 받은 해상 화물운송사업자들이다. 이 사건 공동행위에 구 공정거래법이 적용되어 피고에게 규제권한이 있는지 여부가 다투어지는 이 사건의 결론에 따라 원고보조참가인들에 대한 각 처분의 위법 여부도 달라지므로, 원고보조참가인들은 소송결과에 법률상 이해관계가 있다. 따라서 원고보조참가인들의 보조참가신청은 적법하고, 이를 다투는 피고의 이의는 받아들이지 않는다.\n  3. 이 사건 공동행위에 대한 독점규제 및 공정거래에 관한 법률(이하 ‘공정거래법’이라 한다) 적용제외 여부\n  가. 원심 판단의 요지\n  어떤 법령이 자유경쟁의 예외를 구체적으로 인정하고 있을 뿐만 아니라, 더 나아가 허용된 범위를 벗어나거나 필요한 정도를 넘는 부당한 경우에 대하여 이를 직접 금지하면서 그 규제권한의 소재와 구체적인 규제의 방법·절차까지 별도로 정하고 있다면, 피고가 구 공정거래법 제58조에 의한 적용제외가 인정되지 않는다는 점을 들어 개입할 여지는 없다. 이러한 경우 피고는 별도의 규제권한을 가지지 않는다.\n해운법 제29조는 외항 정기 화물운송사업자들의 운임에 관한 공동행위를 허용함으로써 자유경쟁의 예외를 구체적으로 인정하고, 다만 그 공동행위를 통하여 결정된 운임이 지나치게 높아 부당한 경우에는 해양수산부장관이 필요한 조치를 하되 이를 피고에게 통보하도록 하고 있다. 위와 같은 공동행위에 관하여는 설령 그 운임이 다소 높다 하더라도 해양수산부장관이 부당성 여부를 판단하여 규제할 문제일 뿐, 이에 대하여 피고가 해운법에 따라 필요한 정도를 넘는다고 주장하면서 규제권한을 행사할 수는 없다고 보아야 한다.\n  이와 다른 전제에 선 피고의 시정명령 및 과징금납부명령은 원고의 공동행위 가담 여부나 이 사건 공동행위의 경쟁제한성 내지 부당성 유무 등에 관하여 더 나아가 살필 필요 없이 위법하다.\n  나. 대법원의 판단\n  원심의 판단은 다음과 같은 이유에서 수긍하기 어렵다.\n  1) 공정거래법의 입법 취지, 개정 경과와 일반적 적용 범위\n  가) 헌법 제119조는 제1항에서 ‘개인과 기업의 경제상 자유와 창의를 존중함을 기본으로 한다.’고 선언하면서도, 제2항에서 \"국가는 균형 있는 국민경제의 성장 및 안정과 적정한 소득의 분배를 유지하고, 시장의 지배와 경제력 남용을 방지하며, 경제주체 간의 조화를 통한 경제의 민주화를 위하여 경제에 관한 규제와 조정을 할 수 있다.\"라고 규정한다. 이러한 사회적 시장경제질서의 경제정책적 목표를 달성하기 위한 법률인 공정거래법은 제1조에서 \"이 법은 사업자의 시장지배적지위의 남용과 과도한 경제력의 집중을 방지하고, 부당한 공동행위 및 불공정거래행위를 규제하여 공정하고 자유로운 경쟁을 촉진함으로써 창의적인 기업활동을 조성하고 소비자를 보호함과 아울러 국민경제의 균형 있는 발전을 도모함을 목적으로 한다.\"라고 하여 그 입법 목적을 밝히고 있다.\n  나) 1980. 12. 31. 제정 당시 공정거래법 제47조는 \"이 법의 규정은 특정한 사업에 대하여 특별한 법률이 있거나, 특별한 법률에 의하여 설립된 사업자 또는 사업자단체가 법률 또는 그 법률에 의한 명령에 따라 행하는 정당한 행위에 대하여는 이를 적용하지 아니한다.\"(제1항)라고 하면서 \"제1항의 규정에 의한 특별한 법률은 따로 법률로 지정한다.\"(제2항)라고 규정하였으나, 그러한 특별한 법률을 따로 지정하는 법률은 만들어지지 않았다. 1986. 12. 31. 개정된 공정거래법 제47조는 \"이 법의 규정은 사업자 또는 사업자단체가 법률 또는 그 법률에 의한 명령에 따라 행하는 정당한 행위에 대하여는 이를 적용하지 아니한다.\"라고만 규정하였고, 구 공정거래법 제58조도 \"이 법의 규정은 사업자 또는 사업자단체가 다른 법률 또는 그 법률에 의한 명령에 따라 행하는 정당한 행위에 대하여는 이를 적용하지 아니한다.\"라고 규정하였다.\n  다) 구 독점규제 및 공정거래에 관한 법률(1990. 1. 13. 법률 제4198호로 전부 개정된 후 1996. 12. 30. 법률 제5235호로 일부 개정되기 전의 것)은 제61조에서 ‘금융 및 보험업을 영위하는 사업자에 대하여는 이 법의 일부 규정을 적용하지 아니한다.’는 내용의 규정을 두고 있었다. 그러나 자본·금융시장의 개방 등 경제자율화 조치의 확대로 인하여 야기될 수 있는 경제력 집중의 심화 현상을 방지하기 위하여 1996. 12. 30. 법률 개정으로 위 조항이 삭제되었고, 이후 공정거래법은 특정 산업분야에 대하여 적용을 제외하는 규정을 두고 있지 않다.\n  라) 한편 특정한 경제주체나 경제활동에 대하여 특화된 규제가 필요하거나 피고를 비롯한 복수의 규제기관에 의한 중복제재가 우려된다는 등의 이유로 개별 특별법령에서 공정거래법의 적용제외를 명시적으로 규정하는 경우가 있다. 예를 들어 「해외건설 촉진법」제3조 제4항은 공정거래법 일부 규정의 적용을 제외하고 있으며, 전기통신사업법 제54조는 같은 법에 따른 시정조치 또는 과징금을 부과하는 경우 동일한 사업자의 동일한 행위에 대하여 동일한 사유로 공정거래법에 따른 시정조치 또는 과징금의 부과를 할 수 없다고 정하고 있다.\n  마) 위와 같은 공정거래법의 입법 취지와 개정 경과, 공정거래법 적용제외를 명시한 특별법령의 존재 등에 비추어 볼 때, 공정거래법은 국민경제 전반에 걸쳐 헌법상 요구되는 사회적 시장경제질서를 구현하기 위한 법률로서, 다른 법률에 특별한 정함이 없는 이상 모든 산업분야에 적용되어야 한다. \n  2) 이 사건 공동행위에 구 공정거래법이 적용되는지에 관한 판단\n  아래와 같은 사정을 종합해 보면, 해운법이 제29조에서 외항 정기 화물운송사업자들의 운임에 관한 공동행위를 허용하면서 해당 공동행위에 대하여 해양수산부장관이 필요한 조치를 취할 수 있도록 규제의 방법과 절차를 정하고 있다는 사유만으로 이 사건 공동행위에 구 공정거래법이 적용되지 않고 그 결과 피고에게는 이를 규제할 권한이 없다고 보기는 어렵다.\n  가) 1963. 12. 5. 제정된 해상운송사업법이 1978. 12. 5. 일부 개정되면서 제7조의2에서 외항선박운항사업에 관한 공동행위의 허용과 그에 대한 신고 및 시행 중지 또는 내용 변경에 필요한 조치 등을 규정한 이래 여러 차례의 개정을 거쳐 현재에 이른 해운법은 위 조항의 기본구조를 계승하여 제29조에서 외항 정기 화물운송사업자들의 운임에 관한 공동행위와 그에 대한 신고 및 시행 중지 또는 내용 변경에 필요한 조치 등을 규정하고 있다. 위와 같은 공동행위와 관련하여, 일반적으로 사업자들의 부당한 공동행위 등을 규율대상으로 삼는 공정거래법이 제정된 이후에도 해운법에서는 그러한 공동행위에 대하여 공정거래법 적용을 제외한다는 명시적 규정을 두고 있지 않다.\n  나) 다음과 같은 이유에서, 해운법의 관련 규정 해석을 통하여 이 사건 공동행위에 대한 공정거래법 적용제외, 즉 해운법의 배타적 적용을 인정할 수는 없다.\n  (1) 일반적으로 특별법이 일반법에 우선한다는 원칙은 동일한 형식의 성문법규인 법률이 상호 모순·저촉되는 경우에 적용되는 것이고, 법률이 상호 모순·저촉되는지 여부는 법률의 입법 목적, 적용 범위 및 규정사항 등을 종합적으로 검토하여 판단해야 한다(대법원 1998. 11. 27. 선고 98다32564 판결 등 참조). \n해운법은 제1조에서 그 입법 목적을 ‘해상운송의 질서를 유지하고 공정한 경쟁이 이루어지도록 하며 해운업의 건전한 발전과 여객·화물의 원활하고 안전한 운송을 도모함으로써 이용자의 편의를 향상시키고 국민경제의 발전과 공공복리의 증진에 이바지하는 것’이라고 밝히고 있다. 제29조 제1항에서 외항 정기 화물운송사업자들의 운임에 관한 공동행위를 허용하면서도, 같은 조 제5항에서는 해양수산부장관에게 신고된 공동행위의 내용이 부당하게 운임이나 요금을 인상하는 등 경쟁을 실질적으로 제한하는 경우에는 해양수산부장관이 그 공동행위의 시행 중지, 내용의 변경이나 조정 등 필요한 조치를 명할 수 있도록 하고 있다. 결국 해운법은 외항 정기 화물운송사업자들의 운임에 관한 공동행위를 제한 없이 허용하는 것이 아니라 그 공동행위가 부당하게 경쟁을 실질적으로 제한하지 않는 범위 내에서만 허용하고 있다.\n  아울러 아래 (2)항의 사정까지 고려하면, 적어도 외항 정기 화물운송사업자들의 운임 등에 관한 공동행위 중 ‘신고되지 않은 공동행위’에 대하여는 두 법 사이에 모순·저촉이 있다고 보기 어려우며, 해양수산부장관과 피고가 모두 규제권한을 행사할 수 있다고 해석하는 것이 충분히 가능하다.\n  (2) 해운법 제29조 제5항은 해양수산부장관이 ‘신고된 외항 정기 화물운송사업자들의 운임에 관한 공동행위’에 대하여 필요한 조치를 명할 수 있다고 정하고 있을 뿐, 공동행위가 신고되지 아니한 경우에도 해양수산부장관이 필요한 조치를 명할 수 있는지에 관하여는 정하고 있지 않다. \n해운법 제50조 제1항 제7호, 같은 법 시행규칙 제27조 [별표 5] 제9호에 따르면 위와 같은 공동행위에 관하여 확인이 필요한 경우 해양수산부장관이 해운업자에게 협약서, 운임표 및 운임산출명세서, 선박 배치, 화물의 적재, 그 밖의 운송 조건에 관한 계약이나 공동행위와 관련된 증빙자료, 화주단체와 협의한 내역을 제출하게 할 수 있다. 이와 같은 자료는 사업자들이 신고한 협약의 존부와 구체적인 내용 등을 확인하는 데에 필요하고 적절한 것일 수 있지만, 구 공정거래법 제49조부터 제55조의2까지에 규정된 조사절차 등과 비교해 볼 때, 사업자들이 신고하지 않고 은폐하려는 협약의 존부와 내용 및 이에 관한 사업자들의 목적·의도 등을 파악하여 해양수산부장관이 적절한 규제와 조정을 하기에는 매우 불충분한 것이다.\n  그렇다면 해운법 제29조를 포함한 관련 해운법령이 외항 정기 화물운송사업자들의 공동행위가 허용된 범위를 벗어나거나 필요한 정도를 넘는 부당한 경우에 대하여 이를 직접 금지하면서 그에 관한 규제권한의 소재와 구체적인 규제의 방법·절차까지 별도로 정하고 있는 것은 아니라고 보아야 한다.\n  (3) 둘 이상의 정기선 화물운송사업자가 특정 항로에서 과도하게 경쟁하는 것을 방지하고 서로의 이익을 유지·증진시키기 위하여 해운동맹을 결성한 후 운임, 선박의 배치, 화물의 적재, 기타 운송조건을 공동으로 결정하는 행위에 관하여는 오랫동안 그 필요성과 합리성이 널리 인정되어 왔다. 그러나 원심이 판시한 것처럼 최근에는 해운산업에 관해서도 경쟁법적 규제를 면제할 필요가 없고 오히려 경쟁원리에 따라 규율하는 것이 타당하다는 시각이 대두되고 있다. 특히 운임에 관한 공동행위는 원칙적으로 불허하고 선박의 배치와 화물의 적재 등에 관한 상호협력만을 허용해야 한다는 견해가 있고, 실제로 미국, 유럽연합(EU), 캐나다, 호주, 일본 등 여러 법제에서 위와 같은 취지로 해운동맹에 대한 경쟁법적 규율을 재정비하고 있는 것으로 보인다.\n  앞서 본 공정거래법과 해운법의 제·개정 과정에서, 위와 같은 국제적 추세와 달리 외항 정기 화물운송사업자들의 운임에 관한 공동행위에 대하여 공정거래법 적용제외를 인정해야 할 필요성과 합리성이 충분히 고려된 결과로써 관련 규정이 정비되었다고 볼 만한 사정은 드러나지 않는다.\n  다) 결국 이 사건 공동행위가 해운법 제29조에 따른 정당한 행위인지 등 구 공정거래법 제58조에서 정한 적용제외 요건의 충족 여부와 관계없이 이 사건 공동행위에 구 공정거래법이 적용되지 않는다고 보아 피고에게는 이를 규제할 권한이 없다고 판단한 원심판결에는 구 공정거래법의 적용 범위에 관한 법리를 오해하여 판결 결과에 영향을 미친 위법이 있다. 이 점을 지적하는 상고이유의 주장은 이유 있다.\n  4. 결론\n  원고보조참가인들의 보조참가를 허가하는 한편, 피고의 나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 이흥구(재판장) 오석준 엄상필(주심) 이숙연"
  },

    "판시사항": "진폐로 사망한 근로자에 대한 유족급여의 산정기준이 되는 평균임금의 산정사유 발생일(=원칙적으로 최초 진폐 진단일) 및 최초 진단 이후의 사정이 사망의 직접적인 원인이 되었고 재요양 대상이 된 상병 진단일의 평균임금이 근로자의 통상 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우, 재요양 진단일을 평균임금 산정사유 발생일로 보아야 하는지 여부(적극) / 이때 ‘최초 진단 이후의 사정이 사망의 직접적인 원인이 된 경우’의 의미 및 직접적인 원인관계가 인정되는지 판단하는 방법 / ‘재요양 진단일의 평균임금이 근로자의 통상 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우’의 의미",
    "판결요지": "",
    "참조조문": "구 산업재해보상보험법(2015. 1. 20. 법률 제13045호로 개정되기 전의 것) 제5조 제2호, 제62조 제1항, 제2항 [별표 3], 근로기준법 제2조 제1항 제6호, 근로기준법 시행령 제52조",
    "참조판례": "대법원 2006. 2. 23. 선고 2005두11845 판결(공2006상, 520), 대법원 2023. 7. 13. 선고 2021두35438 판결(공2023하, 1469)",
    "판례내용": "【원고, 피상고인】 원고 (소송대리인 변호사 변희삼)\n【피고, 상고인】 근로복지공단\n【원심판결】 서울고법 2024. 2. 1. 선고 (춘천)2021누116 판결\n【주    문】\n  상고를 기각한다.  상고비용은 피고가 부담한다. \n\n【이    유】  1. 사안의 개요\n  원심판결 이유와 기록에 따르면, 다음 사실을 알 수 있다. \n  가. 망 소외인(이하 ‘망인’이라 한다)은 1962. 8. 1.부터 대한석탄공사 ○○광업소에서 선관원 등으로 근무하던 중 1981. 2. 17. 최초 진폐 진단을 받았다. 이후에도 망인은 1988. 4. 19. 퇴직할 때까지 약 7년 2개월간 위 광업소에서 선관원으로 계속 근무하면서 분진 등에 추가로 노출되었다. \n  나. 망인은 1994. 10. 5. 진폐 및 기관지염 진단을 받아 재요양 승인을 받았는데, 피고는 망인이 퇴직할 당시 동종 근로자의 임금(18,186원 59전)을 재요양 상병의 진단일까지 증감한 금액(43,676원 76전)에 기초하여 재요양 기간 중의 휴업급여, 상병보상연금을 산정하고, 이를 망인에게 지급하여 왔다. 망인은 재요양 중인 2014. 12. 29. 사망하였다. \n  다. 피고는 망인이 최초 진단을 받은 날을 평균임금 산정사유 발생일로 하여 산정한 평균임금을 산업재해보상보험법 제36조 제3항에 따라 증감한 금액을 기준으로 망인의 배우자인 원고에게 유족급여를 지급하였다. \n  라. 원고는 망인이 퇴직할 당시 평균임금을 증감한 금액을 기준으로 유족급여를 산정하여야 한다고 주장하면서, 피고에게 평균임금 정정 및 유족급여의 차액 지급을 신청하였다.\n  마. 피고는 2018. 11. 15. 유족급여는 최초 진단일의 평균임금을 증감한 금액을 기준으로 산정하여야 한다는 이유로, 평균임금 정정 불승인 및 보험급여 차액 부지급 처분(이하 ‘이 사건 처분’이라 한다)을 하였다. \n  2. 관련 법리\n  가. 구 산업재해보상보험법(2015. 1. 20. 법률 제13045호로 개정되기 전의 것, 이하 같다) 제62조 제1항, 제2항 [별표 3]은 근로자가 업무상의 사유로 사망한 경우에 유족에게 지급되는 유족급여(유족보상연금과 유족보상일시금)는 평균임금을 기준으로 산정한다고 규정하고 있다. 구 산업재해보상보험법 제5조 제2호는 ‘평균임금은 근로기준법에 따른 평균임금을 말한다.’고 규정하고, 근로기준법 제2조 제1항 제6호는 평균임금은 이를 산정할 사유가 발생한 날을 기준시점으로 하여 그 금액을 산출한다고 규정하며, 근로기준법 시행령 제52조는 재해보상을 하는 경우에는 ‘사망 또는 부상의 원인이 되는 사고가 발생한 날 또는 진단에 따라 질병이 발생되었다고 확정된 날’을 평균임금 산정사유 발생일로 규정하고 있다. \n  나. 이러한 규정들에 따르면, 진폐로 사망한 근로자에 대한 유족급여의 산정기준이 되는 평균임금의 산정사유 발생일은 특별한 사정이 없는 한 ‘진단에 따라 진폐가 발생되었다고 확정된 날’, 즉 ‘최초 진폐 진단일’을 의미하고, 이는 근로자가 최초 진단 시 요양급여를 받지 아니하고 장해급여를 받았거나 재요양을 받은 경우에도 마찬가지이다. 다만 최초 진단 이후의 사정이 사망의 직접적인 원인이 되었고 재요양의 대상이 된 상병 진단일의 평균임금(이하 ‘재요양 진단일의 평균임금’이라고 한다)이 근로자의 통상의 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우에는 재요양 진단일을 평균임금 산정사유 발생일로 보는 것이 타당하다(대법원 2023. 7. 13. 선고 2021두35438 판결 참조). \n  다. 이때 ‘최초 진단 이후의 사정이 사망의 직접적인 원인이 된 경우’는, 최초 진단 이후 근로자가 추가로 수행한 분진업무와 재요양 상병 및 그로 인한 사망 사이에 밀접하고 주된 원인관계가 인정되는 경우를 말한다. 이와 같은 직접적인 원인관계가 인정되는지는 최초 진단 후 분진에 추가로 노출된 정도, 최초 진단 전후 분진업무 종사기간의 길이, 최초 진단일 또는 최종 분진업무 종료일과 재요양 진단일 사이의 간격 및 재요양 상병의 호전 여부 등 여러 사정을 종합적으로 고려하여 법적·규범적 관점에서 판단하여야 한다. 최초 진단 후 분진 사업장이나 담당 업무에 변경이 없었다거나 최초 진단 후 분진업무 종사기간이 최초 진단 전 분진업무 종사기간보다 짧다는 사정만으로 직접적인 원인관계가 부정되는 것은 아니다. \n  라. 다음으로 ‘재요양 진단일의 평균임금이 근로자의 통상의 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우’란 특별한 사정이 없는 한 근로자가 ‘최초 진단일의 평균임금을 재요양 진단일까지 평균임금 증감을 한 금액’(이하 ‘최초 진단일 기준액’이라 한다)보다 높은 재요양 진단일의 평균임금을 기초로 산정된 휴업급여나 상병보상연금을 수령하여 근로자와 그에 의하여 부양되고 있던 유족이 생활하는 경제적 기초로서 그것이 근로자의 통상의 생활임금으로 되었다고 평가할 수 있는 경우를 말한다. 이와 같은 경우에도 최초 진단일 기준액을 기초로 유족급여를 산정한다면, 근로자의 통상의 생활임금을 사실대로 반영하지 못함으로써 근로자에 의하여 부양받고 있던 유족의 생활수준을 저하시킬 우려가 있는데, 이는 유족의 생활보장 등을 목적으로 하는 유족급여의 취지에 부합하지 않기 때문이다(대법원 2006. 2. 23. 선고 2005두11845 판결 등 참조). 이와 달리 근로자가 사망 당시 실제로 지급받던 휴업급여나 상병보상연금의 기초가 된 재요양 진단일의 평균임금이 최초 진단일 기준액과 같거나 그보다 낮았던 경우에는, 최초 진단일 기준액을 기초로 유족급여를 산정하더라도 유족의 생활수준을 저하시킬 우려가 없으므로, 평균임금 산정사유 발생일을 재요양 진단일로 보아야 하는 예외적인 경우에 해당하지 아니한다. \n  3. 판단 \n  가. 원심은 그 판시와 같이 망인이 최초 진폐 진단을 받은 이후에도 7년 이상 같은 광업소에서 같은 직종으로 근무하면서 분진 등에 지속적으로 노출되었고, 이로 인하여 기존 진폐가 악화되어 재요양 상병을 진단받은 뒤 사망하였다는 이유로, 최초 진단 이후의 사정이 망인의 사망에 직접적인 원인이 되었다고 판단하였다.  \n  원심판결 이유를 앞서 본 법리와 기록에 비추어 보면, 원심이 최초 진단 이후 망인이 추가적으로 수행한 분진업무와 재요양 상병 및 그로 인한 사망 사이에 직접적인 원인관계가 인정된다고 판단한 것은 정당하다.\n  나. 다음으로 재요양 진단일의 평균임금이 망인의 통상의 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우에 해당하는지에 관하여 본다.\n  1) 원심판결 이유 및 기록에 따르면, ① 망인의 최초 진단일(1981. 2. 17.)의 평균임금은 8,158원 46전인 사실, ② 망인에게 지급된 휴업급여와 상병보상연금에 적용된 재요양 진단일의 평균임금은 퇴직일(1988. 4. 19.)의 동종 근로자 임금인 18,186원 59전을 재요양 진단일까지 증감한 43,676원 76전이고, 망인은 이렇게 산정된 휴업급여와 상병보상연금을 사망 전까지 20여 년간 수령한 사실을 알 수 있다. 그리고 최초 진단일과 퇴직일 사이의 시간적 간격 및 두 일자의 평균임금액의 차이 등을 감안하면 휴업급여와 상병보상연금에 적용된 재요양 진단일의 평균임금이 최초 진단일 기준액보다 높다고 볼 수 있다. \n  2) 이러한 사실을 앞서 본 법리에 비추어 보면, 망인과 망인의 사망 당시 망인에 의하여 부양되고 있던 원고는 최초 진단일 기준액보다 높은 재요양 진단일의 평균임금에 기초하여 생활한 경우에 해당하므로 재요양 진단일의 평균임금이 망인의 통상의 생활임금이 되었다고 평가할 수 있다. 따라서 피고가 원고에게 지급할 유족급여도 위 재요양 진단일의 평균임금을 기준으로 산정함이 타당하므로 이와 달리 최초 진단일 기준액으로 유족급여를 산정한 이 사건 처분은 위법하다. \n  다. 원심의 이유 설시에 일부 적절하지 않은 부분이 있으나, 재요양 진단일의 평균임금을 기초로 유족급여를 산정해야 한다는 원심의 결론은 정당하고, 거기에 진폐근로자의 유족급여에 적용할 평균임금 산정에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.  \n  4. 결론\n  그러므로 상고를 기각하고 상고비용은 패소자가 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오석준(재판장) 이흥구 엄상필 이숙연(주심)"

    "판결유형": "판결",
    "판시사항": "진폐로 사망한 근로자에 대한 유족급여의 산정기준이 되는 평균임금의 산정사유 발생일(=원칙적으로 최초 진폐 진단일) 및 최초 진단 이후의 사정이 사망의 직접적인 원인이 되었고 재요양 대상이 된 상병 진단일의 평균임금이 근로자의 통상 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우, 재요양 진단일을 평균임금 산정사유 발생일로 보아야 하는지 여부(적극) / 이때 ‘최초 진단 이후의 사정이 사망의 직접적인 원인이 된 경우’의 의미 및 직접적인 원인관계가 인정되는지 판단하는 방법 / ‘재요양 진단일의 평균임금이 근로자의 통상 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우’의 의미",
    "판결요지": "구 산업재해보상보험법(2015. 1. 20. 법률 제13045호로 개정되기 전의 것, 이하 같다) 제5조 제2호, 제62조 제1항, 제2항 [별표 3], 구 진폐의 예방과 진폐근로자의 보호 등에 관한 법률(2010. 5. 20. 법률 제10304호로 개정되기 전의 것) 제24조 제1항 제3호, 제4항, 제25조 제3항, 근로기준법 제2조 제1항 제6호, 근로기준법 시행령 제52조에 따르면, 진폐로 사망한 근로자에 대한 유족급여의 산정기준이 되는 평균임금의 산정사유 발생일은 특별한 사정이 없는 한 ‘진단에 따라 진폐가 발생되었다고 확정된 날’, 즉 ‘최초 진폐 진단일’을 의미하고, 이는 근로자가 최초 진단 시 요양급여를 받지 않고 장해급여를 받았거나 재요양을 받은 경우에도 마찬가지이다. 다만 최초 진단 이후의 사정이 사망의 직접적인 원인이 되었고 재요양의 대상이 된 상병 진단일의 평균임금(이하 ‘재요양 진단일의 평균임금’이라 한다)이 근로자의 통상의 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우에는 재요양 진단일을 평균임금 산정사유 발생일로 보는 것이 타당하다.\n  이때 ‘최초 진단 이후의 사정이 사망의 직접적인 원인이 된 경우’는 최초 진단 이후 근로자가 추가로 수행한 분진업무와 재요양 상병 및 그로 인한 사망 사이에 밀접하고 주된 원인관계가 인정되는 경우를 말한다. 이와 같은 직접적인 원인관계가 인정되는지는 최초 진단 후 분진에 추가로 노출된 정도, 최초 진단 전후 분진업무 종사기간의 길이, 최초 진단일 또는 최종 분진업무 종료일과 재요양 진단일 사이의 간격 및 재요양 상병의 호전 여부 등 여러 사정을 종합적으로 고려하여 법적·규범적 관점에서 판단해야 한다. 최초 진단 후 분진 사업장이나 담당 업무에 변경이 없었다거나 최초 진단 후 분진업무 종사기간이 최초 진단 전 분진업무 종사기간보다 짧다는 사정만으로 직접적인 원인관계가 부정되는 것은 아니다.  \n  다음으로 ‘재요양 진단일의 평균임금이 근로자의 통상 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우’란 특별한 사정이 없는 한 근로자가 ‘최초 진단일의 평균임금에 대하여 재요양 진단일까지 평균임금 증감을 한 금액’(이하 ‘최초 진단일 기준액’이라 한다)보다 높은 재요양 진단일의 평균임금을 기초로 산정된 휴업급여나 상병보상연금을 수령하여 근로자와 그에 의하여 부양되고 있던 유족이 생활하는 경제적 기초로서 그것이 근로자의 통상 생활임금으로 되었다고 평가할 수 있는 경우를 말한다. 이와 같은 경우에도 최초 진단일 기준액을 기초로 유족급여를 산정한다면, 근로자의 통상 생활임금을 사실대로 반영하지 못함으로써 근로자에 의하여 부양받고 있던 유족의 생활수준을 저하시킬 우려가 있는데, 이는 유족의 생활보장 등을 목적으로 하는 유족급여의 취지에 부합하지 않기 때문이다. 이와 달리 근로자가 사망 당시 실제로 지급받던 휴업급여나 상병보상연금의 기초가 된 재요양 진단일의 평균임금이 최초 진단일 기준액과 같거나 그보다 낮았던 경우에는, 최초 진단일 기준액을 기초로 유족급여를 산정하더라도 유족의 생활수준을 저하시킬 우려가 없으므로, 평균임금 산정사유 발생일을 재요양 진단일로 보아야 하는 예외적인 경우에 해당하지 아니한다.",
    "참조조문": "구 산업재해보상보험법(2015. 1. 20. 법률 제13045호로 개정되기 전의 것) 제5조 제2호, 제62조 제1항, 제2항 [별표 3], 구 진폐의 예방과 진폐근로자의 보호 등에 관한 법률(2010. 5. 20. 법률 제10304호로 개정되기 전의 것) 제24조 제1항 제3호, 제4항, 제25조 제3항, 근로기준법 제2조 제1항 제6호, 근로기준법 시행령 제52조",
    "참조판례": "대법원 2006. 2. 23. 선고 2005두11845 판결(공2006상, 520), 대법원 2023. 7. 13. 선고 2021두35438 판결(공2023하, 1469)",
    "판례내용": "【원고, 피상고인】 원고 (소송대리인 법무법인 강현 담당변호사 김선호 외 6인)\n【피고, 상고인】 근로복지공단\n【원심판결】 서울고법 2023. 12. 5. 선고 2020누56577 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.  \n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 따르면, 다음 사실을 알 수 있다. \n  가. 망 소외인(이하 ‘망인’이라 한다)은 1981. 3. 1.부터 대한석탄공사 ○○광업소에서 채탄선산부로 근무하던 중 1986. 9. 25. 최초 진폐 진단을 받았고, 장해등급 제11급으로 판정되어 당시 평균임금 10,838원 67전을 기준으로 산정한 장해보상일시금을 지급받았다. 이후에도 망인은 1989. 12. 31.경 퇴직할 때까지 약 3년간 위 광업소에서 채탄선산부로 계속 근무하면서 분진 등에 추가로 노출되었다. \n  나. 망인은 2004. 6. 9. 재검진을 거쳐 장해등급이 제7급으로 상향조정되었고, 이후 86,736원으로 재산정된 평균임금을 기준으로 한 장해보상일시금과 앞서 지급된 장해보상일시금과의 차액을 지급받았다. \n  다. 망인은 2008. 10. 13. 진폐 및 고도의 심폐기능장해 진단을 받아 재요양을 승인받았고, 재요양 중인 2014. 10. 7. 사망하였다. \n  라. 피고는 망인이 최초 진단을 받은 날을 평균임금 산정사유 발생일로 하여 산정한 평균임금을 산업재해보상보험법 제36조 제3항에 따라 증감한 금액을 기준으로 망인의 배우자인 원고에게 유족급여 및 유족위로금을 지급하였다. 한편 피고는 위 나.항에서 2004년경 재산정한 평균임금을 기준으로 지급한 장해보상일시금 차액은 착오에 의한 것이라는 이유로 이를 환수처분하였다.  \n  마. 원고는 망인이 재요양 상병의 진단을 받을 당시 평균임금을 증감한 금액을 유족급여 및 유족위로금 산정에 적용하여야 한다고 주장하면서, 피고에게 평균임금 정정 및 보험급여 차액 지급을 청구하였다. \n  바. 피고는 2016. 4. 26. 유족급여 및 유족위로금은 최초 진단일의 평균임금을 증감한 금액을 기준으로 산정하여야 한다는 이유로, 평균임금 정정 불승인 및 보험급여 차액 청구 부지급 처분(이하 ‘이 사건 처분’이라 한다)을 하였다. \n  2. 관련 법리\n  가. 구 산업재해보상보험법(2015. 1. 20. 법률 제13045호로 개정되기 전의 것, 이하 같다) 제62조 제1항, 제2항 [별표 3]은 근로자가 업무상의 사유로 사망한 경우에 유족에게 지급되는 유족급여(유족보상연금과 유족보상일시금)는 평균임금을 기준으로 산정하고, 구 「진폐의 예방과 진폐근로자의 보호 등에 관한 법률」(2010. 5. 20. 법률 제10304호로 개정되기 전의 것) 제24조 제1항 제3호, 제4항 및 제25조 제3항은 근로자가 진폐로 사망하여 유족이 산업재해보상보험법상 유족급여의 대상이 된 경우에 지급되는 유족위로금은 산업재해보상보험법상 유족보상일시금의 100분의 60에 해당하는 금액으로 한다고 규정하고 있다. 구 산업재해보상보험법 제5조 제2호는 ‘평균임금은 근로기준법에 따른 평균임금을 말한다.’고 규정하고, 근로기준법 제2조 제1항 제6호는 평균임금은 이를 산정할 사유가 발생한 날을 기준시점으로 하여 그 금액을 산출한다고 규정하며, 근로기준법 시행령 제52조는 재해보상을 하는 경우에는 ‘사망 또는 부상의 원인이 되는 사고가 발생한 날 또는 진단에 따라 질병이 발생되었다고 확정된 날’을 평균임금 산정사유 발생일로 규정하고 있다. \n  나. 이러한 규정들에 따르면, 진폐로 사망한 근로자에 대한 유족급여의 산정기준이 되는 평균임금의 산정사유 발생일은 특별한 사정이 없는 한 ‘진단에 따라 진폐가 발생되었다고 확정된 날’, 즉 ‘최초 진폐 진단일’을 의미하고, 이는 근로자가 최초 진단 시 요양급여를 받지 아니하고 장해급여를 받았거나 재요양을 받은 경우에도 마찬가지이다. 다만 최초 진단 이후의 사정이 사망의 직접적인 원인이 되었고 재요양의 대상이 된 상병 진단일의 평균임금(이하 ‘재요양 진단일의 평균임금’이라 한다)이 근로자의 통상의 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우에는 재요양 진단일을 평균임금 산정사유 발생일로 보는 것이 타당하다(대법원 2023. 7. 13. 선고 2021두35438 판결 참조). \n  다. 이때 ‘최초 진단 이후의 사정이 사망의 직접적인 원인이 된 경우’는 최초 진단 이후 근로자가 추가로 수행한 분진업무와 재요양 상병 및 그로 인한 사망 사이에 밀접하고 주된 원인관계가 인정되는 경우를 말한다. 이와 같은 직접적인 원인관계가 인정되는지는 최초 진단 후 분진에 추가로 노출된 정도, 최초 진단 전후 분진업무 종사기간의 길이, 최초 진단일 또는 최종 분진업무 종료일과 재요양 진단일 사이의 간격 및 재요양 상병의 호전 여부 등 여러 사정을 종합적으로 고려하여 법적·규범적 관점에서 판단하여야 한다. 최초 진단 후 분진 사업장이나 담당 업무에 변경이 없었다거나 최초 진단 후 분진업무 종사기간이 최초 진단 전 분진업무 종사기간보다 짧다는 사정만으로 직접적인 원인관계가 부정되는 것은 아니다. \n  라. 다음으로 ‘재요양 진단일의 평균임금이 근로자의 통상의 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우’란 특별한 사정이 없는 한 근로자가 ‘최초 진단일의 평균임금에 대하여 재요양 진단일까지 평균임금 증감을 한 금액’(이하 ‘최초 진단일 기준액’이라 한다)보다 높은 재요양 진단일의 평균임금을 기초로 산정된 휴업급여나 상병보상연금을 수령하여 근로자와 그에 의하여 부양되고 있던 유족이 생활하는 경제적 기초로서 그것이 근로자의 통상의 생활임금으로 되었다고 평가할 수 있는 경우를 말한다. 이와 같은 경우에도 최초 진단일 기준액을 기초로 유족급여를 산정한다면, 근로자의 통상의 생활임금을 사실대로 반영하지 못함으로써 근로자에 의하여 부양받고 있던 유족의 생활수준을 저하시킬 우려가 있는데, 이는 유족의 생활보장 등을 목적으로 하는 유족급여의 취지에 부합하지 않기 때문이다(대법원 2006. 2. 23. 선고 2005두11845 판결 등 참조). 이와 달리 근로자가 사망 당시 실제로 지급받던 휴업급여나 상병보상연금의 기초가 된 재요양 진단일의 평균임금이 최초 진단일 기준액과 같거나 그보다 낮았던 경우에는, 최초 진단일 기준액을 기초로 유족급여를 산정하더라도 유족의 생활수준을 저하시킬 우려가 없으므로, 평균임금 산정사유 발생일을 재요양 진단일로 보아야 하는 예외적인 경우에 해당하지 아니한다. \n  3. 원심의 판단\n  원심은 다음과 같은 이유로 유족급여의 산정기준이 되는 평균임금 산정사유 발생일은 재요양 진단일이고, 이와 다른 전제에서 한 이 사건 처분은 위법하므로 취소하여야 한다고 판단하였다. \n  가. 망인이 최초 진폐 진단을 받은 이후에도 3년 이상 같은 광업소에서 같은 직종으로 근무하면서 분진 등에 지속적으로 노출되었고, 이로 인하여 기존 진폐가 악화되어 재요양 상병을 진단받은 뒤 사망하였으므로, 최초 진단 이후의 사정이 망인의 사망에 직접적인 원인이 되었다. \n  나. 2004년 망인의 장해등급이 상향조정됨에 따라 지급된 장해보상일시금 차액에 적용된 평균임금이 최초 진단일의 평균임금보다 훨씬 높게 산정되는 등 재요양 진단일의 평균임금이 근로자의 통상의 생활임금을 사실대로 반영한다고 볼 수 있는 경우에 해당한다.   \n  4. 대법원의 판단 \n  가. 원심판결 이유를 앞서 본 법리와 기록에 비추어 보면, 원심이 최초 진단 이후 망인이 추가적으로 수행한 분진업무와 재요양 상병 및 그로 인한 사망 사이에 직접적인 원인관계가 인정된다고 판단한 것은 정당하다.\n  나. 그러나 원심이 재요양 진단일의 평균임금이 망인의 통상의 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우에 해당한다고 본 것은 다음과 같은 이유에서 수긍하기 어렵다.\n  1) 기록에 따르면, ① 망인은 재요양 기간 중에 휴업급여를 지급받은 사실, ② 재요양 당시 망인은 평균임금 산정의 대상이 되는 임금이 없는 경우에 해당하여 재요양 진단일의 평균임금이 산정되지 않았고 산업재해보상보험법 제56조 제2항에 따라 최저임금액을 1일당 휴업급여 지급액으로 하되, 같은 법 제55조 [별표 1]에 따라 감액한 고령자의 휴업급여를 지급받았을 뿐인 사실, ③ 망인의 최초 진단일의 평균임금 10,838원 67전을 재요양 진단일(2008. 10. 13.)까지 증감한 최초 진단일 기준액은 94,981원 42전인데, 2009년에 망인이 지급받은 휴업급여 일액은 그보다 훨씬 낮은 22,857원이었던 사실을 알 수 있다.\n  2) 위 사실을 앞서 본 법리에 비추어 보면, 망인은 재요양 기간 동안 최저임금을 기초로 산정된 휴업급여를 수령하였을 뿐, 최초 진단일 기준액보다 높은 재요양 진단일의 평균임금을 기초로 산정된 휴업급여를 수령한 것이 아니므로, 재요양 진단일의 평균임금이 망인의 통상의 생활임금을 사실대로 반영한다고 볼 수 있는 예외적인 경우에 해당하지 아니한다.\n  3) 그런데도 2004년에 망인에게 지급된 장해보상일시금 차액에 적용된 평균임금이 최초 진단일의 평균임금보다 훨씬 높게 산정되었다는 사실만을 근거로 재요양 진단일의 평균임금이 위와 같은 예외적인 경우에 해당한다고 본 원심의 판단에는, 진폐근로자의 유족급여에 적용할 평균임금 산정에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. \n  5. 결론\n  원심판결을 파기하고 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 노경필(재판장) 노태악 서경환(주심) 신숙희"

    "판시사항": "[1] 수 개의 행위 사이에 부당노동행위 의사의 단일성, 행위의 동일성·동종성, 시간적 연속성이 인정될 경우, 부당노동행위 구제신청 기간에 관한 노동조합 및 노동관계조정법 제82조 제2항에서 정한 ‘계속하는 행위’에 포함되는지 여부(적극) / 일정한 단위 기간마다 인사고과나 승격 심사를 하고 그 결과에 따라 임금을 결정하는 사업장에서 사용자의 근로자에 대한 하위 인사고과 부여 또는 승격 탈락이 같은 단위 기간에 대한 임금의 지급과 하나의 ‘계속하는 행위’를 구성하는지 여부(원칙적 적극) 및 단위 기간을 달리하는 인사고과 부여 등과 이에 기한 임금 지급을 하나의 ‘계속하는 행위’로 볼 수 있는지 여부(원칙적 소극)\n [2] 부당노동행위에 대한 구제신청기간이 지났는지 판단하는 기준 및 근로자 또는 노동조합이 지방노동위원회에 구제를 신청하기 위하여 제출하는 구제신청서에 기재해야 할 ‘구제받고자 하는 사항’ 등의 특정 정도",
    "판결요지": "[1] 노동조합 및 노동관계조정법(이하 ‘노동조합법’이라 한다) 제82조 제2항에 따르면, 부당노동행위에 대한 구제신청은 부당노동행위가 있은 날 또는 그 행위가 계속하는 행위인 때에는 그 종료일로부터 3개월 이내에 하여야 한다. 여기서 ‘계속하는 행위’란 1개의 행위가 바로 완결되지 않고 일정 기간 계속되는 경우뿐만 아니라 수 개의 행위라도 각 행위 사이에 부당노동행위 의사의 단일성, 행위의 동일성·동종성, 시간적 연속성이 인정될 경우도 포함한다. \n  일정한 단위 기간마다 인사고과나 승격 심사를 하고 그 결과에 따라 임금을 결정하는 사업장에서 노동조합 활동을 이유로 근로자에게 하위 인사고과를 부여하거나 승격에서 탈락시키는 부당노동행위를 하는 사용자의 의사에는 통상적으로 그에 따른 임금상의 불이익을 주려는 의사도 포함되어 있다고 볼 수 있다. 따라서 하위 인사고과 부여 또는 승격 탈락(이하 ‘인사고과 부여 등’이라 한다)은 특별한 사정이 없는 한 같은 단위 기간(예를 들어, 1년마다 인사고과 부여 등이 이루어지는 사업장에서 연초에 실시하는 전년도 근무성적에 대한 인사고과나 승격 심사와 이에 기한 그 연도 동안의 임금 지급은 같은 단위 기간에 이루어진 것이다)에 대한 임금의 지급과 하나의 ‘계속하는 행위’를 구성한다. \n  그러나 단위 기간을 달리하는 인사고과 부여 등과 이에 기한 임금 지급은 원칙적으로 하나의 ‘계속하는 행위’에 해당한다고 보기 어렵다. 주기적으로 행해지는 인사고과 부여 등 사이에 시간적 연속성이 존재한다고 보기 어려울 뿐만 아니라, 여러 단위 기간의 인사고과 부여 등과 임금 지급을 포괄하여 하나의 ‘계속하는 행위’로 보게 되면 구제신청 대상이 되는 행위의 범위가 과도하게 확장된다. 이는 노동조합법이 노동위원회에 의한 신속·간이한 행정적 구제절차로서의 성격 등을 고려하여 부당노동행위에 대한 구제신청기간을 3개월의 단기간으로 정한 취지에 반한다. 다만 사용자가 여러 단위 기간 동안 단일한 의사와 유사한 방식으로 미리 수립한 계획에 따라 일련의 부당노동행위를 실행하였다는 등의 사정이 드러난 경우에는 단위 기간을 달리하는 인사고과 부여 등과 임금 지급 사이에서도 ‘계속하는 행위’가 성립할 수 있다.\n [2] 부당노동행위에 대한 행정적 구제절차에서 심사대상은 구제신청의 대상이 된 부당노동행위를 구성하는 구체적 사실에 한정되므로, 부당노동행위에 대한 구제신청기간의 도과 여부는 근로자가 부당노동행위라고 주장하는 구체적 사실을 기준으로 판단해야 한다. 노동위원회규칙에 따르면 사용자로부터 부당노동행위로 인하여 권리를 침해당한 근로자 또는 노동조합이 지방노동위원회에 구제를 신청하기 위하여 제출하는 구제신청서에는 ‘구제받고자 하는 사항’ 등을 기재하도록 되어 있다. 그러나 근로자나 노동조합이 구제받고자 하는 사항은 민사소송의 청구취지처럼 엄격하게 해석할 것은 아니고 신청의 전 취지로 보아 어떠한 구제를 구하고 있는지를 알 수 있을 정도면 된다. 노동위원회는 재량에 의하여 근로자나 노동조합이 신청하고 있는 구체적 사실에 대응하여 적절·타당하다고 인정하는 구제를 명할 수 있다. 그러므로 구제신청서에 구제의 내용이 구체적으로 특정되어 있지 않더라도 부당노동행위를 구성하는 구체적인 사실을 주장하고 있다면 그에 대한 구제도 신청하고 있는 것으로 보아야 한다.",
    "참조조문": "[1] 노동조합 및 노동관계조정법 제82조 제2항 / [2] 노동조합 및 노동관계조정법 제82조",
    "참조판례": "[1][2] 대법원 2014. 5. 29. 선고 2011두24040 판결 / [2] 대법원 1999. 5. 11. 선고 98두9233 판결(공1999상, 1166)",
    "판례내용": "【원고, 상고인】 별지 1 원고 명단 기재와 같다. (소송대리인 법무법인 여는 담당변호사 김두현 외 4인)\n【피고, 피상고인】 중앙노동위원회위원장\n【피고보조참가인】 ○○○ 주식회사 외 2인 (소송대리인 변호사 김원정 외 4인)\n【피고보조참가인 겸 피고보조참가인 △△△ 주식회사의 소송수계인】 □□□ 주식회사 (소송대리인 변호사 김원정 외 4인)\n【원심판결】 대전고법 2023. 5. 2. 선고 2022누10724, 10731 판결\n【주    문】\n  원심판결 중 별지 2 기재 원고들의 구제신청에 대한 부분을 파기하고, 이 부분 사건을 대전고등법원에 환송한다.  별지 2 기재 원고들을 제외한 나머지 원고들의 상고를 모두 기각한다.  별지 2 기재 원고들을 제외한 나머지 원고들의 상고로 인한 상고비용은 보조참가로 인한 부분을 포함하여 같은 원고들이 부담한다. \n\n【이    유】  상고이유를 판단한다. \n  1. 관련 법리\n  가. 노동조합 및 노동관계조정법(이하 ‘노동조합법’이라 한다) 제82조 제2항에 의하면, 부당노동행위에 대한 구제신청은 부당노동행위가 있은 날 또는 그 행위가 계속하는 행위인 때에는 그 종료일로부터 3개월 이내에 하여야 한다. 여기서 ‘계속하는 행위’란 1개의 행위가 바로 완결되지 않고 일정 기간 계속되는 경우뿐만 아니라 수 개의 행위라도 각 행위 사이에 부당노동행위 의사의 단일성, 행위의 동일성·동종성, 시간적 연속성이 인정될 경우도 포함한다(대법원 2014. 5. 29. 선고 2011두24040 판결 참조). \n  나. 일정한 단위 기간마다 인사고과나 승격 심사를 하고 그 결과에 따라 임금을 결정하는 사업장에서 노동조합 활동을 이유로 근로자에게 하위 인사고과를 부여하거나 승격에서 탈락시키는 부당노동행위를 하는 사용자의 의사에는 통상적으로 그에 따른 임금상의 불이익을 주려는 의사도 포함되어 있다고 볼 수 있다. 따라서 하위 인사고과 부여 또는 승격 탈락(이하 ‘인사고과 부여 등’이라 한다)은 특별한 사정이 없는 한 같은 단위 기간(예를 들어, 1년마다 인사고과 부여 등이 이루어지는 사업장에서 연초에 실시하는 전년도 근무성적에 대한 인사고과나 승격 심사와 이에 기한 그 연도 동안의 임금 지급은 같은 단위 기간에 이루어진 것이다)에 대한 임금의 지급과 하나의 ‘계속하는 행위’를 구성한다. \n  다. 그러나 단위 기간을 달리하는 인사고과 부여 등과 이에 기한 임금 지급은 원칙적으로 하나의 ‘계속하는 행위’에 해당한다고 보기 어렵다. 주기적으로 행해지는 인사고과 부여 등 사이에 시간적 연속성이 존재한다고 보기 어려울 뿐만 아니라, 여러 단위 기간의 인사고과 부여 등과 임금 지급을 포괄하여 하나의 ‘계속하는 행위’로 보게 되면 구제신청 대상이 되는 행위의 범위가 과도하게 확장된다. 이는 노동조합법이 노동위원회에 의한 신속·간이한 행정적 구제절차로서의 성격 등을 고려하여 부당노동행위에 대한 구제신청기간을 3개월의 단기간으로 정한 취지에 반한다. 다만 사용자가 여러 단위 기간 동안 단일한 의사와 유사한 방식으로 미리 수립한 계획에 따라 일련의 부당노동행위를 실행하였다는 등의 사정이 드러난 경우에는 단위 기간을 달리하는 인사고과 부여 등과 임금 지급 사이에서도 ‘계속하는 행위’가 성립할 수 있다.\n  라. 부당노동행위에 대한 행정적 구제절차에서 그 심사대상은 구제신청의 대상이 된 부당노동행위를 구성하는 구체적 사실에 한정되므로, 부당노동행위에 대한 구제신청기간의 도과 여부는 근로자가 부당노동행위라고 주장하는 구체적 사실을 기준으로 판단하여야 한다(위 대법원 2011두24040 판결 등 참조). 노동위원회규칙에 의하면 사용자로부터 부당노동행위로 인하여 권리를 침해당한 근로자 또는 노동조합이 지방노동위원회에 그 구제를 신청하기 위하여 제출하는 구제신청서에는 ‘구제받고자 하는 사항’ 등을 기재하도록 되어 있다. 그러나 근로자나 노동조합이 구제받고자 하는 사항은 민사소송의 청구취지처럼 엄격하게 해석할 것은 아니고 신청의 전 취지로 보아 어떠한 구제를 구하고 있는지를 알 수 있을 정도면 된다. 노동위원회는 재량에 의하여 근로자나 노동조합이 신청하고 있는 구체적 사실에 대응하여 적절·타당하다고 인정하는 구제를 명할 수 있다. 그러므로 구제신청서에 구제의 내용이 구체적으로 특정되어 있지 않다고 하더라도 부당노동행위를 구성하는 구체적인 사실을 주장하고 있다면 그에 대한 구제도 신청하고 있는 것으로 보아야 한다(대법원 1999. 5. 11. 선고 98두9233 판결 참조).\n  2. 원심의 판단\n  원심은 다음과 같은 이유로 이 사건 구제신청은 노동조합법 제82조 제2항에서 정한 제척기간을 도과하여 부적법하다고 판단하였다. \n  가. 원고들이 이 사건 구제신청을 한 날은 2019. 8. 30.로서, 마지막 승격 통보일인 2019. 3. 1.부터 기산하더라도 노동조합법 제82조 제2항에서 정한 구제신청기간을 경과하였다. \n  나. 이 사건 구제신청서의 ‘신청취지’란에는 ‘참가인들이 2015년부터 2019년 상반기까지 원고 노조원들에 대하여 하위 인사고과를 부여하고 승격에서 누락시킨 것은 불이익취급 및 지배·개입의 부당노동행위임을 인정한다.’는 내용 외에 ‘참가인들은 부당한 고과평가를 취소하여 재실시하고, 재평가결과에 따라 정기승급 및 승격을 실시하며, 부당한 고과평가 및 승격 누락으로 지급받지 못한 임금 상당액을 지급하라.’는 내용도 기재되어 있다. 그러나 이는 원고들이 부당노동행위로 특정한 하위 인사고과 부여 및 승격 탈락에 따라 발생한 ‘불이익의 시정을 구하는 취지’에 불과하고, 원고들이 임금상 불이익 그 자체를 ‘부당노동행위로 특정’한 것은 아니다. 구제신청기간의 도과 여부는 원고들이 부당노동행위로 특정하여 주장한 사실을 기준으로 판단하면 족하고, 원고들이 시정을 구한 부분까지 고려할 것은 아니다. 그런데 원고들은 ‘2015년부터 2019. 3. 1.까지의 하위 인사고과 부여 및 승격 누락’만을 부당노동행위로 특정하면서 그에 따라 승급, 임금 등 여러 면에서 불이익을 입고 있다고 주장하였을 뿐, 임금상 불이익 자체를 부당노동행위로 특정하지 않았다.  \n  다. 이 사건 구제신청서에는 구제의 내용이 구체적으로 특정되어 있고, 이에 대하여 노동위원회가 보정을 명하거나 석명을 구할 필요도 없었으며, 원고들은 구제신청 사건의 심리 과정에서 구제신청기간의 도과 여부가 핵심 쟁점으로 부각되었음에도 신청취지를 추가·변경하지 않았다. \n  3. 대법원의 판단\n  가. 이 사건 재심판정 중 별지 2 기재 원고들의 구제신청에 대한 부분\n  1) 그러나 앞서 본 관련 법리와 기록에 비추어 보면, 원심이 별지 2 기재 원고들의 구제신청까지 모두 구제신청기간을 도과하였다고 판단한 것은 그대로 수긍하기 어렵다. 구체적인 이유는 다음과 같다. \n  가) 참가인들이 2018년에 인사고과 부여 등(2018년 상·하반기 업적평가와 역량평가, 2019. 3. 1. 자 승격 여부 통보를 말한다. 다른 연도의 인사고과 부여 등도 같은 방법으로 칭한다)을 실시하고 이를 기초로 2019. 3.부터 2020. 2.까지 임금을 지급한 행위(이하 ‘2019년의 임금 지급’ 또는 ‘2019년의 임금상 불이익’이라 한다)는 같은 단위 기간에 관하여 이루어진 것이므로 하나의 ‘계속하는 행위’에 해당한다고 볼 수 있다. 이 사건 구제신청은 2018년의 인사고과 부여 등에 따라 임금이 지급되던 중인 2019. 8. 30. 제기되었다. 따라서 이 사건 구제신청 중 2018년의 인사고과 부여 등과 2019년의 임금상 불이익에 관한 부분은, 원고들이 이를 노동위원회 구제절차에서 부당노동행위로 주장하였다면, 그 전부가 구제신청기간을 준수한 것이 된다. \n  나) 원고들은 이 사건 구제신청서의 신청취지란에 \"참가인들이 원고들에 대하여 별지 1 신청취지 내용 표의 ‘① 2015년~2019년 하위 고과자’란 기재와 같이 하위 인사고과를 부여한 것과 ‘③ 승격 누락’란 기재와 같이 승격 탈락을 시킨 것을 부당노동행위로 인정하고, ‘② 임금(급여) 불이익’란에 표시된 원고들에 대해 부당한 평가로 지급받지 못한 임금 상당액을 지급하고, 위 ③란에 표시된 원고들에 대해 승격 탈락으로 지급받지 못한 임금 상당액을 지급하여야 한다.\"라고 기재하였다. 그중 별지 2 기재 원고들은, (1) 위 ①란에 2018년 인사고과 부여 등을 기재함과 동시에 위 ②란에 임금상 불이익의 내용(정기승급 누락 또는 연봉 삭감)을 기재하거나 (2) 위 ③란에 ‘승격 누락’이라고 기재하고 이후 구제절차 진행 과정에서 여기에 2018년 승격 탈락이 포함된다고 특정한 근로자들 및 이들이 가입한 노동조합이다. \n  다) 별지 2 기재 원고들은 이 사건 구제신청서의 ‘신청취지’란과 ‘별지 1’을 통하여 2018년의 하위 인사고과 부여, 2018년의 승격 탈락과 그 승격 탈락에 따른 임금상 불이익을 부당노동행위로 인정해 줄 것을 명시하였고, 2018년 하위 인사고과 부여에 따른 임금상 불이익에 관해서는 그 시정을 구함을 명확히 밝혔다. 그 후 노동위원회에 제출한 ‘신청이유 2’ 등 서면을 통해서도 인사고과 부여 등으로 인하여 임금상 불이익이 지속되고 있다는 주장을 충분히 개진하였다. 그렇다면 위 원고들은 이 사건 구제신청 절차에서 2018년의 인사고과 부여 등과 2019년의 임금 지급을 모두 부당노동행위를 구성하는 구체적인 사실로 주장하였다고 보아야 하고, 2018년의 인사고과 부여 등과 2019년의 임금 지급은 하나의 ‘계속하는 행위’에 해당하므로 이에 관한 위 원고들의 구제신청 부분은 구제신청기간을 도과하였다고 볼 수 없다. \n  2) 따라서 원심으로서는 별지 2 기재 원고들이 임금상 불이익을 부당노동행위로 주장하지 않았다고 보아 구제신청기간을 도과했다고 판단해서는 아니 되고, 위 원고들의 구제신청 중 2018년의 인사고과 부여 등과 2019년의 임금 지급에 관한 부분이 구제신청기간을 준수하였다는 전제에서, 2017년 이전의 인사고과 부여 등과 2018년의 인사고과 부여 등을 ‘계속하는 행위’에 해당한다고 볼 만한 특별한 사정이 있는지에 관하여 심리·판단한 다음, 이에 따라 이 사건 재심판정 중 ‘계속하는 행위’로 인정되는 일련의 행위들에 관한 부분을 취소하였어야 한다. 그런데도 원심은 그 판시와 같은 사정만으로 위 원고들의 구제신청이 전부 구제신청기간을 도과하였다고 보아 위 원고들의 청구를 모두 기각하고 말았다. 이러한 원심의 판단에는 부당노동행위 구제신청기간 및 ‘계속하는 행위’에 관한 법리 등을 오해하여 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 있다.\n  나. 이 사건 재심판정 중 별지 2 기재 원고들을 제외한 나머지 원고들의 구제신청에 대한 부분\n  1) 이 사건 구제신청서의 내용과 전체적인 취지, 원고들이 구제신청 절차에서 한 주장 등에 비추어 볼 때, 별지 2 기재 원고들을 제외한 나머지 원고들은 2019. 3. 이후에는 임금상 불이익을 받지 않았거나 이를 부당노동행위의 구체적 사실로 주장하였다고 보기 어렵다. 위 원고들이 부당노동행위로 주장한 구체적 사실은 늦어도 2018년 인사고과가 마쳐진 2019. 1. 31.에 모두 종료되었으므로 위 원고들의 구제신청은 구제신청기간을 도과하였다.\n  2) 원심의 이유 설시에 일부 부적절한 부분이 있지만, 위 원고들이 구제신청기간을 준수하지 못하였다는 이유로 위 원고들의 청구를 기각한 원심의 결론은 정당하고, 거기에 부당노동행위 구제신청기간 및 ‘계속하는 행위’에 관한 법리 등을 오해하여 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 없다.\n  4. 결론\n  그러므로 원심판결 중 별지 2 기재 원고들에 대한 부분을 파기하고, 이 부분 사건을 다시 심리·판단하도록 원심법원에 환송하며, 별지 2 기재 원고들을 제외한 나머지 원고들의 상고를 모두 기각하고, 같은 원고들의 상고로 인한 상고비용은 보조참가로 인한 부분을 포함하여 같은 원고들이 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n[별 지 1] 원고 명단: 생략\n[별 지 2] 원고 명단: 생략\n\n대법관 엄상필(재판장) 이흥구(주심) 오석준 이숙연"

    "판시사항": "폐기물을 토양 등에 접촉시켜 성토재 등으로 재활용하려는 자는 구 폐기물관리법 제13조의2 제1항 각호 및 제5호의 위임을 받은 구 폐기물관리법 시행규칙 제14조의3 제1항 [별표 5의3]에서 정한 폐기물 재활용 유형별 재활용 기준과 위 법 같은 조 제3항의 위임을 받은 위 시행규칙 같은 조 제5항 [별표 5의4]에서 정한 준수사항을 모두 따라야 하는지 여부(적극)",
    "판결요지": "구 폐기물관리법(2019. 11. 26. 법률 제16614호로 개정되기 전의 것, 이하 같다)은 폐기물의 발생을 억제하는 동시에 발생한 폐기물을 친환경적으로 처리하여 환경보전과 국민생활의 질적 향상에 이바지하는 것을 목적으로 한다(제1조). 이를 위하여 구 폐기물관리법은 누구든지 폐기물을 재활용할 수 있도록 하면서도, 사람이나 환경에 위해가 발생할 우려가 있는 경우 폐기물의 재활용을 금지하는 ‘원칙적 허용·예외적 금지 방식’을 취하고 있다(제13조의2). 이러한 폐기물 재활용 제도의 체계와 한번 파괴된 환경은 회복에 막대한 시간과 비용이 소요되는 점을 고려하면, 폐기물 재활용을 활성화하되 그로 인한 환경오염 등의 부작용을 막기 위한 사전예방수단으로 폐기물의 재활용 기준과 재활용의 준수사항을 엄격하게 설정할 필요성이 크다. \n  폐기물을 토양 등에 접촉시켜 성토재 등으로 재활용하는 경우 재활용 대상 폐기물에 토양오염물질이 함유되어 있다면 이것이 기존 토양과 상호작용하는 과정에서 유해물질이 유출되어 토양을 오염시킬 가능성을 배제할 수 없다. 따라서 토양에 접촉하는 성토재 등으로 재활용하는 폐기물은 재활용 대상으로서 폐기물 자체의 처리와 관련한 기준이 필요할 뿐 아니라 토양오염을 예방·저감하기 위한 차원에서 관리될 필요가 있다. R-7-1 유형은 폐기물을 토양 등에 접촉시켜 성토재 등으로 재활용하는 전형적인 유형이고, 특히 토목·건축공사의 성토재로 사용된 폐기물은 공사가 완료되고 나면 이를 다시 분리해 내기도 쉽지 않다. \n구 폐기물관리법 제13조의2에 따르면 제1항 각호에서 정한 폐기물 재활용 기준을 하나라도 위반한 경우 폐기물을 재활용할 수 없다. 재활용의 유형별로 구체적인 재활용 기준을 정한 제5호 및 그 위임을 받은 구 폐기물관리법 시행규칙(2020. 5. 27. 환경부령 제868호로 개정되기 전의 것, 이하 같다) 제14조의3 제1항 [별표 5의3](이하 ‘[별표 5의3]’이라 한다)과 달리, 제1호 내지 제3호는 토양오염을 비롯한 환경오염행위를 금지하면서도 구체적으로 어떠한 경우 환경오염행위에 해당한다고 볼 수 있는지에 대하여는 직접 정하지 않고 있다. 대신 같은 조 제3항에서 제1항이 정한 원칙을 지키기 위하여 필요한 오염 예방 및 저감 방법의 종류와 정도 등 준수사항은 환경부령으로 정한다고 규정하고 있으며, 그 위임에 따라 제정된 구 폐기물관리법 시행규칙 제14조의3 제5항 [별표 5의4](이하 ‘[별표 5의4]’라 한다)가 제1항에서 정한 오염·유해물질별로 오염 예방 및 저감 방법과 정도를 정하고 있다. \n  이러한 구 폐기물관리법의 문언과 체계에 비추어 보면, 폐기물을 재활용하려는 자는 같은 법 제13조의2 제1항 제1호 내지 제5호 및 제5호의 위임을 받은 [별표 5의3]이 정한 폐기물 재활용 유형별 재활용 기준을 모두 준수해야 하고, 나아가 같은 조 제1항 제1호 내지 제3호가 정한 기준을 위반하지 않기 위하여 [별표 5의4]에서 정한 준수사항을 따라야 한다. \n  위와 같은 사정을 종합하면, 구 폐기물관리법 제13조의2 제3항은 제1항과 중첩하여 적용되는 것이지, 제1항이 우선 적용되어 제3항의 적용을 배제하는 것이라거나, 제1항과 제3항이 서로 충돌하는 규정이라고 보기 어렵다.",
    "참조조문": "구 폐기물관리법(2019. 11. 26. 법률 제16614호로 개정되기 전의 것) 제1조, 제13조의2 제1항, 제3항, 제48조, 구 폐기물관리법 시행규칙(2020. 5. 27. 환경부령 제868호로 개정되기 전의 것) 제14조의3 제1항 [별표 5의3], 제5항 [별표 5의4], 구 토양환경보전법 시행규칙(2020. 7. 14. 환경부령 제873호로 개정되기 전의 것) 제1조의5 [별표 3]",
    "참조판례": "",
    "판례내용": "【원고, 피상고인】 주식회사 ○○○ (소송대리인 변호사 김용규)\n【피고, 상고인】 울주군수\n【원심판결】 부산고법 2022. 12. 7. 선고 (울산)2021누10503 판결\n【주    문】\n  원심판결을 파기하고, 사건을 부산고등법원에 환송한다. \n\n【이    유】  상고이유를 판단한다. \n  1. 사안의 개요 \n  가. 폐기물 종합재활용업자인 원고는 광재류 등 폐기물을 재활용하여 울산 울주군 (이하 생략) 소재 건축토목공사현장(이하 ‘이 사건 현장’이라 한다)에 성토재로 반입하였다. \n  나. 피고는 2020. 3. 23. 원고가 이 사건 현장에 공급한 성토재에서 시료를 채취하여 토양오염 공정시험을 의뢰하였고, 검사 결과 위 성토재에서 구 폐기물관리법(2019. 11. 26. 법률 제16614호로 개정되기 전의 것, 이하 같다) 제13조의2 제3항, 구 폐기물관리법 시행규칙(2020. 5. 27. 환경부령 제868호로 개정되기 전의 것, 이하 같다) 제14조의3 제5항 [별표 5의4], 구 토양환경보전법 시행규칙(2020. 7. 14. 환경부령 제873호로 개정되기 전의 것) [별표 3] 토양오염우려기준(이하 ‘토양오염우려기준’이라고 한다) 중 이 사건 현장과 같은 임야 지역에 해당하는 2지역의 기준치를 초과하는 카드뮴, 아연, 불소가 검출된 사실이 확인되었다. \n  다. 피고는 2020. 4. 27. 원고가 이 사건 현장에서 토양오염우려기준을 초과한 폐기물을 재활용하여 성토재로 사용함으로써 구 폐기물관리법 제13조의2 제3항에서 규정한 ‘폐기물을 재활용하는 자의 준수사항’을 위반하였다는 이유로 폐기물관리법 제48조에 따라 원고에게 2020. 5. 26.까지 이 사건 현장에 반입된 모든 폐기물을 수거하고 적법하게 처리한 뒤 이행완료보고서를 제출하라는 조치명령(이하 ‘이 사건 처분’이라 한다)을 하였다. \n  2. 관련 규정 및 쟁점 \n  가. 관련 규정\n  1) 구 폐기물관리법 제48조에 의하면 환경부장관, 시·도지사 또는 시장·군수·구청장은 폐기물이 제13조의2에 따른 ‘폐기물의 재활용 원칙 및 준수사항’에 맞지 아니하게 처리된 경우 폐기물을 처리한 자 등에게 기간을 정하여 폐기물의 처리방법 변경, 폐기물의 처리 또는 반입 정지 등 필요한 조치를 명할 수 있다. \n  2) 구 폐기물관리법 제13조의2는 ‘폐기물의 재활용 원칙 및 준수사항’이라는 표제 아래 제1항에서 \"누구든지 다음 각호를 위반하지 아니하는 경우에는 폐기물을 재활용할 수 있다.\"라고 규정하면서 각호에서 대기오염물질 등이 배출되어 생활환경에 위해를 미치지 아니할 것(제1호), 유해물질이 유출되어 토양, 수생태계 또는 지하수를 오염시키지 아니할 것(제2호), 소음 또는 진동이 발생하여 사람에게 피해를 주지 아니할 것(제3호), 그 밖에 환경부령으로 정하는 재활용의 기준을 준수할 것(제5호) 등을 규정하고 있다. 한편 같은 조 제3항은 \"제1항 및 제2항 각호의 원칙을 지키기 위하여 필요한 오염 예방 및 저감 방법의 종류와 정도, 폐기물의 취급 기준과 방법 등의 준수사항은 환경부령으로 정한다.\"라고 규정하고 있다. \n  3) 구 폐기물관리법 제13조의2 제1항 제5호의 위임을 받은 구 폐기물관리법 시행규칙 제14조의3 제1항 [별표 5의3](이하 ‘[별표 5의3]’이라 한다)은 재활용 유형별로 ‘폐기물의 재활용 기준’을 상세히 규정하고 있으며, 같은 법 같은 조 제3항의 위임을 받은 구 폐기물관리법 시행규칙 제14조의3 제5항 [별표 5의4](이하 ‘[별표 5의4]’라고 한다)는 ‘폐기물을 재활용하는 자의 준수사항’에 관하여 대기오염물질, 소음·진동, 수질오염물질, 악취, 침출수, 토양오염물질 등으로 구분하여 ‘오염 예방 및 저감 방법의 종류와 정도’에 관하여 상세히 규정하고 있다. \n  4) [별표 5의3]에서는 폐기물을 토양 등에 접촉시켜 성토재 등으로 사용하는 방식(R-7 유형) 중 일부 세부유형에 대하여는 재활용 대상 폐기물에 함유된 오염물질이 토양오염우려기준 이내여야 한다고 명시한 반면, 인허가받은 토목·건축공사의 성토재 등으로 사용하는 경우(R-7-1 유형) 토양오염우려기준을 충족하여야 한다는 명시적인 규정을 두지 않고 있다(이하 ‘이 사건 재활용 기준’이라 한다).\n  이와 달리 [별표 5의4]에 의하면, 폐기물을 토양 등에 접촉시켜 성토재 등으로 재활용하는 경우 물리적·화학적 또는 생물학적 처리 방법을 이용하여 폐기물에 포함된 토양오염물질을 처리하여 사람이나 환경에 위해가 발생하지 않도록 해야 하고[제1호 (가)목 1) 바)], 이때 그 오염 예방 및 저감 정도는 토양오염우려기준 이내여야 한다[제1호 (나)목 6)](이하 통틀어 ‘이 사건 재활용 준수사항’이라 한다). \n  나. 쟁점\n  이 사건의 쟁점은, 원고가 폐기물을 토양 등에 접촉시켜 인허가받은 건축토목공사현장의 성토재 등으로 사용하는 방식(R-7-1 유형)의 재활용을 하면서 이 사건 재활용 기준은 충족하였으나, 폐기물이나 그 성토한 부분 자체의 토양오염물질이 토양오염우려기준을 초과하여 이 사건 재활용 준수사항을 충족하지 못한 경우 구 폐기물관리법 제13조의2를 위반한 것이 되는지 여부이다. \n  3. 원심의 판단 \n  원심은 판시와 같은 이유로, 구 폐기물관리법 제13조의2 제3항은 제1항이 정한 폐기물 재활용의 원칙을 지키기 위한 준수사항일 뿐 제1항이 정한 원칙을 보충·변경할 수 없고, 따라서 제1항 제5호의 위임을 받은 이 사건 재활용 기준이 R-7-1 유형에 관하여 재활용 대상 폐기물 및 이를 성토한 부분이 토양오염우려기준을 충족하여야 한다는 취지의 명시적인 규정을 두지 않은 이상, 제3항의 위임을 받은 이 사건 재활용 준수사항에 토양오염우려기준을 준수해야 한다는 내용이 있더라도 이는 R-7-1 유형에 적용되지 않는다고 보아 이 사건 처분이 위법하다는 원고의 주장을 받아들였다. \n  4. 대법원의 판단 \n  가. 그러나 원심의 위와 같은 판단은 아래와 같은 이유로 수긍하기 어렵다. \n  1) 구 폐기물관리법은 폐기물의 발생을 억제하는 동시에 발생한 폐기물을 친환경적으로 처리하여 환경보전과 국민생활의 질적 향상에 이바지하는 것을 목적으로 한다(제1조). 이를 위하여 구 폐기물관리법은 누구든지 폐기물을 재활용할 수 있도록 하면서도, 사람이나 환경에 위해가 발생할 우려가 있는 경우 폐기물의 재활용을 금지하는 ‘원칙적 허용·예외적 금지 방식’을 취하고 있다(제13조의2). 이러한 폐기물 재활용 제도의 체계와 한번 파괴된 환경은 그 회복에 막대한 시간과 비용이 소요되는 점을 고려하면, 폐기물 재활용을 활성화하되 그로 인한 환경오염 등의 부작용을 막기 위한 사전예방수단으로 폐기물의 재활용 기준과 재활용의 준수사항을 엄격하게 설정할 필요성이 크다. \n  2) 폐기물을 토양 등에 접촉시켜 성토재 등으로 재활용하는 경우 재활용 대상 폐기물에 토양오염물질이 함유되어 있다면 이것이 기존 토양과 상호작용하는 과정에서 유해물질이 유출되어 토양을 오염시킬 가능성을 배제할 수 없다. 따라서 토양에 접촉하는 성토재 등으로 재활용하는 폐기물은 재활용 대상으로서 폐기물 자체의 처리와 관련한 기준이 필요할 뿐 아니라 토양오염을 예방·저감하기 위한 차원에서 관리될 필요가 있다. R-7-1 유형은 폐기물을 토양 등에 접촉시켜 성토재 등으로 재활용하는 전형적인 유형이고, 특히 토목·건축공사의 성토재로 사용된 폐기물은 공사가 완료되고 나면 이를 다시 분리해 내기도 쉽지 않다.\n  3) 구 폐기물관리법 제13조의2에 따르면 제1항 각호에서 정한 폐기물 재활용 기준을 하나라도 위반한 경우 폐기물을 재활용할 수 없다. 재활용의 유형별로 구체적인 재활용 기준을 정한 제5호 및 그 위임을 받은 [별표 5의3]과 달리, 제1호 내지 제3호는 토양오염을 비롯한 환경오염행위를 금지하면서도 구체적으로 어떠한 경우 환경오염행위에 해당한다고 볼 수 있는지에 대하여는 직접 정하지 않고 있다. 대신 같은 조 제3항에서 제1항이 정한 원칙을 지키기 위하여 필요한 오염 예방 및 저감 방법의 종류와 정도 등 준수사항은 환경부령으로 정한다고 규정하고 있으며, 그 위임에 따라 제정된 [별표 5의4]가 제1항에서 정한 오염·유해물질별로 그 오염 예방 및 저감 방법과 그 정도를 정하고 있다. \n이러한 구 폐기물관리법의 문언과 체계에 비추어 보면, 폐기물을 재활용하려는 자는 같은 법 제13조의2 제1항 제1호 내지 제5호 및 제5호의 위임을 받은 [별표 5의3]이 정한 폐기물 재활용 유형별 재활용 기준을 모두 준수하여야 하고, 나아가 같은 조 제1항 제1호 내지 제3호가 정한 기준을 위반하지 않기 위하여 [별표 5의4]에서 정한 준수사항을 따라야 한다.\n  4) 위와 같은 사정을 종합하면, 구 폐기물관리법 제13조의2 제3항은 제1항과 중첩하여 적용되는 것이지, 제1항이 우선 적용되어 제3항의 적용을 배제하는 것이라거나, 제1항과 제3항이 서로 충돌하는 규정이라고 보기 어렵다. \n  5) 그러므로 R-7-1 유형으로 폐기물을 재활용한 원고는, 이 사건 재활용 기준에 R-7-1 유형 재활용의 세부기준으로 토양오염우려기준을 준수하여야 한다는 명시적인 규정이 없더라도 이 사건 재활용 준수사항에 따라 성토재로 재활용하는 폐기물에 포함된 토양오염물질이 이 사건 현장에 적용되는 토양오염우려기준을 넘지 않도록 해야 한다. 구 폐기물관리법 시행규칙이 이 사건 처분 이후 개정되었다고 하더라도 달리 볼 수 없다. \n  나. 그런데도 원심은 R-7-1 유형의 재활용 대상 폐기물이나 그 성토한 부분 자체에는 이 사건 재활용 기준만이 적용될 뿐 이 사건 재활용 준수사항이 적용되지 않는다고 보아, 토양오염우려기준을 초과한 오염물질이 검출되었음을 처분사유로 한 이 사건 처분이 위법하다고 판단하였다. 이러한 원심판단에는 구 폐기물관리법 제13조의2, [별표 5의3], [별표 5의4] 등 관련 규정의 해석·적용에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 상고이유 주장은 이유 있다. \n  5. 결론\n  그러므로 원심판결을 파기하고 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오석준(재판장) 이흥구 엄상필 이숙연(주심)"
  },

    "참조판례": "대법원 2013. 11. 14. 선고 2013두11796 판결, 대법원 2016. 5. 12. 선고 2016두30187 판결(공2016상, 805), 대법원 2017. 5. 18. 선고 2012두22485 전원합의체 판결(공2017상, 1321)",
    "판례내용": "【원고, 상고인】 주식회사 ○○○ (소송대리인 변호사 김용덕 외 5인)\n【피고, 피상고인】 연수세무서장 (소송대리인 법무법인 위즈 담당변호사 서정호 외 3인)\n【원심판결】 서울고법 2023. 9. 1. 선고 2022누69249 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 각 상고이유보충서 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 따르면 다음과 같은 사실을 알 수 있다. \n  가. 원고는 2001. 4.경 독일 제약회사 △△△ GmbH ＆ Co(변경 후 상호: □□□ GmbH) 및 이탈리아 제약회사 ◇◇◇ S.p.A.(변경 후 상호: □□□ S.r.l., 이하 위 두 회사를 통틀어 ‘소외 회사들’이라 한다)와 5대 소아질병에 대한 액상 형태의 백신인 (제품명 생략) 공동 개발·제조를 위한 협력계약(Collaboration Agreement, 이하 ‘이 사건 협력계약’이라 한다)을 체결하였다.\n  나. 원고는 이 사건 협력계약에 따라 소외 회사들로부터 (제품명 생략) 원재료인 4가 백신물질(디프테리아, 파상풍, 백일해, B형 헤모필루스 인플루엔자 관련 백신물질)을 수입하고 여기에 원고가 생산한 1가 백신물질(B형 간염 관련 백신물질)을 혼합하여 5가 백신인 (제품명 생략)을 제조·판매하였다.\n  다. 중부지방국세청장은 2015~2017년경 원고에 대한 세무조사, 국세청 종합감사 등을 거친 다음, ‘원고가 소외 회사들과 (제품명 생략)을 공동개발하여 판매하는 사업[이하 ‘(제품명 생략) 공동사업’이라 한다]을 영위하였으므로, 원고와 소외 회사들 중 1인을 대표자로 한 공동사업자를 직권등록하고, (제품명 생략) 공동사업자를 거래당사자로 보아 부가가치세를 부과하여야 한다.’는 전제에서, ① 원고의 2013년 제1기부터 2015년 제2기까지 각 매입세액 중 4가 백신물질 수입과 관련한 매입세액을 불공제하고, ② 같은 기간에 원고가 1가 백신물질을 (제품명 생략) 공동사업자에게 공급한 것으로 보아 그 거래금액을 공급가액에 산입하며, ③ 2012년 제1기부터 2015년 제2기까지 (제품명 생략) 공동사업자의 영세율과세표준 무신고 및 공동사업자 미등록에 대한 각 가산세를 부과할 것을 피고에게 통보하였다.\n  라. 그에 따라 피고는 원고에게, 2013년 제1기~2015년 제2기 각 부가가치세(가산세 포함)를 경정·고지하고, 2012년 제1기~2015년 제2기 영세율과세표준 신고불성실가산세 및 사업자미등록가산세를 결정·고지하였다(이하 통틀어 ‘이 사건 각 처분’이라 한다).\n  2. 원심의 판단\n  원심은 판시와 같은 이유로, 원고와 소외 회사들의 (제품명 생략) 공동사업자가 (제품명 생략)을 제조·판매하고 소외 회사들로부터 4가 백신물질을 수입한 것이므로, 이 사건 협력계약에 따른 원고와 소외 회사들의 (제품명 생략) 공동사업자가 구 부가가치세법(2015. 12. 15. 법률 제13556호로 개정되기 전의 것, 이하 같다)상 납세의무자에 해당한다고 보아 이 사건 각 처분이 적법하다고 판단하였다. \n  3. 대법원의 판단\n  가. 부가가치세는 재화나 용역이 생산·제공되거나 유통되는 모든 단계에서 창출된 부가가치를 과세표준으로 하고 소비행위에 담세력을 인정하여 과세하는 소비세로서의 성격을 가지고 있지만, 부가가치세법은 부가가치 창출을 위한 ‘재화 또는 용역의 공급’이라는 거래 그 자체를 과세대상으로 하고 있을 뿐 그 거래에서 얻은 소득이나 부가가치를 직접적인 과세대상으로 삼고 있지 않다. 이와 같이 우리나라의 부가가치세는 실질적인 소득이 아닌 거래의 외형에 대하여 부과하는 거래세의 형태를 띠고 있으므로, 부가가치세법상 납세의무자에 해당하는지 역시 원칙적으로 그 거래에서 발생한 이익이나 비용의 귀속이 아니라 재화 또는 용역의 공급이라는 거래행위를 기준으로 판단하여야 한다. 그리고 부가가치세의 과세원인이 되는 재화의 공급으로서 인도 또는 양도는 재화를 사용·소비할 수 있도록 소유권을 이전하는 행위를 전제로 하므로, ‘재화를 공급하는 자’는 위탁매매나 대리와 같이 부가가치세법에서 별도의 규정을 두고 있지 않는 한 계약상 또는 법률상의 원인에 의하여 재화를 사용·소비할 수 있는 권한을 이전하는 행위를 한 자를 의미한다(대법원 2017. 5. 18. 선고 2012두22485 전원합의체 판결 등 참조). 그리고 부가가치세법상 ‘재화를 공급받는 자’는 계약상 또는 법률상의 원인에 의하여 재화를 인도·양도받는 자를 의미하므로, 계약상 원인에 의하여 ‘재화를 공급받는 자’가 누구인가를 결정할 때에는 재화공급의 원인이 되는 계약의 당사자 및 내용, 재화의 공급은 누구를 위하여 이루어지는 것이며 대가의 지급관계는 어떠한지 등 여러 사정을 종합적으로 고려하여야 한다(대법원 2016. 5. 12. 선고 2016두30187 판결 등 참조). 한편 구 부가가치세법 제35조 제1항에 따라 수입되는 재화에 대하여 세금계산서를 발급받아야 할 ‘수입하는 자’는 그 수입의 효과가 실질적으로 귀속되는 자를 의미한다(대법원 2013. 11. 14. 선고 2013두11796 판결 등 참조).\n  나. 원심판결 이유와 기록에 의하여 알 수 있는 다음과 같은 사정을 위 법리에 비추어 살펴보면, 4가 백신물질 수입거래, (제품명 생략) 완제품 수출거래 등 이 사건 각 처분의 과세대상 거래행위에 대한 구 부가가치세법상 납세의무자는 원고로 봄이 타당하므로, 이와 다른 전제에서 이 사건 각 처분이 적법하다고 본 원심판단은 그대로 수긍하기 어렵다.\n  1) 이 사건 각 처분은 원고와 소외 회사들의 (제품명 생략) 공동사업자가 실질적 거래주체로서 구 부가가치세법상 납세의무자에 해당함을 전제로 하나, 원고와 소외 회사들이 공동의 목적 달성을 위하여 상호 협력한 정도를 넘어 공동사업관계를 형성하고 그러한 공동사업자에게 이 사건 각 처분의 과세대상 거래행위에 따른 권리의무와 그 법률효과가 종국적으로 귀속된다고 보기 어렵다.\n  2) 원고는 소외 회사들과 사이에 4가 백신물질 수입을 위한 대량공급계약을 체결하고 자신의 계산과 책임 아래 소외 회사들에 대금을 지급하여 이를 수입하였으므로, 그 수입의 효과가 실질적으로 귀속되는 자에 해당한다. 이처럼 원고는 계약상 원인에 의하여 소외 회사들로부터 4가 백신물질을 공급받는 자로서 세관장으로부터 수입세금계산서를 교부받아야 할 ‘재화를 수입하는 자’에 해당하므로, 수입세금계산서의 필요적 기재사항 중 하나인 ‘수입자의 등록번호’가 사실과 다르게 적힌 경우라고 볼 수 없다. 이와 달리 원고와 소외 회사들이 4가 백신물질의 공급가액을 책정하면서 예상 총마진에 대한 (제품명 생략) 연구개발비용 분담비율을 고려한 이익분할방법을 활용하였음을 들어 4가 백신물질의 수입자를 (제품명 생략) 공동사업자로 보게 되면, 거래행위가 아니라 거래에서 발생한 이익이나 비용의 귀속을 기준으로 부가가치세 납세의무자를 판단하는 결과가 되어 부가가치세의 거래세로서의 성격에 반한다. \n  3) 원고는 단독으로 세계보건기구(WHO), 유엔아동기금(UNICEF) 등 해외 국제기구와 사이에 (제품명 생략) 공급계약을 체결하고 (제품명 생략)을 수출하였으며 수출대금도 직접 지급받았다. 그에 따른 권리의무와 그 법률효과가 종국적으로 귀속된 거래주체로서 계약상 원인에 의하여 재화를 사용·소비할 수 있는 권한을 이전하는 행위를 한 구 부가가치세법상 납세의무자인 사업자는 원고이므로, 원고 명의의 영세율과세표준 신고는 적법하다. \n  4) 원고는 자신의 사업장에서 생산한 1가 백신물질을 자신의 (제품명 생략) 제조에 직접 사용·소비한 것이고, 이는 부가가치세 과세대상에서 제외되는 재화의 자가공급에 해당할 뿐이며, 이를 두고 1가 백신물질에 관하여 (제품명 생략) 공동사업자를 ‘공급받는 자’로 하는 부가가치세 과세대상인 재화의 공급거래가 있었다고 인정하기는 어렵다.\n  다. 그런데도 원심은 이와 달리 판시와 같은 이유만으로 (제품명 생략) 공동사업자가 구 부가가치세법상 납세의무자에 해당한다는 잘못된 전제에서 이 사건 각 처분이 적법하다고 판단하였다. 이러한 원심판단에는 구 부가가치세법상 납세의무자의 요건과 판단 기준 등에 관한 법리를 오해하여 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 있다. 이를 지적하는 원고의 상고이유 주장은 이유 있다.\n  4. 결론\n  그러므로 나머지 상고이유에 관한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 엄상필(재판장) 이흥구(주심) 오석준 이숙연"
  },

    "판례내용": "【원고, 피상고인】 주식회사 ○○○ (소송대리인 법무법인(유한) 율촌 담당변호사 곽태훈 외 3인)\n【피고, 상고인】 역삼세무서장\n【원심판결】 서울고법 2023. 2. 14. 선고 2022누47942 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유를 판단한다.\n  1. 원심은 제1심판결 이유를 인용하고 일부를 수정·추가하여, 원고가 분양대행업이 아닌 토지매매업을 영위하면서 토지 등 양도소득을 직접 취득하였음을 전제로 이루어진 이 사건 각 처분이 모두 위법하다고 판단하였다. 즉, 소외인 등이 농지인 이 사건 토지를 매수하면서 원고가 조달한 대출금 등으로 매매대금을 지급하였고, 이를 분양하고 받은 매매대금 역시 원고로 하여금 수령하게 한 다음 분양수수료를 정산한 나머지만을 수령하였으며, 원고의 분양대행수수료율이 분양가격의 약 65%에 이르는 반면 소외인 등이 취득한 이익은 매도차익의 약 6%에 불과한 점에서 이 사건 분양대행약정이 진실한 것이 의심이 들기는 하지만, 이 사건 분양대행약정이 법률행위로서 효력이 없는 가장행위에 해당한다거나 이 사건 각 세금계산서가 가공거래에 의한 허위의 세금계산서라고 단정하기 어렵다는 것이다.\n  2. 그러나 원심의 판단은 수긍하기 어렵다.\n  가. 국세기본법 제14조 제3항은 \"제3자를 통한 간접적인 방법이나 둘 이상의 행위 또는 거래를 거치는 방법으로 이 법 또는 세법의 혜택을 부당하게 받기 위한 것으로 인정되는 경우에는 그 경제적 실질 내용에 따라 당사자가 직접 거래를 한 것으로 보거나 연속된 하나의 행위 또는 거래를 한 것으로 보아 이 법 또는 세법을 적용한다.\"라고 규정하고 있다. 위 규정의 취지는 과세대상이 되는 행위 또는 거래를 우회하거나 변형하여 여러 단계의 거래를 거침으로써 부당하게 조세를 감소시키는 조세회피행위에 대처하기 위하여 그와 같은 여러 단계의 거래 형식을 부인하고 실질에 따라 과세대상인 하나의 행위 또는 거래로 보아 과세할 수 있도록 한 것으로서, 실질과세원칙의 적용 태양 중 하나를 규정하여 조세공평을 도모하고자 한 것이다(대법원 2017. 12. 22. 선고 2017두57516 판결 등 참조). 이러한 실질과세원칙은 사법(私法)상 효력이 인정되지 않는 가장행위에 해당하는 경우에만 적용될 수 있는 것은 아니고 그러한 정도에는 이르지 못하지만 실질과 괴리되는 비합리적인 형식이나 외관을 취하였다고 볼 만한 조세회피행위의 경우에도 적용될 수 있다. 위 규정을 적용하여 거래 등의 실질에 따라 과세하기 위해서는 납세의무자가 선택한 행위 또는 거래의 형식이나 과정이 처음부터 조세회피의 목적을 이루기 위한 수단에 불과하여 그 실질이 직접 거래를 하거나 연속된 하나의 행위 또는 거래를 한 것과 동일하게 평가될 수 있어야 한다. 그리고 이는 당사자가 그와 같은 형식을 취한 목적, 제3자를 개입시키거나 단계별 과정을 거친 경위, 그와 같은 방식을 취한 데에 조세 부담의 경감 외에 사업상의 필요 등 다른 합리적 이유가 있는지 여부, 각각의 행위 또는 거래 사이의 시간적 간격 및 그와 같은 형식을 취한 데 따른 손실과 위험부담의 가능성 등 여러 사정을 종합하여 판단하여야 한다(대법원 2022. 8. 25. 선고 2017두41313 판결 등 참조). 다만 납세의무자가 위와 같은 행위 또는 거래의 형식을 취한 데에 사업상의 필요가 인정되더라도 그것이 강행법규나 사회질서에 반하는 불법적인 목적에서 비롯된 경우에 해당한다면, 이에 대하여 조세회피목적을 부인하는 것은 강행법규의 입법 취지, 과세형평 등에 비추어 현저히 불합리하므로, 그러한 사업상의 필요만으로 조세 부담의 경감 외에 다른 합리적 이유가 있다고 보아 조세회피목적을 쉽사리 부인할 것은 아니다. \n  나. 원심판결 이유를 위와 같은 법리에 비추어 살펴본다. \n  1) 부동산 매매업, 분양대행업 등을 목적으로 설립된 법인인 원고는 소외인 등 개인들이 원고 등의 자금 부담으로 매수한 고양시 소재 농지들인 이 사건 토지에 관하여 이 사건 분양대행약정을 체결한 후 불특정 다수인에게 이를 지분별로 분할매각한 다음, 그 양도차익의 대부분을 분양대행수수료 명목으로 취득하였다. \n  2) 이와 같은 이 사건 토지의 매수자금 조달 경위 및 매도 등 거래의 전 과정, 이 사건 분양대행약정의 체결 경위와 목적 및 내용, 원고가 수행한 사업의 구체적 내용과 방식, 원고가 취한 분양대행수수료의 규모, 소외인 등이 취한 경제적 이익의 정도 등에 비추어, 원고가 얻은 분양대행수수료의 실질은 사실상 토지매매업을 영위하면서 얻은 이 사건 토지의 양도차익으로서 원고가 그 실질적 귀속주체에 해당한다고 볼 여지가 충분하다.  \n  3) 원고가 농지인 이 사건 토지의 소유권을 취득하여 매도하는 것이 불가능하지 않는데도, 원고는 소외인 등과 이 사건 분양대행약정을 체결하고, 이를 바탕으로 소외인 등과 수분양자 사이의 분양계약체결을 주도하는 등의 비합리적인 우회거래를 통하여 법인세법 제55조의2에 따른 비사업용 토지의 양도소득에 관한 법인세 등을 회피하였다. 비록 원고가 위와 같은 우회거래 방식을 취한 데에 사업상의 필요 등 다른 이유가 인정된다고 하더라도 그것이 농지법 위반의 불법적인 사업목적에서 비롯되었다고 볼 여지가 있는 이상, 곧바로 조세회피목적이 없었다고 단정할 것은 아니다.\n  4) 사정이 위와 같다면, 이 사건 분양대행약정, 이 사건 토지 매매 등 일련의 행위 또는 거래의 형식이나 과정은 처음부터 원고의 조세회피목적을 이루기 위한 수단에 불과하여 그 경제적 실질이 원고가 직접 이 사건 토지를 취득하여 양도한 것과 동일하다고 평가할 수 있어 국세기본법 제14조 제3항의 요건을 모두 충족한다고 볼 여지가 크다. 원심으로서는 이 사건 분양대행약정 등이 가장행위에 해당하지 않더라도 실질과세원칙을 적용하여 거래를 재구성할 수 있는지 여부에 대하여 더 나아가 심리·판단하였어야 했다.\n  다. 그런데도 원심은 이와 달리 이 사건 분양대행약정 등이 법률행위로서 효력이 전혀 없는 가장행위에 해당한다고 단정하기 어렵다는 등의 이유만으로 이 사건 각 처분이 위법하다고 판단하였다. 이러한 원심의 판단에는 논리와 경험의 법칙을 위반하여 자유심증주의의 한계를 벗어나거나 국세기본법 제14조 제3항의 요건 충족 여부에 관한 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 있다. 이를 지적하는 피고의 상고이유 주장은 이유 있다. \n  3. 그러므로 나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.  \n\n대법관 권영준(재판장) 오경미(주심) 박영재"
  },

    "판시사항": "구 도시 및 주거환경정비법 제39조 제1항 제2호 전문, 제76조 제1항 제6호 등에서 말하는 ‘1세대’, ‘하나의 세대’ 내지 ‘동일한 세대’가 실질적으로 주거와 생계를 같이하고 있는 가구를 의미하는지 여부(적극)",
    "판결요지": "구 도시 및 주거환경정비법(2021. 3. 16. 법률 제17943호로 개정되기 전의 것, 이하 ‘구 도시정비법’이라고 한다) 제39조 제1항 제2호 전문, 제76조 제1항 제6호나 구 경기도 도시 및 주거환경정비 조례(2021. 11. 2. 경기도 조례 제7249호로 개정되기 전의 것, 이하 ‘구 경기도 조례’라고 한다) 제26조 제1항 제1호에서 말하는 ‘1세대’, ‘하나의 세대’ 내지 ‘동일한 세대’는 실질적으로 주거와 생계를 같이하고 있는 가구를 의미한다고 보아야 한다. 이유는 다음과 같다. \n  ① ‘세대’는 사전적으로 ‘현실적으로 주거 및 생계를 같이하는 사람의 집단’ 또는 ‘현실적으로 주거 및 생계를 같이하는 사람의 집단을 세는 단위’를 의미하고, ‘가구’와 동의어로 설명되고 있다. 이러한 사전적 의미 및 문언에 따른다면, 실제로 주거와 생계를 같이하여야만 위 각 조항에서 말하는 ‘세대’에 해당할 수 있다. 만약 위 각 조항이 주민등록표 등재 등 형식만을 기준으로 ‘1세대’ 등에 해당하는지를 판단할 요량이었다면, 법령 자체에서 ‘같은 세대별 주민등록표에 등재되어 있는 사람’, ‘세대별 주민등록표에 함께 등재되어 있는 사람’ 등과 같은 문언을 부기하여 ‘세대’를 정의하였을 것이다. \n  ② 구 도시정비법이나 구 경기도 조례에서 위 각 조항을 둔 이유는 정비사업에서 이른바 ‘1세대 1주택’ 원칙을 실현하기 위함이다. ‘1세대 1주택’ 원칙은 정비구역 안에 있는 토지 등 소유자 사이의 이해관계를 조정하여 조합원의 재산권을 보호함과 동시에 정비사업에서 토지·주택 등에 대한 투기를 억제하여 정비사업의 사업성 저하를 방지하고자 하는 취지이다. 따라서 실제로 주거와 생계를 같이하는지를 기준으로 1세대 여부를 판단하여 현실적으로 공통된 주거를 가지지 않거나 함께 생계를 영위하지 않는 사람들에게 각자 주택을 분양한다고 하여 위와 같은 취지를 해하는 바는 전혀 없다. 이와 달리 주민등록표 등재 등 형식만을 기준으로 1세대 여부를 판단한다면, 실제로 주거와 생계를 같이하고 있으면서도 형식적으로 주민등록만 달리 두고 있는 경우 여러 채의 주택을 분양받을 수 있다는 결론으로 이어지고, 투기를 위하여 이를 가장하는 이른바 ‘위장 세대 분리’를 막지 못하는 폐단이 발생하게 되어, 오히려 ‘1세대 1주택’ 원칙의 취지에 정면으로 어긋난다.\n  ③ 구 도시정비법 제39조 제1항 제2호 후문 전단에 따르면, ‘배우자 및 미혼인 19세 미만의 직계비속’은 세대의 공통 여부를 불문하고 1세대로 간주되어 1인의 조합원으로서 1인의 분양대상자 지위를 가지므로, 여러 명의 토지 등 소유자가 이러한 관계만으로 이루어진 경우에는 사업시행자인 조합이 따로 1세대 여부를 판단할 필요가 없다. 그리고 나머지 경우에 대하여 실질적으로 주거와 생계를 같이하는지를 기준으로 1세대 여부를 판단하더라도, 사업시행자인 조합은 1차적으로 주민등록표 등 공부를 기준으로 1세대인지를 확정할 수 있고, 토지 등 소유자·이해관계인의 의견 제출이나 이의, 그 밖에 조합에 현출된 사정을 통하여 그와 같이 확정함에 의문이 있는 때에는 추가적인 서류나 자료를 제출받아 이에 기하여 실질적인 주거와 생계의 공통 여부를 조사·확인하는 방식을 취함으로써 신속하고 안정적인 사업 진행에 대한 지장을 최소화할 수 있다. 특히 구 도시정비법상 재개발사업을 시행하는 조합은 그 목적 범위 내에서 법령이 정하는 바에 따라 일정한 행정작용을 하는 행정주체의 지위를 갖고 조합 정관 등에 기하여 조합원에게 사업 시행에 필요한 서류 등을 요구하고 제출받을 수 있으므로, 조합의 입장에서 위와 같은 조사·확인이 불가능하거나 어렵다고 보기도 힘들다.",
    "참조조문": "구 도시 및 주거환경정비법(2021. 3. 16. 법률 제17943호로 개정되기 전의 것) 제39조 제1항 제2호, 제74조 제1항, 제4항(현행 제74조 제6항 참조), 제76조 제1항 제6호, 구 도시 및 주거환경정비법 시행령(2022. 12. 9. 대통령령 제33046호로 개정되기 전의 것) 제63조 제1항 제3호",
    "참조판례": "",
    "판례내용": "【원고, 상고인】 원고 1 외 2인 (소송대리인 법무법인 린 담당변호사 강주현 외 1인)\n【피고, 피상고인】 ○○구역 주택재개발정비사업조합 (소송대리인 법무법인 센트로 담당변호사 김향훈 외 5인)\n【원심판결】 수원고법 2022. 6. 24. 선고 2021누13083 판결\n【주    문】\n  원심판결을 파기하고, 사건을 수원고등법원에 환송한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 서면의 기재는 상고이유를 보충하는 범위 내에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 따르면 아래 사실을 알 수 있다.\n  가. 피고는 성남시 수정구 ○○동(지번 1 생략) 토지 일원 152,797.1㎡를 정비구역(이하 ‘이 사건 정비구역’이라고 한다)으로 한 주택재개발사업(이하 ‘이 사건 사업’이라고 한다)을 시행하기 위하여 2016. 5. 17. 조합설립인가를 받아 설립된 조합이다. 원고 1과 그 법률상 배우자인 원고 2는 2017. 1. 13. 이 사건 정비구역 내에 있는 같은 동 (지번 2 생략) 대 70.4㎡ 및 그 지상 주택에 관하여 1/2 지분씩 각각 소유권이전등기를 마쳤고, 원고 1의 동생인 원고 3은 2016. 11. 30. 이 사건 정비구역 내에 있는 같은 동 (지번 3 생략) 대 65.1㎡ 및 그 지상 주택에 관하여 소유권이전등기를 마쳤다.\n  나. 피고는 이 사건 사업에 관하여 조합원들을 대상으로 분양신청기간을 2019. 8. 19.부터 2019. 10. 7.까지로 정하여 분양신청을 받았다. 원고 1, 원고 2는 2019. 9. 18. 공유자로서 원고 1을 대표조합원으로 하여 1건의 분양신청을 하였고, 원고 3 역시 같은 날 단독으로 1건의 분양신청을 하였다.\n  다. 피고는 ‘관리처분계획 기준일인 2019. 10. 7. 당시 원고 3이 원고 1의 배우자인 원고 2와 주민등록상 같은 세대에 속하여 원고들이 하나의 세대에 해당한다.’는 이유로 원고들 전부를 1명의 분양대상자로 보아 원고들에게 1개의 주택만을 분양하는 내용 등으로 관리처분계획을 수립하였다. 피고는 위 관리처분계획에 대하여 2020. 5. 23. 총회의 의결을 거쳐 2020. 9. 7. 성남시장으로부터 인가를 받았다(이하 위 관리처분계획 중 원고들에 대한 부분을 ‘이 사건 관리처분계획 부분’이라고 한다).\n  라. 2019. 10. 7. 당시 주민등록상 원고 1은 단독으로 세대를 구성하여 세대주로서 등재되어 있었고, 원고 2와 원고 3은 원고 1, 원고 3의 아버지인 소외인을 세대주로 하는 세대의 세대원으로서 함께 등재되어 있었다. 그러나 그 당시 원고 2는 대한민국에서 체류하지 않고 미국에 정주하고 있었던 반면, 원고 3은 대한민국에 정주하고 있었다.\n  2. 원심의 판단\n  원고들은, 원고 2와 원고 3은 관리처분계획 기준일 현재 주민등록상 같은 세대로 등재되어 있었으나 실질적으로 함께 거주하지 않았으므로, 원고들을 구 「경기도 도시 및 주거환경정비 조례」(2021. 11. 2. 경기도 조례 제7249호로 개정되기 전의 것, 이하 ‘구 경기도 조례’라고 한다) 제26조 제1항 제1호의 ‘하나의 세대’라고 볼 수 없어 원고 1, 원고 2 및 원고 3에게 각각 주택을 분양하여야 하는바, 원고들에게 1개의 주택만을 분양하는 내용의 이 사건 관리처분계획 부분은 위법하다는 주장 등을 하였다.\n  이에 대해 원심은, 구 경기도 조례 제26조 제1항 제1호는 관리처분계획 기준일 현재 수 명의 분양신청자가 하나의 세대인 경우 분양대상자를 1명으로 본다고 규정하면서 이 경우 ‘세대주와 동일한 세대별 주민등록표에 등재되어 있지 않은 세대주의 배우자 및 배우자와 동일한 세대를 이루고 있는 세대원을 포함한다.’고 규정하고 있고, 여기에서 ‘배우자와 동일한 세대를 이루고 있는 세대원’인지 여부는 주민등록법령에 따라 작성된 주민등록표 등 공부에 의하여 형식적으로 결정할 수밖에 없는바, 원고 2와 원고 3이 동일한 세대별 주민등록표에 등재되어 있었던 이상 원고들은 위 조항에 따라 하나의 세대에 해당한다는 이유로, 원고들의 위 주장 등을 배척하고 이 사건 관리처분계획 부분이 적법하다고 보아 원고들의 청구를 기각하였다. \n  3. 대법원의 판단\n  그러나 원심의 판단은 다음과 같은 이유로 수긍하기 어렵다.\n  가. 구 도시 및 주거환경정비법(2021. 3. 16. 법률 제17943호로 개정되기 전의 것, 이하 ‘구 도시정비법’이라고 한다) 제39조 제1항 제2호 전문에 따르면, 재개발사업에서 여러 명의 토지 등 소유자가 1세대에 속하는 때에는 그 여러 명을 대표하는 1명을 조합원으로 본다. 한편 같은 법 제74조 제1항 본문에 따르면, 사업시행자는 분양신청기간이 종료된 때에는 분양신청의 현황을 기초로 분양설계, 분양대상자의 주소 및 성명, 분양대상자별 분양예정인 대지 또는 건축물의 추산액 등의 사항이 포함된 관리처분계획을 수립하여 시장 등의 인가를 받아야 하는데, 같은 법 제76조 제1항 제6호에 따르면, 위 관리처분계획의 내용은 1세대가 하나 이상의 주택 또는 토지를 소유한 경우 1주택을 공급한다는 기준에 따른다.\n  또한 같은 법 제74조 제4항은, 위 관리처분계획의 내용, 관리처분의 방법 등에 필요한 사항은 대통령령으로 정하도록 규정하고 있고, 이에 따라 구 도시 및 주거환경정비법 시행령(2022. 12. 9. 대통령령 제33046호로 개정되기 전의 것, 이하 ‘구 도시정비법 시행령’이라고 한다) 제63조 제1항 제3호는, 관리처분의 방법으로 정비구역의 토지 등 소유자에게 분양할 것을 정하면서, 그 단서에서 공동주택을 분양하는 경우 시·도조례로 정하는 금액·규모·취득 시기 또는 유형에 대한 기준에 부합하지 아니하는 토지 등 소유자는 시·도조례로 정하는 바에 따라 분양대상에서 제외할 수 있도록 규정하고 있다. 이와 같은 위임을 받아 구 경기도 조례 제26조 제1항 제1호는 전문에서 관리처분계획 기준일 현재 여러 명의 분양신청자가 하나의 세대인 경우에는 분양대상자를 1명으로 본다고 규정하면서, 후문에서 이 경우 세대주와 동일한 세대별 주민등록표에 등재되어 있지 않은 세대주의 배우자 및 배우자와 동일한 세대를 이루고 있는 세대원은 ‘하나의 세대’에 포함하도록 규정하고 있다.\n  나. 그런데 구 도시정비법 제39조 제1항 제2호 전문, 제76조 제1항 제6호나 구 경기도 조례 제26조 제1항 제1호에서 말하는 ‘1세대’, ‘하나의 세대’ 내지 ‘동일한 세대’는 실질적으로 주거와 생계를 같이하고 있는 가구를 의미한다고 보아야 한다. 그 이유는 다음과 같다.\n  1) ‘세대’는 사전적으로 ‘현실적으로 주거 및 생계를 같이하는 사람의 집단’ 또는 ‘현실적으로 주거 및 생계를 같이하는 사람의 집단을 세는 단위’를 의미하고, ‘가구’와 동의어로 설명되고 있다. 이러한 사전적 의미 및 문언에 따른다면, 실제로 주거와 생계를 같이하여야만 위 각 조항에서 말하는 ‘세대’에 해당할 수 있다. 만약 위 각 조항이 주민등록표 등재 등 형식만을 기준으로 ‘1세대’ 등에 해당하는지 여부를 판단할 요량이었다면, 법령 자체에서 ‘같은 세대별 주민등록표에 등재되어 있는 사람’, ‘세대별 주민등록표에 함께 등재되어 있는 사람’ 등과 같은 문언을 부기하여 ‘세대’를 정의하였을 것이다.\n  2) 구 도시정비법이나 구 경기도 조례에서 위 각 조항을 둔 이유는 정비사업에서 이른바 ‘1세대 1주택’ 원칙을 실현하기 위함이다. ‘1세대 1주택’ 원칙은 정비구역 안에 있는 토지 등 소유자 사이의 이해관계를 조정하여 조합원의 재산권을 보호함과 동시에 정비사업에서 토지·주택 등에 대한 투기를 억제하여 정비사업의 사업성 저하를 방지하고자 하는 취지이다. 따라서 실제로 주거와 생계를 같이하는지를 기준으로 1세대 여부를 판단하여 현실적으로 공통된 주거를 가지지 않거나 함께 생계를 영위하지 않는 사람들에게 각자 주택을 분양한다고 하여 위와 같은 취지를 해하는 바는 전혀 없다. 이와 달리 주민등록표 등재 등 형식만을 기준으로 1세대 여부를 판단한다면, 실제로 주거와 생계를 같이하고 있으면서도 형식적으로 주민등록만 달리 두고 있는 경우 여러 채의 주택을 분양받을 수 있다는 결론으로 이어지고, 투기를 위하여 이를 가장하는 이른바 ‘위장 세대 분리’를 막지 못하는 폐단이 발생하게 되어, 오히려 ‘1세대 1주택’ 원칙의 취지에 정면으로 어긋난다.\n  3) 구 도시정비법 제39조 제1항 제2호 후문 전단에 따르면, ‘배우자 및 미혼인 19세 미만의 직계비속’은 세대의 공통 여부를 불문하고 1세대로 간주되어 1인의 조합원으로서 1인의 분양대상자 지위를 가지므로, 여러 명의 토지 등 소유자가 이러한 관계만으로 이루어진 경우에는 사업시행자인 조합이 따로 1세대 여부를 판단할 필요가 없다. 그리고 나머지 경우에 대하여 실질적으로 주거와 생계를 같이하는지를 기준으로 1세대 여부를 판단한다고 하더라도, 사업시행자인 조합은 1차적으로 주민등록표 등 공부를 기준으로 1세대인지를 확정할 수 있고, 토지 등 소유자·이해관계인의 의견 제출이나 이의, 그 밖에 조합에 현출된 사정을 통하여 그와 같이 확정함에 의문이 있는 때에는 추가적인 서류나 자료를 제출받아 이에 기하여 실질적인 주거와 생계의 공통 여부를 조사·확인하는 방식을 취함으로써 신속하고 안정적인 사업 진행에 대한 지장을 최소화할 수 있다. 특히 구 도시정비법상 재개발사업을 시행하는 조합은 그 목적 범위 내에서 법령이 정하는 바에 따라 일정한 행정작용을 하는 행정주체의 지위를 갖고 조합 정관 등에 기하여 조합원에게 사업 시행에 필요한 서류 등을 요구하고 제출받을 수 있으므로, 조합의 입장에서 위와 같은 조사·확인이 불가능하거나 어렵다고 보기도 힘들다.\n  다. 그렇다면 관리처분계획 기준일인 2019. 10. 7. 당시 원고 2가 미국에, 원고 3이 대한민국에 각각 정주하여 실질적으로 주거와 생계를 같이하고 있지 않았던 이상, 이들은 구 경기도 조례 제26조 제1항 제1호 후문의 ‘동일한 세대’를 이루고 있는 관계라고 할 수 없어 원고 1, 원고 2와 원고 3은 같은 호에 규정된 ‘하나의 세대’에 해당하지 않는다고 보아야 한다. \n  그런데도 원심은 이와 달리 원고들이 위 조항에 따른 ‘하나의 세대’로서 1명의 분양대상자에 해당한다고 보아 원고들에게 1개의 주택만을 분양하는 내용의 이 사건 관리처분계획 부분이 적법하다고 판단하였다. 이러한 원심판단에는 구 경기도 조례 제26조 제1항 제1호의 ‘하나의 세대’ 내지 ‘동일한 세대’ 등의 해석에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 상고이유 주장은 이유 있다.\n  4. 결론\n  그러므로 나머지 상고이유에 관한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 권영준(재판장) 오경미(주심) 박영재"

    "판시사항": "실질과세에 관한 국세기본법 제14조 제3항의 규정 취지 / 위 규정을 적용하여 거래 등의 실질에 따라 과세하기 위한 요건 및 이를 판단하는 방법 / 납세의무자가 제3자를 통하거나 여러 단계의 거래를 거치는 행위 또는 거래의 형식을 취한 데에 사업상의 필요가 인정되는 경우, 조세회피목적이 부인되는지 여부(원칙적 소극)",

    "참조조문": "국세기본법 제14조 제3항",
    "참조판례": "대법원 2017. 12. 22. 선고 2017두57516 판결(공2018상, 363), 대법원 2022. 8. 25. 선고 2017두41313 판결(공2022하, 2038)",
    "판례내용": "【원고, 피상고인】 주식회사 ○○○ (소송대리인 법무법인(유한) 율촌 담당변호사 곽태훈 외 2인)\n【피고, 상고인】 역삼세무서장\n【원심판결】 서울고법 2023. 10. 13. 선고 2023누39856 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유를 판단한다.\n  1. 원심은 판시와 같은 이유로 다음과 같이 판단하였다. 원고가 실제로는 소외인 등 명의로 이 사건 각 토지를 취득하였음에도 허위로 이 사건 각 분양대행약정을 체결하여 가공거래에 의한 허위의 세금계산서를 발행한 것이라고 보기 어렵고, 원고에게 조세회피목적이 있었다고 보이지도 않으므로, 이와 전제가 다른 이 사건 각 처분은 모두 위법하다. \n  2. 그러나 원심의 판단은 수긍하기 어렵다.\n  가. 국세기본법 제14조 제3항은 \"제3자를 통한 간접적인 방법이나 둘 이상의 행위 또는 거래를 거치는 방법으로 이 법 또는 세법의 혜택을 부당하게 받기 위한 것으로 인정되는 경우에는 그 경제적 실질 내용에 따라 당사자가 직접 거래를 한 것으로 보거나 연속된 하나의 행위 또는 거래를 한 것으로 보아 이 법 또는 세법을 적용한다.\"라고 규정하고 있다. 위 규정의 취지는 과세대상이 되는 행위 또는 거래를 우회하거나 변형하여 여러 단계의 거래를 거침으로써 부당하게 조세를 감소시키는 조세회피행위에 대처하기 위하여 그와 같은 여러 단계의 거래 형식을 부인하고 실질에 따라 과세대상인 하나의 행위 또는 거래로 보아 과세할 수 있도록 한 것으로서, 실질과세원칙의 적용 태양 중 하나를 규정하여 조세공평을 도모하고자 한 것이다(대법원 2017. 12. 22. 선고 2017두57516 판결 등 참조). 이러한 실질과세원칙은 사법(私法)상 효력이 인정되지 않는 가장행위에 해당하는 경우에만 적용될 수 있는 것은 아니고 그러한 정도에는 이르지 못하지만 실질과 괴리되는 비합리적인 형식이나 외관을 취하였다고 볼 만한 조세회피행위의 경우에도 적용될 수 있다. 위 규정을 적용하여 거래 등의 실질에 따라 과세하기 위해서는 납세의무자가 선택한 행위 또는 거래의 형식이나 과정이 처음부터 조세회피의 목적을 이루기 위한 수단에 불과하여 그 실질이 직접 거래를 하거나 연속된 하나의 행위 또는 거래를 한 것과 동일하게 평가될 수 있어야 한다. 그리고 이는 당사자가 그와 같은 형식을 취한 목적, 제3자를 개입시키거나 단계별 과정을 거친 경위, 그와 같은 방식을 취한 데에 조세 부담의 경감 외에 사업상의 필요 등 다른 합리적 이유가 있는지 여부, 각각의 행위 또는 거래 사이의 시간적 간격 및 그와 같은 형식을 취한 데 따른 손실과 위험부담의 가능성 등 여러 사정을 종합하여 판단하여야 한다(대법원 2022. 8. 25. 선고 2017두41313 판결 등 참조). 다만 납세의무자가 위와 같은 행위 또는 거래의 형식을 취한 데에 사업상의 필요가 인정되더라도 그것이 강행법규나 사회질서에 반하는 불법적인 목적에서 비롯된 경우에 해당한다면, 이에 대하여 조세회피목적을 부인하는 것은 강행법규의 입법 취지, 과세형평 등에 비추어 현저히 불합리하므로, 그러한 사업상의 필요만으로 조세 부담의 경감 외에 다른 합리적 이유가 있다고 보아 조세회피목적을 쉽사리 부인할 것은 아니다. \n  나. 원심판결 이유를 위와 같은 법리에 비추어 살펴본다. \n  1) 부동산 매매업 등을 목적으로 설립된 법인인 원고는 소외인 등 개인들이 원고 등의 자금 부담으로 매수한 고양시 소재 농지들인 이 사건 각 토지에 관한 이 사건 각 분양대행약정을 체결한 후 불특정 다수인에게 지분별로 이를 분할매각한 다음, 그 양도차익의 대부분을 분양대행수수료 명목으로 취득하였다. \n  2) 이와 같은 이 사건 각 토지의 매수자금 조달 경위 및 매도 등 거래의 전 과정, 이 사건 각 분양대행약정의 체결 경위와 목적 및 내용, 원고가 수행한 사업의 구체적 내용과 방식, 원고가 취한 분양대행수수료의 규모, 소외인 등이 취한 경제적 이익의 정도 등에 비추어, 원고가 얻은 분양대행수수료의 실질은 사실상 토지매매업을 영위하면서 얻은 이 사건 각 토지의 양도차익으로서 원고가 그 실질적 귀속주체에 해당한다고 볼 여지가 충분하다. \n  3) 원고가 농지인 이 사건 각 토지의 소유권을 취득하여 매도하는 것이 불가능하지 않는데도, 원고는 소외인 등과 이 사건 분양대행약정을 체결하고, 이를 바탕으로 소외인 등과 수분양자 사이의 분양계약체결을 주도하는 등의 비합리적인 우회거래를 통하여 법인세법 제55조의2에 따른 비사업용 토지의 양도소득에 관한 법인세 등을 회피하였다. 비록 원고가 위와 같은 우회거래 방식을 취한 데에 사업상의 필요 등 다른 이유가 인정된다고 하더라도 그것이 농지법 위반의 불법적인 사업목적에서 비롯되었다고 볼 여지가 있는 이상, 곧바로 조세회피목적이 없었다고 단정할 것은 아니다. \n  4) 사정이 위와 같다면, 이 사건 각 분양대행약정, 이 사건 각 토지 매매 등 일련의 행위 또는 거래의 형식이나 과정은 처음부터 원고의 조세회피목적을 이루기 위한 수단에 불과하여 그 경제적 실질이 원고가 직접 이 사건 각 토지를 취득하여 양도한 것과 동일하다고 평가할 수 있으므로, 비록 이 사건 각 분양대행약정이 가장행위에 해당하지 않더라도 국세기본법 제14조 제3항의 요건을 모두 충족한다고 볼 여지가 크다. \n  다. 그런데도 원심은 이와 달리 국세기본법 제14조 제3항의 요건을 충족하지 못하여 실질과세원칙을 적용할 수 없다는 전제에서 이 사건 각 처분이 위법하다고 판단하였다. 이러한 원심의 판단에는 논리와 경험의 법칙을 위반하여 자유심증주의의 한계를 벗어나거나 국세기본법 제14조 제3항에 관한 법리를 오해하여 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 있다. 이를 지적하는 피고의 상고이유 주장은 이유 있다. \n  3. 그러므로 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.  \n\n대법관 권영준(재판장) 오경미(주심) 박영재"
  },

    "판시사항": "[1] 구 건설산업기본법 제82조 제1항 제4호, 제29조 제4항 본문에서 규제하는 하도급계약 거짓 통보의 대상에 구 건설산업기본법 시행규칙 [별지 제23호 서식] ‘건설공사의 하도급계약 통보서’ 중 ‘하도급내용’ 부분에 기재하도록 되어 있는 모든 항목이 포함되는지 여부(적극) 및 그중 ‘하도급 부분금액’에 개별 원가계산 항목이 포함되는지 여부(원칙적 적극) / 국민연금보험료, 국민건강보험료, 노인장기요양보험료가 하도급계약 통보의 대상이 되는 개별 원가계산 항목인지 여부(적극) / 산업안전보건관리비, 환경보전비가 ‘하도급 부분금액’에서 예외적으로 제외될 수 있는 개별 원가계산 항목인지 여부(적극)\n [2] 구 건설산업기본법 제82조 제1항 제4호에서 정한 하도급계약 통보를 ‘거짓으로 한 때’에 해당하기 위해서는 기재 내용이 사실과 다르다는 점을 인식했거나 충분히 인식할 수 있었으면서도 사실과 다른 내용의 기재를 했어야 하는지 여부(적극)",
    "판결요지": "[1] 구 건설산업기본법(2017. 12. 26. 법률 제15306호로 개정되기 전의 것) 제82조 제1항 제4호, 제29조 제4항 본문에서 규제하는 하도급계약 거짓 통보의 대상에는 구 건설산업기본법 시행규칙(2019. 3. 26. 국토교통부령 제614호로 개정되기 전의 것) [별지 제23호 서식] ‘건설공사의 하도급계약 통보서’ 중 ‘하도급내용’ 부분에 기재하도록 되어 있는 ‘하도급 부분금액’, ‘하도급 계약금액’, ‘하도급률’ 등 모든 항목이 포함되고, ‘하도급 부분금액’에는 간접노무비, 기타경비, 산출경비, 건설기계대여금 지급보증서 발급액, 일반관리비, 이윤 등의 개별 원가계산 항목이 포함된다. \n  나아가, 국민연금보험료, 국민건강보험료, 노인장기요양보험료도 ‘하도급 부분금액’을 구성하는 개별 원가계산 항목으로서 하도급계약 통보의 대상이 된다. \n  다만 구 산업안전보건법(2019. 1. 15. 법률 제16272호로 전부 개정되기 전의 것) 제30조 제1항, 제3항, 구 산업안전보건법 시행규칙(2019. 12. 26. 고용노동부령 제272호로 전부 개정되기 전의 것) 제32조 제1항의 내용을 종합하면, 산업안전보건관리비는 원칙적으로 ‘하도급 부분금액’에 포함되는 원가계산 항목이기는 하나, 예외적으로 원수급인이 이를 직접 부담한 경우 ‘관계 법령에 따라 수급인이 부담하는 금액’으로서 ‘하도급 부분금액’에서 제외할 수 있다. 또한 건설기술 진흥법 제66조 제3항, 제4항, 구 건설기술 진흥법 시행규칙(2018. 6. 18. 국토교통부령 제521호로 개정되기 전의 것) 제61조 제1항 내지 제4항, [별표 8]의 내용과 환경보전비의 특성에 비추어 보면, 환경보전비 역시 원칙적으로 ‘하도급 부분금액’에 포함되는 원가계산 항목이지만, 예외적으로 원수급인이 이를 직접 부담한 경우 ‘관계 법령에 따라 수급인이 부담하는 금액’으로서 ‘하도급 부분금액’에서 제외할 수 있다.\n [2] 구 건설산업기본법(2017. 12. 26. 법률 제15306호로 개정되기 전의 것) 제82조 제1항 제4호에서 정한 하도급계약 통보를 ‘거짓으로 한 때’에 해당하기 위해서는 그 통보서가 단순히 사실과 다르게 기재되었다는 것만으로는 부족하고, 그 기재 내용이 사실과 다르다는 점을 인식했거나 충분히 인식할 수 있었으면서도 사실과 다른 내용의 기재를 했다고 평가할 수 있어야 한다.",
    "참조조문": "[1] 구 건설산업기본법(2017. 12. 26. 법률 제15306호로 개정되기 전의 것) 제29조 제4항(현행 제29조 제6항 참조), 제82조 제1항 제4호, 구 건설산업기본법 시행규칙(2019. 3. 26. 국토교통부령 제614호로 개정되기 전의 것) [별지 제23호 서식], 구 산업안전보건법(2019. 1. 15. 법률 제16272호로 전부 개정되기 전의 것) 제30조(현행 제72조 참조), 구 산업안전보건법 시행규칙(2019. 12. 26. 고용노동부령 제272호로 전부 개정되기 전의 것) 제32조 제1항(현행 제89조 제1항 참조), 건설기술 진흥법 제66조 제3항, 제4항, 구 건설기술 진흥법 시행규칙(2018. 6. 18. 국토교통부령 제521호로 개정되기 전의 것) 제61조 / [2] 구 건설산업기본법(2017. 12. 26. 법률 제15306호로 개정되기 전의 것) 제82조 제1항 제4호",
