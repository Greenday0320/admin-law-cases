    "판시사항": "[1] 난민법 시행령 제5조 제1항 제4호에서 ‘안전한 국가로부터 온 경우’를 난민인정 심사 불회부사유로 규정한 취지 / 위 조항에서 말하는 ‘안전한 국가로부터 온 경우’의 의미 및 이에 관한 증명책임의 소재(=법무부장관 또는 지방출입국·외국인관서의 장)\n [2] 난민법 시행령 제5조 제1항 제7호에서 정한 난민인정 신청이 ‘명백히 이유 없는 경우’에 해당하는지 판단하는 방법 및 난민인정 신청이 명백히 이유 없다는 점에 관한 증명책임의 소재(=법무부장관 또는 지방출입국·외국인관서의 장)",
    "판결요지": "[1] 난민법 제6조 제5항은 출입국항에서 하는 난민인정 신청의 절차 등 필요한 사항을 대통령령으로 정하도록 하였고, 그에 따라 난민법 시행령 제5조 제1항은 출입국항에서의 난민신청자를 난민인정 심사에 회부하지 아니할 수 있는 사유로 제1호부터 제7호까지의 사유를 열거하고 있는데, 그중 제4호는 \"박해의 가능성이 없는 안전한 국가 출신이거나 안전한 국가로부터 온 경우\"를 규정하고 있다.\n  위와 같이 ‘안전한 국가로부터 온 경우’를 난민인정 심사 불회부사유로 규정한 취지는, 출입국항에서의 난민신청자가 대한민국 출입국항에 도착하기 이전까지 거쳐 온 국가에서 난민인정 심사를 받아 난민으로 인정받을 수 있는 실질적인 기회가 있다면, 그 국가에서 난민인정 신청을 하여 심사를 받도록 대한민국에서의 심사 기회를 주지 않을 수 있는 재량을 인정함으로써, 난민인정 심사 절차의 효율성을 제고하려는 데에 있다.\n  출입국항에서의 난민인정신청제도의 목적과 난민신청자의 강제송환금지 원칙을 규정한 난민법 제3조의 입법 취지 등을 고려하면, 앞서 본 규정에서 말하는 ‘안전한 국가로부터 온 경우’란 아래의 조건들을 모두 충족하는 경우를 의미한다고 해석함이 타당하고, 그 증명책임은 이를 주장하는 법무부장관(또는 지방출입국·외국인관서의 장)에게 있다.\n  ① 출입국항에서의 난민신청자가 출신국을 제외하고 대한민국 출입국항에 도착하기 이전까지 거쳐 온 국가에 재입국할 수 있음이 보장되어야 한다.\n  ② 당해 난민신청자가 그 국가에서 난민인정 신청을 할 경우 실질적으로 난민신청자로서의 권리, 즉 특별한 사정이 없는 한 공정하고 실질적인 난민인정 심사를 받고, 불복 기회가 부여되며, 난민불인정결정이 확정되기 이전에는 그 의사에 반하여 강제로 송환될 우려가 없을 것을 보장받을 수 있어야 한다.\n  ③ 나아가 난민의 요건을 갖추고 있을 경우 난민으로 인정되고 이에 따라 국제적으로 일반화되어 통용되고 있는 기준에 상응하는 지위와 처우가 보장될 수 있어야 한다.\n [2] 난민법 제6조 제5항, 난민법 시행령 제5조 제1항 제7호는 출입국항에서의 난민신청자를 난민인정 심사에 회부하지 아니할 수 있는 사유 중 하나로 \"그 밖에 오로지 경제적인 이유로 난민인정을 받으려는 등 난민인정 신청이 명백히 이유 없는 경우\"를 규정하고 있다. 여기에서 ‘명백히 이유 없는 경우’는 행정청이 신청자를 난민인정 심사에 회부하지 않을 수 있는 소극적 요건이다.\n난민법 제6조 제3항은 법무부장관으로 하여금 출입국항에서 난민인정신청서를 제출한 외국인에 대하여 신청서가 제출된 날로부터 비교적 단기간인 7일 이내에 난민인정 심사에 회부할 것인지 여부를 신속하게 결정하여야 한다고 하는 한편, 그 기간 안에 이를 결정하지 못할 경우 신청자의 입국을 허가하도록 하여 출입국항에서의 난민신청자에게 난민인정 심사의 기회를 제공하는 것을 원칙으로 정하고 있다. 이와 함께 박해의 위험에 처해 있을 수도 있는 외국인이 출입국항에서 입국심사를 받으면서 난민인정 심사를 받을 수 있는 기회를 부여하여 출입국항에서 바로 강제송환당하는 것을 방지하는 데에 출입국항에서의 난민인정신청제도의 목적이 있음을 고려하여 보면, 난민법 시행령 제5조 제1항 제7호는 난민의 요건을 충족하지 못함이 외견상 명백한 사안에서 선행적 조치를 취하여 난민인정 심사 절차의 효율성을 제고함에 취지가 있지, 심사 절차 자체를 간이하게 운영하는 것을 허용하는 취지라고 볼 수 없다. 따라서 행정청이 신청자를 난민인정 심사에 회부하지 않을 수 있는 소극적 요건으로서 일반조항에 해당하는 난민법 시행령 제5조 제1항 제7호의 ‘명백히 이유 없는 경우’를 해석·적용할 때는, 출입국항에서 입국심사를 받으며 난민인정 신청을 하는 외국인의 난민법상 절차적 권리가 실질적으로 배제되는 결과가 일어나지 않도록 유의할 필요가 있다.\n  이러한 점에서 난민인정 신청이 명백히 이유 없는 경우라고 하기 위해서는, 신청의 내용 자체에서 법리상 받아들여질 수 없음이 외견상 명백한 이유를 들고 있는 경우, 또는 난민 요건의 주요사실에 관한 주장에 의심스러운 점이 있다는 것을 넘어, 주요사실에 관한 주장 자체에 심각한 모순이 있거나 객관적 자료와 현저히 배치되는 등 난민인정 신청의 이유 없음이 명백히 드러날 정도에 이르러야 한다. 사실관계를 정확히 조사해야 비로소 그 주장의 이유 없음이 밝혀질 수 있는 경우라면, 난민인정 신청이 명백히 이유 없는 경우라고 할 수 없다. 나아가 난민인정 신청이 명백히 이유 없다는 점에 관한 증명책임은 법무부장관(또는 지방출입국·외국인관서의 장)에게 있다.",
    "참조조문": "[1] 난민법 제3조, 제6조, 난민법 시행령 제5조 제1항 제4호, 제24조 제1항 제3호, 행정소송법 제26조[증명책임] / [2] 난민법 제6조 제3항, 제5항, 제46조, 난민법 시행령 제5조 제1항 제7호, 제24조 제1항 제3호, 행정소송법 제26조[증명책임]",
    "참조판례": "",
    "판례내용": "【원고, 상고인】 원고 (소송대리인 변호사 김주광)\n【피고, 피상고인】 인천공항출입국·외국인청장\n【원심판결】 서울고법 2024. 11. 8. 선고 2024누46776 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 상고보충이유서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요 \n  원심판결 이유와 기록에 의하면 다음과 같은 사실을 알 수 있다.\n  가. 원고는 튀니지 국적의 1999년생 여성이다. 원고는 튀니지에서 거주하던 중 2023. 8. 27.경 의료 사증으로 튀르키예에 입국하여 체류하다가, 2023. 11. 19. 항공기로 튀르키예를 출국하여 2023. 11. 20. 인천국제공항에 도착한 후, 피고로부터 입국심사를 받았으나 입국목적 불분명을 이유로 입국재심실로 안내되었다. \n  나. 원고는 2023. 11. 24. 피고에게 ‘원고는 튀니지에서 전 남편으로부터 지속적으로 심각한 폭행을 당해 이혼하였고, 이혼 후에도 그로부터 계속해서 폭행, 괴롭힘 및 협박 등을 당하였는데도 튀니지 경찰로부터 적절한 보호를 받지 못하였다. 따라서 원고가 튀니지로 송환될 경우 특정 사회집단의 구성원인 신분을 이유로 박해를 당할 우려가 있다.’라는 취지로 주장하면서, 난민법 제6조 제1항에 따라 난민으로 인정하여 줄 것을 신청(이하 ‘이 사건 신청’이라고 한다)하였다.\n  다. 피고는 2023. 12. 1. 원고가 난민법 시행령 제5조 제1항 제4호 또는 제7호에 해당한다는 이유로, 원고에 대하여 난민인정 심사에 회부하지 않기로 하는 결정(이하 ‘이 사건 처분’이라고 한다)을 하였다. \n  2. 난민법 시행령 제5조 제1항 제4호 사유에 해당하는지 여부 \n  가. 원심의 판단 \n  원심은, 튀르키예는「난민의 지위에 관한 1951년 협약」(이하 ‘난민협약’이라고 한다)과「난민의 지위에 관한 1967년 의정서」(이하 ‘난민의정서’라고 한다)의 가입국으로, 세계에서 가장 높은 수준의 난민 수용률을 보여주고 있고 수많은 아랍계 난민도 수용하고 있으며, 원고가 튀르키예에서 난민인정 신청을 하였다면 부당하게 거부되었을 것이라고 속단할 수 없다는 등 판시와 같은 이유를 들어, 튀르키예를 거쳐 대한민국으로 온 원고는 난민법 시행령 제5조 제1항 제4호에서 정한 ‘안전한 국가로부터 온 경우’에 해당한다고 보아, 이 사건 처분이 적법하다고 판단하였다. \n  나. 대법원의 판단 \n  1) 난민법 제6조는 ‘출입국항에서 하는 신청’이라는 제목 아래 \"외국인이 입국심사를 받는 때에 난민인정 신청을 하려면 출입국관리법에 따른 출입국항을 관할하는 지방출입국·외국인관서의 장에게 난민인정신청서를 제출하여야 한다(제1항). 지방출입국·외국인관서의 장은 제1항에 따라 출입국항에서 난민인정신청서를 제출한 사람에 대하여 7일의 범위에서 출입국항에 있는 일정한 장소에 머무르게 할 수 있다(제2항). 법무부장관은 제1항에 따라 난민인정신청서를 제출한 사람에 대하여는 그 신청서가 제출된 날부터 7일 이내에 난민인정 심사에 회부할 것인지를 결정하여야 하며, 그 기간 안에 결정하지 못하면 그 신청자의 입국을 허가하여야 한다(제3항).\"라고 하여 출입국항에서의 난민인정신청제도를 두고 있다. 이는 출입국항에서 입국심사를 받는 외국인에게 난민인정 심사를 받을 수 있는 기회를 부여하여 박해의 위험에 처해 있을 수도 있는 외국인이 난민인정 심사조차 받지 못하고 출입국항에서 바로 강제송환당하는 것을 방지하는 한편, 출입국항에서 일정 기간 머물게 하면서 난민인정 심사에 회부할지 여부를 간이한 절차로 신속하게 결정함으로써 난민인정심사제도를 실질적이고 효율적으로 운영하기 위한 제도이다. \n  2) 난민법 제6조 제5항은 출입국항에서 하는 난민인정 신청의 절차 등 필요한 사항을 대통령령으로 정하도록 하였고, 그에 따라 난민법 시행령 제5조 제1항은 출입국항에서의 난민신청자를 난민인정 심사에 회부하지 아니할 수 있는 사유로 제1호부터 제7호까지의 사유를 열거하고 있는데, 그중 제4호는 \"박해의 가능성이 없는 안전한 국가 출신이거나 안전한 국가로부터 온 경우\"를 규정하고 있다. \n위와 같이 ‘안전한 국가로부터 온 경우’를 난민인정 심사 불회부사유로 규정한 취지는, 출입국항에서의 난민신청자가 대한민국 출입국항에 도착하기 이전까지 거쳐 온 국가에서 난민인정 심사를 받아 난민으로 인정받을 수 있는 실질적인 기회가 있다면, 그 국가에서 난민인정 신청을 하여 심사를 받도록 대한민국에서의 심사 기회를 주지 않을 수 있는 재량을 인정함으로써, 난민인정 심사 절차의 효율성을 제고하려는 데에 있다.\n이러한 출입국항에서의 난민인정신청제도의 목적과 난민신청자의 강제송환금지의 원칙을 규정한 난민법 제3조의 입법 취지 등을 고려하면, 앞서 본 규정에서 말하는 ‘안전한 국가로부터 온 경우’란 아래의 조건들을 모두 충족하는 경우를 의미한다고 해석함이 타당하고, 그 증명책임은 이를 주장하는 피고에게 있다. \n  가) 출입국항에서의 난민신청자가 출신국을 제외하고 대한민국 출입국항에 도착하기 이전까지 거쳐 온 국가에 재입국할 수 있음이 보장되어야 한다.\n  나) 당해 난민신청자가 그 국가에서 난민인정 신청을 할 경우 실질적으로 난민신청자로서의 권리, 즉 특별한 사정이 없는 한 공정하고 실질적인 난민인정 심사를 받고, 불복 기회가 부여되며, 난민불인정결정이 확정되기 이전에는 그 의사에 반하여 강제로 송환될 우려가 없을 것을 보장받을 수 있어야 한다.\n  다) 나아가 난민의 요건을 갖추고 있을 경우 난민으로 인정되고 이에 따라 국제적으로 일반화되어 통용되고 있는 기준에 상응하는 지위와 처우가 보장될 수 있어야 한다. \n  3) 튀르키예는 난민협약 및 난민의정서의 가입국으로, 다수의 시리아 출신 외국인을 임시 보호의 대상으로 수용하고 있다. 다만 튀르키예의 난민법인 「외국인 및 국제적 보호에 관한 법률」에 따르면, 난민의 요건으로 박해를 받을 우려의 원인이 되는 사유가 유럽 국가에서 발생한 경우로 제한되어 있고, 유럽 국가 외부에서 발생한 사건으로 인해 박해를 받을 우려가 있는 경우에는 정식 난민이 아닌 조건부 난민으로서 임시적으로 머무를 수 있는 제한된 지위만이 부여된다. 임시 보호의 경우에도 긴급하고 임시적인 보호를 받기 위해 대규모로 튀르키예에 온 외국인에 대하여만 이를 제공할 수 있는 근거 규정이 마련되어 있다. \n  이러한 사정 등에 비추어 보면, 박해를 받을 우려의 원인이 되는 사유로 유럽 국가가 아닌 튀니지에서 발생한 사건을 주장하고 있고, 긴급하고 임시적인 보호를 받기 위해 대규모로 튀르키예에 입국한 경우도 아닌 원고의 처지에서, 튀르키예에 재입국하여 난민인정 신청을 할 경우 실질적으로 난민신청자로서 권리를 보장받을 수 있다는 등의 사정이 증명되었다고 보기 어렵다. \n  4) 그럼에도 원심은 위와 같은 처지에 있는 원고에게 적용되는 튀르키예의 난민법제 등에 관하여 심리하지 아니한 채 판시와 같은 사정만을 들어 원고가 안전한 국가에서 온 경우에 해당된다고 판단하여 원고의 청구를 기각하였다. 이러한 원심판단에는 난민법 시행령 제5조 제1항 제4호의 ‘안전한 국가로부터 온 경우’에 관한 법리를 오해하여 필요한 심리를 다하지 아니함으로써 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 상고이유 주장은 이유 있다.\n  3. 난민법 시행령 제5조 제1항 제7호 사유에 해당하는지 여부 \n  가. 원심의 판단 \n  원심은 판시와 같은 이유로, 원고가 이 사건 신청에서 주장하는 ‘이혼한 전 남편의 지속적 괴롭힘’은 튀니지 당국에 보호를 요청하여야 할 문제인데, 튀니지 당국이 여성에 대한 폭력에 단호하게 대응하겠다고 밝히면서 관련 법제를 정비하는 등의 조치를 취해왔을 뿐만 아니라, 원고가 주장하는 전 남편의 지속적 괴롭힘을 인정할 증거도 부족하고, 원고가 경제적 이유로 대한민국에 온 것으로 보이기도 한다는 등의 근거를 들어, 이 사건 신청이 난민법 시행령 제5조 제1항 제7호에서 정한 ‘난민인정 신청이 명백히 이유 없는 경우’에 해당한다고 보아, 이 사건 처분이 적법하다고 판단하였다. \n  나. 대법원의 판단 \n  1) 난민법 제6조 제5항, 난민법 시행령 제5조 제1항 제7호는 출입국항에서의 난민신청자를 난민인정 심사에 회부하지 아니할 수 있는 사유 중 하나로 \"그 밖에 오로지 경제적인 이유로 난민인정을 받으려는 등 난민인정 신청이 명백히 이유 없는 경우\"를 규정하고 있다. 여기에서 ‘명백히 이유 없는 경우’는 행정청이 신청자를 난민인정 심사에 회부하지 않을 수 있는 소극적 요건이다. \n난민법 제6조 제3항은 법무부장관으로 하여금 출입국항에서 난민인정신청서를 제출한 외국인에 대하여 신청서가 제출된 날로부터 비교적 단기간인 7일 이내에 난민인정 심사에 회부할 것인지 여부를 신속하게 결정하여야 한다고 하는 한편, 그 기간 안에 이를 결정하지 못할 경우 그 신청자의 입국을 허가하도록 하여 출입국항에서의 난민신청자에게 난민인정 심사의 기회를 제공하는 것을 원칙으로 정하고 있다. 이와 함께 박해의 위험에 처해 있을 수도 있는 외국인이 출입국항에서 입국심사를 받으면서 난민인정 심사를 받을 수 있는 기회를 부여하여 출입국항에서 바로 강제송환당하는 것을 방지하는 데에 출입국항에서의 난민인정신청제도의 목적이 있음을 고려하여 보면, 난민법 시행령 제5조 제1항 제7호는 난민의 요건을 충족하지 못함이 외견상 명백한 사안에서 선행적 조치를 취하여 난민인정 심사 절차의 효율성을 제고함에 그 취지가 있지, 그 심사 절차 자체를 간이하게 운영하는 것을 허용하는 취지라고 볼 수 없다. 따라서 행정청이 신청자를 난민인정 심사에 회부하지 않을 수 있는 소극적 요건으로서 일반조항에 해당하는 난민법 시행령 제5조 제1항 제7호의 ‘명백히 이유 없는 경우’를 해석·적용할 때는, 출입국항에서 입국심사를 받으며 난민인정 신청을 하는 외국인의 난민법상 절차적 권리가 실질적으로 배제되는 결과가 일어나지 않도록 유의할 필요가 있다.\n이러한 점에서 난민인정 신청이 명백히 이유 없는 경우라고 하기 위해서는, 그 신청의 내용 자체에서 법리상 받아들여질 수 없음이 외견상 명백한 이유를 들고 있는 경우, 또는 난민 요건의 주요사실에 관한 주장에 의심스러운 점이 있다는 것을 넘어, 주요사실에 관한 주장 자체에 심각한 모순이 있거나 객관적 자료와 현저히 배치되는 등 난민인정 신청의 이유 없음이 명백히 드러날 정도에 이르러야 한다. 사실관계를 정확히 조사하여야 비로소 그 주장의 이유 없음이 밝혀질 수 있는 경우라면, 난민인정 신청이 명백히 이유 없는 경우라고 할 수 없다. 나아가 난민인정 신청이 명백히 이유 없다는 점에 관한 증명책임은 피고에게 있다. \n  2) 원심판결 이유 및 기록에 의하여 알 수 있는 다음과 같은 사정을 앞서 본 법리에 비추어 보면, 원심이 근거로 삼은 사정만으로는 이 사건 신청이 명백히 이유 없는 경우에 해당함이 증명되었다고 보기 어렵다.\n  가) 원고가 이 사건 신청에서 주장한 내용은, 튀니지로 송환될 경우 전 남편으로부터 지속적으로 과도한 폭력이나 괴롭힘을 당할 위험이 있는데도, 튀니지 당국으로부터 충분한 보호를 기대하기 어렵다는 것이다. \n  전 남편에 의한 폭력이라고 해도, 그 폭력이 전통적·문화적·종교적 이유를 토대로 제도적으로 또는 조직적으로 야기·조장·방치되는 등으로써 여성에 대하여 심각한 고통을 수반하는 직접적인 위해를 가하여 인간의 존엄성을 침해하는 행위라면, 특정 사회집단의 구성원이라는 이유로 가해지는 ‘박해’에 해당하지 않는다고 단정할 수 없다. 나아가 그러한 폭력의 피해자인 여성이 국적국으로 송환될 경우 다시 동일한 폭력을 당하게 될 개별적·구체적인 위험이 있고, 그러한데도 국적국으로부터 충분한 보호를 기대하기 어렵다는 사정이 인정된다면, 박해를 받을 수 있다고 인정할 충분한 근거가 있는 공포로 인하여 국적국의 보호를 받을 수 없는 경우에 해당하지 않는다고 단정할 수 없다. 따라서 이 사건 신청은 그 내용 자체로 법리상 받아들여질 수 없음이 외견상 명백하다고 보기 어렵다. \n  나) 튀니지가 2017년 여성에 대한 폭력 문제에 대응하기 위해서 여성폭력금지법을 제정하기는 하였다. 그러나 기록에 의하면 그 이후에도 여성 폭력에 대한 보호의 구조적 한계와 현실적 문제 등이 남아 있다는 의견을 제기하는 각종 자료가 존재하는 점에서, 원고가 튀니지 당국으로부터 충분한 보호를 기대할 수 있음이 명백하다고 인정하기에 의문의 여지가 있다. \n  다) 전 남편으로부터 지속적인 폭력과 괴롭힘을 당했고 튀니지 당국으로부터 충분한 보호를 기대할 수 없다는 원고의 주장에 심각한 모순이 있다거나, 기록에서 이를 믿을 수 없음이 명백히 드러난다고 볼 정도의 객관적 자료를 찾기 어렵다. 원심도 전 남편으로부터의 지속적 괴롭힘을 인정할 증거가 부족하다거나, 경제적 이유로 이 사건 신청을 한 것으로 보인다고 판단하고 있을 뿐이다. 이러한 점 등에 비추어 보면, 이 사건 신청은 사실관계를 정확히 조사하여야 비로소 이유 없음이 밝혀질 수 있는 사안이라고 볼 여지가 있다. \n  3) 그런데도 원심은 판시와 같은 사정만을 들어 이 사건 신청이 명백히 이유 없는 경우에 해당한다고 판단하여 원고의 청구를 기각하였다. 이러한 원심판단에는 난민법 시행령 제5조 제1항 제7호의 ‘난민인정 신청이 명백히 이유 없는 경우’에 대한 증명책임과 증명의 정도에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 상고이유 주장은 이유 있다.\n  4. 결론 \n  그러므로 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 엄상필(재판장) 오경미(주심) 권영준 박영재"
  },

    "판례내용": "【원고, 상고인】                원고 1 외 4인 (소송대리인 변호사 이경호 외 2인)\n【피고, 피상고인】 한국토지주택공사 (소송대리인 법무법인 삼우 담당변호사 이상훈 외 3인)\n【원심판결】  서울고법 2024. 5. 23. 선고 2023누59690 판결         \n【주    문】\n  상고를 모두 기각한다.  상고비용은 원고들이 부담한다. \n\n【이    유】상고이유(상고이유서 제출기간이 지난 후에 제출된 서면의 기재는 상고이유를 보충하는 범위 내에서)를 판단한다.\n  1.                구 「감정평가 및 감정평가사에 관한 법률」(2021. 7. 20. 법률 제18309호로 개정되기 전의 것) 제3조 제3항은 \"감정평가의 공정성과 합리성을 보장하기 위하여 감정평가법인 등이 준수하여야 할 세부적인 원칙과 기준은 국토교통부령으로 정한다.\"라고 규정하고 있다. 그 위임에 따른 「감정평가에 관한 규칙」 제7조 제1항은 \"감정평가는 대상물건마다 개별로 하여야 한다.\"라고, 제2항은 \"둘 이상의 대상물건이 일체로 거래되거나 대상물건 상호 간에 용도상 불가분의 관계가 있는 경우에는 일괄하여 감정평가할 수 있다.\"라고 규정하고 있다. \n  따라서 2개 이상의 토지 등에 대한 감정평가는 개별평가를 원칙으로 하되, 예외적으로 2개 이상의 토지 등에 거래상 일체성 또는 용도상 불가분의 관계가 인정되는 경우에 일괄평가가 허용된다. 여기에서 ‘용도상 불가분의 관계’에 있다는 것은 일단의 토지로 이용되고 있는 상황이 사회적·경제적·행정적 측면에서 합리적이고 그 토지의 가치 형성적 측면에서도 타당하다고 인정되는 관계에 있는 경우를 뜻한다(대법원 2017. 3. 22. 선고 2016두940 판결, 대법원 2018. 1. 25. 선고 2017두61799 판결 등 참조). \n  2. 원심은 판시와 같은 이유로, 이 사건 각 토지는 그 지목 및 처분 시기가 서로 다르고, ○○동 (지번 1 생략) 토지의 면적과 형상에 비추어 위 토지가 단독으로 거래될 수 없다고 단정하기 어려울 뿐만 아니라 이 사건 각 토지를 분리하여 처분할 경우 ○○동 (지번 2 생략) 토지의 가치가 현저히 하락한다고 보기도 부족하므로, 이 사건 각 토지가 용도상 불가분의 관계에 있다고 보기 어렵다고 판단하였다.  \n  3. 원심의 이유 설시에 일부 부적절한 부분이 있기는 하나(원심은 이 사건 각 건물 사이에 담장이 있다고 판단하였으나, 이는 주택 옥상의 외벽을 담장으로 오인한 것으로 보인다) 이 사건 각 토지가 용도상 불가분의 관계에 있다고 보기 어렵다는 결론은 정당하므로, 거기에 상고이유 주장과 같이 필요한 심리를 다하지 아니한 채 논리와 경험의 법칙을 위반하여 자유심증주의의 한계를 벗어나거나, 일단을 이루는 토지의 손실보상에 관한 법리를 오해하는 등으로 판결에 영향을 미친 잘못이 없다. \n  4. 그러므로 상고를 모두 기각하고 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 권영준(재판장) 오경미 엄상필 박영재(주심)"
  },

    "판례일련번호": "606791",

    "사건명": "국가인권위원회권고결정취소[발달장애인에 대한 장애인콜택시 탑승제한기준에 관한 국가인권위원회 권고결정의 취소를 구하는 사건]",
    "선고일자": "20250612",
    "법원명": "대법원",
    "사건종류명": "일반행정",
    "판결유형": "판결",
    "판시사항": "[1] 공공기관 등이 교통약자를 위한 특별교통수단 운행 등의 서비스를 제공할 때 장애를 사유로 정당한 사유 없이 제한·배제·분리·거부 등에 의하여 장애인을 불리하게 대하는 경우, 장애인차별금지 및 권리구제 등에 관한 법률에서 금지하는 차별에 해당하는지 여부(원칙적 적극) / 이때 차별로 보지 않는 과도한 부담이나 현저히 곤란한 사정 등 정당한 사유가 있었는지 판단하는 방법\n [2] 서울시설공단이 운영하는 장애인콜택시에 발달장애인이 탑승할 경우 보조석이 아닌 2열에 탑승하여 운전석 뒤편에는 보호자 고객, 대각선에는 장애인 고객이 탑승할 수 있도록 조치할 것을 권고하는 기준에 관하여 국가인권위원회가 국가인권위원회법 제44조 제1항 제1호에 따라 발달장애를 이유로 장애인콜택시 보조석 탑승을 제한하지 않도록 위 기준을 개선할 것을 권고하는 결정을 하자 서울시설공단이 위 권고결정의 취소를 구한 사안에서, 위 기준이 장애인차별금지 및 권리구제 등에 관한 법률 제4조 제1항 및 제26조에서 정한 차별에 해당한다고 본 원심판단을 수긍한 사례",
    "판결요지": "[1] 장애인차별금지 및 권리구제 등에 관한 법률(이하 ‘장애인차별금지법’이라 한다) 제4조 제1항 제1호는 ‘금지하는 차별’로, ‘장애인을 장애를 사유로 정당한 사유 없이 제한·배제·분리·거부 등에 의하여 불리하게 대하는 경우’를 규정하고, 제26조 제2항은 공공기관 및 그 소속원은 사법·행정절차 및 서비스의 제공에서 장애인에게 제4조 제1항 제1호에서 정한 행위를 하여서는 안 된다고 규정하고 있다. 그리고 같은 법 제4조 제3항에서는 ‘금지된 차별행위를 하지 않음에 있어서 과도한 부담이나 현저히 곤란한 사정 등이 있는 경우’(제1호), ‘금지된 차별행위가 특정 직무나 사업 수행의 성질상 불가피한 경우’(제2호)에 해당하는 정당한 사유가 있는 경우에는 차별로 보지 않는다고 규정하고, 제47조 제2항에서는 차별로 보지 않는 정당한 사유가 있었다는 점은 차별행위를 당하였다고 주장하는 자의 상대방이 증명하여야 한다고 규정하고 있다. \n  이러한 관련 법령의 규정 내용에 따르면, 공공기관 등은 교통약자를 위한 특별교통수단 운행 등의 서비스를 제공할 때 장애를 사유로 정당한 사유 없이 제한·배제·분리·거부 등에 의하여 장애인을 불리하게 대하여서는 안 되고, 이를 위반하는 것은 과도한 부담이나 현저히 곤란한 사정, 특정 직무나 사업 수행의 성질상 불가피한 경우 등 정당한 사유가 있었다는 점을 증명하지 못하는 이상 장애인차별금지법에서 금지하는 차별에 해당한다.\n  한편 차별로 보지 않는 과도한 부담이나 현저히 곤란한 사정 등 정당한 사유가 있었는지는 구체적인 사안별로 여러 사정을 종합하여 판단해야 한다. 이때 장애인차별금지법의 입법 목적에 비추어 금지된 차별행위를 하지 않는 데에 일정한 재정 부담이 따른다는 이유만으로 정당한 사유를 쉽게 인정할 것은 아니다. 누구든지 ‘과도한 부담이나 현저히 곤란한 사정’에 이르지 않는 범위에서 최대한 성실하게 차별금지 의무를 이행하여야 한다.\n [2] 서울시설공단이 운영하는 장애인콜택시에 발달장애인이 탑승할 경우 보조석이 아닌 2열에 탑승하여 운전석 뒤편에는 보호자 고객, 대각선에는 장애인 고객이 탑승할 수 있도록 조치할 것을 권고하는 기준(이하 ‘탑승제한기준’이라 한다)에 관하여 국가인권위원회가 국가인권위원회법 제44조 제1항 제1호에 따라 발달장애를 이유로 장애인콜택시 보조석 탑승을 제한하지 않도록 위 탑승제한기준을 개선할 것을 권고하는 결정을 하자 서울시설공단이 위 권고결정의 취소를 구한 사안에서, 위 탑승제한기준이 장애인차별금지 및 권리구제 등에 관한 법률 제4조 제1항 및 제26조에서 정한 차별에 해당하고, 그와 같은 제한이 서울시설공단의 직무나 사업 수행의 성질상 불가피한 경우에 해당한다거나 이를 시행하지 않는 데에 과도한 부담이나 현저히 곤란한 사정이 있다고 볼 수 없다고 한 원심판단을 수긍한 사례.",
    "참조조문": "[1] 장애인차별금지 및 권리구제 등에 관한 법률 제4조 제1항 제1호, 제3항, 제26조 제2항, 제47조 제2항 / [2] 장애인차별금지 및 권리구제 등에 관한 법률 제4조 제1항 제1호, 제3항, 제26조 제2항, 국가인권위원회법 제44조 제1항",
    "참조판례": "[1] 대법원 2022. 2. 17. 선고 2019다217421 판결(공2022상, 600)",
    "판례내용": "【원고, 상고인】 서울시설공단 이사장 (소송대리인 법무법인(유한) 현 담당변호사 안광순 외 8인)\n【피고, 피상고인】 국가인권위원회 (소송대리인 법무법인 이공 담당변호사 구본석 외 8인)\n【피고보조참가인】 사단법인 ○○○ (소송대리인 변호사 김재왕 외 6인)\n【원심판결】 서울고법 2025. 1. 22. 선고 2023누68076 판결\n【주    문】\n  상고를 기각한다.  상고비용은 보조참가로 인한 부분을 포함하여 원고가 부담한다.  \n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요 \n  원심이 인정한 사실관계는 다음과 같다.\n  가. 서울시설공단은, 구 「교통약자의 이동편의 증진법」(2022. 1. 18. 법률 제18784호로 개정되기 전의 것) 제16조 제1항에 따라 이동에 심한 불편을 느끼는 교통약자의 이동편의를 위하여 같은 법 제2조 제8호의 특별교통수단을 운행하여야 할 의무가 있는 서울특별시장으로부터 같은 법 제16조 제8항, 「서울특별시 교통약자의 이동편의 증진에 관한 조례」 제13조에 따라 특별교통수단인 장애인콜택시의 관리 및 운행을 위탁받은 단체이고, 원고는 서울시설공단의 이사장이다. \n  나. 원고는 아래 다.항 기재 권고결정 당시 「발달장애인 권리보장 및 지원에 관한 법률」(이하 ‘발달장애인법’이라 한다)에 따른 발달장애인이 장애인콜택시 보조석에 탑승하는 경우 이동 시 돌발행동을 할 우려가 있어 사고 발생의 위험이 있다는 등의 이유로, 서울시설공단이 운영하는 장애인콜택시에 발달장애인이 탑승할 경우 보조석이 아닌 2열에 탑승하여 운전석 뒤편에는 보호자 고객, 대각선에는 장애인 고객이 탑승할 수 있도록 조치할 것을 권고하는 기준(이하 ‘이 사건 탑승제한기준’이라 한다)을 시행하고 있었다.\n  다. 피고는 2022. 2. 24. 발달장애를 이유로 장애인콜택시 보조석 탑승을 제한하는 행위는 부정적 편견에서 기인한 것으로 「장애인차별금지 및 권리구제 등에 관한 법률」(이하 ‘장애인차별금지법’이라 한다) 제7조 제1항 및 발달장애인법 제8조 제1항에서 보장하고 있는 발달장애인의 자기결정권을 침해하는 것이고, 장애인차별금지법 제19조 제1항에서 규정하고 있는 이동 및 교통수단 등을 이용하는 데에 정당한 사유 없이 장애인을 불리하게 대우한 차별행위에 해당한다는 이유로 국가인권위원회법 제44조 제1항 제1호에 따라 원고에게 ‘발달장애를 이유로 장애인콜택시 보조석 탑승을 제한하지 않도록 이 사건 탑승제한기준을 개선할 것을 권고한다.’는 취지의 권고결정을 하였다(이하 ‘이 사건 권고결정’이라 한다). \n  2. 제1, 2 상고이유에 관한 판단 \n  원심은 판시와 같은 이유로, 피고보조참가인이 원심법원에 이 사건 탑승제한기준이 장애인차별금지법 제26조 등의 차별행위에 해당한다고 주장한 것은, 피고가 이 사건 권고결정 당시 적시한 것과 동일한 사실관계에 대하여 단지 처분의 근거 법령만을 추가한 것이지 새로운 처분사유를 추가한 것이 아니라고 보고, 이 사건 탑승제한기준이 장애인차별금지법 제26조에서 정한 차별에 해당하는지 여부를 나아가 판단하였다. \n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 원심판단에 상고이유 주장과 같이 처분사유 추가·변경의 제한에 관한 법리오해, 석명의무 위반, 심리미진 등으로 판결에 영향을 미친 잘못이 없다. \n  3. 제3 상고이유에 관한 판단 \n장애인차별금지법 제4조 제1항 제1호는 ‘금지하는 차별’로, ‘장애인을 장애를 사유로 정당한 사유 없이 제한·배제·분리·거부 등에 의하여 불리하게 대하는 경우’를 규정하고, 제26조 제2항은 공공기관 및 그 소속원은 사법·행정절차 및 서비스의 제공에 있어서 장애인에게 제4조 제1항 제1호에서 정한 행위를 하여서는 아니 된다고 규정하고 있다. 그리고 같은 법 제4조 제3항에서는 ‘금지된 차별행위를 하지 않음에 있어서 과도한 부담이나 현저히 곤란한 사정 등이 있는 경우’(제1호), ‘금지된 차별행위가 특정 직무나 사업 수행의 성질상 불가피한 경우’(제2호)에 해당하는 정당한 사유가 있는 경우에는 차별로 보지 아니한다고 규정하고, 제47조 제2항에서는 차별로 보지 않는 정당한 사유가 있었다는 점은 차별행위를 당하였다고 주장하는 자의 상대방이 증명하여야 한다고 규정하고 있다.\n이러한 관련 법령의 규정 내용에 따르면, 공공기관 등은 교통약자를 위한 특별교통수단 운행 등의 서비스를 제공할 때 장애를 사유로 정당한 사유 없이 제한·배제·분리·거부 등에 의하여 장애인을 불리하게 대하여서는 아니 되고, 이를 위반하는 것은 과도한 부담이나 현저히 곤란한 사정, 특정 직무나 사업 수행의 성질상 불가피한 경우 등 정당한 사유가 있었다는 점을 증명하지 못하는 이상 장애인차별금지법에서 금지하는 차별에 해당한다.\n한편 차별로 보지 않는 과도한 부담이나 현저히 곤란한 사정 등 정당한 사유가 있었는지 여부는 구체적인 사안별로 여러 사정을 종합하여 판단하여야 한다. 이때 장애인차별금지법의 입법 목적에 비추어 금지된 차별행위를 하지 않는 데에 일정한 재정 부담이 따른다는 이유만으로 정당한 사유를 쉽게 인정할 것은 아니다. 누구든지 ‘과도한 부담이나 현저히 곤란한 사정’에 이르지 않는 범위에서 최대한 성실하게 차별금지 의무를 이행하여야 한다(대법원 2022. 2. 17. 선고 2019다217421 판결 참조).\n  원심은 발달장애인의 장애인콜택시 보조석 탑승을 제한한 이 사건 탑승제한기준이 장애인차별금지법 제4조 제1항 및 제26조에서 정한 차별에 해당한다고 본 다음, 발달장애인의 보조석 탑승을 금지할 필요성, 발달장애인의 권리 침해 정도 및 차별의 정도가 최소한에 해당하는지 등을 고려하면 이러한 탑승제한기준이 원고의 직무나 사업 수행의 성질상 불가피한 경우에 해당한다거나 이를 시행하지 않는 데에 원고에게 과도한 부담이나 현저히 곤란한 사정이 있다고 볼 수 없다고 판단하여, 이 사건 탑승제한기준의 시행에 장애인차별금지법 제4조 제3항의 정당한 사유가 있다는 원고 주장을 배척하였다.\n  원심판결 이유를 앞서 본 법리와 기록에 비추어 살펴보면, 원심판단에 상고이유 주장과 같이 장애인차별금지법 제4조 제3항의 차별로 보지 않는 정당한 사유에 관한 법리를 오해하거나 논리와 경험 법칙을 위반하여 자유심증주의 한계를 벗어나 필요한 심리를 다하지 않는 등으로 판결에 영향을 미친 잘못이 없다. \n  4. 결론\n  상고를 기각하고, 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.  \n\n대법관 이흥구(재판장) 오석준 노경필(주심) 이숙연"

    "판례내용": "【원고, 피상고인】                원고 (소송대리인 법무법인 천우 외 1인)\n【피고, 상고인】 시흥시장 (소송대리인 법무법인 케이씨엘 담당변호사 노재열 외 1인)\n【원심판결】  수원고법 2024. 10. 2. 선고 2023누15779 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 수원고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 의하면, 다음과 같은 사실을 알 수 있다.\n  가. 피고는 2006. 9. 29. 시흥시 고시 제2006-65호로 \"개발제한구역 내 자동차용 액화석유가스충전소 배치계획 고시\"(이하 ‘이 사건 배치계획 고시’라 한다)를 하였는데, 위 고시는 제1조에서 시흥시의 개발제한구역 안에 설치할 수 있는 자동차용 액화석유가스 충전소(이하 ‘충전소’라 한다)의 배치계획 등을 정함을 목적으로 한다고 밝히면서, 제2조에서 부천시계로부터 ○○동 방향의 △△△로 14.5km(이하 ‘이 사건 도로’라 한다) 노선에 신규로 1개의 충전소를 배치한다고 규정하고, 제3조 제1항 제4호 (다)목(이하 ‘이 사건 거리제한 규정’이라 한다)에서 충전소를 설치할 수 있는 토지의 입지기준으로 \"개발제한구역의 지정 및 관리에 관한 특별조치법 제14조 및 동법 시행령 제25조의 규정에 의하여 지정된 취락지구\"의 건축물로부터 반경 200m 이내가 아닐 것을 규정하였으며, 제8조에서 신규로 배치한 충전소의 허가를 위한 대상자의 선정 방법 등은 따로 정하여 공고한다고 규정하였다.\n  이후 피고는 2006. 10. 2. 시흥시 공고 제2006-1412호로 \"시흥시 개발제한구역 내의 자동차용 액화석유가스충전소 배치계획에 따른 우선순위 결정기준 및 신청자 접수공고\"(이하 ‘이 사건 우선순위자 신청 공고’라 한다)를 하였는데, 위 공고에는 2006. 10. 2.부터 2006. 10. 31.까지 신청서를 접수하여 심의위원회의 심의를 거친 후 이 사건 배치계획 고시에 따른 충전소 허가의 우선순위자를 결정하여 공고한다는 내용이 담겨 있었다. \n  나. 원고는 2022. 10. 31. 피고로부터, 이 사건 도로에 연접하여 개발제한구역 내에 있는 시흥시 □□동 (지번 1 생략), (지번 2 생략) 각 토지(이하 ‘이 사건 토지’라 한다)를 사업소 소재지로 하여, 「액화석유가스의 안전관리 및 사업법」(이하 ‘액화석유가스법’이라 한다) 제5조 제1항에 따른 액화석유가스 충전사업 허가를 받았다. 위 허가에는 「개발제한구역의 지정 및 관리에 관한 특별조치법」(이하 ‘개발제한구역법’이라 한다) 제12조 제1항 단서에 따른 행위허가 신청은 종합적인 검토 결과에 따라 최종 불허가될 수 있다는 내용이 부기되어 있었다.\n  다. 원고는 2022. 12. 7. 피고에게 개발제한구역법 제12조 제1항 단서 제1호 (마)목에 따라 이 사건 토지에서 충전소를 신축하는 행위에 대한 허가를 신청하였다. 그러나 피고는 2023. 1. 27. 원고에게, ① 원고가 이 사건 우선순위자 신청 공고에 따른 우선순위 결정자가 아닌 점, ② 이 사건 토지가 이 사건 배치계획 고시상 입지기준인 ‘취락지구로부터 반경 200m 이내가 아닐 것’에도 부합하지 않는 점, ③ 개발제한구역 내의 난개발을 방지하고 그 지정 당시 거주자들 및 개발제한구역 내 10년 이상 거주자들에게 동일한 조건하에서 충전소 허가 신청을 할 기회를 부여할 중대한 공익상 필요가 있으므로, 대상 도로인 △△△로 확장 공사 완료 이후에 교통량 변화 등을 고려하여 이 사건 배치계획 고시에 따른 우선순위자를 추가로 모집할 예정인 점(이하 순서대로 각각 ‘① 사유’, ‘② 사유’, ‘③ 사유’라 한다)을 들어, 원고의 위 행위허가 신청을 받아들이지 않는다고 통보하였다(이하 ‘이 사건 거부처분’이라 한다).\n  2. 원심의 판단\n  원심은 이 사건 거부처분의 처분사유를 ① 사유 및 ② 사유로 파악하였다. 그 전제에서 원심은 ① 사유에 대하여, 이 사건 우선순위자 신청 공고는 절차상 편의를 위한 규정일 뿐 충전소 허가에 관한 실체적 요건을 규정한 것이 아닌 점, 위 공고가 이루어진 때로부터 약 16년이 지났고 이 사건 거부처분 당시 위 공고에 따라 결정된 우선순위자에게 충전소 허가를 내어주는 것이 이미 불가능한 상황이었던 점 등을 종합하면, 원고가 위 공고에 따른 우선순위 결정자가 아니라는 점만을 내세운 ① 사유는 적법한 처분사유가 될 수 없다고 보았다.\n  또한 원심은 ② 사유에 대하여, ‘취락지구로부터 반경 200m 이내가 아닐 것’을 입지기준으로 정한 이 사건 거리제한 규정이 충전소 설치로 인한 재해 발생 위험 등을 고려하여 도입된 것이라는 전제하에 이 사건 거리제한 규정은 개발제한구역법령의 위임에 따라 제정된 것인데 해당 법령에서는 위와 같은 위험 등까지 고려하여 거리제한 규정을 두도록 정하고 있지 않고, 충전소 허가에 관한 기준과 시설기준·기술기준 등은 액화석유가스법령에서 규율하고 있는데 원고는 해당 법령에 따른 액화석유가스 충전사업 허가를 받았으며, 위 입지기준은 액화석유가스법령에서 정한 시설기준도 초과한다는 이유로, 이 사건 거리제한 규정은 상위 법령의 위임 범위를 벗어나 법규명령으로서 대외적 구속력을 인정할 수 없으므로 이에 근거한 ② 사유 역시 적법한 처분사유가 될 수 없다고 보았다.\n  그리하여 원심은 이 사건 거부처분은 처분사유가 존재하지 아니하여 위법하므로 취소되어야 한다고 판단하였다.\n  3. 대법원의 판단\n  가. 관련 법령\n  개발제한구역법 제1조는 ‘개발제한구역의 지정과 개발제한구역에서의 행위 제한 등에 필요한 사항을 정함으로써 도시의 무질서한 확산을 방지하고 도시 주변의 자연환경을 보전하여 도시민의 건전한 생활환경을 확보하는 것을 목적으로 한다.’고 규정하고 있고, 이에 따라 같은 법 제12조 제1항 본문은 ‘개발제한구역에서는 건축물의 건축, 공작물의 설치, 토지의 형질변경 등을 할 수 없다.’고 규정하고 있다. 다만 같은 항 단서 제 1호 (마)목은 ‘개발제한구역 주민의 주거·생활편익·생업을 위한 시설로서 대통령령으로 정하는 건축물의 건축 또는 공작물의 설치와 이에 따르는 토지의 형질변경을 하려는 자는 시장·군수 또는 구청장 등의 허가를 받아 그 행위를 할 수 있다.’고 규정하고 있다.\n  이러한 위임에 따라 개발제한구역법 시행령 제13조 제1항 [별표 1] 제5호 (마)목 10)은 같은 법 제12조 제1항 단서 제1호 (마)목에 따른 개발제한구역 주민의 주거·생활편익·생업을 위한 시설 중 하나로서 충전소를 규정하고 있다. 위 시행령 조항은 그 충전소 건축 또는 설치의 범위에 관하여, 시장 등이 수립하는 배치계획에 따라 시장 등, 지정당시거주자(개발제한구역 지정 당시부터 해당 개발제한구역에 거주하고 있는 사람, 같은 시행령 제18조 제2항 제3호 참조) 또는 허가 신청일 현재 해당 개발제한구역에서 10년 이상 계속 거주하고 있는 사람(이하 ‘10년 이상 거주자’라 한다)이 국도·지방도 등 간선도로변에 설치하는 경우만 해당하고, 충전소의 시설 간 간격 등 배치계획의 수립기준은 국토교통부령으로 정한다고 규정하고 있다[위 시행령 조항 가), 마)].\n  이에 따라 개발제한구역법 시행규칙 제7조는 위 시행령 조항에 따른 충전소의 시설 간 간격 등 배치계획의 수립기준으로, 충전소는 개발제한구역의 훼손을 최소화할 수 있는 국도·지방도 등 간선도로변에 설치할 수 있도록 하되 해당 도로의 교통량 및 그 시설 이용의 편리성 등을 고려할 것(제1호), 충전소 간의 간격은 같은 방향별로 5km 이상으로 할 것(제2호) 등을 규정하고 있다. \n  나. ② 사유에 관하여\n  1) 관련 법리\n  입법 목적 등을 달리하는 법률들이 일정한 행위에 관한 요건을 각각 규정하고 있는 경우에, 어느 법률이 다른 법률에 우선하여 배타적으로 적용된다고 풀이되지 아니하는 한 그 행위에 관하여 각 법률의 규정에 따른 허가를 받아야 한다. 액화석유가스법과 개발제한구역법은 각 허가 요건을 별도로 규정하고 있고, 입법 목적, 규정 사항, 적용 범위 등에 비추어 액화석유가스법이 개발제한구역법에 우선하여 배타적으로 적용되는 관계에 있다고 해석되지 않으므로, 개발제한구역에서 자동차용 액화석유가스 충전사업을 하려는 자는 액화석유가스법에 따른 자동차용 액화석유가스 충전사업 허가와 개발제한구역법에 따른 충전소 허가를 모두 받아야 한다(대법원 2016. 3. 24. 선고 2014두5330 판결 참조). \n  한편 법령의 규정이 허가관청에 그 법령 내용의 구체적인 사항을 정할 수 있는 권한을 부여하면서 그 권한 행사의 절차나 방법을 정하지 아니하고 있는 경우에, 그 법령의 내용이 될 사항을 구체적으로 규정한 허가관청의 고시는 해당 법률 및 그 시행령의 위임 한계를 벗어나지 않는 한 그 법령의 규정과 결합하여 효력을 가지며, 허가관청이 그 위임 범위 내에서 허가기준을 정하였다면 그 허가기준의 내용이 관계 법령의 목적이나 근본 취지에 명백히 배치되거나 서로 모순되는 등의 특별한 사정이 없는 한 그 허가기준이 효력이 없다고 볼 수는 없다. 그리고 이러한 법리는 개발제한구역법령에 근거하여 시장 등이 수립하는 충전소 배치계획의 경우에도 마찬가지로 적용된다(위 대법원 2014두5330 판결 참조). \n  2) 구체적 판단\n  가) 앞서 본 사실관계를 관련 법령에 대입하여 보면, 피고의 이 사건 배치계획 고시는 개발제한구역법령에 근거하여 시장 등이 수립한 충전소 배치계획으로서, 위 관련 법리에 따라 개발제한구역법령의 위임 한계를 벗어나지 않고 그 내용이 해당 법령의 목적이나 근본 취지에 명백히 배치되거나 서로 모순되는 등의 특별한 사정이 없는 한, 개발제한구역법령의 규정과 결합하여 효력을 가진다.\n  나) 나아가 아래의 사정들을 종합하여 보면, 피고가 도시 주변의 자연환경 보전, 도시민의 건전한 생활환경 확보 등의 목적을 달성하기 위하여 그 재량에 따라 개발제한구역의 훼손을 최소화하고 취락지구에 충전소가 설치됨으로써 발생하는 교통상 불편 등을 방지하고자 이 사건 배치계획 고시에 위와 같은 입지 범위를 정하는 이 사건 거리제한 규정을 둔 것이 개발제한구역법령의 위임 한계를 벗어난다거나 그 목적이나 근본 취지에 명백히 배치되거나 서로 모순된다고 보기 어렵고, 결국 이 사건 거리제한 규정은 상위 법령인 개발제한구역법령의 규정과 결합하여 효력을 가진다.\n  (1) 개발제한구역법령은 도시의 무질서한 확산을 방지하고 도시 주변의 자연환경을 보전하여 도시민의 건전한 생활환경을 확보하는 것을 목적으로 하므로 시장 등은 배치계획을 수립할 때에도 이러한 목적을 고려하여야 한다.\n  (2) 배치계획은 그 문언상 장소적 위치를 정하는 계획을 말하므로 ‘취락지구로부터 반경 200m 이내가 아닐 것’이라는 입지 범위를 정하는 것은 배치계획의 개념에 충분히 포섭된다.\n  (3) 배치계획에 관해서는 이를 수립하는 시장 등에게 재량이 인정되고, 개발제한구역법 시행규칙 제7조 제1호에 규정된 배치계획의 수립기준에 따르면 충전소는 개발제한구역의 훼손을 최소화할 수 있는 간선도로변에 해당 도로의 교통량과 시설 이용의 편리성 등을 고려하여 설치할 수 있도록 되어 있다.\n  다) 그리고 앞서 본 바와 같이 액화석유가스법이 개발제한구역법에 우선하여 배타적으로 적용되는 관계에 있지 않고, 각 허가 요건을 별도로 규정하고 있는 두 법률에 따른 허가를 각각 받아야 하는 이상, 원고가 액화석유가스법에 따른 액화석유가스 충전사업 허가를 받았다거나 이 사건 거리제한 규정이 액화석유가스법령에서 정한 시설기준과 다르다고 하여 이를 달리 볼 것도 아니다.\n  라) 그런데도 원심은 그 판시와 같은 이유로 이 사건 거리제한 규정은 상위 법령의 위임 범위를 벗어나 법규명령으로서 대외적 구속력을 인정할 수 없다는 전제에서 이에 근거한 ② 사유는 적법한 처분사유가 될 수 없다고 판단하였다.\n  이러한 원심판결에는 개발제한구역법령에 근거하여 시장 등이 수립하는 충전소 배치계획의 위임 한계 내지 효력에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 이 부분 상고이유 주장은 이유 있다. \n  다. 나머지 사유에 관하여\n  1) 관련 법리\n  개발제한구역법령이 위에서 본 바와 같이, 개발제한구역에서는 원칙적으로 그 지정 목적에 위배되는 건축물의 건축 등 행위를 허용하지 않으면서도, 개발제한구역의 주민이 공동으로 이용하는 시설 등의 경우 지정당시거주자 등에 한하여 시장 등의 허가를 받아 설치할 수 있도록 규정한 제도적인 취지는, 개발제한구역 내의 개발행위가 제한되는 결과 그곳의 주민들이 생활편의시설이 부족함으로 인하여 겪는 불편을 해소하고, 지나치게 많은 허가 신청자가 난립함으로 인한 행정상의 비능률을 방지함과 동시에, 개발제한구역 내에 장기간 거주하여 온 사람들의 불편을 어느 정도 보상하고자 함에 있다(대법원 2005. 7. 8. 선고 2005두3165 판결 참조).\n  2) 구체적 판단\n  우선 원고가 이 사건 우선순위자 신청 공고에 따른 우선순위 결정자가 아니라는 ① 사유는 이 사건 거부처분의 적법한 처분사유가 될 수 없다는 원심의 판단은 수긍하지 못할 바 아니다.\n  그러나 사안의 개요에서 보았듯이, 피고는 이 사건 거부처분을 하면서 ① 사유 외에 ③ 사유도 처분사유의 하나로 들었고, ③ 사유는 개발제한구역의 난개발을 방지하고 지정당시거주자와 10년 이상 거주자에게 동등한 기회를 부여하고자 향후 우선순위자를 추가로 모집하여 허가 여부를 결정할 것이라는 취지인데, 달리 ① 사유가 적법한 처분사유로 인정되지 않는다는 점을 들어 ③ 사유에 대한 판단을 생략할 수 있다는 사정도 발견되지 아니한다.\n  그렇다면 설령 ① 사유가 적법한 처분사유로 인정되지 않더라도, 마땅히 ③ 사유에 관하여 나아가 살펴 그 처분사유의 당부를 심리하고 적법한 처분사유로 인정되는지를 판단하여야 한다.\n  그런데도 원심은 위와 같은 ③ 사유의 당부를 심리·판단하지 아니하였다. 그러므로 원심판결에는 처분사유 중 일부에 관하여 심리를 다하지 아니하거나 판단을 누락한 위법이 있고, 이러한 위법은 판결 결과에 영향을 미쳤음이 분명하다. 이 점을 지적하는 취지가 포함된 이 부분 상고이유 주장은 이유 있다.\n  4. 결론\n  원심판결을 파기하고 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 마용주(재판장) 노태악 서경환(주심) 신숙희"
  },

    "판시사항": "[1] 구 독점규제 및 공정거래에 관한 법률 시행령 제5조 제5항 제2호에서 정한 ‘경쟁사업자와 거래하지 아니할 조건’은 시장지배적 사업자에 의하여 일방적·강제적으로 부과된 경우 외에 거래상대방과의 합의에 의하여 설정된 경우도 포함되는지 여부(적극) 및 이러한 법리는 구 독점규제 및 공정거래에 관한 법률 제23조 제1항 제5호 전단, 위 시행령 제36조 제1항 [별표 1의2] 제7호 (가)목에서 정한 불공정거래행위로서의 배타조건부 거래행위에 해당하는지를 판단할 때에도 마찬가지로 적용되는지 여부(적극)\n [2] 구 독점규제 및 공정거래에 관한 법률 제3조의2 제1항 제5호 전단의 ‘경쟁사업자를 배제하기 위하여 거래한 행위’의 부당성을 인정하기 위한 요건 및 부당성을 판단하는 기준",
    "판결요지": "[1] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법’이라고 한다) 제3조의2 제1항 제5호 전단은 시장지배적 사업자의 지위 남용행위로 ‘부당하게 경쟁사업자를 배제하기 위하여 거래하는 행위’를 규정하고, 구 독점규제 및 공정거래에 관한 법률 시행령(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법 시행령’이라고 한다) 제5조 제5항 제2호는 그 행위의 하나로 ‘부당하게 거래상대방이 경쟁사업자와 거래하지 아니할 것을 조건으로 그 거래상대방과 거래하는 경우’를 들고 있다. 여기서 ‘경쟁사업자와 거래하지 아니할 조건’은, 시장지배적 사업자에 의하여 일방적·강제적으로 부과된 경우에 한하지 않고 거래상대방과의 합의에 의하여 설정된 경우도 포함된다. 거래상대방이 시장지배적 사업자의 경쟁사업자와 거래하지 아니할 조건에 대하여 자발적으로 합의했다고 하더라도, 그로 인해 경쟁사업자의 해당 시장에 대한 진출이 방해됨으로써 경쟁제한적 효과에 대한 심사가 필요하다는 점은 해당 조건이 시장지배적 사업자에 의해 일방적·강제적으로 부과된 경우와 다르지 않기 때문이다. 이와 같은 법리는 구 공정거래법 제23조 제1항 제5호 전단, 구 공정거래법 시행령 제36조 제1항 [별표 1의2] 제7호 (가)목에서 정한 불공정거래행위로서의 배타조건부 거래행위에 해당하는지를 판단할 때에도 마찬가지로 적용된다. \n [2] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제3조의2 제1항 제5호 전단의 ‘경쟁사업자를 배제하기 위하여 거래한 행위’의 부당성은 독과점적 시장에서의 경쟁촉진이라는 입법 목적에 맞추어 해석해야 하므로, 시장지배적 사업자가 시장에서 독점을 유지·강화할 의도나 목적, 즉 시장에서 자유로운 경쟁을 제한함으로써 인위적으로 시장질서에 영향을 가하려는 의도나 목적을 갖고, 객관적으로도 그러한 경쟁제한의 효과가 생길 만한 우려가 있는 행위로 평가할 수 있는 행위를 하였을 때에 부당성을 인정할 수 있다. 이를 위해서는 그 행위가 상품의 가격 상승, 산출량 감소, 혁신 저해, 유력한 경쟁사업자의 수 감소, 다양성 감소 등과 같은 경쟁제한의 효과가 생길 만한 우려가 있는 행위로서 그에 대한 의도와 목적이 있었다는 점이 증명되어야 한다. 그 행위로 인하여 현실적으로 위와 같은 효과가 나타났음이 증명된 경우에는 그 행위 당시에 경쟁제한을 초래할 우려가 있었고 또한 그에 대한 의도나 목적이 있었음을 사실상 추정할 수 있다. 그러나 그러한 증명에 이르지 못한 경우에는 행위의 경위 및 동기, 행위의 태양, 관련시장의 특성 또는 유사품 및 인접시장의 존재 여부, 관련시장에서의 가격 및 산출량의 변화 가능성, 혁신 저해 및 다양성 감소 가능성 등 여러 사정을 종합적으로 고려하여 그 행위가 경쟁제한의 효과가 생길 만한 우려가 있는 행위로서 그에 대한 의도나 목적이 있었는지를 판단해야 한다. \n  다만 시장지배적 지위 남용행위로서의 배타조건부 거래행위는 거래상대방이 경쟁사업자와 거래하지 않을 것을 조건으로 거래상대방과 거래하는 경우이므로, 통상 그러한 행위 자체에 경쟁을 제한하려는 목적이 포함되어 있다고 볼 수 있는 경우가 많을 것이다.",
    "참조조문": "[1] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제3조의2 제1항 제5호(현행 제5조 제1항 제5호 참조), 제23조 제1항 제5호(현행 제45조 제1항 제7호, 제8호 참조), 구 독점규제 및 공정거래에 관한 법률 시행령(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것) 제5조 제5항 제2호(현행 제9조 제5항 제2호 참조), 제36조 제1항 [별표 1의2] 제7호 (가)목[현행 제52조 [별표 2] 제7호 (가)목 참조] / [2] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제3조의2 제1항 제5호(현행 제5조 제1항 제5호 참조)",
    "참조판례": "[1][2] 대법원 2019. 1. 31. 선고 2013두14726 판결(공2019상, 643)",
    "판례내용": "【원고, 상고인 겸 피상고인】 ○○○ 주식회사 (소송대리인 변호사 안재홍 외 1인)\n【피고, 피상고인 겸 상고인】 공정거래위원회 (소송대리인 법무법인(유한) 지평 담당변호사 김지홍 외 2인)\n【원심판결】 서울고법 2020. 10. 15. 선고 2019누41159 판결\n【주    문】\n  원심판결의 원심판시 별지 1 시정명령 및 과징금납부명령 중 제1의 나항, 제3항, 제5의 나항 기재 시정명령, 제6항 기재 시정명령 중 재재보험(원고의 국내운항 일반항공보험 관련 해외출재특약 포함)에 관한 부분 및 제7항 기재 과징금납부명령에 관한 피고 패소 부분을 파기하고, 이 부분 사건을 서울고등법원에 환송한다.  원고의 상고 및 피고의 나머지 상고를 각 기각한다. \n\n【이    유】  상고이유를 판단한다. \n  1. 사건의 개요 \n  원심판결의 이유와 기록에 의하면 다음과 같은 사실이 인정된다. \n  가. 원고의 지위와 시장에 관하여\n  1) 원고는 구 「독점규제 및 공정거래에 관한 법률」(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법’이라고 한다) 제2조 제1호에 의한 사업자로서 재보험 사업 등을 목적으로 한다. \n  2) 기업성 보험이란 가계성 일반손해보험과 자동차보험을 제외한 일반손해보험을 말한다(보험업감독규정 제1-2조 제20호). 항공기의 물적 손해 및 항공기의 소유, 관리, 운영과 관련하여 발생하는 각종 위험을 담보하는 기업성 보험인 항공보험은 ‘기단항공보험’과 ‘일반항공보험’으로 구분된다. 기단항공이란 대형 항공사에 소속되어 여객이나 화물을 운송하는 대형 항공기를 말하고, 일반항공이란 주로 헬기와 같은 회전익 항공기와 고정익 항공기 중 승객이나 화물운송을 전문으로 하지 않는 중소형 항공기를 말한다. \n  3) 항공보험은 피보험가액이 매우 높아서 그 위험을 인수한 보험사(이를 이하 ‘원수보험사’라고 하고, 원수보험사가 위험을 인수하는 계약을 ‘원수보험계약’이라고 한다)는 자신이 인수한 위험 중 스스로 감당할 수 있는 위험만 보유하고, 이를 초과하는 위험은 재보험사에 전가하기 위해 재보험계약을 체결한다[이와 같이 위험의 일부를 전가하는 것을 ‘출재(出再)’라고 하고, 재보험사가 위험을 인수하는 것을 ‘수재(受再)’라고 한다]. \n  4) 재보험 거래는 크게 ‘특약재보험’과 ‘임의재보험’으로 분류된다. 특약재보험은 재보험사에 출재하는 계약의 범위를 사전에 정하고 일정한 기간 동안(통상 1년) 그 범위에 속하는 원수보험계약 전부에 대하여 당사자들 사이에 합의된 재보험 계약조건에 따라 자동적으로 재보험 거래가 이루어지는 방식이다. 이와 대비되는 임의재보험이란, 원수보험사가 체결한 개별 원수보험계약별로 재보험계약이 체결되는 방식이다. \n  특약재보험은 하나의 원수보험사가 복수의 재보험사와 거래하는 경우가 많다. 원수보험사가 인수한 위험을 여러 재보험사에 출재하는 것이 위험분산 차원에서 유리하기 때문이다. 이처럼 원수보험사가 자신이 출재하고자 하는 위험을 여러 재보험사에 나누어 출재하는 과정을 이른바 ‘재보험 플레이싱(placing)’이라고 한다.   \n  5) 보험업감독규정 제7-73조 제2항 본문에 의하면, 원수보험사가 보험계약을 체결하면서 보험요율을 정할 때에는 과거 경험통계 또는 객관성 있는 국내외 통계자료 등을 기초로 하거나 보험요율 산출기관이 제공하는 참조순보험요율을 참고하여 이를 산출할 수 있다. 이와 같이 통계를 기반으로 산출된 보험요율을 ‘통계요율’이라고 한다. \n  그런데 일부 항공보험 등의 기업성 보험은 원수보험사가 보험요율을 산출할 통계자료가 존재하지 않아 통계요율을 사용할 수 없다. 이를 위해 보험업감독규정 제7-73조 제2항 단서 제1호는 기업성 보험의 경우 통계요율 이외의 방법으로 보험요율을 정할 수 있다고 규정하고 있다. 원수보험사가 통계요율 이외의 방법으로 보험요율을 정하는 대표적인 방식은, 그 원수보험의 위험 중 일부를 인수할 재보험사로부터 그 원수보험에 적용될 보험요율을 제공받는 것이다(위와 같이 재보험사로부터 제공받는 보험요율을 ‘협의요율’이라고 하고, 원수보험사가 재보험사로부터 협의요율을 제공받는 행위를 ‘구득’이라고 한다). \n  6) 우리나라는 과거에 항공보험에서 관계 법령이나 행정기관의 관여에 기반한 이른바 ‘국내우선출재제도’와 ‘보험요율구득제도’를 시행하고 있었다. 국내우선출재제도란 국내 손해보험사가 재보험을 통해 위험을 출재하고자 할 때 이를 국내 보험사에 우선 출재하도록 한 제도이다. 보험요율구득제도란 항공보험과 같은 특수한 기업성 보험에 대하여는 원수보험사로 하여금 반드시 재보험사인 원고로부터 보험요율을 구득할 의무를 부과하는 제도다. 원고는 1962년 제정된 구 대한손해재보험공사법(1977. 12. 31. 법률 제3043호로 폐지)에 의하여 손해보험의 재보험업 등을 목적으로 설립되었고(당시 명칭은 ‘대한손해재보험공사’였다), 1978년 민영화되어 현재에 이르렀다. 우리나라의 전업 재보험사로는 원고가 유일하다. 국내우선출재제도와 보험요율구득제도를 통해 국내운항 일반항공보험의 재보험시장에서 원고의 독점적 지위가 보장되었다. \n  항공보험에서 국내우선출재제도와 보험요율구득제도는 1993. 4.경 폐지되었으나 국내운항 일반항공보험의 재보험시장에서 원고가 차지하는 수재액의 비중은 90%가량으로 여전히 매우 높다. 원고는 국내운항 일반항공보험의 재보험계약 대부분을 체결한 후 인수한 위험 중 일부를 다시 국내 원수보험사들과 해외 재보험사들에 재재보험계약의 형태로 재출재함으로써 스스로 부담하는 위험을 분산시키고 있다.  \n  나. 피고가 처분대상으로 삼은 원고의 행위\n  1) 원고는 1999년경부터 2017년경까지 매년 국내운항 일반항공보험을 특약재보험의 형태로 출재하려는 국내 원수보험사들과 ‘항공보험 재보험 및 재재보험 특약’(이하 ‘이 사건 특약’이라고 한다)을 체결하였다.  \n  2) 이 사건 특약 제1조, 제3조는 국내운항 일반항공보험을 인수하는 국내 원수보험사가 원고와 특약재보험계약을 체결하고자 할 때 그 원수보험사가 1년간 체결하는 국내운항 일반항공보험 전건(全件)에 대하여, 원수보험사가 보유하고자 하는 자사보유액을 초과하는 위험의 전량(全量)을 원고에게 출재하도록 하고 있다(이하 위험 전량의 출재에 관한 조항을 ‘이 사건 전량출재의무 조항’이라고 한다). \n  3) 이 사건 특약 제2조는 원고와 이 사건 특약을 체결한 원수보험사가 이 사건 특약 적용 대상인 국내운항 일반항공보험 계약을 체결하고자 할 때 그 보험요율에 관하여 원고와 협의하도록 규정하고 있다(이하 ‘이 사건 요율구득의무 조항’이라고 한다). \n  4) 이 사건 특약 제4조는 원고에 대하여, 이 사건 특약을 통해 수재한 위험 중 일부를 위 조항에 동의한 국내 원수보험사들 사이에 사전에 정해진 비율에 따라 재재보험계약의 형태로 재출재할 의무를 부과하고 있다(이를 이하 ‘이 사건 재재보험특약 조항’이라고 한다). 이 사건 재재보험특약 조항에 따라 원고로부터 재재보험계약을 통해 위험을 재인수하는 국내 원수보험사는, 해당 재재보험계약의 원수보험사와는 다른 국내 원수보험사이다. 이 사건 재재보험특약 조항에 동의한 국내 원수보험사들은, 원고가 이 사건 특약을 통해 수재한 위험 중 일부를 다시 재재보험특약 형태로 수재함으로써 수수료를 받을 수 있다. \n  5) 원고는 이 사건 특약을 통해 인수한 위험 중 스스로 부담하고자 하는 위험을 초과하는 부분 중 일부를 이 사건 재재보험특약 조항에 따라 국내 원수보험사에 재출재한 다음 그 나머지를 해외 재보험사에 재출재하는 형태로 위험을 분산한다. 원고는 이를 위해 1990년부터 해외 재보험사들을 협력사로 구성하여 이들과 재재보험특약을 체결하고 있다(이와 같이 원고가 해외 재보험사들과 협력사 방식으로 국내운항 일반항공보험에 관한 재재보험특약을 체결하는 행위를 이하 ‘이 사건 패널구성행위’라고 한다). \n  6) 이 사건 특약을 체결한 국내 일부 원수보험사가 국내운항 일반항공보험을 체결할 때 원고로부터 보험요율을 구득하지 않고 해외 재보험사로부터 보험요율을 구득하여 입찰공고된 보험계약을 낙찰받거나 계약 체결을 시도하는 사례가 발생하였다. 이에 원고는 2006년경부터 해당 국내 원수보험사들에 이 사건 특약 위반을 이유로 제재조치에 나아갈 수 있다는 취지로 항의하였고, 보험요율을 제공한 해외 재보험사에 대하여도 국내 원수보험사와의 거래 중단을 요구하기도 하였다(원고의 이 같은 행위를 이하 ‘이 사건 방어행위’라고 한다). \n  다. 피고의 처분의 내용 \n  1) 피고는 관련시장을 ‘국내운항 일반항공보험 재보험시장’으로 보고 원고가 위 관련시장에서 시장지배적 지위를 가진 사업자에 해당한다고 보았다. \n  2) 피고는, 원고가 이 사건 전량출재의무 조항, 이 사건 요율구득의무 조항, 이 사건 재재보험특약 조항을 통해 이른바 ‘특약 체제’를 형성하여 경쟁사업자인 해외 재보험사를 국내운항 일반항공보험 재보험시장에서 배제하였고, 잠재적 경쟁사업자인 해외 재보험사에 대한 이 사건 패널구성행위와 특약 체제 이탈 행위에 대한 이 사건 방어행위를 통해 위 특약 체제의 배타성과 구속력을 강화하였다고 보았다. \n  3) 피고는, 원고가 위와 같은 일련의 행위를 통해 시장지배적 사업자로서 부당하게 경쟁사업자를 배제하여 구 공정거래법 제3조의2 제1항 제5호 전단, 구 「독점규제 및 공정거래에 관한 법률 시행령」(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법 시행령’이라고 한다) 제5조 제5항 제2호를 위반함과 동시에 원고가 부당하게 거래상대방으로 하여금 자신의 경쟁사업자와 거래하지 아니하는 조건으로 거래함으로써 구 공정거래법 제23조 제1항 제5호 전단, 구 공정거래법 시행령 제36조 제1항 [별표 1의2] 제7호 (가)목을 위반하였다고 보았다. 이에 피고는 원고에 대하여 원심판시 별지 1 기재와 같은 시정명령(이하 ‘이 사건 시정명령’이라고 한다)과 과징금 78억 6,500만 원을 부과하는 명령(이하 ‘이 사건 과징금부과 처분’이라고 한다)을 하였다. \n  2. 관련 상품시장에 관하여\n  원심은, 대형항공사가 운영하는 대형 항공기를 보험대상으로 하는 기단항공보험과 주로 공공기관 등이 운용하는 헬기와 소형 항공기를 보험대상으로 하는 일반항공보험은 그 시장의 특성이 뚜렷이 구분되고, 원수보험사와 재보험사도 위 두 시장을 별개로 인식하고 있어서 기단항공보험과 일반항공보험 사이에 대체성이 있다고 보기 어려우며, 헬기와 소형 항공기의 경우 그 운항 지역에 따라 위험의 정도가 다르기 때문에 보험 상품의 특징에도 큰 차이가 있다는 이유로, 피고가 관련시장을 ‘국내운항 일반항공보험 재보험시장’으로 확정한 것은 타당하고, 원고가 위 관련시장에서 갖는 점유율 등에 비추어 볼 때 원고가 해당 시장에서 시장지배적 지위를 갖는다고 보았다. \n  관련 법리와 기록에 비추어 살펴보면, 이와 같은 원심의 판단은 정당하고, 거기에 원고가 제4 상고이유에서 주장하는 것과 같이 시장지배적 사업자에 관한 법리를 오해한 잘못이 없다.  \n  3. 이 사건 요율구득의무 조항의 해석에 관하여\n  원심은, 이 사건 요율구득의무 조항의 문언상 국내 원수보험사가 국내운항 일반항공보험을 인수할 때 그 보험요율을 사전에 원고와 ‘협의’할 의무만을 부과하고 있기는 하나, 원고와 국내 원수보험사들의 행위, 인식 등에 비추어 볼 때 이 사건 요율구득의무 조항은 국내 원수보험사에 대하여 보험요율을 단순히 원고와 협의할 것을 넘어 원고가 제공하는 보험요율을 구득하고 사용할 의무를 부과하는 조항으로 해석된다고 판단하였다. \n  관련 법리와 기록에 비추어 살펴보면, 이와 같은 원심의 판단은 정당하고, 거기에 원고가 제1 상고이유에서 주장하는 것과 같이 이 사건 요율구득의무 조항의 해석에 관한 법리오해 등의 잘못이 있다고 볼 수 없다. \n  4. 배타조건부 거래행위에 해당하는지에 관하여\n  가. 구 공정거래법 제3조의2 제1항 제5호 전단은 시장지배적 사업자의 지위 남용행위로 ‘부당하게 경쟁사업자를 배제하기 위하여 거래하는 행위’를 규정하고, 구 공정거래법 시행령 제5조 제5항 제2호는 그 행위의 하나로 ‘부당하게 거래상대방이 경쟁사업자와 거래하지 아니할 것을 조건으로 그 거래상대방과 거래하는 경우’를 들고 있다. 여기서 ‘경쟁사업자와 거래하지 아니할 조건’은, 시장지배적 사업자에 의하여 일방적·강제적으로 부과된 경우에 한하지 않고 거래상대방과의 합의에 의하여 설정된 경우도 포함된다(대법원 2019. 1. 31. 선고 2013두14726 판결 참조). 거래상대방이 시장지배적 사업자의 경쟁사업자와 거래하지 아니할 조건에 대하여 자발적으로 합의하였다고 하더라도, 그로 인해 경쟁사업자의 해당 시장에 대한 진출이 방해됨으로써 경쟁제한적 효과에 대한 심사가 필요하다는 점은 해당 조건이 시장지배적 사업자에 의해 일방적·강제적으로 부과된 경우와 다르지 않기 때문이다. 이와 같은 법리는 구 공정거래법 제23조 제1항 제5호 전단, 구 공정거래법 시행령 제36조 제1항 [별표 1의2] 제7호 (가)목에서 정한 불공정거래행위로서의 배타조건부 거래행위에 해당하는지를 판단할 때에도 마찬가지로 적용된다. \n  나. 그럼에도 원심은, 이 사건 전량출재의무 조항과 2006년 이 사건 방어행위가 시작되기 전의 이 사건 요율구득의무 조항의 경우, 국내 원수보험사들이 사무처리의 편의 등을 위하여 원고와 위 각 조항의 체결을 선호하고 있었고, 달리 원고가 그 거래상대방인 국내 원수보험사들에 대하여 위 각 조항의 체결을 강제하였다고 보기 어렵다는 이유로, 구 공정거래법 제3조의2 제1항 제5호 전단, 제23조 제1항 제5호 전단에서 금지한 이른바 ‘배타조건부 거래행위’에 해당하지 않는다고 판단하였다. \n  다. 이와 같은 원심의 판단은 구 공정거래법 제3조의2 제1항 제5호 전단, 제23조 제1항 제5호 전단에서 정한 배타조건부 거래행위가 성립하기 위해서는 사업자가 거래상대방에 대하여 경쟁사업자와 거래하지 않을 조건을 일방적·강제적으로 부과하여야 하고, 거래상대방이 해당 조건에 자발적으로 합의한 경우는 배타조건부 거래행위에 해당하지 않는다는 전제에 선 것이다. 그러나 이러한 전제는 앞서 본 바와 같은 이유로 타당하지 않기 때문에 원심의 이러한 판단에는 시장지배적 지위 남용행위 또는 불공정거래행위로서 배타조건부 거래행위의 성립 요건에 관한 법리를 오해하여 판결의 결과에 영향을 미친 잘못이 있다. \n  이 점을 지적하면서 이 사건 전량출재의무 조항과 2006년 이 사건 방어행위 전의 이 사건 요율구득의무 조항도 배타조건부 거래행위에 해당한다고 주장하는 피고의 제1, 4 상고이유는 이유 있다. 반대로 구 공정거래법 제3조의2 제1항 제5호 전단, 제23조 제1항 제5호 전단의 배타조건부 거래행위가 성립하기 위해서는 강제성이 필요하다는 전제 아래 오히려 2006년 이후의 이 사건 요율구득의무 조항과 이 사건 방어행위 또한 배타조건부 거래행위에 해당하지 않는다는 취지의 원고의 제2 상고이유는 받아들일 수 없다.   \n  5. 경쟁제한성에 관하여  \n  가. 구 공정거래법 제3조의2 제1항 제5호 전단의 ‘경쟁사업자를 배제하기 위하여 거래한 행위’의 부당성은 독과점적 시장에서의 경쟁촉진이라는 입법 목적에 맞추어 해석하여야 하므로, 시장지배적 사업자가 시장에서 독점을 유지·강화할 의도나 목적, 즉 시장에서 자유로운 경쟁을 제한함으로써 인위적으로 시장질서에 영향을 가하려는 의도나 목적을 갖고, 객관적으로도 그러한 경쟁제한의 효과가 생길 만한 우려가 있는 행위로 평가할 수 있는 행위를 하였을 때에 부당성을 인정할 수 있다. 이를 위해서는 그 행위가 상품의 가격 상승, 산출량 감소, 혁신 저해, 유력한 경쟁사업자의 수의 감소, 다양성 감소 등과 같은 경쟁제한의 효과가 생길 만한 우려가 있는 행위로서 그에 대한 의도와 목적이 있었다는 점이 증명되어야 한다. 그 행위로 인하여 현실적으로 위와 같은 효과가 나타났음이 증명된 경우에는 그 행위 당시에 경쟁제한을 초래할 우려가 있었고 또한 그에 대한 의도나 목적이 있었음을 사실상 추정할 수 있다. 그러나 그러한 증명에 이르지 못한 경우에는 행위의 경위 및 동기, 행위의 태양, 관련시장의 특성 또는 유사품 및 인접시장의 존재 여부, 관련시장에서의 가격 및 산출량의 변화 가능성, 혁신 저해 및 다양성 감소 가능성 등 여러 사정을 종합적으로 고려하여 그 행위가 경쟁제한의 효과가 생길 만한 우려가 있는 행위로서 그에 대한 의도나 목적이 있었는지를 판단하여야 한다. \n다만 시장지배적 지위 남용행위로서의 배타조건부 거래행위는 거래상대방이 경쟁사업자와 거래하지 아니할 것을 조건으로 그 거래상대방과 거래하는 경우이므로, 통상 그러한 행위 자체에 경쟁을 제한하려는 목적이 포함되어 있다고 볼 수 있는 경우가 많을 것이다(대법원 2019. 1. 31. 선고 2013두14726 판결 등 참조). \n  나. 원심은 위와 같은 법리를 전제로 그 채택 증거를 종합하여, 2006년 이후의 이 사건 요율구득의무 조항과 이 사건 방어행위의 경우 원고가 경쟁사업자인 해외 재보험사를 국내운항 일반항공보험 재보험시장에서 배제하고자 하는 의도가 인정되고, 그 행위가 지속된 기간이 길며 그로 인한 봉쇄효과도 크다는 이유 등을 근거로 구 공정거래법 제3조의2 제1항 제5호 전단에서 정한 배타조건부 거래행위로서 경쟁제한성이 인정된다고 판단하였다. \n  다. 이 사건 전량출재의무 조항과 2006년 이 사건 방어행위 전의 이 사건 요율구득의무 조항이 배타조건부 거래행위에 해당하지 않는다고 본 원심의 판단은 잘못이라고 하겠으나, 관련 법리와 기록에 비추어 살펴보면, 원심이 배타조건부 거래행위에 해당한다고 본 2006년 이후의 이 사건 요율구득의무 조항과 이 사건 방어행위에 경쟁제한성을 인정한 것은 정당하고, 거기에 원고가 제3 상고이유에서 주장하는 것과 같이 경쟁제한성에 관한 법리를 오해한 잘못이 있다고 볼 수 없다. \n  6. 원고의 행위를 일체로 판단할 필요성에 관하여 \n  가. 이 사건 전량출재의무 조항은 국내 원수보험사로 하여금 국내운항 일반항공보험의 위험을 특약재보험계약을 통해 재보험사에 출재하고자 할 때 원수보험사 스스로 부담하고자 하는 위험을 초과한 전량을 오로지 원고에게 출재하도록 함으로써, 원수보험사로 하여금 여러 재보험회사에 위험을 분산하여 출재하는 재보험 플레이싱을 할 수 있는 가능성을 차단한다. 그 결과 국내 원수보험사들은 국내운항 일반항공보험 계약에 관하여 오로지 원고하고만 재보험특약을 체결할 수 있게 되었다. 이 사건 요율구득의무 조항은 이를 전제로 국내 원수보험사들로 하여금 원고로부터만 보험요율을 구득할 수 있도록 정하여 국내운항 일반항공보험 계약에서 원고의 이익을 보호하는 역할을 한다. \n  이 사건 전량출재의무 조항과 이 사건 요율구득의무 조항은 우리나라가 1993. 4.경까지 국내운항 일반항공보험 재보험시장에서 원고에게 독점적 지위를 보장하기 위해 시행하던 국내우선출재제도와 협의요율구득제도에 대응하는 것으로서 원고가 특약 체제를 통해 경쟁사업자를 배제하고자 하였던 핵심을 구성한다. 한편 이 사건 방어행위는 원고가 이 사건 요율구득의무 조항을 위반한 원수보험사 등을 상대로 항의 등을 한 것으로, 특약 체제가 현실에서 구속력을 발휘할 수 있도록 담보하려는 행위이다.  \n  나. 이 사건 재재보험특약 조항은 원고의 특약 체제에 참여하는 원수보험사가 증가할 수록 그 원수보험사가 재재보험을 통해 수취할 수 있는 이익을 증대시키는 기능을 한다. 그 결과 국내 원수보험사로 하여금 시장지배적 사업자인 원고가 제안하는 특약 체제로부터 이탈하지 않고 이에 참여하도록 하고, 국내 원수보험사 상호 간에는 특약 체제로부터 이탈하지 않도록 감시하고 독려하는 유인을 제공한다. 그 결과 이 사건 재재보험특약 조항 또한 원고의 경쟁사업자가 국내운항 일반항공보험의 재보험시장에 진입하고자 하는 시도에 대한 장벽으로 기능한다. \n  나아가, 원고는 이 사건 패널구성행위를 통해 잠재적 경쟁사업자인 해외 재보험사들을 협력사로 구성하여 재재보험특약을 체결함으로써 이들이 국내운항 일반항공보험 시장에 재보험 사업자로 진출할 유인을 감소시킨다. 그 결과 이 사건 패널구성행위는 국내 원수보험사가 원고의 경쟁사업자인 해외 재보험사와 국내운항 일반항공보험의 재보험특약을 체결하고자 하는 시도에 대한 장벽으로 기능한다. \n  이처럼 이 사건 재재보험특약 조항과 이 사건 패널구성행위는 국내운항 일반항공보험 재보험시장에서 시장지배적 사업자인 원고가 잠재적 경쟁사업자인 해외 재보험사들의 시장 진출을 어렵게 하고자 고안한 이 사건 전량출재의무 조항과 이 사건 요율구득의무 조항의 배타적 성격을 강화하는 역할을 한다. \n  다. 그렇다면 이 사건 전량출재의무 조항, 이 사건 요율구득의무 조항, 이 사건 재재보험특약 조항, 이 사건 패널구성행위, 이 사건 방어행위는 모두 원고가 시장지배적 사업자로서 경쟁사업자를 배제하기 위한 단일한 의사 아래 이루어진 행위라고 할 것이므로, 위 일련의 행위들을 종합하여 원고가 구 공정거래법 제3조의2 제1항 제5호 전단, 제23조 제1항 제5호 전단에서 금지한 부당한 배타조건부 거래행위를 하였는지를 판단하여야 한다.  \n  라. 그럼에도 원심은 원고의 위와 같은 행위들을 종합하여 일체로 검토함이 없이 개개로 나누어서 독립적으로 배타조건부 거래행위에 해당하는지를 검토하였고, 그 결과 이 사건 재재보험특약 조항과 이 사건 패널구성행위가 배타조건부 거래행위에 해당하지 않는다고 판단하였다. 이 같은 원심의 판단에는 시장지배적 사업자가 경쟁사업자를 배제하기 위해 서로 유기적으로 연결된 행위를 하였을 때 그 시장지배적 사업자가 부당한 배타조건부 거래행위를 하였는지 판단하는 방식에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 피고의 제2 상고이유는 이유 있다. \n  7. 파기의 범위에 관하여  \n  가. 원심은 이 사건 전량출재의무 조항, 이 사건 재재보험특약 조항 및 이 사건 패널구성행위가 구 공정거래법 제3조의2 제1항 제5호 전단, 제23조 제1항 제5호 전단에서 금지하는 배타조건부 거래행위에 해당하지 않는다는 이유로 이 사건 시정명령 제1의 나항 및 제5의 나항 부분(이 사건 전량출재의무 조항 관련), 제3항 부분(이 사건 재재보험특약 조항 관련), 제6항 중 재재보험(원고의 국내운항 일반항공보험 관련 해외출재특약 포함)에 관한 부분(이 사건 재재보험특약 조항 및 이 사건 패널구성행위 관련)을 취소하였다. \n  또한, 원심은 2006년 이 사건 방어행위 전의 이 사건 요율구득의무 조항이 배타조건부 거래행위에 해당하지 않는다는 이유 등으로 피고가 부과한 과징금 또한 다시 산정되어야 한다고 보아 이 사건 과징금부과 처분 또한 취소하였다. \n  그러나 앞서 본 것과 같이 이 사건 전량출재의무 조항, 2006년 이 사건 방어행위 전의 이 사건 요율구득의무 조항, 이 사건 재재보험특약 조항 및 이 사건 패널구성행위가 구 공정거래법 제3조의2 제1항 제5항 전단, 제23조 제1항 제5호 전단에서 금지하는 부당한 배타조건부 거래행위에 해당하지 않는다고 본 원심판단에 법리오해 등의 잘못이 있다. 따라서 이 사건 시정명령 중 제1의 나항, 제3항, 제5의 나항, 제6항 중 재재보험(원고의 국내운항 일반항공보험 관련 해외출재특약 포함)에 관한 부분 및 이 사건 과징금부과 처분에 관한 피고 패소 부분은 파기되어야 한다. \n  나. 피고는 이 사건 시정명령 중 제4항을 통해 원고에 대하여 국내 손해보험사들이 국내운항 일반항공보험을 인수하기 위해 원고로부터 순보험요율을 구득하는 경우 이를 제공하는 것을 거절해서는 안 된다는 의무를 부과하였다. 원심은 국내 손해보험사가 원고에 대하여 순보험요율의 제공을 요청한 적도 없고, 순보험요율을 제공하는 것이 재보험사의 통상적인 관행이라고 보기도 어려운 이상 이러한 행위를 시정할 필요성이 없다는 등의 이유로 이 사건 시정명령 중 제4항도 위법하다고 보아 이를 취소하였다. 기록에 비추어 살펴보면 원심의 판단은 정당하므로, 이를 다투는 피고의 상고는 받아들일 수 없다. \n  8. 결론\n  피고의 나머지 상고이유에 관한 판단을 생략한 채 이 사건 시정명령 중 제1의 나항, 제3항, 제5의 나항, 제6항 중 재재보험(원고의 국내운항 일반항공보험 관련 해외출재특약 포함)에 관한 부분 및 이 사건 과징금부과 처분에 관한 피고 패소 부분을 파기하고 이 부분을 다시 심리·판단하도록 원심법원에 환송하며, 원고의 상고 및 피고의 나머지 상고를 각 기각하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 엄상필(재판장) 오경미(주심) 박영재"

    "판시사항": "[1] 사립학교 교원의 임용권자가 구 사립학교법 제66조의2 제1항에 따른 징계의결 내용 사전통보 의무를 위반하여 관할청에 징계의결 내용을 통보하지 않은 채 징계처분을 한 경우, 징계절차를 위반한 하자가 있는지 여부(적극) / 임용권자가 위 사전통보 의무를 위반하여 징계처분을 한 후에 관할청에 징계의결 내용을 사후적으로 통보한 경우, 징계처분 이후라도 관할청이 재심의 요구를 할 수 있는지 여부(적극) / 임용권자가 위 사전통보 의무를 위반하여 징계처분을 한 후 관할청에 징계의결 내용을 사후 통보하고 관할청이 재심의 요구를 함에 따라 교원징계위원회에서 선행 징계처분과 다른 내용의 징계의결을 한 경우, 임용권자가 스스로 선행 징계처분을 취소하고 후행 징계처분을 할 수 있는지 여부(적극) / 선행 징계처분이 확정되어 집행이 종료된 경우, 달리 보아야 하는지 여부(소극) / 이때 후행 징계처분이 이중징계에 해당하는지 여부(소극)\n [2] 교직원인 피징계자에게 징계권자가 한 징계처분이 위법한 경우 / 교직원에 대한 징계처분이 사회통념상 현저하게 타당성을 잃었는지 판단하는 기준 / 사립학교 교원의 임용권자가 구 사립학교법 제66조의2 제1항에 따른 사전통보 의무를 이행하지 않은 채 선행 징계처분을 한 뒤 관할청의 사후 재심의 요구에 따라 동일한 징계혐의사실에 대해 다른 내용의 후행 징계처분을 하는 경우, 선행 징계처분 취소와 후행 징계처분이 재량권을 일탈·남용한 위법한 처분인지 판단할 때 고려할 사항",
    "판결요지": "[1] 구 사립학교법(2020. 12. 22. 법률 제17659호로 개정되기 전의 것, 이하 같다)의 목적, 구 사립학교법 제54조 제3항, 제66조의2에 따른 관할청의 징계요구, 임용권자의 사전통보 및 관할청의 재심의 요구의 내용과 취지 등 여러 사정을 종합하면, 임용권자의 관할청에 대한 징계의결 내용 사전통보 의무를 규정한 구 사립학교법 제66조의2 제1항은 단순한 훈시규정이 아니므로, 임용권자가 이 조항을 위반하여 관할청에 징계의결 내용을 통보하지 아니한 채 행한 징계처분에는 구 사립학교법에서 정한 징계절차를 위반한 하자가 있다. \n  한편 구 사립학교법 제66조의2 제1항은 임용권자의 관할청에 대한 징계의결 내용 통보 및 관할청의 재심의 요구가 그 징계처분을 하기 ‘전’에 이루어지도록 규정하고 있다. 그러나 임용권자가 구 사립학교법 제66조의2 제1항에 따른 징계의결 내용 사전통보 의무를 위반하여 징계처분을 한 후에 관할청에 징계의결 내용을 사후적으로 통보한 경우에는 관할청 역시 징계처분 이후라고 하더라도 재심의 요구를 할 수 있다. 이 경우 임용권자는 구 사립학교법 제66조의2 제3항에 따라 해당 교원징계위원회에 재심의를 요구하여, 그 결과를 관할청에 통보할 의무가 있다.\n  이처럼 임용권자가 사전통보 의무를 위반한 채 징계처분을 한 후에 관할청에 징계의결 내용을 사후적으로 통보하고 관할청이 사후적으로 재심의 요구를 함에 따라 교원징계위원회에서 선행 징계처분과 다른 내용의 징계의결을 하였을 경우, 선행 징계처분의 처리 및 재심의 요구에 따른 후행 징계의결에 기초한 징계처분의 효력이 문제 된다. 이때 임용권자는 선행 징계처분에 구 사립학교법 제66조의2 제1항에 따른 징계절차의 잘못이 있음을 들어 스스로 그 징계처분을 취소하고, 새로운 후행 징계처분을 할 수 있고, 선행 징계처분이 확정되어 그 집행이 종료되었다는 사정만으로 달리 볼 것은 아니다. 이처럼 선행 징계처분을 취소하면 선행 징계처분은 소급하여 효력을 잃게 되므로, 선행 징계처분과 동일한 징계혐의사실에 대해 내려진 후행 징계처분이 이중징계라고 할 수 없다. \n [2] 교직원인 피징계자에게 사립학교법상의 징계사유가 있어 징계처분을 하는 경우 그 처분의 내용은 징계권자의 재량에 맡겨진 것이나, 징계권자가 한 징계처분이 사회통념상 현저하게 타당성을 잃어 징계권자에게 맡겨진 재량권을 일탈·남용한 것이라고 인정되는 경우 그 처분은 위법하다. 교직원에 대한 징계처분이 사회통념상 현저하게 타당성을 잃었다고 하려면, 징계 원인이 된 비위사실의 내용과 성질, 징계로 달성하려는 목적, 징계 양정 기준 등 여러 요소를 종합하여 판단할 때 징계 내용이 객관적으로 명백히 부당하다고 인정할 수 있는 경우라야 한다. \n  임용권자가 구 사립학교법(2020. 12. 22. 법률 제17659호로 개정되기 전의 것) 제66조의2 제1항에 따른 사전통보 의무를 이행하지 않은 채 선행 징계처분을 한 뒤 관할청의 사후적인 재심의 요구에 따라 동일한 징계혐의사실에 대해 다른 내용으로 후행 징계처분을 하게 되는 경우 선행 징계처분 취소와 그 후에 이루어진 후행 징계처분이 재량권을 일탈·남용한 위법한 처분인지를 판단하는 때에는, 선행 징계처분과 후행 징계처분의 내용, 선행 징계처분 취소 및 후행 징계처분의 경위, 선행 징계처분과 후행 징계처분 사이의 시간적 간격, 선행 징계처분의 확정 및 집행 여부, 선행 징계처분에 대한 피징계자인 교원의 신뢰 보호 필요성 등의 사정도 함께 고려해야 한다.",
    "참조조문": "[1] 구 사립학교법(2020. 12. 22. 법률 제17659호로 개정되기 전의 것) 제1조, 제54조 제3항, 제66조의2 / [2] 구 사립학교법(2020. 12. 22. 법률 제17659호로 개정되기 전의 것) 제61조, 제66조의2 제1항, 행정소송법 제27조",
    "참조판례": "[1] 대법원 1994. 9. 30. 선고 93다26496 판결(공1994하, 2820), 대법원 2010. 6. 10. 선고 2009다97611 판결(공2010하, 1347), 대법원 2015. 4. 9. 선고 2012다79156, 79163 판결 / [2] 대법원 2004. 6. 25. 선고 2002다51555 판결(공2004하, 1221)",
    "판례내용": "【원고, 상고인】 원고 (소송대리인 법무법인(유한) 엘케이비앤파트너스 담당변호사 장순욱)\n【피고, 피상고인】 교원소청심사위원회\n【피고보조참가인】 학교법인 ○○○재단\n【피고참가행정청】 인천광역시교육감\n【원심판결】 서울고법 2023. 6. 21. 선고 2022누48440 판결\n【주    문】\n  상고를 기각한다.  상고비용은 각 참가로 인한 부분을 포함하여 모두 원고가 부담한다. \n\n【이    유】  상고이유를 판단한다. \n  1. 사안의 개요\n  원심판결의 이유와 기록에 따르면 다음과 같은 사실을 알 수 있다.  \n  가. 원고는 1990. 10. 18. 피고보조참가인(이하 ‘참가인’이라 한다)이 운영하는 △△△여자중학교(2014. 3.경 □□중학교로 교명이 변경되었다. 이하 ‘이 사건 학교’라 한다)에 임용되어 근무하였다. \n  나. 피고참가행정청(이하 ‘참가행정청’이라 한다)은 이 사건 학교의 이른바 ‘스쿨미투’에 대하여 전수조사를 실시한 후 2019. 12. 6. 참가인에게, 원고가 학생들에게 성적 수치심과 불쾌감을 주는 발언을 하여 교원으로서의 품위유지 의무를 위반하였다는 이유로 원고에 대한 중징계(해임)를 요구하였다. \n  다. 참가인의 원고에 대한 징계의결 요구에 따라 2020. 2. 13. 및 2020. 2. 25. 개최된 교원징계위원회는 원고에 대하여 정직 2개월의 징계를 의결하였다(이하 ‘이 사건 1차 징계의결’이라 한다). 참가인은 이 사건 1차 징계의결 내용을 참가행정청에 보고하지 않은 채 2020. 3. 4.경 원고에게 정직 2개월의 징계처분(이하 ‘이 사건 1차 징계처분’이라 한다)을 하고, 참가행정청에 원고에 대한 이 사건 1차 징계처분 결과를 보고하였다. \n  라. 참가행정청은 법률 검토를 거쳐 2020. 5. 4. 참가인에게, 구 사립학교법(2020. 12. 22. 법률 제17659호로 개정되기 전의 것, 이하 ‘구 사립학교법’이라 한다) 제66조의2 제1항에 따라 징계처분 전에 징계의결 내용을 통보하여야 함에도, 이러한 통보 없이 이 사건 1차 징계처분을 하고 그 결과를 통보한 것은 중대한 절차규정 위반이라는 이유로, 이 사건 1차 징계의결 내용에 대한 통보를 요구하였다. \n  마. 참가인은 2020. 5. 15. 참가행정청에 이 사건 1차 징계의결 내용을 통보하였고, 참가행정청은 2020. 5. 18. 참가인에 구 사립학교법 제66조의2 제2항에 따라 이 사건 1차 징계의결에 대한 재심의를 요구하였다(이하 ‘이 사건 재심의 요구’라 한다). \n  바. 참가인은 이 사건 재심의 요구에 따라 2020. 5. 28. 교원징계위원회에 원고에 대한 징계의결을 재차 요구하였고, 교원징계위원회는 2020. 6. 4. 및 2020. 6. 19. 회의를 거쳐 원고에 대하여 해임의 징계를 의결하였다(이하 ‘이 사건 2차 징계의결’이라 한다).\n  사. 참가인은 2020. 6. 26. 참가행정청에 구 사립학교법 제66조의2 제3항에 따라 이 사건 2차 징계의결 내용을 통보하였고, 참가행정청은 2020. 7. 27. 참가인에게 절차에 따라 처리할 것을 요청하였다.\n  아. 참가인은 2020. 7. 28. 원고에게 이 사건 1차 징계처분을 취소하고, 이 사건 2차 징계의결 내용에 따라 해임처분(이하 ‘이 사건 처분’이라 한다)을 한다고 통지하였다. \n  자. 원고는 2020. 8. 10. 이 사건 처분에 불복하여 소청심사를 청구하였으나, 2020. 11. 18. 위 소청심사청구가 기각되었다.   \n  2. 제1, 2, 3 상고이유에 대한 판단 \n  가. 상고이유의 요지 \n  1) 제1 상고이유 \n  임용권자의 징계의결 내용 사전통보에 관한 구 사립학교법 제66조의2 제1항은 훈시규정이므로 참가인이 사전통보를 하지 않은 채 이 사건 1차 징계처분을 하였더라도 그 징계처분의 효력에는 영향이 없고, 오히려 구 사립학교법 제66조 제4항에 따르면 관할청의 재심의 요구는 징계처분의 효력 발생 전에 이루어져야 하는데 이 사건 재심의 요구는 이 사건 1차 징계처분의 효력 발생 후에 이루어졌으므로 위법하다.  \n  2) 제2, 3 상고이유 \n  원고가 이 사건 1차 징계처분에 불복하지 않음에 따라 위 징계처분이 확정되어 불가변력이 발생하였고 그 집행까지 종료되었으므로, 그 이후 이루어진 참가인의 이 사건 1차 징계처분 취소는 위법하다. 이러한 상태에서 동일한 징계혐의사실에 내려진 이 사건 처분은 이중징계에 해당하여 무효이다.  \n  나. 관련 법리 \n  1) 구 사립학교법은 사립학교의 특수성에 비추어 그 자주성을 확보하고 공공성을 높임으로써 사립학교의 건전한 발달을 도모함을 목적으로 한다(제1조). 구 사립학교법에 따르면, 관할청은 사립학교의 교원이 구 사립학교법에 규정된 면직 사유 및 징계 사유에 해당할 때에는 해당 교원의 임용권자에게 해임 또는 징계를 요구할 수 있고, 이 경우 해임 또는 징계를 요구받은 임용권자는 특별한 사유가 없으면 이에 따라야 한다(제54조 제3항). 사립학교 교원의 임용권자는 위와 같이 관할청으로부터 교원의 해임 또는 징계를 요구받은 사항에 대한 교원징계위원회의 징계의결서를 받았을 때에는 징계처분을 하기 전에 그 내용을 관할청에 통보하여야 한다(제66조의2 제1항). 관할청은 통보받은 징계의결의 내용이 징계 사유에 비추어 가볍다고 인정되면 해당 교원의 임용권자에게 그 징계처분을 하기 전에 교원징계위원회에 재심의를 요구하도록 할 수 있다(제66조의2 제2항). 임용권자가 관할청으로부터 위 규정에 따른 재심의를 요구받은 경우에는 지체 없이 해당 교원징계위원회에 재심의를 요구하여야 하며, 해당 교원징계위원회가 재심의를 하였을 때에는 그 결과를 관할청에 통보하여야 한다(제66조의2 제3항). \n  2) 이러한 구 사립학교법의 목적, 구 사립학교법 제54조 제3항, 제66조의2에 따른 관할청의 징계요구, 임용권자의 사전통보 및 관할청의 재심의 요구의 내용과 취지 등 여러 사정을 종합하면, 임용권자의 관할청에 대한 징계의결 내용 사전통보 의무를 규정한 구 사립학교법 제66조의2 제1항은 단순한 훈시규정이 아니므로, 임용권자가 이 조항을 위반하여 관할청에 징계의결 내용을 통보하지 아니한 채 행한 징계처분에는 구 사립학교법에서 정한 징계절차를 위반한 하자가 있다. \n한편 구 사립학교법 제66조의2 제1항은 임용권자의 관할청에 대한 징계의결 내용 통보 및 관할청의 재심의 요구가 그 징계처분을 하기 ‘전’에 이루어지도록 규정하고 있다. 그러나 임용권자가 구 사립학교법 제66조의2 제1항에 따른 징계의결 내용 사전통보 의무를 위반하여 징계처분을 한 후에 관할청에 징계의결 내용을 사후적으로 통보한 경우에는 관할청 역시 징계처분 이후라고 하더라도 재심의 요구를 할 수 있다. 이 경우 임용권자는 구 사립학교법 제66조의2 제3항에 따라 해당 교원징계위원회에 재심의를 요구하여, 그 결과를 관할청에 통보할 의무가 있다.\n  3) 이처럼 임용권자가 사전통보 의무를 위반한 채 징계처분을 한 후에 관할청에 징계의결 내용을 사후적으로 통보하고 관할청이 사후적으로 재심의 요구를 함에 따라 교원징계위원회에서 선행 징계처분과 다른 내용의 징계의결을 하였을 경우, 선행 징계처분의 처리 및 재심의 요구에 따른 후행 징계의결에 기초한 징계처분의 효력이 문제 된다. 이때 임용권자는 선행 징계처분에 구 사립학교법 제66조의2 제1항에 따른 징계절차의 잘못이 있음을 들어 스스로 그 징계처분을 취소하고, 새로운 후행 징계처분을 할 수 있고, 선행 징계처분이 확정되어 그 집행이 종료되었다는 사정만으로 달리 볼 것은 아니다(대법원 1994. 9. 30. 선고 93다26496 판결, 대법원 2010. 6. 10. 선고 2009다97611 판결 등의 취지 참조). 이처럼 선행 징계처분을 취소하면 선행 징계처분은 소급하여 효력을 잃게 되므로, 선행 징계처분과 동일한 징계혐의사실에 대해 내려진 후행 징계처분이 이중징계라고 할 수 없다(대법원 2015. 4. 9. 선고 2012다79156, 79163 판결 등의 취지 참조). \n  다. 원심판단의 당부 \n  원심은 판시와 같은 이유를 들어, 이 사건 1차 징계처분에는 참가행정청에 이 사건 1차 징계의결 내용을 통보하지 아니한 구 사립학교법 제66조의2 제1항 위반의 징계절차상 하자가 있고, 참가인이 참가행정청으로부터 위와 같은 징계절차 규정 위반을 지적받은 후, 참가행정청에 이 사건 1차 징계의결 내용을 통보하는 절차부터 다시 밟아 이 사건 1차 징계처분을 스스로 취소하고 이 사건 처분에 나아간 이상, 참가행정청의 이 사건 재심의 요구가 이 사건 1차 징계처분 이후 이루어져서 위법하다거나 이 사건 처분이 이중징계에 해당한다는 등의 절차적 하자가 있는 것은 아니라고 판단하였다.\n  원심판결 이유를 위 법리와 기록에 비추어 보면, 이러한 원심의 판단에 상고이유 주장과 같이 구 사립학교법 제66조의2 제2항에 따른 재심의 요구의 법적 성격 및 적법성, 징계처분 취소의 적법 여부 및 그 효력, 이중징계에 관한 법리 등을 오해하여 판결에 영향을 미친 잘못이 없다. \n  3. 제4 상고이유에 대한 판단  \n  가. 상고이유의 요지 \n  원심은 이 사건 처분에 징계재량권을 일탈·남용한 위법이 있음에도 이를 적법하다고 잘못 판단하였다. \n  나. 관련 법리 \n교직원인 피징계자에게 사립학교법상의 징계사유가 있어 징계처분을 하는 경우 그 처분의 내용은 징계권자의 재량에 맡겨진 것이나, 징계권자가 한 징계처분이 사회통념상 현저하게 타당성을 잃어 징계권자에게 맡겨진 재량권을 일탈·남용한 것이라고 인정되는 경우 그 처분은 위법하다. 교직원에 대한 징계처분이 사회통념상 현저하게 타당성을 잃었다고 하려면, 징계 원인이 된 비위사실의 내용과 성질, 징계로 달성하려는 목적, 징계 양정 기준 등 여러 요소를 종합하여 판단할 때 그 징계 내용이 객관적으로 명백히 부당하다고 인정할 수 있는 경우라야 한다(대법원 2004. 6. 25. 선고 2002다51555 판결 등 참조). \n임용권자가 구 사립학교법 제66조의2 제1항에 따른 사전통보 의무를 이행하지 않은 채 선행 징계처분을 한 뒤 관할청의 사후적인 재심의 요구에 따라 동일한 징계혐의사실에 대해 다른 내용으로 후행 징계처분을 하게 되는 경우 선행 징계처분 취소와 그 후에 이루어진 후행 징계처분이 재량권을 일탈·남용한 위법한 처분인지를 판단하는 때에는, 선행 징계처분과 후행 징계처분의 내용, 선행 징계처분 취소 및 후행 징계처분의 경위, 선행 징계처분과 후행 징계처분 사이의 시간적 간격, 선행 징계처분의 확정 및 집행 여부, 선행 징계처분에 대한 피징계자인 교원의 신뢰 보호 필요성 등의 사정도 함께 고려하여야 한다.\n  다. 원심판단의 당부 \n  원심은 판시와 같은 이유로, 원고에 대한 해임의 징계처분인 이 사건 처분이 사회통념상 현저하게 타당성을 잃은 처분으로서 징계재량권의 한계를 일탈·남용하였다고 볼 수 없다고 판단하였다. 이러한 판단에 재량권 일탈·남용에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. \n  4. 결론 \n  그러므로 상고를 기각하고 상고비용은 각 참가로 인한 부분을 포함하여 모두 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 박영재(재판장) 오경미 권영준(주심) 엄상필"
  },

    "판례내용": "【원고, 피상고인 겸 부대상고인】 주식회사 ○○○\n【피고, 상고인 겸 부대피상고인】 서울특별시 강남구 (소송대리인 법무법인 다비다 담당변호사 조동섭)\n【원심판결】 서울고법 2024. 5. 8. 선고 2023누37201 판결\n【주    문】\n  원심판결의 잔여지 가격감소로 인한 손실보상금 청구에 관한 피고 패소 부분 중 940,295,580원 및 이에 대한 지연손해금 부분을 파기하고, 이 부분 사건을 서울고등법원에 환송한다.  원고의 부대상고를 각하한다.  부대상고비용은 원고가 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 피고의 상고이유에 대하여   \n  가. 사안의 경위\n  원심판결의 이유와 기록에 의하면, 다음과 같은 사정들을 알 수 있다. \n  1) 원고는 서울 강남구 △△동(지번 1 생략) 임야 64,926㎡(이하 ‘이 사건 전체 토지’라 한다) 중 17.7/100 지분을 소유하고 있었는데, 이 사건 전체 토지는 2019. 7. 26. 서울 강남구 △△동(지번 2 생략) 임야 20,396㎡(이하 ‘이 사건 수용토지’라 한다) 및 같은 동 (지번 1 생략) 임야 44,530㎡(이하 ‘이 사건 잔여지’라 한다)로 분할되었다.\n  2) 이 사건 수용토지가 2021. 1. 15. 피고가 사업시행자인 □□□도시자연공원 조성사업(이하 ‘이 사건 사업’이라 한다)에 따라 수용되면서 이 사건 잔여지가 남게 되었다. \n  3) 이 사건 수용토지는 이용상황이 ‘임야’인 ‘개발제한구역’ 내 토지, 이용상황이 ‘전’인 ‘개발제한구역’ 내 토지, 이용상황이 ‘임야’인 개발제한구역이 아닌 토지 및 이용상황이 ‘전’인 개발제한구역이 아닌 토지로 구성되어 있고, 이 사건 잔여지는 전부 이용상황이 ‘임야’인 ‘개발제한구역’ 내 토지이다. \n  위와 같은 현실적 이용상황 및 공법상 제한의 차이로 인해 이 사건 사업시행지구에 편입되기 전의 이 사건 수용토지와 이 사건 잔여지의 단위면적당 단가에도 차이가 존재한다. \n  나. 이 사건의 쟁점\n  이 사건의 쟁점은 동일한 토지소유자에 속하는 일단의 토지의 일부가 공익사업시행지구에 취득됨으로 인하여 잔여지의 가격이 하락된 사안에서, 편입된 토지와 잔여지 사이에 현실적 이용상황이나 용도지역 등 공법상 제한에 차이가 있어 가격이 다름이 분명한 경우에 잔여지의 손실을 어떻게 평가할지이다.    \n  다. 대법원의 판단\n  1) 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」 제73조 제1항, 같은 법 시행규칙 제32조 제1항에 따르면, 동일한 토지소유자에 속하는 일단의 토지의 일부가 취득됨으로 인하여 잔여지의 가격이 하락된 경우의 잔여지의 손실은 ‘공익사업시행지구에 편입되기 전의 잔여지의 가격’에서 공익사업시행지구에 편입된 후의 잔여지의 가격을 뺀 금액으로 평가한다. 여기에서 말하는 ‘공익사업시행지구에 편입되기 전의 잔여지의 가격’은 일단의 토지 전부가 공익사업시행지구로 편입되는 경우를 상정한 잔여지 부분의 평가액을 말한다.\n  2) 이러한 경우 일단의 토지 전체를 1필지로 보고 토지 특성을 조사하여 그 전체에 대하여 단일한 가격으로 평가함이 원칙이다. 그러나 일단의 토지가 현실적 이용상황이나 용도지역 등 공법상 제한을 달리하여 가치가 명확히 구분되는 부분으로 구성된 경우에는 현실적 이용상황 또는 용도지역 등이 다른 부분별로 구분하여 평가하여야 한다.\n일단의 토지 중 공익사업시행지구에 편입된 토지와 잔여지 사이에 현실적 이용상황이나 용도지역 등 공법상 제한에 차이가 있어 가치가 다름이 분명한데도, 편입된 토지와 잔여지의 가격을 모두 합산한 금액을 일단의 토지 전체 면적으로 나누어 산정된 단위면적당 가격에 잔여지의 면적을 곱하여 산출한 가격을 ‘공익사업시행지구에 편입되기 전의 잔여지의 가격’으로 인정할 경우, 잔여지와 가치를 달리하는 편입된 토지의 가치가 반영될 수밖에 없다. \n  3) 결국 이러한 경우에는, ‘공익사업시행지구에 편입되기 전의 잔여지 가격’을 일단의 토지 전체의 단위면적당 단가에 잔여지의 면적을 곱하는 방식으로 산정하여서는 아니 되고, 일단의 토지 전부가 공익사업시행지구로 편입되는 경우를 상정하되,「일단의 토지 전체의 가격에서 공익사업시행지구에 편입된 토지의 가격을 빼는 방식」등으로 산정하여, 앞서 살핀 문제점이 발생하지 않도록 하여야 한다. \n  4) 앞서 본 사실관계를 위 법리에 비추어 살펴보면, 이 사건 수용토지와 이 사건 잔여지는 그 현실적 이용상황이나 공법상 제한의 차이로 인하여 가격이 다름이 분명하여, 1개의 필지와 같이 단일한 가격으로 평가하기 어렵다고 보인다. 그러므로 이 사건 사업시행지구에 편입되기 전의 이 사건 잔여지 가격은, 이 사건 전체 토지 전부가 이 사건 사업시행지구로 편입되는 경우를 상정하되, 이 사건 전체 토지의 가격에서 이 사건 수용토지의 가격을 빼는 방식 등으로 산정하여야 한다.\n  그런데도 원심은 이와 달리 이 사건 사업시행지구 편입 전의 이 사건 잔여지 가격을 이 사건 전체 토지의 단위면적당 단가에 이 사건 잔여지의 면적을 곱하는 방식으로 산정하고 이를 전제로 이 사건 잔여지 중 원고 지분의 가격감소로 인한 손실보상금을 인정하였다. 원심의 이러한 판단에는 공익사업시행지구에 편입되기 전의 잔여지 가격 산정 방법에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 피고의 상고이유 주장은 이유 있다.\n  2. 원고의 부대상고에 대하여\n  부대상고를 제기할 수 있는 시한은 항소심에서의 변론종결 시에 대응하는 상고이유서 제출기간 만료 시까지이다(대법원 2007. 4. 12. 선고 2006다10439 판결 참조).\n  기록에 의하면, 원고는 상고소송기록 접수통지서가 상고인인 피고에게 송달된 2024. 6. 18.부터 상고이유서 제출기간 20일이 지난 후인 2024. 7. 15. 부대상고를 제기하였음이 명백하므로, 원고의 부대상고는 부적법한 것으로서 그 흠결을 보정할 수 없다.\n  3. 결론\n  그러므로 원심판결의 잔여지 가격감소로 인한 손실보상금 청구에 관한 피고 패소 부분 중 피고가 상고한 940,295,580원 및 이에 대한 지연손해금 부분을 파기하고, 이 부분 사건을 다시 심리·판단하도록 원심법원에 환송하며, 원고의 부대상고를 각하하고 부대상고비용은 원고가 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 노경필(재판장) 이흥구(주심) 오석준 이숙연"

    "판시사항": "화장품 원료를 수입하여 화장품 제조회사에 납품하는 사업을 하는 甲이 한국의약품수출입협회장에게 CBD Isolate(Cannabidiol)에 대한 표준통관예정보고 신청을 하였으나, 한국의약품수출입협회장이 甲에게 ‘대마의 성숙한 줄기에서 분리정제(isolate)한 CBD는 대마에 해당하여 수입 및 소지 등이 금지되므로, 화장품법 제8조 제1항 등에 따라 사용할 수 없는 원료(마약류 관리에 관한 법률 제2조에 따른 마약류)에 해당한다.’는 이유로 표준통관예정보고 발급이 불가함을 통지한 사안에서, 현행 마약류 관리에 관한 법령의 해석상 위 수입품은 ‘대마’에 해당하는데도, 이와 달리 위 처분이 위법하다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례",
    "판결요지": "화장품 원료를 수입하여 화장품 제조회사에 납품하는 사업을 하는 甲이 한국의약품수출입협회장에게 CBD Isolate(Cannabidiol)에 대한 표준통관예정보고 신청을 하였으나, 한국의약품수출입협회장이 甲에게 ‘대마의 성숙한 줄기에서 분리정제(isolate)한 CBD는 대마에 해당하여 수입 및 소지 등이 금지되므로, 화장품법 제8조 제1항 등에 따라 사용할 수 없는 원료[마약류 관리에 관한 법률(이하 ‘마약류관리법’이라 한다) 제2조에 따른 마약류]에 해당한다.’는 이유로 표준통관예정보고 발급이 불가함을 통지한 사안에서, 우선 마약류관리법령은 대마의 주요성분을 칸나비놀(Cannabinol), 테트라하이드로칸나비놀(Δ9-Tetrahydrocannabinol), 칸나비디올(Cannabidiol, 이하 ‘CBD’라 한다)로 보고 이를 규제대상으로 삼는 것으로 해석할 수 있는 점, 또한 마약류관리법 제2조 제4항 단서에서 ‘대마초의 종자·뿌리 및 성숙한 대마초의 줄기와 그 제품’을 대마에서 제외하도록 규정하고 있다고 해서 여기에서 추출·제조된 CBD 등 대마 주요성분까지도 ‘대마’에서 제외한다고 볼 것은 아닌 점, 마약류관리법 제2조 제4호 (다)목, 마약류 관리에 관한 법률 시행령 제2조 제4항 [별표 7의2]에 따를 때, CBD는 그 자체로 ‘대마’에 해당하므로, 고농도의 CBD에 해당하는 위 수입품은 마약류관리법 제2조 제4호 (다)목의 ‘대마’에 해당하는 점, UN 마약위원회(Commission on Narcotic Drugs)도 CBD 제제를 국제적인 통제목록에서 제외해야 한다는 세계보건기구(WHO)의 권고에 따라 이를 표결에 부친 바 있으나, 이에 대하여 압도적으로 부결함으로써 여전히 CBD 제제는 국제협약상 마약류로 통제되고 있는 점을 종합하면, 현행 마약류관리법령의 해석상 위 수입품은 ‘대마’에 해당하는데도, 이와 달리 위 처분이 위법하다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례.",

    "판례내용": "【원고, 피상고인】 원고 (소송대리인 법무법인 공신 담당변호사 김화섭 외 1인)\n【피고, 상고인】 한국의약품수출입협회장 (소송대리인 법무법인 엘케이파트너스 담당변호사 배준익)\n【원심판결】 서울고법 2022. 9. 15. 선고 2021누74756 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유(상고이유서 제출기간이 지난 뒤에 제출된 준비서면과 참고서면의 각 기재는 이를 보충하는 범위에서)를 판단한다. \n  1. 사건의 개요 \n  원심판결 이유와 기록에 의하면, 다음과 같은 사실을 알 수 있다. \n  가. 원고는 ‘○○○’라는 상호로 화장품 원료를 수입하여 화장품 제조회사에 납품하는 사업을 영위하는 자로서 2020. 12. 7. 피고에게 CBD Isolate(Cannabidiol)(이하 ‘이 사건 쟁점 수입품’이라 한다)에 대한 표준통관예정보고 신청을 하였다. \n  나. 피고는 2021. 8. 10. 원고에게 ‘대마의 성숙한 줄기에서 분리정제(isolate)한 CBD는 대마에 해당하여 수입 및 소지 등이 금지되므로, 화장품법 제8조 제1항 및 「화장품 안전기준 등에 관한 규정」제3조에 따라 사용할 수 없는 원료[「마약류 관리에 관한 법률」(이하 ‘마약류관리법’이라 한다) 제2조에 따른 마약류]에 해당한다.’는 이유로 표준통관예정보고 발급이 불가함을 통지하였다(이하 ‘이 사건 처분’이라 한다). \n  2. 원심의 판단 \n  원심은, 다음과 같은 이유로 이 사건 쟁점 수입품이 마약류관리법 제2조 제4호에서 규정하고 있는 ‘대마’에 해당한다고 단정하기 어렵다는 전제에서, 이 사건 처분은 위법하다는 취지로 판단하였다.  \n  가. 대마를 규제하고 처벌하는 이유는 대마 속에 함유된 환각성분의 본체인 테트라하이드로칸나비놀로부터 국민의 건강을 지켜 공공복리의 증진을 도모하는 것이다. \n  나. 그런데 이 사건 쟁점 수입품에는 환각성분의 본체인 테트라하이드로칸나비놀 성분은 검출되지도 아니한 것으로 보이고, 테트라하이드로칸나비놀이 거의 없어 규제 필요성이 적은 대마초의 종자·뿌리 및 성숙한 대마초의 줄기 부분(이하 ‘대마 제외 부분’이라 한다)을 제외한 ‘나머지 대마초 부분’ 또는 대마초 전부에 분포하고 있는 ‘수지’에 해당한다거나 그로부터 추출·제조된 제품에 해당한다고 단정하기 어렵다. \n  다. 설령 이 사건 쟁점 수입품이 수지에서 추출·제조된 것에 해당한다 하더라도, 마약류관리법 제2조 제4호 규정형식에 비추어 볼 때 대마초 수지가 대마 제외 부분에서 나온 것이라면 대마에서 제외하는 것으로 해석할 수밖에 없다. \n  3. 대법원의 판단 \n  그러나 원심의 판단은 다음과 같은 이유로 수긍할 수 없다. \n  가. 우선, 마약류관리법령은 대마의 주요성분을 칸나비놀(Cannabinol, 이하 ‘CBN’이라 한다), 테트라하이드로칸나비놀(Δ9-Tetrahydrocannabinol, 이하 ‘THC’라 한다), 칸나비디올(Cannabidiol, 이하 ‘CBD’라 한다)로 보고, 이를 규제대상으로 삼는 것으로 해석할 수 있다. \n  1) 마약류관리법 제2조 제4호 (다)목은 같은 호 (가)목(대마초와 그 수지) 또는 (나)목(대마초 또는 그 수지를 원료로 하여 제조된 모든 제품)에 규정된 것과 동일한 화학적 합성품으로서 대통령령으로 정하는 것을 ‘대마’로 규정하고, 이에 따라 마련된 같은 법 시행령 제2조 제4항 [별표 7의2]는 위 화학적 합성품을 CBN, THC, CBD와 그 염 및 이성체 또는 이성체의 염으로 정하고 있다. \n  2) 위 시행령 조항은 2016. 11. 1. 대통령령 제27573호로 개정되면서 신설되었는데, 이는 대마의 정의에 (가)목(대마초와 그 수지) 또는 (나)목(대마초와 그 수지를 원료로 하여 제조된 모든 제품)에 규정된 것과 동일한 화학적 합성품이 포함되도록 하는 내용으로 마약류관리법이 2016. 2. 3. 법률 제14019호로 개정됨에 따라 대마 관련 화학적 합성품의 내용을 정하기 위한 것이었다. 즉 마약류관리법 제2조 제4호 (다)목은 종전 ‘대마’의 정의규정에 인공적으로 만든 대마 성분이 ‘대마’에 포함되는 것인지 명확하지 않아 법 해석의 혼란이 발생할 가능성이 있음을 이유로 천연 물질과 동일한 화학적 합성품을 정의규정에 명시하여 천연 물질만 마약류관리법의 규제대상으로 오인될 소지를 제거하고 규제대상인 대마의 정의를 명확히 한다는 취지에서 이루어진 것이다. \n  3) 따라서 마약류 관리에 관한 법률 시행령 제2조 제4항 [별표 7의2]가 대마초와 그 수지 또는 이를 원료로 하여 제조된 모든 제품과 동일한 화학적 합성품을 대마에서 검출되는 수많은 칸나비노이드(Cannabinoid) 중 ‘CBN, THC, CBD와 그 염 및 이성체 또는 이성체의 염’으로 정하고 있는 것은 대마의 칸나비노이드 중 그 오남용으로 인해 보건상의 위해가 초래될 수 있는 주요성분을 CBN, THC, CBD로 보고 이를 규제대상으로 삼기 위한 것이다. \n  나. 또한, 마약류관리법 제2조 제4항 단서에서 ‘대마초의 종자·뿌리 및 성숙한 대마초의 줄기와 그 제품’을 대마에서 제외하도록 규정하고 있다고 해서, 여기에서 추출·제조된 CBD 등 대마 주요성분까지도 ‘대마’에서 제외한다고 볼 것은 아니다.\n  1) 대마를 습관성의약품으로 규율하던 습관성의약품관리법이 1973. 3. 13. 법률 제2613호로 개정되면서 ‘성숙한 대마초의 줄기 및 그 제품’을 습관성의약품에서 제외한다고 규정하였고(제2조 제1항 제2호 단서), 1976. 4. 7. 법률 제2895호로 제정된 대마관리법에서 ‘대마초의 종자·뿌리 및 성숙한 대마초의 줄기와 그 제품’을 ‘대마’에서 제외한다고 규정(제2조 제1항 단서)함과 동시에 섬유 또는 종자를 채취할 목적으로만 대마를 재배할 수 있도록 허용하였다(제2조 제2항). 그 후 마약류관리법도 이와 동일한 내용을 규정하여 현재에 이르고 있다.\n  2) 대마를 규율하던 특별법의 입법 목적은 모두 대마 등의 오남용으로 인한 보건상의 위해를 방지하기 위한 것 등으로, 그 각 입법배경도 대마 등의 흡연이 심각한 사회문제가 되자 이에 대한 규제를 강화하기 위한 것이었다는 점에 비추어 볼 때, 대마초의 종자·뿌리 및 성숙한 대마초의 줄기와 그 제품을 ‘대마’에서 제외하고 있는 것은 통상적으로 환각성분이 인체에 유해한 정도로 함유되어 있지 아니하여 오남용의 위험성이 적은 반면, 섬유 또는 종자 채취의 용도로 활용 가능성이 높기 때문임을 알 수 있고, 여기에서 CBD 등 대마의 주요성분을 대마에서 제외하고자 한 의도는 찾아볼 수 없다. \n  3) 만약 마약류관리법령의 해석상 대마 제외 부분에서 추출한 CBD를 대마 제외 부분에서 추출되었다는 이유로 ‘대마’에서 제외되는 것으로 해석한다면 대마 제외 부분에서 추출한 THC 역시 같은 이유로 ‘대마’에서 제외된다는 것으로, 이는 대마의 남용에 의한 보건상의 위해 방지라는 마약류관리법령의 입법 목적에 반하게 된다. \n  다. 마약류관리법 제2조 제4호 (다)목, 같은 법 시행령 제2조 제4항 [별표 7의2]에 의할 때, CBD는 그 자체로 ‘대마’에 해당하므로, 고농도의 CBD에 해당하는 이 사건 쟁점 수입품은 마약류관리법 제2조 제4호 (다)목의 ‘대마’에 해당한다. \n  1) 마약류관리법 제2조 제4호 (다)목은 ‘(가)목 또는 (나)목에 규정된 것과 동일한 화학적 합성품’을 ‘대마’로 정의하면서 그 구체적인 내용을 대통령령에 위임하고, 같은 법 시행령 제2조 제4항 [별표 7의2]는 위 ‘화학적 합성품’을 ‘CBN, THC, CBD와 그 염 및 이성체 또는 이성체의 염’으로 규정하고 있으므로, ‘CBN, THC, CBD’는 그 자체로 법령상 ‘화학적 합성품’으로 규율되고 있다. 따라서 그 문언에 의할 때 (가)목 또는 (나)목에 규정된 것과 동일한 성분을 갖고 있는 ‘화학적 합성품’ 그 자체가 ‘CBN, THC, CBD’라는 것이므로, 그것이 화학적 합성의 방법에 의하여 제조된 것인지 여부를 불문하고 CBD는 그 자체로 ‘화학적 합성품’으로서 마약류관리법 제2조 제4호 (다)목에 의하여 ‘대마’에 해당한다. \n  2) 마약류관리법 제2조 제4호 (다)목 및 같은 법 시행령 제2조 제4항 [별표 7의2]는 CBN, THC, CBD 등 성분 그 자체로 ‘대마’에 해당한다는 점을 규정하고 있다. 마약류관리법 제2조 제4호 단서는 대마 제외 부분을 규정하고 있으나, 이를 제외하고 있는 취지는 앞서 살펴본 바와 같이 섬유 또는 종자 채취의 목적이라 할 것이므로, ‘대마’에서 제외되는 ‘대마초의 종자·뿌리, 성숙한 대마초의 줄기와 그 제품’은 ‘대마초’의 물리적 일부분 및 이를 가공한 제품으로 해석함이 상당하고, 대마 제외 부분에서 대마의 주요 칸나비노이드가 추출되었다면 그 성분 자체로 마약류관리법 제2조 제4호 (다)목 및 같은 법 시행령 제2조 제4호 [별표 7의2]에 의하여 ‘대마’에 해당한다고 봄이 타당하다. \n  라. 한편 UN 마약위원회(Commission on Narcotic Drugs, CND)도 CBD 제제를 국제적인 통제목록에서 제외해야 한다는 세계보건기구(WHO)의 권고에 따라 이를 표결에 부친 바 있으나, 이에 대하여 압도적으로 부결함으로써 여전히 CBD 제제는 국제협약상 마약류로 통제되고 있다. \n  마. 결국 현행 마약류관리법령의 해석상 이 사건 쟁점 수입품은 ‘대마’에 해당한다고 할 것이고, CBD의 의학적, 상업적 효용가치로 인해 이를 마약류에서 제외할 필요성이 있다고 하더라도 이는 입법 영역에서 다루어야 할 문제이다. \n  바. 그런데도 원심은, 판시와 같은 이유만으로 이 사건 처분이 위법하다고 판단하였다. 이러한 원심판단에는 마약류관리법 제2조 제4호에서 규정한 ‘대마’의 정의에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 피고의 상고이유 주장은 이유 있다. \n  4. 결론 \n  그러므로 나머지 상고이유에 관한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오석준(재판장) 이흥구 노경필 이숙연(주심)"
  },

    "판시사항": "구 서울특별시 도시 및 주거환경 정비조례 제27조 제2항 제3호 단서에서 정한 권리산정기준일인 2003. 12. 30. 이전에 한 필지의 토지를 소유하던 피상속인이 사망하였으나, 상속으로 한 필지의 토지 중 지분면적 90㎡ 이상을 소유하게 된 상속인이 위 기준일 이후에 상속을 원인으로 한 소유권이전등기를 마친 경우, 위 단서에 해당하여 독립된 1인의 분양대상자가 될 수 있는지 여부(적극) 및 이는 상속인이 위 기준일 이후에 상속재산분할협의를 통해 지분면적 90㎡ 이상을 소유하게 된 경우에도 마찬가지인지 여부(원칙적 적극)",
    "판결요지": "피상속인이 구 서울특별시 도시 및 주거환경 정비조례(2010. 7. 15. 서울특별시조례 제5007호로 개정되기 전의 것, 이하 ‘구 서울시 도시정비조례’라 한다) 제27조 제2항 제3호 단서에서 정한 권리산정기준일인 2003. 12. 30. 이전에 사망하여 상속이 개시된 경우, 그 상속으로 인하여 한 필지의 토지 중 지분면적 90㎡ 이상을 소유하게 된 상속인은 상속을 원인으로 한 등기가 위 기준일 이후에 이루어졌다고 하더라도 위 단서에 해당하여 독립된 1인의 분양대상자가 될 수 있다. 상속인이 상속재산분할협의를 통하여 지분면적 90㎡ 이상을 소유하게 되었다고 하더라도 그 상속재산분할협의가 구 서울시 도시정비조례 제27조 제2항 제3호의 규정 취지에 반하여 오로지 이른바 ‘지분 쪼개기’ 목적으로 이루어져 그에 기초한 분양신청이 권리남용에 해당하거나 신의성실의 원칙에 반한다고 볼 특별한 사정이 없는 한 마찬가지다.",

    "판례내용": "【원고, 피상고인】 원고 1 외 1인 (소송대리인 법무법인 솔 담당변호사 최종상)\n【원고, 상고인】 원고 3 외 1인 (소송대리인 법무법인 솔 담당변호사 최종상)\n【피고, 피상고인 겸 상고인】 ○○○주택재개발정비사업조합 (소송대리인 법무법인 산하 담당변호사 이재현 외 5인)\n【원심판결】 서울고법 2023. 12. 15. 선고 2023누43756 판결\n【주    문】\n  상고를 모두 기각한다.  상고비용 중 원고 3, 원고 4의 상고로 인한 부분은 위 원고들이, 피고의 상고로 인한 부분은 피고가 각 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 따르면 아래 사실을 알 수 있다.\n  가. 피고는 서울 은평구 (주소 1 생략) 일원 238,850.9㎡를 정비구역(이하 ‘이 사건 정비구역’이라 한다)으로 한 주택재개발사업을 시행하기 위하여 2015. 12. 2. 조합설립인가를 받아 설립된 조합이다.\n  나. 이 사건 정비구역 내에 있는 서울 은평구 (주소 2 생략) 도로 770㎡(이하 ‘이 사건 토지’라 한다)를 소유하고 있던 소외 1이 1980. 10. 22. 사망하였다. \n  다. 소외 1의 자녀인 소외 2, 소외 3, 소외 4, 소외 5, 소외 6, 소외 7(이하 ‘소외 2 등 6인’이라 한다)는 이 사건 토지 중 소외 2가 96/240 지분, 소외 3이 72/240 지분, 소외 4, 소외 5, 소외 6, 소외 7이 각 18/240 지분을 상속하는 것을 내용으로 하는 상속재산분할협의(이하 ‘이 사건 상속재산분할협의’라 한다)를 한 다음, 이 사건 정비구역에 대한 기본계획이 수립된 2004. 6. 25. 이후인 2005. 5. 20. 이 사건 상속재산분할협의에 따라 위 각 지분에 관하여 1980. 10. 22. 상속을 원인으로 한 소유권이전등기를 마쳤다.\n  라. 원고 1은 2005. 6. 7. 소외 2로부터 이 사건 토지 중 96/240 지분(지분면적 308㎡)을 매수하여 2005. 6. 9. 위 지분에 관한 소유권이전등기를 마쳤고, 원고 2는 2005. 6. 7. 소외 3으로부터 이 사건 토지 중 72/240 지분(지분면적 231㎡)을 매수하여 2005. 6. 9. 위 지분에 관한 소유권이전등기를 마쳤다. \n  마. 소외 8은 2005. 6. 7. 소외 4, 소외 5로부터 이 사건 토지 중 각 18/240 지분을 매수하여 2005. 6. 9. 위 각 지분에 관한 소유권이전등기를 마쳤고, 원고 3은 2006. 12. 28. 소외 8로부터 위 각 지분(합계 36/240 지분, 지분면적 115.5㎡)을 증여받아 같은 날 위 각 지분에 관한 소유권이전등기를 마쳤다. 또한 소외 9는 2005. 6. 27. 소외 6, 소외 7로부터 이 사건 토지 중 각 18/240 지분을 매수하여 2005. 7. 7. 위 각 지분에 관한 소유권이전등기를 마쳤고, 원고 4는 2005. 10. 25. 소외 9로부터 위 각 지분(합계 36/240 지분, 지분면적 115.5㎡)을 매수하여 같은 날 위 각 지분에 관한 소유권이전등기를 마쳤다.\n  바. 원고들은, 자신들이 이 사건 토지의 공유자로서 소유하고 있는 각 지분면적이 90㎡ 이상이므로 각자 단독으로 분양대상자에 해당할 수 있음을 전제로 피고에게 분양신청을 하였다. 그러나 피고는 원고들 전부를 1인의 분양대상자로 보아 원고들에게 1개의 주택만을 분양하는 내용 등으로 관리처분계획을 수립하여 2022. 5. 6. 인가를 받았다. \n  2. 피고의 제1, 2 상고이유에 관한 판단\n  가. 관련 규정 \n「도시 및 주거환경정비법」(이하 ‘도시정비법’이라 한다) 제76조 제1항은 제6호에서 \"1세대 또는 1명이 하나 이상의 주택 또는 토지를 소유한 경우 1주택을 공급하고, 같은 세대에 속하지 아니하는 2명 이상이 1주택 또는 1토지를 공유한 경우에는 1주택만 공급한다.\"라고 규정한 다음, 제7호 (가)목에서 \"2명 이상이 1토지를 공유한 경우로서 시·도조례로 주택공급을 따로 정하고 있는 경우에는 시·도조례로 정하는 바에 따라 주택을 공급할 수 있다.\"라고 규정하고 있다.\n  2010. 7. 16. 이전에 기본계획이 수립되어 있는 지역에서 이루어지는 주택재개발사업의 분양대상을 정할 때 적용되는 구「서울특별시 도시 및 주거환경 정비조례」(2010. 7. 15. 서울특별시조례 제5007호로 개정되기 전의 것, 이하 ‘구 서울시 도시정비조례’라 한다) 제27조 제2항 제3호는 이와 같은 위임을 받아 그 본문에서 하나의 주택 또는 한 필지의 토지를 수인이 소유하고 있는 경우에는 수인의 분양신청자를 1인의 분양대상자로 본다고 하면서도, 그 단서(이하 ‘이 사건 단서’이라 한다)에서 \"다만 2003년 12월 30일 전부터 공유지분으로 소유한 토지의 지분면적이「서울특별시 건축조례」(이하 ‘서울시 건축조례’라 한다) 제29조에 따른 규모 이상인 자는 그러하지 아니하다.\"라고 규정하고 있다. 서울시 건축조례 제29조에서 규정된 규모는 주거지역의 경우 90㎡이다.\n  한편 도시정비법 제74조 제1항, 「서울특별시 도시 및 주거환경 정비조례」(이하 ‘서울시 도시정비조례’라 한다) 제34조 제4호는 관리처분계획의 수립 기준 중 하나로 \"종전 토지 등의 소유권은 관리처분계획기준일 현재 부동산등기부에 따르고, 소유권 취득일은 부동산등기부상의 접수일자를 기준으로 한다.\"라고 정하고 있다. \n  나. 쟁점\n  이 부분의 쟁점은, 구 서울시 도시정비조례 시행일인 2010. 7. 16. 이전에 기본계획이 수립된 주택재개발사업에서 이 사건 단서가 정한 권리산정기준일인 2003. 12. 30.(이하 ‘이 사건 기준일’이라 한다) 이전에 한 필지의 토지를 소유하던 피상속인이 사망하였는데, 상속인들이 상속을 원인으로 한 소유권이전등기를 마치지 않고 있다가 이 사건 기준일 이후 비로소 지분면적 90㎡ 이상의 공유지분을 상속받는 내용의 상속재산분할협의를 거쳐 그 공유지분에 관하여 소유권이전등기를 마친 경우, 그 상속인이 이 사건 단서의 적용 대상에 해당하는지 여부이다. \n  다. 판단\n  1) 피상속인이 이 사건 기준일 이전에 사망하여 상속이 개시된 경우, 그 상속으로 인하여 한 필지의 토지 중 지분면적 90㎡ 이상을 소유하게 된 상속인은 상속을 원인으로 한 등기가 이 사건 기준일 이후에 이루어졌다고 하더라도 이 사건 단서에 해당하여 독립된 1인의 분양대상자가 될 수 있다. 상속인이 상속재산분할협의를 통하여 지분면적 90㎡ 이상을 소유하게 되었다고 하더라도 그 상속재산분할협의가 구 서울시 도시정비조례 제27조 제2항 제3호의 규정 취지에 반하여 오로지 이른바 ‘지분 쪼개기’ 목적으로 이루어져 그에 기초한 분양신청이 권리남용에 해당하거나 신의성실의 원칙에 반한다고 볼 특별한 사정이 없는 한 마찬가지다. 그 이유는 다음과 같다. \n  가) 이 사건 단서는 이 사건 기준일 전부터 공유지분으로 ‘소유’한 토지의 지분면적이 90㎡ 이상임을 요구하고 있다. 상속은 사망으로 인하여 개시되고(민법 제997조), 상속인은 상속개시된 때부터 피상속인의 재산에 관한 포괄적 권리의무를 승계하는 것이며(민법 제1005조 전문), 상속재산의 분할은 상속개시된 때에 소급하여 그 효력이 있다(민법 제1015조 본문). 상속에 의한 부동산에 관한 물권의 취득은 등기를 요하지 아니한다(민법 제187조 본문). 피상속인이 소유하던 부동산은 피상속인의 사망과 동시에 상속인에게 이전되고, 상속재산에 관한 공동상속인 상호 간의 상속재산분할협의를 통하여 상속받게 된 부동산 역시 상속개시 당시로 소급하여 피상속인으로부터 해당 상속인에게 직접 승계된 것이 된다. 그에 따른 등기를 마쳐야만 비로소 상속인이 그 부동산에 관한 물권을 취득하는 것은 아니다. 따라서 이 사건 기준일 이전에 피상속인이 사망하여 상속이 개시되었다면, 상속인은 등기 여부와 무관하게 이 사건 기준일 전부터 그 지분면적을 ‘소유’한 자에 해당한다. \n  나) 도시정비법 제76조 제1항 제6호 및 구 서울시 도시정비조례 제27조 제2항 제3호 본문이 2인 이상이 한 필지의 토지를 공유하는 경우에 원칙적으로 1주택만을 공급하도록 정한 것은 정비구역 안에 소재한 토지 등 소유자 사이의 이해관계를 조정하면서, 주택재개발사업으로 공급되는 주택을 다수 취득할 목적으로 ‘지분 쪼개기’와 같은 행위를 하는 폐해를 막아 국민의 주거 안정을 확보하고 투기세력 유입에 의한 정비사업의 사업성 저하를 방지하며 기존 조합원의 재산권을 보호하고자 하는 취지이다. \n  이 사건 단서가 위 원칙의 예외를 인정한 것은, 서울시 도시정비조례가 제정 당시 분양신청자가 소유하고 있는 종전토지의 총면적이 90㎡ 이상인 자를 주택재개발사업으로 건립되는 공동주택의 분양대상자로 정한 점에 비추어, 서울시 도시정비조례 제정일인 이 사건 기준일 이전부터 공유로 그 지분면적 이상을 소유하고 있던 자가 총면적이 90㎡ 이상인 토지를 단독 소유하고 있는 자와 동일하게 주택을 공급받을 수 있도록 하더라도 위와 같은 취지를 해하지 않으며, 개발이익의 균등한 배분과 형평에도 부합한다는 정책적 고려를 반영한 것이다.\n  이 사건 기준일 이전에 그 지분면적에 대하여 상속등기를 마친 경우에만 이 사건 단서에 해당할 수 있다고 본다면, 상속이 이 사건 기준일 이전에 개시되었고 공동상속인들의 법정상속분에 따른 지분면적이 각 90㎡ 이상인 경우, ‘지분 쪼개기’의 의도가 전혀 없었음에도 이 사건 기준일 이후에 그 등기를 하였다는 이유만으로 별도로 1주택을 공급받지 못하는 결과가 된다. 이는 개발이익의 균등한 배분과 형평을 도모한다는 이 사건 단서의 취지에 반한다. \n  다) 서울시 도시정비조례 제34조 제4호 후문이 관리처분계획을 수립함에 있어서 소유권 취득일은 부동산등기부상의 접수일자를 기준으로 하여야 한다고 정하고 있기는 하다. 그러나 이는 부동산 물권의 취득 및 그 시점이 등기에 의하여 정해지는 경우를 전제한 것으로, 상속과 같이 법률의 규정에 의하여 부동산 물권변동 여부 및 시기가 정해지는 경우까지도 부동산등기부상의 접수일자를 기준으로 소유권 취득일을 판단하여야 한다는 취지라고 보기는 어렵다. 그 밖에 이 사건 단서를 해석함에 있어서 민법 제187조 및 상속의 일반법리의 적용을 배제하여야 한다고 볼만한 다른 규정도 존재하지 않는다. \n  라) 공동상속인들이 ‘지분 쪼개기’ 목적으로 상속재산분할협의제도를 악용할 경우 그에 기초한 분양신청은 권리남용에 해당하거나 신의성실의 원칙에 반한 것이 된다. 이러한 특별한 사정의 존재는 이를 주장하는 사업시행자가 증명하여야 한다. \n  다만 상속재산분할협의가 이 사건 기준일 이후에 이루어지거나 이 사건 기준일 이후 기존의 상속재산분할협의를 해제하고 새로운 협의가 이루어지는 등의 사정으로 인하여 법정상속분 또는 기존의 분할협의에 따른 상속이 이루어졌을 때에 비하여 분양받을 수 있는 주택의 수가 늘어났다는 사실 등의 간접사실이 인정되는 경우에는 ‘지분 쪼개기’의 목적을 사실상 추정할 수 있다.\n  2) 원심은 소외 2 등 6인이 이 사건 기준일 이후인 2005. 5. 20. 이 사건 토지 중 각 그 판시와 같은 지분에 관하여 상속을 원인으로 한 소유권이전등기를 마쳤지만 상속개시시점인 1980. 10. 22.부터 이 사건 상속재산분할협의의 내용대로 이 사건 토지를 공유하고 있었고 그중 소외 2, 소외 3의 지분면적은 90㎡ 이상에 해당한다고 인정한 다음, 소외 2 등 6인에게 ‘지분 쪼개기’를 통하여 분양주택 수를 늘리려는 목적이 있었다고 보이지 않는다고 판단하면서, 이 사건 기준일 전부터 90㎡ 이상의 지분면적을 소유하던 소외 2, 소외 3으로부터 각 지분을 양수한 원고 1, 원고 2는 이 사건 단서에 따라 각 독립된 1인의 분양대상자에 해당한다고 보았다. \n  앞서 본 법리와 기록에 비추어 보면 이러한 원심의 판단은 정당하고, 거기에 피고가 상고이유로 주장하는 바와 같은 법리오해, 심리미진 등의 잘못이 없다. \n  3. 원고 3, 원고 4의 상고이유에 관한 판단 \n  원심은 판시와 같은 이유로, 소외 4, 소외 5, 소외 6, 소외 7은 이 사건 기준일인 2003. 12. 30. 당시 각 지분면적이 90㎡에 미치지 못하는 지분을 소유하고 있었으므로, 이 사건 기준일 이후에 소외 4, 소외 5로부터 소외 8을 거쳐 위 각 지분을 순차로 매수하여 소유하게 된 원고 3과 소외 6, 소외 7로부터 소외 9를 거쳐 위 각 지분을 순차로 매수하여 소유하게 된 원고 4는 이 사건 단서가 적용되지 않아 1주택의 공동분양대상자에 해당한다고 판단하였다. 관련 법리와 기록에 비추어 보면 이러한 원심의 판단은 정당하고, 거기에 원고 3, 원고 4가 상고이유로 주장하는 바와 같이 구 서울시 도시정비조례 제27조 제3항 제3호의 해석에 관한 법리를 오해한 잘못이 없다.\n  4. 결론 \n  상고를 모두 기각하고 상고비용 중 원고 3, 원고 4의 상고로 인한 부분은 위 원고들이, 피고의 상고로 인한 부분은 피고가 각 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 이숙연(재판장) 이흥구 오석준(주심) 노경필"

    "판시사항": "[1] 고용보험법 제35조 제1항, 제2항에 따라 고용노동부장관이 거짓이나 그 밖의 부정한 방법으로 고용안정사업의 지원을 받은 자에 대하여 반환을 명할 수 있는 금액의 범위 및 추가 징수할 수 있는 금액의 기준(=거짓이나 그 밖의 부정한 방법으로 지원받은 금액)\n [2] 구 고용보험법 시행령 제19조 제1항 제3호에서 고용유지지원금의 지급 대상이 되는 고용유지조치 중 하나로 규정한 \"1개월 이상 휴직을 부여하는 경우\"의 해석\n [3] 사업주가 계획된 휴직기간 동안 소속 근로자를 근로하게 하는 등으로 계획된 휴직을 실제 시행하지 못했음에도 계획된 휴직을 모두 시행한 것과 같이 기재하여 고용유지지원금의 지급을 신청하고 이를 수령한 경우, 사업주가 거짓이나 그 밖의 부정한 방법으로 지급받은 고용유지지원금의 범위",
    "판결요지": "[1] 고용보험법 제35조 제1항, 제2항에서는 ‘고용노동부장관은 거짓이나 그 밖의 부정한 방법으로 고용안정사업의 지원을 받은 자에 대하여 부정한 방법으로 지원받은 금액을 반환하도록 명하여야 한다. 반환을 명하는 경우에는 이에 추가하여 부정한 방법으로 지급받은 금액의 5배 이하의 금액을 징수할 수 있다.’는 취지로 규정하고 있다. 이때 고용노동부장관이 반환을 명할 수 있는 금액은 거짓이나 그 밖의 부정한 방법으로 지원받은 금액에 한정되고, 거짓이나 그 밖의 부정한 방법으로 지원받은 금액의 반환을 명하는 경우에 이에 추가하여 징수할 수 있는 금액 역시 그 거짓이나 그 밖의 부정한 방법으로 지원받은 금액을 기준으로 한다.\n [2] 고용보험법 제21조 제1항의 위임에 따라 구 고용보험법 시행령(2020. 12. 29. 대통령령 제31324호로 개정되기 전의 것) 제19조 제1항 제3호는 고용유지지원금의 지급 대상이 되는 고용유지조치 중 하나로 \"1개월 이상 휴직을 부여하는 경우\"를 규정하고 있는데, 여기서 고용유지조치로서의 ‘휴직’에 해당하기 위해서는 근로자가 사업주의 조치로 인하여 직무에 종사하는 것이 금지된 기간이 연속하여 1개월 이상이어야 한다. 고용안정사업의 목적, 고용유지지원금의 성격, 고용유지지원금의 지급대상 및 범위에 관한 법령의 규정 내용 및 형식과 함께 일반적으로 ‘휴직’이란 근로자의 지위를 그대로 두면서 ‘일정한 기간’ 직무에 종사하는 것을 금지시키는 사용자의 처분을 의미하고, ‘기간’은 일정한 시점부터 다른 어느 일정한 시점까지의 연속된 시간적 간격을 말하는 점 등을 종합적으로 고려하여 보면 위와 같이 해석하는 것이 타당하다.\n [3] 사업주가 근로자에게 1개월 이상의 휴직을 부여한다는 내용의 고용유지조치(휴직) 계획신고서를 제출하였으나, 근로자가 계획된 휴직기간 중 일부 기간 동안 사업주의 지시 등에 따라 실제 직무에 종사함으로써 실제 휴직한 기간이 연속하여 1개월 이상이 되지 않는 경우, 그와 같은 휴직은 구 고용보험법 시행령(2020. 12. 29. 대통령령 제31324호로 개정되기 전의 것) 제19조 제1항 제3호가 정한 적법한 고용유지조치의 휴직 요건을 충족하지 못하므로 고용유지지원금의 지급 대상이 되지 못한다. 따라서 사업주가 계획된 휴직기간 동안 소속 근로자를 근로하게 하는 등으로 계획된 휴직을 실제 시행하지 못하였음에도 마치 계획된 휴직을 모두 시행한 것과 같이 기재하여 고용유지지원금의 지급을 신청하고 이를 수령한 경우, 사업주는 계획된 휴직기간 중 휴직 대상 근로자가 실제 근무한 기간에 해당하는 고용유지지원금만을 거짓이나 그 밖의 부정한 방법으로 지급받았다고 할 것이 아니라, 휴직 대상 근로자가 ‘연속하여 1개월 이상의 휴직’이라는 고용유지조치의 휴직 요건을 충족하지 못한 기간에 해당하는 고용유지지원금을 거짓이나 그 밖의 부정한 방법으로 지급받았다고 보아야 한다.",
    "참조조문": "[1] 고용보험법 제35조 제1항, 제2항 / [2] 구 고용보험법 시행령(2020. 12. 29. 대통령령 제31324호로 개정되기 전의 것) 제19조 제1항 제3호(현행 제19조 제1항 제2호 참조) / [3] 고용보험법 제21조 제1항, 제35조, 구 고용보험법 시행령(2020. 12. 29. 대통령령 제31324호로 개정되기 전의 것) 제19조 제1항 제3호(현행 제19조 제1항 제2호 참조), 제56조, 고용보험법 시행규칙 제79조",
    "참조판례": "[1] 대법원 2006. 10. 27. 선고 2004두6105 판결, 대법원 2014. 9. 4. 선고 2012두21598 판결 / [2] 대법원 2009. 9. 10. 선고 2007두10440 판결(공2009하, 1655)",
    "판례내용": "【원고, 피상고인】 주식회사 ○○○ (소송대리인 법무법인 가원 담당변호사 정만선)\n【피고, 상고인】 중부지방고용노동청 강원지청장\n【원심판결】 서울고법 2024. 6. 26. 선고 (춘천)2022누1277 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 의하면, 다음 사실을 알 수 있다.\n  가. 원고는 영화관사업 등을 영위하는 주식회사로 춘천시 (이하 생략) 지상 건물에서 ‘(영화관명 생략)’ 영화관(이하 ‘이 사건 사업장’이라고 한다)을 운영하였다.\n  나. 원고는 2020. 3.부터 2020. 4.까지 사이에 피고에게 코로나바이러스 감염증-19로 매출이 급감하였음을 이유로 5회에 걸쳐 이 사건 사업장에서 근로하는 근로자들에 대한 고용유지조치(휴직) 계획신고서를 제출하였다.\n  다. 이후 원고는 위 계획대로 대상 근로자 전원에게 휴직을 시행하였음을 이유로 피고에게 각 고용유지조치기간에 대한 고용유지지원금을 신청하였다. 이에 따라 피고는 원고에게 고용유지지원금 합계 30,247,760원을 지급하였다.\n  라. 피고는 2020. 11. 2. ‘해당 사업장은 고용유지조치기간 중에 휴직 대상 근로자가 사업장에 출근·근로한 사실이 있는 등 고용유지조치계획과 다르게 부정한 방법으로 고용유지지원금을 수급하였다.’는 이유로, 고용보험법 제35조, 구 「고용보험법 시행령」(2020. 12. 29. 대통령령 제31324호로 개정되기 전의 것, 이하 같다) 제56조 및 「고용보험법 시행규칙」 제79조에 따라 원고에게 19,101,210원의 부정수급액 반환명령(이하 ‘이 사건 반환명령’이라고 한다), 38,202,420원의 추가징수처분(이하 ‘이 사건 추가징수처분’이라 하고, 이 사건 반환명령과 함께 지칭할 때에는 ‘이 사건 처분’이라고 한다) 및 고용유지지원금 지급제한 처분을 하였다.\n  2. 판단의 전제\n  가. 고용보험법 제21조 제1항은 고용조정의 지원에 관하여 ‘고용노동부장관이 경기의 변동, 산업구조의 변화 등에 따른 사업 규모의 축소, 사업의 폐업 또는 전환으로 고용조정이 불가피하게 된 사업주가 근로자에 대한 휴업, 휴직, 직업전환에 필요한 직업능력개발 훈련, 인력의 재배치 등을 실시하거나 그 밖에 근로자의 고용안정을 위한 조치를 하면 대통령령으로 정하는 바에 따라 그 사업주에게 필요한 지원을 할 수 있다.’고 규정하고 있다. 그 위임으로 구 「고용보험법 시행령」 제19조 제1항에서는 고용조정이 불가피하게 된 사업주가 고용유지조치를 취하여 그 고용유지조치기간과 이후 1개월 동안 고용조정으로 피보험자를 이직시키지 아니한 경우에 고용유지지원금을 지급한다고 하고, 제3호에서 그 고용유지조치 중 하나로 ‘1개월 이상 휴직을 부여하는 경우’를 규정하였다.\n고용보험법 제35조 제1항, 제2항에서는 ‘고용노동부장관은 거짓이나 그 밖의 부정한 방법으로 고용안정사업의 지원을 받은 자에 대하여 부정한 방법으로 지원받은 금액을 반환하도록 명하여야 한다. 반환을 명하는 경우에는 이에 추가하여 부정한 방법으로 지급받은 금액의 5배 이하의 금액을 징수할 수 있다.’는 취지로 규정하고 있다. 이때 고용노동부장관이 반환을 명할 수 있는 금액은 거짓이나 그 밖의 부정한 방법으로 지원받은 금액에 한정되고, 거짓이나 그 밖의 부정한 방법으로 지원받은 금액의 반환을 명하는 경우에 이에 추가하여 징수할 수 있는 금액 역시 그 거짓이나 그 밖의 부정한 방법으로 지원받은 금액을 기준으로 한다(대법원 2014. 9. 4. 선고 2012두21598 판결 참조).\n  나. 고용보험법 제21조 제1항의 위임에 따라 구 「고용보험법 시행령」 제19조 제1항 제3호는 고용유지지원금의 지급 대상이 되는 고용유지조치 중 하나로 \"1개월 이상 휴직을 부여하는 경우\"를 규정하고 있는데, 여기서 고용유지조치로서의 ‘휴직’에 해당하기 위해서는 근로자가 사업주의 조치로 인하여 직무에 종사하는 것이 금지된 기간이 연속하여 1개월 이상이어야 한다. 고용안정사업의 목적, 고용유지지원금의 성격, 고용유지지원금의 지급대상 및 범위에 관한 법령의 규정 내용 및 형식과 함께 일반적으로 ‘휴직’이라 함은 그 근로자의 지위를 그대로 두면서 ‘일정한 기간’ 그 직무에 종사하는 것을 금지시키는 사용자의 처분을 의미하고(대법원 2009. 9. 10. 선고 2007두10440 판결 참조), ‘기간’은 일정한 시점부터 다른 어느 일정한 시점까지의 연속된 시간적 간격을 말하는 점 등을 종합적으로 고려하여 보면 위와 같이 해석함이 타당하다.\n사업주가 근로자에게 1개월 이상의 휴직을 부여한다는 내용의 고용유지조치(휴직) 계획신고서를 제출하였으나, 근로자가 계획된 휴직기간 중 일부 기간 동안 사업주의 지시 등에 따라 실제 직무에 종사함으로써 실제 휴직한 기간이 연속하여 1개월 이상이 되지 않는 경우, 그와 같은 휴직은 구 「고용보험법 시행령」 제19조 제1항 제3호가 정한 적법한 고용유지조치의 휴직 요건을 충족하지 못하므로 고용유지지원금의 지급 대상이 되지 못한다. 따라서 사업주가 계획된 휴직기간 동안 소속 근로자를 근로하게 하는 등으로 계획된 휴직을 실제 시행하지 못하였음에도 마치 계획된 휴직을 모두 시행한 것과 같이 기재하여 고용유지지원금의 지급을 신청하고 이를 수령한 경우, 사업주는 계획된 휴직기간 중 휴직 대상 근로자가 실제 근무한 기간에 해당하는 고용유지지원금만을 거짓이나 그 밖의 부정한 방법으로 지급받았다고 할 것이 아니라, 휴직 대상 근로자가 ‘연속하여 1개월 이상의 휴직’이라는 고용유지조치의 휴직 요건을 충족하지 못한 기간에 해당하는 고용유지지원금을 거짓이나 그 밖의 부정한 방법으로 지급받았다고 보아야 한다.\n  3. 원심의 판단\n  원심은 다음과 같은 이유로 이 사건 처분을 전부 취소하였다.\n  가. 고용유지조치(휴직) 대상 근로자들 중 소외 1, 소외 2, 소외 3, 소외 4, 소외 5, 소외 6, 소외 7(이하 ‘소외 1 등’이라고 한다)의 경우, 계획된 휴직기간 중 일부 기간에 이 사건 사업장에 출근하여 근로를 제공한 사실을 인정할 수 있다. 위 근로자들에 대한 고용유지지원금은 실제 근무한 기간에 해당하는 부분만이 부정수급액에 해당한다. 그런데 이 사건 처분 중 소외 1 등에 관한 부분은 위 근로자들에 대한 고용유지지원금 전액을 부정수급으로 보아 반환을 명하고 추가징수액을 정하였으므로 위법하다.\n  나. 고용유지조치(휴직) 대상 근로자들 중 소외 8, 소외 9, 소외 10(이하 ‘소외 8 등’이라고 한다)의 경우, 위 근로자들에 대한 부정수급액의 범위를 특정할 구체적인 자료가 없고, 위 근로자들에 대한 고용유지지원금 전액이 부정수급에 해당한다고 볼 근거도 없다. 그런데 이 사건 처분 중 소외 8 등에 관한 부분 역시 위 근로자들에 대한 고용유지지원금 전액을 부정수급으로 보아 반환을 명하고 추가징수액을 정하였으므로 위법하다.\n  다. 일부 근로자의 경우(소외 8 등) 부정수급액 산정의 기준이 되는 근로자별 근로일수를 특정할 수 없고, 근로자별 근로일수를 특정할 수 있는 경우(소외 1 등)에도 근로자별 부정수급액을 산출하는 산식을 명확히 알 수 있는 근거자료가 없으므로, 이 사건 처분 전부를 취소할 수밖에 없다.\n  4. 대법원의 판단\n  가. 앞서 본 법리에 비추어 보면 사업주인 원고가 근로자인 소외 1, 소외 2, 소외 3, 소외 4, 소외 5, 소외 6, 소외 7, 소외 8, 소외 9, 소외 10에 대하여 1개월 이상의 휴직을 부여한다는 내용의 고용유지조치(휴직) 계획신고서를 제출하였음에도, 위 근로자들로 하여금 계획된 휴직기간 중 일부 기간 동안 실제 근로하게 한 경우, 원고가 ‘거짓이나 그 밖의 부정한 방법으로 지원받은 금액’은 ‘연속하여 1개월 이상의 휴직’이라는 고용유지조치의 휴직 요건을 충족하지 못한 기간에 해당하는 고용유지지원금이다.\n  나. 근로자 소외 1 등의 경우, 원심이 적법하게 확정한 사실관계에 의하더라도, 계획된 휴직기간 중 원고의 지시에 따라 근로를 제공함으로써 실제로 휴직한 기간이 연속하여 1개월 이상이 되지 않았음이 분명하다. 따라서 원심으로서는 원고가 위 근로자들에 대하여 수령한 고용유지지원금 전액을 ‘거짓이나 그 밖의 부정한 방법으로 지원받은 금액’에 해당한다고 판단하였어야 한다.\n  그럼에도 원심은, 원고가 위 근로자들에 대하여 지급받은 고용유지지원금 중 실제 근로일수에 해당하는 부분만이 ‘거짓이나 그 밖의 부정한 방법으로 지원받은 금액’에 해당한다는 전제에서 근로자별 부정수급액을 산출하는 산식을 명확히 알 수 있는 근거자료가 없다는 이유로 이 사건 처분 중 소외 1 등에 관한 부분을 전부 취소하였다. 여기에는 구 「고용보험법 시행령」 제19조 제1항 제3호에서 정한 고용유지조치의 휴직 요건 및 고용보험법 제35조 제1항, 제2항에서 규정하고 있는 ‘거짓이나 그 밖의 부정한 방법으로 지원받은 금액’에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다.\n  다. 근로자 소외 8 등의 경우, 원심으로서는 비록 위 근로자들의 정확한 근로일수를 특정할 수 없다고 하더라도, 계획된 전체 휴직기간, 개략적인 근무시기·일수 등을 종합하여 해당 근로자별로 실제로 휴직한 기간이 연속하여 1개월 이상이 되는지 살펴, 해당 근로자의 휴직기간이 연속하여 1개월 이상이 되지 않았다면, 해당 근로자에 관하여 원고가 수령한 고용유지지원금 전액을 ‘거짓이나 그 밖의 부정한 방법으로 지원받은 금액’에 해당한다고 판단하였어야 한다.\n  그럼에도 원심은, 원고가 위 근로자들에 대하여 지급받은 고용유지지원금 중 실제 근로일수에 해당하는 부분만이 ‘거짓이나 그 밖의 부정한 방법으로 지원받은 금액’에 해당한다는 전제에서, 근로자별 근로일수를 특정할 수 없다는 이유로 이 사건 처분 중 소외 8 등에 관한 부분을 전부 취소하였다. 여기에는 구 「고용보험법 시행령」 제19조 제1항 제3호에서 정한 고용유지조치의 휴직 요건 및 고용보험법 제35조 제1항, 제2항에서 규정하고 있는 ‘거짓이나 그 밖의 부정한 방법으로 지원받은 금액’에 관한 법리를 오해하여 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 있다.\n  5. 결론\n  그러므로 나머지 상고이유에 대한 판단을 생략한 채, 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 엄상필(재판장) 오경미(주심) 권영준 박영재"
  },

    "판시사항": "가설건축물의 건축주가 가설건축물의 존치기간을 연장하고자 하는 경우, 연장신고서에 배치도·평면도 및 대지사용승낙서를 첨부하여 시장 등에게 제출해야 하는지 여부(적극)",
    "판결요지": "건축법 제20조 제3항에 따르면, 일정한 용도의 가설건축물을 축조하려는 자는 대통령령으로 정하는 존치기간, 설치기준 및 절차에 따라 특별자치시장·특별자치도지사 또는 시장·군수·구청장(이하 ‘시장 등’이라 한다)에게 신고해야 한다. 이와 관련하여 건축법 시행령 제15조 제8항 본문은 ‘건축법 제20조 제3항에 따라 가설건축물의 축조신고를 하려는 자는 국토교통부령으로 정하는 가설건축물 축조신고서에 관계서류를 첨부하여 시장 등에게 제출하여야 한다.’고 규정하고, 구 건축법 시행규칙(2024. 12. 17. 국토교통부령 제1419호로 개정되기 전의 것, 이하 같다) 제13조 제1항은 가설건축물 축조신고서에 첨부해야 하는 ‘관계서류’로 ‘배치도·평면도 및 대지사용승낙서(다른 사람이 소유한 대지인 경우만 해당한다. 이하 같다)’를 명시하고 있다.\n  한편 건축법 시행령 제15조의2 제2항 제2호는 ‘존치기간을 연장하려는 가설건축물의 건축주는 해당 가설건축물이 신고 대상인 경우 존치기간 만료일 7일 전까지 시장 등에게 신고하여야 한다.’고 규정하고, 같은 조 제3항(이하 ‘준용규정’이라 한다)은 그 연장신고에 관하여 건축법 시행령 제15조 제8항 본문을 준용하되 이 경우 ‘축조신고’는 ‘존치기간 연장신고’로 본다고 규정한다.\n  위와 같은 관련 법령을 종합하여 해석하면, 가설건축물의 존치기간 연장신고를 하려는 사람은 연장신고서에 배치도·평면도 및 대지사용승낙서를 첨부하여 시장 등에게 제출해야 한다.\n  비록 구 건축법 시행규칙 제13조 제5항이 ‘가설건축물의 존치기간을 연장하고자 하는 자는 가설건축물 존치기간 연장신고서를 시장 등에게 제출하여야 한다.’고만 규정하고 있기는 하지만, 하위법령은 그 규정이 상위법령의 규정에 명백히 저촉되어 무효인 경우를 제외하고는 관련 법령의 내용과 입법 취지 및 연혁 등을 종합적으로 살펴 그 의미를 상위법령에 합치되는 것으로 해석해야 하는바, 위 준용규정에도 불구하고 그 하위법령인 구 건축법 시행규칙 제13조 제5항이 ‘관계서류’를 제외한 가설건축물 존치기간 연장신고서만을 제출서류로 한정하고 있다고 해석하는 것은 타당하지 않다.",
    "참조조문": "건축법 제20조 제3항, 건축법 시행령 제15조 제8항, 제15조의2 제2항 제2호, 제3항, 구 건축법 시행규칙(2024. 12. 17. 국토교통부령 제1419호로 개정되기 전의 것) 제13조 제1항, 제5항",
    "참조판례": "",
    "판례내용": "【원고, 상고인】 망 소외인의 소송수계인 원고 1 외 1인 (소송대리인 법무법인 로텍 담당변호사 조한직 외 5인)\n【피고, 피상고인】 과천시장 (소송대리인 정부법무공단 담당변호사 황순철 외 2인)\n【원심판결】 수원고법 2024. 1. 19. 선고 2023누10651 판결\n【주    문】\n  상고를 모두 기각한다.  상고비용은 원고들이 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 관련 법령 및 법리\n  가. 건축법 제20조 제3항에 따르면, 일정한 용도의 가설건축물을 축조하려는 자는 대통령령으로 정하는 존치기간, 설치기준 및 절차에 따라 특별자치시장·특별자치도지사 또는 시장·군수·구청장(이하 ‘시장 등’이라 한다)에게 신고하여야 한다. 이와 관련하여 건축법 시행령 제15조 제8항 본문은 ‘건축법 제20조 제3항에 따라 가설건축물의 축조신고를 하려는 자는 국토교통부령으로 정하는 가설건축물 축조신고서에 관계서류를 첨부하여 시장 등에게 제출하여야 한다.’고 규정하고, 구 건축법 시행규칙(2024. 12. 17. 국토교통부령 제1419호로 개정되기 전의 것, 이하 같다) 제13조 제1항은 가설건축물 축조신고서에 첨부해야 하는 ‘관계서류’로 ‘배치도·평면도 및 대지사용승낙서(다른 사람이 소유한 대지인 경우만 해당한다. 이하 같다)’를 명시하고 있다.\n한편 건축법 시행령 제15조의2 제2항 제2호는 ‘존치기간을 연장하려는 가설건축물의 건축주는 해당 가설건축물이 신고 대상인 경우 존치기간 만료일 7일 전까지 시장 등에게 신고하여야 한다.’고 규정하고, 같은 조 제3항(이하 ‘이 사건 준용규정’이라 한다)은 그 연장신고에 관하여 건축법 시행령 제15조 제8항 본문을 준용하되 이 경우 ‘축조신고’는 ‘존치기간 연장신고’로 본다고 규정한다.\n  나. 위와 같은 관련 법령을 종합하여 해석하면, 가설건축물의 존치기간 연장신고를 하려는 사람은 그 연장신고서에 배치도·평면도 및 대지사용승낙서를 첨부하여 시장 등에게 제출하여야 한다.\n비록 구 건축법 시행규칙 제13조 제5항이 ‘가설건축물의 존치기간을 연장하고자 하는 자는 가설건축물 존치기간 연장신고서를 시장 등에게 제출하여야 한다.’고만 규정하고 있기는 하지만, 하위법령은 그 규정이 상위법령의 규정에 명백히 저촉되어 무효인 경우를 제외하고는 관련 법령의 내용과 입법 취지 및 연혁 등을 종합적으로 살펴 그 의미를 상위법령에 합치되는 것으로 해석해야 하는바, 이 사건 준용규정에도 불구하고 그 하위법령인 구 건축법 시행규칙 제13조 제5항이 ‘관계서류’를 제외한 가설건축물 존치기간 연장신고서만을 제출서류로 한정하고 있다고 해석하는 것은 타당하지 않다.\n  2. 판단\n  가. 원심판결 이유와 기록에 의하면 다음과 같은 사실을 알 수 있다.\n  1) 소외인(이 사건 소송 계속 중 사망하였다. 이하 ‘망인’이라 한다)은 2006. 3. 7. 가설건축물 축조신고가 수리된 과천시 소재 농업용창고(연면적 48㎡, 1층 경량철골조, 이하 ‘이 사건 가설건축물’이라 한다)에 관하여 2022. 3. 10. 피고에게 가설건축물 존치기간 연장신고서를 제출하였다(이하 ‘이 사건 연장신고’라 한다).\n  2) 피고는 2022. 3. 11. 및 같은 달 21. 두 차례에 걸쳐 망인에게 이 사건 가설건축물 대지 소유자의 대지사용승낙서를 제출하라고 보완을 요구하였다.\n  3) 그런데도 망인이 대지사용승낙서를 제출하지 않자, 피고는 2022. 4. 4. 이 사건 연장신고를 반려하였다(이하 ‘이 사건 처분’이라 한다).\n  나. 원심은, 이 사건 연장신고에 관하여는 이 사건 준용규정에 따라 건축법 시행령 제15조 제8항 본문이 준용되므로 구 건축법 시행규칙 제13조 제1항에서 정한 ‘관계서류’인 배치도·평면도 및 대지사용승낙서가 연장신고서에 첨부되어야 한다고 판단하고, 이를 전제로 이 사건 처분이 적법하다고 보아 원고들의 청구를 기각하였다.\n  다. 이러한 원심의 판단은 앞서 본 법리에 따른 것으로서, 거기에 상고이유 주장과 같이 가설건축물의 존치기간 연장신고에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. 원고들이 상고이유에서 들고 있는 대법원 2018. 1. 25. 선고 2015두35116 판결은 이 사건 준용규정이 2018. 9. 4. 대통령령 제29136호로 신설되기 전에 선고된 것이어서 이 사건에 원용하기 적절하지 않다.\n  3. 결론\n  상고를 모두 기각하고 상고비용은 패소자가 부담하게 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오경미(재판장) 권영준 엄상필(주심) 박영재"
  },

    "판시사항": "[1] 부가가치세법 제10조 제7항 본문에서 정한 ‘위탁매매’의 의미 및 어떠한 계약이 일반의 매매계약인지 위탁매매계약인지 판단하는 기준\n\n [2] 처분문서에 나타난 당사자의 의사를 해석하는 방법\n\n [3] 국군복지단과 ‘위·수탁거래계약서’를 작성하고 군 마트에 화장품 등을 납품한 甲 주식회사가 위 제품의 판매가격에서 계약서에서 정한 복지금을 공제한 금액을 공급대가로 하여 부가가치세를 신고·납부하자, 관할 세무서장이 복지금과 관련하여 부가가치세 신고·납부를 누락했다며 甲 회사에 부가가치세를 경정·고지한 사안에서, 위 거래는 국군복지단이 자기 명의로 하되 타인인 甲 회사의 계산으로 제품을 판매한 위탁매매로서, 부가가치세법 제10조 제7항에 따라 국군복지단이 제품을 군인 등에게 판매할 때 甲 회사가 제품을 직접 공급한 것으로 보게 되어, 복지금을 포함한 제품의 판매가격 일체가 부가가치세의 과세표준인 공급대가에 포함된다고 볼 소지가 큰데도, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례",

    "판례내용": "【원고, 피상고인】                ○○○ 주식회사 (소송대리인 법무법인(유한) 태평양 외 1인)\n【피고, 상고인】 삼성세무서장 (소송대리인 법무법인 제연 외 1인)\n【원심판결】  서울고법 2023. 6. 20. 선고 2021누61279 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 각 상고이유보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요 \n  원심판결 이유와 기록에 따르면 다음과 같은 사실을 알 수 있다. \n  가. 원고는 화장품 등 도·소매업을 목적으로 설립된 회사이고, 국군복지단은 대한민국 국군 장병 및 그 가족(이하 ‘군인 등’이라 한다)의 복리후생 업무를 담당하는 국방부 직할부대이다.\n  나. 원고는 2013년경부터 국군복지단과 사이에 ‘위·수탁거래계약서’(이하 ‘이 사건 계약서’라 한다)를 작성하고, 국군복지단이 운영하는 군 마트에 화장품 등(이하 ‘이 사건 제품’이라 한다)을 납품하였다(이하 ‘이 사건 거래’라 한다).\n  다. 국군복지단은 매월 군인 등에 대한 이 사건 제품의 판매가격에서 이 사건 계약서에서 정한 복지금, 관리수수료, 카드수수료를 공제한 나머지 금액을 원고에게 지급하였고, 원고는 이 사건 제품의 판매가격에서 복지금을 공제한 금액을 공급대가로 하여 부가가치세를 신고·납부하였다. \n  라. 피고는, 원고가 이 사건 거래 과정에서 발생한 복지금(이하 ‘이 사건 복지금’이라 한다)과 관련하여 부가가치세의 신고·납부를 누락하였다고 보아 2018. 10. 2. 원고에게 2013년 제2기분부터 2018년 제1기분까지의 부가가치세(각 가산세 포함)를 경정·고지하였다(이하 ‘이 사건 처분’이라 한다).\n  2. 원심의 판단\n  원심은 판시와 같은 이유로, 이 사건 거래는 원고가 국군복지단에 이 사건 제품의 판매를 위탁한 것으로 보기 어렵고, 이에 따라 원고가 이 사건 제품을 군인 등에게 직접 공급하였다거나 이 사건 복지금이 이 사건 제품의 공급대가에 포함된다고 볼 수 없으므로, 이와 다른 전제에서 이루어진 이 사건 처분은 위법하다고 판단하였다.\n  3. 대법원의 판단\n  위와 같은 원심의 판단은 그대로 수긍하기 어렵다. \n  가.                부가가치세법 제10조 제7항 본문은 ‘위탁매매에 의한 매매를 할 때에는 위탁자가 직접 재화를 공급하거나 공급받은 것으로 본다.’고 규정하고 있다. 여기에서 위탁매매란 자기의 명의로 타인의 계산에 의하여 물품을 구입 또는 판매하고 보수를 받는 것으로서 명의와 계산의 분리를 본질로 하는 것이므로, 어떠한 계약이 일반의 매매계약인지 위탁매매계약인지는 계약의 명칭 또는 형식적인 문언을 떠나 그 실질을 중시하여 판단하여야 한다(대법원 2008. 5. 29. 선고 2005다6297 판결, 대법원 2011. 7. 14. 선고 2011다31645 판결 등 참조).\n  한편 처분문서는 진정성립이 인정되면 특별한 사정이 없는 한 처분문서에 기재되어 있는 문언의 내용에 따라 당사자의 의사표시가 있었던 것으로 객관적으로 해석하여야 한다. 당사자 사이에 계약의 해석을 둘러싸고 이견이 있어 처분문서에 나타난 당사자의 의사해석이 문제 되는 경우에는 문언의 내용, 약정이 이루어진 동기와 경위, 약정에 의하여 달성하려는 목적, 당사자의 진정한 의사 등을 종합적으로 고찰하여 논리와 경험칙에 따라 합리적으로 해석하여야 한다(대법원 2001. 2. 27. 선고 99다23574 판결, 대법원 2024. 8. 1. 선고 2024다227699 판결 등 참조).\n  나. 원심판결 이유를 위와 같은 법리 및 기록에 비추어 본다.\n  1) 이 사건 계약서는 그 명칭이 ‘위·수탁거래 계약서’일 뿐 아니라, 그 내용 중에는 ‘위·수탁거래 계약이란 국군복지단이 업체가 납품한 상품을 국군복지단 명의로 판매 후 일정액의 수수료를 공제한 상품 판매대금을 업체에 지급하는 형태의 계약을 말한다(제1조).’는 정의와 함께, 이 사건 제품과 같은 방식으로 군 마트에서 판매되는 물품을 ‘업체가 국군복지단에 판매를 위탁한 물품’ 내지는 ‘위탁물품’으로 칭하는 부분(제2조) 등이 포함되어 있다. 이와 같은 이 사건 계약서의 명칭 및 문언내용에 의하면, 원고는 일반매매와 같이 국군복지단을 직접 상대방으로 하여 이 사건 제품을 판매하고자 한 것이 아니라, 오히려 국군복지단 운영의 군 마트를 찾는 군인 등에 대한 판매를 위탁하는 계약을 체결한 것이라고 볼 소지가 있다.\n  2) 원고는 군 마트에 이 사건 제품을 공급한 즉시 국군복지단으로부터 그 대가를 지급받은 것이 아니라, 국군복지단이 군인 등에게 이 사건 제품을 판매한 대금에서 이 사건 계약서에서 정한 복지금, 판매수수료, 카드수수료를 각각 공제한 나머지를 매월 정기적으로 지급받았다. 특히 복지금은 이 사건 계약서에서 미리 정한 계산방식에 따라 이 사건 제품 판매가격에 일정 비율을 곱하는 방식으로 산정되었다. 이와 같이 국군복지단에 귀속되는 복지금은 판매실적에 연동하여 구체적인 액수가 정해진다는 점에서 위탁매매인이 통상적으로 실적에 따라 위탁자로부터 받는 수수료와 유사하다고 볼 수 있다.\n  3) 만약 이 사건 계약서에서 정해진 바와 달리 국군복지단이 원고로부터 이 사건 제품을 일정 가격에 매입한 후 군인 등에게 판매하는 방식을 취한 것이라면, 국군복지단으로서는 이 사건 제품의 판매 여하에 따라 이익을 얻거나 손실이 생길 가능성에 직접 노출되었을 것이고, 그에 따라 국군복지단이 자기 책임과 계산 아래 이 사건 제품을 구입 및 판매한 것으로 평가할 여지도 있었을 것이다. 그러나 실제로 국군복지단은 이 사건 제품을 판매한 후 정산을 거쳐 사전에 정하여진 계산방식에 따른 복지금 등만 얻는 데에 그친 반면, 원고는 이 사건 계약서 제8조 및 제13조 등에 따라 국군복지단에 이 사건 제품을 납품한 이후에도 위 제품이 군인 등에게 판매되기까지의 일련의 과정에서 생기는 모든 비용과 제품의 손·망실, 훼손 등에 따른 위험을 부담한 것으로 보인다. 나아가 원고는 이 사건 계약서 제10조에 정해진 바와 같이 이 사건 제품의 판매대금 중 국군복지단에 지급할 복지금 등을 차감한 나머지 부분을 국군복지단으로부터 이전받을 권리를 취득·보유하였다. 이로써 이 사건 제품의 판매로 인한 경제적 효과는 실질적으로 원고에게 귀속되었다고 할 수 있다. \n  4) 이 사건 제품의 판매가격은 원고의 시중최저판매가에 원고가 입찰 당시 제시한 할인율 등을 적용하여 결정되었고, 국군복지단은 이 사건 제품이 계약 당시 시중최저판매가보다 낮은 가격으로 판매되는 것이 확인되는 경우에만 예외적으로 원고에게 판매가격 인하 등의 조치를 취해줄 것을 요구할 수 있었다. 이에 비추어 보면, 이 사건 제품에 대한 가격결정권이 원고가 아닌 국군복지단에 있었다고 보기 어렵다. \n  5) 이 사건 거래에 관하여 원고와 국군복지단은 일반적인 물품공급계약과 마찬가지로 공급자를 ‘원고’, 공급받는 자를 ‘국군복지단’으로 하여 세금계산서를 수수하였다. 그러나 앞서 본 이 사건 계약서의 내용이나 정산 구조 등에 비추어 볼 때, 이와 같은 세금계산서의 명의 및 형태만으로 국군복지단이 자신의 계산으로 이 사건 제품을 군인 등에게 판매한 것이었다거나, 원고와 국군복지단 사이에 이 사건 제품에 관하여 부가가치세 과세대상인 ‘재화의 공급’이 별개 독립적으로 이루어졌다고 단정하기 어렵다.\n  6) 요컨대, 이 사건 거래는 국군복지단이 자기 명의로 하되 타인인 원고의 계산으로 이 사건 제품을 판매한 위탁매매로서, 부가가치세법 제10조 제7항에 따라 국군복지단이 이 사건 제품을 군인 등에게 판매할 때 원고가 이 사건 제품을 직접 공급한 것으로 보게 되어, 이 사건 복지금을 포함한 이 사건 제품의 판매가격 일체가 부가가치세의 과세표준인 공급대가에 포함된다고 볼 소지가 크다.\n  다. 그런데도 원심은 판시와 같은 이유만으로 이 사건 거래가 위탁매매가 아니라고 보아 이 사건 복지금이 이 사건 제품의 공급대가에 포함되지 않는다고 판단하였다. 이러한 원심의 판단에는 위탁매매의 판단 방법 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 상고이유 주장은 이유 있다.  \n  4. 결론\n  원심판결을 파기하고 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 노경필(재판장) 이흥구(주심) 오석준 이숙연"
