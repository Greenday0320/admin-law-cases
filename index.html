    "판례내용": "【원고, 상고인】 원고\n【피고, 피상고인】 대통령기록관장 (소송대리인 정부법무공단 담당변호사 류태경 외 4인)\n【원심판결】 서울고법 2019. 2. 21. 선고 2018누59672 판결\n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유(상고이유서 제출기간이 지난 뒤에 제출된 상고이유보충서의 기재는 이를 보충하는 범위에서)를 판단한다. \n  1. 사안의 개요 \n  원심판결 이유와 기록에 의하면 다음 사실을 알 수 있다. \n  가. 원고는 2017. 5. 8. 피고에게 \"황교안 대통령 권한대행이 보호기간을 정하여 국가기록원에 이관한 ‘대통령지정기록물’ 중 세월호 참사가 발생한 2014. 4. 16. 대통령비서실, 대통령경호실, 국가안보실에서 세월호 승객을 구조하기 위한 공무 수행을 위하여 생산하거나 접수한 문서의 목록(공공기관의 정보공개에 관한 법률에 따라 문서 제목, 생산연도, 업무담당자 포함)\"(이하 ‘이 사건 정보’라 한다)에 관하여 정보공개청구를 하였다. \n  나. 피고는 2017. 5. 22. 이 사건 정보가 「대통령기록물 관리에 관한 법률」(이하 ‘대통령기록물법’이라 한다) 제17조에 따라 ‘대통령지정기록물’로 지정되었으므로, 「공공기관의 정보공개에 관한 법률」(이하 ‘정보공개법’이라 한다) 제9조 제1항 제1호의 비공개대상 정보에 해당한다는 이유로 비공개 결정(이하 ‘이 사건 처분’이라 한다)을 하였다.\n  2. 대통령지정기록물에 대한 보호기간 제도\n대통령기록물법은, 제17조 제1항 각호에 해당하는 정보를 ‘대통령지정기록물’이라 하고, 대통령지정기록물에 대하여는 열람·사본제작 등을 허용하지 않거나 자료제출의 요구에 응하지 않을 수 있는 기간(이하 ‘보호기간’이라 한다)을 따로 정할 수 있도록 하고 있다. \n  대통령은 대통령기록물을 대통령기록관으로 이관하기 전에 대통령기록물생산기관의 장의 의견을 참고하여 대통령지정기록물을 지정하고 그 보호기간을 정해야 하며(대통령기록물법 제17조 제2항, 같은 법 시행령 제9조 제1항, 제2항), 그 보호기간은 15년의 범위 이내에서 정할 수 있다(대통령기록물법 제17조 제3항 본문). \n  대통령지정기록물에 대하여 보호기간이 정해지면, 그 보호기간 중에는 ① 국회재적의원 3분의 2 이상의 찬성의결이 이루어진 경우(대통령기록물법 제17조 제4항 제1호), ② 관할 고등법원장이 해당 대통령지정기록물이 중요한 증거에 해당한다고 판단하여 발부한 영장이 제시된 경우(같은 법 제17조 제4항 제2호), ③ 대통령기록관 직원이 기록관리 업무수행상 필요에 따라 대통령기록관의 장의 사전 승인을 받은 경우(같은 법 제17조 제4항 제3호), ④ 해당 기록물이 접수·생산된 시기에 재임하였던 전직대통령 또는 그가 지정한 대리인에 대한 경우(같은 법 제18조 제1항, 제2항)를 제외하고는 열람, 사본제작 및 자료제출이 허용되지 않고, 다른 법률에 따른 자료제출의 요구 대상에 포함되지도 않는다. \n  3. 대통령지정기록물 보호기간 설정행위에 대한 사법심사\n  가. 사법심사의 가능성 \n  1) 대통령기록물법 제17조에서 정한 대통령지정기록물 보호기간 제도의 취지는 외교적·정치적으로 민감한 사안에 대한 기록이 대통령의 임기가 끝난 직후 곧바로 공개될 경우 또 다른 정쟁의 대상이 될 수 있고 그 때문에 대통령이 그 임기 내에 민감한 사안에 관하여 기록 자체를 생산하지 않을 수 있으므로, 대통령이 지정한 일정한 범위의 기록물에 대하여는 퇴임 후 일정기간 철저하게 보호함으로써 대통령의 원활한 기록 생산을 도모하려는 데에 있다. \n그런데 보호기간이 정해진 대통령지정기록물이 다른 일반적인 정보와 마찬가지로 공개가 원칙이라고 이해될 경우 위와 같은 대통령지정기록물 보호기간 제도의 취지에 역행하는 결과가 초래될 수 있다. 따라서 대통령지정기록물을 지정하고 이에 대하여 보호기간을 정한 대통령의 행위(이하 ‘보호기간 설정행위’라 한다)가 현저히 불합리하다고 볼 만한 명백한 사정이 없는 한, 법원으로서는 원칙적으로 그 결정을 최대한 존중함으로써 보호기간 설정행위의 효력이 사후에 함부로 부정되지 않도록 하는 것이 바람직하다.\n  2) 그러나 대통령지정기록물 보호기간 제도의 취지가 퇴임 후의 정쟁 등을 미연에 방지하기 위해 일정기간 공개를 제한하는 것이라고 하더라도, 대통령의 보호기간 설정행위는 대통령기록물법에서 정한 절차와 요건을 준수하여야만 비로소 적법하게 효력을 갖게 되는 것이므로, 보호기간 설정행위의 효력 유무에 대한 사법심사가 대통령기록물법에 의해 배제된다고 볼 수는 없다. 그 구체적 이유는 다음과 같다. \n  가) 대통령의 보호기간 설정행위는 국회가 제정한 대통령기록물법에 근거하여 이루어지는 행위이므로 근거 법률이 정한 요건과 절차에 따라 이루어져야 한다. 보호기간 설정행위가 실제 법률에서 정한 요건과 절차에 따라 이루어져 효력이 있는지를 심사할 권한이 사법부에 있다는 점은 헌법이 정하고 있는 권력분립의 원칙상 당연하다. \n  나) 대통령기록물법은 국정운영의 투명성과 책임성을 높이는 것을 목적으로 하면서(제1조) 이를 위해 대통령기록물을 공개하는 것을 원칙으로 하고 있다(제16조 제1항 본문). 그런데 대통령지정기록물에 대한 보호기간 설정 권한이 남용되어 대통령기록물법 제17조 제1항 각호에 해당하지 않는 정보에 대하여도 포괄적으로 보호기간이 정해질 경우, 국민의 정당한 알권리의 대상이 되는 대통령기록물마저 상당히 오랜 기간 공개되지 못하여 국민의 알권리를 과도하게 제약하는 결과가 초래된다. 이와 같은 결과는 대통령기록물법의 입법 목적에 반한다. \n대통령기록물법 제17조 제4항이 대통령지정기록물에 대하여는 공개 절차나 방법을 엄격히 제한하고 있으나, 이 또한 해당 기록물이 대통령기록물법 제17조 제1항 각호의 요건을 갖추어 적법하게 보호기간이 정해진 기록물임을 전제로 한 것이다. 대통령기록물법 제17조 제4항을 이유로 대통령의 보호기간 설정행위가 사법심사의 범위에서 제외된다고 볼 수는 없다.\n  다) 대통령기록물법상 보호기간을 두어 열람 등이 제한되는 대통령지정기록물은 대통령기록물법이 정한 적법한 절차에 따라 지정된 것을 의미한다. 따라서 대통령기록물법상의 절차를 준수하지 않은 채 보호기간이 지정된 대통령지정기록물은 대통령기록물법 제17조에서 정한 보호를 받을 수 없다. 이때 해당 기록물이 적법한 절차를 거쳐 대통령지정기록물로 지정되고 보호기간이 정해졌는지 여부는 사법심사를 통해 결정될 수밖에 없다. \n  라) 보호기간 설정행위의 요건을 정한 대통령기록물법 제17조 제1항 각호는 ‘기록물의 유형’에 해당하는 부분[법령에 따른 군사·외교·통일에 관한 비밀기록물(제1호), 대내외 경제정책이나 무역거래 및 재정에 관한 기록물(제2호), 정무직공무원 등의 인사에 관한 기록물(제3호), 개인의 사생활에 관한 기록물(제4호), 대통령과 관련된 의사소통기록물(제5호), 대통령의 정치적 견해나 입장을 표현한 기록물(제6호)]과 그 ‘기록물을 공개할 경우 저해될 우려가 있는 공익’의 부분[국가안전보장(제1호), 국민경제의 안정(제2호), 개인 및 관계인의 생명·신체·재산 및 명예(제4호), 공개의 부적절성(제5호), 정치적 혼란(제6호)]으로 나누어져 있다. 대통령은 여기에 규정된 ‘기록물의 유형’에 대응하여 고유하게 설정된 ‘특정한 공익’의 보호를 위해서만 보호기간 설정행위를 할 수 있다. \n  어떠한 기록물이 대통령기록물법 제17조 제1항 각호에서 정한 ‘기록물의 유형’에 해당하지 않음이 명백함에도 대통령이 이를 대통령지정기록물로 지정하고 보호기간을 설정하였다면 그 보호기간 설정행위는 대통령기록물법을 위반한 것으로서 효력을 인정할 수 없다. 이 또한 사법심사를 통해 결정될 수밖에 없다. \n  나. 보호기간이 정해진 대통령지정기록물에 대한 문서제출의무  \n  1) 대통령기록물법 제17조 제4항은 보호기간이 정해진 대통령지정기록물의 경우 그 보호기간 동안 다른 법률에 따른 자료제출의 요구 대상에 포함되지 아니한다고 규정하고 있다. 그러나 대통령이 특정 정보를 대통령지정기록물로 지정하여 보호기간을 정한 행위에 대한 사법심사 과정에서 그 적법성을 의심할 만한 상당한 이유가 있음에도 행정청이 법원에 대하여 그 정보의 제출을 거부할 수 있다고 한다면, 보호기간 설정행위의 적법성에 관한 실질적인 재판이 이루어질 수 없어 헌법 제27조 제1항이 보장한 국민의 재판청구권이 침해될 수 있다. 더구나 법원이 정보공개법 제20조 제2항에 따라 보호기간이 정해진 대통령지정기록물을 비공개로 열람·심사할 경우 그 대통령지정기록물이 공개됨으로 인해 초래되는 외교적·정치적 혼란을 피할 수 있으므로 법원의 심사과정에서 공익에 대한 위해가 발생한다고 보기도 어렵다.  \n따라서 정보공개 거부처분을 다투는 항고소송에서, 해당 정보를 대통령지정기록물로 지정하고 보호기간을 정한 행위의 적법성을 심사하기 위해 정보공개법 제20조 제2항에 따라 비공개 열람·심사가 이루어지는 경우에는 행정청이 대통령기록물법 제17조 제4항을 근거로 그 자료제출을 거부할 수 없다고 해석하는 것이 헌법을 최고법규로 하는 통일적인 법질서의 형성을 위한 합헌적 법률해석의 원칙에 부합한다.\n  2) 다만 보호기간 중에 있는 대통령지정기록물의 열람 및 제출을 엄격히 제한하는 대통령기록물법 제17조 제4항의 취지를 고려할 때, 법원으로서는 우선 피고로 하여금 다툼의 대상이 되는 정보의 유형, 해당 정보를 대통령지정기록물로 보아 보호기간을 정한 절차 및 그 실질적인 이유, 이를 공개하지 않는 사유, 동종의 정보에 대하여 보호기간을 정한 사례의 유무 등의 간접사실에 의하여 해당 정보에 적법하게 보호기간이 정해졌는지를 증명하도록 하여야 한다. 법원은 피고가 제출한 간접사실만으로 그 증명이 충분하지 않아 보호기간을 정한 행위의 적법성을 의심할 만한 상당한 이유가 있는 때에 비로소 정보공개법 제20조 제2항에 따라 피고로 하여금 다툼의 대상이 된 정보를 제출하도록 하여 비공개 열람·심사를 진행할 수 있다고 할 것이다.\n  4. 원심의 심리미진 등\n  이러한 법리에 비추어 이 사건에 관하여 보면, 원심으로서는 피고에 대하여 이 사건 정보가 대통령기록물법 제17조 제1항 각호 중 어느 사유에 해당하는지 구체적으로 석명하고, 이에 따라 이 사건 정보가 적법하게 대통령지정기록물로 지정되고 보호기간이 정해졌는지에 관한 심리를 거쳐 판단하였어야 한다. \n  그런데도 원심은, 이 사건 정보가 대통령기록물법 제17조 제1항에 따라 대통령지정기록물로 지정되어 보호기간 중에 있고, 피고에게 그 지정행위의 유·무효 또는 적법 여부의 증명책임이 없다는 이유로 이 사건 처분이 위법하지 않다고 판단하였다. 원심의 판단에는 이 사건 정보에 대한 대통령지정기록물 지정행위의 적법 여부에 관한 판단을 누락하거나, 필요한 심리를 다하지 아니하여 판결 결과에 영향을 미친 잘못이 있다.  \n  5. 결론\n  그러므로 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 엄상필(재판장) 이흥구(주심) 오석준 이숙연"
  }
]
</script>
<script>
  (function() {
    const cases = JSON.parse(document.getElementById('cases-data').textContent);
    document.getElementById('notice-count').innerHTML = `<strong>총 ${cases.length}건</strong> · 2025년 대법원 행정 판례부터 수집 중`;
    const list = document.getElementById('list');
    cases.forEach((c, i) => {
      const div = document.createElement('div');
      div.className = 'case';
      const date = c.선고일자 ? `${c.선고일자.slice(0,4)}.${c.선고일자.slice(4,6)}.${c.선고일자.slice(6,8)}` : '';
      div.innerHTML = `
        <div class="doc-card" data-idx="${i}">
          <span class="doc-date">${date}</span>
          <span class="doc-title">${c.사건명}</span>
          <span class="doc-tag">${c.사건번호}</span>
        </div>
        <div class="case-body" id="body-${i}">
          ${field('판시사항', c.판시사항)}
          ${field('판결요지', c.판결요지)}
          ${field('참조조문', c.참조조문)}
          ${field('참조판례', c.참조판례)}
          ${field('전문', c.판례내용, true)}
        </div>
      `;
      list.appendChild(div);
    });

    list.addEventListener('click', (e) => {
      const header = e.target.closest('.doc-card');
      if (!header) return;
      const body = document.getElementById(`body-${header.dataset.idx}`);
      body.classList.toggle('open');
    });
  })();

  function field(label, text, isFullText) {
    if (!text) return '';
    return `
      <div class="field">
        <h4>${label}</h4>
        <p class="${isFullText ? 'full-text' : 'box'}">${escapeHtml(text)}</p>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
