    "판시사항": "구 법인세법 제93조 제8호 단서 후문에서 ‘사용’의 의미 / 국내 미등록 특허권의 대상이 되는 제조방법·기술·정보 등이 국내에서 사용된 경우, 그 대가인 사용료소득이 국내원천소득에 해당하는지 여부(적극)",
    "판결요지": "",
    "참조조문": "구 법인세법(2017. 12. 19. 법률 제15222호로 개정되기 전의 것) 제93조 제8호, 대한민국과 미합중국간의 소득에 관한 조세의 이중과세 회피와 탈세방지 및 국제무역과 투자의 증진을 위한 협약 제2조 제2항, 제6조 제3항, 제14조 제4항 제a호",
    "참조판례": "대법원 2025. 9. 18. 선고 2021두59908 전원합의체 판결(공2025하, 1938)",
    "판례내용": "【원고, 피상고인】                ○○○ 코퍼레이션[(영문명 생략) Corporation] (소송대리인 변호사 김동욱)\n【피고, 상고인】 기흥세무서장\n【원심판결】  수원고법 2021. 11. 5. 선고 2020누14850 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 수원고등법원에 환송한다. \n\n【이    유】  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면 다음과 같은 사실을 알 수 있다.\n  가. 원고는 미국법인으로서 2017. 7. 24. △△△ 주식회사(이하 ‘소외 회사’라고 한다)와 사이에, 국내외에 등록된 20개의 특허권(이하 이 중 국내에 등록된 1개를 제외한 ‘국내 미등록 특허권’ 19개를 ‘이 사건 특허권’이라고 한다)에 관하여 소외 회사에 라이선스를 허여하고 사용료를 지급받는 내용의 특허권 라이선스 계약을 체결하였다. \n  나. 소외 회사는 2017 사업연도에 위 계약에 따른 사용료 명목으로 원고에게 미화 295만 달러를 지급하고, 피고에게 이에 대한 원천징수분 법인세를 납부하였다.  \n  다. 원고는, 위 사용료 중 이 사건 특허권에 대한 사용대가 부분(이하 ‘이 사건 사용료’라고 한다)은「대한민국과 미합중국간의 소득에 관한 조세의 이중과세 회피와 탈세방지 및 국제무역과 투자의 증진을 위한 협약」(이하 ‘한미조세협약’이라고 한다)에 따라 원천징수대상이 되는 국내원천소득이 아니라는 이유로, 2019. 10. 22. 피고에게 납부된 원천징수분 법인세의 일부 환급을 구하는 경정청구를 하였다. 그러나 피고는 2019. 12. 9. 원고의 경정청구를 거부하였다.  \n  2. 관련 규정\n  가. 한미조세협약 제14조 제4항은 \"본 조에서 사용되는 ‘사용료’라 함은 다음의 것을 의미한다.\"라고 규정하면서, 제a호에서 ‘문학·예술·과학작품의 저작권 또는 영화필름·라디오 또는 텔레비전 방송용 필름 또는 테이프의 저작권, 특허, 의장, 신안, 도면, 비밀공정 또는 비밀공식, 상표 또는 기타 이와 유사한 재산 또는 권리, 지식, 경험, 기능, 선박 또는 항공기의 사용 또는 사용권에 대한 대가로서 받는 모든 종류의 지급금’을 규정한다. 제6조는 \"이 협약의 목적상 소득의 원천은 다음과 같이 취급된다.\"라고 규정하면서, 제3항에서 \"제14조 제4항에 규정된 재산의 사용 또는 사용할 권리에 대하여 동 조항에 규정된 사용료는 어느 체약국 내의 동 재산의 사용 또는 사용할 권리에 대하여 지급되는 경우에만 동 체약국 내에 원천을 둔 소득으로 취급된다.\"라고 규정한다. 제2조 제2항 전문(前文)은 \"이 협약에서 사용되나 이 협약에서 정의되지 아니한 기타의 용어는, 달리 문맥에 따르지 아니하는 한, 그 조세가 결정되는 체약국의 법에 따라 내포하는 의미를 가진다.\"라고 규정한다.\n  나. 구 법인세법(2017. 12. 19. 법률 제15222호로 개정되기 전의 것, 이하 같다) 제93조는 \"외국법인의 국내원천소득은 다음 각 호와 같이 구분한다.\"라고 규정하면서, 제8호에서 \"다음 각 목의 어느 하나에 해당하는 권리·자산 또는 정보(이하 이 호에서 ‘권리 등’이라고 한다)를 국내에서 사용하거나 그 대가를 국내에서 지급하는 경우 그 대가 및 그 권리 등을 양도함으로써 발생하는 소득. 다만 소득에 관한 이중과세 방지협약에서 사용지를 기준으로 하여 그 소득의 국내원천소득 해당 여부를 규정하고 있는 경우에는 국외에서 사용된 권리 등에 대한 대가는 국내 지급 여부에도 불구하고 국내원천소득으로 보지 아니한다. 이 경우 특허권, 실용신안권, 상표권, 디자인권 등 권리의 행사에 등록이 필요한 권리(이하 이 호에서 ‘특허권 등’이라고 한다)는 해당 특허권 등이 국외에서 등록되었고 국내에서 제조·판매 등에 사용된 경우에는 국내 등록 여부에 관계없이 국내에서 사용된 것으로 본다.\"라고 규정한다.\n  3. 국내 미등록 특허권에 대한 사용료가 국내원천소득에 해당하는지 여부(제1, 2, 3 상고이유)\n  가. 관련 법리 \n  한미조세협약은 구 법인세법 제93조 제8호에서 규정하는 ‘사용지를 기준으로 하여 사용료소득의 국내원천소득 해당 여부를 규정하고 있는 이중과세 방지협약’에 해당한다. 한미조세협약에 따른 ‘사용지’를 확정하려면 먼저 ‘사용’의 의미를 명확히 할 필요가 있다. 그런데 한미조세협약은 ‘사용’의 의미를 별도로 정의하고 있지 않다. 그러므로 한미조세협약 제2조 제2항 전문에 따라 ‘사용’의 의미는 조세가 결정되는 체약국인 우리나라의 법에 따라 해석하여야 한다. 이와 관련하여 구 법인세법 제93조 제8호 단서 후문은 국내 미등록 특허권이 국내 제조·판매 등에 사용된 경우에는 국내 등록 여부에 관계없이 국내에서 사용된 것으로 본다고 규정한다. 여기서 ‘사용’은 독점적 효력을 가지는 특허권 자체를 사용하는 것이 아니라 그 특허권의 대상이 되는 제조방법·기술·정보 등(이하 ‘특허기술’이라고 한다)을 사용한다는 의미로 보아야 한다. 따라서 국내 미등록 특허권의 특허기술이 국내에서 사용되었다면 그 대가인 사용료소득은 국내원천소득에 해당한다(대법원 2025. 9. 18. 선고 2021두59908 전원합의체 판결 참조). \n  나. 이 사건에 관한 판단\n  앞서 본 사실관계를 위 법리에 비추어 살펴보면, 이 사건 사용료가 이 사건 특허권의 대상인 특허기술을 국내에서의 제조·판매 등에 사실상 사용하는 데에 대한 대가인 경우, 이는 한미조세협약 제6조 제3항, 제14조 제4항 제a호, 구 법인세법 제93조 제8호 단서 후문에 따라 국내 사용에 대한 사용료로서 국내원천소득에 해당한다. 그런데도 원심은, 이 사건 사용료가 국내 미등록 특허권에 대한 것이라는 이유만으로, 그 특허기술이 국내에서의 제조·판매 등에 사실상 사용되었는지를 살피지 아니한 채 곧바로 국내원천소득에 해당하지 않는다고 판단하였다. 이러한 원심의 판단에는 한미조세협약상 국내 미등록 특허권에 대한 사용료의 국내원천소득 해당 여부에 관한 법리를 오해한 나머지 필요한 심리를 다하지 아니하여 판결에 영향을 미친 잘못이 있다.\n  4. 결론\n  나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 엄상필(재판장) 오경미(주심) 권영준 박영재"

    "판례내용": "【원고, 상고인】                원고 (소송대리인 법무법인 정행인 담당변호사 이창희)\n【피고, 피상고인】 농업협동조합중앙회\n【원심판결】  부산고법 2024. 5. 29. 선고 (창원)2023누11507 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 부산고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 의하면 다음 사실이 인정된다.\n  가. 피고는 구 조세특례제한법(2022. 12. 31. 법률 제19199호로 개정되기 전의 것, 이하 ‘구 조세특례제한법’이라 한다) 제106조의2 제7항에 따른 면세유류 관리기관이다. \n  나. 원고는 경남 산청군 ○○면 (이하 생략)을 사업장소재지로 하여 ‘○○주유소’라는 상호로 사업자등록을 한 석유판매업자이다. 원고는 2008. 5. 29. 피고로부터 구 조세특례제한법 제106조의2 제7항, 「농·축산·임·어업용 기자재 및 석유류에 대한 부가가치세 영세율 및 면세 적용 등에 관한 특례규정」 제20조의2 제2항에 따라 농어민 등에게 면세유를 판매할 수 있는 석유판매업자로 지정(이하 ‘면세유류판매업자 지정’이라 한다)되었다.\n  다. 소외인은 2022. 6. 6. 원고에게 면세유류 구입카드(9441-17**-****-6374, 이하 ‘이 사건 면세유류 구입카드’라 한다)를 이용하여 316,000원의 결제를 요청하였고, 원고는 농협은행으로부터 위 거래에 관한 승인을 받았다. 원고가 같은 날 위 거래에 관하여 발행한 카드매출전표에는 거래 품목이 ‘경유 200ℓ, 면세유: 농기계’라고 기재되어 있다.\n  라. 국립농산물품질관리원 경남지원 산청사무소장은 소외인이 2022. 6. 6. 원고에게 위와 같이 이 사건 면세유류 구입카드로 농업용 면세유인 경유 200ℓ(이하 ‘이 사건 면세유’라 한다)의 대금을 결제하고서는 실제로 원고로부터 이 사건 면세유가 아닌 보일러용 등유를 공급받은 행위를 적발하여, 원고로부터 \"2022. 6. 6. 농업인 소외인이 경유 200ℓ를 주문하여 농장에 배달요청 갔으나, 소외인이 농장에는 필요 없으니 집으로 등유로 변경하여 배달해 달라고 하셔서 등유로 변경하여 배달하였습니다. 기존 결제된 내역은 취소하지 않았습니다.\"라는 내용의 확인서를 제출받고, 2022. 7. 19. 피고에게 해당 사실을 통보하였으며, 그 무렵 원고의 주유소 소재지를 관할하는 진주세무서장에게도 같은 내용의 통보를 하였다.\n  마. 한편 원고는 위와 같이 소외인으로부터 이 사건 면세유류 구입카드로 이 사건 면세유 대금 결제를 받고 이 사건 면세유가 아닌 등유를 공급하였음에도, 2022년 제1기 부가가치세 확정신고를 하면서 이 사건 면세유 구입 당시 부담한 부가가치세 매입세액 39,010원을 매출세액에서 공제되는 매입세액으로 신고하고, 이 사건 면세유에 관하여 부담한 교통·에너지·환경세 52,600원, 교육세 7,890원 합계 60,490원(= 52,600원 ＋ 7,890원)의 환급을 신청하여, 위 각 세액 합계 99,500원(= 39,010원 + 60,490원)을 환급·공제받았다. 이에 진주세무서장은 2022. 8. 1. 원고에 대하여 원고가 신청한 환급·공제세액이 신청하여야 할 환급·공제세액을 초과하였다는 이유로 구 조세특례제한법 제106조의2 제12항 제3호 (가)목에 따라 합계 99,500원의 부가가치세, 교통·에너지·환경세, 교육세(이하 ‘부가가치세 등’이라 한다) 감면세액을 추징하였으나, (나)목에서 정한 가산세는 추징하지 아니하였다.\n  바. 피고는 2022. 8. 3. 원고에 대하여 위와 같이 감면세액의 추징사유가 발생하였다는 이유로 구 조세특례제한법 제106조의2 제13항에 따라 면세유류판매업자 지정을 취소하는 처분(이하 ‘이 사건 처분’이라 한다)을 하였다.\n  2. 처분사유 부존재 주장에 대하여\n  가. 원심은 판시와 같은 이유로, 원고에게 구 조세특례제한법 제106조의2 제12항 제3호 (가)목에서 정한 감면세액 추징사유가 발생하였으므로, 이 사건 처분의 처분사유가 인정된다고 판단하였다.\n  나. 위 사실관계를 관련 법리에 비추어 살펴보면, 원심판단에 상고이유 주장과 같이 구 조세특례제한법 제106조의2에서 정한 감면세액 추징사유와 면세유류판매업자 지정 취소 등에 관한 법리를 오해하거나 논리와 경험의 법칙을 위반하여 자유심증주의의 한계를 벗어나는 등으로 판결에 영향을 미친 잘못이 없다.\n  3. 재량권 일탈·남용 주장에 대하여\n  가. 제재적 행정처분이 재량권의 범위를 일탈하였거나 남용하였는지는, 처분사유인 위반행위의 내용과 그 위반의 정도, 그 처분에 의하여 달성하려는 공익상의 필요와 개인이 입게 될 불이익 및 이에 따르는 여러 사정 등을 객관적으로 심리하여 공익침해의 정도와 처분으로 인하여 개인이 입게 될 불이익을 비교·교량하여 판단하여야 한다(대법원 2022. 4. 14. 선고 2021두60960 판결 등 참조).\n  나. 원심은, 구 조세특례제한법 제106조의2의 입법 목적과 연혁, 면세유류를 공급하는 면세유류 판매업자에 의하여 이루어지는 면세유 부정유통에 대한 제재 필요성, 원고의 위반행위 경위와 그 정도 등을 고려하면, 이 사건 처분이 재량권을 일탈·남용하였다고 인정하기 어렵다고 판단하였다.\n  다. 그러나 원심의 판단은 다음과 같은 이유에서 수긍하기 어렵다.\n  1)                구 조세특례제한법 제106조의2는 대통령령으로 정하는 농민, 임업에 종사하는 자 및 어민(이하 ‘농어민 등’이라 한다)이 농업·임업 또는 어업에 사용하기 위한 석유류에 대해 부가가치세 등의 세금을 감면하도록 규정하고 있다(이하 위 제도를 ‘면세유 제도’라 한다). 면세유 제도의 입법 취지는 농기계 등에 사용할 목적으로 공급되는 석유류에 대해서 부가가치세 등을 감면함으로써 관련 비용을 절감시켜 농어민 등의 소득증대를 지원하는 한편, 농기계 등의 보급을 촉진하여 농어업생산성을 제고함과 동시에 농어촌 노동력 부족 현상에 대비하기 위한 것이다. 면세유 제도가 그 입법 목적을 달성하기 위해서는 면세유가 실제로 농어민 등에게 공급되고, 또한 그 면세유가 실제로 농어업에 사용되어야 한다(헌법재판소 2010. 12. 28. 선고 2009헌바171 전원재판부 결정 참조). 따라서 면세유 제도의 실효성을 확보하고 조세정의를 실현하기 위하여 면세유 부정 유통에 대하여는 원칙적으로 엄중하게 제재할 필요성을 부정할 수는 없지만, 그러한 경우에도 행정청으로서는 제재처분을 할 때 행정기본법 제22조 제2항, 같은 법 시행령 제3조에 따라 위반행위의 동기, 목적 및 방법, 위반행위의 결과, 위반행위의 횟수, 위반행위자의 귀책사유 유무와 그 정도, 위반행위자의 법 위반상태 시정·해소를 위한 노력 유무를 고려하여 재량권을 적정하게 행사하여야 한다.\n  석유판매업자는 농어민 등에게 면세유를 공급한 경우 그 신청에 따라 부가가치세 등 면제되는 세액을 환급·공제받을 수 있다(구 조세특례제한법 제106조의2 제2항, 제1항 제1호). 그런데 위와 같이 석유판매업자가 신청한 부가가치세 등 환급·공제세액이 신청하여야 할 환급·공제세액을 초과하는 경우 면세유류판매업자 지정을 취소할 수 있고, 면세유류판매업자 지정이 취소된 석유판매업자는 지정취소일부터 5년간 면세유류판매업자 지정 신청을 할 수 없게 된다(구 조세특례제한법 제106조의2 제13항 제1호, 제12항 제3호). 이처럼 면세유류판매업자 지정 취소 처분이 석유판매업자에 미치는 영향이 중대함에도 구 조세특례제한법령은 면세유류판매업자 지정 취소 처분을 할 수 있는 기준이나 이를 면제할 수 있는 사유를 따로 정하고 있지 아니하다. 따라서 면세유류판매업자 지정 취소 처분에 재량권 일탈·남용의 위법이 인정되는지는 부가가치세 등 환급·공제 초과 신청 경위와 그 횟수 및 액수, 면세유 부정 유통 결과 발생 여부 또는 그 위험성의 정도, 과거 동종 위반 행위 유무 및 반복 가능성 등 여러 사정을 종합적으로 살펴 해당 면세유류판매업자 지정 취소 처분으로 달성하려는 공익 목적과 그 처분으로 인하여 석유판매업자가 입게 될 불이익을 비교·형량하여 판단하여야 할 것이다.\n  2) 원심판결 이유와 기록에 의하여 알 수 있는 다음 사정을 앞서 본 법리에 비추어 살펴보면, 면세유 부정 유통에 대한 엄중한 제재의 필요성을 고려하더라도, 이 사건 처분은 재량권을 일탈·남용한 것으로서 위법하다고 볼 여지가 크다.\n  가) 원고는 일관하여 ‘당초 농어민 소외인에게 이 사건 면세유를 공급하려 하였으나 소외인의 요청에 따라 보일러용 등유를 공급하였고, 이후 이 사건 면세유류 구입카드로 결제한 내역을 미처 취소하지 못하였다.’고 주장하고 있고, 소외인 역시 원심법원에 같은 취지의 탄원서를 제출하였다.\n  나) 원고가 운영하는 주유소의 면세유 판매로 인한 매출액은 2019년도 401,632,560원, 2020년도 343,936,408원, 2021년도 465,438,550원으로, 전체 매출액의 약 37%~38%에 달한다. 그런데 초과 신청된 원고의 부가가치세 등 환급·공제 내역은 이 사건 면세유에 관한 것뿐이고, 이 사건 면세유의 양은 200ℓ, 그 가액은 316,000원, 초과 환급·공제 세액은 99,500원에 불과하다. 위와 같은 사정을 감안하면, 원고의 이 사건 면세유에 관한 부가가치세 등 초과 환급·공제 신청이 이 사건 면세유 판매를 가장한 고의적인 세액 탈루 목적으로 이루어진 것이라고 단정하기는 어렵고, 오히려 원고가 주장하는 바와 같이 부가가치세 등 환급·공제 신청 과정에서의 착오 또는 과실로 인한 것이라고 볼 여지가 있다.\n  다) 원고가 소외인에게 공급하지 아니한 이 사건 면세유를 일반 유류로서 공급하는 등 이를 부정 유통하였다고 볼 만한 사정은 찾아볼 수 없다. 오히려 구 조세특례제한법 제106조의2 제12항 제3호에 따르면, 석유판매업자가 부당한 방법으로 면세유에 관한 부가가치세 등 초과 환급·공제 신청을 한 경우에는 감면세액의 40%에 해당하는 금액의 가산세 또한 추징하도록 정하고 있는데, 진주세무서장은 원고에 대하여 위 규정에 따른 가산세를 추징하지 아니하였다.\n  라) 원고가 2008. 5. 29. 피고로부터 면세유류판매업자 지정을 받은 이래 2022. 8. 3. 이 사건 처분을 받기까지 약 14년간 위 적발 사실 이외에 구 조세특례제한법을 위반하였다고 볼 만한 자료도 없다.\n  마) 앞서 본 바와 같이 원고의 위반행위가 이 사건 면세유 판매를 가장한 세액의 탈루 목적으로 이루어진 것이라고 단정하기 어렵고, 오히려 부가가치세 등 환급·공제 신청 과정에서의 착오 또는 과실로 인한 것이라고 볼 여지가 상당한 사정 등을 고려하면, 원고에게 동종 위반 행위의 반복 가능성이 있다고 단정하기 어렵다.\n  바) 이 사건 처분에 따라 원고는 면세유류판매업자 지정취소일부터 5년간 면세유류판매업자 지정 신청조차 할 수 없게 되고, 여기에 원고가 운영하는 주유소의 면세유 판매로 인한 매출액이 상당한 점 등을 보태어 보면, 이 사건 처분으로 인하여 원고의 생계에 미치는 영향도 적지 아니할 것으로 보인다.\n  3) 그런데도 원심은 이 사건 처분에 재량권 일탈·남용의 위법이 있다고 보기 어렵다는 전제 아래 이 사건 처분이 적법하다고 판단하였다. 이러한 원심판단에는 재량권 일탈·남용에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 원고의 상고이유 주장은 이유 있다.\n  4. 결론\n  그러므로 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 권영준(재판장) 오경미 엄상필 박영재(주심)"

    "판례내용": "【원고, 피상고인】                ○○동청년주택피에프브이 주식회사 (소송대리인 법무법인(유한) 세종 담당변호사 박형우 외 3인)\n【피고, 상고인】 영등포구청장 (소송대리인 법무법인 이스턴 담당변호사 김도형)\n【원심판결】  서울고법 2021. 10. 1. 선고 2020누47436 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 피고가 부담한다.\n\n【이    유】  1. 사안의 개요\n  가. 이 사건의 쟁점\n  구 지방세특례제한법(2018. 12. 24. 법률 제16041호로 개정되기 전의 것) 제31조 제1항(이하 ‘이 사건 감면규정’이라고 한다)에 따라 감면세율을 적용받을 수 있는 임대사업자는, 임대용 부동산 취득일부터 60일 이내에 해당 임대용 부동산을 임대목적물로 하여 임대사업자로 등록할 것이 요구된다. 이 사건의 쟁점은 피고가 임대목적물이 기재된 임대사업자 등록신청을 수리하면서 임대목적물이 특정되어 기재되지 않은 임대사업자등록증을 교부한 경우에도, 이 사건 감면규정상 감면요건인 임대사업자 등록요건을 갖추었다고 볼 수 있는지이다.\n  나. 원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면 다음과 같은 사실을 알 수 있다.\n  1) 서울특별시장은 2018. 9. 6. 서울특별시 고시 제1028-281호로 서울 영등포구 ○○동2가 (지번 생략) 6,316.4㎡(이하 ‘이 사건 토지’라고 한다)를 구 「민간임대주택에 관한 특별법」(2018. 12. 18. 법률 제16000호로 개정되기 전의 것, 이하 ‘구 민간임대주택법’이라고 한다) 제22조, 제24조, 구 「서울시 역세권 청년주택 공급지원에 관한 조례」(2018. 10. 4. 서울특별시 조례 제6936호로 개정되기 전의 것) 제9조에 따라 ‘영등포 ○○동2가 역세권 청년주택(기업형 임대주택) 공급촉진지구’로 지정하고, 이에 대하여 같은 법 제28조에 따른 지구계획을 승인하며, 같은 법 제29조 제1항 제6호, 「국토의 계획 및 이용에 관한 법률」 제30조에 따른 도시관리계획(지구단위계획구역 및 계획)을 결정하였다.\n  서울특별시장은 같은 날 서울특별시고시 제2018-282호로 사업시행자를 주식회사 △△△(이하 ‘소외 1 회사’라고 한다)와 이 사건 토지의 당시 소유자인 소외 2로 하여 이 사건 토지 지상에 2개 동, 지하 6층 지상 19층, 연면적 52,667.495㎡ 규모의 공동주택(공공임대 87세대 및 민간임대 409세대) 등을 신축하는 ‘영등포 ○○동2가 역세권 청년주택(기업형 임대주택) 신축공사사업’(이하 ‘이 사건 사업’이라고 한다)을 구 민간임대주택법 제33조 제1항, 주택법 제15조에 따른 주택건설사업계획으로 승인(건축법 제11조에 의한 건축허가 의제 포함)하였다.\n  2) 원고는 이 사건 사업의 수행을 위한 자산의 매입 및 운용, 계약의 체결 등을 목적으로 소외 1 회사에 의해 설립된 프로젝트 금융투자회사이다. 즉, 원고는 당초부터 이 사건 토지를 취득하여 그 지상에 공공지원민간임대주택을 건축한 후 이를 임대하기 위한 목적으로 2018. 11. 5. 설립되었다.\n  3) 원고는 2018. 11. 20. 이 사건 토지에 관하여 종전 토지소유자이자 사업시행자(공동)이던 소외 2로부터 소유권이전등기를 받았고, 같은 날 바로 피고에게 이 사건 토지를 임대목적물(민간임대주택의 소재지)로 하여 임대사업자 등록신청을 하면서(이하 ‘이 사건 1차 등록신청’이라고 한다), 이 사건 토지의 취득에 관하여 이 사건 감면규정에 의한 감면세율을 적용한 취득세 등을 신고하였다.\n  그런데 피고가 ‘주택건설사업계획승인서상의 명의인(사업시행자)과 임대사업자등록 신청 명의인이 다르다.’는 이유로 위 등록신청을 처리하지 않은 채 보류하자, 원고는 추후 사업시행자 변경에 따라 원고가 사업시행자 지위를 취득하면 다시 임대사업자 등록신청을 하기로 하여 2018. 12. 7.경 이 사건 1차 등록신청을 취하하였다.\n  4) 이 사건 사업의 시행자를 변경(지위 이전)하는 것은 서울특별시 주택공급과에서 담당하는 업무인데, 원고가 위와 같이 이 사건 1차 등록신청을 취하한 이후로도 그 사업시행자 변경 방법(절차)에 관하여 서울특별시의 방침이 정해지지 아니한 채 이 사건 사업의 시행자를 소외 2에서 원고로 변경(재지정)하는 절차가 계속 지연되자, 원고는 이 사건 토지를 취득한 날로부터 60일이 되는 날인 2019. 1. 19.이 경과하기 전까지 임대사업자 등록을 마치기 위해 2019. 1. 15. 다시 이 사건 토지를 임대목적물로 기재하여 임대사업자등록 신청을 하였다(이하 ‘이 사건 2차 등록신청’이라고 한다). 당시 원고는 사업자등록증과 정관 등 투자회사임을 확인할 수 있는 서류를 첨부하여 제출하는 한편, 이 사건 토지를 ‘민간임대주택의 소재지’로 기재하여 이 사건 토지를 임대목적물로 하여 임대사업자 등록을 하여 줄 것을 피고 측에 요청하였다.\n  5) 그러나 피고의 담당자(주택과)는, 원고가 제출한 이 사건 2차 등록신청을 수리하면서도, 이 사건 토지를 임대목적물로 하여 임대사업자등록을 할 수 있는지에 관하여는 국토교통부에 질의하여 그 회신에 따라 처리하기로 하면서 일단 내부 전산상으로만 이 사건 토지를 임대목적물로 가등록한 채 임대목적물 기재가 없는 임대사업자 등록증을 발급하였다. 그 후 위 담당자는 국토교통부의 회신에 따라 원고에게 이 사건 토지를 임대목적물로 하여 등록하는 것은 불가하다고 통보하고 내부 전산상 임대목적물로 가등록해 놓았던 이 사건 토지를 삭제하였다.\n  6) 피고는 2019. 4. 15. 원고가 이 사건 토지의 취득일로부터 60일 이내에 임대목적물을 등록하지 아니하여 이 사건 감면규정이 정한 감면요건에 해당하지 않는다는 점을 근거로 원고에게 이 사건 토지에 대한 취득세 1,021,678,670원, 지방교육세 102,167,870원, 농어촌특별세 51,083,930원, 가산세 126,841,390원 합계 1,301,771,860원을 부과하였다.\n  2. 판단\n  가. 이 사건 감면규정은, 구 민간임대주택법에 따른 임대사업자가 임대할 목적으로 공동주택을 건축하는 경우 그 공동주택에 대하여는 2018. 12. 31.까지 그 전용면적 등에 따라 지방세를 감면하되, 이때 위 임대사업자는 임대용 부동산 취득일부터 60일 이내에 해당 임대용 부동산을 임대목적물로 하여 임대사업자로 등록한 경우를 말한다고 규정하고 있다.\n  구 민간임대주택법 제2조 제7호는, ‘임대사업자’를 「공공주택 특별법」 제4조 제1항에 따른 공공주택사업자가 아닌 자로서 1호 이상의 민간임대주택을 취득하여 임대하는 사업을 할 목적으로 같은 법 제5조에 따라 등록한 자로 정의하는 한편, 위 제5조는 주택을 임대하려는 자는 특별자치시장·특별자치도지사·시장·군수 또는 구청장(이하 ‘시장·군수·구청장’이라고 한다)에게 등록을 신청할 수 있다고 규정하면서(제1항), 이에 따른 등록 및 신고의 기준과 절차 등에 필요한 사항은 대통령령으로 정하도록 하고 있다(제4항). 이러한 위임에 따라 구 「민간임대주택에 관한 특별법 시행령」(2018. 12. 31. 대통령령 제29460호로 개정되기 전의 것, 이하 ‘구 민간임대주택법 시행령’이라고 한다) 제4조 제1항은 구 민간임대주택법 제5조 제1항에 따라 임대사업자로 등록할 수 있는 자에 관하여, 민간임대주택으로 등록할 주택을 소유한 자(제1호), 민간임대주택으로 등록할 주택을 취득하려는 계획이 확정되어 있는 자로서 각 목의 어느 하나에 해당하는 자(제2호), 민간임대주택으로 등록할 주택을 취득하려는 제2호 외의 자로서 각 목의 어느 하나에 해당하는 자(제3호)를 그 대상으로 정하고 있다. 이에 따라 위 각 호에 해당하는 경우에는 구 민간임대주택법 제5조에 따라 임대사업자등록이 가능하게 되는데, 구체적으로 어떠한 경우에 해당 임대용 부동산을 임대목적물로 하여 임대사업자등록을 할 수 있는지에 관하여는 그 기준 등이 구 민간임대주택법령에 명확하게 마련되어 있지 않다. 단지 구 민간임대주택법 시행령 제4조는, 구 민간임대주택법 제5조 제1항에 따라 임대사업자로 등록하려는 자는 신청서에 국토교통부령으로 정하는 서류를 첨부하여 임대사업자의 주소지를 관할하는 시장·군수·구청장 또는 해당 민간임대주택의 소재지를 관할하는 시장·군수·구청장에게 제출하여야 한다고 규정하고(제3항), 이러한 신청서를 받은 임대사업자의 주소지를 관할하는 시장·군수·구청장은 등록기준에 적합한지를 확인한 후 적합한 경우에는 등록대장에 올리고 신청인에게 등록증을 발급하여야 한다고 규정하고 있을 뿐이다(제5항). 또한 구 민간임대주택에 관한 특별법 시행규칙(2018. 12. 31. 국토교통부령 제573호로 개정되기 전의 것) 제2조 제1항은, 구 민간임대주택법 제5조 제1항 및 구 민간임대주택법 시행령 제4조 제3항에 따라 임대사업자로 등록하려는 자는 [별지 제1호 서식]의 임대사업자 등록신청서에 소정의 서류를 첨부하여 시장·군수·구청장에게 제출하여야 한다고 정하고 있고, 그 [별지 제1호 서식]인 임대사업자 등록신청서에는 임대목적물에 관한 사항을 적을 수 있는 ‘민간임대주택의 소재지’란이 마련되어 있고, 임대주택신청서의 접수 후의 처리절차에 관하여 등록기준 적합 여부 확인(서류 검토), 임대사업자 등록대장 등재, 임대사업자 등록증 작성 및 등록증 발급, 등록내용 통보의 순서로 처리된다고 기재되어 있을 따름이다.\n  이와 같은 임대사업자등록 신청의 처리절차 및 관계 규정들의 내용을 종합하면, 구 민간임대주택법령에 따른 임대사업자등록 신청은 이른바 ‘수리를 요하는 신고’라고 보아야 한다. 그러므로 임대사업자등록 신청이 아직 수리되지 아니한 채 구 민간임대주택법 관련 규정의 요건을 충족한 것만으로 임대사업자등록의 효력이 발생한다고 볼 수 없고, 이에 대한 행정청의 수리처분까지 있어야 비로소 신청한 대로 임대사업자등록의 효력이 생기게 된다. 다만 이때의 수리는 신청을 유효한 것으로 판단하고 법령에 의하여 처리할 의사로 이를 수령하는 수동적 행위를 의미할 뿐, 임대사업자 등록대장의 등재나 임대사업자 등록증의 작성 및 등록증 발급까지 요하는 것은 아니다. 그러므로 어느 임대목적물에 관하여 임대사업자등록 신청이 이미 수리된 후에 임대사업자 등록대장이나 임대사업자 등록증에 해당 신청서에 기재된 임대목적물에 관한 사항과 다른 기재가 이루어졌다 하더라도, 그러한 사정만으로 해당 임대목적물에 관하여 이미 발생한 임대사업자등록의 효력이 달라진다고 볼 수는 없다.\n  나. 원심은 판시와 같은 사실을 인정한 다음, 원고의 이 사건 토지 취득에 관하여 이 사건 감면규정상 ‘임대용 부동산 취득일부터 60일 이내에 해당 임대용 부동산을 임대목적물로 하여 임대사업자로 등록하여야 한다.’는 요건이 충족되었다고 판단하였다. 즉, 이 사건 감면규정상 임대목적물 등록요건을 갖추었는지 여부를 판단함에 있어 임대사업자등록증에 임대목적물이 특정되어 기재되었는지 여부는 필수적 요소는 아니라고 전제한 뒤, 원고는 이 사건 2차 등록신청 당시 구 민간임대주택법 시행령 제4조 제1항 제3호 (다)목에 해당하는 투자회사로서 이 사건 토지에 관하여 임대사업자등록을 신청하였고 피고가 이러한 신청을 수리한 이상, 구 민간임대주택법 시행령 제4조 제1항 제3호 (다)목에 따라 이 사건 토지를 임대목적물로 하는 임대사업자등록의 효력이 발생하게 되었다는 것이다.\n  관계 규정 및 법리와 기록에 비추어 살펴보면, 이러한 원심의 판단은 정당하다. 거기에 상고이유 주장과 같이 이 사건 감면규정상 취득세 감면의 요건 및 조세법률주의에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  3. 결론\n  상고를 기각하고 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 엄상필(재판장) 오경미(주심) 권영준 박영재"

    "판결요지": "자본시장과 금융투자업에 관한 법률(이하 ‘자본시장법’이라 한다) 제246조 제5항은 본문에서 \"집합투자재산을 보관ㆍ관리하는 신탁업자는 자신이 보관ㆍ관리하는 집합투자재산을 자신의 고유재산, 다른 집합투자재산 또는 제3자로부터 보관을 위탁받은 재산(이하 통틀어 ‘다른 집합투자재산 등’이라 한다)과 거래하여서는 아니 된다.\"라고 규정하고, 같은 항 단서에서 ‘집합투자재산을 효율적으로 운용하기 위하여 필요한 경우로서 대통령령이 정하는 경우’에 한하여 그와 같은 거래를 허용하고 있다.\n  이는 신탁업자가 보관ㆍ관리하는 집합투자재산과 다른 집합투자재산 등 사이의 거래로 말미암아 발생할 수 있는 이해관계 충돌을 방지하고 집합투자재산별 독립성 및 그 운용의 투명성을 엄격히 보장함으로써 자본시장의 공정성과 신뢰성을 확보하기 위한 것이다. 이러한 취지에 비추어 보면, 자본시장법 제246조 제5항 본문에서 금지하는 ‘거래’란, 특별한 사정이 없는 한 신탁업자가 보관ㆍ관리하는 집합투자재산과 다른 집합투자재산 등 사이에서 이루어지는 재산의 이전 또는 그 재산에 관한 권리ㆍ의무의 발생ㆍ변경ㆍ소멸의 의사로써 행하는 일체의 재산상 행위를 의미한다.\n  신탁업자가 보관ㆍ관리하는 집합투자재산을 대상으로 이루어지는 행위가 위 조항의 ‘거래’에 해당하는지는, 그 행위의 성질과 내용, 목적, 경위, 이로 인하여 발생되는 법적 효과, 당사자들의 진정한 의사, 그 행위를 통하여 얻는 신탁업자 또는 관계인들의 이익, 당시의 거래관행, 행위 이후의 정황 등 여러 사정을 종합적으로 고려하여 구체적ㆍ개별적으로 판단해야 한다.",
    "참조조문": "자본시장과 금융투자업에 관한 법률 제246조 제5항",
    "참조판례": "",
    "판례내용": "【원고, 상고인】                주식회사 ○○은행 외 1인 (소송대리인 법무법인(유한) 해광 외 10인)\n【피고, 피상고인】 금융위원회 외 1인 (소송대리인 정부법무공단 담당변호사 류태경 외 2인)\n【원심판결】  서울고법 2024. 3. 27. 선고 2023누58413 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 서면들의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 따르면 다음 사실을 알 수 있다.\n  가. 「자본시장과 금융투자업에 관한 법률」(이하 ‘자본시장법’이라 한다) 제8조 제7항에서 규정한 신탁업자인 원고 주식회사 ○○은행(이하 ‘원고 1 은행’이라 한다)은 2010. 3. 29. 집합투자업자인 △△△자산운용 주식회사(이하 ‘소외 1 회사’라 한다)와 신탁계약(이하 ‘이 사건 신탁계약’이라 한다)을 체결하고, 소외 1 회사가 설정한 자본시장법상 투자신탁 형태로 된 집합투자기구 4개(이하 ‘이 사건 각 펀드’라 한다) 등의 집합투자재산을 보관ㆍ관리하였다. \n  나. 이 사건 신탁계약 제6조는 \"은행계정대(원고 1 은행의 고유재산 재무상태표 중 부채 항목에는 ‘신탁계정차’로 계상된다)\"에 대하여 ‘미운용현금자산이라 함은 소외 1 회사가 투자신탁재산을 투자대상자산에 운용하고 남은 현금을 말하고, 미운용현금자산을 신탁계약에서 정한 바에 따라 신탁업자(원고 1 은행)의 고유계정에 대여한다.’는 취지로 규정하였고, 그에 따라 원고 1 은행은 소외 1 회사의 미운용현금자산을 소외 1 회사(신탁계정)가 원고 1 은행(고유계정)에 대여한 돈으로 보아 그에 대한 이자를 지급하였다. \n  다. 원고 1 은행은 은행계정대를 집합투자기구별로 구분하지 않고 집합투자업자 단위로 개설하여 관리해 왔고, 이 사건 각 펀드를 비롯하여 소외 1 회사가 설정ㆍ운용하고 원고 1 은행이 보관ㆍ관리하는 모든 집합투자기구의 각 미운용현금자산 역시 마찬가지로 하나의 은행계정대에서 함께 관리하였다.\n  라. 피고 금융위원회는 2022. 3. 2. 원고 1 은행에 대하여, 3차례에 걸쳐 소외 1 회사의 은행계정대를 감소시키거나(이하 ‘이 사건 제1차 은행계정대 조정’이라 한다), 소외 1 회사의 은행계정대를 증감시키면서 □□자산운용 주식회사(이하 ‘소외 2 회사’라 한다)의 은행계정대를 감소시키는 행위(이하 ‘이 사건 제2, 3차 은행계정대 조정’이라 하고, 제1, 2, 3차 은행계정대 조정을 합쳐 ‘이 사건 각 은행계정대 조정’이라 한다)를 함으로써 자본시장법 제246조 제5항 소정의 ‘보관ㆍ관리하는 집합투자재산 간 거래 금지’ 등을 위반하였다는 이유로 자본시장법 제420조 제3항에 따라 ‘집합투자재산 신탁업 중 전문사모집합투자기구 재산의 신규 수탁업무’를 3개월간 정지하는 처분을 하였다. \n  마. 피고 금융감독원장은 2022. 3. 16. 원고 1 은행 소속으로 집합투자업자 수탁업무 등을 총괄하던 원고 2에 대하여 위와 같은 이유로 정직 3개월의 조치를 할 것을 원고 1 은행에 요구하였다(이하 피고 금융위원회의 원고 1 은행에 대한 업무정지 처분 및 피고 금융감독원장의 원고 2에 대한 징계조치 요구를 합쳐 ‘이 사건 각 처분’이라 한다).\n  2. 원심의 판단\n  원심은 판시와 같은 이유로, 이 사건 각 은행계정대 조정은 집합투자재산 사이의 권리ㆍ의무 변동을 초래하는 재산상 행위이므로 자본시장법 제246조 제5항 위반에 해당한다고 판단하여, 이 사건 각 처분이 위법하다고 주장하는 원고들의 청구를 모두 기각하였다. \n  3. 대법원의 판단\n  가.                자본시장법 제246조 제5항은 본문에서 \"집합투자재산을 보관ㆍ관리하는 신탁업자는 자신이 보관ㆍ관리하는 집합투자재산을 자신의 고유재산, 다른 집합투자재산 또는 제3자로부터 보관을 위탁받은 재산(이하 통틀어 ‘다른 집합투자재산 등’이라 한다)과 거래하여서는 아니 된다.\"라고 규정하고, 같은 항 단서에서 ‘집합투자재산을 효율적으로 운용하기 위하여 필요한 경우로서 대통령령이 정하는 경우’에 한하여 그와 같은 거래를 허용하고 있다.\n  이는 신탁업자가 보관ㆍ관리하는 집합투자재산과 다른 집합투자재산 등 사이의 거래로 말미암아 발생할 수 있는 이해관계 충돌을 방지하고 집합투자재산별 독립성 및 그 운용의 투명성을 엄격히 보장함으로써 자본시장의 공정성과 신뢰성을 확보하기 위한 것이다. 이러한 취지에 비추어 보면, 자본시장법 제246조 제5항 본문에서 금지하는 ‘거래’라 함은, 특별한 사정이 없는 한 신탁업자가 보관ㆍ관리하는 집합투자재산과 다른 집합투자재산 등 사이에서 이루어지는 재산의 이전 또는 그 재산에 관한 권리ㆍ의무의 발생ㆍ변경ㆍ소멸의 의사로써 행하는 일체의 재산상 행위를 의미한다.\n  신탁업자가 보관ㆍ관리하는 집합투자재산을 대상으로 이루어지는 행위가 위 조항의 ‘거래’에 해당하는지는, 그 행위의 성질과 내용, 목적, 경위, 이로 인하여 발생되는 법적 효과, 당사자들의 진정한 의사, 그 행위를 통하여 얻는 신탁업자 또는 관계인들의 이익, 당시의 거래관행, 행위 이후의 정황 등 여러 사정을 종합적으로 고려하여 구체적ㆍ개별적으로 판단하여야 한다.\n  나. 원심판결 이유와 기록에 따르면 다음과 같은 사정을 알 수 있다.\n  1) 원고 1 은행 수탁영업부에서는 매 영업일마다 실제 입출금된 자금 변동액을 정산하는 마감업무를 수행한다. 그 업무는 집합투자업자별로 자금관리시스템의 은행계정대 마감표에 나타나는 \"신탁계정차 금액(‘은행계정대 변동액’과 동일하다)\"과 은행계정시스템상 \"대체불일치 금액(‘실제 입출금된 자금 변동액’과 동일하다)\"을 비교ㆍ확인하여 두 금액이 일치하는 경우 대체불일치 금액을 은행계정시스템의 \"원화신탁계정차\" 계정에 입력함으로써 이루어진다.\n  2) 이 사건 각 은행계정대 조정 당시 소외 1 회사는 이 사건 각 펀드 투자자들의 환매청구를 승인하였고 그 환매대금을 조달하기 위해 신탁업자인 원고 1 은행 등에 투자대상자산인 사채를 처분하도록 운용지시하였다. 투자자들에게 이 사건 각 펀드의 수익증권을 판매하였던 투자매매ㆍ중개업자들은 자신의 고유자금으로 투자자들에게 환매대금을 우선 지급한 후 원고 1 은행에 같은 액수의 환매대금 지급을 청구하였다.\n  3) 이 사건 제1차 은행계정대 조정 당시 원고 1 은행은 자신의 고유재산으로 투자매매ㆍ중개업자인 ◇◇증권 주식회사에 환매대금을 선지급하였으나 당일 마감시간이 지난 이후에도 사채상환금이 입금되지 않았고, 그 결과 소외 1 회사의 운용지시에 따른 은행계정대 변동액을 기록해야 하는 자금관리시스템상 은행계정대 액수와 은행계정시스템상 실제 자금 변동액이 일치하지 않아 은행 업무를 마감할 수 없었다.\n  원고 1 은행이 마감처리를 하려면 미입금된 사채상환금 상당액 차이의 불일치를 해소해야 했는데, 당시 원고 1 은행에는 자금관리시스템상 전체 은행계정대 액수와 은행계정시스템상 전체 집합투자업자별 자금 변동액이 불일치할 경우 마감업무 처리방법에 관한 지침이 존재하지 않았고, 은행계정시스템상 실제 자금 변동액을 임의로 수정할 수도 없었기 때문에, 원고 직원은 자금관리시스템에서 소외 1 회사의 은행계정대를 감소시키는 방식으로 마감업무를 처리하였다.\n  이 사건 제2, 3차 은행계정대 조정 당시에도 마찬가지로 원고 1 은행이 자신의 고유재산으로 투자매매ㆍ중개업자인 ☆☆투자증권 주식회사 등에 환매대금을 선지급하였으나 당일 마감시간까지 사채상환금이 입금되지 않았다. 그 결과 자금관리시스템상 전체 은행계정대 액수와 은행계정시스템상 전체 집합투자업자별 자금 변동액이 불일치하게 되었는데, 이 사건 제1차 은행계정대 조정 당시와 달리 소외 1 회사의 은행계정대를 조정하는 것만으로는 그 은행계정대가 마이너스 상태가 되어 마감처리를 할 수 없었기 때문에 원고 직원은 그 은행계정대 외에 소외 2 회사의 은행계정대까지 감소시키는 방식으로 마감업무를 처리하였다.\n  4) 구체적인 처리 방식을 살펴보면, 이 사건 각 은행계정대 조정 업무를 담당하였던 원고 직원들은 자금관리시스템상 결제내역 입금형태(감소)의 ‘기타자금’ 항목에 부족한 사채상환금 상당액을, 자금결제방식란에 ‘수기/해당무’ 등을 각 입력하였다. 이는 실제 자금집행과 연동되지 않는 입력항목으로서, 원고 직원들은 이 사건 각 은행계정대 조정이 실제 자금의 입출금과 관련이 없다는 의사로 위와 같이 입력한 것이다. 이로써 이 사건 각 은행계정대 조정 당일 자금관리시스템상 집합투자업자별 은행계정대 총액이 은행계정시스템상 실제 자금 변동액과 일치하게 되었고, 원고 1 은행의 마감업무가 처리될 수 있었다.  \n  5) 원고 1 은행은 이 사건 각 은행계정대 조정 이후에도 소외 1 회사와 소외 2 회사에 대하여 은행계정대 조정 전 금액에 따라 이자를 지급하였다.\n  다. 위와 같은 사정을 바탕으로 원심판결 이유를 앞서 본 법리와 기록에 비추어 살펴본다. \n  원고 2 등 원고 1 은행 소속의 담당 직원들이 한 이 사건 각 은행계정대 조정 행위는 은행의 마감업무를 처리하기 위해 집합투자업자별로 관리되는 전체 은행계정대를 계산하여 은행계정대 마감표에 나타나는 ‘신탁계정차 금액’과 은행계정시스템상 ‘대체불일치 금액’을 일치시키고자 재무상태표(신탁계정차)의 항목을 입력한 행위에 불과하다. 이로 인하여 소외 1 회사 또는 소외 2 회사가 설정ㆍ운용하는 다른 집합투자기구들의 은행계정대와 관련하여 소외 1 회사 또는 소외 2 회사(각 신탁계정)의 원고 1 은행(고유계정)에 대한 대여금채권액이 실제로 감소하였다고 보기 어려우며, 원고 직원들이 그러한 의사로 이 사건 각 은행계정대 조정을 하였다고 볼 수도 없다. 따라서 이 사건 각 은행계정대 조정은 신탁업자가 보관ㆍ관리하는 집합투자재산 등에 관하여 권리ㆍ의무를 발생시키려는 의사로써 행한 재산상 행위라기보다는 단순한 회계상의 조치에 불과하다고 볼 여지가 크다.\n  그런데도 원심은 그 판시와 같은 이유만으로 원고 1 은행의 이 사건 각 은행계정대 조정이 자본시장법 제246조 제5항 본문에서 금지하는 ‘거래’에 해당한다고 판단하였다. 이러한 원심의 판단에는 위 조항에서 말하는 ‘거래’의 의미와 요건 등에 관한 법리를 오해하여 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 있다. 이를 지적하는 취지의 상고이유 주장은 이유 있다.\n  4. 결론\n  나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오경미(재판장) 권영준 엄상필(주심) 박영재"
  },

    "판시사항": "국가나 지방자치단체가 제정 하천편입토지 보상 등에 관한 특별조치법의 시행일 이전에 하천구역에 편입된 토지에 관하여 과실 없이 진정한 소유자가 아닌 등기부상 소유명의자를 보상대상자로 보아 그에게 하천구역 편입에 따른 손실보상금을 지급함에 따라 위 법에 따른 보상청구절차의 통지 또는 공고를 하지 못하였으나, 이후 진정한 손실보상청구권자가 손실보상금의 지급을 청구함에 따라 다시 이를 지급해야 하는 경우, 해당 토지에 대한 보상평가의 기준 시점",

    "판례내용": "【원고, 피상고인】                원고 (소송대리인 변호사 박진우)\n【피고, 상고인】 서울특별시 (소송대리인 법무법인 정세 담당변호사 박경홍 외 1인)\n【원심판결】  서울고법 2024. 11. 20. 선고 2023누53449 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요 \n  원심판결 이유와 원심이 적법하게 조사하여 채택한 증거 등에 의하면, 다음과 같은 사실을 알 수 있다. \n  가. 소외 1은 1911. 6. 30. 경기 광주군 중대면 ○○리 (지번 1 생략) 전 1,486평(이하 ‘이 사건 분할 전 토지’라 한다)을 사정받았다. \n  나. 소외 2, 소외 3, 소외 4, 소외 5, 소외 6은 1971. 6. 8. 이 사건 분할 전 토지에 관하여 소유권보존등기를 마쳤고, 소외 7은 1974. 2. 2. 이 사건 분할 전 토지에 관하여 매매를 원인으로 한 소유권이전등기를 마쳤다. \n  다. 이 사건 분할 전 토지는 1975. 3. 14. 서울 △△구 ○○동(현재 행정구역을 기준으로 서울 □□구 ○○동이다) (지번 2 생략) 하천 1,405평(이하 ‘이 사건 토지’라 한다)과 같은 동 (지번 3 생략) 하천 81평으로 분할되었는데, 이 사건 토지는 구 하천법(1971. 1. 19. 법률 제2292호로 개정된 것, 이하 ‘1971년 하천법’이라 한다)이 시행된 1971. 7. 20. 또는 늦어도 1975년경 하천구역으로 편입되어 국유가 되었다. \n  라. 소외 7은 1986. 8.경 구 하천법(1984. 12. 31. 법률 제3782호로 개정된 것, 이하 ‘1984년 하천법’이라 한다) 부칙 제2조 제1항, 제4항, 「구 법률 제3782호 하천법 중 개정법률 부칙 제2조의 규정에 따른 하천 편입토지의 보상에 관한 규정」(1989. 8. 18. 대통령령 제12781호로 개정되기 전의 것, 이하 ‘구 하천보상규정’이라 한다) 제5조에 근거하여 피고에게 이 사건 토지의 하천구역 편입에 따른 손실보상금을 청구하였다. \n  마. 피고는 1989년경 소외 7에게 이 사건 토지의 하천편입에 따른 손실보상금으로 44,127,500원을 지급하였다.  \n  2. 제1 상고이유에 대하여\n  원심은 판시와 같은 이유를 들어, 이 사건 분할 전 토지를 사정받은 소외 1과 원고의 선대인 소외 1이 동일인이라고 인정한 다음, 원고의 선대인 소외 1이 이 사건 분할 전 토지를 사정받았음이 밝혀진 이상 이 사건 분할 전 토지에 관한 소외 2 외 4명의 소유권보존등기의 추정력이 깨어지고, 나아가 소외 2 외 4명이 이 사건 분할 전 토지를 승계취득하였다고 인정할 증거가 없다고 보아, 이 사건 분할 전 토지에 관한 소외 2 외 4명의 소유권보존등기 및 그에 터잡은 소외 7의 소유권이전등기는 모두 원인무효이므로, 이 사건 토지의 하천구역 편입 당시 소유자는 원고의 선대인 소외 1의 상속인들이고, 이들에게 「하천편입토지 보상 등에 관한 특별조치법」(이하 ‘하천편입토지보상법’이라 한다) 제2조에 따른 이 사건 토지에 대한 손실보상청구권이 귀속된다고 판단하였다.\n  관련 법리 및 적법하게 채택한 증거들에 비추어 살펴보면, 원심판단에 상고이유 주장과 같이 사정받은 토지의 소유권 귀속에 관한 채증법칙 위반, 법리오해, 심리미진 등으로 판결에 영향을 미친 잘못이 없다.\n  3. 제2 상고이유에 대하여\n  가. 관련 규정의 내용 및 이 사건의 쟁점\n  1) 하천편입토지보상법 제2조 제2호에 따르면, 1971년 하천법 시행일부터 1984년 하천법 시행일까지(이하 ‘1971년 하천법 시행기간’이라 한다) 사이에, 토지가 1984년 하천법 제2조 제1항 제2호 (가)목에 해당하게 되어 하천구역으로 편입되었으나 소멸시효의 완성으로 손실보상을 받지 못한 경우, 시·도지사가 그 손실을 보상하여야 한다. \n  하천편입토지보상법은 제5조에서 \"시·도지사는 제2조에 따른 보상 대상 토지 중 보상을 청구하지 아니한 토지에 대해서는 하천별로 작성된 편입토지조서에 등재된 토지소유자 및 이해관계인에게 매년 3월 말까지 대통령령으로 정하는 바에 따라 보상청구절차를 문서로 통지하여야 한다. 다만 통지받을 자가 분명하지 아니하거나 통지받을 자의 주소·거소, 그 밖에 통지할 장소를 알 수 없는 때에는 주요 일간신문에 이를 공고하여야 한다.\"라고 규정하고 있다. 그리고 제6조 제1항에서 \"제2조에 따른 보상에 대한 평가는 제5조에 따라 보상청구절차를 통지 또는 공고한 날의 가격을 기준으로 하되, 편입당시의 지목 및 토지이용상황, 해당 토지에 대한 공법상의 제한, 현재의 토지이용상황 및 유사한 인근 토지의 정상가격 등을 고려하여야 한다.\"라고 규정하고 있다. \n  이와 같이 하천편입토지보상법은 제5조에 따라 보상청구절차를 통지 또는 공고한 경우의 보상평가 기준시점을 그 통지 또는 공고일로 규정하면서도, 보상청구절차의 통지 또는 공고가 이루어지지 않은 경우의 보상평가 기준시점에 관해서는 별도의 규정을 두고 있지 않다. \n  2) 이 사건의 쟁점은 피고가 1984년 하천법에 따라 1971년 하천법 시행기간 중 하천구역에 편입된 이 사건 토지에 관하여 그 진정한 소유자가 아닌 등기부상 소유명의자를 보상대상자로 보아 등기부상 소유명의자에게 하천구역 편입에 따른 손실보상금을 모두 지급하였으나, 하천편입토지보상법 시행 이후에 진정한 소유자 등 진정한 손실보상청구권자가 피고에게 해당 토지에 대한 손실보상금을 청구함에 따라 피고가 다시 이를 지급하여야 하는 경우 언제의 가격을 기준으로 손실보상금을 평가할지이다. \n  나. 대법원의 판단\n  1) 시·도지사가 하천편입토지보상법에 따른 보상청구절차의 통지 또는 공고를 하지 않는 등 보상절차를 진행하지 아니함에 따라 손실보상청구권자가 직접 시·도지사를 상대로 행정소송을 제기한 경우에는 보상을 위한 감정평가 당시 가격을 기준으로 보상액을 산정하는 것이 원칙이다. 그러나 하천에 편입된 토지의 경우 그 이용상황이나 해당 토지에 대한 공법상 제한 등에 비추어 가격의 변화가 크지 않은 것이 일반적이라고 할 것이므로 하천편입토지보상법 시행일 이후의 시점을 기준으로 보상액을 산정하더라도, 특별한 사정이 없는 한 위법하다고 볼 것은 아니다(대법원 2011. 11. 10. 선고 2011두16636 판결 참조). \n  그런데 국가나 지방자치단체가 2009. 3. 25. 법률 제9543호로 제정된 하천편입토지보상법의 시행일인 2009. 6. 26. 이전에, 과실 없이 하천구역 편입 당시의 등기부상 소유명의자가 진정한 소유자가 아님을 알지 못해 등기부상 소유명의자를 보상대상자로 보아 감정평가를 거쳐 그 등기부상 소유명의자에게 손실보상금을 지급하였고, 이에 따라 하천편입토지보상법의 시행에도 불구하고 보상청구절차의 통지 또는 공고를 하지 못한 경우에는, 이후 진정한 손실보상청구권자가 하천편입토지보상법 제2조에 따라 손실보상금의 지급을 청구하더라도 그 등기부상 소유명의자를 보상대상자로 하여 이루어진 감정평가 당시의 가격을 기준으로 보상액을 산정하여야 하고, 감정평가 시점을 알 수 없는 등 특별한 사정이 있는 경우에는 그 등기부상 소유명의자에게 보상금을 지급한 날 등 보상시점 무렵의 가격을 기준으로 할 수 있다. 구체적인 이유는 다음과 같다. \n  가) 구 하천구역편입토지 보상에 관한 특별조치법(2009. 3. 25. 법률 제9543호 하천편입토지보상법 부칙 제2조로 폐지) 제6조는 보상에 대한 평가는 평가 당시의 가격을 기준으로 한다고 규정함으로써 하천구역에 편입될 당시의 가격을 기준으로 하지 않고 있었다. 위 제6조는 1984년 하천법 부칙 제2조 제4항에 근거하여 제정된 구 하천보상규정 제10조를 그대로 옮겨 놓은 것이다. 구 하천보상규정 제10조는, 하천구역에 편입되어 국유로 될 당시에는 보상에 관한 아무런 규정을 두지 않았다가, 국유화된 때로부터 10년이 훨씬 지난 시기에 이르러서야 비로소 손실보상에 관한 규정을 마련하면서, 그동안 보상규정을 두지 않았던 반성적 고려에서 실제로 평가·보상할 수 있게 된 시기의 가격을 기준으로 보상할 것을 규정한 것이다(대법원 2006. 3. 10. 선고 2003다15013 판결 참조).\n  하천편입토지보상법은 소멸시효 완성 등으로 종전 법률에 따라 보상을 받지 못한 하천편입 토지 소유자들에 대한 보상청구기간을 연장하면서도, 보상에 대한 평가는 평가 당시의 가격이 아닌 보상청구절차를 통지 또는 공고한 날을 기준으로 하도록 규정하였다. 그 취지는 보상을 받지 못한 하천편입 토지 소유자를 구제하면서도, 평가 당시의 가격을 기준으로 손실보상금을 평가하는 경우, 개별 손실보상청구권자의 보상청구 시점이나 시·도지사의 평가 시점에 따라 손실보상금이 장기간에 걸쳐 매우 달라지는 결과가 발생되는 등의 문제가 있어, 이를 해결하고자 실제 보상청구 및 그에 따른 보상평가에 앞선 보상절차의 개시시점으로 볼 수 있는 보상청구절차의 통지 또는 공고 시점을 보상평가의 기준시점으로 객관화함으로써, 보상금액에 대한 예측가능성을 제고하고자 하는 것이다.\n  그런데 1984년 하천법이 시행되어 실제로 하천구역 편입에 따른 손실보상금을 평가·보상할 수 있게 된 이후로서, 제정 하천편입토지보상법 시행일 이전에 하천구역 편입 당시의 등기부상 소유명의자가 보상청구를 함에 따라 시·도지사가 해당 토지에 대한 보상평가를 한 경우에는, 비록 그 보상청구가 진정한 권리자에 의한 것이 아니라고 하더라도 보상절차가 개시되었던 것과 다름이 없으므로, 그 시점 무렵을 보상평가의 기준시점으로 보아야 한다. 이러한 경우에도 제정 하천편입토지보상법 시행일 이후의 시점을 기준으로 보상평가를 하여야 한다고 해석하는 것은, 손실보상금이 장기간에 걸쳐 매우 달라지는 결과를 초래하는 것이어서, 앞서 본 하천편입토지보상법의 입법 취지에 부합하지 않는다.\n  나) 하천편입토지보상법은 제5조에서 시·도지사가 보상 대상 토지 중 보상을 청구하지 아니한 토지에 한정하여 편입토지조서에 등재된 토지소유자 및 이해관계인에게 보상청구절차를 통지 또는 공고하도록 정하면서, 제6조에서 제5조에 따라 통지 또는 공고한 날을 보상평가의 기준시점으로 정하고 있다. 이는 보상 대상 토지에 관한 보상청구가 없었고 시·도지사의 보상청구절차에 관한 통지나 공고를 기대할 수 있음을 전제하고 있다.\n  그런데 하천편입토지보상법 시행 이전에 하천구역 편입 당시의 진정한 소유자가 아닌 등기부상 소유명의자가 보상청구를 함에 따라 시·도지사가 과실 없이 등기부상 소유명의자를 보상대상자로 보아 해당 토지에 대한 보상평가를 하고 손실보상금까지 지급한 경우에는, 시·도지사의 보상청구절차에 관한 통지나 공고가 이루어질 것을 기대하기 어렵다. 그러므로 이러한 경우에도 제정 하천편입토지보상법 시행일 이후를 보상평가의 기준시점으로 인정하는 것은 하천편입토지보상법이 예정한 범위를 벗어난다.\n  다) 1984년 하천법 부칙 제2조 제4항의 위임에 따른 구 하천보상규정은, 제4조 및 제5조에서 시장·군수 또는 구청장이 편입토지조서를 작성하거나 부동산등기부등본 등 토지소유자임을 증명하는 서류를 첨부하여 보상청구를 한 토지소유자로부터 보상청구서를 받은 경우에는, 그 내용을 이해관계인 등에게 통지하되 통지를 받을 자가 분명하지 않은 경우 등에는 통지를 하지 않을 수 있고, 14일 이상 당해 지역의 시·군·구·읍·면 및 동의 게시판에 공고하도록 하는 등 이해관계인 등이 공고기간 중 의견을 제출할 수 있도록 하여야 한다고 규정하고, 제9조에서 보상금액의 산정은 2건 이상 감정평가액의 산술평균치를 기준으로 하도록 규정하고 있었다. 그러므로 하천구역 편입 당시의 등기부상 소유명의자가 보상청구를 한 경우, 등기부상 소유명의자가 진정한 소유자가 아니라고 하더라도, 시장·군수 또는 구청장은 위와 같은 공고로써 진정한 소유자로 하여금 의견을 제출할 수 있는 기회를 주는 것으로 족하다. \n  이에 비추어 보면, 구 하천보상규정 제5조에 따라 보상청구를 한 하천구역 편입 당시의 등기부상 소유명의자가 진정한 소유자가 아님을 알 수 없는 상황에서 위 규정에 따라 공고가 이루어진 경우에는, 보상청구 등 일체의 보상절차가 전혀 이루어지지 않은 경우와 달리, 진정한 소유자에게 의견을 제출할 수 있는 기회가 부여되었다고 평가할 수 있으므로, 후속 절차로 이루어진 감정평가 등 등기부상 소유명의자에 대한 보상절차 당시를 기준으로 진정한 소유자에 대한 보상평가를 하는 것이 불합리하다고 보기 어렵다.  \n   2) 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 피고는 1989년경 소외 7에게 손실보상금으로 44,127,500원을 지급하는 과정에서, 과실 없이 소외 7이 진정한 소유자가 아님을 알지 못해 소외 7을 보상대상자로 보아 감정평가를 거쳐 관계 법령에 따라 손실보상금을 지급하였다. 이에 따라 피고는 하천편입토지보상법의 시행 이후 이 사건 토지에 관하여 보상청구절차의 통지 또는 공고를 하지는 않았지만, 그 손실보상금 지급 전 이 사건 토지의 이해관계인 등에 대한 통지 또는 공고를 통해 진정한 소유자로 하여금 의견제출의 기회는 주었다고 할 수 있다. 따라서 피고가 이 사건 토지의 하천구역 편입 당시 진정한 소유자인 소외 1의 상속인이자 다른 상속인들로부터 손실보상청구권을 양수한 원고에 대한 손실보상금을 산정할 때는, 소외 7을 보상대상자로 하여 이루어진 종전 감정평가 당시 등의 가격을 기준으로 평가해야 한다고 볼 소지가 있다.\n   그런데도 원심은 위와 같이 소외 7을 보상대상자로 하여 이루어진 감정평가 당시 등의 가격을 기준으로 원고에 대한 손실보상금을 평가해야 할 사정 등에 관하여 심리하지 아니한 채, 보상평가 기준시점을 제1심 감정인의 감정평가 시점인 2022. 11. 7.로 한 제1심 감정인의 감정평가액을 기초로 이 사건 토지에 대한 손실보상금을 산정하였다. 이러한 원심판단에는 하천편입토지보상법에 따른 손실보상금의 보상평가 기준시점 등에 관한 법리를 오해하여 필요한 심리를 다하지 아니함으로써 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 피고의 상고이유 주장은 이유 있다.\n  4. 결론\n  나머지 상고이유에 관한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 노경필(재판장) 이흥구(주심) 오석준 이숙연"
  },

    "판시사항": "[1] 구 독점규제 및 공정거래에 관한 법률 제23조 제1항 제7호에서 정한 ‘현저히 유리한 조건의 거래’의 하나로 구 독점규제 및 공정거래에 관한 법률 시행령 제36조 제1항 [별표 1의2] 제10호에서 정한 ‘현저한 규모의 거래로 인하여 과다한 경제상 이익을 제공한 것’인지 판단하는 방법\n\n [2] 구 독점규제 및 공정거래에 관한 법률 시행령 제36조 제1항 [별표 1의2] 제10호 (가)목에서 금지하는 ‘부당한 자금지원행위’에서 ‘상당히 낮거나 높은 대가로 제공 또는 거래하거나 상당한 규모로 제공 또는 거래하여 과다한 경제상 이익을 제공’한 것인지 판단하는 방법 및 이때 급부와 반대급부가 상당히 유리한지 판단하는 기준이 되는 ‘정상가격’의 의미\n\n [3] 구 독점규제 및 공정거래에 관한 법률 제23조 제1항 제7호에서 금지하는 부당지원행위에서 지원행위가 부당성을 갖는지 판단하는 방법 \n\n [4] 구 독점규제 및 공정거래에 관한 법률 제23조의2 제1항 제2호에서 금지하는 특수관계인에 대한 부당한 이익제공행위에 해당하려면 제2호의 행위에 해당하는지와 별도로 그 행위를 통해 특수관계인에게 귀속된 이익이 ‘부당’한지에 대한 규범적 평가가 이루어져야 하는지 여부(적극) 및 이때 ‘부당성’을 판단하는 방법",

    "참조조문": "[1] 구 독점규제 및 공정거래에 관한 법률(2013. 8. 13. 법률 제12095호로 개정되기 전의 것) 제23조 제1항 제7호(현행 제45조 제1항 제9호 참조), 구 독점규제 및 공정거래에 관한 법률 시행령(2014. 2. 11. 대통령령 제25173호로 개정되기 전의 것) 제36조 제1항 [별표 1의2] 제10호(현행 제52조 [별표 2] 제9호 참조) / [2] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제23조 제1항 제7호 (가)목[현행 제45조 제1항 제9호 (가)목 참조], 제3항(현행 제45조 제3항 참조), 구 독점규제 및 공정거래에 관한 법률 시행령(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것) 제36조 제1항 [별표 1의2] 제10호 (가)목[현행 제52조 [별표 2] 제9호 (가)목 참조] / [3] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제23조 제1항 제7호(현행 제45조 제1항 제9호 참조) / [4] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제23조의2 제1항 제2호(현행 제47조 제1항 제2호 참조)",

    "판례내용": "【원고, 피상고인 겸 상고인】                주식회사 ○○건설 외 8인 (소송대리인 변호사 김용덕 외 10인)\n【피고, 상고인 겸 피상고인】 공정거래위원회 (소송대리인 법무법인 지음 외 1인)\n【원심판결】  서울고법 2025. 3. 27. 선고 2023누60041 판결         \n【주    문】\n  상고를 모두 기각한다.  상고비용은 각자 부담한다.  \n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 상고이유보충서 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유에 따르면 다음 사실을 알 수 있다.\n  가. 당사자들의 지위 \n  1) 원고들은 모두 구 「독점규제 및 공정거래에 관한 법률」(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것, 이하 ‘공정거래법’이라 한다) 제2조 제1호에서 정하는 사업자로서 같은 법 제14조 제1항에 따라 2017. 9. 1. 공시대상기업집단으로 지정되었고, 2021. 5. 1. 기준 상호출자제한기업집단으로 지정된 기업집단 ○○건설에 속하는 회사들이다.\n  2) 기업집단 ○○건설의 동일인 소외 1은 2003. 12. 4. 장남 소외 2[(연도 1 생략)년생]가 100% 지분을 가진 주식회사 ○○건설주택(설립 당시 상호 주식회사 △△△건설, 이하 회사명에서 ‘주식회사’ 부분은 생략한다)을 설립하고, 같은 날 장녀 소외 3[(연도 2 생략)년생], 차남 소외 4[(연도 3 생략)년생]가 각각 60% 및 40% 지분을 가진 ○○프라퍼티(설립 당시 상호 □□□)를 설립하였으며, 약 7년 후인 2010. 12. 7. 소외 4가 90%의 지분을 가진 원고 ○○산업(설립 당시 상호 □□□건설)을 설립하였다.\n  3) 원고 ○○건설은 동일인 소외 1이 최대주주이던 2018. 12. 4. ○○건설주택을 흡수합병하였고, 소외 2는 합병 후 원고 ○○건설의 지분 54.73%를 보유한 최대 주주가 되었다.\n  나. 원고들의 행위\n  1) 원고 ○○건설은 2010년부터 2015년까지 자신이 직접 공공택지 입찰에 참여하여 공급받거나 계열회사 또는 비계열회사(관계사 및 협력사)를 동원하여 공급받은 23건의 공공택지(이하 ‘이 사건 공공택지’라 한다)를 계열회사인 원고 ○○산업 등 이 사건 9개사에 전매하였다(이하 ‘제1행위’라 한다).\n  2) 원고 ○○건설은 2014. 2. 20.부터 2017. 6. 19.까지 원고 ○○산업 등 이 사건 19개사에 대하여 총 414회에 걸쳐 총 1조 5,753억 원의 입찰신청금을 대여하면서(이하 ‘이 사건 대여’라 한다) 이에 대한 이자를 수취하지 않았다(이하 ‘제2행위’라 한다).\n  3) 원고 ○○건설은 2014. 3. 4.부터 2018. 1. 15.까지 원고 ○○산업 등 이 사건 13개사가 시행사로 참여한 총 40건의 공공택지 개발사업에서 시공의 일부만 담당하거나 시공에 전혀 참여하지 아니하면서도 총 2조 6,393억 원의 PF대출(토지협약대출을 포함한다) 전액을 무상으로 지급보증하였다(이하 ‘제3행위’라 하고, 위 40건의 PF대출을 통틀어 ‘이 사건 PF대출’이라 하며, 위 40건의 지급보증을 통틀어 ‘이 사건 지급보증’이라 한다).\n  4) 원고 ○○건설은 원고 ○○산업이 2017. 8. 30. 토목 등 각종 공사면허를 취득하자, 2017. 10. 1. 원고 ○○산업과 그 계열 회사들이 시행하던 4개의 주택개발사업 현장에서 자신이 시공하던 공사 중 통신을 제외한 토목, 소방, 전기, 조경 공종 공사를 타절하고 원고 ○○산업에 이관하였다. \n  원고 ○○건설은 ○○건설주택이 2018. 6.경 토목 등 각종 공사면허를 취득하자, 2018. 7. 10. ○○건설주택과 그 계열 회사들이 시행하던 6개의 주택개발사업 현장에서 자신이 시공하던 공사 중 토목을 제외한 전기, 소방, 조경, 통신 공종 공사를 타절하고 ○○건설주택에 이관하였다(이하 위 각 이관행위를 합하여 ‘제4행위’라 하고, 제1 내지 3행위와 합하여 ‘이 사건 행위’라 하며, 위 10개 현장의 공사를 ‘이 사건 공사’라 한다).\n  다. 피고의 처분\n  피고는 이 사건 행위에 관하여 아래와 같은 근거를 들어 지원주체인 원고 ○○건설과 지원객체인 나머지 원고들에 대하여 시정조치를 명하고 원심 판시와 같은 금액의 과징금을 부과하였다.\n  1) 원고 ○○건설의 제1행위는 현저한 규모의 거래로 이 사건 9개사에 과다한 경제상 이익을 제공한 행위에 해당하여 구 「독점규제 및 공정거래에 관한 법률」(2013. 8. 13. 법률 제12095호로 개정되어 2014. 2. 14. 시행되기 전의 것, 이하 ‘구 공정거래법’이라 한다) 제23조 제1항 제7호, 구 「독점규제 및 공정거래에 관한 법률 시행령」(2014. 2. 11. 대통령령 제25173호로 개정되어 2014. 2. 14. 시행되기 전의 것, 이하 ‘구 공정거래법 시행령’이라 한다) 제36조 제1항 [별표 1의2] 제10호 (나)목 및 공정거래법 제23조 제1항 제7호 (가)목, 구 「독점규제 및 공정거래에 관한 법률 시행령」(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것, 이하 ‘공정거래법 시행령’이라 한다) 제36조 제1항 [별표 1의2] 제10호 (나)목을 위반하였고, 이 사건 9개사가 원고 ○○건설로부터 제1행위를 통해 지원받은 행위는 공정거래법 제23조 제2항을 위반하였다.\n  2) 원고 ○○건설의 제2, 3행위는 상당히 유리한 조건의 거래로 이 사건 19개사 및 이 사건 13개사에 과다한 경제상 이익을 제공한 행위에 해당하여 공정거래법 제23조 제1항 제7호 (가)목을 위반하였고, 이 사건 19개사가 원고 ○○건설로부터 제2행위를 통해 지원받은 행위 및 이 사건 13개사가 원고 ○○건설로부터 제3행위를 통해 지원받은 행위는 공정거래법 제23조 제2항을 위반하였다.\n  3) 원고 ○○건설의 제4행위는 직접 수행하였을 경우 상당한 이익이 되었을 사업기회를 ○○건설주택 및 원고 ○○산업에 제공함으로써 특수관계인인 소외 2 및 소외 4에게 부당한 이익을 귀속시킨 행위에 해당하여 공정거래법 제23조의2 제1항 제2호를 위반하였고, ○○건설주택 및 원고 ○○산업이 원고 ○○건설로부터 제4행위를 통해 사업기회를 제공받은 행위는 공정거래법 제23조의2 제3항을 위반하였다.\n  2. 이 사건 제1행위의 부당한 지원행위 해당 여부에 관한 판단\n  가. 관련 법리\n                 구 공정거래법 제23조 제1항 제7호는 ‘현저히 유리한 조건으로 거래’하여 특수관계인 또는 다른 회사를 지원하는 행위를 지원행위로 규정하고 있고, 같은 조 제2항의 위임에 기한 구 공정거래법 시행령 제36조 제1항 [별표 1의2] 제10호는 현저히 낮거나 높은 대가로 제공 또는 거래하거나 현저한 규모로 제공 또는 거래하여 과다한 경제상 이익을 제공함으로써 특수관계인 또는 다른 회사를 지원하는 행위를 부당지원행위로 규정하고 있다. 거래의 조건에는 거래되는 상품 또는 역무의 품질, 내용, 규격, 거래수량, 거래횟수, 거래시기, 운송조건, 인도조건, 결제조건, 지불조건, 보증조건 등이 포함되고, 거래규모는 거래수량에 관한 사항으로서 거래조건에 포함된다고 할 수 있으므로, ‘현저한 규모로 제공 또는 거래하여 과다한 경제상 이익을 제공’하는 것도 구 공정거래법 제23조 제1항 제7호 소정의 ‘현저히 유리한 조건의 거래’의 하나라고 볼 수 있을 것이지만, 현저한 규모의 거래라 하여 바로 과다한 경제상 이익을 준 것이라고 할 수 없고 현저한 규모의 거래로 인하여 과다한 경제상 이익을 제공한 것인지 여부는 지원성 거래규모 및 급부와 반대급부의 차이, 지원행위로 인한 경제상 이익, 지원기간, 지원횟수, 지원시기, 지원행위 당시 지원객체가 처한 경제적 상황 등을 종합적으로 고려하여 구체적·개별적으로 판단하여야 할 것이다(대법원 2007. 1. 25. 선고 2004두7610 판결, 대법원 2022. 9. 16. 선고 2019도19067 판결, 대법원 2024. 7. 25. 선고 2021두49444 판결 등 참조).\n  나. 판단\n  원심은, 공공택지를 공급가격을 초과하는 가격에 거래하는 것은 구 택지개발촉진법(2021. 1. 5. 법률 제17875호로 개정되기 전의 것)에 의해 허용되지 않는바, 원고 ○○건설이 이 사건 공공택지를 공급가격에 전매한 것 자체를 이 사건 9개사에 과다한 경제상 이익을 제공한 것으로 보기 어렵고, 구 공정거래법이 사업기회 제공행위를 부당지원행위의 유형으로 정하고 있지 않은 상황에서, 공공택지를 전매함으로써 공공택지 시행사업의 기회를 제공한 행위를 부당한 지원행위로 제재할 수는 없으며, 이 사건 9개사가 제1행위를 통해 전매 받은 이 사건 공공택지에서 시행사업을 수행하여 분양매출과 영업수익이 발생하였다고 하더라도, 이는 수분양자 등과의 거래를 통하여 얻은 사후적 이익에 불과하여 이를 제1행위에 의하여 제공된 경제상 이익이라고 보기는 어렵다는 등의 이유를 들어, 이 사건 제1행위는 현저한 또는 상당한 규모의 거래로 이 사건 9개사에 과다한 경제상의 이익을 제공한 지원행위로 보기 어렵다고 판단하였다.\n  관련 법리와 기록에 비추어 살펴보면, 원심의 이유 설시에 다소 부적절한 부분이 있으나 이 사건 제1행위가 부당한 지원행위에 해당하지 않는다고 판단한 원심의 결론은 정당하다. 거기에 상고이유의 주장과 같이 구 공정거래법상 과다한 경제상 이익의 제공에 관한 법리 등을 오해하여 판결에 영향을 미친 잘못이 없다.\n  3. 이 사건 제2행위의 부당한 지원행위 해당 여부에 관한 판단\n  가. 관련 법리\n                 공정거래법 제23조 제1항 제7호 (가)목은 ‘사업자는 부당하게 특수관계인 또는 다른 회사에 대하여 가지급금·대여금·인력·부동산·유가증권·상품·용역·무체재산권 등을 제공하거나 상당히 유리한 조건으로 거래하는 행위를 통하여 특수관계인 또는 다른 회사를 지원하는 행위로서 공정한 거래를 저해할 우려가 있는 행위를 하거나, 계열회사 또는 다른 사업자로 하여금 이를 행하도록 하여서는 아니 된다.’고 규정하고, 같은 법 제23조 제2항은 ‘제1항 제7호에 해당할 우려가 있음에도 해당 지원을 받는 행위를 하여서는 아니 된다.’고 정하고 있으며, 제3항의 위임을 받은 공정거래법 시행령 제36조 제1항 [별표 1의2] 제10호 (가)목은 ‘사업자가 부당하게 특수관계인 또는 다른 회사에 대하여 가지급금·대여금 등 자금을 상당히 낮거나 높은 대가로 제공 또는 거래하거나 상당한 규모로 제공 또는 거래하는 행위를 통하여 과다한 경제상 이익을 제공함으로써 특수관계인 또는 다른 회사를 지원하는 행위로서 공정한 거래를 저해할 우려가 있는 행위’를 ‘부당한 자금지원행위’로서 금지하고 있다.\n  부당한 자금지원행위에서 ‘상당히 낮거나 높은 대가로 제공 또는 거래하거나 상당한 규모로 제공 또는 거래하여 과다한 경제상 이익을 제공’한 것인지를 판단할 때에는 급부와 반대급부의 차이, 지원성 거래규모, 지원행위로 인한 경제상 이익, 지원기간, 지원횟수, 지원시기, 지원행위 당시 지원객체가 처한 경제적 상황 등을 종합적으로 고려하여 구체적·개별적으로 판단하여야 한다(대법원 2022. 5. 26. 선고 2020두36267 판결 등 참조). 그리고 여기서 급부와 반대급부가 상당히 유리한지를 판단하는 기준이 되는 ‘정상가격’은, 지원주체와 지원객체 간에 이루어진 경제적 급부와 동일한 경제적 급부가 시기, 종류, 규모, 기간, 신용상태 등이 유사한 상황에서 특수관계가 없는 독립된 자 간에 이루어졌을 경우 형성되었을 거래가격 등을 말한다(대법원 2006. 12. 7. 선고 2004두11268 판결 등 참조).\n  나. 판단\n  1) 원심은 다음과 같은 이유를 들어, 이 사건 제2행위는 상당히 유리한 조건의 거래로 이 사건 19개사에 과다한 경제상의 이익을 제공한 지원행위로 보기 어려울 뿐만 아니라, 그로 인하여 이 사건 19개사의 관련 시장에서 경쟁의 저해나 경제력 집중의 우려가 있는 등으로 공정한 거래가 저해될 우려가 있다고 보기 어렵다고 판단하였다.\n  가) 원고 ○○건설이 제2행위를 통하여 이 사건 19개사로부터 수취하지 않은 이자 상당액인 지원금액은 회사별로 820만여 원에서 4,350만여 원에 불과하여 이를 ‘과다한 경제상 이익’으로 인정하기는 어렵고, 위와 같은 정도의 지원금액으로는 주거용 부동산 개발 및 공급업 시장에서의 공정거래를 저해할 우려가 있다고 보기도 어렵다.\n  나) 이 사건 대여는 평균 대여기간이 4일을 넘지 않는 단기차입으로 이 사건 19개사는 미수취 이자 상당액 외에는 달리 제2행위로 얻은 경제상 이익이 없다. \n  다) 원고 ○○건설은 기업집단 ○○건설 차원에서 시행사업을 수행하는 공공택지의 확보 등을 위하여 이 사건 19개사의 공공택지 분양신청 업무에 적극적으로 관여할 유인이 있었던 것으로 보이는바, 자신의 이익과 무관하게 오로지 이 사건 19개사에 경제상 이익을 제공하기 위한 목적으로 제2행위를 하였다고 보기 어렵다.\n  2) 관련 법리와 기록에 비추어 살펴보면, 원심의 이러한 판단은 정당하고, 거기에 상고이유의 주장과 같이 상당히 유리한 조건에 의한 지원행위의 성립 및 그 부당성 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  4. 이 사건 제3행위의 부당한 지원행위 해당 여부에 관한 판단\n  가. 지원객체 선정의 위법 여부\n  원심은, 이 사건 지급보증을 통해 직접적인 이익을 얻은 것은 이 사건 PF대출을 받아 자금을 조달한 시행사이고, 원고 ○○건설은 PF대출에 관한 지급보증을 시행사와의 거래로 인식하였던 것으로 보인다는 등의 이유를 들어, 시행사로서 이 사건 PF대출의 채무자였던 이 사건 13개사를 이 사건 제3행위의 지원객체로 봄이 타당하다고 판단하였다.\n  관련 법리와 기록에 비추어 살펴보면, 원심의 이러한 판단은 정당하고, 거기에 상고이유의 주장과 같이 지원객체에 관한 법리를 오해하는 등으로 판결에 영향을 미친 잘못이 없다.\n  나. 부당한 지원행위의 성립 여부\n  1) 상당히 유리한 조건으로 거래하여 과다한 경제상 이익을 제공한 행위인지 여부\n  원심은, ① 원고 ○○건설은 시공비중을 초과하여 이 사건 지급보증을 무상으로 제공함으로써 신용위험만을 떠안게 되었는데, 이는 매우 이례적인 점, ② 원고 ○○건설은 비계열회사가 시행사인 개발사업에 시공사로 참여하는 경우에는 시공지분율에 따른 신용보강 책임만을 부담하였음에 비추어 보면, 자신의 시공비중을 초과하여 PF대출금 전액에 관한 지급보증을 제공하면서 아무런 대가를 수취하지 않은 이 사건 제3행위를 통상적인 거래관행에 부합한다고 볼 수 없는 점, ③ 피고가 한국주택금융공사와 주택도시보증공사가 제시한 PF보증수수료율 범위의 하한 중 더 낮은 값을 정상 보증료율로 정하여 미수취 지급보증수수료를 산정한 것에 어떠한 잘못이 있다고 볼 수 없는 점, ④ 피고가 산정한 미수취 지급보증수수료 중 원고 ○○건설의 시공비중을 제외한 부분 상당액은 이 사건 PF대출의 현장별로 최소 5,258,000원에서 최대 1,721,755,000원, 지원객체별로 최소 168,262,000원에서 최대 3,767,766,000원에 달하는 점 등의 이유를 들어, 이 사건 제3행위는 상당히 유리한 조건의 거래로 이 사건 13개사에게 과다한 경제상 이익을 제공한 행위에 해당한다고 판단하였다.\n  관련 법리와 기록에 비추어 살펴보면, 원심의 이러한 판단은 정당하고, 거기에 상고이유의 주장과 같이 공정거래법상 상당히 유리한 조건에 의한 지원행위의 성립 등에 관한 법리를 오해하는 등으로 판결에 영향을 미친 잘못이 없다.\n  2) 부당성 인정 여부\n  가) 관련 법리\n  부당지원행위에 있어서 지원행위가 부당성을 갖는지는 지원주체와 지원객체와의 관계, 지원행위의 목적과 의도, 지원객체가 속한 시장의 구조와 특성, 지원성 거래규모와 지원행위로 인한 경제상 이익 및 지원기간, 지원행위로 인하여 지원객체가 속한 시장에서의 경쟁제한이나 경제력 집중의 효과 등은 물론 중소기업 및 여타 경쟁사업자의 경쟁능력과 경쟁여건의 변화 정도, 지원행위 전후의 지원객체의 시장점유율의 추이, 시장개방의 정도 등을 종합적으로 고려하여 해당 지원행위로 인하여 지원객체가 속한 관련 시장에서 경쟁이 저해되거나 경제력 집중이 야기되는 등으로 공정한 거래가 저해될 우려가 있는지 여부에 따라 판단하여야 한다(대법원 2004. 3. 12. 선고 2001두7220 판결, 대법원 2008. 6. 12. 선고 2006두7751 판결 등 참조).\n  나) 판단\n  원심은, 지원객체들은 신용도가 낮아 단독으로는 대출 실행이 불가능하거나 과도한 금융비용이 발생하게 되어 원고 ○○건설의 지원이 없었다면 국내 주거용 부동산 개발·공급업 시장에 안착하여 경쟁력을 형성·강화하기 어려웠을 것이고, 기업집단 ○○건설 내에서는 원고 ○○건설 외에는 이 사건 지급보증을 할 수 있을 정도의 신용도를 갖춘 회사가 존재하지 않았다는 등의 이유를 들어, 원고 ○○건설의 제3행위는 이 사건 13개사의 금융부담을 줄이고 자금력을 제고시키며 자금사정과 경영여건을 개선시켜 경쟁사업자에 비해 경쟁조건을 유리하게 하고, 이 사건 13개사로 하여금 국내 주거용 부동산 개발·공급업 시장에서 사업자로서의 지위를 유지·강화하게 함으로써 경쟁을 저해하거나 경제력 집중을 야기하는 등 공정한 거래를 저해하거나 저해할 우려가 인정된다고 판단하였다.\n  관련 법리와 기록에 비추어 살펴보면, 원심의 이러한 판단은 정당하고, 거기에 상고이유의 주장과 같이 공정거래법상 부당한 지원행위의 부당성에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  5. 이 사건 제4행위의 부당성 인정 여부에 관한 판단\n  가. 관련 법리\n                 공정거래법 제23조의2의 규정 내용, 입법 경위 및 입법 취지 등을 고려하면, 공정거래법 제23조의2 제1항 제2호에서 금지하는 특수관계인에 대한 부당한 이익제공행위에 해당하려면, 제2호의 행위에 해당하는지 여부와는 별도로 그 행위를 통하여 특수관계인에게 귀속된 이익이 ‘부당’한지에 대한 규범적 평가가 아울러 이루어져야 한다. 여기에서 말하는 ‘부당성’이란, 이익제공행위를 통하여 그 행위객체가 속한 시장에서 경쟁이 제한되거나 경제력이 집중되는 등으로 공정한 거래를 저해할 우려가 있을 것까지 요구하는 것은 아니고, 행위주체와 행위객체 및 특수관계인의 관계, 행위의 목적과 의도, 행위의 경위와 그 당시 행위객체가 처한 경제적 상황, 거래의 규모, 특수관계인에게 귀속되는 이익의 규모, 이익제공행위의 기간 등을 종합적으로 고려하여, 변칙적인 부의 이전 등을 통하여 대기업집단의 특수관계인을 중심으로 경제력 집중이 유지·심화될 우려가 있는지 여부에 따라 판단하여야 한다(대법원 2022. 5. 12. 선고 2017두63993 판결 등 참조).\n  나. 판단\n  원심은, 원고 ○○건설은 이 사건 공사를 타절하고 ○○건설주택 및 원고 ○○산업에 이관하는 데 대하여 아무런 대가를 받지 않았다는 점, 소외 2는 ○○건설주택의 지분 51.42%를 보유한 최대주주였고, 소외 4는 원고 ○○산업의 지분 41.99%를 보유한 최대주주였다는 점, 원고 ○○건설은 ○○건설주택 및 원고 ○○산업에 공사를 이관하기 위하여 이 사건 공사를 타절하였다는 점 등의 이유를 들어, 원고 ○○건설의 제4행위에는 ○○건설주택 및 원고 ○○산업의 특수관계인인 소외 2, 소외 4에 대한 이익제공 의도가 인정된다고 판단하였다.\n  또한 원심은, 원고 ○○건설은 제4행위를 통해 특수관계인인 소외 2에게 1,193,000,000원, 소외 4에게 796,000,000원 상당의 부당한 이익을 귀속시켰고, 제4행위의 배경, 경위 등을 고려할 때 이익의 부당성을 부정하기 어렵다고 판단하였다.\n  관련 법리와 기록에 비추어 살펴보면, 원심의 이러한 판단은 정당하고, 거기에 상고이유의 주장과 같이 공정거래법상 부당한 이익제공행위의 부당성에 관한 법리 등을 오해하여 판결에 영향을 미친 잘못이 없다.\n  6. 결론\n  상고를 모두 기각하고 상고비용은 각자 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 오석준(재판장) 이흥구(주심) 이숙연"

    "판시사항": "[1] 택시운송사업자가 택시의 구입 및 운행에 드는 비용 중 택시 구입비, 유류비 등을 택시운수종사자에게 부담시키지 않도록 정한 택시운송사업의 발전에 관한 법률 제12조 제1항의 규정 취지\n\n [2] 택시운송사업의 발전에 관한 법률 시행령 제21조 [별표 2] 비고 제2호의 의미 및 위 규정을 택시운수종사자의 운송수입금 미납행위에 대한 과태료 부과처분이 있는 경우 그 처분이 있기 전에 택시운송사업자가 한 운송비용 전가행위까지 제재 대상에서 제외한다는 의미로 해석할 수 있는지 여부(소극)",
    "판결요지": "[1] 택시운송사업자가 택시의 구입 및 운행에 드는 비용 중 택시 구입비, 유류비 등을 택시운수종사자에게 부담시키지 않도록 규정한 택시운송사업의 발전에 관한 법률 제12조 제1항의 취지는, 택시운수종사자가 부당한 경제적 부담을 지지 않도록 함으로써 열악한 근무여건에서 초래되는 과속운행, 난폭운전, 승차거부 등을 미연에 방지하여 승객들이 더 안전하게 대중교통을 이용할 수 있는 환경을 만드는 데에 있다.\n\n [2] 택시운송사업의 발전에 관한 법률 시행령 제21조 [별표 2] 비고 제2호는 택시운수종사자가 운송수입금을 미납하여 행정청으로부터 과태료 부과처분을 받은 후 그 처분에서 인정된 미납 운송수입금 범위 내에서 택시운송사업자가 해당 택시운수종사자에게 한 운송비용 전가행위를 제재 대상에서 제외한다는 의미로 해석해야 하고, 이러한 전가행위 이후에 행정청의 과태료 부과처분이 당사자의 이의제기 등으로 말미암아 효력을 상실한 경우에도 마찬가지로 제재 대상에서 제외된다고 보아야 한다. 이와 달리 위 규정을 택시운수종사자의 운송수입금 미납행위에 대한 과태료 부과처분이 있기만 하면 그 처분이 있기 전에 택시운송사업자가 한 운송비용 전가행위까지 제재 대상에서 제외한다는 의미로 해석할 수는 없다. 구체적인 이유는 다음과 같다.\n  ① 택시운송사업의 발전에 관한 법률(이하 ‘택시발전법’이라 한다)은 안전한 대중교통 이용환경을 조성하기 위해 운송수입금 전액관리제를 시행하면서 택시운송사업자의 택시운수종사자에 대한 운송비용 전가행위를 엄격하게 금지하고 있으므로, 예외적으로 운송비용 전가행위를 제재 대상에서 제외하는 사유는 문언에 따라 엄격하게 해석해야 한다. 위 규정의 문언은 ‘과태료 처분을 받은 경우로서 해당 택시운수종사자에 대해 운송비용을 전가하는 경우’라는 것이므로, 해당 택시운수종사자가 이미 행정청으로부터 과태료 부과처분을 받은 ‘지위’ 내지 ‘상태’에 있음을 전제로 한다고 해석하는 것이 자연스럽다.\n  ② 위 규정은, 택시운수종사자가 운송수입금 전액 납부 의무를 위반한 것이 공적으로 확인된 경우 그에 대한 대응ㆍ대가 관계에서 택시운송사업자가 해당 택시운수종사자에게 한 운송비용 전가행위까지 제재하는 것은 가혹하므로 그와 같은 행위는 제재 대상에서 제외하겠다는 취지에서 제정된 것으로 보인다. 택시운수종사자의 운송수입금 미납행위가 공적으로 확인된 이후에 그 확인된 범위 내에서만 위 규정이 적용된다고 보더라도 택시운송사업자가 택시운수종사자에 비하여 부당하게 불리한 지위에 있게 된다고 보기는 어렵다.\n  ③ 이와 달리 위 규정이 행정청의 과태료 부과처분 이전에 택시운송사업자가 한 운송비용 전가행위에도 적용된다고 해석할 경우, 운송수입금 미납행위에 대한 행정청의 사후적인 과태료 부과처분 여부에 따라 운송비용 전가행위가 택시발전법 제18조 제1항 제1호의 제재 대상인지가 달라지므로, 오히려 택시운송사업자의 법적 지위가 불안정해질 수 있다. 나아가 택시운송사업자가 택시운수종사자의 미납 운송수입금 범위를 초과하여 운송비용을 전가하는 경우가 늘어날 수 있고, 이로 인하여 법적 분쟁도 다수 발생할 가능성이 크다.\n  ④ 택시운수종사자의 운송수입금 미납행위를 이유로 한 택시운송사업자의 운송비용 전가행위에 위 규정을 폭넓게 적용하여 제재 대상에서 제외된다고 해석하는 것은, 운송비용 전가행위를 원칙적으로 금지함으로써 택시운송사업의 건전한 발전을 도모하여 택시운수종사자의 복지 증진과 국민의 교통편의 제고에 이바지한다는 택시발전법의 목적에 어긋나고, 운송수입금 전액관리제를 전면적으로 시행하여 안전한 대중교통 이용환경을 조성하려는 택시발전법 관련 규정들의 취지를 잠탈하는 결과를 초래할 수 있다.",
    "참조조문": "[1] 택시운송사업의 발전에 관한 법률 제12조 제1항 / [2] 택시운송사업의 발전에 관한 법률 제12조 제1항, 제18조 제1항 제1호, 제2항, 택시운송사업의 발전에 관한 법률 시행령 제21조 [별표 2], 여객자동차 운수사업법 제26조 제2항",
    "참조판례": "[1] 대법원 2024. 2. 29. 선고 2020두54029 판결(공2024상, 576)",
    "판례내용": "【원고, 피상고인】                ○○택시 주식회사 (소송대리인 법무법인 소망 담당변호사 오승원)\n【피고, 상고인】 경산시장 (소송대리인 법무법인 범어 담당변호사 김중기 외 4인)\n【원심판결】  대구고법 2023. 9. 1. 선고 2023누10779 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 대구고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 따르면 다음 사실을 알 수 있다.\n  가. 원고는 택시 여객운송사업 등을 목적으로 설립된 회사로서 「택시운송사업의 발전에 관한 법률」(이하 ‘택시발전법’이라 한다) 제2조 제3호가 정한 택시운송사업자이다.\n  나. 피고는 2019. 8. 12. 원고에게, 원고가 소속 택시운수종사자들에게 택시 구입비를 전가하여 택시발전법 제12조 제1항 제2호를 위반하였다는 이유로, 택시발전법 제18조 제1항 제1호, 「택시운송사업의 발전에 관한 법률 시행령」(이하 ‘택시발전법 시행령’이라 한다) 제21조 [별표 2] 제2호 (가)목에 따라 경고처분을 하였다. \n  다. 피고는 2020. 12. 22. 원고에게, 원고가 2020. 3.부터 9.까지 제1심판결 별지 1 위반행위 표 기재와 같이 소외인을 포함한 소속 택시운수종사자 5명에게 유류비를 전가하여 택시발전법 제12조 제1항 제2호를 위반하였다는 이유로, 택시발전법 제18조 제1항 제1호, 택시발전법 시행령 제21조 [별표 2] 제2호 (가)목에 따라 위반행위와 직접 관련된 택시를 포함한 해당 택시의 2배수인 10대에 관하여 45일(2021. 1. 1.부터 2021. 2. 14.까지)의 사업일부정지처분(이하 ‘이 사건 처분’이라 한다)을 하였다.\n  라. 한편 피고는 소외인에게, 그가 2020. 7.경 운송수입금 중 100만 원 이상을 미납하여 「여객자동차 운수사업법」(이하 ‘여객자동차법’이라 한다) 제26조 제2항을 위반하였다는 이유로 2020. 9. 9. 과태료 사전통지를 하였고, 2020. 10. 16. 여객자동차법 제94조 제3항에 따라 25만 원의 과태료 부과처분(6개월간 징수유예, 이하 ‘이 사건 과태료 부과처분’이라 한다)을 하였다. 소외인은 2020. 12. 16. 이 사건 과태료 부과처분에 대하여 이의신청을 하였으나, 대구지방법원은 2021. 4. 22. 소외인에게 과태료를 부과하는 결정을 하였고(대구지방법원 2020과1751), 위 결정은 2021. 6. 3. 확정되었다.\n  2. 관계 법령의 해석\n  가. 택시운송사업자가 택시의 구입 및 운행에 드는 비용 중 택시 구입비, 유류비 등을 택시운수종사자에게 부담시키지 않도록 규정한 택시발전법 제12조 제1항의 취지는, 택시운수종사자가 부당한 경제적 부담을 지지 않도록 함으로써 열악한 근무여건에서 초래되는 과속운행, 난폭운전, 승차거부 등을 미연에 방지하여 승객들이 더 안전하게 대중교통을 이용할 수 있는 환경을 만드는 데에 있다(대법원 2024. 2. 29. 선고 2020두54029 판결 등 참조).\n  나. 택시발전법 제18조 제1항 제1호는 택시운송사업자가 택시 구입비, 유류비 등 택시발전법 제12조 제1항 각 호의 비용을 택시운수종사자에게 떠넘긴 경우 행정청이 택시운송사업자에게 택시운송사업면허취소, 6개월 이내의 사업전부ㆍ일부정지, 감차 등이 따르는 사업계획변경을 명할 수 있다고 규정하고, 같은 조 제2항은 제1항에 따른 처분의 기준 및 절차, 그 밖에 필요한 사항은 대통령령으로 정한다고 규정하고 있다. 그 위임을 받은 택시발전법 시행령 제21조 [별표 2]는 제2호 표의 (가)목에서 ‘택시운송사업자가 택시발전법 제12조 제1항 각 호의 비용을 택시운수종사자에게 전가시킨 경우’의 처분기준을, 1회 위반 시 경고, 2회 위반 시 사업일부정지(90일, 다만 택시운송사업자가 유류비 또는 교통사고 처리비를 2회 택시운수종사자에게 전가시킨 경우에는 120일), 3회 위반 이상 시 감차명령(다만 택시운송사업자가 유류비 또는 교통사고 처리비를 3회 이상 택시운수종사자에게 전가시킨 경우에는 사업면허취소)으로 규정하면서, 비고 제2호에서 \"위 표의 (가)목은 일반택시운수종사자가 여객자동차법 제26조 제2항을 위반하여 과태료 처분을 받은 경우로서 해당 일반택시운수종사자에 대해 운송비용을 전가하는 경우에는 적용하지 않는다.\"라고 정하고 있다(위 비고 제2호를 이하 ‘이 사건 규정’이라 한다).\n  다. 이 사건 규정은 택시운수종사자가 운송수입금을 미납하여 행정청으로부터 과태료 부과처분을 받은 후 그 처분에서 인정된 미납 운송수입금 범위 내에서 택시운송사업자가 해당 택시운수종사자에게 한 운송비용 전가행위를 제재 대상에서 제외한다는 의미로 해석하여야 하고, 이러한 전가행위 이후에 행정청의 과태료 부과처분이 당사자의 이의제기 등으로 말미암아 효력을 상실한 경우에도 마찬가지로 제재 대상에서 제외된다고 보아야 한다. 이와 달리 이 사건 규정을 택시운수종사자의 운송수입금 미납행위에 대한 과태료 부과처분이 있기만 하면 그 처분이 있기 전에 택시운송사업자가 한 운송비용 전가행위까지 제재 대상에서 제외한다는 의미로 해석할 수는 없다. 그 구체적인 이유는 다음과 같다.\n  1) 택시발전법은 안전한 대중교통 이용환경을 조성하기 위해 운송수입금 전액관리제를 시행하면서 택시운송사업자의 택시운수종사자에 대한 운송비용 전가행위를 엄격하게 금지하고 있으므로, 예외적으로 운송비용 전가행위를 제재 대상에서 제외하는 사유는 그 문언에 따라 엄격하게 해석하여야 한다. 이 사건 규정의 문언은 ‘과태료 처분을 받은 경우로서 해당 택시운수종사자에 대해 운송비용을 전가하는 경우’라는 것이므로, 해당 택시운수종사자가 이미 행정청으로부터 과태료 부과처분을 받은 ‘지위’ 내지 ‘상태’에 있음을 전제로 한다고 해석하는 것이 자연스럽다.\n  2) 이 사건 규정은, 택시운수종사자가 운송수입금 전액 납부 의무를 위반한 것이 공적으로 확인된 경우 그에 대한 대응ㆍ대가 관계에서 택시운송사업자가 해당 택시운수종사자에게 한 운송비용 전가행위까지 제재하는 것은 가혹하므로 그와 같은 행위는 제재 대상에서 제외하겠다는 취지에서 제정된 것으로 보인다. 택시운수종사자의 운송수입금 미납행위가 공적으로 확인된 이후에 그 확인된 범위 내에서만 이 사건 규정이 적용된다고 보더라도 택시운송사업자가 택시운수종사자에 비하여 부당하게 불리한 지위에 있게 된다고 보기는 어렵다.\n  3) 이와 달리 이 사건 규정이 행정청의 과태료 부과처분 이전에 택시운송사업자가 한 운송비용 전가행위에도 적용된다고 해석할 경우, 운송수입금 미납행위에 대한 행정청의 사후적인 과태료 부과처분 여부에 따라 운송비용 전가행위가 택시발전법 제18조 제1항 제1호의 제재 대상인지가 달라지게 되므로, 오히려 택시운송사업자의 법적 지위가 불안정해질 수 있다. 나아가 택시운송사업자가 택시운수종사자의 미납 운송수입금 범위를 초과하여 운송비용을 전가하는 경우가 늘어날 수 있고, 이로 인하여 법적 분쟁도 다수 발생할 가능성이 크다.\n  4) 택시운수종사자의 운송수입금 미납행위를 이유로 한 택시운송사업자의 운송비용 전가행위에 이 사건 규정을 폭넓게 적용하여 제재 대상에서 제외된다고 해석하는 것은, 운송비용 전가행위를 원칙적으로 금지함으로써 택시운송사업의 건전한 발전을 도모하여 택시운수종사자의 복지 증진과 국민의 교통편의 제고에 이바지한다는 택시발전법의 목적에 어긋나고, 운송수입금 전액관리제를 전면적으로 시행하여 안전한 대중교통 이용환경을 조성하려는 택시발전법 관련 규정들의 취지를 잠탈하는 결과를 초래할 수 있다. \n  3. 원심의 판단\n  원심은 다음과 같은 이유로 원고의 청구를 인용하여 이 사건 처분 전부를 취소하였다.\n  가. 원고는 소외인 등 5명의 소속 택시운수종사자에게 각각 운행하는 택시의 유류비를 부담하게 함으로써 택시발전법 제12조 제1항 제2호를 위반하였다. \n  나. 소외인은 2020. 10. 16. 피고로부터 ‘운송수입금 전액을 납입하지 않아 여객자동차법 제26조 제2항을 위반하였다.’는 이유로 이 사건 과태료 부과처분을 받았다. 소외인의 위반행위가 일어난 시기는 2020. 7.로서 원고가 소외인에게 유류비를 전가한 시기인 2020. 4.부터 9.까지와 중첩되고 미납한 운송수입금의 액수도 상당하므로, 원고의 소외인에 대한 유류비 전가행위 전체는 이 사건 규정에 따라 처분의 예외사유로 인정된다.\n  다. 그런데 이 사건 처분은 소외인을 포함한 택시운수종사자 5명에 대한 유류비 전가행위를 모두 고려하여 정한 것으로 그중 소외인에 대한 위반행위 부분을 특정하여 분리할 수 없고, 제출된 증거만으로는 처분의 예외사유로 인정되는 부분이 사업일부정지처분의 기간 산정에 영향을 미친 정도도 알기 어려우므로, 이 사건 처분 전부를 위법한 것으로 보아 취소할 수밖에 없다. \n  4. 대법원의 판단\n  원심이 인정한 사실관계를 앞서 본 법리에 비추어 살펴보면, 비록 피고가 소외인의 2020. 7.경 운송수입금 미납행위에 대하여 이 사건 과태료 부과처분을 한 것이라고 하더라도, 2020. 10. 16.에 있었던 이 사건 과태료 부과처분 이전인 2020. 4.부터 2020. 9.까지 원고의 소외인에 대한 유류비 전가행위에 이 사건 규정이 적용된다고 할 수는 없다.\n  그런데도 이와 달리 원고의 소외인에 대한 위 유류비 전가행위가 이 사건 규정에 따라 제재 대상에서 제외된다는 전제에서 이 사건 처분이 전부 위법하다고 판단한 원심판결에는 택시운송사업자의 택시운수종사자에 대한 운송비용 전가행위에 있어 제재 대상 제외사유에 관한 법리를 오해하여 판결 결론에 영향을 미친 잘못이 있다. 이를 지적하는 피고의 상고이유 주장은 이유 있다.\n  5. 결론\n  나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오경미(재판장) 권영준 엄상필(주심) 박영재"
  },

    "사건종류명": "일반행정",
    "판결유형": "판결",
    "판시사항": "[1] 구 석탄산업법 시행령 제41조 제4항 제5호의 ‘재해발생기간에 불구하고 폐광일 현재 장해등급이 확정되지 아니한 자’에 최초의 요양을 종결하고 그에 따른 신체장해등급 판정을 받고 그에 상응하는 재해위로금을 받았다가 폐광일 이후 해당 상병이 재발하거나 해당 상병에 기인한 합병증이 발생하여 재요양을 받게 된 피재근로자가 포함되는지 여부(적극) 및 이 경우 지급해야 하는 재해위로금액\n\n [2] 폐광된 광산에서 진폐로 인한 업무상 재해를 입은 근로자가 2010. 5. 20. 법률 제10305호로 개정된 산업재해보상보험법 시행일인 2010. 11. 21. 이후에 장해등급이 확정되어 장해급여가 아닌 진폐보상연금을 받게 된 경우, 구 석탄산업법 시행령 제41조 제4항 제5호에 따른 재해위로금 지급 대상에 해당하는지 여부(적극)\n\n [3] 폐광된 광산에서 진폐로 인한 업무상 재해를 입은 사람이 종전 장해등급에 해당하는 구 석탄산업법상 재해위로금을 지급받은 후 장해상태가 악화되어 장해등급이 변경되었을 경우, 진폐근로자가 지급받을 재해위로금액 산정 방법 / 진폐근로자가 종전의 장해등급에 해당하는 재해위로금을 지급받지 못한 상태에서 장해상태가 악화되어 장해등급이 변경되었음에도, 한국광해광업공단이 변경된 장해등급이 아니라 종전의 장해등급에 해당하는 장해보상일시금 상당의 재해위로금만을 지급한 경우, 한국광해광업공단이 지급해야 할 재해위로금액의 산정 방법 및 이 경우 산업재해보상보험법 시행령 제58조 제3항 제2호를 유추적용하여 변경된 장해등급에 따라 지급할 재해위로금을 산정해야 하는지 여부(소극) / 진폐근로자가 한국광해광업공단으로부터 변경된 장해등급에 해당하는 재해위로금액에 미치지 못하는 금액의 재해위로금만을 지급받은 상태에서 재차 장해상태가 악화되어 장해등급이 변경된 경우, 재해위로금 산정 방법",
    "판결요지": "[1] 구 석탄산업법 시행령(2000. 12. 29. 대통령령 제17055호로 개정되기 전의 것) 제41조 제4항 제5호에 따른 재해위로금이 사회보장적인 차원에서 통상적인 재해보상금에 추가하여 지급되는 위로금의 성격을 갖는다는 점과 진폐증의 특성 등을 고려하면, 위 조항의 ‘재해발생기간에 불구하고 폐광일 현재 장해등급이 확정되지 아니한 자’에는 일단 최초의 요양을 종결하고 그에 따른 신체장해등급 판정을 받고 그에 상응하는 재해위로금을 받았다가 폐광일 이후 해당 상병이 재발하거나 해당 상병에 기인한 합병증이 발생하여 재요양을 받게 된 피재근로자도 포함되며, 이 경우 재요양 후의 새로운 장해등급에 따른 재해위로금에서 최초 장해등급에 따른 재해위로금을 뺀 차액을 추가로 지급해야 한다. \n\n [2] 폐광된 광산에서 진폐로 인한 업무상 재해를 입은 근로자가 2010. 5. 20. 법률 제10305호로 개정된 산업재해보상보험법의 시행일인 2010. 11. 21. 이후에 장해등급이 확정되어 장해급여(장해보상연금 또는 장해보상일시금)가 아닌 진폐보상연금을 받게 되었더라도 구 석탄산업법 시행령(2000. 12. 29. 대통령령 제17055호로 개정되기 전의 것) 제41조 제4항 제5호에 따른 재해위로금 지급 대상에 해당한다. \n\n [3] 구 석탄산업법 시행령(2000. 12. 29. 대통령령 제17055호로 개정되기 전의 것) 제41조 제4항 제5호 후문, 산업재해보상보험법 제51조 제1항, 제60조 제2항, 산업재해보상보험법 시행령(이하 ‘산재보험법 시행령’이라 한다) 제58조 제3항 제2호의 내용과 체계에 산재보험법 시행령 제58조 제3항 제2호의 취지를 종합하면, 폐광된 광산에서 진폐로 인한 업무상 재해를 입은 사람(이하 ‘진폐근로자’라 한다)이 종전 장해등급에 해당하는 구 석탄산업법(2021. 3. 9. 법률 제17919호로 개정되기 전의 것)상 재해위로금을 지급받은 후 장해상태가 악화되어 장해등급이 변경되었을 경우, 그가 지급받을 재해위로금액은 산재보험법 시행령 제58조 제3항 제2호를 유추적용하여 ‘변경된 장해등급에 해당하는 장해보상일시금의 지급일수에서 종전의 장해등급에 해당하는 장해보상일시금의 지급일수를 뺀 일수에 평균임금을 곱한 금액’으로 산정하는 것이 타당하다. \n  그러나 이와 달리 진폐근로자가 종전의 장해등급에 해당하는 재해위로금을 지급받지 못한 상태에서 장해상태가 악화되어 장해등급이 변경되었음에도, 한국광해광업공단이 변경된 장해등급이 아니라 종전의 장해등급에 해당하는 장해보상일시금 상당의 재해위로금만을 지급하였다면, 특별한 사정이 없는 한 이는 변경된 장해등급에 해당하는 재해위로금에 대한 일부 변제로서의 성격을 가진다고 보는 것이 타당하다. 이러한 경우 한국광해광업공단으로서는 진폐근로자에게 변경된 장해등급에 해당하는 재해위로금액에서 실제 지급한 금원의 금액을 뺀 나머지를 지급할 의무가 있고, 이와 달리 이러한 경우에까지 산재보험법 시행령 제58조 제3항 제2호를 유추적용하여 변경된 장해등급에 따라 지급할 재해위로금을 산정할 것은 아니다.\n  다만 위와 같이 진폐근로자가 한국광해광업공단으로부터 변경된 장해등급에 해당하는 재해위로금액에 미치지 못하는 금액의 재해위로금만을 지급받은 상태에서 재차 장해상태가 악화되어 장해등급이 변경되었다면, 한국광해광업공단으로서는 산재보험법 시행령 제58조 제3항 제2호를 유추적용하여 산정한 최종 변경된 장해등급에 해당하는 재해위로금과 위 기지급 재해위로금 지급 당시 진폐근로자가 진단받은 장해등급에 해당하는 재해위로금의 차액을 지급하고, 이에 더하여 기존에 지급된 재해위로금의 과소 산정에 대한 정산으로서 변경된 장해등급에 해당하는 재해위로금액과 기지급 재해위로금액의 차액을 지급할 의무가 있다.",
    "참조조문": "[1] 구 석탄산업법(2021. 3. 9. 법률 제17919호로 개정되기 전의 것) 제39조의3 제1항 제4호, 구 석탄산업법 시행령(2000. 12. 29. 대통령령 제17055호로 개정되기 전의 것) 제41조 제4항 제5호 / [2] 구 석탄산업법(2021. 3. 9. 법률 제17919호로 개정되기 전의 것) 제39조의3 제1항 제4호, 구 석탄산업법 시행령(2000. 12. 29. 대통령령 제17055호로 개정되기 전의 것) 제41조 제4항 제5호 / [3] 구 석탄산업법 시행령(2000. 12. 29. 대통령령 제17055호로 개정되기 전의 것) 제41조 제4항 제5호, 산업재해보상보험법 제51조 제1항, 제60조 제2항, 산업재해보상보험법 시행령 제58조 제3항 제2호",
    "참조판례": "[1][2] 대법원 1999. 1. 26. 선고 98두12598 판결(공1999상, 381), 대법원 2020. 10. 15. 선고 2019두60523 판결(공2020하, 2183) / [3] 대법원 2025. 11. 6. 선고 2022두67272 판결",
    "판례내용": "【원고, 피상고인】                원고 1 외 1인 (소송대리인 법무법인 사람앤스마트 담당변호사 김찬영 외 2인)\n【피고, 상고인】 한국광해관리공단의 소송수계인 한국광해광업공단 (소송대리인 법무법인 드림 담당변호사 정영택 외 2인)\n【원심판결】  서울고법 2022. 6. 24. 선고 2021누42285 판결         \n【주    문】\n  1. 원심판결 중 원고 1에게 109,994,646원 및 그중 89,289,009원에 대하여 2020. 5. 29.부터, 20,705,637원에 대하여 2020. 11. 6.부터 각 2022. 6. 24.까지 연 5%, 그다음 날부터 다 갚는 날까지 연 12%의 각 비율로 계산한 돈을, 원고 2에게 166,283,621원 및 그중 92,768,867원에 대하여 2020. 5. 29.부터, 73,514,754원에 대하여 2020. 11. 6.부터 각 2022. 6. 24.까지 연 5%, 그다음 날부터 다 갚는 날까지 연 12%의 각 비율로 계산한 돈을 초과하여 지급을 명한 피고 패소 부분을 파기하고, 그에 해당하는 원고들의 청구를 각 기각한다.  2. 나머지 상고를 모두 기각한다.  3. 소송총비용 중 3%는 원고들이, 나머지는 피고가 부담한다. \n\n【이    유】  상고이유를 판단한다. \n  1. 사안의 개요 \n  원심판결 이유와 기록에 의하면 다음 사실을 알 수 있다. \n  가. 원고 1은 1981. 10. 1.부터 ○○○탄광에서 검탄원으로 근무하였고, 1992. 2. 28. 위 광업소가 폐광되면서 퇴직하였다. \n  원고 1은 위 광업소 근무 중이던 1987. 6. 25. 진폐증을 진단받아 장해등급 제11급 진단을 받았다. 이후 원고 1은 장해상태가 악화되어 폐광일 이후인 2011. 7. 25. 장해등급 제9급 진단을, 2015. 4. 15. 장해등급 제5급 진단을, 2018. 7. 17. 장해등급 제3급 진단을 각각 받았다. \n  한편 원고 1은 한국광해관리공단에 재해위로금 지급을 청구하여 2017. 2. 15. 과거 장해등급 제11급 진단 당시의 평균임금에 기초하여 산정한 산업재해보상보험법(이하 ‘산재보험법’이라 한다)상 장해보상일시금에 상당하는 2,129,700원의 재해위로금을 지급받았다.  \n  나. 원고 2는 1988. 2. 8.부터 △△△탄광에서 채탄부 광원으로 근무하였고, 1990. 6. 1. 위 광업소가 폐광되면서 퇴직하였다. \n  원고 2는 위 광업소 근무 중이던 1989. 9. 6. 진폐증을 진단받아 장해등급 제11급 진단을 받았다. 이후 원고 2는 장해상태가 악화되어 폐광일 이후인 2011. 12. 29. 장해등급 제9급 진단을, 2016. 3. 15. 장해등급 제5급 진단을, 2018. 12. 17. 장해등급 제3급 진단을 각각 받았다. \n  한편 원고 2는 한국광해관리공단에 재해위로금 지급을 청구하여 2016. 8. 31. 과거 장해등급 제11급 진단 당시의 평균임금에 기초하여 산정한 산재보험법상 장해보상일시금과 동일한 4,144,790원의 재해위로금을 지급받았다(이하 이 재해위로금과 원고 1이 2017. 2. 15. 지급받은 재해위로금을 통틀어 ‘선행 재해위로금’이라 한다). \n  다. 1986. 1. 8. 제정된 석탄산업법 제31조에 따라 석탄광산의 폐광대책사업 등을 수행하기 위하여 석탄산업합리화사업단이 설립되었고, 2005. 5. 31. 제정된 「광산피해의 방지 및 복구에 관한 법률」 제31조에 근거하여 광해방지사업을 효율적으로 수행하기 위하여 2006. 6. 1. 광해방지사업단이 설립되면서 위 법률 부칙 제3조에 따라 석탄산업합리화사업단의 권리ㆍ의무를 승계하였다. 광해방지사업단은 2008. 3. 28. 위 법률이 개정되면서 2008. 6. 28. 한국광해관리공단으로 명칭이 변경되었다. 그 후 2021. 3. 9. 제정된 한국광해광업공단법에 근거하여 2021. 9. 10. 피고가 설립되면서 위 법률 부칙 제6조 제1항에 따라 한국광해관리공단의 모든 권리ㆍ의무를 포괄적으로 승계하였다. 그에 따라 피고는 원심에서 소송절차를 수계하였다. \n  2. 재해위로금의 지급대상에 관하여 \n  가. 관련 법리\n  1) 구 석탄산업법(2021. 3. 9. 법률 제17919호로 개정되기 전의 것, 이하 같다) 제39조의3 제1항은 ‘폐광대책비의 지급 대상이 되는 광산의 석탄광업자가 해당 광업권 또는 조광권의 소멸등록을 마쳤을 때에는 한국광해관리공단은 해당 광산의 석탄광업자 및 퇴직근로자 등에게 다음 각 호의 금액을 폐광대책비로 지급하여야 한다.’고 규정하면서, 제4호에서 ‘기타 대통령령이 정하는 폐광대책비’를 들고 있다. 그 위임에 따라 구 석탄산업법 시행령(2000. 12. 29. 대통령령 제17055호로 개정되기 전의 것) 제41조 제4항 제5호(이하 ‘이 사건 조항’이라 한다)는 ‘해당 광산이 폐광대책비 지급의 대상이 되는 석탄광산의 기준(이하 ‘폐광지원대상광산기준’이라 한다)에의 해당 여부에 관한 확인을 받기 위한 신청일 또는 폐광지원대상광산기준에 해당되는 광산으로서 석탄광업자의 소재불명으로 광업권 등의 소멸등록을 할 수 없고 근로자의 임금체불 등으로 폐광이 불가피하다고 인정됨에 따라 산업자원부장관이 당해 광업권 등을 취소하여 폐광하는 경우에는 산업자원부장관이 정한 날부터 소급하여 1년 전부터 폐광일까지의 기간 중에 업무상 재해를 입은 자로서 폐광일 현재 장해등급이 확정된 자 또는 재해발생기간에 불구하고 폐광일 현재 장해등급이 확정되지 아니한 자에 대하여 지급하는 재해위로금’을 구 석탄산업법 제39조의3 제1항 제4호의 \"기타 대통령령이 정하는 폐광대책비\"로 정하면서, \"이 경우 재해위로금액은 퇴직근로자가 지급받은 산업재해보상보험법 제42조 제1항의 규정에 의한 장해보상일시금 또는 동법 제43조 제1항의 유족보상일시금과 동일한 금액으로 한다.\"라고 규정하고 있다.\n  2) 이 사건 조항에 따른 재해위로금이 사회보장적인 차원에서 통상적인 재해보상금에 추가하여 지급되는 위로금의 성격을 갖는다는 점과 진폐증의 특성 등을 고려하면, 이 사건 조항의 ‘재해발생기간에 불구하고 폐광일 현재 장해등급이 확정되지 아니한 자’에는 일단 최초의 요양을 종결하고 그에 따른 신체장해등급 판정을 받고 그에 상응하는 재해위로금을 받았다가 폐광일 이후 해당 상병이 재발하거나 또는 해당 상병에 기인한 합병증이 발생하여 재요양을 받게 된 피재근로자도 포함되며, 이 경우 재요양 후의 새로운 장해등급에 따른 재해위로금에서 최초 장해등급에 따른 재해위로금을 뺀 차액을 추가로 지급하여야 한다. \n  한편 폐광된 광산에서 진폐로 인한 업무상 재해를 입은 근로자가 2010. 5. 20. 법률 제10305호로 개정된 산재보험법의 시행일인 2010. 11. 21. 이후에 장해등급이 확정되어 장해급여(장해보상연금 또는 장해보상일시금)가 아닌 진폐보상연금을 받게 되었더라도 이 사건 조항에 따른 재해위로금 지급 대상에 해당한다(대법원 1999. 1. 26. 선고 98두12598 판결, 대법원 2020. 10. 15. 선고 2019두60523 판결 등 참조). \n  나. 판단 \n  1) 원심은, 원고들이 ‘폐광일 현재 장해등급이 확정되지 아니한 자’로서 이 사건 조항에 따른 재해위로금 지급대상에 해당하고, 현재 산재보험법에 따른 진폐보상연금을 지급받고 있다고 하여 달리 볼 수 없다고 판단하였다. \n  2) 이러한 원심의 판단은 앞서 본 법리에 기초한 것으로서, 상고이유 주장과 같이 구 석탄산업법에 따른 재해위로금 지급청구권의 발생 요건 등에 관한 법리를 오해하거나 논리와 경험의 법칙을 위반하여 자유심증주의의 한계를 벗어나는 등으로 판결에 영향을 미친 잘못이 없다. \n  3. 재해위로금의 액수에 관하여 \n  가. 관련 법리 \n  1) 이 사건 조항 후문은 ‘재해위로금액은 퇴직근로자가 지급받은 산재보험법에 따른 장해보상일시금 또는 유족보상일시금과 동일한 금액으로 한다.’고 규정하고 있다. \n  산재보험법 제51조 제1항은 ‘요양급여를 받은 사람이 치유 후 요양의 대상이 되었던 업무상의 부상 또는 질병이 재발하거나 치유 당시보다 상태가 악화되어 이를 치유하기 위한 적극적인 치료가 필요하다는 의학적 소견이 있으면 재요양을 받을 수 있다.’고 규정하고, 제60조 제2항은 ‘재요양을 받고 치유된 후 장해상태가 종전에 비하여 악화된 경우에는 그 악화된 장해상태에 해당하는 장해등급에 따라 장해급여를 지급하고 이 경우 재요양 후의 장해급여의 산정 및 지급 방법은 대통령령으로 정한다.’고 규정하고 있다. 그 위임에 따라 산재보험법 시행령 제58조 제3항 제2호는 ‘장해보상일시금을 받은 사람이 재요양 후의 장해상태가 종전에 비하여 악화되어 장해보상일시금을 청구한 경우에는 변경된 장해등급에 해당하는 장해보상일시금의 지급일수에서 종전의 장해등급에 해당하는 장해보상일시금의 지급일수를 뺀 일수에 평균임금을 곱한 금액을 지급한다.’고 규정하고 있다.\n  산재보험법 시행령 제58조 제3항 제2호의 취지는, 업무상의 재해로 요양급여 및 장해보상일시금을 받은 사람이 재요양 후 장해상태가 악화되어 변경된 장해등급에 해당하는 장해보상일시금을 전액 받게 된다면 이미 보상받은 장해급여 부분에 대해서까지 중복하여 장해급여를 받는 결과가 되므로, 이러한 불합리한 결과가 발생하는 것을 막기 위함이다(대법원 2020. 10. 29. 선고 2019두31426 판결 참조). \n  2) 관련 법령의 내용과 체계에 산재보험법 시행령 제58조 제3항 제2호의 취지를 종합하면, 폐광된 광산에서 진폐로 인한 업무상 재해를 입은 사람(이하 ‘진폐근로자’라 한다)이 종전 장해등급에 해당하는 구 석탄산업법상 재해위로금을 지급받은 후 장해상태가 악화되어 장해등급이 변경되었을 경우, 그가 지급받을 재해위로금액은 산재보험법 시행령 제58조 제3항 제2호를 유추적용하여 ‘변경된 장해등급에 해당하는 장해보상일시금의 지급일수에서 종전의 장해등급에 해당하는 장해보상일시금의 지급일수를 뺀 일수에 평균임금을 곱한 금액’으로 산정함이 타당하다. \n  그러나 이와 달리 진폐근로자가 종전의 장해등급에 해당하는 재해위로금을 지급받지 못한 상태에서 장해상태가 악화되어 장해등급이 변경되었음에도, 피고가 변경된 장해등급이 아니라 종전의 장해등급에 해당하는 장해보상일시금 상당의 재해위로금만을 지급하였다면, 특별한 사정이 없는 한 이는 변경된 장해등급에 해당하는 재해위로금에 대한 일부 변제로서의 성격을 가진다고 봄이 타당하다. 이러한 경우 피고로서는 진폐근로자에게 변경된 장해등급에 해당하는 재해위로금액에서 실제 지급한 금원의 금액을 뺀 나머지를 지급할 의무가 있고, 이와 달리 이러한 경우에까지 산재보험법 시행령 제58조 제3항 제2호를 유추적용하여 변경된 장해등급에 따라 지급할 재해위로금을 산정할 것은 아니다(대법원 2025. 11. 6. 선고 2022두67272 판결 참조).\n  3) 다만 위와 같이 진폐근로자가 피고로부터 변경된 장해등급에 해당하는 재해위로금액에 미치지 못하는 금액의 재해위로금만을 지급받은 상태에서 재차 장해상태가 악화되어 장해등급이 변경되었다면, 피고로서는 산재보험법 시행령 제58조 제3항 제2호를 유추적용하여 산정한 최종 변경된 장해등급에 해당하는 재해위로금과 위 기지급 재해위로금 지급 당시 진폐근로자가 진단받은 장해등급에 해당하는 재해위로금의 차액(이하 ‘최종 변경된 장해등급에 따라 지급할 재해위로금’이라 한다)을 지급하고, 이에 더하여 기존에 지급된 재해위로금의 과소 산정에 대한 정산으로서 변경된 장해등급에 해당하는 재해위로금액과 기지급 재해위로금액의 차액을 지급할 의무가 있다. 그 이유는 다음과 같다. \n  가) 진폐근로자가 변경된 장해등급에 해당하는 재해위로금액에 미치지 못하는 금액의 재해위로금만을 지급받은 경우 변경된 장해등급에 해당하는 재해위로금과 실제 지급된 재해위로금의 차액을 지급받을 권리가 있고, 위 지급청구권에 따라 피고로부터 그 차액을 지급받는다면 이로써 변경된 장해등급에 해당하는 재해위로금을 모두 지급받는 것이므로, 그 후 장해상태가 재차 악화되어 장해등급이 최종 변경된 경우 그 최종 변경된 장해등급에 따라 지급할 재해위로금은 산재보험법 시행령 제58조 제3항 제2호를 유추적용하여 산정하는 것이 타당하고, 산재보험법 시행령 제58조 제3항 제2호의 문언상 반드시 진폐근로자가 종전의 장해등급에 해당하는 재해위로금 전액을 지급받은 경우에만 위 규정이 정한 방식에 따라 재해위로금을 산정하여야 한다고 한정할 것은 아니다.  \n  나) 한편 최종 변경된 장해등급에 따라 지급할 재해위로금을 산재보험법 시행령 제58조 제3항 제2호를 유추적용하여 산정할 때, 이 사건과 같이 진폐근로자에게 재해위로금 명목으로 지급된 금원이 변경된 장해등급으로 상향되기 이전의 장해등급에 해당하는 재해위로금 산정 방식에 따라 산정된 것이라 하여, 최종 변경된 장해등급에 해당하는 산재보험법상 장해보상일시금 지급일수에서 위 금원 산정의 기초가 된 장해등급에 해당하는 산재보험법상 장해보상일시금 지급일수를 뺀 일수를 기초로 산정할 것은 아니다. 앞서 본 바와 같이 위 기지급 재해위로금은 특별한 사정이 없는 한 그 산정의 기초가 된 장해등급에 해당하는 재해위로금으로서 지급된 것이 아니라, 그 지급 당시의 변경된 장해등급에 해당하는 재해위로금에 대한 일부 변제로서 지급된 것이라고 봄이 옳기 때문이다.  \n  나. 판단  \n  1) 앞서 본 사실관계를 이러한 법리에 비추어 살펴보면, 원고들에게 지급할 재해위로금은 다음과 같은 방식으로 산정하여야 한다. \n  가) 원고 1에게 지급할 재해위로금의 액수에 관하여 본다. 산재보험법 제57조 제2항 [별표 2]에 따르면, 장해등급 제3급에 해당하는 장해보상일시금 지급일수는 1,155일이고, 장해등급 제5급에 해당하는 장해보상일시금 지급일수는 869일이다. 한편 원고 1의 장해등급 제5급 진단 당시의 평균임금은 96,325.59원이고, 장해등급 제3급 진단 당시의 평균임금은 99,361.57원이다. \n  따라서 피고는 원고 1에게 장해등급 제3급 상향에 따라 지급할 재해위로금 28,417,409원[= 99,361.57원 × 286일(1,155일 － 869일), 원 미만은 버림. 이하 같다] 및 장해등급 제5급에 해당하는 재해위로금의 미지급금 81,577,237원[= 83,706,937원(= 96,325.59원 × 869일) - 2,129,700원]의 합계 109,994,646원(= 28,417,409원 + 81,577,237원)을 재해위로금으로 지급할 의무가 있다.\n  나) 원고 2에게 지급할 재해위로금의 액수에 관하여 본다. 산재보험법 제57조 제2항 [별표 2]에 따르면, 장해등급 제3급에 해당하는 장해보상일시금 지급일수는 1,155일이고, 장해등급 제5급에 해당하는 장해보상일시금 지급일수는 869일이다. 한편 원고 2의 장해등급 제5급 진단 당시의 평균임금은 146,348.52원이고, 장해등급 제3급 진단 당시의 평균임금은 151,229.19원이다. \n  따라서 피고는 원고 2에게 장해등급 제3급 상향에 따라 지급할 재해위로금 43,251,548원[= 151,229.19원 × 286일(1,155일 － 869일)] 및 장해등급 제5급에 해당하는 재해위로금의 미지급금 123,032,073원[= 127,176,863원(= 146,348.52원 × 869일) - 4,144,790원]의 합계 166,283,621원(= 43,251,548원 + 123,032,073원)을 재해위로금으로 지급할 의무가 있다.  \n  2) 그런데도 원심은 판시와 같은 이유로, 피고가 원고들의 각 장해등급 제3급에 해당하는 장해보상일시금 지급일수에서 선행 재해위로금 산정의 기초가 된 장해등급 제11급에 해당하는 장해보상일시금 지급일수를 뺀 일수에 평균임금을 곱하여 산정한 금액을 ‘최종 변경된 장해등급 제3급에 따라 지급할 재해위로금’으로 지급하는 한편, 선행 재해위로금 지급 당시의 평균임금에 장해등급 제11급에 해당하는 장해보상일시금 지급일수를 곱한 금액에서 선행 재해위로금액을 뺀 나머지를 미지급금으로 지급할 의무가 있다고 판단하였다. \n  3) 이러한 원심의 판단에는 구 석탄산업법상 재해위로금의 산정방식 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 취지의 상고이유 주장은 이유 있다.  \n  4. △△△탄광의 폐광일에 관하여 \n  가. 이 부분 상고이유는 원심의 판단과 달리 원고 2가 그가 근무하던 △△△탄광 폐광일로부터 소급하여 1년 전에 업무상 재해를 입은 자이므로, 위 원고는 구 석탄산업법에 따른 재해위로금 지급대상에 해당하지 않는다는 취지이다. \n  나. 그러나 이러한 주장은 사실심법원의 전권에 속하는 증거의 취사선택과 사실인정을 다투는 취지에 불과하므로 적법한 상고이유로 삼을 수 없다. \n  5. 결론 \n  가. 원심판결 중 아래 인정 범위를 초과하여 지급을 명한 부분을 파기하되, 이 부분 사건은 이 법원이 직접 재판하기에 충분하므로, 행정소송법 제8조 제2항, 민사소송법 제437조에 따라 자판하기로 한다. \n  피고는 원고 1에게 109,994,646원 및 그중 89,289,009원에 대하여 원고 1이 구하는 바에 따라 이 사건 소장 부본 송달 다음 날인 2020. 5. 29.부터, 나머지 20,705,637원에 대하여 원고 1이 구하는 바에 따라 제1심 청구취지 및 청구원인 변경신청서 부본 송달 다음 날인 2020. 11. 6.부터 피고가 이행의무의 존부나 범위에 관하여 항쟁하는 것이 타당하다고 인정되는 원심판결 선고일인 2022. 6. 24.까지 민법이 정한 연 5%, 그다음 날부터 다 갚는 날까지 「소송촉진 등에 관한 특례법」이 정한 연 12%의 각 비율로 계산한 지연손해금을, 원고 2에게 166,283,621원 및 그중 92,768,867원에 대하여 원고 2가 구하는 바에 따라 이 사건 소장 부본 송달 다음 날인 2020. 5. 29.부터, 나머지 73,514,754원에 대하여 원고 2가 구하는 바에 따라 제1심 청구취지 및 청구원인 변경신청서 부본 송달 다음 날인 2020. 11. 6.부터 피고가 이행의무의 존부나 범위에 관하여 항쟁하는 것이 타당하다고 인정되는 원심판결 선고일인 2022. 6. 24.까지 민법이 정한 연 5%, 그다음 날부터 다 갚는 날까지 「소송촉진 등에 관한 특례법」이 정한 연 12%의 각 비율로 계산한 지연손해금을 지급할 의무가 있다. \n  따라서 원고들의 이 사건 청구는 위 인정 범위 내에서 이유 있고, 원심판결 중 위 인정 범위를 초과하여 지급을 명한 부분은 부당하므로 그에 해당하는 원고들의 청구를 각 기각한다. \n  나. 나머지 상고를 모두 기각하고, 소송총비용의 부담을 정하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 권영준(재판장) 오경미 엄상필 박영재(주심)"

    "판시사항": "공정거래위원회가 구 전자상거래 등에서의 소비자보호에 관한 법률 제34조 제1항 등에 따라 위반사업자에 영업정지를 갈음하여 과징금을 부과할 수 있는 경우 및 ‘회사분할 등으로 영업정지처분이 제재처분으로서 실효성이 없게 된 경우’를 위 과징금 부과사유에 포함하는 것으로 해석할 수 있는지 여부(소극)",
    "판결요지": "구 전자상거래 등에서의 소비자보호에 관한 법률(2024. 2. 13. 법률 제20302호로 개정되기 전의 것, 이하 ‘구 전자상거래법’이라 한다) 제34조 제1항은 \"공정거래위원회는 제32조 제4항에 따른 영업정지가 소비자 등에게 심한 불편을 줄 우려가 있다고 인정하는 경우에는 그 영업의 전부 또는 일부의 정지를 갈음하여 해당 사업자에게 대통령령으로 정하는 위반행위 관련 매출액을 초과하지 아니하는 범위에서 과징금을 부과할 수 있다.\"라고 정하고, 제2항은 \"공정거래위원회는 제1항에 따라 그 영업의 전부 또는 일부의 정지를 갈음하여 과징금을 부과할 수 있는 판단 기준을 정하여 고시할 수 있다.\"라고 규정함으로써 고시에 과징금 부과의 판단 기준을 구체적으로 정하도록 위임하고 있다.\n  그 위임에 따라 구 ‘전자상거래 소비자보호법 위반사업자에 대한 과징금 부과기준 고시’(2021. 12. 29. 공정거래위원회고시 제2021-49호로 개정되기 전의 것)는 ‘과징금은 법 제34조 제1항에 따라 영업의 전부 또는 일부의 정지를 명할 수 있는 경우에 부과할 수 있으며, 다음 각 목의 어느 하나에 해당하는 경우에는 원칙적으로 영업정지를 갈음하여 과징금을 부과한다.’고 정하면서, 각 목의 사유로 ‘영업정지가 영업정지 대상인 사업자와 거래관계에 있는 다수의 소비자들 및 위반사업자와 관계되는 다수의 사용자들에게 심한 불편을 줄 우려가 있는 경우’와 ‘영업정지로 인해 영업정지 대상인 사업자와 거래관계에 있는 다수의 중소 사업자들에게 손해가 발생할 우려가 있는 경우’를 들고 있다. \n  위 관련 규정들을 종합하면, 공정거래위원회는 ‘구 전자상거래법상 영업정지가 소비자 등에게 심한 불편을 줄 우려가 있다고 인정하는 경우’에 한하여 영업정지를 갈음하는 과징금을 부과할 수 있고, ‘회사분할 등으로 영업정지처분이 제재처분으로서 실효성이 없게 된 경우’까지 과징금 부과사유에 포함하는 것으로 해석하는 것은 위 문언의 가능한 의미를 벗어나므로 유추해석금지의 원칙에 반한다.",
    "참조조문": "구 전자상거래 등에서의 소비자보호에 관한 법률(2024. 2. 13. 법률 제20302호로 개정되기 전의 것) 제34조 제1항, 제2항",
    "참조판례": "",
    "판례내용": "【원고, 상고인】                주식회사 ○○○ (소송대리인 법무법인(유한) 세종 담당변호사 최한순 외 4인)\n【피고, 피상고인】 공정거래위원회 (소송대리인 법무법인 최선 담당변호사 이준상 외 1인)\n【원심판결】  서울고법 2025. 1. 23. 선고 2024누34032 판결         \n【주    문】\n  원심판결 중 과징금납부명령 취소청구 부분을 파기하고, 이 부분 사건을 서울고등법원에 환송한다.  나머지 상고를 기각한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위 내에서)를 판단한다.\n  1. 원심판결 이유와 기록에 의하면 다음 사실을 알 수 있다.\n  가. 원고는 2017. 5.경부터 2021. 5.경까지 △△ 애플리케이션 등을 통하여 디지털 음원서비스 상품을 판매하는 사업을 하던 자로서 구 「전자상거래 등에서의 소비자보호에 관한 법률」(2024. 2. 13. 법률 제20302호로 개정되기 전의 것, 이하 ‘구 전자상거래법’이라 한다) 제2조 제3호 소정의 ‘통신판매업자’이다.\n  나. △△의 유료서비스약관에 의하면, 원고의 정기결제형 이용권을 구입한 소비자는 사용기간 중 음원서비스 이용권을 중도해지할 수 있는 것으로 되어 있었다. 그러나 원고는 2017. 5. 17.부터 2021. 5. 26.까지 △△ 등 애플리케이션에는 중도해지 기능을 제공하지 않고 △△ 웹사이트를 이용해서만 중도해지를 할 수 있게 하면서, 애플리케이션에서 해지신청을 한 소비자에게 이러한 사실을 고지하지 아니하였다(이하 ‘이 사건 위반행위’라 한다).\n  다. 원고는 2021. 7. 1. 디지털 음원서비스 부문을 분할하여 주식회사 △△컴퍼니를 신설하였고, 주식회사 ○○○엔터테인먼트가 2021. 9. 1. 주식회사 △△컴퍼니를 흡수합병하였다.\n  라. 피고는 이 사건 위반행위가 구 전자상거래법 제21조 제1항 제1호 소정의 ‘기만적 방법을 사용하여 소비자의 계약해지를 방해하는 행위’에 해당한다고 보고, 2024. 1. 10. 의결 제2024-016호로 분할존속회사인 원고에 대하여 ① 같은 법 제32조 제1항에 따라 ‘기만적 방법으로 소비자의 중도해지를 방해하는 행위를 금지’하는 시정명령(이하 ‘이 사건 시정명령’이라 한다)을 하고, ② ‘영업을 정지하더라도 △△을 통하여 신규가입자를 받는 등 사실상 영업을 계속할 수 있으므로 영업정지의 실효성이 없다.’는 이유로 같은 법 제34조 제1항, 구 ‘전자상거래 소비자보호법 위반사업자에 대한 과징금 부과기준 고시’(2021. 12. 29. 공정거래위원회고시 제2021-49호로 개정되기 전의 것, 이하 ‘구 과징금 고시’라 한다) 등에 따라 영업정지를 갈음하여 과징금 9,800만 원을 부과하는 과징금납부명령(이하 ‘이 사건 과징금납부명령’이라 한다)을 하였다.\n  2. 이 사건 과징금납부명령의 적법 여부에 관하여\n  가. 침익적 행정처분은 상대방의 권익을 제한하거나 상대방에게 의무를 부과하는 것이므로 헌법상 요구되는 명확성의 원칙에 따라 그 근거가 되는 행정법규를 더욱 엄격하게 해석ㆍ적용해야 하고, 행정처분의 상대방에게 지나치게 불리한 방향으로 확대해석이나 유추해석을 해서는 아니 되며(대법원 2016. 11. 25. 선고 2015두37815 판결 등 참조), 그 입법 취지와 목적 등을 고려한 목적론적 해석이 전적으로 배제되는 것은 아니라고 하더라도 그 해석이 문언의 통상적인 의미를 벗어나서는 아니 된다(대법원 2018. 2. 28. 선고 2016두64982 판결 등 참조).\n  나.                구 전자상거래법 제34조 제1항은 \"공정거래위원회는 제32조 제4항에 따른 영업정지가 소비자 등에게 심한 불편을 줄 우려가 있다고 인정하는 경우에는 그 영업의 전부 또는 일부의 정지를 갈음하여 해당 사업자에게 대통령령으로 정하는 위반행위 관련 매출액을 초과하지 아니하는 범위에서 과징금을 부과할 수 있다.\"라고 정하고, 제2항은 \"공정거래위원회는 제1항에 따라 그 영업의 전부 또는 일부의 정지를 갈음하여 과징금을 부과할 수 있는 판단 기준을 정하여 고시할 수 있다.\"라고 규정함으로써 고시에 과징금 부과의 판단 기준을 구체적으로 정하도록 위임하고 있다.\n  그 위임에 따라 구 과징금 고시는 ‘과징금은 법 제34조 제1항에 따라 영업의 전부 또는 일부의 정지를 명할 수 있는 경우에 부과할 수 있으며, 다음 각 목의 어느 하나에 해당하는 경우에는 원칙적으로 영업정지를 갈음하여 과징금을 부과한다.’고 정하면서, 각 목의 사유로 ‘영업정지가 영업정지 대상인 사업자와 거래관계에 있는 다수의 소비자들 및 위반사업자와 관계되는 다수의 사용자들에게 심한 불편을 줄 우려가 있는 경우’와 ‘영업정지로 인해 영업정지 대상인 사업자와 거래관계에 있는 다수의 중소 사업자들에게 손해가 발생할 우려가 있는 경우’를 들고 있다.\n  다. 위 관련 규정들을 종합하여 보면, 피고는 ‘구 전자상거래법상 영업정지가 소비자 등에게 심한 불편을 줄 우려가 있다고 인정하는 경우’에 한하여 영업정지를 갈음하는 과징금을 부과할 수 있고, ‘회사분할 등으로 영업정지처분이 제재처분으로서 실효성이 없게 된 경우’까지 과징금 부과사유에 포함하는 것으로 해석하는 것은 위 문언의 가능한 의미를 벗어나므로 유추해석금지의 원칙에 반한다.\n  라. 따라서 ‘신설회사를 통하여 이 사건 위반행위와 관련된 영업을 사실상 계속할 수 있어 분할존속회사인 원고에 대한 영업정지의 실효성이 없다.’는 이유로 이루어진 이 사건 과징금납부명령은 처분의 요건을 갖추지 못하여 위법하다. 그럼에도 원심은 판시와 같은 이유로 이 사건 과징금납부명령이 관계 법령에 위배된다고 볼 수 없다고 판단하였는바, 이러한 원심판결에는 구 전자상거래법 제34조 제1항에서 정한 영업정지를 갈음하는 과징금의 부과사유에 대한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 이 부분 상고이유 주장은 이유 있다.\n  3. 나머지 상고이유 주장에 관하여\n  원심은 그 판시와 같은 이유로, 이 사건 위반행위가 구 전자상거래법 제21조 제1항 제1호 소정의 ‘기만적 방법을 사용하여 소비자의 계약해지를 방해하는 행위’에 해당하고, 이를 이유로 분할존속회사인 원고에게 이 사건 시정명령을 한 것이 적법하다고 판단하였다.\n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 위와 같은 원심의 판단에 상고이유 주장과 같이 구 전자상거래법 제21조 제1항 제1호 위반행위 및 회사분할 시 제재사유 승계에 관한 법리오해 등의 잘못이 없다.\n  4. 결론\n  그러므로 원심판결 중 과징금납부명령 취소청구 부분을 파기하고, 이 부분 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하되, 나머지 상고는 이유 없으므로 이를 기각하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 권영준(재판장) 오경미 엄상필 박영재(주심)"
  },

    "판시사항": "[1] 진폐로 업무상 재해를 입은 근로자가 처음 장해등급 판정을 받았다가 장해등급이 변경된 경우, 장해등급 변경에 따른 재해위로금 지급을 청구할 수 있는지 여부(적극)\n\n[2] 폐광된 광산에서 진폐로 업무상 재해를 입은 사람이 종전 장해등급에 해당하는 구 석탄산업법상 재해위로금을 전액 지급받은 후 장해상태가 악화되어 장해등급이 변경되었을 경우, 진폐근로자가 지급받을 재해위로금액 산정 방법 / 진폐근로자가 종전 장해등급에 해당하는 재해위로금을 지급받지 못한 상태에서 장해상태가 악화되어 장해등급이 변경되었음에도, 한국광해광업공단이 종전 장해등급에 해당하는 장해보상일시금 상당의 재해위로금만 지급한 경우, 한국광해광업공단이 지급해야 할 재해위로금액의 산정 방법 및 이 경우 산업재해보상보험법 시행령 제58조 제3항 제2호를 유추적용하여 변경된 장해등급에 따라 지급할 재해위로금을 산정해야 하는지 여부(소극)",

    "참조조문": "[1] 구 석탄산업법(1993. 3. 6. 법률 제4541호로 개정되기 전의 것) 제39조의3 제1항 제4호, 구 석탄산업법 시행령(1990. 12. 31. 대통령령 제13216호로 개정되기 전의 것) 제41조 제3항 제4호(현행 제41조 제4항 제5호 참조) / [2] 구 석탄산업법(1993. 3. 6. 법률 제4541호로 개정되기 전의 것) 제39조의3 제1항 제4호, 구 석탄산업법 시행령(1990. 12. 31. 대통령령 제13216호로 개정되기 전의 것) 제41조 제3항 제4호(현행 제41조 제4항 제5호 참조), 산업재해보상보험법 제51조 제1항, 제60조 제2항, 산업재해보상보험법 시행령 제58조 제3항 제2호",

    "판례내용": "【원고, 피상고인】                원고 1 외 3인 (소송대리인 법무법인 사람앤스마트 담당변호사 김찬영 외 3인)\n【피고, 상고인】 한국광해광업공단 (소송대리인 법무법인 강한 담당변호사 노영재 외 1인)\n【원심판결】  서울고법 2022. 9. 28. 선고 2021누64544 판결         \n【주    문】\n  상고를 모두 기각한다.  원고 1의 소송수계신청인 소외 1, 소외 2, 소외 3의 소송수계신청을 모두 기각한다.  상고비용 중 소송수계신청으로 인한 부분은 소송수계신청인 소외 1, 소외 2, 소외 3이 부담하고, 나머지는 피고가 부담한다.\n\n【이    유】상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 적법하게 채택된 증거에 따르면, 다음 사실을 알 수 있다.\n  가. 원고 1         \n  1) 원고 1은 1962. 8. 1.부터 1989. 4. 30.까지 ○○광업에서 근무하였다. 위 사업장은 1989. 10. 23. 광업권 소멸등록과 함께 폐광되어 구 석탄산업법(1993. 3. 6. 법률 제4541호로 개정되기 전의 것, 이하 같다) 제39조의2 제1항에 따른 폐광대책비 지원 대상이 되었다. \n  2) 원고 1은 ○○광업에서 근무하던 중 1979. 10. 2. 진폐 장해등급 제11급 진단을 받았다. 그 후 원고 1은 장해상태의 변동에 따라 2006. 5. 24. 장해등급 제7급, 2015. 5. 22. 장해등급 제3급, 2018. 1. 18. 장해등급 제7급 진단을 각각 받았다. \n  3) 원고 1은 1980. 4. 3. 장해등급 제11급에 따른 장해보상일시금 890,630원을, 2006. 10. 13. 장해등급 제7급에 따른 장해보상일시금 34,099,730원을 각 수령하였고, 2018. 2. 1.부터 장해등급 제7급에 따른 진폐보상연금을 수령하여 왔다.\n  4) 원고 1은 2017. 3. 15. 한국광해관리공단으로부터 과거 장해등급 제11급 및 제7급 진단 당시의 평균임금에 기초하여 산정한 산업재해보상보험법(이하 ‘산재보험법’이라 한다)상 장해보상일시금 액수와 동일한 34,990,360원(= 890,630원 + 34,099,730원)을 재해위로금 명목으로 지급받았다(이하 ‘2017. 3. 15. 자 선행 재해위로금’이라 한다).\n  나. 원고 2, 원고 3, 원고 4         \n  1) 소외 4는 1986. 7. 3.부터 1989. 12. 31.까지 △△광업소에서 근무하였다. 위 사업장은 1990. 1. 3. 광업권 소멸등록과 함께 폐광되어 구 석탄산업법 제39조의2 제1항에 따른 폐광대책비 지원 대상이 되었다. \n  2) 소외 4는 △△광업소에서 근무하던 중 1987. 7. 27. 진폐 장해등급 제11급 진단을 받았다. 그 후 소외 4는 장해상태의 변동에 따라 2008. 12. 8. 장해등급 제9급, 2010. 1. 18. 장해등급 제11급, 2011. 8. 9. 장해등급 제9급, 2012. 9. 25. 장해등급 제11급, 2014. 5. 23. 장해등급 제9급, 2015. 8. 3. 장해등급 제11급, 2016. 4. 5. 장해등급 제5급 진단을 각각 받았고, 2016. 9. 2. 합병증으로 사망하였다. \n  3) 망 소외 4(이하 ‘망인’이라 한다)의 상속인으로는 배우자인 원고 2와 자녀인 원고 3, 원고 4가 있다.\n  4) 망인은 1988. 9. 8. 장해등급 제11급에 따른 장해보상일시금 3,488,440원을, 2009. 5. 6. 장해등급 제9급에 따른 장해보상일시금 22,363,220원을 각 수령하였고, 2016. 5. 1.부터 장해등급 제5급에 따른 진폐보상연금을 수령하였다.\n  5) 망인은 2016. 6. 24. 한국광해관리공단으로부터 과거 장해등급 제9급 진단 당시의 평균임금에 기초하여 산정한 산재보험법상 장해보상일시금 액수와 동일한 22,363,220원을 재해위로금 명목으로 지급받았다(이하 ‘2016. 6. 24. 자 선행 재해위로금’이라 한다).\n  다. 피고의 지위\n  1986. 1. 8. 제정된 석탄산업법 제31조에 따라 석탄광산의 폐광대책사업 등을 수행하기 위하여 석탄산업합리화사업단이 설립되었고, 2005. 5. 31. 제정된 「광산피해의 방지 및 복구에 관한 법률」 제31조에 근거하여 광해방지사업을 효율적으로 수행하기 위해 2006. 6. 1. 광해방지사업단이 설립되면서 같은 법 부칙 제3조에 따라 석탄산업합리화사업단의 권리·의무를 승계하였다. 광해방지사업단은 2008. 3. 28. 위 법률이 개정되면서 2008. 6. 28. 한국광해관리공단으로 명칭이 변경되었다. 그 후 2021. 3. 9. 제정된 한국광해광업공단법에 근거하여 2021. 9. 10. 피고가 설립되면서 위 법률 부칙 제6조 제1항에 따라 한국광해관리공단의 모든 권리·의무를 포괄적으로 승계하였다. 그에 따라 피고는 원심에서 소송절차를 수계하였다. \n  2. 제1 상고이유에 관한 판단\n  가. 관련 법리\n  진폐로 인한 업무상 재해를 입은 근로자가 처음에 경도의 증상으로 낮은 등급의 장해등급 판정을 받았다가 서서히 증상이 악화되어 장해등급이 상향될 것인지 또는 처음부터 중증의 증상이 발현되어 높은 등급의 장해등급 판정을 받을 것인지 여부는 예측 곤란한 진폐증의 진행 속도에 따른 우연한 사정에 불과하다. 그런데 전자에 대하여 ‘종전 장해등급에 따른 장해보상일시금’과 ‘변경된 장해등급에 따라 추가로 지급될 장해보상일시금’의 단순 합계액으로 재해위로금을 지급할 경우에는 처음부터 높은 등급의 장해등급 판정을 받은 사람보다 낮은 액수의 재해위로금을 지급받게 된다. 그러나 진폐증의 진행 속도에만 차이가 있을 뿐 최종적으로 확정된 장해등급이 같은 두 사람의 재해위로금 액수를 달리할 합리적 이유를 찾기 어렵다. 그러므로 장해등급이 변경된 경우 장해등급 변경에 따른 재해위로금의 지급을 청구할 수 있다고 보아야 한다(대법원 2020. 10. 29. 선고 2019두31426 판결 참조). \n  나. 이 사건에 관한 판단\n  원심은 판시와 같은 이유로 원고 1의 장해등급이 확정된 시점은 최초 장해등급 제7급 진단을 받은 때가 아니라 최종적으로 장해등급 제7급 진단을 받은 2018. 1. 18.경이고, 원고 1은 특별한 사정이 없는 한 최종 장해등급 제7급에 해당하는 재해위로금 지급청구권을 가진다고 판단하였다.\n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 원심의 판단에 상고이유 주장과 같이 구 석탄산업법 및 산재보험법에 따른 재해위로금 지급청구권의 발생 등에 관한 법리를 오해하거나 필요한 심리를 다하지 아니하여 판결에 영향을 미친 잘못이 없다. \n  3. 제2 상고이유에 관한 판단\n  가. 관련 법령 및 법리\n  1) 구 석탄산업법 제39조의3 제1항은 ‘폐광대책비의 지급 대상이 되는 광산의 석탄광업자가 당해 광업권·조광권 또는 계속작업권의 소멸등록을 마친 때에는 석탄산업합리화사업단은 당해 광산의 퇴직근로자 및 석탄광업자 등에게 다음 각 호의 금액을 폐광대책비로 지급하여야 한다.’라고 규정하면서, 제4호에서 ‘기타 대통령령이 정하는 폐광대책비’를 들고 있다. 그 위임에 따라 구 석탄산업법 시행령(1990. 12. 31. 대통령령 제13216호로 개정되기 전의 것) 제41조 제3항 제4호(이하 ‘이 사건 조항’이라 한다)는 \"폐광일로부터 소급하여 1년 이내에 업무상 재해를 입은 자로서 폐광일 현재 장해등급이 확정된 자 또는 재해발생기간에 불구하고 폐광일 현재 장해등급이 확정되지 아니한 자에 대하여 지급하는 재해위로금. 이 경우 재해위로금액은 퇴직근로자가 지급받은 산업재해보상보험법 제9조의5 제1항의 규정에 의한 장해보상일시금 또는 동법 제9조의6 제1항의 유족보상일시금과 동일한 금액으로 한다.\"라고 규정하고 있다. 이 사건 조항은 여러 차례 개정되었으나, 그 위치가 같은 조 제4항 제5호로 변경되었을 뿐 그 내용은 실질적으로 동일하게 유지되었다. \n  산재보험법 제51조 제1항은 ‘요양급여를 받은 사람이 치유 후 요양의 대상이 되었던 업무상의 부상 또는 질병이 재발하거나 치유 당시보다 상태가 악화되어 이를 치유하기 위한 적극적인 치료가 필요하다는 의학적 소견이 있으면 다시 재요양을 받을 수 있다.’고 규정하고 있고, 제60조 제2항은 ‘재요양을 받고 치유된 후 장해상태가 종전에 비하여 악화된 경우에는 그 악화된 장해상태에 해당하는 장해등급에 따라 장해급여를 지급하고 이 경우 재요양 후의 장해급여의 산정 및 지급 방법은 대통령령으로 정한다.’고 규정하고 있다. 그 위임에 따라 산업재해보상보험법 시행령(이하 ‘산재보험법 시행령’이라 한다) 제58조 제3항 제2호는 ‘장해보상일시금을 받은 사람이 재요양 후의 장해상태가 종전에 비하여 악화되어 장해보상일시금을 청구한 경우에는 변경된 장해등급에 해당하는 장해보상일시금의 지급일수에서 종전의 장해등급에 해당하는 장해보상일시금의 지급일수를 뺀 일수에 평균임금을 곱한 금액을 지급한다.’고 규정하고 있다. \n  산재보험법 시행령 제58조 제3항 제2호의 취지는, 업무상의 재해로 요양급여 및 장해보상일시금을 받은 사람이 재요양 후 장해상태가 악화되어 변경된 장해등급에 해당하는 장해보상일시금을 전액 받게 된다면, 이미 보상받은 장해급여 부분에 대해서까지 중복하여 장해급여를 받는 결과가 되므로, 이러한 불합리한 결과가 발생하는 것을 막기 위함이다(대법원 2020. 10. 29. 선고 2019두31426 판결 참조).\n  2) 위와 같은 관련 규정들의 내용과 체계에 산재보험법 시행령 제58조 제3항 제2호의 취지를 종합하면, 폐광된 광산에서 진폐로 인한 업무상 재해를 입은 사람(이하 ‘진폐근로자’라 한다)이 종전 장해등급에 해당하는 구 석탄산업법상 재해위로금을 전액 지급받은 후 장해상태가 악화되어 장해등급이 변경되었을 경우, 그가 지급받을 재해위로금액은 산재보험법 시행령 제58조 제3항 제2호를 유추적용하여 ‘변경된 장해등급에 해당하는 장해보상일시금의 지급일수에서 종전의 장해등급에 해당하는 장해보상일시금의 지급일수를 뺀 일수에 평균임금을 곱한 금액’으로 산정함이 타당하다. \n  3) 그러나 이와 달리 진폐근로자가 종전의 장해등급에 해당하는 재해위로금을 지급받지 못한 상태에서 장해상태가 악화되어 장해등급이 변경되었음에도, 피고가 변경된 장해등급이 아니라 종전의 장해등급에 해당하는 장해보상일시금 상당의 재해위로금만을 지급하였다면, 특별한 사정이 없는 한 이는 변경된 장해등급에 해당하는 재해위로금에 대한 일부 변제로서의 성격을 가진다고 봄이 타당하다. 이러한 경우 피고로서는 진폐근로자에게 변경된 장해등급에 해당하는 재해위로금액에서 실제 지급한 금액을 뺀 나머지를 지급할 의무가 있고, 이와 달리 이러한 경우에까지 산재보험법 시행령 제58조 제3항 제2호를 유추적용하여 변경된 장해등급에 따라 지급할 재해위로금을 산정할 것은 아니다. 그 이유는 다음과 같다. \n  가) 이 사건 조항은 장해등급 ‘판정’이 아닌 장해등급 ‘확정’을 기준으로 삼고 있으므로 종전에 장해등급 판정이 있었더라도 나중에 장해등급이 변경되었다면 변경된 최종 장해등급을 기준으로 재해위로금의 액수를 산정하여 지급함이 타당하다. \n  나) 산재보험법 시행령 제58조 제3항은 ‘장해보상일시금을 받은 사람’이 재요양을 한 후의 장해상태가 종전에 비하여 악화된 경우를 규정하여 ‘근로자가 장해급여를 실제 수령한 것’을 전제로 입법이 이루어져 있다. 이는 업무상 재해로 장해급여를 받은 자가 그 부상 또는 질병이 재발하여 재요양을 받은 후 장해상태가 변경된 경우 이미 지급된 기존 장해등급에 관한 장해급여와 중복지급을 방지하기 위한 것이다. 따라서 기존에 재해위로금을 지급받은 바 없어 재해위로금의 중복지급 문제 자체가 발생하지 않는 근로자의 경우에는, 산재보험법 시행령 제58조 제3항 제2호가 유추적용될 수 없다. \n  다) 한편 구 석탄산업법 제39조의3 제1항 제4호 및 이 사건 조항의 취지를 종합하면, 진폐근로자가 피고에 대하여 가지는 재해위로금 지급청구권은 위 규정이 정하는 지급요건이 충족되면 당연히 발생함과 아울러 그 금액도 확정되는 것이지 피고의 지급결정 여부에 의하여 그 청구권의 발생이나 금액이 좌우되는 것이 아니다(대법원 1999. 1. 26. 선고 98두12598 판결 참조). 따라서 진폐근로자가 재요양 후 장해상태가 악화되어 장해등급이 변경되었다면, 그 변경된 장해등급에 해당하는 재해위로금 지급청구권이 당연히 발생함과 아울러 그 금액도 확정된다. 이러한 상태에서 변경된 장해등급에 해당하는 재해위로금의 액수에 미치지 못하는 금원이 재해위로금 명목으로 지급되었다면, 설령 위 금원이 종전의 장해등급에 해당하는 재해위로금 산정 방식에 따라 산정된 것이라 하더라도, 이는 이미 발생하여 금액까지 확정된 변경된 장해등급에 해당하는 재해위로금의 변제를 위하여 지급된 것이라고 봄이 앞서 본 재해위로금의 법적 성격에 부합한다. \n  나. 이 사건에 관한 판단\n  원심은 판시와 같은 이유로, 피고는 원고 1에게 위 원고의 최종 장해등급 제7급에 해당하는 장해보상일시금 상당액에서 위 원고가 장해등급 제3급 진단 후에 지급받은 2017. 3. 15. 자 선행 재해위로금 액수를 공제한 나머지 금원 및 이에 대한 지연손해금을 재해위로금으로 지급할 의무가 있고, 망인의 상속인들인 원고 2, 원고 3, 원고 4에게 망인의 최종 장해등급 제5급에 해당하는 장해보상일시금 상당액에서 망인이 장해등급 제5급 진단 후에 지급받은 2016. 6. 24. 자 선행 재해위로금 액수를 공제한 나머지 금액을 각각의 상속분에 따라 나눈 각 금원 및 이에 대한 지연손해금을 재해위로금으로 지급할 의무가 있다고 판단하였다.\n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 원심의 판단에 상고이유 주장과 같이 구 석탄산업법에 따른 재해위로금 산정방식에 관한 법리를 오해하는 등으로 판결에 영향을 미친 잘못이 없다. \n  4. 소송수계신청에 관한 판단\n  피고가 원심판결에 대하여 상고한 후에, 원고 1의 소송수계신청인 소외 1, 소외 2, 소외 3은 원고 1이 2023. 2. 26. 사망하였다면서 2025. 9. 26. 소송수계신청을 하였다. \n  그러나 기록에 의하면 피고가 상고이유서를 제출한 후에 원고 1이 사망한 사실을 알 수 있고, 상고심의 소송절차가 이와 같은 단계에 진입한 이상 상속인이 소송을 수계할 필요성은 없으며(대법원 2014. 1. 16. 선고 2012다33532 판결 참조), 나아가 위 소송수계신청인들은 변론을 종결한 뒤의 승계인으로 승계집행문을 부여받아 판결을 집행하는 데에도 아무런 지장이 없으므로, 결국 위 소송수계신청은 이유 없다.\n  5. 결론\n  상고를 모두 기각하고, 원고 1의 소송수계신청인 소외 1, 소외 2, 소외 3의 소송수계신청을 모두 기각하며, 상고비용 중 소송수계신청으로 인한 부분은 위 소송수계신청인들이 부담하고 나머지는 피고가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 노태악(재판장) 서경환 신숙희(주심) 마용주"

    "판시사항": "폐광된 광산에서 진폐로 업무상 재해를 입은 사람이 종전 장해등급에 해당하는 구 석탄산업법상 재해위로금을 전액 지급받은 후 장해상태가 악화되어 장해등급이 변경되었을 경우, 진폐근로자가 지급받을 재해위로금액 산정 방법 / 진폐근로자가 종전 장해등급에 해당하는 재해위로금을 지급받지 못한 상태에서 장해상태가 악화되어 장해등급이 변경되었음에도, 한국광해광업공단이 종전 장해등급에 해당하는 장해보상일시금 상당의 재해위로금만 지급한 경우, 한국광해광업공단이 지급해야 할 재해위로금액의 산정 방법 및 이 경우 산업재해보상보험법 시행령 제58조 제3항 제2호를 유추적용하여 변경된 장해등급에 따라 지급할 재해위로금을 산정해야 하는지 여부(소극)",
    "판결요지": "",
    "참조조문": "구 석탄산업법(2021. 3. 9. 법률 제17919호로 개정되기 전의 것) 제39조의3 제1항 제4호, 구 석탄산업법 시행령(1990. 12. 31. 대통령령 제13216호로 개정되기 전의 것) 제41조 제3항 제4호(현행 제41조 제4항 제5호 참조), 산업재해보상보험법 제51조 제1항, 제60조 제2항, 산업재해보상보험법 시행령 제58조 제3항 제2호",

    "판례내용": "【원고, 피상고인】                원고 (소송대리인 법무법인 사람앤스마트 담당변호사 강유진 외 2인)\n【피고, 상고인】 한국광해관리공단의 소송수계인 한국광해광업공단 (소송대리인 법무법인 강한 담당변호사 김준태 외 5인)\n【원심판결】  서울고법 2022. 6. 23. 선고 2021누62920 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 피고가 부담한다. \n\n【이    유】  상고이유를 판단한다. \n  1. 사안의 개요 \n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 다음과 같은 사실을 알 수 있다. \n  가. 원고는 1982. 5. 6.부터 1990. 4. 8.까지 동해탄광에서 분진작업에 종사하였는데, 동해탄광은 1990. 4. 7.경 폐광예비신청을 하여 사업단으로부터 승인처분을 받았고, 1990. 8. 16. 광업권의 소멸등록을 마치고 폐광되었다.\n  나. 원고는 동해탄광에 근무 중이던 1986. 7. 15.경 진폐증 진단을 받았고(진폐병형 1형), 폐광일 이후인 2004. 8. 25.경 장해등급 제11급 진단을 받았다. 이후 원고는 장해상태가 악화되어 2012. 10. 17.경 장해등급 제9급, 2015. 10. 19.경 장해등급 제3급, 2019. 1. 18.경 장해등급 제9급 진단을 각각 받았다. \n  다. 원고는 한국광해관리공단에 재해위로금 지급을 청구하여 2017. 2. 15. 과거 장해등급 제11급 진단 당시의 평균임금에 기초하여 산정한 산업재해보상보험법(이하 ‘산재보험법’이라 한다)상 장해보상일시금의 금액과 동일한 3,197,590원의 재해위로금(이하 ‘선행 재해위로금’이라 한다)을 지급받았다.  \n  라. 1986. 1. 8. 제정된 석탄산업법 제31조에 따라 석탄광산의 폐광대책사업 등을 수행하기 위하여 석탄산업합리화사업단이 설립되었고, 2005. 5. 31. 제정된 「광산피해의 방지 및 복구에 관한 법률」 제31조에 근거하여 광해방지사업을 효율적으로 수행하기 위하여 2006. 6. 1. 광해방지사업단이 설립되면서 같은 법 부칙 제3조에 따라 석탄산업합리화사업단의 권리·의무를 승계하였다. 광해방지사업단은 2008. 3. 28. 위 법률이 개정되면서 2008. 6. 28. 한국광해관리공단으로 명칭이 변경되었다. 그 후 2021. 3. 9. 제정된 한국광해광업공단법에 근거하여 2021. 9. 10. 피고가 설립되면서 위 법률 부칙 제6조 제1항에 따라 한국광해관리공단의 모든 권리·의무를 포괄적으로 승계하였다. 그에 따라 피고는 원심에서 소송절차를 수계하였다. \n  2. 제1 상고이유에 대하여 \n  가. 원심은, 진폐증의 특성을 고려하면, 폐광일이나 그 이후 특정 장해등급 판정이 있었다 하여 진폐증상이 고정되어 있는 상태에 있었다고 보기 어렵고, 원고의 장해등급이 제9급에서 제3급으로 변동된 사실이 있으나, 그 이후 장해등급 제3급을 취소한 것이 아니라 새로운 심폐기능검사를 통하여 다시 진폐심사회의를 거쳐 장해등급 제9급으로 최종 확정한 것인 점 등 판시와 같은 이유로 원고의 장해등급이 확정된 시점은 최초 장해등급 제9급의 진단을 받은 2012. 10. 17.경이 아니라, 최종적으로 장해등급 제9급의 진단을 받은 2019. 1. 18.경이라고 판단하였다. \n  나. 원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 이러한 원심의 판단에 상고이유 주장과 같이 구 석탄산업법(2021. 3. 9. 법률 제17919호로 개정되기 전의 것, 이하 같다) 및 산재보험법에 따른 장해등급 확정 등에 관한 법리를 오해하는 등으로 판결에 영향을 미친 잘못이 없다. \n  3. 제2, 3 상고이유에 대하여 \n  가. 관련 법령 및 법리   \n  1) 구 석탄산업법 제39조의3 제1항은 ‘폐광대책비의 지급 대상이 되는 광산의 석탄광업자가 당해 광업권·조광권 또는 계속작업권의 소멸등록을 마친 때에는 석탄산업합리화사업단은 당해 광산의 퇴직근로자 및 석탄광업자 등에게 다음 각 호의 금액을 폐광대책비로 지급하여야 한다.’라고 규정하면서, 제4호에서 ‘기타 대통령령이 정하는 폐광대책비’를 들고 있다. 그 위임에 따라 구 석탄산업법 시행령(1990. 12. 31. 대통령령 제13216호로 개정되기 전의 것) 제41조 제3항 제4호(이하 ‘이 사건 조항’이라 한다)는 \"폐광일로부터 소급하여 1년 이내에 업무상 재해를 입은 자로서 폐광일 현재 장해등급이 확정된 자 또는 재해발생기간에 불구하고 폐광일 현재 장해등급이 확정되지 아니한 자에 대하여 지급하는 재해위로금. 이 경우 재해위로금액은 퇴직근로자가 지급받은 산업재해보상보험법 제9조의5 제1항의 규정에 의한 장해보상일시금 또는 동법 제9조의6 제1항의 유족보상일시금과 동일한 금액으로 한다.\"라고 규정하고 있다. 이 사건 조항은 여러 차례 개정되었으나, 그 위치가 같은 조 제4항 제5호로 변경되었을 뿐 그 내용은 실질적으로 동일하게 유지되었다. \n  산재보험법 제51조 제1항은 ‘요양급여를 받은 사람이 치유 후 요양의 대상이 되었던 업무상의 부상 또는 질병이 재발하거나 치유 당시보다 상태가 악화되어 이를 치유하기 위한 적극적인 치료가 필요하다는 의학적 소견이 있으면 다시 재요양을 받을 수 있다.’고 규정하고 있고, 제60조 제2항은 ‘재요양을 받고 치유된 후 장해상태가 종전에 비하여 악화된 경우에는 그 악화된 장해상태에 해당하는 장해등급에 따라 장해급여를 지급하고 이 경우 재요양 후의 장해급여의 산정 및 지급 방법은 대통령령으로 정한다.’고 규정하고 있다. 그 위임에 따라 산업재해보상보험법 시행령(이하 ‘산재보험법 시행령’이라 한다) 제58조 제3항 제2호는 ‘장해보상일시금을 받은 사람이 재요양 후의 장해상태가 종전에 비하여 악화되어 장해보상일시금을 청구한 경우에는 변경된 장해등급에 해당하는 장해보상일시금의 지급일수에서 종전의 장해등급에 해당하는 장해보상일시금의 지급일수를 뺀 일수에 평균임금을 곱한 금액을 지급한다.’고 규정하고 있다.\n  산재보험법 시행령 제58조 제3항 제2호의 취지는, 업무상의 재해로 요양급여 및 장해보상일시금을 받은 사람이 재요양 후 장해상태가 악화되어 변경된 장해등급에 해당하는 장해보상일시금을 전액 받게 된다면, 이미 보상받은 장해급여 부분에 대해서까지 중복하여 장해급여를 받는 결과가 되므로, 이러한 불합리한 결과가 발생하는 것을 막기 위함이다(대법원 2020. 10. 29. 선고 2019두31426 판결 참조).  \n  2) 위와 같은 관련 규정들의 내용과 체계에 산재보험법 시행령 제58조 제3항 제2호의 취지를 종합하면, 폐광된 광산에서 진폐로 인한 업무상 재해를 입은 사람(이하 ‘진폐근로자’라 한다)이 종전 장해등급에 해당하는 구 석탄산업법상 재해위로금을 전액 지급받은 후 장해상태가 악화되어 장해등급이 변경되었을 경우, 그가 지급받을 재해위로금액은 산재보험법 시행령 제58조 제3항 제2호를 유추적용하여 ‘변경된 장해등급에 해당하는 장해보상일시금의 지급일수에서 종전의 장해등급에 해당하는 장해보상일시금의 지급일수를 뺀 일수에 평균임금을 곱한 금액’으로 산정함이 타당하다. \n  3) 그러나 이와 달리 진폐근로자가 종전의 장해등급에 해당하는 재해위로금을 지급받지 못한 상태에서 장해상태가 악화되어 장해등급이 변경되었음에도, 피고가 변경된 장해등급이 아니라 종전의 장해등급에 해당하는 장해보상일시금 상당의 재해위로금만을 지급하였다면, 특별한 사정이 없는 한 이는 변경된 장해등급에 해당하는 재해위로금에 대한 일부 변제로서의 성격을 가진다고 봄이 타당하다. 이러한 경우 피고로서는 진폐근로자에게 변경된 장해등급에 해당하는 재해위로금액에서 실제 지급한 금원의 금액을 뺀 나머지를 지급할 의무가 있고, 이와 달리 이러한 경우에까지 산재보험법 시행령 제58조 제3항 제2호를 유추적용하여 변경된 장해등급에 따라 지급할 재해위로금을 산정할 것은 아니다. 그 이유는 다음과 같다.  \n  가) 이 사건 조항은 장해등급 ‘판정’이 아닌 장해등급 ‘확정’을 기준으로 삼고 있으므로 종전에 장해등급 판정이 있었더라도 나중에 장해등급이 변경되었다면 변경된 최종 장해등급을 기준으로 재해위로금의 액수를 산정하여 지급함이 타당하다.  \n  나) 산재보험법 시행령 제58조 제3항은 ‘장해보상일시금을 받은 사람’이 재요양을 한 후의 장해상태가 종전에 비하여 악화된 경우를 규정하여 ‘근로자가 장해급여를 실제 수령한 것’을 전제로 입법이 이루어져 있다. 이는 업무상 재해로 장해급여를 받은 자가 그 부상 또는 질병이 재발하여 재요양을 받은 후 장해상태가 변경된 경우 이미 지급된 기존 장해등급에 관한 장해급여와 중복지급을 방지하기 위한 것이다. 따라서 기존에 재해위로금을 지급받은 바 없어 재해위로금의 중복지급 문제 자체가 발생하지 않는 근로자의 경우에는, 산재보험법 시행령 제58조 제3항 제2호가 유추적용될 수 없다. \n  다) 한편 구 석탄산업법 제39조의3 제1항 제4호 및 이 사건 조항의 취지를 종합하면, 진폐근로자가 피고에 대하여 가지는 재해위로금의 지급청구권은 위 규정이 정하는 지급요건이 충족되면 당연히 발생함과 아울러 그 금액도 확정되는 것이지 피고의 지급결정 여부에 의하여 그 청구권의 발생이나 금액이 좌우되는 것이 아니다(대법원 1999. 1. 26. 선고 98두12598 판결 참조). 따라서 진폐근로자의 장해상태가 악화되어 장해등급이 변경되었다면, 그 변경된 장해등급에 해당하는 재해위로금 지급청구권이 당연히 발생함과 아울러 그 금액도 확정된다. 이러한 상태에서 변경된 장해등급에 해당하는 재해위로금의 금액에 미치지 못하는 금액의 금원이 재해위로금 명목으로 지급되었다면, 설령 위 금원이 종전의 장해등급에 해당하는 재해위로금 산정 방식에 따라 산정된 것이라 하더라도, 이는 이미 발생하여 금액까지 확정된 변경된 장해등급에 해당하는 재해위로금의 변제를 위하여 지급된 것이라고 봄이 위와 같은 재해위로금의 법적 성격에 부합한다.  \n  나. 원심의 판단 \n  원심은 판시와 같은 이유로, 선행 재해위로금은 실제 지급해야 할 재해위로금의 일부 변제로서의 효력이 있을 뿐이어서, 원고에 대한 재해위로금을 ‘원고의 장해등급 제9급에 해당하는 장해보상일시금 지급일수에서 장해등급 제11급에 해당하는 장해보상일시금 지급일수를 뺀 일수에 평균임금을 곱하여 산정할 수는 없다’고 판단하였다. \n  다. 대법원의 판단 \n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 이러한 원심의 판단에 상고이유 주장과 같이 구 석탄산업법에 따른 재해위로금 산정방식에 관한 법리를 오해하는 등으로 판결에 영향을 미친 잘못이 없다.  \n  피고가 상고이유로 들고 있는 대법원 2012. 11. 15. 선고 2010두13012 판결 등은 이 사건과 사안이 다르므로, 이 사건에 원용하기에 적절하지 않다. \n  4. 결론 \n  상고를 기각하고 상고비용은 패소자가 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 마용주(재판장) 노태악 서경환(주심) 신숙희"
  },

    "판시사항": "[1] 구 독점규제 및 공정거래에 관한 법률 시행령 제36조 제1항 [별표 1의2] 제4호 (나)목에서 정한 ‘위계에 의한 고객유인’이 성립하려면 오인될 우려에 더하여 고객에게 오인의 결과가 발생해야 하는지 여부(소극) / 이때 ‘오인’ 및 ‘오인의 우려’의 의미 / 위계에 의한 고객유인행위를 금지하는 취지 / 사업자의 행위가 불공정거래행위로서 위계에 의한 고객유인행위에 해당하는지 판단하는 방법\n\n[2] 甲 주식회사가 자신이 운영하는 스트리밍 사이트에서 서비스하는 동영상 서비스 또는 동영상의 경우 무조건 가점을 부여되도록 알고리즘을 설계·실행함으로써 고객이 甲 회사의 검색 포털 사이트에서 검색하는 동영상 서비스에 대한 검색결과에서 甲 회사의 동영상 서비스 또는 동영상을 상위에 노출시키고 고객에게 이를 거래(시청)하도록 유인한 행위 등이 구 독점규제 및 공정거래에 관한 법령의 ‘부당한 고객유인행위’에 해당한다는 이유로 공정거래위원회가 甲 회사에 시정명령 및 과징금납부명령을 한 사안에서, 위 행위가 위계에 의한 고객유인행위에 해당한다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례",
