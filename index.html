    "판례내용": "【원고, 피상고인 겸 상고인】                ○○○ 주식회사 (소송대리인 법무법인(유한) 태평양 담당변호사 권도형 외 4인)\n【피고, 상고인 겸 피상고인】 공정거래위원회 (소송대리인 법무법인 지음 담당변호사 김설이 외 2인)\n【원심판결】  서울고법 2023. 2. 9. 선고 2021누35218 판결         \n【주    문】\n  원심판결 중 원고 패소 부분을 파기하고, 이 부분 사건을 서울고등법원에 환송한다.  피고의 상고를 기각한다. \n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사건의 개요\n  원심판결의 이유 및 원심이 적법하게 채택하여 조사한 증거 등에 따르면, 다음과 같은 사실을 알 수 있다. \n  피고는, 원고가 ① 2017. 8. 24.부터 2020. 9. 17.까지 개편된 광고기반 무료 동영상(이하 편의상 ‘동영상’이라고만 한다) 검색 알고리즘과 관련된 중요한 정보를 원고 내 동영상 서비스 담당부서와 검색제휴사업자 사이에 차별적으로 제공하는 한편, 이와 관련된 정보를 검색제휴사업자에게 왜곡하여 전달하고(이하 ‘이 사건 차별적 정보 제공 행위’라 한다), ② 2017. 8. 24. 검색 알고리즘을 개편하면서 검색 노출 순위를 결정하는 관련도를 구성하는 항목 중 부스팅 항목에서, \"○○○티비(이하 ‘○○○TV’라 한다) 테마관\"에서 서비스하는 동영상의 경우에는 무조건 관련도 계산 시 가점이 부여되도록 알고리즘을 설계하여 2019. 8. 28.까지 이러한 알고리즘을 실행함으로써(이하 ‘이 사건 가점부여 행위’라 한다), 고객이 원고의 검색 포털 사이트에서 검색하는 동영상 서비스에 대한 검색결과에서 원고의 동영상 서비스 또는 동영상을 검색제휴사업자의 동영상 서비스 또는 동영상보다 상위에 노출시키고, 고객으로 하여금 원고의 동영상 서비스 또는 동영상을 거래(시청)하도록 유인하였다고 판단하였다. \n  피고는, 원고의 위와 같은 이 사건 차별적 정보 제공 행위 및 이 사건 가점부여 행위가 구 「독점규제 및 공정거래에 관한 법률」(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법’이라 한다) 제23조 제1항 제3호, 구 「독점규제 및 공정거래에 관한 법률 시행령」(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법 시행령’이라 한다) 제36조 제1항 [별표 1의2] 제4호 (나)목의 ‘위계에 의한 고객유인’에 해당한다는 이유로, 2021. 1. 25. 원고에 대하여 이 사건 처분을 하였다.\n  2. 이 사건 가점부여 행위 관련 원고의 상고이유에 대하여 \n  가. 관련 법리\n                 구 공정거래법 제23조 제1항 제3호는 ‘부당하게 경쟁자의 고객을 자기와 거래하도록 유인하거나 강제하는 행위’를 불공정거래행위 중 하나의 유형으로 규정하고 있고, 제2항은 불공정거래행위의 유형 또는 기준을 대통령령으로 정하도록 규정하고 있다. 그 위임에 따른 구 공정거래법 시행령 제36조 제1항 [별표 1의2] 제4호 (나)목 ‘부당한 표시·광고 외의 방법으로 자기가 공급하는 상품 또는 용역의 내용이나 거래조건 기타 거래에 관한 사항에 관하여 실제보다 또는 경쟁사업자의 것보다 현저히 우량 또는 유리한 것으로 고객을 오인시키거나 경쟁사업자의 것이 실제보다 또는 자기의 것보다 현저히 불량 또는 불리한 것으로 고객을 오인시켜 경쟁사업자의 고객을 자기와 거래하도록 유인하는 행위’를 위계에 의한 고객유인으로 규정하고 있다. \n  한편 위계에 의한 고객유인행위가 성립하기 위해서는 위계 또는 기만적인 유인행위로 인하여 고객이 오인될 우려가 있음으로 충분하고, 반드시 고객에게 오인의 결과가 발생하여야 하는 것은 아니다. 그리고 여기에서 오인이라고 함은 고객의 상품 또는 용역에 대한 선택 및 결정에 영향을 미치는 것을 말하고, 오인의 우려라고 함은 고객의 상품 또는 용역의 선택에 영향을 미칠 가능성 또는 위험성을 말한다(대법원 2002. 12. 26. 선고 2001두4306 판결, 대법원 2019. 10. 18. 선고 2015두370 판결 등 참조). \n  이와 같이 위계에 의한 고객유인행위를 금지하는 취지는 위계 또는 기만행위로 소비자의 합리적인 상품선택을 침해하는 것을 방지하는 한편, 해당 업계 사업자 간의 가격 등에 관한 경쟁을 통하여 공정한 경쟁질서 또는 거래질서를 유지하기 위한 데에 있다. 따라서 사업자의 행위가 불공정거래행위로서 위계에 의한 고객유인행위에 해당하는지를 판단할 때에는, 그 행위로 인하여 보통의 거래 경험과 주의력을 가진 일반 소비자의 거래 여부에 관한 합리적인 선택이 저해되거나 다수 소비자들이 궁극적으로 피해를 볼 우려가 있게 되는 등 널리 업계 전체의 공정한 경쟁질서나 거래질서에 미치게 될 영향, 파급효과의 유무 및 정도, 문제 된 행위를 영업전략으로 채택한 사업자의 수나 규모, 경쟁사업자들이 모방할 우려가 있는지, 관련되는 거래의 규모, 통상적 거래의 형태, 사업자가 사용한 경쟁수단의 구체적 태양, 사업자가 해당 경쟁수단을 사용한 의도, 그와 같은 경쟁수단이 일반 상거래의 관행과 신의칙에 비추어 허용되는 정도를 넘는지, 계속적·반복적인지 등을 종합적으로 살펴보아야 한다(대법원 2019. 9. 26. 선고 2014두15047 판결, 대법원 2019. 10. 18. 선고 2015두370 판결 등 참조). \n  나. 원심의 판단\n  원심은 판시와 같은 이유로, 원고가 이 사건 가점부여 행위로 ○○○TV 테마관 동영상을 상대적으로 검색결과 상위에 노출시키고 다른 검색제휴사업자들의 동영상을 상대적으로 검색결과 하위에 노출시킨 행위는, ○○○TV 테마관 동영상이 다른 검색제휴사업자들의 동영상에 비해 고객에게 보다 적합한 동영상이라고 알린 행위로서, ‘자기가 공급하는 상품 또는 용역의 내용이나 거래조건 기타 거래에 관한 사항에 관하여 실제보다 또는 경쟁사업자의 것보다 우량 또는 유리한 것으로 고객을 오인시키거나 경쟁사업자의 것이 실제보다 또는 자기의 것보다 불량 또는 불리한 것으로 고객을 오인시킨’ 행위에 해당한다고 보았다. \n  다. 대법원의 판단\n  그러나 이와 같은 원심의 판단은 다음과 같은 이유에서 그대로 수긍하기 어렵다.\n  1) 먼저 위계의 존부에 관하여 살펴본다.  \n  가) 원심은 원고에게 다른 출처의 동영상에도 동일한 가점부여 기회를 부여할 의무가 있다는 전제에서 위와 같이 판단하였다. 그러나 원고가 온라인 검색서비스를 통해 고객에게 동영상에 관한 검색결과를 제공함에 있어, 자기가 제공하는 동영상 서비스 또는 동영상을 언제나 다른 사업자가 제공하는 동영상 서비스 또는 동영상과 동등하게 대우할 의무가 인정된다고 보기 어렵다. \n  결국 원고는 동영상 검색서비스를 공급하는 과정에서 자신의 가치판단과 영업전략을 반영하여 상품정보의 노출 여부 및 노출 순위를 결정하는 검색 알고리즘을 설계할 수 있고, 원고가 이러한 구체적 가치판단과 영업전략까지 소비자나 외부에 공지해야 한다고 볼 수 없다. 다만 그 검색 알고리즘이 위계 또는 기만행위에 해당하여 소비자의 합리적인 선택을 침해할 우려가 있다거나 공정한 경쟁질서 또는 거래질서를 훼손할 우려가 있는 경우에는 그 범위에서 위법성이 인정될 수 있다. \n  이러한 점을 고려할 때, 원고가 검색 알고리즘 설계 시 ○○○TV 테마관 동영상이라는 이유로 검색가중치를 부여하였다는 사정만을 들어 곧바로 위계에 해당한다고 볼 수는 없다. \n  나) 오히려 원심이 인정한 사실관계 및 원심이 적법하게 채택하여 조사한 증거 등에 따르면, 원고는 원고가 제공하는 동영상 중에서도 ○○○TV 테마관 동영상에 한해서만 이 사건 가점을 부여한 사실, ○○○TV 테마관 동영상의 경우 다른 동영상과는 달리 원고가 추가적인 내부심사를 거쳐 게재를 허용한 사실을 알 수 있다. 원고가 이처럼 품질을 담보할 수 있는 동영상에 대하여 가점을 부여한 데에는 그 나름의 합리성 또는 소비자 편익의 증진 가능성이 인정될 여지가 있고, 이는 위계의 성립을 방해하는 사정이다. \n  2) 다음으로 현저성 요건에 관하여 살펴본다. \n  부당한 고객유인행위가 성립하기 위해서는 원고의 것이 실제보다 또는 경쟁사업자의 것보다 현저히 우량 또는 유리한 것으로 고객을 오인시키거나 경쟁사업자의 것이 실제보다 또는 자기의 것보다 현저히 불량 또는 불리한 것으로 고객을 오인시켜야 한다. 그리고 이때의 현저성은 처분사유를 구성하는 것으로 그에 대한 증명책임은 처분청인 피고에게 있다. \n  원심은, 현저성은 검색결과가 원래 있어야 할 원고 동영상의 순위보다 상위에 노출되어 동영상 검색의 소비자가 원고의 동영상을 보다 적합한 동영상으로 인식하게 됨으로써 고객이 원고의 동영상을 실제보다 현저하게 우량하게 인지하는 것 자체로 충족되고, 그 요건 충족을 위하여 이 사건 가점부여 행위로 인한 원고 동영상의 노출 수 및 재생 수의 증가폭이 ‘현저해야 할 것’이 반드시 요구되지는 않는다고 보았다. \n  그러나 원고 동영상의 현저한 우위 또는 경쟁사업자 동영상의 현저한 열위라는 소비자의 인식이 존재한다거나, 나아가 그러한 인식이 검색결과 순위와 직접적 관련성이 있다고 볼 만한 객관적 근거를 발견하기 어렵다. 유럽연합(EU) 집행위원회의 2017. 6. 27. 자 AT.39740-구글검색(쇼핑) 사건에 관한 결정문은 그 전제되는 시장의 종류, 상황이나 고객성향 등의 사실관계나 법령상 근거가 이 사건과 일치 또는 유사하다고 보기는 어렵다. 피고는 이 사건 가점부여 행위로 인하여 동영상 검색결과 노출 순위에 현저한 변화가 나타났다는 점을 지적하지만, 원고는 고객들이 동영상 검색 시 노출 순위보다 영상의 제목, 썸네일, 내용 등을 더 중요하게 고려하고 있음을 지적한다. 그런데 피고는 동영상 전체 노출 수 및 재생 수 증가폭에 비해 원고 동영상의 노출 수 및 재생 수의 증가폭이 현저하다는 점이나, 고객이 ‘원고의 동영상을 실제보다 현저하게 우량하게 인지하였다.’는 점에 대한 충분한 증명을 하고 있지 못하다. \n  3) 마지막으로 부당성 또는 공정거래저해성에 관하여 살펴본다.\n  원심의 이 부분 판시 역시 앞서 1) 부분에서 살핀 의무를 전제하고 있고, 그 밖에 이 사건 가점부여 행위로 인하여 고객의 합리적인 동영상 선택이나 그 시청이 저해되었다거나, 다수 고객들이 궁극적으로 피해를 볼 우려가 있었다고 볼 만한 사정은 확인되지 않는다.\n  4) 위에서 살핀 여러 사정들이 있음에도 원심은 그 판시와 같은 이유만으로 이 사건 행위가 위계로 고객을 오인할 우려가 있는 행위에 해당한다고 판단하였다. 이러한 원심의 판단에는 위계에 의한 고객유인행위의 성립 요건이나 자유심증주의의 한계에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 원고의 상고이유 주장은 이유 있다.\n  3. 이 사건 차별적 정보제공 행위 관련 피고의 상고이유에 대하여 \n  원심은 판시와 같은 이유로, 원고가 원고의 내부에만 ‘키워드’의 중요성을 강조한 자료들을 배포함으로써 검색제휴사업자들과 원고 내부자 사이에서 차별적 정보제공 행위를 하였더라도, 원고가 위 정보를 이용하여 고객을 오인하게 할 만한 구체적인 후속 행위로 나아갔다고 보기에 부족하고, 결국 원고가 고객이 원고의 동영상을 실제보다 또는 경쟁 검색제휴사업자의 동영상보다 우량 또는 유리하다고 오인할 우려를 발생시켰다고 보기는 어렵다고 판단하였다. \n  관련 법리에 비추어 살펴보면, 원심판단에 피고의 상고이유 주장과 같은 증명책임, 인과관계, 부당한 고객유인행위에 관한 법리오해 및 이유모순의 잘못이 없다.\n  4. 결론  \n  나머지 상고이유에 대한 판단을 생략한 채 원심판결 중 원고 패소 부분을 파기하고, 이 부분 사건을 다시 심리·판단하도록 원심법원에 환송하며, 피고의 상고를 기각하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 마용주(재판장) 노태악 서경환(주심) 신숙희"
  },

    "판례내용": "【원고, 피상고인 겸 상고인】                주식회사 ○○○ (변경 전 △△△ 주식회사) (소송대리인 법무법인 정안 담당변호사 박소연 외 2인)\n【피고, 상고인 겸 피상고인】 강동세무서장\n【원심판결】  서울고법 2022. 7. 6. 선고 2021누49927 판결         \n【주    문】\n  원심판결의 원고 패소 부분을 파기하고, 이 부분 사건을 서울고등법원에 환송한다.  피고의 상고를 기각한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 상고이유보충서 등은 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 다음과 같은 사실을 알 수 있다.\n  가. 원고는 2015. 5. 19. 기업인수 목적으로 ‘□□□ 주식회사’라는 상호로 설립되었는데, 2016. 9. 21. 합병 전 △△△ 주식회사(이하 ‘이 사건 피합병법인’이라 한다)를 흡수합병한 후(이하 ‘이 사건 합병’이라 한다), 같은 날 상호를 피합병법인의 상호인 ‘△△△ 주식회사’로 변경하고, 사업목적을 식품 프랜차이즈사업 등으로 변경하였다. 이 사건 합병은 구 법인세법(2017. 12. 19. 법률 제15222호로 개정되기 전의 것, 이하 같다) 제44조 제2항 각 호의 요건을 모두 갖춘 적격합병에 해당한다.  \n  나. 이 사건 피합병법인은 이 사건 합병 전에 11,810,645,680원(이하 ‘이 사건 투자금액’이라 한다)을 투자하여 충북 진천에 창고시설을 신축하였다. 이 사건 피합병법인은 이 사건 합병등기일까지의 2016 의제사업연도(2016. 1. 1.부터 2016. 9. 21.까지)에 대한 법인세를 신고하면서 이 사건 투자금액에 대하여 구 조세특례제한법(2016. 12. 20. 법률 제14390호로 개정되기 전의 것, 이하 ‘구 조특법’이라 한다) 제26조 제1항에 따라 고용창출투자세액공제를 적용하였는데, 구 조세특례제한법 시행령(2017. 2. 7. 대통령령 제27848호로 개정되기 전의 것, 이하 ‘구 조특법 시행령’이라 한다) 제23조 제13항 제3호를 적용할 경우 해당 사업연도 상시근로자 수의 증가인원이 0명으로 산출되어, 추가공제 없이 기본공제 금액만을 적용하였다. 이처럼 세액공제가 이루어지지 않은 추가공제와 관련하여 구 조특법 제144조 제3항에 따라 이 사건 피합병법인에 대하여 이월 가능한 고용창출투자세액공제 금액은 697,455,140원이다(이하 ‘이 사건 추가공제금액’이라 한다). \n  다. 원고는 2016, 2017 각 사업연도 법인세를 신고하면서, 이 사건 투자금액에 대하여 이 사건 추가공제금액을 승계하여 이월공제하는 것으로 하여, 2016 사업연도에 414,900,000원,  2017 사업연도에 282,555,140원을 각각 공제하였다. 원고는 위와 같이 이월공제되는 금액을 계산하는 과정에서, 구 조특법 시행령 제23조 제13항 제3호 (가)목에 따라 합병법인으로서 ‘승계한 상시근로자 수’를, 합병등기일을 기준으로 이 사건 피합병법인으로부터 실제 승계한 총인원 수가 아니라, 이 사건 피합병법인의 직전 과세연도의 매월 말 현재 상시근로자 수를 전제로 삼았다. \n  라. 서울지방국세청장은 피고에 대한 종합감사에서 고용창출투자세액공제의 추가공제분은 구 법인세법 시행령(2017. 2. 3. 대통령령 제27828호로 개정되기 전의 것, 이하 같다) 제81조 제3항 제2호에 따라 합병법인이 승계하여 이월공제할 수 있는 세액공제에 해당하지 않는다고 판단하였다. 피고는 이에 따라 2018. 10. 24. 이 사건 추가공제금액을 부인하여 원고에게 2016 사업연도 법인세 476,677,840원(가산세 포함), 2017 사업연도 법인세 374,688,890원(가산세 포함)을 각각 경정·고지(이하 ‘이 사건 처분’이라 한다)하였다.\n  2. 이 사건 추가공제금액의 이월공제 승계 여부에 관하여(피고의 상고이유)\n  가. 관련 규정 및 법리\n  1) 구 법인세법 제44조의3 제2항은, 적격합병의 요건을 충족하여 합병법인이 피합병법인의 자산을 장부가액으로 양도받은 경우, 과세상 기업으로서의 계속성을 인정한다는 취지에서, 피합병법인의 합병등기일 현재의 결손금과 피합병법인이 각 사업연도의 소득금액 및 과세표준을 계산할 때 익금 또는 손금에 산입하거나 산입하지 아니한 금액, 그 밖의 자산·부채 및 제59조에 따른 감면·세액공제 등을 합병법인이 대통령령으로 정하는 바에 따라 승계한다고 규정하고 있다. 그리고 같은 법 제59조 제1항 제3호는 ‘이월공제가 인정되는 세액공제’를 구 법인세법 및 다른 법률을 적용할 때의 세액공제 중 하나로 정하고 있다. 나아가 앞서 본 구 법인세법 제44조의3 제2항의 위임에 따라 구 법인세법 시행령 제80조의4 제2항은, 적격합병의 요건을 충족하여 합병법인이 피합병법인의 자산을 장부가액으로 양도받은 경우, 합병법인은 피합병법인이 합병 전에 적용받던 구 법인세법 제59조에 따른 감면 또는 세액공제를 승계하여 적용받을 수 있되, 해당 감면 또는 세액공제의 요건 등에 관한 규정이 구 법인세법 또는 다른 법률에 있는 때에는 합병법인이 그 요건 등을 모두 갖춘 경우에만 이를 적용한다고 정하고 있다. \n  2) 한편 구 법인세법 제45조 제4항은 같은 법 제44조의3 제2항에 따라 합병법인이 승계한 피합병법인의 감면 또는 세액공제는 피합병법인으로부터 승계받은 사업에서 발생한 소득금액 또는 이에 해당하는 법인세액의 범위에서 대통령령으로 정하는 바에 따라 이를 적용한다고 규정하고 있다. 이와 같은 위임에 따라 구 법인세법 시행령 제81조 제3항은, 합병법인은 구 법인세법 제44조의3 제2항에 따라 피합병법인으로부터 승계받은 감면 또는 세액공제를 다음 각 호에 따라 적용받을 수 있다고 규정하면서, 그 제2호에서 구 법인세법 제59조 제1항 제3호에 따른 세액공제 중 이월된 외국납부세액공제 미공제액[(가)목], 구 조특법 제132조에 따른 법인세 최저한세액에 미달하여 공제받지 못한 금액으로서 구 조특법 제144조에 따라 이월된 미공제액[(나)목], 그 외에 납부할 세액이 없어 공제받지 못한 금액 중 구 조특법 제144조에 따라 이월된 미공제액[(다)목]을 각각 들면서, 각 목별로 공제액의 계산방법 및 공제가 허용되는 범위 및 한계에 대해 정하고 있다.\n  3) 위와 같은                구 법인세법 시행령 제81조 제3항 제2호 각 목에 관련된 수권규정의 성격과 내용, 수권의 범위와 조문 체계 등에 비추어 볼 때, 위 각 목의 규정은 구 법인세법 제44조의3 제2항에 따라 합병법인이 피합병법인으로부터 감면 또는 세액공제를 승계함에 따라, 각 사업연도 소득금액 및 법인세액을 계산할 때 구체적인 감면 또는 공제의 적용 방법 및 공제의 한도 등을 정하고 있다고 보아야 한다. 이와 달리 위 각 목의 규정이 적격합병 시 합병법인이 피합병법인으로부터 감면 또는 세액공제를 승계하는 것 자체를 제한하기 위한 요건을 추가로 설정한 것으로 볼 수는 없다. 나아가 앞서 구 법인세법 시행령 제80조의4 제2항에서 본 것처럼 감면 또는 세액공제의 요건이 다른 법률에 별도로 마련될 수 있음이 명시되고 있으므로, 위 각 목 규정의 존재로 말미암아 법인세법령 외의 다른 법령에 따라 합병법인이 피합병법인으로부터 승계받은 감면 또는 세액공제를 적용하는 구체적인 방법 및 공제 등 범위를 정하는 것이 금지되거나 원천적으로 차단되는 것도 아니다. 이러한 연유로 적격합병 시 합병법인이 피합병법인으로부터 승계받는 고용창출투자세액공제 금액의 이월공제와 관련하여, 구 조특법 제26조 및 제144조, 구 조특법 시행령 제23조 및 제136조의2 등에서 그 구체적인 적용 방법 등에 대해 별도로 규정하고 있기도 하다.\n  나. 판단\n  원심은 판시와 같은 이유로, 구 조특법 및 그 시행령에 규정된 추가공제 및 이월공제의 요건을 충족하는 한, 이 사건 합병을 계기로 이 사건 피합병법인이 합병 전까지 공제받지 못하고 이월된 이 사건 추가공제금액을 승계할 수 있다고 판단하였다.\n  원심판결 이유를 위 관련 규정과 법리 및 기록에 비추어 살펴보면, 원심의 판단에 피고의 상고이유 주장과 같이 적격합병 시 세액공제 승계에 관한 법리를 오해하는 등의 잘못이 없다.\n  3. 이 사건 추가공제금액 중 이월공제가 가능한 범위에 관하여(원고의 상고이유)\n  가. 관련 규정\n  구 조특법 제144조 제3항은, 고용창출투자세액공제의 이월공제를 적용받기 위해서는 해당 과세연도의 상시근로자 수가 직전 과세연도의 상시근로자 수를 초과하는 경우, 그 상시근로자 수를 기초로 계산된 금액을 한도로 하여 이월된 세액공제액을 적용할 수 있도록 규정하고 있다. 그리고 이때의 상시근로자 수 계산방법에 관하여는 구 조특법 시행령 제23조 제11항 제1호의 계산식에서 ‘상시근로자 수’를 ‘해당 과세연도의 매월 말 현재 상시근로자 수의 합 ÷ 해당 과세연도의 개월 수’로 산출하도록 정하고 있다. 또한 구 조특법 시행령 제23조 제13항 제3호 (가)목(이하 ‘이 사건 조항’이라 한다)은 합병 등에 의하여 종전의 사업부문에서 종사하던 상시근로자를 승계하는 경우에 관하여, 승계시킨 기업(피합병법인)의 직전 과세연도의 상시근로자 수는 직전 과세연도 상시근로자 수에 승계시킨 상시근로자 수를 뺀 수로 하고, 해당 과세연도의 상시근로자 수는 해당 과세연도 개시일에 상시근로자를 승계시킨 것으로 보아 계산한 상시근로자 수로 하도록 규정하고, 아울러 승계한 기업(합병법인)의 직전 과세연도의 상시근로자 수는 직전 과세연도 상시근로자 수에 승계한 상시근로자 수를 더한 수로 하고, 해당 과세연도의 상시근로자 수는 해당 과세연도 개시일에 상시근로자를 승계한 것으로 보아 계산하도록 규정하고 있다.\n  나. 원심의 판단\n  원심은, 이 사건 조항에서 피합병법인과 합병법인의 직전 과세연도의 상시근로자 수를 계산할 때 빼거나 더하도록 한 ‘승계시킨 또는 승계한 상시근로자 수’는 특정한 시점인 합병등기일에 실제 승계시키거나 승계한 상시근로자 수 자체를 의미하는데, 구 조특법 시행령 제23조 제11항 제1호의 계산식은 증감 변동되는 상시근로자 수를 위와 같은 특정 시점이 아니라 과세연도라는 일정한 기간을 가지고 월별 평균하는 방식으로 되어 있으므로, 합병과 관련해서 피합병법인과 합병법인의 직전 또는 해당 과세연도의 상시근로자 수를 계산하는 과정에서 빼거나 더하도록 한 ‘승계시킨 또는 승계한 상시근로자 수’를 산정하는 국면에서는 위 계산식을 적용할 수 없다고 보았다. 그런 다음, 이 사건 조항에 따라 합병법인인 원고의 직전 과세연도(2015년)와 해당 과세연도(2016년)의 상시근로자 수를 계산하는 과정에서 이 사건 피합병법인으로부터 원고가 승계한 상시근로자 수는 ‘합병등기일 당시를 기준으로 이 사건 피합병법인으로부터 원고가 실제 승계한 상시근로자 수’로 삼아야 한다고 판단하였다.\n  다. 대법원의 판단\n  그러나 원심의 위와 같은 판단은 그대로 수긍하기 어렵다. 이 사건 조항에서의 ‘승계시킨 또는 승계한 상시근로자 수’는 직전 과세연도와 해당 과세연도의 두 가지 모두 합병등기일이라는 특정한 날짜를 기준으로 실제 승계시키거나 승계한 상시근로자 수가 아니라, 구 조특법 시행령 제23조 제11항 제1호의 계산식 가운데 나타난 바와 같이, 위 각 과세연도 동안 피합병법인의 매월 말 현재 상시근로자 수 자체를 의미한다고 봄이 타당하다. 나아가 이를 토대로 위 계산식을 적용하여 도출된 직전 과세연도 및 해당 과세연도의 각 ‘상시근로자 수’를 전제로 하여 구 조특법 제144조 제3항이 정한 바에 따라 합병법인의 해당 과세연도의 ‘상시근로자 수’가 직전 과세연도의 ‘상시근로자 수’를 초과하는지 여부를 살펴야 한다. 구체적인 이유는 다음과 같다.\n  1) 조세법률주의의 원칙상 조세법규는 특별한 사정이 없는 한 법문대로 해석하여야 하고 합리적 이유 없이 확장·축소해석하거나 유추해석하는 것은 허용되지 않는다. 다만 법규 상호 간의 해석을 통하여 그 의미를 명백히 할 필요가 있는 경우, 조세법률주의가 지향하는 법적 안정성 및 예측 가능성을 해치지 않는 범위 내에서 입법 취지 및 목적 등을 고려한 합목적적 해석을 하는 것이 허용된다(대법원 2020. 7. 29. 선고 2019두56333 판결 등 참조).\n  2) 이 사건 조항은, 합병 시 상시근로자 수를 계산함에 있어 피합병법인과 합병법인을 통합된 하나의 단위로 보아, 합병 전 법인들의 상시근로자 수와 합병 후 하나가 된 법인의 상시근로자 수 사이에 차이가 없도록 하는 데에 그 취지가 있다. 그렇다면, 이 사건 조항을 적용하는 과정에서 합병에 따른 상시근로자 수를 구체적으로 계산할 때에도 위와 같은 취지에 부합하도록 피합병법인과 합병법인을 통합하여 하나의 법인인 것처럼 취급하여야 한다.\n  3) 이 사건 조항은, 합병으로 인해 피합병법인의 종전 사업부문에 종사하던 상시근로자가 합병법인에 승계되는 경우, 피합병법인과 합병법인의 각 직전 과세연도 및 해당 과세연도의 상시근로자 수의 계산 방식을 규정하면서, 각각의 ‘과세연도 상시근로자 수’에 ‘승계시킨 또는 승계한 상시근로자 수’를 빼거나 더한 수로 계산하도록 정하고 있을 뿐, 합병등기일을 기준으로 삼도록 명시하고 있지 않다. 피합병법인과 합병법인이 마치 합병 이전부터 하나의 법인이었던 것처럼 해당 사업부문 전체가 그대로 이어진다고 바라보는 관점에서, 여기서의 ‘승계’ 상시근로자 수는 직전 과세연도 및 해당 과세연도에 걸친 해당 사업부문의 월별 상시근로자 수를 의미한다고 보아야 한다. 이를 전제로 구 조특법 시행령 제23조 제11항 제1호에 따라 위 각 과세연도의 매월 말 상시근로자 수의 합을 각각의 해당 과세연도의 개월 수로 나누어 계산한 수를 ‘상시근로자 수’로 하는 계산식이 피합병법인과 합병법인별로 과세연도마다 적용되어야 한다.\n  라. 그런데도 이와 달리 원심은, 이 사건 조항에 따라 합병법인인 원고의 직전 과세연도(2015년)와 해당 과세연도(2016년)의 각 상시근로자 수를 계산하는 과정에서, 원고가 ‘승계한 상시근로자 수’는 합병등기일 당시 이 사건 피합병법인으로부터 실제 승계한 상시근로자 수를 의미한다고 판단하였다. 이러한 원심판단에는 적격합병 시 고용창출투자세액공제 금액의 이월공제 관련 이 사건 조항의 해석 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 원고의 상고이유 주장은 이유 있다.  \n  4. 결론\n  원심판결의 원고 패소 부분을 파기하고, 이 부분 사건을 다시 심리·판단하도록 원심법원에 환송하며, 피고의 상고를 기각하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 마용주(재판장) 노태악 서경환(주심) 신숙희"
  },

    "판시사항": "[1] 구 독점규제 및 공정거래에 관한 법률 제3조의2 제1항 제3호에서 정한 시장지배적 사업자의 지위남용행위로서 차별행위가 성립하기 위한 요건의 하나인 ‘부당성’이 인정되는지 판단하는 방법 / 이를 증명하기 위해 차별행위가 ‘경쟁제한의 효과가 생길 만한 우려 있는 행위로서 그에 대한 의도나 목적이 있었는지’ 판단하는 방법 / 이는 온라인 플랫폼 사업자인 시장지배적 사업자가 자사의 상품 또는 서비스를 경쟁사업자의 상품 또는 서비스보다 유리하게 차별적으로 취급하는 행위가 문제 된 경우에도 마찬가지인지 여부(적극) / 시장지배적 사업자의 행위가 지배적 지위를 보유하고 있는 시장 또는 행위가 이루어진 시장과는 다른 시장에서 경쟁제한의 효과가 문제 되는 경우, 이를 주장하는 공정거래위원회가 증명할 사항\n\n [2] 구 독점규제 및 공정거래에 관한 법률 시행령 제36조 제1항 [별표 1의2] 제4호 (나)목에서 정한 ‘위계에 의한 고객유인’이 성립하려면 오인될 우려에 더하여 고객에게 오인의 결과가 발생해야 하는지 여부(소극) / 이때 ‘오인’ 및 ‘오인의 우려’의 의미 / 위계에 의한 고객유인행위를 금지하는 취지 / 사업자의 행위가 불공정거래행위로서 위계에 의한 고객유인행위에 해당하는지 판단하는 방법\n\n [3] 구 독점규제 및 공정거래에 관한 법률 시행령 제36조 제1항 [별표 1의2] 제2호 (나)목의 ‘거래조건차별’에 해당하기 위한 요건\n\n [4] 甲 주식회사가 비교쇼핑서비스를 운영하면서 자신이 운영하는 오픈마켓 입점사업자의 상품이 상대적으로 검색결과 상위에 노출되도록 몇 차례에 걸쳐 알고리즘을 조정ㆍ변경한 행위가 구 독점규제 및 공정거래에 관한 법령의 시장지배적 지위 남용 차별행위, 불공정거래행위 차별행위 및 부당고객 유인행위에 해당한다는 이유로 공정거래위원회가 甲 회사에 시정명령 및 과징금납부명령을 한 사안에서, 위 행위가 시장지배적 지위 남용 차별행위, 불공정거래행위 차별행위 및 부당고객 유인행위에 해당한다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례",
    "판결요지": "[1] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제3조의2 제1항 제3호에서 정한 시장지배적 사업자의 지위남용행위로서 차별행위가 성립하기 위한 요건의 하나인 부당성은 ‘독과점적 시장에서의 경쟁촉진’이라는 입법 목적에 맞추어 해석해야 한다. 그러므로 시장지배적 사업자가 개별 거래의 상대방인 특정 사업자에 대한 부당한 의도나 목적을 가지고 차별행위를 한 모든 경우 또는 차별행위로 인하여 특정 사업자가 사업활동에 곤란을 겪게 되었다거나 곤란을 겪게 될 우려가 발생하였다는 것과 같이 특정 사업자가 불이익을 입게 되었다는 사정만으로는 부당성을 인정하기에 부족하다. 이에 더하여 그중에서도 특히 시장에서의 독점을 유지ㆍ강화할 의도나 목적, 즉 시장에서의 자유로운 경쟁을 제한함으로써 인위적으로 시장질서에 영향을 가하려는 의도나 목적을 갖고, 객관적으로도 그러한 경쟁제한의 효과가 생길 만한 우려가 있는 행위로 평가될 수 있는 행위로서의 성질을 갖는 차별행위를 했을 때에 부당성이 인정될 수 있다.\n  따라서 시장지배적 사업자의 차별행위가 지위남용행위에 해당한다고 주장하는 공정거래위원회는 차별행위가 상품의 가격 상승, 산출량 감소, 혁신 저해, 유력한 경쟁사업자의 수의 감소, 다양성 감소 등과 같은 경쟁제한의 효과가 생길 만한 우려가 있는 행위로서 그에 대한 의도와 목적이 있었다는 점을 증명해야 한다. 차별행위로 인하여 현실적으로 위와 같은 효과가 나타났음이 증명된 경우에는 그 행위 당시에 경쟁제한을 초래할 우려가 있었고 또한 그에 대한 의도나 목적이 있었음을 사실상 추정할 수 있다. 그러나 그렇지 않은 경우에는 차별행위의 경위 및 동기, 차별행위의 태양, 관련시장의 특성, 차별행위로 인하여 거래상대방이 입은 불이익의 정도, 관련시장에서의 가격 및 산출량의 변화 여부, 혁신 저해 및 다양성 감소 여부 등 여러 사정을 종합적으로 고려하여 문제 된 차별행위가 위에서 본 경쟁제한의 효과가 생길 만한 우려가 있는 행위로서 그에 대한 의도나 목적이 있었는지를 판단해야 한다. 이처럼 경쟁제한의 의도와 목적은 그와 상당한 관련성이 있는 간접사실들을 통해 판단해야 하고, 경쟁제한의 의도와 목적만으로 경쟁제한의 우려가 곧바로 인정되는 것도 아니므로, 위에서 본 여러 사정을 종합적으로 고려하여 문제 된 차별행위가 경쟁제한을 초래할 구체적인 우려가 인정되는지도 판단해야 한다. 이는 온라인 플랫폼 사업자인 시장지배적 사업자가 자사의 상품 또는 서비스를 경쟁사업자의 상품 또는 서비스보다 유리하게 차별적으로 취급하는 행위가 문제 된 경우에도 마찬가지이다.\n  나아가 시장지배적 사업자의 차별행위로 인한 경쟁제한의 효과가 문제 되는 관련시장은 시장지배적 사업자 또는 경쟁사업자가 속한 시장뿐만 아니라 그 시장의 상품 생산을 위하여 필요한 원재료나 부품 및 반제품 등을 공급하는 시장 또는 그 시장에서 생산된 상품을 공급받아 새로운 상품을 생산하는 시장도 포함될 수 있다. 이처럼 시장지배적 사업자의 행위가 지배적 지위를 보유하고 있는 시장 또는 행위가 이루어진 시장과는 다른 시장에서 경쟁제한의 효과가 문제 되는 경우, 공정거래위원회는 해당 행위로 인하여 그 다른 시장에서 현실적으로 경쟁제한의 효과가 발생했거나 그 행위 당시에 경쟁제한을 초래할 우려가 있었다는 점을 증명해야 한다. \n\n [2] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제23조 제1항 제3호는 ‘부당하게 경쟁자의 고객을 자기와 거래하도록 유인하거나 강제하는 행위’를 불공정거래행위 중 하나의 유형으로 규정하고 있고, 제3항은 불공정거래행위의 유형 또는 기준을 대통령령으로 정하도록 규정하고 있다. 그 위임에 따른 구 독점규제 및 공정거래에 관한 법률 시행령(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것) 제36조 제1항 [별표 1의2] 제4호 (나)목 ‘부당한 표시ㆍ광고 외의 방법으로 자기가 공급하는 상품 또는 용역의 내용이나 거래조건 기타 거래에 관한 사항에 관하여 실제보다 또는 경쟁사업자의 것보다 현저히 우량 또는 유리한 것으로 고객을 오인시키거나 경쟁사업자의 것이 실제보다 또는 자기의 것보다 현저히 불량 또는 불리한 것으로 고객을 오인시켜 경쟁사업자의 고객을 자기와 거래하도록 유인하는 행위’를 위계에 의한 고객유인으로 규정하고 있다. \n  한편 위계에 의한 고객유인행위가 성립하기 위해서는 위계 또는 기만적인 유인행위로 인하여 고객이 오인될 우려가 있음으로 충분하고, 반드시 고객에게 오인의 결과가 발생해야 하는 것은 아니다. 그리고 여기에서 오인이란 고객의 상품 또는 용역에 대한 선택 및 결정에 영향을 미치는 것을 말하고, 오인의 우려란 고객의 상품 또는 용역의 선택에 영향을 미칠 가능성 또는 위험성을 말한다. \n  이와 같이 위계에 의한 고객유인행위를 금지하는 취지는 위계 또는 기만행위로 소비자의 합리적인 상품선택을 침해하는 것을 방지하는 한편, 해당 업계 사업자 간의 가격 등에 관한 경쟁을 통하여 공정한 경쟁질서 또는 거래질서를 유지하기 위한 데에 있다. 따라서 사업자의 행위가 불공정거래행위로서 위계에 의한 고객유인행위에 해당하는지를 판단할 때에는, 그 행위로 인하여 보통의 거래 경험과 주의력을 가진 일반 소비자의 거래 여부에 관한 합리적인 선택이 저해되거나 다수 소비자들이 궁극적으로 피해를 볼 우려가 있게 되는 등 널리 업계 전체의 공정한 경쟁질서나 거래질서에 미치게 될 영향, 파급효과의 유무 및 정도, 문제 된 행위를 영업전략으로 채택한 사업자의 수나 규모, 경쟁사업자들이 모방할 우려가 있는지, 관련되는 거래의 규모, 통상적 거래의 형태, 사업자가 사용한 경쟁수단의 구체적 태양, 사업자가 해당 경쟁수단을 사용한 의도, 그와 같은 경쟁수단이 일반 상거래의 관행과 신의칙에 비추어 허용되는 정도를 넘는지, 계속적ㆍ반복적인지 등을 종합적으로 살펴보아야 한다. \n\n [3] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제23조 제1항 제1호 후단 및 구 독점규제 및 공정거래에 관한 법률 시행령(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것) 제36조 제1항 [별표 1의2] 제2호 (나)목의 ‘거래조건차별’에 해당하기 위해서는 특정사업자에 대한 거래조건이나 거래내용이 다른 사업자에 대한 것보다 유리 또는 불리해야 할 뿐만 아니라 그 유리 또는 불리한 정도가 현저해야 하고, 또 그렇게 차별취급하는 것이 부당한 것이어야 한다.\n\n [4] 甲 주식회사가 비교쇼핑서비스를 운영하면서 자신이 운영하는 오픈마켓 입점사업자의 상품이 상대적으로 검색결과 상위에 노출되도록 몇 차례에 걸쳐 알고리즘을 조정ㆍ변경한 행위가 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 등의 시장지배적 지위 남용 차별행위, 불공정거래행위 차별행위 및 부당고객 유인행위에 해당한다는 이유로 공정거래위원회가 甲 회사에 시정명령 및 과징금납부명령을 한 사안에서, 甲 회사가 온라인 플랫폼 사업자로서 시장지배적 사업자라는 이유만으로 타사와의 거래조건을 설정할 때 甲 회사가 제공하는 상품 또는 용역과 동등하게 대우하도록 甲 회사에 요구할 법령상 근거가 있는 것은 아니므로 위 행위가 시장지배적 지위 남용 차별행위에 해당하기 위해서는 부당성이 인정되어야 하는데, 제반 사정에 비추어 위 행위로 ‘경쟁제한의 효과가 생길만한 우려’가 있다거나 ‘경쟁제한의 의도’가 있다고 볼 수 없어 부당성이 인정된다고 보기 어려운 점, 甲 회사가 자신의 오픈마켓 입점상품인지 여부에 따라 비교쇼핑서비스 검색결과의 노출 순위가 조정되도록 검색 알고리즘을 설계했다는 이유만으로 곧바로 위계에 해당한다고 볼 수는 없고, 위 행위로 甲 회사 오픈마켓 입점상품의 노출 순위가 상대적으로 상승했더라도, 일반 소비자들이 甲 회사 오픈마켓 입점상품이 실제보다 또는 경쟁사업자의 것보다 현저히 우량 또는 유리한 것으로 오인했거나 오인할 우려가 있었다고 보기는 어려운 점 등을 종합하면, 위 행위가 시장지배적 지위 남용 차별행위, 불공정거래행위 차별행위 및 부당고객 유인행위에 해당한다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례.",

    "참조판례": "[1] 대법원 2007. 11. 22. 선고 2002두8626 전원합의체 판결(공2007하, 1940), 대법원 2023. 4. 13. 선고 2020두31897 판결(공2023상, 850) / [2] 대법원 2002. 12. 26. 선고 2001두4306 판결(공2003하, 521), 대법원 2019. 9. 26. 선고 2014두15047 판결(공2019하, 2037), 대법원 2019. 10. 18. 선고 2015두370 판결 / [3] 대법원 2006. 5. 26. 선고 2004두3014 판결(공2006하, 1174)",
    "판례내용": "【원고, 상고인】                ○○○ 주식회사 (소송대리인 변호사 김소영 외 6인)\n【피고, 피상고인】 공정거래위원회 (소송대리인 법무법인 지음 담당변호사 이호영 외 1인)\n【원심판결】  서울고법 2022. 12. 14. 선고 2021누36129 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  1. 사건의 개요\n  원심판결의 이유 및 원심이 적법하게 채택하여 조사한 증거 등에 따르면, 다음과 같은 사실을 알 수 있다. \n  가. 온라인 비교쇼핑서비스(이하 ‘비교쇼핑서비스’라고 한다)는 다양한 온라인 쇼핑몰 사업자로부터 상품가격 등 상품에 대한 여러 정보(이하 간단히 ‘상품정보’라고 한다)를 제공받은 후, 특정 상품에 대한 정보를 검색하는 소비자에게 해당 정보를 제공하여 소비자가 원하는 상품을 최적의 조건으로 구매할 수 있도록 도와주는 서비스이다. 원고는 2003년경 ‘○○○ 지식쇼핑’이라는 비교쇼핑서비스를 제공하기 시작하였고, 이후 2015년 ‘○○○쇼핑’으로 그 명칭을 변경하였다(이하 그 명칭을 구별하지 않고 ‘○○○쇼핑’이라고 한다). \n  나. 오픈마켓이란 온라인을 통해 누구나 상품을 자유롭게 구매하고 판매할 수 있는 온라인상의 자유 시장공간 또는 그러한 시장의 운영형식을 의미한다. 원고는 2012. 3. 23. ‘△△’이라는 이름으로 입점사업자들을 모집하여 쇼핑몰 플랫폼 서비스를 시작하였고, 2014. 6. 2. △△을 ‘□□□’으로 전환하면서 수수료 부과 방식을 변경하였다. 이후 □□□은 2018. 2. 그 명칭을 ‘◇◇◇스토어’로 변경하여 현재까지 서비스를 제공하고 있다(이하 △△, □□□, ◇◇◇스토어를 구별하지 않고 모두 ‘◇◇◇스토어’라고 한다).\n  다. 피고는, 원고가 ○○○쇼핑을 운영하면서 ◇◇◇스토어 입점사업자의 상품이 상대적으로 검색결과 상위에 노출되도록 몇 차례에 걸쳐 검색 알고리즘을 조정ㆍ변경하였다(이하 이와 같은 원고의 행위를 ‘이 사건 행위’라고 한다)고 판단하고, 원고의 이러한 행위가 ① 구 「독점규제 및 공정거래에 관한 법률」(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법’이라고 하고, 현행 「독점규제 및 공정거래에 관한 법률」을 이하 ‘공정거래법’이라고 한다) 제3조의2 제1항 제3호, 구 독점규제 및 공정거래에 관한 법률 시행령(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법 시행령’이라고 한다) 제5조 제3항 제4호, 구 시장지배적지위 남용행위 심사기준(2021. 12. 30. 공정거래위원회고시 제2021-18호로 개정되기 전의 것) Ⅳ. 3. 라. (2)의 거래조건을 부당하게 차별하는 행위(이하 이 부분 행위를 ‘시장지배적 지위 남용 차별행위’라고 한다), ② 구 공정거래법 제23조 제1항 제1호, 구 공정거래법 시행령 제36조 제1항 [별표 1의2] 제2호 (나)목의 거래조건차별(이하 이 부분 행위를 ‘불공정거래 차별행위’라고 한다), ③ 구 공정거래법 제23조 제1항 제3호, 구 공정거래법 시행령 제36조 제1항 [별표 1의2] 제4호 (나)목의 위계에 의한 고객유인(이하 이 부분 행위를 ‘부당한 고객유인행위’라고 한다)에 해당한다고 보아, 원고에게 시정명령 및 과징금납부명령을 하는 이 사건 처분을 하였다.\n  2. 시장지배적 지위 남용 차별행위 관련 상고이유에 대하여   \n  가. 이 사건 행위가 거래상대방별로 거래조건을 차별한 행위인지  \n  1) 원심은 다음과 같은 이유로 원고의 이 사건 행위가 거래상대방별로 거래조건을 차별한 행위라고 보았다. \n  가) 이 사건 행위로 거래조건이 차별된 거래상대방은 오픈마켓의 하나인 ◇◇◇스토어 입점사업자와 이 사건 경쟁 오픈마켓 입점사업자이다. 원고의 검색 알고리즘 조정에 의하여 노출 순위에 직접적인 영향을 받는 것은 검색의 대상이 되는 개개 상품 및 이를 판매하는 사업자들이기 때문에 오픈마켓이 아닌 개개 입점사업자를 거래상대방으로 봄이 타당하다. \n  원고가 이 사건 경쟁 오픈마켓 입점사업자와 직접적인 계약관계를 맺는 것은 아니나, 시장지배적 지위 남용행위에서의 ‘거래’란 개별적인 계약보다 넓은 의미로서 사업활동을 위한 수단 일반 또는 거래질서를 뜻하는 것으로 보아야 하고(대법원 2010. 1. 14. 선고 2008두14739 판결, 대법원 2019. 9. 26. 선고 2014두15740 판결 등 참조), 시장지배적 지위 남용행위의 입법 목적을 고려할 때 공정하고 자유로운 경쟁이라는 목적이 달성될 필요가 있는 사업활동을 위한 수단 일반 또는 거래질서에 해당한다고 평가할 수 있다면 직접적이고 개별적인 계약관계가 있지 않은 경우에도 거래관계의 존재를 인정할 수 있다. \n  특히, 입점사업자가 비교쇼핑서비스 이용 여부를 스스로 결정하고 그에 관한 수수료 전액도 사실상 부담하는 점 등에 비추어 보면, 실질적인 비교쇼핑서비스 거래관계는 이 사건 경쟁 오픈마켓이 아니라 그 입점사업자와 원고 사이에 있다. \n  나) 이 사건 행위를 이루는 검색 알고리즘의 수정은 원고의 ◇◇◇스토어에 입점한 상품을 이 사건 경쟁 오픈마켓에 입점한 상품에 비해 검색결과 노출 순위 면에서 우대하는 것으로 거래상대방별로 거래조건을 차별하는 행위에 해당한다. \n  2) 관련 법리 및 원심이 적법하게 채택하여 조사한 증거에 비추어 살펴보면, 위와 같은 이 부분 원심의 판단에 상고이유 주장과 같은 거래상대방의 확정, 거래조건 차별행위에 관한 법리를 오해하여 필요한 심리를 다하지 않은 잘못이 없다. \n  나. 이 사건 행위에 부당성이 인정되는지 \n  1) 관련 법리\n                 구 공정거래법 제3조의2 제1항 제3호가 정한 시장지배적 사업자의 지위남용행위로서의 차별행위가 성립하기 위한 요건의 하나인 부당성은 ‘독과점적 시장에서의 경쟁촉진’이라는 입법 목적에 맞추어 해석하여야 한다. 그러므로 시장지배적 사업자가 개별 거래의 상대방인 특정 사업자에 대한 부당한 의도나 목적을 가지고 차별행위를 한 모든 경우 또는 그 차별행위로 인하여 특정 사업자가 사업활동에 곤란을 겪게 되었다거나 곤란을 겪게 될 우려가 발생하였다는 것과 같이 특정 사업자가 불이익을 입게 되었다는 사정만으로는 그 부당성을 인정하기에 부족하다. 이에 더하여 그중에서도 특히 시장에서의 독점을 유지ㆍ강화할 의도나 목적, 즉 시장에서의 자유로운 경쟁을 제한함으로써 인위적으로 시장질서에 영향을 가하려는 의도나 목적을 갖고, 객관적으로도 그러한 경쟁제한의 효과가 생길 만한 우려가 있는 행위로 평가될 수 있는 행위로서의 성질을 갖는 차별행위를 하였을 때에 그 부당성이 인정될 수 있다(대법원 2007. 11. 22. 선고 2002두8626 전원합의체 판결 등 참조).\n  따라서 시장지배적 사업자의 차별행위가 그 지위남용행위에 해당한다고 주장하는 피고로서는 그 차별행위가 상품의 가격 상승, 산출량 감소, 혁신 저해, 유력한 경쟁사업자의 수의 감소, 다양성 감소 등과 같은 경쟁제한의 효과가 생길 만한 우려가 있는 행위로서 그에 대한 의도와 목적이 있었다는 점을 증명하여야 한다. 차별행위로 인하여 현실적으로 위와 같은 효과가 나타났음이 증명된 경우에는 그 행위 당시에 경쟁제한을 초래할 우려가 있었고 또한 그에 대한 의도나 목적이 있었음을 사실상 추정할 수 있다. 그러나 그렇지 않은 경우에는 차별행위의 경위 및 동기, 차별행위의 태양, 관련시장의 특성, 차별행위로 인하여 그 거래상대방이 입은 불이익의 정도, 관련시장에서의 가격 및 산출량의 변화 여부, 혁신 저해 및 다양성 감소 여부 등 여러 사정을 종합적으로 고려하여 문제 된 차별행위가 위에서 본 경쟁제한의 효과가 생길 만한 우려가 있는 행위로서 그에 대한 의도나 목적이 있었는지를 판단하여야 한다(대법원 2007. 11. 22. 선고 2002두8626 전원합의체 판결, 대법원 2023. 4. 13. 선고 2020두31897 판결 등 참조). 이처럼 경쟁제한의 의도와 목적은 그와 상당한 관련성이 있는 간접사실들을 통해 판단하여야 하고, 경쟁제한의 의도와 목적만으로 경쟁제한의 우려가 곧바로 인정되는 것도 아니므로, 위에서 본 여러 사정을 종합적으로 고려하여 문제 된 차별행위가 경쟁제한을 초래할 구체적인 우려가 인정되는지 여부도 판단하여야 한다. 이는 온라인 플랫폼 사업자인 시장지배적 사업자가 자사의 상품 또는 서비스를 경쟁사업자의 상품 또는 서비스보다 유리하게 차별적으로 취급하는 행위가 문제 된 경우에도 마찬가지이다.\n  나아가 시장지배적 사업자의 차별행위로 인한 경쟁제한의 효과가 문제 되는 관련시장은 시장지배적 사업자 또는 경쟁사업자가 속한 시장뿐만 아니라 그 시장의 상품 생산을 위하여 필요한 원재료나 부품 및 반제품 등을 공급하는 시장 또는 그 시장에서 생산된 상품을 공급받아 새로운 상품을 생산하는 시장도 포함될 수 있다(대법원 2007. 11. 22. 선고 2002두8626 전원합의체 판결, 대법원 2023. 4. 13. 선고 2020두31897 판결 등 참조). 이처럼 시장지배적 사업자의 행위가 지배적 지위를 보유하고 있는 시장 또는 행위가 이루어진 시장과는 다른 시장에서 경쟁제한의 효과가 문제 되는 경우, 피고는 해당 행위로 인하여 그 다른 시장에서 현실적으로 경쟁제한의 효과가 발생하였거나 그 행위 당시에 경쟁제한을 초래할 우려가 있었다는 점을 증명하여야 한다.\n  2) 원심의 판단 \n  원심은 판시와 같은 이유로 다음과 같이 판단하면서, 원고가 ◇◇◇스토어 입점사업자와 이 사건 경쟁 오픈마켓 입점사업자의 거래조건을 부당하게 차별함으로써, 이 사건 경쟁 오픈마켓 입점사업자 및 이 사건 경쟁 오픈마켓의 사업활동을 방해하였다고 보았다. \n  가) 원고가 원고의 검색 알고리즘의 조정ㆍ변경이 ◇◇◇스토어 상품의 노출에 미치는 영향에 관하여 지속적으로 연구하였고, 여기에 이 사건 행위 전후로 작성된 원고 내부 문건 등의 내용에 비추어 원고에게는 경쟁제한의 의도와 목적이 인정된다. 원고에게 다양성 증진의 의도도 있었다고 하여 ◇◇◇스토어 지원의 의도가 없었다고 할 수는 없다.\n  나) 원고의 ○○○쇼핑은 오픈마켓의 유입경로로 매우 중요한 역할을 하고 있고, 원고는 비교쇼핑서비스 시장에서 압도적인 시장지배적 지위를 차지하고 있다. 특히 원고는 본래 일반검색서비스 시장에서 지배적 지위를 차지하고 있던 사업자인데, 이를 통해 확보한 다량의 트래픽을 바탕으로 비교쇼핑서비스 시장에서도 지배적 사업자로 자리 잡을 수 있었고, 다시 이를 토대로 오픈마켓 시장에서도 점유율을 확대하였다. 이처럼 한 시장의 시장지배력을 이용하여 다른 시장에서 시장지배적 지위를 점하거나 후발주자임에도 용이하게 점유율을 확대하는 행위는 경쟁제한적 성격이 강해 그만큼 규제의 필요성도 크다.\n  다) 이 사건 행위로 인하여 원고가 시장점유율이나 거래액, 입점사업자 수 등에서 이 사건 경쟁 오픈마켓에 비해 상대적으로 높은 증가율을 보였다면, 경쟁제한 효과가 발생하였거나 발생할 우려가 있었다고 충분히 인정할 수 있다. 단순히 이 사건 경쟁 오픈마켓 거래액의 절대량이 증가하였다거나, 오픈마켓의 전체 규모가 성장하고 신규 사업자가 계속해서 등장하고 있다고 하여 그러한 경쟁제한 효과 발생의 우려가 없었다고 할 수 없다.\n  3) 대법원의 판단\n  그러나 이와 같은 원심의 판단은 다음과 같은 이유에서 그대로 수긍하기 어렵다.\n  가) 원심이 인정한 바와 같이 이 사건 행위의 거래상대방을 ◇◇◇스토어 입점사업자와 이 사건 경쟁 오픈마켓 입점사업자로 보더라도, 이 사건 행위로 인한 실질적인 효과는 ◇◇◇스토어와 이 사건 경쟁 오픈마켓에 미치므로, 결국 이 사건 행위는 원고가 제공하는 용역을 이 사건 경쟁 오픈마켓이 제공하는 용역보다 우대한 행위에 해당한다고 평가할 수 있다. 다만 원고가 온라인 플랫폼 사업자로서 시장지배적 사업자라는 이유만으로 타사와의 거래조건을 설정할 때 원고가 제공하는 상품 또는 용역과 동등하게 대우하도록 원고에게 요구할 법령상 근거가 있는 것은 아니므로, 원고의 이 사건 행위가 시장지배적 지위 남용 차별행위에 해당하기 위해서는 앞서 살펴본 법리에 따라 부당성이 인정되어야 한다. \n  나) 먼저 ‘경쟁제한의 효과가 생길 만한 우려’ 부분에 관하여 살펴본다. \n  (1) 원고의 ○○○쇼핑이 오픈마켓의 유입경로로서 중요한 역할을 하였다는 점에 더하여 이 사건 행위의 부당성을 주장하는 피고로서는 원고의 이 사건 행위로 인하여 경쟁제한 효과의 발생이 문제 되는 오픈마켓 시장에서 경쟁제한의 효과가 생길 만한 구체적인 우려가 있었다는 점을 증명하여야 한다. 마찬가지로 피고는 원고가 비교쇼핑서비스 시장에서의 지배적 지위를 이용하여 오픈마켓 시장에서 경쟁제한을 초래할 개연성이 있음을 증명하여야 한다. 시장지배적 사업자의 행위가 지배적 지위를 보유하고 있는 시장 또는 행위가 이루어진 시장이 아닌 다른 시장에 영향을 미친다는 이유만으로 경쟁제한적 성격이 강하다고 볼 수는 없다.\n  (2) 이 사건 행위가 일어나는 기간 동안 원고의 ◇◇◇스토어는 시장점유율이나 거래액, 입점사업자 수에서 이 사건 경쟁 오픈마켓에 비해 상대적으로 높은 증가율을 보인 사실은 원심이 인정한 바와 같다. \n  그러나 한편 원심이 인정한 사실관계에 의하면, 이 사건 경쟁 오픈마켓의 전체 거래액과 거래건수 중 ○○○쇼핑을 통한 거래액과 거래건수의 비중은 상대적으로 낮은 수준이고, ○○○쇼핑 등 비교쇼핑서비스를 통하지 않은 채 직접 이 사건 경쟁 오픈마켓을 방문하여 이루어진 거래액과 거래건수의 비중이 상대적으로 높은 수준으로 나타나고 있다. 또한 이 사건 행위가 이루어진 기간 동안 이 사건 경쟁 오픈마켓의 거래액은 꾸준히 증가하였고, 이 사건 경쟁 오픈마켓 입점사업자의 수도 유지되었으며, 이 사건 행위로 인하여 이 사건 경쟁 오픈마켓의 비용이 상승하였다고 볼 근거도 없다. 오히려 원심이 적법하게 채택하여 조사한 증거에 따르면, 이 사건 행위에도 불구하고 유력한 신규사업자들이 오픈마켓 시장에 진입하여 안착하기도 하는 등 오픈마켓 시장에서는 유효한 경쟁이 계속되고 있었던 사실을 알 수 있다. \n  그렇다면 원심으로서는 원고의 시장점유율이나 거래액, 입점사업자 수의 증가가 이 사건 행위로 인한 것인지, 아니면 원고의 시장성과에 기초한 경쟁, 이른바 ‘성과경쟁’의 산물이거나 관련시장의 전반적인 확대로 인한 것인지 등을 심리하고, 오픈마켓 시장에서의 경쟁상황을 종합적으로 고려하여 이 사건 행위가 경쟁제한의 효과를 일으킬 만한 우려가 있는 행위인지를 판단하였어야 할 것이다.\n  다) 다음으로 ‘경쟁제한의 의도’에 관하여 살펴본다. \n  (1) 원심이 인정한 사실관계에 의하면, 원고가 제공하는 비교쇼핑서비스의 품질은 검색결과로 노출된 상품의 적합도, 인기도, 신뢰도, 상품의 다양성 등 다양한 요소의 영향을 받는다. 원고가 이러한 요소들이 반영된 검색 알고리즘을 조정ㆍ변경하면서 그와 같은 검색 알고리즘의 조정ㆍ변경이 검색결과의 노출에 미치는 영향을 연구하는 것은 기본적으로 정상적인 원고의 영업활동에 속하고, 이러한 원고의 노력이 그 자체로서 경쟁제한의 의도나 목적을 추단하는 요소가 될 수는 없다. 한편 원심이 원고의 의도 중 하나로 인정한 바 있는 다양성의 증진은 비교쇼핑서비스의 품질 향상을 위한 중요요소로서, 이러한 의도의 존재는 이 사건 행위가 성과경쟁을 위한 행위였을 가능성이 있음을 시사한다. \n  (2) 또한 원심이 적법하게 채택하여 조사한 증거에 따르면, 원고가 이 사건 행위가 문제 되는 기간 동안 수십 차례에 걸쳐 검색 알고리즘을 조정ㆍ변경해 왔는데, 피고는 이 중에서 원고에게 유리한 노출 결과를 가져온 5건의 검색 알고리즘 조정ㆍ변경만을 선별하여 이 사건 처분사유로 삼은 사실을 알 수 있다. 그러나 검색 알고리즘은 시행착오를 거치며 점진적으로 개선되는 것이 일반적이고, 그 개선 과정에는 다소간의 편향이 나타날 수밖에 없다는 점을 고려할 때, 일련의 검색 알고리즘 개선 과정에서 이루어진 행위 중 일부만을 선별하여 이를 근거로 경쟁제한적 의도나 목적을 인정하는 것은 원고의 실제 의도나 목적을 왜곡할 우려가 있다. \n  (3) 그렇다면 원심으로서는 검색 알고리즘의 조정ㆍ변경이 가지는 속성과 그동안 이루어진 검색 알고리즘의 조정ㆍ변경의 이력에 비추어 인정되는 원고의 의도 등 여러 사정을 종합적으로 고려하여 원고에게 경쟁제한의 의도가 인정되는지를 판단하였어야 할 것이다.\n  라) 그럼에도 원심은 그 판시와 같은 이유만을 들어 이 사건 행위에 부당성이 인정된다고 판단하였다. 이 같은 원심의 판단에는 시장지배적 지위 남용 차별행위에 관한 경쟁제한의 효과 및 경쟁제한의 의도와 목적에 관한 법리를 오해하여 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 있다. 이를 지적하는 원고의 제2, 3 상고이유 주장은 이유 있다.\n  3. 부당한 고객유인행위 관련 상고이유에 대하여\n  가. 관련 법리\n                 구 공정거래법 제23조 제1항 제3호는 ‘부당하게 경쟁자의 고객을 자기와 거래하도록 유인하거나 강제하는 행위’를 불공정거래행위 중 하나의 유형으로 규정하고 있고, 제3항은 불공정거래행위의 유형 또는 기준을 대통령령으로 정하도록 규정하고 있다. 그 위임에 따른 구 공정거래법 시행령 제36조 제1항 [별표 1의2] 제4호 (나)목 ‘부당한 표시ㆍ광고 외의 방법으로 자기가 공급하는 상품 또는 용역의 내용이나 거래조건 기타 거래에 관한 사항에 관하여 실제보다 또는 경쟁사업자의 것보다 현저히 우량 또는 유리한 것으로 고객을 오인시키거나 경쟁사업자의 것이 실제보다 또는 자기의 것보다 현저히 불량 또는 불리한 것으로 고객을 오인시켜 경쟁사업자의 고객을 자기와 거래하도록 유인하는 행위’를 위계에 의한 고객유인으로 규정하고 있다. \n  한편 위계에 의한 고객유인행위가 성립하기 위해서는 위계 또는 기만적인 유인행위로 인하여 고객이 오인될 우려가 있음으로 충분하고, 반드시 고객에게 오인의 결과가 발생하여야 하는 것은 아니다. 그리고 여기에서 오인이라고 함은 고객의 상품 또는 용역에 대한 선택 및 결정에 영향을 미치는 것을 말하고, 오인의 우려라고 함은 고객의 상품 또는 용역의 선택에 영향을 미칠 가능성 또는 위험성을 말한다(대법원 2002. 12. 26. 선고 2001두4306 판결, 대법원 2019. 10. 18. 선고 2015두370 판결 등 참조). \n  이와 같이 위계에 의한 고객유인행위를 금지하는 취지는 위계 또는 기만행위로 소비자의 합리적인 상품선택을 침해하는 것을 방지하는 한편, 해당 업계 사업자 간의 가격 등에 관한 경쟁을 통하여 공정한 경쟁질서 또는 거래질서를 유지하기 위한 데에 있다. 따라서 사업자의 행위가 불공정거래행위로서 위계에 의한 고객유인행위에 해당하는지를 판단할 때에는, 그 행위로 인하여 보통의 거래 경험과 주의력을 가진 일반 소비자의 거래 여부에 관한 합리적인 선택이 저해되거나 다수 소비자들이 궁극적으로 피해를 볼 우려가 있게 되는 등 널리 업계 전체의 공정한 경쟁질서나 거래질서에 미치게 될 영향, 파급효과의 유무 및 정도, 문제 된 행위를 영업전략으로 채택한 사업자의 수나 규모, 경쟁사업자들이 모방할 우려가 있는지, 관련되는 거래의 규모, 통상적 거래의 형태, 사업자가 사용한 경쟁수단의 구체적 태양, 사업자가 해당 경쟁수단을 사용한 의도, 그와 같은 경쟁수단이 일반 상거래의 관행과 신의칙에 비추어 허용되는 정도를 넘는지, 계속적ㆍ반복적인지 등을 종합적으로 살펴보아야 한다(대법원 2019. 9. 26. 선고 2014두15047 판결, 대법원 2019. 10. 18. 선고 2015두370 판결 등 참조). \n  나. 자기가 공급하는 상품 또는 용역에 관한 것인지 여부  \n  원심은, 그 판시와 같은 이유로 이 사건 행위는 원고의 ◇◇◇스토어를 통해 판매되는 상품에 관한 행위로서 원고가 공급하는 상품 등에 관한 행위라고 판단하였다.\n  관련 법리에 비추어 살펴보면, 원심판단에 상고이유 주장과 같은 ‘자기가 공급하는 상품 또는 용역’에 관한 법리오해 및 이유모순의 잘못이 없다.\n  다. 위계로 거래에 관한 사항에 관하여 실제보다 또는 경쟁사업자의 것보다 현저히 우량 또는 유리한 것으로 고객을 오인시켰는지 여부 \n  1) 원심의 판단\n  원심은, 비교쇼핑서비스의 성격상 원고는 원고에게 유리하게 검색 알고리즘을 임의로 조정하여서는 안 되고, 노출 순위는 검색 질의에 대한 해당 상품의 적합도와 밀접하게 관련되어 있어 소비자에게 우량의 또는 유리한 상품으로 인식된다는 것을 전제로, 원고가 노출 순위와 첫 페이지에의 노출 여부를 인위적으로 변경한 행위는 자기가 공급하는 상품 또는 용역의 내용이나 거래조건 기타 거래에 관한 사항에 관하여 실제보다 또는 경쟁사업자의 것보다 현저히 우량 또는 유리한 것으로 고객을 오인시킨 행위에 해당한다고 보았다.\n  또한 원심은, 원고가 소비자에게 최적의 상품 검색결과를 제공한다는 비교쇼핑서비스의 본래의 목적과 용도에 맞게 검색 알고리즘을 설계하여야 하는데, 이용자의 필요가 아니라 ◇◇◇스토어 입점상품인지 여부를 기준으로 ○○○쇼핑 검색결과의 노출 순위를 조정한 것은 위계에 해당하고, 고객을 오인시킬 우려가 있는 행위에 해당한다고 판단하였다. \n  2) 대법원의 판단\n  그러나 이와 같은 원심의 판단은 다음과 같은 이유에서 그대로 수긍하기 어렵다.\n  가) 원고가 자기가 공급하는 상품 또는 용역을 경쟁사업자가 공급하는 상품 또는 용역과 동등하게 대우할 의무가 비교쇼핑서비스의 성격에서 직접 도출된다고 보기 어렵다. \n  결국 사업자는 자신의 가치판단과 영업전략을 반영하여 상품정보의 노출 여부 및 노출 순위를 결정하는 검색 알고리즘을 설계할 수 있고, 원고가 이러한 구체적 가치판단이나 영업전략까지 소비자나 외부에 공지해야 한다고 볼 수 없다. 다만 그 검색 알고리즘이 위계 또는 기만행위에 해당하여 소비자의 합리적인 상품선택을 침해할 우려가 있다거나 공정한 경쟁질서 또는 거래질서를 훼손할 우려가 있는 경우에는 그 범위에서 위법성이 인정될 수 있다. \n  이러한 점을 고려할 때, 원고가 ◇◇◇스토어 입점상품인지 여부에 따라 ○○○쇼핑 검색결과의 노출 순위가 조정되도록 검색 알고리즘을 설계하였다는 이유만으로 곧바로 위계에 해당한다고 볼 수는 없다. \n  나) 원심이 적법하게 채택하여 조사한 증거에 따르면, 원고가 문제 되는 검색 알고리즘에 따른 검색결과를 ‘○○○쇼핑 랭킹순’이라 표시하면서 그 정렬 기준에 대하여 ‘적합도 지수, 상품의 인기도/신뢰도 지수 등을 점수화하여 정렬’한다는 점과 이들 각 지수의 산정 시 고려되는 여러 요소를 소비자들에게 안내한 사실, 원고가 ‘낮은 가격순’, ‘높은 가격순’, ‘등록일순’, ‘리뷰 많은 순’과 같은 다른 기준에 따른 검색결과도 별도로 제공한 사실을 알 수 있다.\n  위와 같은 안내를 통하여 보통의 거래 경험과 주의력을 가진 일반 소비자들은 ‘○○○쇼핑 랭킹순’ 정렬이 단순히 상품 자체의 속성만을 기준으로 삼아 상품 간 우량 또는 유리함이 비교되어 노출된 것이 아님을 알 수 있었을 것으로 보인다. 한편 별도 검색결과의 제공행위는 소비자의 선택을 보조하기 위한 것으로 보인다. 이러한 점 등을 감안할 때, 이 사건 행위가 일반 상거래의 관행과 신의칙에 비추어 허용되는 정도를 넘어, 소비자의 상품 또는 용역의 선택에 영향을 미칠 가능성 또는 위험성이 인정된다고 단정하기 어렵다.\n  결국 이 사건 행위로 인하여 ◇◇◇스토어 입점상품의 노출 순위가 상대적으로 상승하였다고 하더라도, 일반 소비자들이 ◇◇◇스토어 입점상품이 실제보다 또는 경쟁사업자의 것보다 현저히 우량 또는 유리한 것으로 오인하였거나 오인할 우려가 있었다고 보기는 어렵다. \n  다) 그럼에도 원심은 그 판시와 같은 이유만으로 이 사건 행위가 위계로 고객을 오인시킬 우려가 있었다고 판단하였다. 이러한 원심의 판단에는 위계에 의한 고객유인행위에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 원고의 제4 상고이유 주장은 이유 있다.\n  4. 불공정거래 차별행위 관련 상고이유에 대하여  \n  가. 관련 법리\n                 구 공정거래법 제23조 제1항 제1호 후단 및 같은 법 시행령 제36조 제1항 [별표 1의2] 제2호 (나)목의 ‘거래조건차별’에 해당하기 위해서는 특정사업자에 대한 거래조건이나 거래내용이 다른 사업자에 대한 것보다 유리 또는 불리하여야 할 뿐만 아니라 그 유리 또는 불리한 정도가 현저하여야 하고, 또 그렇게 차별취급하는 것이 부당한 것이어야 한다(대법원 2006. 5. 26. 선고 2004두3014 판결 참조).\n  나. 판단\n  1) 원심은 그 판시와 같은 이유로, 원고가 이 사건 행위로 검색 알고리즘을 ◇◇◇스토어 상품에 유리하게 조정함으로써 ◇◇◇스토어 입점사업자와 이 사건 경쟁 오픈마켓 입점사업자를 차별취급하였고, 이 사건 행위로 인한 ◇◇◇스토어 상품과 기타 오픈마켓 상품의 노출점유율의 차이 등에 비추어 그 차별의 정도가 현저하다고 보았다. \n  나아가 원심은, 원고가 의도적으로 자사의 ◇◇◇스토어 상품의 우선 노출을 유도한 이상 이는 비교쇼핑서비스의 존재 의의에 반하는 것으로서 부당하고, 그 결과 ◇◇◇스토어의 점유율이 증가하였으므로 오픈마켓 시장에서의 공정한 경쟁이 저해되어 이 사건 행위에 부당성이 인정된다고 판단하였다. \n  2) 그러나 앞서 살펴본 바와 같이, 원고에게 원고가 제공하는 상품 또는 용역과 타사가 제공하는 상품 또는 용역을 동등하게 대우하도록 요구할 법령상 근거는 없다. 이러한 사정에 앞서 2. 나. 3)의 나)항에서 살핀 내용을 아울러 감안하면, 이 사건 행위로 인하여 피고가 주장하는 ‘경쟁제한의 효과가 생길 만한 구체적인 우려’가 충분히 증명되었다고 보기 어렵다. 이는 시장지배적 지위 남용 차별행위의 성립 요건으로 요구되는 부당성의 정도와 불공정거래 차별행위의 성립 요건으로 요구되는 부당성의 정도에 차이가 있을 수 있다는 점을 감안하더라도 마찬가지이다. \n  한편 앞서 살핀 바와 같이 원고가 ‘○○○스토어 랭킹순’에 따른 검색결과 외에 ‘낮은 가격순’, ‘높은 가격순’, ‘등록일순’, ‘리뷰 많은 순’과 같은 다른 기준에 따른 검색결과도 별도로 제공하고 있는 점을 감안하면, 원심이 판시한 사정만을 들어 차별의 현저성을 인정하기도 어렵다. \n  3) 그럼에도 원심은 그 판시와 같은 이유만을 들어 이 사건 행위가 불공정거래 차별행위에 해당한다고 판단하였다. 이러한 원심의 판단에는 불공정거래 차별행위의 현저성 및 부당성에 관한 법리를 오해하여 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 있다. 이를 지적하는 원고의 제2, 3 상고이유 주장은 이유 있다.\n  5. 결론 \n  그러므로 원고의 나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 엄상필(재판장) 오경미(주심) 권영준 박영재"
  },

    "판시사항": "[1] 구 독점규제 및 공정거래에 관한 법률 제2조 제8호에서 정한 ‘일정한 거래분야’는 ‘관련시장’을 의미하는지 여부(적극) / 부당한 공동행위를 한 사업자에 대한 과징금 산정 기준인 ‘관련매출액’ 산정의 전제가 되는 ‘일정한 거래 분야에서 판매된 관련 상품’의 범위를 판단하는 방법 / ‘관련시장’ 또는 ‘관련 상품’의 거래상대방별 구분 필요성이 인정되기 위한 기준인 거래상대방집단들 사이의 대체 가능성 유무를 판단할 때 고려할 사항 / 위반기간 중에 발생한 합의의 대상이 된 상품의 매출액 중 일부가 부당한 공동행위로부터 영향을 받지 않은 경우, 그 부분은 ‘관련매출액’에서 제외되는지 여부(적극)\n\n [2] 항고소송에서 처분의 적법성에 관한 증명책임의 소재\n\n [3] 甲 주식회사를 포함한 몇몇 아이스크림 제조사들이 2016. 2. 15. 시판채널 시장 영업 전반에 대해 협력하기로 합의하고, 2017. 8. 28. 유통채널 시장도 합의하는 등 부당한 공동행위가 지속되자, 공정거래위원회가 과징금을 부과하였는데, 과징금 산정에 있어 관련시장 획정과 관련매출액 산정이 문제 된 사안에서, 위 공동행위의 관련시장은 ‘국내 소용량ㆍ완제품 형태의 아이스크림 판매시장’으로 획정함이 타당하고, 위반기간 동안 판매된 관련 상품들의 매출액은 모두 관련매출액에 포함된다고 본 원심판단을 수긍한 사례",
    "판결요지": "[1] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법’이라 한다) 제22조 본문, 구 독점규제 및 공정거래에 관한 법률 시행령(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것) 제9조 제1항에 따르면, 공정거래위원회는 부당한 공동행위를 한 사업자에게 위반기간 동안 일정한 거래분야에서 판매한 관련 상품이나 용역의 매출액 또는 이에 준하는 금액인 ‘관련매출액’을 기준으로 산정한 과징금을 부과할 수 있다. 구 공정거래법 제2조 제8호는 ‘일정한 거래분야’를 ‘거래의 객체별ㆍ단계별 또는 지역별로 경쟁관계에 있거나 경쟁관계가 성립될 수 있는 분야’로 규정하고 있는데, 이는 ‘관련시장’을 의미한다.\n  관련매출액 산정의 전제가 되는 ‘일정한 거래 분야에서 판매된 관련 상품’의 범위는 부당한 공동행위를 한 사업자 간의 합의 내용, 부당한 공동행위로 인하여 직접 또는 간접적으로 영향을 받는 상품의 종류와 성질, 용도 및 대체 가능성과 거래지역ㆍ거래상대방ㆍ거래단계 등을 고려하여 개별적ㆍ구체적으로 판단하여야 한다.\n  ‘관련시장’ 또는 ‘관련 상품’이 거래의 객체ㆍ단계 또는 지역 외에 거래상대방별로 구분되는 경우도 있을 수 있으나, 이러한 구분의 필요성이 인정되기 위해서는 거래상대방의 특성 또는 상품의 특수성에 의하여 상품, 지역 또는 거래단계별로 특정한 거래상대방집단이 존재함을 전제로 이러한 거래상대방집단들이 경쟁관계에 있지 않음이 인정되어야 한다. 이는 결국 거래상대방집단들 사이의 대체 가능성 유무를 기준으로 판단하여야 하는데, 그 판단에 있어 거래상대방집단별 상품의 가격과 특성, 거래의 구조 및 수요ㆍ공급의 탄력성, 대체 가능성에 대한 인식 및 그와 관련한 의사결정형태, 시간적ㆍ경제적ㆍ법적 측면에서 대체의 용이성 등을 종합적으로 고려하여야 한다.\n  합의의 대상이 된 상품의 매출액이 위반기간 중에 발생하였다고 하더라도, 그 매출액 중 일부가 부당한 공동행위로부터 영향을 받지 않았다는 특별한 사정이 드러난다면 그 부분은 합의로 인하여 직접 또는 간접적으로 영향을 받는 상품의 매출액이라고 보기 어려우므로 ‘관련매출액’에서 제외된다.\n\n [2] 민사소송법 규정이 준용되는 행정소송에서 증명책임은 원칙적으로 민사소송의 일반원칙에 따라 당사자 간에 분배되고, 항고소송의 경우에는 그 특성에 따라 처분의 적법성을 주장하는 피고에게 그 적법사유에 관한 증명책임이 있다. 피고가 주장하는 처분의 적법성에 관하여 합리적으로 수긍할 수 있는 일응의 증명이 있는 경우 그 처분은 정당하다고 할 것이며, 이와 상반되는 주장과 증명은 상대방인 원고에게 그 책임이 돌아간다.\n\n [3]  甲 주식회사를 포함한 몇몇 아이스크림 제조사들이 2016. 2. 15. 시판채널 시장 영업 전반에 대해 협력하기로 합의하고, 2017. 8. 28. 유통채널 시장도 합의하는 등 부당한 공동행위가 지속되자, 공정거래위원회가 과징금을 부과하였는데, 과징금 산정에 있어 관련시장 획정과 관련매출액 산정이 문제 된 사안에서, 위 공동행위의 관련시장은 ‘국내 소용량ㆍ완제품 형태의 아이스크림 판매시장’으로 획정함이 타당하고, 시판채널 시장 판매 아이스크림뿐만 아니라 유통채널 시장 판매 아이스크림도 위 공동행위의 관련 상품 범위에 포함되므로, 과징금 산정의 기초가 되는 관련매출액 범위에 2016. 2. 15.부터 2017. 8. 27.까지의 유통채널 판매 아이스크림 매출액이 포함되고, 프리미엄 제품, 특정업체 특화제품, 이커머스 판매제품 및 2016. 2. 15. 전 소매점 거래처와 체결한 납품계약에 따라 판매한 아이스크림, 2016년 말경 아이스크림 전문할인점 대상 합의가 있기 전 아이스크림 전문할인점을 통해 판매한 아이스크림, 2017년 초경 소매점 지원율 상한 제한 합의가 있기 전 소매점을 통하여 판매한 아이스크림, 2017. 3.경 대리점 초과지원율 상한 제한 합의가 있기 전 대리점을 통해 판매한 아이스크림, 신규 개업한 소매점과 최초로 체결한 납품계약에 따라 해당 소매점을 통하여 판매한 아이스크림, 소매점 지원율 상한 제한 합의 또는 대리점 지원율 상한 제한 합의를 위반하여 판매한 아이스크림의 각 매출액 역시 ‘관련매출액’에 포함된다고 본 원심판단을 수긍한 사례.",
    "참조조문": "[1] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제2조 제8호(현행 제2조 제4호 참조), 제19조 제1항(현행 제40조 제1항 참조), 제22조(현행 제43조 참조), 구 독점규제 및 공정거래에 관한 법률 시행령(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것) 제9조 제1항(현행 제13조 제1항, 제50조 참조) / [2] 행정소송법 제26조[증명책임] / [3] 구 독점규제 및 공정거래에 관한 법률(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것) 제2조 제8호(현행 제2조 제4호 참조), 제19조 제1항(현행 제40조 제1항 참조), 제22조(현행 제43조 참조), 제55조의3(현행 제102조), 구 독점규제 및 공정거래에 관한 법률 시행령(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것) 제9조 제1항(현행 제13조 제1항, 제50조 참조)",
    "참조판례": "[1] 대법원 2016. 5. 27. 선고 2013두1126 판결(공2016하, 885), 대법원 2016. 10. 27. 선고 2015두42817 판결(공2016하, 1815) / [2] 대법원 2011. 9. 8. 선고 2009두15005 판결(공2011하, 2109)",
    "판례내용": "【원고, 상고인】                주식회사 ○○○ (소송대리인 변호사 박병대 외 7인)\n【피고, 피상고인】 공정거래위원회 (소송대리인 변호사 조계창)\n【원심판결】  서울고법 2025. 3. 20. 선고 2022누39118 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 원고가 부담한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 제1, 2 상고이유에 관한 판단\n  가. 관련시장 획정과 관련매출액 산정에 관한 법령의 규정과 해석\n  1)                구 「독점규제 및 공정거래에 관한 법률」(2020. 12. 29. 법률 제17799호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법’이라 한다) 제22조 본문, 구 「독점규제 및 공정거래에 관한 법률 시행령」(2021. 12. 28. 대통령령 제32274호로 전부 개정되기 전의 것, 이하 ‘구 공정거래법 시행령’이라 한다) 제9조 제1항에 따르면, 공정거래위원회는 부당한 공동행위를 한 사업자에게 위반기간 동안 일정한 거래분야에서 판매한 관련 상품이나 용역의 매출액 또는 이에 준하는 금액인 ‘관련매출액’을 기준으로 산정한 과징금을 부과할 수 있다. 구 공정거래법 제2조 제8호는 ‘일정한 거래분야’를 ‘거래의 객체별ㆍ단계별 또는 지역별로 경쟁관계에 있거나 경쟁관계가 성립될 수 있는 분야’로 규정하고 있는데, 이는 ‘관련시장’을 의미한다.\n  2) 관련매출액 산정의 전제가 되는 ‘일정한 거래 분야에서 판매된 관련 상품’의 범위는 부당한 공동행위를 한 사업자 간의 합의 내용, 부당한 공동행위로 인하여 직접 또는 간접적으로 영향을 받는 상품의 종류와 성질, 용도 및 대체 가능성과 거래지역ㆍ거래상대방ㆍ거래단계 등을 고려하여 개별적ㆍ구체적으로 판단하여야 한다(대법원 2016. 5. 27. 선고 2013두1126 판결, 대법원 2016. 10. 27. 선고 2015두42817 판결 등 참조).\n  ‘관련시장’ 또는 ‘관련 상품’이 거래의 객체ㆍ단계 또는 지역 외에 거래상대방별로 구분되는 경우도 있을 수 있으나, 이러한 구분의 필요성이 인정되기 위해서는 거래상대방의 특성 또는 상품의 특수성에 의하여 상품, 지역 또는 거래단계별로 특정한 거래상대방집단이 존재함을 전제로 이러한 거래상대방집단들이 경쟁관계에 있지 않음이 인정되어야 한다. 이는 결국 거래상대방집단들 사이의 대체 가능성 유무를 기준으로 판단하여야 하는데, 그 판단에 있어 거래상대방집단별 상품의 가격과 특성, 거래의 구조 및 수요ㆍ공급의 탄력성, 대체 가능성에 대한 인식 및 그와 관련한 의사결정형태, 시간적ㆍ경제적ㆍ법적 측면에서 대체의 용이성 등을 종합적으로 고려하여야 한다.\n  3) 합의의 대상이 된 상품의 매출액이 위반기간 중에 발생하였다고 하더라도, 그 매출액 중 일부가 부당한 공동행위로부터 영향을 받지 않았다는 특별한 사정이 드러난다면 그 부분은 합의로 인하여 직접 또는 간접적으로 영향을 받는 상품의 매출액이라고 보기 어려우므로 ‘관련매출액’에서 제외된다(위 대법원 2013두1126 판결 참조).\n  한편 민사소송법 규정이 준용되는 행정소송에서 증명책임은 원칙적으로 민사소송의 일반원칙에 따라 당사자 간에 분배되고, 항고소송의 경우에는 그 특성에 따라 처분의 적법성을 주장하는 피고에게 그 적법사유에 관한 증명책임이 있다. 피고가 주장하는 처분의 적법성에 관하여 합리적으로 수긍할 수 있는 일응의 증명이 있는 경우 그 처분은 정당하다고 할 것이며, 이와 상반되는 주장과 증명은 상대방인 원고에게 그 책임이 돌아간다(대법원 2011. 9. 8. 선고 2009두15005 판결 등 참조).\n  나. 제1 상고이유 및 제2 상고이유 중 2016. 2. 15.부터 2017. 8. 27.까지의 유통채널 판매 아이스크림 매출액 부분에 관하여\n  원심은 판시와 같은 사정을 들어, 이 사건 공동행위의 관련시장은 ‘국내 소용량ㆍ완제품 형태의 아이스크림 판매시장’으로 획정함이 타당하고, 시판채널 시장(세부적으로 독립슈퍼, 일반식품점, 아이스크림 전문할인점) 판매 아이스크림뿐만 아니라 유통채널 시장(세부적으로 편의점, 체인슈퍼, 대형마트) 판매 아이스크림도 이 사건 공동행위의 관련 상품 범위에 포함되므로, 피고가 과징금 산정의 기초가 되는 관련매출액의 범위에 2016. 2. 15.부터 2017. 8. 27.까지의 유통채널 판매 아이스크림 매출액을 포함한 것은 적법하다는 취지로 판단하였다.\n  원심판결 이유를 앞서 본 법리와 기록에 비추어 살펴보면, 시판채널 시장 판매 아이스크림과 유통채널 시장 판매 아이스크림이 하나의 관련시장 내에 있는 관련 상품임을 전제로 한 원심의 위와 같은 판단을 충분히 수긍할 수 있고, 거기에 이 부분 상고이유 주장과 같이 관련시장 획정, 관련 상품의 판단 및 관련매출액 산정에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  다. 제2 상고이유 중 프리미엄 제품, 특정업체 특화제품, 이커머스(전자상거래) 판매제품 부분에 관하여\n  원심은 판시와 같은 사정을 들어, 프리미엄 제품, 특정업체 특화제품, 이커머스 판매제품의 매출이 이 사건 공동행위의 영향을 받지 않았다는 원고의 주장을 배척하고 위 각 제품의 매출액을 이 사건 공동행위의 ‘관련매출액’에 포함하였다. \n  앞서 본 법리와 기록에 비추어 살펴보면 원심의 위와 같은 판단을 충분히 수긍할 수 있고, 거기에 이 부분 상고이유 주장과 같이 관련 상품의 판단 및 관련매출액 산정에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  라. 제2 상고이유 중 나머지 부분에 관하여\n  원심은 판시와 같은 사정을 들어, ① 이 사건 공동행위가 개시된 2016. 2. 15. 전에 소매점 거래처와 체결한 납품계약에 따라 판매한 아이스크림 매출액, ② 2016년 말경 아이스크림 전문할인점 대상 합의가 있기 전에 아이스크림 전문할인점을 통해 판매한 아이스크림 매출액, ③ 2017년 초경 소매점 지원율 상한 제한 합의가 있기 전에 소매점을 통하여 판매한 아이스크림 매출액, ④ 2017. 3.경 대리점 초과지원율 상한 제한 합의가 있기 전에 대리점을 통해 판매한 아이스크림의 매출액, ⑤ 신규 개업한 소매점과 최초로 체결한 납품계약에 따라 해당 소매점을 통하여 판매한 아이스크림 매출액, ⑥ 소매점 지원율 상한 제한 합의 또는 대리점 지원율 상한 제한 합의를 위반하여 판매한 아이스크림 매출액은 이 사건 공동행위의 영향을 받지 않았다는 원고의 주장을 배척하고, 위 각 매출액이 이 사건 공동행위의 ‘관련매출액’에 포함된다고 판단하였다.\n  앞서 본 법리와 기록에 비추어 살펴보면 원심의 위와 같은 판단을 충분히 수긍할 수 있고, 거기에 이 부분 상고이유 주장과 같이 관련 상품의 판단 및 관련매출액 산정에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  2. 제3 상고이유에 관한 판단\n  이 부분 상고이유의 요지는, 원고가 시판채널에서의 콘류 제품 권장소비자가격 인상 합의와 유통채널에서의 편의점 샌드류 및 콘류 제품 가격 인상 합의에 가담하지 않았으며 원고의 임원 소외인이 이 사건 공동행위가 개시된 2016. 2. 15. 임원급 회합에 참석하지 않았음에도 원심이 위 각 사실을 간과한 잘못이 있다는 취지이다.\n  이러한 주장은 사실심인 원심의 전권사항에 속하는 증거의 취사선택이나 사실인정을 다투는 취지에 불과하여 적법한 상고이유에 해당하지 아니한다. 나아가 원심판결 이유를 관련 법리와 기록에 비추어 살펴보더라도, 원심의 판단에 논리와 경험의 법칙을 위반하여 자유심증주의의 한계를 벗어남으로써 판결에 영향을 미친 잘못이 없다. \n  3. 결론\n  상고를 기각하고 상고비용은 패소자가 부담하게 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오경미(재판장) 권영준 엄상필(주심) 박영재"

    "판결유형": "판결",
    "판시사항": "[1] 급식을 위탁한 주야간보호기관이 노인복지법 시행규칙 제29조 제1항 [별표 9] 제4호 (가)목 비고 7. (가)에 따라 조리원의 1인당 월 기준 근무시간을 충족하는 조리원을 배치하지 않아도 되는지 판단하는 기준 및 위 규정에 따른 ‘급식 위탁’에 해당하는지 판단하는 방법\n\n [2] 甲 협동조합이 운영하는 주야간보호 급여를 제공하는 장기요양기관인 乙 재가노인복지센터에 대하여 국민건강보험공단이 현지조사를 실시한 결과, 乙 복지센터가 조리원을 배치하지 않은 채 수급자에게 제공할 급식 식단 중 일부만을 급식위탁업체로부터 공급받아 왔고, 보조원(운전사)으로 신고된 종사자가 밥을 짓는 등 급식 관련 업무를 수행하거나, 매주 일요일에는 乙 복지센터 종사자들이 자체적으로 점심 식사를 마련하여 제공한 사실을 확인하고, 乙 복지센터가 조리원 및 보조원(운전사) 관련 인력배치기준 및 인력추가배치 가산 기준을 위반하여 급여비용과 가산금을 부당하게 지급받았다는 이유로 甲 협동조합에 장기요양급여비용 징수처분을 한 사안에서, 조리원 관련 인력배치기준 위반 및 그로 인한 인력추가배치 가산 기준 위반 부분의 처분사유를 인정하기 어렵다고 본 원심판단에 법리오해의 잘못이 있다고 한 사례",
    "판결요지": "[1] 조리원은 주야간보호기관의 필수 배치 인력으로서 해당 기관 내에서 급식과 관련된 업무를 전담하여 수행하게 되며, 인력배치기준 충족을 위한 조리원의 1인당 월 기준 근무시간은 ‘해당 월에 공휴일, 근로자의 날 및 토요일을 제외한 근무가능일수 × 8시간’이다. 한편 노인복지법 시행규칙 제29조 제1항 [별표 9] 제4호 (가)목 비고 7. (가)(이하 ‘조리원 배치 예외규정’이라 한다)는 주야간보호기관이 조리원을 배치하지 않을 수 있는 예외적인 경우를 규율하고 있다. 따라서 급식을 위탁한 주야간보호기관이 조리원 배치 예외규정에 따라 위와 같은 근무시간을 충족하는 조리원을 배치하지 않아도 되는지는, 해당 주야간보호기관에 조리원을 상시 배치하여 수급자에 대하여 장기요양서비스 및 급식을 제공하는 것과 규범적ㆍ실질적으로 동등한 수준으로 급식이 제공되었는지를 기준으로 판단해야 한다.\n  즉, 전부 위탁이 일반적인 모습이기는 하나, 주야간보호기관이 급식과 관련된 업무를 전부 위탁하지 않았다는 사정만을 들어 이를 예외 없이 조리원 배치 예외규정에 따른 ‘급식 위탁’에 해당하지 않는다고 볼 것은 아니다. 조리원 배치 예외규정에 따른 ‘급식 위탁’에 해당하는지를 판단할 때에는, 조리원이 아닌 다른 직종의 종사자들이 급식 관련 업무를 수행함에 따라 본연의 업무를 수행하는 것에 지장이 초래되었는지와 그 정도, 수급자에게 제공된 식사의 양과 품질, 위생 및 영양 상태에 미치는 영향, 일부 위탁에 관한 부득이한 사정이 존재하는지 등 여러 사정들을 종합적으로 고려하되, 규범적인 측면에서 노인장기요양보험법의 입법 목적, 장기요양기관의 법령상 인력배치기준 및 장기요양급여비용 제도의 취지, 급여비용의 가산 또는 감액산정을 위한 여러 관련 규정들의 내용 등에 반하는지도 감안하여야 한다.\n\n [2] 甲 협동조합이 운영하는 주야간보호 급여를 제공하는 장기요양기관인 乙 재가노인복지센터에 대하여 국민건강보험공단이 현지조사를 실시한 결과, 乙 복지센터가 조리원을 배치하지 않은 채 수급자에게 제공할 급식 식단 중 일부(매주 월요일부터 토요일까지 반찬과 국)만을 급식위탁업체로부터 공급받아 왔고, 보조원(운전사)으로 신고된 종사자가 수급자에게 제공할 밥을 짓는 등 급식 관련 업무를 수행하거나, 매주 일요일에는 乙 복지센터의 종사자들이 자체적으로 점심 식사를 마련하여 수급자에게 제공한 사실을 확인하고, 乙 복지센터가 조리원 및 보조원(운전사) 관련 인력배치기준 및 인력추가배치 가산 기준을 위반하여 급여비용과 가산금을 부당하게 지급받았다는 이유로 甲 협동조합에 노인장기요양보험법 제43조 제1항에 따라 장기요양급여비용 징수처분을 한 사안에서, 원심판단 중 일요일 점심 식사가 위탁공급의 대상이 되지 않았다는 이유로 조리원 관련 인력배치기준을 위반한 것으로 볼 수 없다고 한 부분은 정당하나, 조리원이 아닌 급식 관련 업무를 사실상 수행하는 직원만을 두고, 해당 직원이 수행할 수 있는 업무를 제외한 나머지 부분을 위탁한 경우에는 조리원을 상시 배치하여 급식을 제공하는 것과 동등한 수준으로 급식이 제공되었다고 규범적으로 평가할 수 없음에도, 이와 달리 조리원 관련 인력배치기준 위반 및 그로 인한 인력추가배치 가산 기준 위반 부분의 처분사유를 인정하기 어렵다고 본 부분에 법리오해의 잘못이 있다고 한 사례.",
    "참조조문": "[1] 노인복지법 제39조 제4항, 노인복지법 시행규칙 제29조 제1항 [별표 9] 제4호 (가)목 / [2] 노인장기요양보험법 제31조 제1항, 제43조 제1항, 구 노인장기요양보험법 시행규칙(2025. 2. 28. 보건복지부령 제1095호로 개정되기 전의 것) 제23조 제2항 제1호, 노인복지법 제39조 제4항, 노인복지법 시행규칙 제29조 제1항 [별표 9] 제4호 (가)목",

    "판례내용": "【원고, 피상고인】                협동조합 ○○ (소송대리인 법무법인 시우 담당변호사 최재원 외 1인)\n【피고, 상고인】 국민건강보험공단\n【원심판결】  부산고법 2024. 5. 31. 선고 2023누21792 판결         \n【주    문】\n  원심판결 중 피고 패소 부분을 파기하고, 이 부분 사건을 부산고등법원에 환송한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 다음과 같은 사실을 알 수 있다.\n  가. 원고는 울산 북구 (이하 생략)에 있는 \"△△△재가노인복지센터(이하 ‘이 사건 요양기관’이라 한다)\"를 노인장기요양보험법에 따른 장기요양기관으로 지정받아 운영한 협동조합이다.\n  나. 원고는 이 사건 요양기관을 운영하면서 노인장기요양보험법 제23조 제1항 제1호가 정한 재가급여 중 주야간보호 급여를 수급자에게 제공하고, 같은 법 제38조 제1항에 따라 피고에게 장기요양급여비용을 청구하여 이를 지급받아 왔다.\n  다. 피고는 2022. 7.경 이 사건 요양기관에 대하여 현지조사를 실시하였다. 현지조사 결과, 이 사건 요양기관이 조리원을 배치하지 않은 채 수급자에게 제공할 급식 식단 중 일부(매주 월요일부터 토요일까지 반찬과 국)만을 급식위탁업체로부터 공급받아 왔고, 보조원(운전사)으로 신고된 종사자인 소외인이 송영 업무 등을 수행하지 않고 직접 수급자에게 제공할 밥을 짓는 등 급식 관련 업무를 수행하거나, 소외인이 출근하지 않는 매주 일요일에는 이 사건 요양기관의 종사자들이 자체적으로 점심 식사를 마련하여 수급자에게 제공한 사실이 확인되었다.\n  라. 피고는, 원고가 조리원 및 보조원(운전사) 관련 인력배치기준 및 인력추가배치 가산 기준을 충족하지 못하였음에도 각 기준을 충족하였음을 전제로 급여비용과 가산금을 부당하게 지급받았다는 이유로, 노인장기요양보험법 제43조 제1항에 따라 2022. 9. 30. 원고에게 이미 지급한 장기요양급여비용 중 합계 601,000,510원에 대한 징수처분(이하 ‘이 사건 처분’이라 한다)을 하였다.\n  2. 관련 규정 및 쟁점 \n  가. 관련 규정\n  1) 노인장기요양보험법 제31조 제1항에 따르면, 장기요양기관으로 지정받아 이를 운영하려는 자는 보건복지부령으로 정하는 장기요양에 필요한 시설 및 인력을 갖추어야 하고, 그 위임에 따른 구 노인장기요양보험법 시행규칙(2025. 2. 28. 보건복지부령 제1095호로 개정되기 전의 것) 제23조 제2항 제1호는 재가급여를 제공하려는 장기요양기관의 경우 노인복지법 시행규칙 [별표 9]에 따른 시설 및 인력을 갖추어야 한다고 규정하고 있다.\n  2) 노인복지법 제39조 제4항의 위임에 따른 같은 법 시행규칙 제29조 제1항, [별표 9] 제4호 (가)목은 ‘주야간보호서비스를 제공하는 시설은 조리원을 1명 두어야 한다.’고 규정하고 있다. 한편 같은 목의 비고 중 제7호 (가)목은, ‘위와 같은 인력기준에도 불구하고 영양사 및 조리원이 소속되어 있는 업체에 급식을 위탁하는 경우에는 조리원을 두지 않을 수 있다.’고 규정하고 있다(이하 ‘이 사건 규정’이라 한다).\n  3) 노인장기요양보험법 제39조 제1항과 제3항, 같은 법 시행규칙 제32조의 위임에 따른 구 「장기요양급여 제공기준 및 급여비용 산정방법 등에 관한 고시」(2022. 9. 26. 보건복지부 고시 제2022-219호로 개정되기 전의 것, 이하 ‘이 사건 고시’라 한다)는 위와 같은 인력배치기준을 위반하여 운영된 장기요양기관에 대하여는 급여비용을 감액하고 인력추가배치 등 가산을 적용하지 않도록 규정하고 있다(제48조, 제54조 제1항 및 제3항, 제66조 제1항).\n  한편 같은 고시 제49조 제1항은 \"급여비용의 가산 또는 감액산정을 위한 근무인원 1인당 월 기준 근무시간은 [해당 월에 공휴일, 근로자의 날 및 토요일을 제외한 근무가능일수 × 8시간]으로 한다.\"라고, 제51조 제1항 본문은 \"‘근무인원 1인’으로 계산하기 위해서는 직원 1인은 휴게시간을 제외하고 제49조에 따른 월 기준 근무시간 이상 신고한 직종으로 실 근무하여야 한다.\"라고 정하고 있다.\n  나. 쟁점 \n  이 사건의 쟁점은 원고가 운영하는 이 사건 요양기관이 이 사건 규정에 따라 조리원을 배치하지 않아도 되는 경우에 해당하는지, 즉 주야간보호 급여를 제공하는 장기요양기관(이하 ‘주야간보호기관’이라 한다)인 이 사건 요양기관이 수급자에게 제공하는 급식 중 일부만을 급식위탁업체로부터 공급받고 나머지는 이 사건 요양기관에서 자체적으로 마련하여 제공한 것을 ‘영양사 및 조리원이 소속되어 있는 업체에 급식을 위탁하는 경우’로 볼 수 있는지이다.\n  3. 원심의 판단\n  원심은 다음과 같은 이유로 이 사건 처분 중 조리원 관련 인력배치기준 위반 및 그로 인한 인력추가배치 가산 기준 위반 부분은 처분사유가 인정되지 않는다고 판단한 후 이 사건 처분 중 이에 해당하는 부분을 취소하였다.\n  가. 이 사건 요양기관이 해당 월의 월요일부터 토요일까지 주 6일 동안 급식위탁업체로부터 급식을 공급받은 이상, ‘일요일에 급식위탁업체로부터 급식을 공급받지 않았다.’는 이유로 조리원 관련 인력배치기준을 위반한 것으로 평가할 수는 없다.\n  나. 이 사건 요양기관이 밥 짓기 등 급식 관련 업무만을 전담하는 직원인 소외인을 별도로 고용하여 다른 종사자들의 본연의 업무 수행에 지장을 초래하지 않으면서도, 수급자에게 양질의 식사를 제공하였던 등의 특별한 사정이 인정된다. 따라서 이 사건 요양기관이 매주 월요일부터 토요일까지 급식위탁업체로부터 반찬과 국만 공급받았다는 이유로 조리원 관련 인력배치기준을 위반한 것으로 평가할 수도 없다.\n  4. 대법원의 판단 \n  가. 조리원은 주야간보호기관의 필수 배치 인력으로서 해당 기관 내에서 급식과 관련된 업무를 전담하여 수행하게 되며, 인력배치기준 충족을 위한 조리원의 1인당 월 기준 근무시간은 ‘해당 월에 공휴일, 근로자의 날 및 토요일을 제외한 근무가능일수 × 8시간’이다. 한편 이 사건 규정은 주야간보호기관이 조리원을 배치하지 않을 수 있는 예외적인 경우를 규율하고 있다. 따라서 급식을 위탁한 주야간보호기관이 이 사건 규정에 따라 위와 같은 근무시간을 충족하는 조리원을 배치하지 않아도 되는지 여부는, 해당 주야간보호기관에 조리원을 상시 배치하여 수급자에 대하여 장기요양서비스 및 급식을 제공하는 것과 규범적ㆍ실질적으로 동등한 수준으로 급식이 제공되었는지 여부를 기준으로 판단하여야 한다.\n  즉, 전부 위탁이 일반적인 모습이기는 하나, 주야간보호기관이 급식과 관련된 업무를 전부 위탁하지 아니하였다는 사정만을 들어 이를 예외 없이 이 사건 규정에 따른 ‘급식 위탁’에 해당하지 않는다고 볼 것은 아니다. 이 사건 규정에 따른 ‘급식 위탁’에 해당하는지를 판단함에는, 조리원이 아닌 다른 직종의 종사자들이 급식 관련 업무를 수행함에 따라 본연의 업무를 수행하는 것에 지장이 초래되었는지 여부와 그 정도, 수급자에게 제공된 식사의 양과 품질, 위생 및 영양 상태에 미치는 영향, 일부 위탁에 관한 부득이한 사정이 존재하는지 여부 등 여러 사정들을 종합적으로 고려하되, 규범적인 측면에서 노인장기요양보험법의 입법 목적, 장기요양기관의 법령상 인력배치기준 및 장기요양급여비용 제도의 취지, 급여비용의 가산 또는 감액산정을 위한 여러 관련 규정들의 내용 등에 반하는지 여부도 감안하여야 한다.\n  나. 이 사건 요양기관이 조리원으로 신고된 종사자를 배치하지 않은 채, 문제 되는 기간 중 매주 월요일부터 토요일까지 수급자에게 제공될 급식 식단 중 ‘밥’을 위탁공급의 대상에서 제외하였고, 일요일 점심 식사 전부를 자체적으로 마련한 사실은 앞서 인정한 바와 같다.\n  1) 먼저 일요일 점심 식사가 위탁공급의 대상이 되지 않은 사정을 들어 이 사건 요양기관이 조리원 관련 인력배치기준을 위반하였다고 볼 수 있는지에 관하여 살펴본다.\n  이 사건 고시 제51조 제1항에도 불구하고 조리원이 부재하는 예외적인 경우 다른 직원이 그 업무 중 일부만을 수행하는 것은 가능하다(같은 조 제2항). 이 사건 요양기관에 조리원이 배치된 경우, 이 사건 고시 제49조 제1항에 따라 월 기준 근무시간의 산정에 포함되지 않을 수 있는 공휴일인 일요일에 조리원이 부재하여 다른 직종의 종사자들이 급식 관련 업무를 일부 수행하였다고 하여 관련 규정을 위반한 것으로 볼 수는 없다. 그러므로 급식을 위탁하였다는 사정만을 들어 이를 달리 평가하기는 어렵다.\n  같은 취지의 원심판단은 정당하고, 상고이유 주장과 같은 이 사건 규정에 관한 법리를 오해한 잘못이 없다.\n  2) 다음으로 이 사건 요양기관이 수급자에게 제공될 급식 식단 중 일부인 ‘밥’을 위탁공급 대상에서 제외하고, 이를 보조원(운전사)으로 신고된 종사자인 소외인으로 하여금 수급자에게 정기적ㆍ계속적으로 제공하게 한 부분에 관하여 살펴본다.\n  가) 급식을 위탁하더라도 조리원을 별도로 채용하고 있는 상황에서 해당 조리원이 수행할 수 있는 업무를 제외한 나머지 부분은 위탁할 수 있다. 한편 이 사건 규정이 주야간보호기관이 조리원을 배치하지 않을 수 있는 예외적인 경우를 규율하고 있다는 점을 감안하면, 주야간보호기관이 이 사건 고시 제49조 제1항이 정한 시간보다 적은 시간을 근무하는 조리원을 채용하고 해당 조리원이 수행할 수 있는 업무를 제외한 나머지 부분을 위탁한 경우 조리원을 상시 배치하여 급식을 제공하는 것과 동등한 수준으로 급식이 제공되었다고 볼 여지가 크다.\n  나) 그러나 이와 달리 조리원이 아닌 급식 관련 업무를 사실상 수행하는 직원만을 두고, 해당 직원이 수행할 수 있는 업무를 제외한 나머지 부분을 위탁한 경우에는 조리원을 상시 배치하여 급식을 제공하는 것과 동등한 수준으로 급식이 제공되었다고 규범적으로 평가할 수 없다.\n  앞서 살핀 이 사건 고시의 각 규정은 각 업무분야에 필요한 전문 종사자들로 하여금 본연의 업무에 집중하도록 하여 인력배치기준 제도의 취지를 구체적으로 실현하고, 요양보호사 등 돌봄 인력에게 수급자에 대한 직접적인 돌봄과 요양 업무만을 전담하게 하여 업무능력의 고취 및 장기요양서비스 품질 제고라는 목적을 달성하기 위한 것이다. 그런데 사실상 수행한 업무를 기준으로 인력배치기준의 충족 여부를 가리는 것은 이러한 취지에 부합하지 않고, 오히려 실제 수행한 업무 내용에 대한 검증을 곤란하게 하며, 탈법수단으로 악용될 가능성을 더할 뿐이기 때문이다.\n  다) 그런데도 원심은, 이 사건 요양기관이 급식 관련 업무만을 전담하는 직원인 소외인을 별도로 고용하였고, 수급자에게 양질의 급식이 제공된 것으로 보인다는 이유로 이 사건 처분 중 조리원 관련 인력배치기준 위반 및 그로 인한 인력추가배치 가산 기준 위반으로 인한 부분은 그 처분사유를 인정하기 어렵다고 판단하였다. 원심의 이러한 판단에는 노인장기요양보험법상 장기요양기관의 법령상 인력배치기준 및 이 사건 규정의 의미에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이를 지적하는 피고의 이 부분 상고이유 주장은 이유 있다.\n  다. 파기의 범위\n  피고의 상고이유 주장은 앞서 인정한 범위 내에서만 정당하다. 그렇다고 하더라도 원고가 이 사건 요양기관에 조리원을 배치하지 않았고 원고의 급식 위탁이 조리원을 상시 배치한 경우와 동등한 수준이라고 평가할 수도 없는 이상, 원고는 문제 되는 기간 전부에 관하여 조리원 관련 인력배치기준 및 인력추가배치 가산 기준을 위반한 셈이 된다. 그럼에도 원심은 이와 다른 전제에서 이 사건 처분 중 조리원 관련 인력배치기준 및 인력추가배치 가산 기준 위반으로 인한 부분을 모두 취소하였으므로, 원심으로 하여금 이 부분을 다시 심리ㆍ판단하도록 원심판결 중 피고의 패소 부분 전부를 파기하기로 한다.\n  5. 결론 \n  원심판결 중 피고 패소 부분을 파기하고, 이 부분 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 노태악(재판장) 서경환 신숙희(주심) 마용주"

    "판시사항": "[1] 근로자가 정신질환 등에 관하여 별도의 진단을 받지 않은 채 업무상의 사유로 인한 정신적 이상 상태에서 한 자해행위로 사망하거나 부상ㆍ질병ㆍ장해를 입은 경우, 유족급여를 비롯한 보험급여의 산정기준이 되는 평균임금 산정사유 발생일인 ‘사망 또는 부상의 원인이 되는 사고가 발생한 날’의 의미(=자해행위를 한 날)\n\n [2] 업무상 재해를 입은 근로자가 실제로 치료 등 요양을 받지 못했지만, 객관적으로 요양을 위하여 휴업을 할 필요가 있었던 경우, 그에 따른 임금 감소 기간은 평균임금의 산정기간에서 제외되는지 여부(적극) / 이때 요양을 위하여 휴업이 필요했는지 판단하는 방법 / 이러한 법리는 업무상의 사유로 인한 정신적 이상 상태에서 자해행위를 한 경우에도 마찬가지인지 여부(적극)",
    "판결요지": "[1] 산업재해보상보험법 제5조 제2호, 제37조 제1항 본문, 제2항, 제62조, 제71조, 산업재해보상보험법 시행령(이하 ‘산재보험법 시행령’이라 한다) 제36조, 근로기준법 제2조 제1항 제6호, 근로기준법 시행령 제52조의 문언, 내용과 취지 등을 종합하면, 근로자가 정신질환 등에 관하여 별도의 진단을 받지 않은 채 업무상의 사유로 인한 정신적 이상 상태에서 한 자해행위로 사망하거나 부상ㆍ질병ㆍ장해를 입은 경우, 근로기준법 시행령 제52조에 따라 유족급여를 비롯한 보험급여의 산정기준이 되는 평균임금 산정사유 발생일인 ‘사망 또는 부상의 원인이 되는 사고가 발생한 날’은 특별한 사정이 없는 한 정신적 이상 상태에 빠졌을 것으로 추정되는 시점이 아니라 자해행위를 한 날을 의미한다. 이유는 다음과 같다. \n  ① 근로기준법 시행령 제52조는 업무상의 사유로 발생한 정신질환과 같은 업무상 질병에 관하여 그 발병일을 명확히 특정하기 어려운 점을 고려하여 ‘진단에 따라 질병이 발생되었다고 확정된 날’을 평균임금 산정사유 발생일로 규정하고 있다. 따라서 업무상의 사유로 발생한 정신질환으로 치료를 받았거나 받고 있는 근로자가 정신적 이상 상태에서 자해행위를 한 경우(산재보험법 시행령 제36조 제1호), 근로자가 정신질환에 관하여 진단을 받았다면, 평균임금 산정사유 발생일은 원칙적으로 진단일로 보아야 하고, 정신질환이 발생하였을 것으로 추정되는 시점을 ‘사망 또는 부상의 원인이 되는 사고가 발생한 날’로서 평균임금 산정사유 발생일이라고 보기 어렵다. \n  ② 근로자가 업무상의 사유로 인한 정신적 이상 상태에서 자해행위를 하였으나(산재보험법 시행령 제36조 제3호), 정신적 이상 상태에 관하여 진단을 받지 않은 경우는, 정신적 이상 상태에 빠졌을 것으로 추정되는 시점을 ‘사망 또는 부상의 원인이 되는 사고가 발생한 날’로 볼 것은 아니다. 이 경우 자해행위를 사망 또는 부상의 원인이 된 사고로 볼 수 있으므로, 특별한 사정이 없는 한 자해행위를 한 날을 ‘사망 또는 부상의 원인이 되는 사고가 발생한 날’로서 평균임금 산정사유 발생일로 보아야 한다. \n\n [2] 평균임금의 계산에서 제외되는 기간과 임금과 관련하여 근로기준법 시행령은 제2조 제1항에서 \"법 제78조에 따라 업무상 부상 또는 질병으로 요양하기 위하여 휴업한 기간\"(제4호) 등의 일정한 기간과 그 기간 중에 지급된 임금을 평균임금의 산정기간과 임금 총액에서 제외한다고 규정하고 있다. 업무상 재해를 입은 근로자가 치료 등 요양을 실제로 받지 못했다 하더라도, 객관적으로 요양을 위하여 휴업을 할 필요가 있었다면, 그에 따라 임금이 감소한 기간은 근로기준법 시행령 제2조 제1항 제4호에서 정한 \"법 제78조에 따라 업무상 부상 또는 질병으로 요양하기 위하여 휴업한 기간\"에 해당하여 평균임금의 산정기간에서 제외된다. 이때 요양을 위하여 휴업이 필요했는지는 업무상 부상과 질병 등의 정도, 업무상 부상과 질병 등의 치료에 필요했던 과정 및 방법, 업무의 내용과 강도, 근로자의 용태 등 객관적인 사정을 종합하여 판단해야 한다. 이러한 법리는 업무상의 사유로 인한 정신적 이상 상태에서 자해행위를 한 경우에도 마찬가지이다.",
    "참조조문": "[1] 산업재해보상보험법 제5조 제2호, 제37조 제1항, 제2항, 제62조, 제71조, 산업재해보상보험법 시행령 제36조, 근로기준법 제2조 제1항 제6호, 근로기준법 시행령 제52조 / [2] 근로기준법 제2조 제1항 제6호, 제78조, 근로기준법 시행령 제2조 제1항 제4호, 산업재해보상보험법 제37조 제2항, 산업재해보상보험법 시행령 제36조",

    "판례내용": "【원고, 피상고인】                원고            \n【피고, 상고인】 근로복지공단\n【원심판결】  광주고법 2024. 12. 19. 선고 2024누11401 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 피고가 부담한다. \n\n【이    유】  1. 사안의 개요 \n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 따르면, 다음과 같은 사실을 알 수 있다.  \n  가. 망 소외 1(이하 ‘망인’이라고 한다)은 유한회사 ○○운수(이하 ‘소외 2 회사’라고 한다)에서 2019. 6. 1.부터 기간제 버스운전원으로 근무하다가 2021. 6. 1.부터 정규직 버스운전원으로 근무하였다.\n  나. 망인은 2021. 6. 9.부터 2021. 6. 11.까지 사이에 버스 운행 중 4차례의 사고를 겪었다. 망인은 소외 2 회사의 사고담당자로부터 사고 건수가 회사에 보고될 것이라는 취지의 말을 들은 후 망인의 사비로 피해자들에게 치료비 등을 지급하기로 합의하였다. \n  다. 망인은 2021. 6. 12. 무렵 가출하여 연락이 두절된 채 출근하지 않았고 2021. 6. 18. 무렵 자살하였다.\n  라. 소외 2 회사는 버스운전원의 근무일수에 따라 임금을 지급하는데, 결근기간을 제외한 망인의 2021년 6월분 임금은 1,187,654원이다. \n  마. 피고는 2022. 1. 25. ‘망인이 경제적으로 어려운 상황에서 4차례 사고의 비용처리 문제, 인사상 불이익 염려 등에 따른 업무상 스트레스로 인한 정신적 이상 상태에서 자해행위를 한 것으로 인정된다.’라는 이유로, 망인의 사망이 업무상 재해에 해당한다고 판정하였다. \n  바. 피고는 2022. 3. 30. 아래와 같은 이유로 망인의 1일 평균임금이 88,216원이라고 보아 이를 기준으로 망인의 배우자인 원고에게 유족급여와 장례비를 지급하기로 결정하였다(이하 ‘이 사건 처분’이라고 한다).\n  1) 평균임금 산정사유 발생일은 망인의 사망일인 2021. 6. 18.이다. \n  2) 평균임금 산정기간은 망인의 정규직 취업기간인 2021. 6. 1.부터 2021. 6. 17.까지 17일이다. \n  3) 따라서 망인의 1일 평균임금은 69,862원(= 1,187,654원 ÷ 17일)이나, 이는 1일 통상임금 88,216원보다 낮으므로 88,216원을 망인의 1일 평균임금으로 적용한다.\n  2. 제1, 2 상고이유에 대하여  \n  가. 관련 법리\n  1) 산업재해보상보험법(이하 ‘산재보험법’이라고 한다) 제37조 제1항 본문은 업무상의 재해를 업무상 사고, 업무상 질병, 출퇴근 재해로 구분하고, 제37조 제2항은 \"근로자의 고의ㆍ자해행위나 범죄행위 또는 그것이 원인이 되어 발생한 부상ㆍ질병ㆍ장해 또는 사망은 업무상의 재해로 보지 아니한다. 다만 그 부상ㆍ질병ㆍ장해 또는 사망이 정상적인 인식능력 등이 뚜렷하게 낮아진 상태에서 한 행위로 발생한 경우로서 대통령령으로 정하는 사유가 있으면 업무상의 재해로 본다.\"라고 규정한다. 산업재해보상보험법 시행령(이하 ‘산재보험법 시행령’이라고 한다) 제36조는 산재보험법 제37조 제2항 단서에서 말하는 ‘대통령령으로 정하는 사유’로, 업무상의 사유로 발생한 정신질환으로 치료를 받았거나 받고 있는 사람이 정신적 이상 상태에서 자해행위를 한 경우(제1호), 업무상의 재해로 요양 중인 사람이 그 업무상의 재해로 인한 정신적 이상 상태에서 자해행위를 한 경우(제2호), 그 밖에 업무상의 사유로 인한 정신적 이상 상태에서 자해행위를 하였다는 상당인과관계가 인정되는 경우(제3호)를 정하고 있다. \n  산재보험법상 유족급여, 장례비 등은 근로기준법에 따른 평균임금을 기준으로 산정된다(제5조 제2호, 제62조, 제71조 등). 평균임금에 관하여 근로기준법 제2조 제1항 제6호는 ‘이를 산정하여야 할 사유가 발생한 날 이전 3개월 동안에 그 근로자에게 지급된 임금의 총액을 그 기간의 총일수로 나눈 금액’으로 규정한다. 나아가 근로기준법 시행령 제52조는 재해보상을 하는 경우 ‘사망 또는 부상의 원인이 되는 사고가 발생한 날 또는 진단에 따라 질병이 발생되었다고 확정된 날’을 평균임금 산정사유 발생일로 규정하고 있다. \n  위와 같은 관련 법령의 문언, 내용과 취지 등을 종합하여 보면, 근로자가 정신질환 등에 관하여 별도의 진단을 받지 않은 채 업무상의 사유로 인한 정신적 이상 상태에서 한 자해행위로 사망하거나 부상ㆍ질병ㆍ장해를 입은 경우, 근로기준법 시행령 제52조에 따라 유족급여를 비롯한 보험급여의 산정기준이 되는 평균임금 산정사유 발생일인 ‘사망 또는 부상의 원인이 되는 사고가 발생한 날’은 특별한 사정이 없는 한 정신적 이상 상태에 빠졌을 것으로 추정되는 시점이 아니라 자해행위를 한 날을 의미한다. 그 이유는 다음과 같다. \n  가)                근로기준법 시행령 제52조는 업무상의 사유로 발생한 정신질환과 같은 업무상 질병에 관하여 그 발병일을 명확히 특정하기 어려운 점을 고려하여 ‘진단에 따라 질병이 발생되었다고 확정된 날’을 평균임금 산정사유 발생일로 규정하고 있다. 따라서 업무상의 사유로 발생한 정신질환으로 치료를 받았거나 받고 있는 근로자가 정신적 이상 상태에서 자해행위를 한 경우(산재보험법 시행령 제36조 제1호), 근로자가 정신질환에 관하여 진단을 받았다면, 평균임금 산정사유 발생일은 원칙적으로 진단일로 보아야 하고, 정신질환이 발생하였을 것으로 추정되는 시점을 ‘사망 또는 부상의 원인이 되는 사고가 발생한 날’로서 평균임금 산정사유 발생일이라고 보기 어렵다. \n  나) 근로자가 업무상의 사유로 인한 정신적 이상 상태에서 자해행위를 하였으나(산재보험법 시행령 제36조 제3호), 정신적 이상 상태에 관하여 진단을 받지 않은 경우는, 정신적 이상 상태에 빠졌을 것으로 추정되는 시점을 ‘사망 또는 부상의 원인이 되는 사고가 발생한 날’로 볼 것은 아니다. 이 경우 자해행위를 사망 또는 부상의 원인이 된 사고로 볼 수 있으므로, 특별한 사정이 없는 한 자해행위를 한 날을 ‘사망 또는 부상의 원인이 되는 사고가 발생한 날’로서 평균임금 산정사유 발생일로 보아야 한다. \n  2) 평균임금의 계산에서 제외되는 기간과 임금과 관련하여 근로기준법 시행령은 제2조 제1항에서 \"법 제78조에 따라 업무상 부상 또는 질병으로 요양하기 위하여 휴업한 기간\"(제4호) 등의 일정한 기간과 그 기간 중에 지급된 임금을 평균임금의 산정기간과 임금 총액에서 제외한다고 규정하고 있다. 업무상 재해를 입은 근로자가 치료 등 요양을 실제로 받지 못하였다 하더라도, 객관적으로 요양을 위하여 휴업을 할 필요가 있었다면, 그에 따라 임금이 감소한 기간은 근로기준법 시행령 제2조 제1항 제4호에서 정한 \"법 제78조에 따라 업무상 부상 또는 질병으로 요양하기 위하여 휴업한 기간\"에 해당하여 평균임금의 산정기간에서 제외된다. 이때 요양을 위하여 휴업이 필요하였는지는 업무상 부상과 질병 등의 정도, 업무상 부상과 질병 등의 치료에 필요하였던 과정 및 방법, 업무의 내용과 강도, 근로자의 용태 등 객관적인 사정을 종합하여 판단하여야 한다. 이러한 법리는 업무상의 사유로 인한 정신적 이상 상태에서 자해행위를 한 경우에도 마찬가지이다. 그 이유는 다음과 같다. \n  가) 평균임금에 관하여 근로기준법 제2조 제1항 제6호가 산정사유 발생일 이전 3개월 동안의 임금총액을 기준으로 할 것을 원칙으로 명시한 것은 일반적으로 그러한 산정 방법이 산정사유 발생 당시 근로자의 통상적인 생활임금을 가장 정확하게 반영하기 때문이다. 그러나 이를 획일적으로 적용하면 근로자의 통상적인 생활임금을 사실대로 반영하지 못하거나 근로자에게 가혹한 결과를 초래할 수 있으므로, 근로기준법 시행령 제2조 제1항은 이에 대한 예외를 두고 있다. 이는 근로자의 임금 감소가 예상되는 기간 중 특별히 근로자의 권리행사 보장이 필요하거나 근로자에게 책임이 있다고 보기 어려운 경우에 한하여 예외적으로 평균임금 산정기간에서 제외하도록 함으로써, 평균임금 산정에 관한 원칙과 근로자 이익 보호 사이의 조화를 실현하고자 한 것이다(대법원 2009. 5. 28. 선고 2006다17287 판결, 대법원 2019. 6. 13. 선고 2015다65561 판결 등 참조). \n  나) 근로기준법 시행령 제2조 제1항 제4호가 \"법 제78조에 따라 업무상 부상 또는 질병으로 요양하기 위하여 휴업한 기간\"을 평균임금 산정기간에서 제외한 것 역시, 근로자가 업무상 재해로 노동력을 상실하여 임금을 제대로 받지 못함에도, 그로 인한 임금 감소 기간을 포함하여 평균임금을 산정하는 것은 근로자의 통상적인 생활임금을 사실대로 반영하지 못할 뿐만 아니라 근로자의 이익 보호에 적당하지 않기 때문이다. \n  다) 근로자가 업무상의 사유로 부상을 당하거나 질병에 걸리면, 사용자는 그 비용으로 필요한 요양을 행하거나 필요한 요양비를 부담하여야 하고(근로기준법 제78조 제1항), 근로자로 하여금 지체 없이 의사의 진단을 받도록 하는 등(근로기준법 시행령 제44조 제2항) 업무상 재해를 입은 근로자에게 필요한 요양을 지체 없이 행할 의무가 있다. 그럼에도 근로자가 정신적 이상 상태에 있거나 그 밖에 근로자에게 책임이 있다고 보기 어려운 사유로 의사의 진단은 물론 치료를 받지 못한 채 정상적인 근로를 제공하지 못하여 임금이 감소한 경우가 있을 수 있다. 이러한 경우 근로자가 치료 등 요양을 실제로 받지 않았다는 이유를 들어 그 임금 감소 기간을 평균임금 산정기간에 포함시키는 것은 근로자 이익 보호의 정신뿐만 아니라 근로자의 생활임금을 사실대로 반영함으로써 통상적인 생활수준을 보장하려는 평균임금 제도의 취지에도 반한다. \n  라) 따라서 업무상 재해를 입은 근로자가 실제로 치료 등 요양을 받지 못하였다 하더라도 객관적으로 요양을 위하여 휴업을 할 필요가 있었다면, 그에 따른 임금 감소 기간은 근로기준법 시행령 제2조 제1항 제4호에서 정한 \"법 제78조에 따라 업무상 부상 또는 질병으로 요양하기 위하여 휴업한 기간\"에 해당하여 평균임금의 산정기간에서 제외된다고 봄이 타당하다. \n  나. 판단 \n  1) 앞서 본 사실관계를 위와 같은 법리에 비추어 살펴본다. \n  가) 망인은 업무상의 사유로 정신적 이상 상태에 빠졌으나, 그에 관하여 치료를 받거나 진단을 받지 않았다. 망인이 정신적 이상 상태에 빠졌다는 것 자체를 두고 바로 ‘사고’가 발생한 것으로 보기 어렵고, 망인은 2021. 6. 9.부터 2021. 6. 11.까지 사이에 버스 운행 중 4차례의 사고를 겪었는데, 그중 어느 사고로 인하여 어떤 시점에 정신적 이상 상태에 빠졌는지를 명확히 확정할 수도 없다. \n  따라서 유족급여 등의 산정기준이 되는 평균임금 산정사유 발생일은 자해행위를 한 날인 2021. 6. 18.로 보아야 한다. 이와 달리 원심이 망인의 가출일인 2021. 6. 12. 무렵 정신적 이상 상태에 빠진 것으로 추정된다는 이유를 들어 위 가출일을 평균임금 산정사유 발생일로 본 것은 적절하지 않다. \n  나) 그러나 한편 ① 망인은 정규직이 된 후 얼마 되지 않아 버스를 운행하던 중 4차례의 사고를 겪고, 그로 인한 인사상 불이익에 대한 우려와 사고처리 비용에 대한 경제적 압박 등으로 인하여 극도의 업무상 스트레스를 받았던 것으로 보인다. ② 망인은 2021. 6. 12. 무렵 연락이 두절된 채 무단결근하였고, 그로부터 불과 6일 후인 2021. 6. 18. 자해행위로 사망하였다. ③ 피고도 망인이 업무상 스트레스로 인한 정신적 이상 상태에서 자해행위를 하였다고 인정하였다. 이러한 사정을 고려하면, 망인은 늦어도 2021. 6. 12. 무렵 이미 업무상 스트레스로 정상적인 인식능력이 뚜렷하게 낮아진 상태에서 버스 운행 업무를 제대로 수행할 수 없었고, 객관적으로 요양을 위하여 휴업을 할 필요가 있었다고 판단된다. \n  따라서 2021. 6. 12.부터 평균임금 산정사유 발생일 전일인 2021. 6. 17.까지 무단결근으로 인한 임금 감소 기간은 근로기준법 시행령 제2조 제1항 제4호에서 정한 기간에 해당하여 평균임금 산정기간에서 제외되어야 한다. 그런데도 이와 달리 피고가 이 사건 처분 당시 위 기간을 포함하여 평균임금을 산정한 것은 위법하다.\n  2) 결국 평균임금 산정사유 발생일에 관한 원심의 이유 설시는 적절하지 않으나, 이 사건 처분이 위법하다는 원심의 결론은 정당하고, 거기에 상고이유 주장과 같이 평균임금 산정방법 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  3. 제3 상고이유에 대하여\n  원심은 판시와 같은 이유로, 기간제 근로기간을 포함하여 망인의 평균임금을 산정하여야 한다고 판단하였다.\n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 원심의 이유 설시에 다소 충분하지 못한 부분이 있으나, 위와 같은 원심판단은 수긍할 수 있고, 거기에 평균임금 산정기간 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  4. 결론\n  상고를 기각하고 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 엄상필(재판장) 오경미(주심) 권영준 박영재"

    "판례내용": "【원고, 상고인】                원고 1 외 2인 (소송대리인 법무법인(유한) 화우 담당변호사 이인복 외 3인)\n【피고, 피상고인】 인제군수 (소송대리인 변호사 임미선)\n【피고보조참가인】                피고보조참가인 (소송대리인 법무법인 대화 담당변호사 이형찬 외 1인)\n【원심판결】  서울고법 2025. 4. 23. 선고 (춘천)2024누995 판결         \n【주    문】\n  상고를 모두 기각한다.  상고비용은 보조참가로 인한 부분을 포함하여 원고들이 부담한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 상고이유 보충서의 기재는 상고이유를 보충하는 범위 내에서)를 판단한다.\n  1. 원심의 판단 \n  원심은 아래와 같은 이유로 이 사건 사업은 소규모 환경영향평가 대상에 해당하지 아니하므로 이 사건 건축허가 및 변경허가 처분에 소규모 환경영향평가 절차를 누락한 하자가 없다고 판단하였다. \n  가. 환경영향평가법 제43조 제1항, 같은 법 시행령 제59조 [별표 4](이하 ‘이 사건 별표’라 한다) 제1호 (나)목 및 비고 제7호에 의하면, 「국토의 계획 및 이용에 관한 법률」(이하 ‘국토계획법’이라 한다)에 따른 계획관리지역에서 ‘사업계획 면적’이 10,000㎡ 이상인 경우 또는 「가축분뇨의 관리 및 이용에 관한 법률」(이하 ‘가축분뇨법’이라 한다) 제2조 제3호 및 제8호에 따른 ‘가축분뇨의 배출시설 및 처리시설 면적’의 합계가 5,000㎡ 이상인 경우에는 소규모 환경영향평가 대상에 해당한다. \n  나. 국토계획법상 계획관리지역에서 가축분뇨 배출시설 및 처리시설을 건축하는 이 사건 사업의 경우, 이 사건 건축허가 및 변경허가를 받은 면적이 최종적으로 9,550㎡로 ‘사업계획 면적’이 10,000㎡ 미만이므로, 이 사건 별표 제1호 (나)목에 따른 소규모 환경영향평가 대상에 해당하지 않는다. \n  다. 이 사건 별표 비고 제7호에서 정한 ‘가축분뇨의 배출시설 및 처리시설 면적’은 건축허가 및 변경허가를 받은 ‘사업계획 면적’이 아니라 가축분뇨법령상 가축분뇨의 배출시설 및 처리시설 자체만의 면적으로 해석함이 타당하고, 최종적으로 변경된 허가 내용상 이 사건 사업으로 설치되는 가축분뇨 배출시설 및 처리시설 면적의 합계는 4,615.88㎡로 5,000㎡에 미달하므로, 이 사건 별표 비고 제7호에 따른 소규모 환경영향평가 대상에도 해당하지 않는다. \n  2. 대법원의 판단 \n  가. 법령의 해석은 어디까지나 법적 안정성을 해치지 않는 범위 내에서 구체적 타당성을 찾는 방향으로 이루어져야 한다. 이를 위해서는 가능한 한 원칙적으로 법령에 사용된 문언의 통상적인 의미에 충실하게 해석하고, 나아가 당해 법령의 입법 취지와 목적, 그 제·개정 연혁, 법질서 전체와의 조화, 다른 법령과의 관계 등을 고려하는 체계적·논리적 해석방법을 추가적으로 동원함으로써, 위와 같은 타당성 있는 법령 해석의 요청에 부응하여야 한다(대법원 2012. 7. 5. 선고 2011두19239 전원합의체 판결 등 참조).\n  나. 원심판결 이유를 관련 법령의 규정과 위 법리 및 기록에 비추어 보면, 이 사건 별표 비고 제7호에서 정한 ‘가축분뇨의 배출시설 및 처리시설 면적’을 가축분뇨법령상 가축분뇨의 배출시설 및 처리시설의 면적으로 해석한 원심의 판단은 위 법리에 따른 것으로 정당하고, 거기에 상고이유 주장과 같이 이 사건 별표 비고 제7호에서 정한 ‘가축분뇨의 배출시설 및 처리시설 면적’의 의미 및 범위, 환경영향평가법령에 관한 법리를 오해하거나 필요한 심리를 다하지 않음으로써 판결에 영향을 미친 잘못이 없다. 원고들이 상고이유서에서 인용한 대법원 2020. 7. 23. 선고 2019두31839 판결은 이 사건 별표 제1호 (다)목에서 정한 ‘사업계획 면적’의 해석에 관한 것으로서, 이 사건과 사안을 달리하여 원용하기에 적절하지 않다. \n  3. 결론\n  그러므로 상고를 모두 기각하고 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 권영준(재판장) 오경미 엄상필 박영재(주심)"
  },

    "판결유형": "판결",
    "판시사항": "근로자가 부당해고 구제신청을 할 당시 이미 정년에 이르거나 근로계약기간 만료, 폐업 등의 사유로 근로계약관계가 종료하여 근로자의 지위에서 벗어난 경우, 노동위원회의 구제명령을 받을 이익 및 재심판정의 취소를 구할 소의 이익이 있는지 여부(소극)",
    "판결요지": "근로자가 부당해고 구제신청을 할 당시 이미 정년에 이르거나 근로계약기간 만료, 폐업 등의 사유로 근로계약관계가 종료하여 근로자의 지위에서 벗어난 경우에는 노동위원회의 구제명령을 받을 이익이 소멸했다고 보는 것이 타당하다. 그와 같이 구제명령을 받을 이익이 소멸했다면, 재심판정을 취소하더라도 노동위원회로서는 다시 구제명령을 할 수 없으므로, 근로자로서는 다른 특별한 사정이 없는 한 재심판정의 취소를 구할 소의 이익이 없다.",
    "참조조문": "행정소송법 제12조, 근로기준법 제28조, 제30조",
    "참조판례": "대법원 2022. 7. 14. 선고 2020두54852 판결(공2022하, 1681)",
    "판례내용": "【원고, 피상고인】                원고            \n【피고, 상고인】 중앙노동위원회위원장\n【피고보조참가인】                피고보조참가인 (소송대리인 법무법인 저스티스 담당변호사 박항규)\n【원심판결】  대전고법 2025. 2. 6. 선고 2024누12793 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 대전고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요 및 소송의 경과 \n  가. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 따르면, 다음 사실을 알 수 있다.\n  1) 피고보조참가인(이하 ‘참가인’이라 한다)은 2022. 12. 16. 그 근로자인 원고에게 근로계약기간이 2022. 12. 31. 자로 만료된다고 통보(이하 ‘이 사건 통보’라 한다)하였다.\n  2) 원고는 2023. 1. 14.경 퇴직금 수령에 필요한 서류를 작성하면서, 그와 함께 \"본인은 2022. 12. 31.부로 계약기간 만료에 의해 퇴직 처리됨에 이의 없음을 확인합니다.\"라는 등의 내용이 기재된 사직서(이하 ‘이 사건 사직서’라 한다)에도 서명하여 이를 참가인에게 제출하였다. \n  3) 원고는 이 사건 통보가 부당해고라고 주장하며 2023. 1. 19. 충남지방노동위원회에 구제신청을 하였다. 충남지방노동위원회는 2023. 3. 13. 원고의 구제신청을 기각하였고, 피고도 2023. 6. 13. 원고의 재심신청을 기각하였다(이하 ‘이 사건 재심판정’이라 한다).\n  나. 소송의 경과 \n  1) 제1심은, 원고가 2022. 12. 31.경 참가인의 사직서 작성 요구를 거절하였고, 퇴직금 수령을 위한 서류를 작성하면서 그중 이 사건 사직서가 포함되어 있다는 사실을 알지 못한 것으로 보이는 점 등을 고려할 때, 이 사건 사직서의 제출 사실만으로는 원고가 사직의 의사표시를 하였다고 볼 수 없다고 판단한 후, 이 사건 통보가 부당해고에 해당한다고 보아, 원고의 이 사건 재심판정 취소청구를 인용하였다.\n  2) 원심은, 제1심과 달리 원고가 이 사건 사직서를 제출함으로써 사직의 의사를 표시하여 참가인과의 근로관계가 종료되었다고 판단하면서도, 이 사건 통보가 부당해고에 해당한다는 이유로, 이 사건 재심판정을 취소한 제1심판결을 유지하였다. \n  2. 구제명령을 받을 이익과 소의 이익에 관한 판단(참가인의 제1 상고이유) \n  가. 근로자가 부당해고 구제신청을 할 당시 이미 정년에 이르거나 근로계약기간 만료, 폐업 등의 사유로 근로계약관계가 종료하여 근로자의 지위에서 벗어난 경우에는 노동위원회의 구제명령을 받을 이익이 소멸하였다고 보는 것이 타당하다(대법원 2022. 7. 14. 선고 2020두54852 판결 등 참조). 그와 같이 구제명령을 받을 이익이 소멸하였다면, 재심판정을 취소하더라도 노동위원회로서는 다시 구제명령을 할 수 없으므로, 근로자로서는 다른 특별한 사정이 없는 한 재심판정의 취소를 구할 소의 이익이 없다.\n  나. 앞서 본 사실관계를 위와 같은 법리에 비추어 살펴본다.\n  원고는 2023. 1. 19. 부당해고 구제신청을 하였는데, 그전인 2023. 1. 14.경 참가인에게 이 사건 사직서를 제출하였다. 원심의 판단과 같이 원고가 이 사건 사직서를 통하여 사직의 의사를 표시함으로써 부당해고 구제신청보다 앞서 참가인과의 근로관계가 종료되었다면, 원고에게 노동위원회의 구제명령을 받을 이익을 인정할 수 없다. 그렇다면, 원심으로서는 이 사건 사직서의 작성ㆍ제출 경위 및 그 효력이 어떠한지, 그에 따라 원고와 참가인의 근로계약관계가 원고의 구제신청 당시 이미 종료되었는지 여부에 관하여 심리하여 원고에게 구제명령을 받을 이익과 이 사건 소의 이익이 있는지에 대하여 판단하였어야 한다.  \n  그런데도 원심은 위와 같은 사항에 관하여 심리ㆍ판단하지 아니한 채 구제이익과 소의 이익이 있음을 전제로 하여 이 사건 재심판정을 취소한 제1심판결을 그대로 유지하였다. 이러한 원심의 판단에는 구제명령을 받을 이익과 소의 이익에 관한 법리를 오해하여 필요한 심리를 다하지 아니하여 판결에 영향을 미친 잘못이 있고, 이를 지적하는 상고이유 주장은 이유 있다.\n  3. 결론\n  나머지 상고이유에 관한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 노태악(재판장) 서경환 신숙희(주심) 마용주"

    "판결유형": "판결",
    "판시사항": "[1] 개발부담금 부과종료시점의 예외사유에 관하여 개발이익 환수에 관한 법률 제9조 제3항 단서 제2호, 같은 법 시행령 제10조 제1항 제1호 (가)목에서 정하고 있는 ‘부과대상 토지 중 일부가 사실상 개발이 완료되었다.’는 의미 및 그러한 상태에 이르렀는지 판단할 때 고려할 사항\n\n [2] 처분가격을 종료시점지가로 할 수 있는 예외적 사유를 정한 개발이익 환수에 관한 법률 제10조 제2항, 같은 법 시행령 제11조 제1항 제7호(처분가격 예외규정)의 취지 및 이에 해당하기 위한 요건 / 구 도시개발법 제25조 제2항에 따른 선수금 승인이 처분가격 예외규정에 해당하는지 여부(소극)",
    "판결요지": "[1] 개발이익 환수에 관한 법률 제9조는 개발부담금 부과의 기준시점에 관하여 규율하면서, 그 부과종료시점은 개발사업의 준공인가 등을 받은 날로 하되(제3항 본문), 예외사유 중 하나로 토지만을 개발하는 개발사업에서 부과대상 토지의 전부 또는 일부가 사실상 개발이 끝난 토지로서 타인에게 양도되는 경우를 들고 있다[같은 항 단서 제2호, 같은 법 시행령 제10조 제1항 제1호 (가)목].\n  위와 같은 개발부담금 부과종료시점 규정의 내용과 체계 및 개발사업의 시행 결과로 발생하는 개발이익은 사업대상 토지가 개발사업의 목적과 내용에 맞게 개발된 상태로 실현되는 것이라고 볼 수 있는 점 등을 감안하면, 위 예외사유가 정하고 있는 ‘부과대상 토지 중 일부가 사실상 개발이 완료되었다.’는 것은 해당 토지가 인가 등을 받은 개발사업의 계획에서 정한 개발된 토지로서의 사용목적에 부합할 정도로 공사가 완료된 상태를 의미하고, 그러한 상태에 이르렀는지를 판단할 때는 당해 개발사업의 목적, 내용과 방식, 해당 토지의 목적 또는 용도 및 다른 사업부지와의 물리적ㆍ기능적 관계 등을 종합적으로 고려해야 한다. \n\n [2] 개발이익 환수에 관한 법률 제10조에 따르면, 종료시점지가는 부과종료시점 당시의 부과대상 토지와 이용 상황이 가장 비슷한 표준지의 공시지가를 기준으로 지가형성 요인에 관한 표준적인 비교표에 따라 산정한 가액을 기초로 산정하되(제1항), 부과대상 토지를 분양하는 등 처분할 때에 그 처분가격에 대하여 국가나 지방자치단체의 인가 등을 받는 경우 등 대통령령으로 정하는 경우에는 그 처분가격을 종료시점지가로 할 수 있다(제2항). \n  위와 같이 위임을 받은 같은 법 시행령 제11조 제1항 제7호는 처분가격을 종료시점지가로 할 수 있는 예외적 사유의 하나로 ‘제1호부터 제6호까지의 경우와 비슷한 경우로서 국가 또는 지방자치단체의 인가 등을 받아 토지의 분양가격이 결정된 경우’를 들고 있다(이하 법 제10조 제2항과 시행령 제11조 제1항 제7호를 합하여 ‘처분가격 예외규정’이라 한다). 이는 국가 또는 지방자치단체가 주택가격의 안정이나 기타 특별한 필요에 의하여 처분가격을 승인하거나 제한하여 놓고도 그 처분가격보다 높은 가격으로 종료시점지가를 인정하여 개발부담금을 부과하는 것이 개발부담금제도의 취지에 반한다는 데에 근거한 것이다. 따라서 ‘처분가격 예외규정’에 해당하기 위해서는 처분가격 자체를 승인하거나 제한하는 것을 내용으로 하는 행정청의 인가 등 처분으로 토지의 처분가격이 결정된 경우이어야 한다. 구 도시개발법(2011. 9. 30. 법률 제11068호로 개정되기 전의 것) 제25조 제2항에 따른 선수금 승인은 행정청이 처분가격을 승인하는 것이 아니라 준공 전에 미리 처분대금을 수령하는 것을 승인하는 것에 불과하다. 따라서 개발부담금 납부의무자가 행정청으로부터 선수금 수령을 승인받은 것이 ‘처분가격 예외규정’에 해당한다고 보기 어렵다.",
    "참조조문": "[1] 개발이익 환수에 관한 법률 제9조 제3항, 개발이익 환수에 관한 법률 시행령 제10조 제1항 제1호 (가)목 / [2] 개발이익 환수에 관한 법률 제10조 제1항, 제2항, 개발이익 환수에 관한 법률 시행령 제11조 제1항 제7호, 구 도시개발법(2011. 9. 30. 법률 제11068호로 개정되기 전의 것) 제25조 제2항",
    "참조판례": "",
    "판례내용": "【원고, 피상고인】 부산도시공사 (소송대리인 변호사 이재홍 외 5인)\n【피고, 상고인】 부산광역시 해운대구청장 (소송대리인 법무법인 삼덕 담당변호사 박옥봉)\n【원심판결】  부산고법 2022. 2. 18. 선고 2021누22913 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 부산고등법원에 환송한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 다음과 같은 사실을 알 수 있다. \n  가. 부산광역시장은 2006. 11. 29. 부산 해운대구 (이하 생략) 일원 49,000㎡를 원고를 시행자로 한 해운대관광리조트 도시개발사업(이하 ‘이 사건 사업’이라 한다)의 도시개발구역으로 지정하고 이를 고시하였다.\n  나. 원고는 2007. 12. 18.경 주식회사 ○○○(변경 전 상호: △△△ 주식회사, 이하 ‘소외 회사’라 한다)와, 소외 회사가 원고로부터 이 사건 사업의 부지조성공사 등을 위탁받아 수행하는 한편 시행자로서 이 사건 사업부지 지상에 신축될 관광시설 등 건축물의 건축사업(이하 ‘이 사건 건축사업’이라 한다)을 추진하기로 하는 내용의 사업협약을 체결하였다.\n  다. 이 사건 사업부지는 관광시설용지(이하 ‘이 사건 관광시설용지’라 한다)와 주차장, 도로 및 소공원으로 구성된 기반시설용지로 구성되어 있는데, 그중 도로 및 소공원 부분은 기부채납 대상이다.\n  라. 원고는 2008. 5. 14. 소외 회사에 이 사건 관광시설용지 및 위 주차장용지를 매도하는 내용의 용지매매계약을 체결하였다. 이후 원고가 구 도시개발법(2011. 9. 30. 법률 제11068호로 개정되기 전의 것, 이하 ‘구 도시개발법’이라 한다) 제25조에 따라 부산광역시장에게 선수금 수령의 승인을 요청하자, 부산광역시장은 2009. 1. 29. 원고에 대하여 선수금액을 233,650,067,000원으로 하여 선수금 수령을 승인하였다. 원고는 소외 회사와 2009. 2. 12. 및 2010. 1. 22. 각 용지매매변경계약을 체결하여 최종적으로 용지매매대금을 233,650,067,000원으로 정하고, 2010. 12. 31.까지 소외 회사로부터 위 용지매매대금을 전부 지급받았다.\n  마. 부산광역시장은 2010. 1. 13. 원고를 시행자로 한 이 사건 사업의 실시계획을 인가ㆍ고시하였다. 소외 회사는 2011. 10. 7. 피고로부터 이 사건 건축사업에 관한 주택건설사업계획을 승인받았고, 2011. 12. 30. 그 착공신고를 마쳤다.\n  바. 원고는 2019. 12. 30. 부산광역시장으로부터 이 사건 사업에 관한 준공검사를 받았다. 이에 피고는 2020. 6. 18. 원고에 대하여, 위 준공검사일을 부과종료시점으로 보아 표준지 선정 및 비교평가를 거쳐 산정한 종료시점지가를 기초로 이 사건 사업에 대한 개발부담금 33,388,018,370원을 결정ㆍ부과하였다(이하 ‘이 사건 처분’이라 한다).  \n  2. 제1, 3 상고이유에 대하여 \n  가. 이 사건 관광시설용지에 대한 개발부담금의 부과종료시점\n  1) 원심은 그 판시와 같은 이유로, 「개발이익 환수에 관한 법률」(이하 ‘개발이익환수법’이라 한다) 제9조 제3항 단서 제2호로부터 위임을 받은 같은 법 시행령 제10조 제1항 제1호 (가)목, 제2항 제1호에 따라, 이 사건 사업과 같이 토지만을 개발하는 도시개발사업에서 시행자가 준공검사일 이전에 토지의 전부 또는 일부를 타인에게 처분하여 양도한 경우, 해당 토지에 대한 개발부담금의 부과종료시점은 그 잔대금지급일 이전에 사실상 개발이 완료되었다면 그 잔대금지급일이 되고, 그 당시까지 사실상 개발이 완료되지 않았다면 이후 사실상 개발이 완료된 날이 된다고 인정한 다음, 원고가 이 사건 사업의 준공검사일 이전에 소외 회사에 처분한 이 사건 관광시설용지에 대한 개발부담금의 부과종료시점은 그 잔대금지급일 이후로서 이 사건 관광시설용지의 사실상 개발이 완료된 날이 된다고 판단하였다.  \n  2) 원심판결 이유를 관련 법리와 앞서 본 사실관계에 비추어 살펴보면, 위와 같은 원심의 판단에 상고이유 주장과 같이 개발부담금의 부과종료시점, 개발이익환수법 시행령 제10조 제1항 제1호 (가)목의 해석 또는 적용 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다.\n  나. 이 사건 관광시설용지의 사실상 개발이 완료된 날의 의미 \n  1) 원심의 판단 \n  원심은 그 판시와 같은 이유로, 이 사건 관광시설용지의 사실상 개발이 완료된 날은 이 사건 관광시설용지에서 부지조성공사가 완료된 2014. 3. 16.이라고 보아, 이 사건 처분 중 이 사건 관광시설용지에 대한 개발부담금의 부과종료시점을 2014. 3. 16.이 아닌 이 사건 사업의 준공검사일인 2019. 12. 30.로 하여 산정된 개발부담금 부분은 위법하다고 판단하였다. \n  2) 대법원의 판단\n  가)                개발이익환수법 제9조는 개발부담금 부과의 기준시점에 관하여 규율하면서, 그 부과종료시점은 개발사업의 준공인가 등을 받은 날로 하되(제3항 본문), 예외사유 중 하나로 토지만을 개발하는 개발사업에서 부과대상 토지의 전부 또는 일부가 사실상 개발이 끝난 토지로서 타인에게 양도되는 경우를 들고 있다[같은 항 단서 제2호, 같은 법 시행령 제10조 제1항 제1호 (가)목            ].\n  위와 같은 개발부담금 부과종료시점 규정의 내용과 체계 및 개발사업의 시행 결과로 발생하는 개발이익은 사업대상 토지가 개발사업의 목적과 내용에 맞게 개발된 상태로 실현되는 것이라고 볼 수 있는 점 등을 감안하면, 위 예외사유가 정하고 있는 ‘부과대상 토지 중 일부가 사실상 개발이 완료되었다.’는 것은 해당 토지가 인가 등을 받은 개발사업의 계획에서 정한 개발된 토지로서의 사용목적에 부합할 정도로 공사가 완료된 상태를 의미하고, 그러한 상태에 이르렀는지를 판단할 때는 당해 개발사업의 목적, 내용과 방식, 해당 토지의 목적 또는 용도 및 다른 사업부지와의 물리적ㆍ기능적 관계 등을 종합적으로 고려하여야 한다. \n  나) 원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 이 사건 사업은 구 도시개발법에 따른 도시개발사업으로 단순히 대지 조성만을 목적으로 하는 것이 아니라 계획적인 단지 또는 시가지의 조성을 목적으로 하고 있으며, 나아가 관광휴양시설 등을 건축할 수 있는 이 사건 관광시설용지를 조성하는 것은 물론 이 사건 관광시설용지의 효율적 이용, 주차수요 대응, 주변 녹지와 보행통로와의 연계 등을 위해 이 사건 관광시설용지 주변에 기반시설인 도로, 주차장 및 소공원을 설치하는 것을 그 내용으로 하였던 사정을 알 수 있다. \n  이러한 사정 등을 앞서 본 법리에 비추어 살펴보면, 개발이익환수법 제9조 제3항 단서 제2호, 같은 법 시행령 제10조 제1항 제1호 (가)목에 따라 이 사건 관광시설용지의 사실상 개발이 완료된 날은 이 사건 관광시설용지의 부지조성공사 이외에도 이 사건 관광시설용지가 인가된 이 사건 사업의 실시계획에서 정한 관광시설용지로서의 사용목적에 부합하는 데 필요한 정도의 기반시설공사까지 완료된 때를 의미한다고 보아야 하고, 이 사건 관광시설용지의 부지조성공사만이 완료된 상태를 들어 이 사건 관광시설용지의 사실상 개발이 완료되었다고 볼 수는 없다.\n  다) 그런데도 원심은, 이 사건 관광시설용지의 부지조성공사가 완료된 때에 이 사건 관광시설용지의 사실상 개발이 완료되었다고 단정한 나머지, 이 사건 사업의 준공검사 이전의 어느 시점에 이 사건 관광시설용지가 이 사건 사업에서 정한 관광시설용지로서의 사용목적에 부합하는 데 필요한 정도의 기반시설공사까지 완료되었는지에 관하여 심리하지 아니한 채, 이 사건 관광시설용지의 사실상 개발이 완료된 날을 그 부지조성공사만이 완료된 2014. 3. 16.로 보아 이날이 부과종료시점이 된다고 판단하였다. 이러한 원심판단에는 개발이익환수법 시행령 제10조 제1항 제1호 (가)목에서 정한 사실상 개발 완료의 의미에 관한 법리를 오해하여 필요한 심리를 다하지 아니함으로써 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 상고이유 주장은 이유 있다.\n  3. 제2 상고이유에 대하여 \n  가. 원심의 판단 \n  원심은 판시와 같은 이유로, 원고가 구 도시개발법 제25조에 따라 부산광역시장으로부터 선수금 수령을 승인받은 것은 처분가격을 종료시점지가로 할 수 있는 예외적 사유를 정한 개발이익환수법 제10조 제2항, 같은 법 시행령 제11조 제1항 제7호(이하 위 규정을 합하여 ‘처분가격 예외규정’이라 한다)에 해당한다고 보아, 원고의 소외 회사에 대한 처분가격이 아닌 개발이익환수법 제10조 제1항에서 정한 평가방식에 따라 산정한 금액을 종료시점지가로 한 이 사건 처분은 위법하다고 판단하였다. \n  나. 대법원의 판단   \n  1)                개발이익환수법 제10조에 따르면, 종료시점지가는 부과종료시점 당시의 부과대상 토지와 이용 상황이 가장 비슷한 표준지의 공시지가를 기준으로 지가형성 요인에 관한 표준적인 비교표에 따라 산정한 가액을 기초로 산정하되(제1항), 부과대상 토지를 분양하는 등 처분할 때에 그 처분가격에 대하여 국가나 지방자치단체의 인가 등을 받는 경우 등 대통령령으로 정하는 경우에는 그 처분가격을 종료시점지가로 할 수 있다(제2항). \n  위와 같이 위임을 받은 같은 법 시행령 제11조 제1항 제7호는 처분가격을 종료시점지가로 할 수 있는 예외적 사유의 하나로 ‘제1호부터 제6호까지의 경우와 비슷한 경우로서 국가 또는 지방자치단체의 인가 등을 받아 토지의 분양가격이 결정된 경우’를 들고 있다. 이는 국가 또는 지방자치단체가 주택가격의 안정이나 기타 특별한 필요에 의하여 처분가격을 승인하거나 제한하여 놓고도 그 처분가격보다 높은 가격으로 종료시점지가를 인정하여 개발부담금을 부과하는 것이 개발부담금제도의 취지에 반한다는 데에 근거한 것이다. 따라서 ‘처분가격 예외규정’에 해당하기 위해서는 처분가격 자체를 승인하거나 제한하는 것을 내용으로 하는 행정청의 인가 등 처분으로 토지의 처분가격이 결정된 경우이어야 한다. \n  2)                구 도시개발법 제25조 제2항에 따른 선수금 승인은 행정청이 처분가격을 승인하는 것이 아니라 준공 전에 미리 처분대금을 수령하는 것을 승인하는 것에 불과하다. 나아가 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 원고가 부산광역시장에게 선수금 승인을 신청하면서 처분가격이 기재된 토지처분계획서 등을 제출하기는 하였으나, 이에 더하여 부산광역시장이 처분가격 자체를 승인하거나 제한하는 것을 내용으로 어떠한 처분을 하는 등으로 토지의 처분가격이 결정되었다고 볼 만한 사정을 찾을 수 없다. 따라서 원고가 부산광역시장으로부터 선수금 수령을 승인받은 것이 ‘처분가격 예외규정’에 해당한다고 보기 어렵다. \n  3) 그런데도 원심은, 원고가 부산광역시장으로부터 선수금 수령을 승인받은 것이 ‘처분가격 예외규정’에 해당한다고 보아 처분가격을 종료시점지가로 판단하였다. 이러한 원심판단에는 구 도시개발법 제25조 제2항의 선수금 승인과 ‘처분가격 예외규정’의 요건에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 상고이유 주장은 이유 있다.   \n  4. 결론\n  원심판결을 파기하고 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 마용주(재판장) 노태악 신숙희(주심)"

    "판결요지": "수도법 제71조에서 규정하고 있는 상수도원인자부담금은 수도사업자가 수도시설의  비용을 부담하는 주체임을 전제로, 수도공사 비용 발생의 원인을 제공한 자 등에게 그 비용의 전부 또는 일부를 부담하게 하는 것이다. \n  수도법 제12조 제1항, 제18조 제1항, 제19조 제1항, 제20조, 제21조 제1항, 제43조 제1항, 제60조, 제70조, 제75조를 종합하여 보면, 일반수도사업에서 급수설비를 제외한 수도시설의 설치의무 및 비용은 원칙적으로 수도사업자가 부담한다고 해석된다. 한편 도시 및 주거환경정비법(이하 ‘도시정비법’이라 한다) 제2조 제4호, 제52조 제1항 제2호, 제92조 제1항, 제2항, 제95조 제1항, 제2항, 제96조, 도시 및 주거환경정비법 시행령 제77조, 제79조 제1항에 따르면, 도시정비법상 정비구역 내의 수도시설의 설치의무 및 비용은 원칙적으로 사업시행자가 부담한다고 해석된다. 이와 관련하여 정비구역 내 수도시설의 설치의무 및 비용 부담 주체가 수도법상 수도사업자인지, 아니면 도시정비법상 사업시행자인지 문제 된다. \n  위 각 법령 규정들의 내용에 정비구역 내 수도시설의 신설ㆍ증설 등은 대부분 정비사업상 필요에 따라 이루어지는 점 등을 더하여 보면, 수도법과 도시정비법은 정비구역 내 수도시설의 신설ㆍ증설 등에 관하여 일반법과 특별법의 관계에 있다고 보아야 한다. 그렇다면 정비구역 내 수도시설의 설치의무 및 비용 부담 주체는 특별한 사정이 없는 한 도시정비법상 사업시행자로 보아야 한다.  \n  한편 상수도원인자부담금은 수도시설에 관한 비용 부담 주체가 아니면서 그 비용 발생의 원인을 제공한 자에게 부과되므로, 정비구역 내 수도시설의 비용 부담 주체인 도시정비법상 사업시행자에게는 그 수도시설에 관한 상수도원인자부담금을 부과할 수 없다. 따라서 사업시행자가 자신의 비용을 지출하여 정비구역 내 수도시설을 설치하였다고 하더라도, 이를 들어 해당 수도시설에 대하여 부과될 여지가 없는 상수도원인자부담금을 납부하였다고 볼 수도 없다.",
    "참조조문": "수도법 제12조 제1항, 제18조 제1항, 제19조 제1항, 제20조, 제21조 제1항, 제43조 제1항, 제60조, 제70조, 제71조, 제75조, 도시 및 주거환경정비법 제2조 제4호, 제52조 제1항 제2호, 제92조, 제95조 제1항, 제2항, 제96조, 도시 및 주거환경정비법 시행령 제77조, 제79조 제1항",
    "참조판례": "",
    "판례내용": "【원고, 피상고인】 한국토지주택공사 (소송대리인 변호사 안성훈)\n【피고, 상고인】 인천광역시상수도사업본부중부수도사업소장 (소송대리인 변호사 허은강)\n【원심판결】  서울고법 2024. 9. 25. 선고 2021누65417 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 관련 법리\n                 수도법 제71조에서 규정하고 있는 상수도원인자부담금은 수도사업자가 수도시설의 비용을 부담하는 주체임을 전제로, 수도공사 비용 발생의 원인을 제공한 자 등에게 그 비용의 전부 또는 일부를 부담하게 하는 것이다. \n                 수도법 제12조 제1항, 제18조 제1항, 제19조 제1항, 제20조, 제21조 제1항, 제43조 제1항, 제60조, 제70조, 제75조를 종합하여 보면, 일반수도사업에서 급수설비를 제외한 수도시설의 설치의무 및 비용은 원칙적으로 수도사업자가 부담한다고 해석된다. 한편 「도시 및 주거환경정비법」(이하 ‘도시정비법’이라 한다) 제2조 제4호, 제52조 제1항 제2호, 제92조 제1항, 제2항, 제95조 제1항, 제2항, 제96조, 「도시 및 주거환경정비법 시행령」 제77조, 제79조 제1항에 의하면, 도시정비법상 정비구역 내의 수도시설의 설치의무 및 비용은 원칙적으로 사업시행자가 부담한다고 해석된다. 이와 관련하여 정비구역 내 수도시설의 설치의무 및 비용 부담 주체가 수도법상 수도사업자인지, 아니면 도시정비법상 사업시행자인지 문제 된다. \n  위 각 법령 규정들의 내용에 정비구역 내 수도시설의 신설ㆍ증설 등은 대부분 정비사업상 필요에 따라 이루어지는 점 등을 더하여 보면, 수도법과 도시정비법은 정비구역 내 수도시설의 신설ㆍ증설 등에 관하여 일반법과 특별법의 관계에 있다고 보아야 한다. 그렇다면 정비구역 내 수도시설의 설치의무 및 비용 부담 주체는 특별한 사정이 없는 한 도시정비법상 사업시행자로 보아야 한다.  \n  한편 상수도원인자부담금은 수도시설에 관한 비용 부담 주체가 아니면서 그 비용 발생의 원인을 제공한 자에게 부과되므로, 정비구역 내 수도시설의 비용 부담 주체인 도시정비법상 사업시행자에게는 그 수도시설에 관한 상수도원인자부담금을 부과할 수 없다. 따라서 사업시행자가 자신의 비용을 지출하여 정비구역 내 수도시설을 설치하였다고 하더라도, 이를 들어 해당 수도시설에 대하여 부과될 여지가 없는 상수도원인자부담금을 납부하였다고 볼 수도 없다. \n  2. 이 사건에 대한 판단\n  앞서 살핀 법리에 따르면, 원고의 주장과 같이 주거환경개선사업의 시행자인 원고가 자신의 비용을 지출하여 정비구역 내에 배수관을 설치하는 수도공사를 실시하였다고 하더라도 이로써 수도법 제71조 제1항에서 규정하고 있는 상수도원인자부담금을 납부하였다고 볼 수는 없다. 따라서 원고가 상수도원인자부담금 납부의무를 이행하였음을 전제로 한 「부담금관리 기본법」 제5조 제1항의 부담금 이중부과 금지의 원칙 위반 주장은 더 나아가 살펴볼 필요 없이 이유 없다. \n  이와 다른 전제에서 이 사건 처분이 부담금의 이중부과를 금지하고 있는 「부담금관리 기본법」 제5조 제1항에 위반되어 위법하다는 원심의 판단에는 도시정비법상 정비구역 내 수도시설 설치비용의 부담 주체, 협의에 의한 상수도원인자부담금 납부와 그에 따른 상수도원인자부담금 부과사유 소멸, 부담금 이중부과 금지의 원칙에 관한 법리를 오해하여 판결의 결론에 영향을 미친 잘못이 있다. 이를 지적하는 피고의 상고이유 주장은 이유 있다.\n  3. 결론\n  나머지 상고이유에 관한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.   \n\n대법관 박영재(재판장) 오경미 권영준(주심) 엄상필"
  },

    "판결유형": "판결",
    "판시사항": "국토의 계획 및 이용에 관한 법률 제135조 제1항 제1호에 따라 이전하는 ‘도시·군관리계획에 관한 권리·의무’에 사업시행자의 지위가 포함되는지 여부(소극)",
    "판결요지": "국토의 계획 및 이용에 관한 법률(이하 ‘국토계획법’이라 한다) 제86조 제5항, 제7항, 제133조 제1항 제15호의2, 제135조 제1항 제1호, 구 국토의 계획 및 이용에 관한 법률 시행령(2025. 7. 1. 대통령령 제35628호로 개정되기 전의 것, 이하 ‘구 국토계획법 시행령’이라 한다) 제96조 제1항, 제2항의 체계와 내용 등을 종합해 보면, 국토계획법 제135조 제1항 제1호에 따라 이전하는 ‘도시·군관리계획에 관한 권리·의무’에 사업시행자의 지위는 포함되지 않는다고 보아야 한다. 구체적인 이유는 다음과 같다.\n  ① 국토계획법 제135조 제1항 제1호에 사용된 문언의 객관적인 의미를 고려할 때, 토지 또는 건축물에 관한 소유권이나 그 밖의 권리의 변동과 동시에 승계인에게 이전되는 권리·의무는 그 토지 또는 건축물에 관하여 ‘소유권이나 그 밖의 권리를 가진 자’의 지위에 주어지는 도시·군관리계획에 관한 권리·의무라고 해석하는 것이 타당하다. 국토계획법 제142조가 같은 법 제133조 제1항에 따른 이행명령을 위반한 자를 형사처벌의 대상으로 정하고 있는 점까지 함께 고려한다면, 문언의 가능한 의미를 벗어나 토지 또는 건축물에 관하여 ‘소유권이나 그 밖의 권리를 가진 자’의 지위와 별개로 부여되는 사업시행자의 지위나 그 지위에 주어지는 권리·의무까지 국토계획법 제135조 제1항 제1호에 따라 승계인에게 이전된다고 해석하는 것은 타당하지 않다.\n  ② 국토계획법 제135조 제1항 제1호에 따른 이전 범위에 사업시행자의 지위까지 포함된다고 보면, 사업시행자가 소유하는 부지 중 일부가 양도된 경우에는 양도인과 양수인이 공동으로 사업시행자가 된다거나, 사업시행자로부터 다수인이 그 부지를 양수한 경우에는 양수인의 수만큼 사업시행자가 증가한다는 결론에 이르게 된다. 이는 행정청 등이 아닌 자가 사업시행자로 지정받기 위한 요건을 엄격히 설정하고 사업의 안정적 수행을 위하여 자금조달계획 등 사업시행능력까지도 사전에 심사하여 그 사업시행자 지정을 하도록 한 제도의 취지를 형해화시킬 수 있다.\n  ③ 국토계획법상 도시계획시설사업의 사업시행자 지정은 특정인에게 도시계획시설사업을 시행할 수 있는 권한을 부여하는 처분이다. 이러한 처분에 의하여 설정된 사업시행자 지위는 국토계획법 제86조 제5항, 제6항, 제7항, 구 국토계획법 시행령 제96조 제1항, 제2항 등에 따라 신청을 거쳐 법령이 정하는 요건을 갖춘 자에 한하여 사업시행자 변경지정 및 그 고시를 함으로써 이전되는 것이므로, 별도의 사업시행자변경지정처분 없이도 사업시행자의 지위가 승계된다고 보는 것은 타당하지 않다.",
    "참조조문": "국토의 계획 및 이용에 관한 법률 제86조 제5항, 제6항, 제7항, 제133조 제1항 제15호의2, 제135조 제1항 제1호, 제142조, 구 국토의 계획 및 이용에 관한 법률 시행령(2025. 7. 1. 대통령령 제35628호로 개정되기 전의 것) 제96조 제1항, 제2항",
    "참조판례": "대법원 2017. 7. 11. 선고 2016두35120 판결(공2017하, 1637)",
    "판례내용": "【원고, 상고인】                원고 1 외 3인 (소송대리인 법무법인 파트너 담당변호사 심정구)\n【피고, 피상고인】 속초시장 (소송대리인 변호사 김희근)\n【원심판결】  서울고법 2024. 6. 26. 선고 (춘천)2023누356 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요 및 쟁점\n  가. 원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 다음과 같은 사실을 알 수 있다.\n  1) 피고는 2016. 5.경 사업시행자를 주식회사 ○○○(이하 ‘소외 회사’라 한다)로 지정하여 속초시 △△동 (지번 1 생략) 일대 토지에 도로를 개설하고 유원지를 조성하는 내용의 도시계획시설사업(이하 ‘이 사건 사업’이라 한다) 실시계획을 인가하고 2016. 5. 20. 이를 고시하였다. 피고는 2019. 4. 10. 이 사건 사업에 관하여 준공예정일을 2021. 12. 31.로 변경하는 등의 실시계획(변경)인가 고시를 하였다(이하 위 인가 및 변경인가를 ‘이 사건 실시계획인가’라 한다).\n  2) 원고들은 2019. 8. 23. 강제경매절차를 통해 이 사건 사업부지 중 소외 회사가 소유하던 속초시 △△동 (지번 1 생략) 임야 14,392㎡, 같은 동 (지번 2 생략) 잡종지 1,245㎡, 같은 동 (지번 3 생략) 잡종지 464㎡, 같은 동 (지번 4 생략) 임야 120㎡ 및 같은 동 (지번 5 생략) 잡종지 530㎡(이하 ‘이 사건 각 토지’라 한다)를 공동 매수하여 각 1/4 지분에 관한 지분소유권이전등기를 마쳤다.\n  3) 피고는 2022. 1. 19. 원고들에게, 원고들이 「국토의 계획 및 이용에 관한 법률」(이하 ‘국토계획법’이라 한다) 제135조에 따라 이 사건 사업에 관한 소외 회사의 사업시행자 지위를 승계하였음을 전제로, 국토계획법 제133조에 근거하여 이 사건 실시계획인가에 따른 도시계획시설 완공, 인가조건 이행, 도시계획시설 주변 펜스 철거 및 중로2-32호선 복구 등의 사항을 2022. 2. 21.까지 이행하라는 내용의 이행명령 처분(이하 ‘이 사건 처분’이라 한다)을 하였다.\n  나. 쟁점\n  이 사건의 쟁점은, 원고들이 이 사건 각 토지의 소유권을 이전받음으로써 국토계획법 제133조 제1항 제15호의2의 ‘도시·군계획시설사업의 실시계획인가 또는 변경인가를 받고 그 실시계획에서 정한 사업기간 동안 사업을 완료하지 아니한 자’, 즉 이 사건 사업의 사업시행자 지위를 승계하는지 여부이다.\n  2. 원심의 판단\n  원심은, 원고들이 이 사건 사업의 시행기간 내인 2019. 8. 23. 이 사건 각 토지의 소유권을 취득하여 국토계획법 제135조 제1항 제1호에 따라 이 사건 사업의 사업시행자 지위를 승계하였으므로, 이 사건 처분이 적법하다고 판단하였다.\n  3. 대법원의 판단\n  가. 관련 규정과 법리\n  1) 국토계획법 제86조 제5항 및 구 국토의 계획 및 이용에 관한 법률 시행령(2025. 7. 1. 대통령령 제35628호로 개정되기 전의 것, 이하 ‘구 국토계획법 시행령’이라 한다) 제96조 제1항에 따르면, 행정청이 아닌 자는 시행자로 지정을 받아 도시·군계획시설사업을 시행할 수 있고, 그 시행자로 지정받고자 하는 자는 사업의 종류 및 명칭, 사업시행자의 성명 및 주소(법인인 경우에는 법인의 명칭 및 소재지와 대표자의 성명 및 주소), 토지 또는 건물의 소재지·지번·지목 및 면적 등, 사업의 착수예정일 및 준공예정일, 자금조달계획을 기재한 신청서를 국토교통부장관, 시·도지사 또는 시장·군수에게 제출하여야 한다.\n  국토계획법 제86조 제7항 및 구 국토계획법 시행령 제96조 제2항에 따르면, 국가 또는 지방자치단체, 일정한 공공기관 등이 아닌 자가 그 시행자로 지정을 받으려면 도시·군계획시설사업의 대상인 토지(국공유지는 제외한다) 면적의 3분의 2 이상에 해당하는 토지를 소유하고, 토지 소유자 총수의 2분의 1 이상에 해당하는 자의 동의를 얻어야 한다.\n  국토계획법 제133조 제1항은 \"국토교통부장관, 시·도지사, 시장·군수 또는 구청장은 다음 각 호의 어느 하나에 해당하는 자에게 이 법에 따른 허가·인가 등의 취소, 공사의 중지, 공작물 등의 개축 또는 이전, 그 밖에 필요한 처분을 하거나 조치를 명할 수 있다.\"라고 규정하면서, 제15호의2에서 \"제88조에 따라 도시·군계획시설사업의 실시계획인가 또는 변경인가를 받고 그 실시계획에서 정한 사업기간 동안 사업을 완료하지 아니한 자\"를 규정하고 있다.\n  국토계획법 제135조 제1항은 \"다음 각 호에 해당하는 권리·의무는 그 토지 또는 건축물에 관한 소유권이나 그 밖의 권리의 변동과 동시에 그 승계인에게 이전한다.\"라고 규정하면서, 제1호에서 \"토지 또는 건축물에 관하여 소유권이나 그 밖의 권리를 가진 자의 도시·군관리계획에 관한 권리·의무\"를 규정하고 있다.\n  2) 위와 같은 관련 규정의 체계와 내용 등을 종합해 보면, 국토계획법 제135조 제1항 제1호에 따라 이전하는 ‘도시·군관리계획에 관한 권리·의무’에 사업시행자의 지위는 포함되지 않는다고 보아야 한다. 그 구체적인 이유는 다음과 같다.\n  가)                국토계획법 제135조 제1항 제1호에 사용된 문언의 객관적인 의미를 고려할 때, 토지 또는 건축물에 관한 소유권이나 그 밖의 권리의 변동과 동시에 승계인에게 이전되는 권리·의무는 그 토지 또는 건축물에 관하여 ‘소유권이나 그 밖의 권리를 가진 자’의 지위에 주어지는 도시·군관리계획에 관한 권리·의무라고 해석함이 상당하다. 국토계획법 제142조가 같은 법 제133조 제1항에 따른 이행명령을 위반한 자를 형사처벌의 대상으로 정하고 있는 점까지 함께 고려한다면, 문언의 가능한 의미를 벗어나 토지 또는 건축물에 관하여 ‘소유권이나 그 밖의 권리를 가진 자’의 지위와 별개로 부여되는 사업시행자의 지위나 그 지위에 주어지는 권리·의무까지 국토계획법 제135조 제1항 제1호에 따라 승계인에게 이전된다고 해석하는 것은 타당하지 않다.\n  나)                국토계획법 제135조 제1항 제1호에 따른 이전 범위에 사업시행자의 지위까지 포함된다고 보면, 사업시행자가 소유하는 부지 중 일부가 양도된 경우에는 양도인과 양수인이 공동으로 사업시행자가 된다거나, 사업시행자로부터 다수인이 그 부지를 양수한 경우에는 양수인의 수만큼 사업시행자가 증가한다는 결론에 이르게 된다. 이는 행정청 등이 아닌 자가 사업시행자로 지정받기 위한 요건을 엄격히 설정하고 사업의 안정적 수행을 위하여 자금조달계획 등 사업시행능력까지도 사전에 심사하여 그 사업시행자 지정을 하도록 한 제도의 취지를 형해화시킬 수 있다.\n  다) 국토계획법상 도시계획시설사업의 사업시행자 지정은 특정인에게 도시계획시설사업을 시행할 수 있는 권한을 부여하는 처분이다(대법원 2017. 7. 11. 선고 2016두35120 판결 참조). 이러한 처분에 의하여 설정된 사업시행자 지위는 국토계획법 제86조 제5항, 제6항, 제7항, 구 국토계획법 시행령 제96조 제1항, 제2항 등에 따라 신청을 거쳐 법령이 정하는 요건을 갖춘 자에 한하여 사업시행자 변경지정 및 그 고시를 함으로써 이전되는 것이므로, 별도의 사업시행자변경지정처분 없이도 사업시행자의 지위가 승계된다고 보는 것은 타당하지 않다.\n  나. 구체적 판단\n  앞서 본 사실관계를 위 법리에 비추어 살펴보면, 원고들이 강제경매절차를 통해 소외 회사로부터 이 사건 각 토지의 소유권을 양수하였다고 하더라도, 피고로부터 별도로 사업시행자(변경)지정처분을 받은 바 없는 이상, 원고들이 국토계획법 제135조 제1항 제1호에 따라 소외 회사가 가지는 이 사건 사업의 사업시행자 지위를 승계하였다고 볼 수 없다. 따라서 원고들이 이 사건 사업의 사업시행자 지위, 즉 국토계획법 제133조 제1항 제15호의2의 ‘도시·군계획시설사업의 실시계획인가 또는 변경인가를 받고 그 실시계획에서 정한 사업기간 동안 사업을 완료하지 아니한 자’에 해당한다고 보아 그 조항에 근거하여 이 사건 처분을 할 수는 없다.\n  그런데도 원심은 원고들이 국토계획법 제135조 제1항 제1호에 따라 이 사건 사업의 사업시행자 지위를 승계하였음을 전제로 이 사건 처분이 적법하다고 판단하였다. 이러한 원심의 판단에는 국토계획법 제135조 제1항 제1호에 따라 이전하는 권리·의무의 범위에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다.\n  4. 결론\n  나머지 상고이유에 관한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 이숙연(재판장) 이흥구 오석준(주심) 노경필"
  },
