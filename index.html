    "판시사항": "[1] 공무원연금법 제25조 제3항 제1호가 포괄위임입법금지 원칙에 위배되는지 여부(소극)\n\n [2] 공무원연금법 시행령 제18조 제2호가 복위임금지 원칙에 반하는지 여부(소극)\n\n [3] 사회복무요원 복무기간을 2년 한도로 공무원 재직기간에 산입할 수 있도록 정한 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령 제151조가 현역병에 비하여 합리적 근거 없이 사회복무요원을 차별하고 있는지 여부(소극)\n\n [4] 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령 제151조가 공무원으로 근무하다가 퇴직한 후 다시 공무원으로 임용된 사람에 비하여 사회복무요원으로 복무한 후 공무원으로 임용된 사람을 합리적 근거 없이 차별하는지 여부(소극) \n\n [5] 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령 제151조가 인간다운 생활을 할 권리를 침해하는지 여부(소극)\n\n [6] 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령 제151조가 행복추구권을 침해하는지 여부(소극)\n\n [7] 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령 제151조가 병역의무의 이행으로 인한 불이익한 처우를 금지한 헌법 제39조 제2항에 위반되는지 여부(소극)",
    "판결요지": "[1] 공무원연금법 제25조 제3항 제1호는 본인의 의사와 상관없이 징집 또는 소집되어 열악한 근무환경 속에서 일정한 기간 국토방위 등의 직무를 수행하는 현역병 등의 공로를 복무기간 산입이라는 제도를 통해 보상하려는 목적을 가진다. 이러한 입법 목적에 더하여 보충역소집에 따라 복무하게 되는 직역의 다양성, 보충역소집에 따른 구체적인 복무 형태 및 기간의 변화 가능성, 보충역소집에 따른 복무와 현역병 등 복무 사이의 차이점 등을 고려하면, 보충역소집에 의하여 복무한 기간 중 공무원 재직기간에 산입할 수 있는 기간의 범위나 구체적인 기준 등을 법률에 빠짐없이 규정하는 것보다 일정한 정도로 예측 가능한 범위 내에서 하위법령에 위임할 필요성이 있다. \n  또한 공무원연금법 제25조 제3항 제1호는 공무원 재직기간에 산입될 수 있는 보충역소집으로 인한 복무기간을 아무런 기준이나 제한 없이 대통령령에 위임한 것이 아니라, 보충역소집으로 인한 복무기간을 공무원 재직기간에 산입한다는 원칙을 정하면서 다만 산입 기간의 구체적인 범위만을 대통령령으로 위임하고 있으므로, 대통령령에서 규정될 내용의 대강을 예측할 수 있다. 따라서 공무원연금법 제25조 제3항 제1호가 포괄위임입법금지 원칙에 위배된다고 할 수 없다.\n\n [2] 공무원연금법 제25조 제3항 제1호의 위임에 따른 공무원연금법 시행령 제18조 제2호는 사회복무요원으로 근무한 기간이 공무원 재직기간에 산입된다는 원칙을 정하면서, 그 상한만을 다른 대통령령인 병역법 시행령 제151조에 따르도록 규정하고 있으므로, 법률에서 위임받은 사항을 전혀 규정하지 않은 채 재위임한 것에 해당하지 않고, 위임받은 사항을 하위법령에 재위임한 것에도 해당하지 않는다. 따라서 공무원연금법 시행령 제18조 제2호가 복위임금지 원칙에 반한다고 볼 수 없다.\n\n [3] 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령(2011. 11. 23. 대통령령 제23305호로 개정되기 전의 것, 이하 같다) 제151조(이하 통틀어 ‘사회복무요원 재직기간 산입규정’이라 한다)에 따르면, 공무원으로 임용되기 전의 현역병 복무기간은 그 전부를 공무원 재직기간에 산입할 수 있는 반면, 사회복무요원 복무기간은 2년을 한도로 공무원 재직기간에 산입할 수 있어, 양자 사이에 차별이 존재하는 것은 사실이다.\n  그러나 현역병과 사회복무요원은 아래와 같은 차이점을 가지고 있으므로, 사회복무요원 재직기간 산입규정이 현역병과 사회복무요원 사이의 형평을 고려하여 육군 현역병의 복무기간을 기준으로 정한 구 병역법 시행령 제151조의 기간을 상한으로 사회복무요원 복무기간을 공무원 재직기간에 산입하는 것에 합리적인 이유가 있다. 따라서 사회복무요원이 현역병에 비하여 합리적인 근거가 없는 차별을 받고 있다고 볼 수 없다.\n  ① 현역병은 원칙적으로 군부대 내에서 거주하며 복무한다(병역법 제18조 제1항). 반면, 사회복무요원은 원칙적으로 출퇴근하며 복무한다(병역법 제31조 제4항).\n  ② 현역병은 일과표에 따라 기상ㆍ점호ㆍ국기게양 및 강하ㆍ식사ㆍ오전과업ㆍ오후과업ㆍ자율활동시간 및 취침 등의 일과를 수행한다(부대관리훈령 제40조 제1항, 제2항, 제3항). 반면, 사회복무요원은 일반적으로 국가공무원과 동일한 근무시간을 적용받아 점심시간을 제외하고 주 40시간을 근무한다(사회복무요원 복무관리 규정 제18조 제1항 제1호, 국가공무원 복무규정 제9조 제1항).\n  ③ 현역병은 지상작전(육군), 상륙작전을 포함한 해상작전(해군), 상륙작전(해병대), 항공작전(공군)을 주임무로 하여 이를 위한 교육ㆍ훈련을 받고(국군조직법 제3조 제1항, 제2항, 제4항), 국토방위의 의무를 수행하여 그러한 과정에서 발생할 수 있는 각종 총기ㆍ폭발물 사고, 부상 등 위험에 노출되어 있다. 반면, 사회복무요원은 국가기관ㆍ지방자치단체ㆍ공공단체 등의 공익목적에 필요한 사회서비스업무, 행정업무 등의 지원업무를 수행하여(병역법 제26조 제1항) 현역병에 비하여 위험에의 노출 정도가 낮다.\n\n [4] 퇴직한 공무원이 다시 공무원으로 임용된 경우 공무원연금법 제25조 제2항에 따라 종전 재직기간 전부를 공무원 재직기간에 합산할 수 있는 반면, 사회복무요원으로 복무한 사람이 공무원으로 임용된 경우 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령(2011. 11. 23. 대통령령 제23305호로 개정되기 전의 것) 제151조(이하 통틀어 ‘사회복무요원 재직기간 산입규정’이라 한다)에 따라 사회복무요원 복무기간을 2년을 한도로 공무원 재직기간에 산입할 수 있어, 양자 사이에 차별이 존재하는 것은 사실이다.\n  그러나 공무원연금법 제25조 제2항은 공무원연금법, 군인연금법, 사립학교교직원 연금법을 적용받다가 퇴직한 공무원ㆍ군인 또는 사립학교교직원이 공무원으로 임용된 경우 종전의 해당 연금법에 따른 재직기간 또는 복무기간을 공무원 재직기간에 합산할 수 있도록 하는 것으로, 본인이 기여금을 납부하여 급여비용의 일부를 부담한 공적연금 사이의 연계를 통하여 공무원ㆍ군인 또는 사립학교교직원으로 재직한 전체 기간에 상응하는 연금을 수급할 수 있도록 하는 제도이다. 이와 달리 사회복무요원 재직기간 산입규정은 사회복무요원 등이 기여금을 납부하지 않아 공적연금의 급여비용을 부담한 바 없음에도, 공무원으로 임용된 후 군복무를 한 사람과의 형평, 본인의 의사와 상관없이 징집ㆍ소집되어 일정한 기간 복무한 공로 등을 고려하여 사회복무요원 등의 복무기간을 공무원 재직기간에 산입할 수 있도록 혜택을 부여하는 제도이다.\n  이처럼 공무원연금법 제25조 제2항과 사회복무요원 재직기간 산입규정의 입법 취지에 차이가 있는 점, 사회복무요원이 공무원과 달리 아무런 기여금을 부담하지 않는 점 등을 고려하면, 사회복무요원으로 복무한 후 공무원으로 임용된 사람이 공무원으로 근무하다가 퇴직한 후 다시 공무원으로 임용된 사람에 비하여 합리적인 근거가 없는 차별을 받고 있다고 볼 수 없다.\n\n [5] 헌법 규정에 따라 국민에게 주어진 사회보장에 따른 국민의 수급권은 국가에 적극적으로 급부를 요구할 수 있는 권리를 주된 내용으로 한다. 국가가 국민에게 인간다운 생활을 할 권리를 보장하기 위하여 사회보장수급권에 관한 입법을 할 경우에는 국가의 재정부담 능력, 전체적인 사회보장수준과 국민감정 등 사회정책적인 고려, 상충하는 국민 각 계층의 갖가지 이해관계 등 복잡 다양한 요소를 함께 고려해야 한다. 따라서 이에 관한 기준을 설정하는 데에는 입법부 또는 입법에 의하여 다시 위임을 받은 행정부 등 해당기관에 상대적으로 광범위한 재량이 있는 것으로 보는 것이 타당하다.\n  국가가 인간다운 생활을 보장하기 위한 헌법적 의무를 다했는지가 사법적 심사의 대상이 된 경우에는, 국가가 최저생활보장에 관한 입법을 전혀 하지 않았다든가 그 내용이 현저히 불합리하여 헌법상 용인될 수 있는 재량의 범위를 명백히 일탈한 경우에 한하여 헌법에 위반된다고 할 수 있다.\n  공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령(2011. 11. 23. 대통령령 제23305호로 개정되기 전의 것) 제151조(이하 통틀어 ‘사회복무요원 재직기간 산입규정’이라 한다)는 사회복무요원의 복무기간을 공무원 재직기간에 산입하면서, 다만 현역병으로 복무한 사람 등과의 형평을 고려하여 육군 현역병의 복무기간을 초과하는 일부만을 산입 대상에서 제외하고 있다. 따라서 사회복무요원 재직기간 산입규정이 사회복무요원으로 복무한 후 공무원으로 임용된 사람의 권리를 보장하기 위한 입법을 전혀 하지 않았다고 볼 수 없고, 입법 취지 등을 고려할 때 현저히 불합리하다고 볼 수도 없으므로, 인간다운 생활을 할 권리를 침해한다고 볼 수 없다.\n\n [6] 헌법 제10조의 행복추구권은 국민이 행복을 추구하기 위하여 필요한 급부를 국가에 적극적으로 요구할 수 있는 것을 내용으로 하는 것이 아니라, 국민이 행복을 추구하기 위한 활동을 국가권력의 간섭 없이 자유롭게 할 수 있다는 포괄적인 의미의 자유권으로서의 성격을 가진다. \n  그런데 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령(2011. 11. 23. 대통령령 제23305호로 개정되기 전의 것) 제151조는 사회복무요원 등의 복무기간을 공무원 재직기간에 산입하는 혜택에 관하여 정한 것이지 자유권의 제한에 관하여 정한 것이 아니므로, 행복추구권을 제한하는 내용을 담고 있다고 볼 수 없다.\n\n [7] 병역의무의 이행으로 인한 불이익한 처우를 금지한 헌법 제39조 제2항은 병역의무를 이행한 사람에게 보상조치를 취하거나 특혜를 부여할 의무를 국가에 지우는 것이 아니라 법문 그대로 병역의무의 이행을 이유로 불이익한 처우를 하는 것을 금지하고 있을 뿐이다.\n  공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령(2011. 11. 23. 대통령령 제23305호로 개정되기 전의 것) 제151조는 사회복무요원 등으로 복무하였다가 공무원으로 임용된 사람들을 위하여 혜택을 부여하는 것일 뿐 병역의무의 이행을 이유로 불이익한 처우를 하는 것이 아니므로, 헌법 제39조 제2항에 위반된다고 볼 수 없다.",
    "참조조문": "[1] 헌법 제75조, 공무원연금법 제25조 제3항 제1호 / [2] 헌법 제75조, 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호 / [3] 헌법 제11조 제1항, 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 병역법 제18조 제1항, 제26조 제1항, 제31조 제4항, 구 병역법 시행령(2011. 11. 23. 대통령령 제23305호로 개정되기 전의 것) 제151조, 국군조직법 제3조 제1항, 제2항, 제4항, 국가공무원 복무규정 제9조 제1항 / [4] 헌법 제11조 제1항, 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령(2011. 11. 23. 대통령령 제23305호로 개정되기 전의 것) 제151조 / [5] 헌법 제34조 제1항, 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령(2011. 11. 23. 대통령령 제23305호로 개정되기 전의 것) 제151조 / [6] 헌법 제10조, 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령(2011. 11. 23. 대통령령 제23305호로 개정되기 전의 것) 제151조 / [7] 헌법 제39조 제2항, 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령(2011. 11. 23. 대통령령 제23305호로 개정되기 전의 것) 제151조",
    "참조판례": "[1] 헌법재판소 2015. 6. 25. 선고 2013헌바17 전원재판부 결정(헌공225, 989), 헌법재판소 2022. 6. 30. 선고 2019헌마150 전원재판부 결정(헌공309, 871) / [5] 대법원 2017. 7. 11. 선고 2015두2864 판결(공2017하, 1630), 헌법재판소 2012. 2. 23. 선고 2011헌마123 전원재판부 결정(헌공185호, 516) / [6] 헌법재판소 2022. 2. 24. 선고 2019헌마883 전원재판부 결정(헌공305호, 453) / [7] 대법원 2006. 12. 21. 선고 2004두14748 판결(공2007상, 214)",
    "판례내용": "【원고, 상고인】                원고            \n【피고, 피상고인】 공무원연금공단\n【원심판결】  서울고법 2023. 10. 11. 선고 2023누30972 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 원고가 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거에 따르면, 다음과 같은 사실을 알 수 있다. \n  가. 원고는 보충역으로 소집되어 2008. 8. 4.부터 2010. 8. 28.까지 사회복무요원으로 근무하였고, 2017. 10. 25. 공무원으로 임용되어 근무하였다.\n  나. 원고는 2022. 6. 16. 피고에게 공무원으로 임용되기 전 사회복무요원 복무기간 전부를 공무원 재직기간에 산입하여 줄 것을 신청하였으나, 피고는 2022. 6. 20. 원고에게 ‘공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령(2011. 11. 23. 대통령령 제23305호로 개정되기 전의 것, 이하 같다) 제151조에 따라 사회복무요원 복무기간은 2년을 한도로 공무원 재직기간에 산입된다.’는 이유로 원고의 사회복무요원 복무기간 중 2년을 초과하는 기간에 대한 공무원 재직기간 산입을 거부하는 처분(이하 ‘이 사건 거부처분’이라 한다)을 하였다.\n  2. 이 사건 거부처분의 근거 법령\n  가. 공무원연금법 제25조 제3항은 ‘공무원으로 임용되기 전의 다음 각 호의 복무기간은 본인이 원하는 바에 따라 공무원 재직기간에 산입할 수 있다.’라고 규정하면서, 제1호에서 ‘병역법에 따른 현역병 또는 지원하지 아니하고 임용된 부사관으로 복무한 기간(방위소집ㆍ상근예비역소집ㆍ보충역소집 또는 대체역소집에 의하여 복무한 기간 중 대통령령으로 정하는 복무기간을 포함한다)’을 정하고 있다.\n  그 위임에 따른 공무원연금법 시행령 제18조는 ‘공무원연금법 제25조 제3항 제1호에서 \"대통령령으로 정하는 복무기간\"이란 다음 각 호의 기간을 말한다.’라고 규정하면서, 제2호에서 ‘보충역소집에 의하여 사회복무요원 또는 국제협력봉사요원으로 근무한 기간(병역법 시행령 제151조에 따라 산정된 기간으로 한정한다)’을 정하고 있다.\n  한편 구 병역법 시행령 제151조는 ‘병역법 제74조 제2항 단서에 따라 승선근무예비역 또는 보충역의 의무복무기간을 마친 사람의 실제근무기간으로 산정하여야 할 기간은 2년으로 한다. 다만 복무기간이 2년 미만인 사람에 대해서는 실제복무기간으로 한다.’라고 규정하고 있다.\n  나. 이처럼 공무원연금법 제25조 제3항 제1호, 공무원연금법 시행령 제18조 제2호, 구 병역법 시행령 제151조(이하 통틀어 ‘이 사건 규정’이라 한다)는 공무원으로 임용되기 전 사회복무요원으로 복무한 기간을 본인이 원하는 바에 따라 공무원 재직기간에 산입할 수 있다고 규정하면서, 산입되는 기간의 상한을 2년으로 정하고 있다.\n  3. 포괄위임입법금지 원칙 또는 재위임금지 원칙 위반 주장에 관한 판단\n  가. 포괄위임입법금지 원칙 위반 여부  \n  1) 헌법 제75조는 ‘대통령은 법률에서 구체적으로 범위를 정하여 위임받은 사항에 관하여 대통령령을 발할 수 있다.’라고 규정하여 위임입법의 헌법상 근거를 마련함과 동시에 위임은 구체적으로 범위를 정하여 하도록 하여 그 한계를 제시하고 있는데, 그 한계는 예측가능성이라 할 것이다. 이때 ‘예측가능성’이란 법률에 이미 대통령령으로 규정될 내용 및 범위의 기본사항이 구체적으로 규정되어 있어서 누구라도 당해 법률로부터 대통령령 등에 규정될 내용의 대강을 예측할 수 있어야 함을 의미한다. 이러한 예측가능성의 유무는 당해 특정조항 하나만을 가지고 판단할 것은 아니고 관련 법조항 전체를 유기적ㆍ체계적으로 종합 판단하여야 하며, 각 대상법률의 성질에 따라 구체적ㆍ개별적으로 검토하여 법률조항과 법률의 입법 취지를 종합적으로 고찰할 때 합리적으로 그 대강이 예측될 수 있는 것이라면 위임의 한계를 일탈하지 아니한 것이다(대법원 2013. 7. 11. 자 2013아12 결정 참조).\n  2)                공무원연금법 제25조 제3항 제1호는 본인의 의사와 상관없이 징집 또는 소집되어 열악한 근무환경 속에서 일정한 기간 국토방위 등의 직무를 수행하는 현역병 등의 공로를 복무기간 산입이라는 제도를 통해 보상하려는 목적을 가진다(헌법재판소 2015. 6. 25. 선고 2013헌바17 전원재판부 결정, 헌법재판소 2022. 6. 30. 선고 2019헌마150 전원재판부 결정 참조). 이러한 입법 목적에 더하여 보충역소집에 따라 복무하게 되는 직역의 다양성, 보충역소집에 따른 구체적인 복무 형태 및 기간의 변화 가능성, 보충역소집에 따른 복무와 현역병 등 복무 사이의 차이점 등을 고려하면, 보충역소집에 의하여 복무한 기간 중 공무원 재직기간에 산입할 수 있는 기간의 범위나 구체적인 기준 등을 법률에 빠짐없이 규정하는 것보다 일정한 정도로 예측 가능한 범위 내에서 하위법령에 위임할 필요성이 있다.  \n  또한 공무원연금법 제25조 제3항 제1호는 공무원 재직기간에 산입될 수 있는 보충역소집으로 인한 복무기간을 아무런 기준이나 제한 없이 대통령령에 위임한 것이 아니라, 보충역소집으로 인한 복무기간을 공무원 재직기간에 산입한다는 원칙을 정하면서 다만 산입 기간의 구체적인 범위만을 대통령령으로 위임하고 있으므로, 대통령령에서 규정될 내용의 대강을 예측할 수 있다. 따라서 공무원연금법 제25조 제3항 제1호가 포괄위임입법금지 원칙에 위배된다고 할 수 없다.\n  3) 원심은 판시와 같은 이유로, 공무원연금법 제25조 제3항 제1호가 포괄위임입법금지 원칙에 위배되지 않는다고 판단하였다. 원심판단은 앞서 본 법리에 기초한 것으로서, 상고이유 주장과 같은 포괄위임입법금지 원칙에 관한 법리오해 등의 잘못이 없다.\n  나. 복위임금지 원칙 위반 여부\n  법률에서 위임받은 사항을 전혀 규정하지 않고 재위임하는 것은 복위임금지 원칙에 반할 뿐 아니라 위임명령의 제정 형식에 관한 수권법의 내용을 변경하는 것이 되므로 허용되지 아니한다. 그러나 위임받은 사항에 관하여 대강을 정하고 그중 특정사항을 범위를 정하여 하위법령에 다시 위임하는 경우에는 재위임이 허용된다(대법원 2015. 1. 15. 선고 2013두14238 판결 참조).\n                 공무원연금법 제25조 제3항 제1호의 위임에 따른 공무원연금법 시행령 제18조 제2호는 사회복무요원으로 근무한 기간이 공무원 재직기간에 산입된다는 원칙을 정하면서, 그 상한만을 다른 대통령령인 병역법 시행령 제151조에 따르도록 규정하고 있으므로, 법률에서 위임받은 사항을 전혀 규정하지 않은 채 재위임한 것에 해당하지 않고, 위임받은 사항을 하위법령에 재위임한 것에도 해당하지 않는다. 따라서 공무원연금법 시행령 제18조 제2호가 복위임금지 원칙에 반한다고 볼 수 없다.\n  원심은 판시와 같은 이유로, 공무원연금법 시행령 제18조 제2호가 복위임금지 원칙에 위배되지 않는다고 판단하였다. 원심판단은 앞서 본 법리에 기초한 것으로서, 상고이유 주장과 같은 복위임금지 원칙에 관한 법리오해 등의 잘못이 없다.\n  4. 평등의 원칙 위반 주장에 관한 판단\n  가. 헌법 제11조 제1항은 \"모든 국민은 법 앞에 평등하다. 누구든지 성별ㆍ종교 또는 사회적 신분에 의하여 정치적ㆍ경제적ㆍ사회적ㆍ문화적 생활의 모든 영역에 있어서 차별을 받지 아니한다.\"라고 규정하고 있다. 헌법상 평등원칙은 본질적으로 같은 것을 자의적으로 다르게 취급함을 금지하는 것으로서, 일체의 차별적 대우를 부정하는 형식적ㆍ절대적 평등을 뜻하는 것이 아니라 입법을 하고 법을 적용할 때에 합리적인 근거가 없는 차별을 하여서는 아니 된다는 실질적ㆍ상대적 평등을 뜻한다(대법원 2024. 7. 18. 선고 2023두36800 전원합의체 판결 참조).\n  사회보장과 사회복지 분야 특히 연금제도에 관한 입법에는 여러 가지 사회적ㆍ경제적 여건 등을 종합한 정책판단이 이루어져야 하는바, 그와 같은 입법 과정에서 입법자에게는 광범위한 입법 형성권이 인정된다(대법원 2006. 12. 21. 선고 2004두14748 판결 참조).\n  나. 이 사건 규정에 따르면, 공무원으로 임용되기 전의 현역병 복무기간은 그 전부를 공무원 재직기간에 산입할 수 있는 반면, 사회복무요원 복무기간은 2년을 한도로 공무원 재직기간에 산입할 수 있어, 양자 사이에 차별이 존재하는 것은 사실이다.\n  그러나 현역병과 사회복무요원은 아래와 같은 차이점을 가지고 있으므로, 이 사건 규정이 현역병과 사회복무요원 사이의 형평을 고려하여 육군 현역병의 복무기간을 기준으로 정한 구 병역법 시행령 제151조의 기간을 상한으로 사회복무요원 복무기간을 공무원 재직기간에 산입하는 것에 합리적인 이유가 있다고 할 것이다. 따라서 사회복무요원이 현역병에 비하여 합리적인 근거가 없는 차별을 받고 있다고 볼 수 없다.\n  1) 현역병은 원칙적으로 군부대 내에서 거주하며 복무한다(병역법 제18조 제1항). 반면, 사회복무요원은 원칙적으로 출퇴근하며 복무한다(병역법 제31조 제4항).\n  2) 현역병은 일과표에 따라 기상ㆍ점호ㆍ국기게양 및 강하ㆍ식사ㆍ오전과업ㆍ오후과업ㆍ자율활동시간 및 취침 등의 일과를 수행한다(부대관리훈령 제40조 제1항, 제2항, 제3항). 반면, 사회복무요원은 일반적으로 국가공무원과 동일한 근무시간을 적용받아 점심시간을 제외하고 주 40시간을 근무한다(사회복무요원 복무관리 규정 제18조 제1항 제1호, 국가공무원 복무규정 제9조 제1항).\n  3) 현역병은 지상작전(육군), 상륙작전을 포함한 해상작전(해군), 상륙작전(해병대), 항공작전(공군)을 주임무로 하여 이를 위한 교육ㆍ훈련을 받고(국군조직법 제3조 제1항, 제2항, 제4항), 국토방위의 의무를 수행하여 그러한 과정에서 발생할 수 있는 각종 총기ㆍ폭발물 사고, 부상 등 위험에 노출되어 있다. 반면, 사회복무요원은 국가기관ㆍ지방자치단체ㆍ공공단체 등의 공익목적에 필요한 사회서비스업무, 행정업무 등의 지원업무를 수행하여(병역법 제26조 제1항) 현역병에 비하여 위험에의 노출 정도가 낮다.\n  다. 퇴직한 공무원이 다시 공무원으로 임용된 경우 공무원연금법 제25조 제2항에 따라 종전 재직기간 전부를 공무원 재직기간에 합산할 수 있는 반면, 사회복무요원으로 복무한 사람이 공무원으로 임용된 경우 이 사건 규정에 따라 사회복무요원 복무기간을 2년을 한도로 공무원 재직기간에 산입할 수 있어, 양자 사이에 차별이 존재하는 것은 사실이다.\n  그러나 공무원연금법 제25조 제2항은 공무원연금법, 군인연금법, 「사립학교교직원 연금법」을 적용받다가 퇴직한 공무원ㆍ군인 또는 사립학교교직원이 공무원으로 임용된 경우 종전의 해당 연금법에 따른 재직기간 또는 복무기간을 공무원 재직기간에 합산할 수 있도록 하는 것으로, 본인이 기여금을 납부하여 급여비용의 일부를 부담한 공적연금 사이의 연계를 통하여 공무원ㆍ군인 또는 사립학교교직원으로 재직한 전체 기간에 상응하는 연금을 수급할 수 있도록 하는 제도이다. 이와 달리 이 사건 규정은 사회복무요원 등이 기여금을 납부하지 않아 공적연금의 급여비용을 부담한 바 없음에도, 공무원으로 임용된 후 군복무를 한 사람과의 형평, 본인의 의사와 상관없이 징집ㆍ소집되어 일정한 기간 복무한 공로 등을 고려하여 사회복무요원 등의 복무기간을 공무원 재직기간에 산입할 수 있도록 혜택을 부여하는 제도이다.\n  이처럼 공무원연금법 제25조 제2항과 이 사건 규정의 입법 취지에 차이가 있는 점, 사회복무요원이 공무원과 달리 아무런 기여금을 부담하지 않는 점 등을 고려하면, 사회복무요원으로 복무한 후 공무원으로 임용된 사람이 공무원으로 근무하다가 퇴직한 후 다시 공무원으로 임용된 사람에 비하여 합리적인 근거가 없는 차별을 받고 있다고 볼 수 없다.\n  라. 원심은 판시와 같은 이유로, 이 사건 규정이 평등의 원칙에 위배되지 않는다고 판단하였다. 원심판단은 앞서 본 법리에 기초한 것으로서, 상고이유 주장과 같은 평등의 원칙에 관한 법리오해 등의 잘못이 없다.\n  5. 인간다운 생활을 할 권리 및 행복추구권 침해 주장에 관한 판단\n  가. 인간다운 생활을 할 권리 침해 여부\n  1) 헌법 규정에 따라 국민에게 주어진 사회보장에 따른 국민의 수급권은 국가에 적극적으로 급부를 요구할 수 있는 권리를 주된 내용으로 한다. 국가가 국민에게 인간다운 생활을 할 권리를 보장하기 위하여 사회보장수급권에 관한 입법을 할 경우에는 국가의 재정부담 능력, 전체적인 사회보장수준과 국민감정 등 사회정책적인 고려, 상충하는 국민 각 계층의 갖가지 이해관계 등 복잡 다양한 요소를 함께 고려해야 한다. 따라서 이에 관한 기준을 설정하는 데에는 입법부 또는 입법에 의하여 다시 위임을 받은 행정부 등 해당기관에 상대적으로 광범위한 재량이 있는 것으로 봄이 타당하다(대법원 2017. 7. 11. 선고 2015두2864 판결 참조).\n  국가가 인간다운 생활을 보장하기 위한 헌법적 의무를 다하였는지의 여부가 사법적 심사의 대상이 된 경우에는, 국가가 최저생활보장에 관한 입법을 전혀 하지 아니하였다든가 그 내용이 현저히 불합리하여 헌법상 용인될 수 있는 재량의 범위를 명백히 일탈한 경우에 한하여 헌법에 위반된다고 할 수 있다(헌법재판소 2012. 2. 23. 선고 2011헌마123 전원재판부 결정 참조).\n  2) 이 사건 규정은 사회복무요원의 복무기간을 공무원 재직기간에 산입하면서, 다만 현역병으로 복무한 사람 등과의 형평을 고려하여 육군 현역병의 복무기간을 초과하는 일부만을 산입 대상에서 제외하고 있다. 따라서 이 사건 규정이 사회복무요원으로 복무한 후 공무원으로 임용된 사람의 권리를 보장하기 위한 입법을 전혀 하지 않았다고 볼 수 없고, 입법 취지 등을 고려할 때 현저히 불합리하다고 볼 수도 없으므로, 인간다운 생활을 할 권리를 침해한다고 볼 수 없다.\n  3) 원심은 판시와 같은 이유로, 이 사건 규정이 인간다운 생활을 할 권리를 침해하지 않는다고 판단하였다. 원심판단은 앞서 본 법리에 기초한 것으로서, 상고이유 주장과 같은 인간다운 생활을 할 권리 침해 여부에 관한 법리오해 등의 잘못이 없다.\n  나. 행복추구권 침해 여부\n                 헌법 제10조의 행복추구권은 국민이 행복을 추구하기 위하여 필요한 급부를 국가에 적극적으로 요구할 수 있는 것을 내용으로 하는 것이 아니라, 국민이 행복을 추구하기 위한 활동을 국가권력의 간섭 없이 자유롭게 할 수 있다는 포괄적인 의미의 자유권으로서의 성격을 가진다(헌법재판소 2022. 2. 24. 선고 2019헌마883 전원재판부 결정 등 참조). \n  그런데 이 사건 규정은 사회복무요원 등의 복무기간을 공무원 재직기간에 산입하는 혜택에 관하여 정한 것이지 자유권의 제한에 관하여 정한 것이 아니므로, 행복추구권을 제한하는 내용을 담고 있다고 볼 수 없다.\n  원심은 판시와 같은 이유로, 이 사건 규정이 행복추구권을 침해하지 않는다고 판단하였다. 원심판단은 앞서 본 법리에 기초한 것으로서, 상고이유 주장과 같은 행복추구권 침해 여부에 관한 법리오해 등의 잘못이 없다.\n  6. 병역의무의 이행으로 인한 불이익한 처우 금지 원칙 위반 주장에 관한 판단\n  병역의무의 이행으로 인한 불이익한 처우를 금지한 헌법 제39조 제2항은 병역의무를 이행한 사람에게 보상조치를 취하거나 특혜를 부여할 의무를 국가에 지우는 것이 아니라 법문 그대로 병역의무의 이행을 이유로 불이익한 처우를 하는 것을 금지하고 있을 뿐이다(대법원 2006. 12. 21. 선고 2004두14748 판결 참조).\n  이 사건 규정은 사회복무요원 등으로 복무하였다가 공무원으로 임용된 사람들을 위하여 혜택을 부여하는 것일 뿐 병역의무의 이행을 이유로 불이익한 처우를 하는 것이 아니므로, 헌법 제39조 제2항에 위반된다고 볼 수 없다.\n  원심은 판시와 같은 이유로, 이 사건 규정이 헌법 제39조 제2항을 위반하지 않았다고 판단하였다. 원심판단은 앞서 본 법리에 기초한 것으로서, 상고이유 주장과 같은 병역의무의 이행으로 인한 불이익한 처우 금지 원칙에 관한 법리오해 등의 잘못이 없다.\n  7. 결론\n  상고를 기각하고 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 노경필(재판장) 이흥구(주심) 오석준 이숙연"

    "판결요지": "[1] 공직선거법 제110조 제2항에서 ‘선거운동’은 특정 선거에서 특정 후보자의 당선 또는 낙선을 도모한다는 목적의사가 객관적으로 인정될 수 있는 능동적이고 계획적인 행위를 말한다. 이에 해당하는지는 행위를 하는 주체의 의사가 아니라 외부에 표시된 행위를 대상으로 객관적으로 판단해야 한다.\n\n [2] 공직선거법 제110조 제2항에서 특정 지역ㆍ지역인 또는 성별을 비하ㆍ모욕하는 것과 정당ㆍ후보자 등과의 관련성이 인정되려면, 단순히 특정 지역ㆍ지역인 또는 성별을 비하ㆍ모욕하는 ‘행위’가 정당ㆍ후보자 등과 관련이 있는 것만으로는 부족하고, 특정 지역ㆍ지역인 또는 성별을 비하ㆍ모욕하는 표현의 ‘내용’ 자체가 정당ㆍ후보자 등과 직접적으로 관련이 있어서, 그로 인하여 특정 후보자의 선거에 영향을 미칠 수 있어야 한다.\n\n [3] 공직선거법 제110조 제2항에서 금지하는 비하ㆍ모욕인지가 문제 되는 표현이 다의적이거나 의미가 확정되지 않은 신조어인 경우, 그러한 표현을 한 경위 및 동기, 의도, 표현의 구체적인 내용과 맥락 등을 고려하여 그 용어의 의미를 먼저 확정한 후, 해당 조항에서 금지하는 비하ㆍ모욕적 표현에 해당하는지를 판단해야 한다.",

    "판례내용": "【원고, 상고인】                원고 (소송대리인 법무법인 혁신 담당변호사 박지환 외 1인)\n【피고, 피상고인】 대전광역시선거관리위원회\n【원심판결】  대전고법 2023. 4. 4. 선고 2022누10250 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 대전고등법원에 환송한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 준비서면의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요 \n  원심판결 이유 및 원심이 적법하게 채택하여 조사한 증거에 따르면, 다음의 사실을 알 수 있다.   \n  가. 원고는 여성 중심 인터넷 커뮤니티 사이트인 ‘○○○            (사이트 주소 생략)’를 운영하는 사람이다.\n  나. 피고는 2020. 4. 13. 원고에 대하여 ‘○○○’에 게시된 원심 판시 별지 1 정보 목록 기재 각 정보(이하 개별적으로 지칭할 때는 ‘이 사건 정보 1, 2 또는 3’이라 하고, 통칭할 때는 ‘이 사건 각 정보’라 한다)가 공직선거법 제110조 제2항에 위반된다는 이유로 구 공직선거법(2023. 12. 28. 법률 제19855호로 개정되기 전의 것) 제82조의4 제3항 및 공직선거관리규칙 제45조의3 제1항에 따라 이 사건 각 정보의 삭제를 요청하는 이 사건 처분을 하였다.\n  다. 제21대 국회의원선거의 선거일은 2020. 4. 15.이다. \n  2. 관련 법리\n  가. 공직선거법 제110조 제2항은 \"누구든지 선거운동을 위하여 정당, 후보자, 후보자의 배우자 또는 직계존비속이나 형제자매와 관련하여 특정 지역ㆍ지역인 또는 성별을 공연히 비하ㆍ모욕하여서는 아니 된다.\"라고 규정하여, ① 선거운동을 위하여, ② 정당, 후보자, 후보자의 배우자 또는 직계존비속이나 형제자매(이하 ‘정당ㆍ후보자 등’이라 한다)와 관련하여, ③ 특정 지역ㆍ지역인 또는 성별을 공연히 비하ㆍ모욕하는 행위를 금지하고 있다.\n  나.                공직선거법 제110조 제2항에서 ‘선거운동’은 특정 선거에서 특정 후보자의 당선 또는 낙선을 도모한다는 목적의사가 객관적으로 인정될 수 있는 능동적이고 계획적인 행위를 말한다. 이에 해당하는지는 행위를 하는 주체의 의사가 아니라 외부에 표시된 행위를 대상으로 객관적으로 판단하여야 한다(대법원 2018. 11. 29. 선고 2017도2972 판결 등 참조).\n  다.                공직선거법 제110조 제2항에서 특정 지역ㆍ지역인 또는 성별을 비하ㆍ모욕하는 것과 정당ㆍ후보자 등과의 관련성이 인정되려면, 단순히 특정 지역ㆍ지역인 또는 성별을 비하ㆍ모욕하는 ‘행위’가 정당ㆍ후보자 등과 관련이 있는 것만으로는 부족하고, 특정 지역ㆍ지역인 또는 성별을 비하ㆍ모욕하는 표현의 ‘내용’ 자체가 정당ㆍ후보자 등과 직접적으로 관련이 있어서, 그로 인하여 특정 후보자의 선거에 영향을 미칠 수 있어야 한다.\n  라.                공직선거법 제110조 제2항에서 금지하는 비하ㆍ모욕인지 여부가 문제 되는 표현이 다의적이거나 의미가 확정되지 않은 신조어인 경우, 그러한 표현을 한 경위 및 동기, 의도, 표현의 구체적인 내용과 맥락 등을 고려하여 그 용어의 의미를 먼저 확정한 후, 해당 조항에서 금지하는 비하ㆍ모욕적 표현에 해당하는지를 판단해야 한다(대법원 2022. 12. 15. 선고 2017도19229 판결 참조).\n  3. 원심의 판단\n  원심은, 공직선거법 제110조 제2항에서 특정 지역ㆍ지역인 또는 성별을 비하ㆍ모욕하는 행위와 정당ㆍ후보자 등과의 관련성을 해석하면서, 비하ㆍ모욕하는 행위가 정당ㆍ후보자 등과 관계가 있는 경우이면 충분하다고 보았다. 이어서 이러한 관계는 특정 정당ㆍ후보자 등을 지지ㆍ옹호한다는 이유로 특정 지역ㆍ지역인 또는 성별을 비하ㆍ모욕하는 행위뿐만 아니라 특정 정당ㆍ후보자 등을 지지ㆍ옹호하지 않는다는 이유로 특정 지역ㆍ지역인 또는 성별을 비하ㆍ모욕하는 행위에 있어서도 인정된다고 전제한 후, 이 사건 각 정보는 모두 특정 정당 소속 후보자 또는 특정 후보자의 당선 또는 낙선을 도모한다는 목적의사하에서 특정 정당ㆍ후보자 등과 관련하여 특정 성별을 비하ㆍ모욕한 것으로서 공직선거법 제110조 제2항을 위반하였다고 판단하였다.\n  4. 대법원의 판단\n  앞서 본 관련 법리에 비추어 보면, 이 사건 각 정보가 공직선거법 제110조 제2항을 위반하였다는 원심의 판단은 수긍할 수 없다. \n  가. 이 사건 정보 1에 관한 판단\n  1) 이 사건 정보 1의 전체적인 취지는 ‘제21대 국회의원선거에서 △△△당과 그 위성 정당 등 좌파 정당이 이기면 남북통합이 되어 대한민국이 없어질 수 있으므로 우파 정당에 투표해야 한다.’는 것이다. 좌파 정당에 반대하며 우파 정당에 대한 투표를 독려하는 내용으로 볼 수 있다. \n  2) 이 사건 정보 1의 내용과 게시된 시기, 장소 등을 종합하여 볼 때, 이 사건 정보 1을 게시한 행위는 제21대 국회의원선거에서 △△△당 및 그 위성 정당 소속 후보자들의 낙선을 도모한다는 목적의사가 객관적으로 인정된다.\n  3) 그러나 원심판결의 이유 및 기록에 의하여 인정되는 다음과 같은 사정에 비추어 보면, 이 사건 정보 1은 ‘정당ㆍ후보자 등과 관련하여 특정 성별을 공연히 비하ㆍ모욕’하는 내용이라고 볼 수 없다. 따라서 이 사건 정보 1은 공직선거법 제110조 제2항에 위반되는 정보에 해당하지 않는다.\n  가) 이 사건 정보 1의 제목 및 본문에서 사용된 ‘웜년’이라는 표현은 ‘○○○’의 줄임말인 ‘웜’과 여성을 낮잡아 이르는 말인 ‘년’의 합성어로, 여성 중심 인터넷 커뮤니티인 ‘○○○’의 회원을 지칭한다. 그런데 이 사건 정보 1의 게시자가 반대하는 △△△당 등은 ‘○○○’ 또는 그 회원과 직접적인 관련이 있는 정당이 아니므로, ‘웜년’이라는 표현이 △△△당 등의 선거에 영향을 미친다고 보기 어렵다. \n  나) 이 사건 정보 1의 본문에서 사용된 ‘□□□당’이라는 표현은 △△△당 또는 그 위성 정당과 관련된 합성어다. 그러나 위 표현은 문맥상 △△△당 등을 남성의 성기에 빗대어 표현하기 위하여 합성되었다기보다는 해당 정당에 대한 몹시 마음에 안 들거나 보기 싫은 감정을 나타내기 위하여 합성되었다고 보는 것이 자연스럽다. 또한 이 사건 정보 1의 게시자가 △△△당 등을 부정적으로 평가한 이유는 해당 정당의 성별과 관련한 특성 때문이 아니라 정치적 성향 때문이다. 이와 같은 사정들을 종합하여 보면, ‘□□□당’은 정당과 관련한 일반적 비하 표현이기는 하나, 특정 성별을 비하ㆍ모욕하는 표현이라고 보기는 어렵다.\n  다) 이 사건 정보 1의 본문에서 사용된 ‘자댕이’는 남성의 성기를 활용한 비속어로, 남성을 비하ㆍ모욕하는 표현에 해당한다. 그러나 위 표현은 이 사건 정보 1의 게시자가 공유한 영상들의 화자에 대한 내용이고, 특정 정당ㆍ후보자 등과 직접적으로 관련이 없으므로, △△△당 등의 선거에 영향을 미친다고 보기 어렵다. \n  나. 이 사건 정보 2에 관한 판단\n  1) 이 사건 정보 2는, 여야 비례대표국회의원후보자들 중 전과자가 많다는 기사를 소개하면서, 범죄전력이 있는 다수 중 여성인 두 후보자만의 전과를 부각시키고 그들의 사진을 사용한 기자 또는 언론사를 비난하는 취지이다.  \n  2) 이 사건 정보 2는 여성 후보자 두 사람에게 편향적인 기사를 작성한 기자 또는 언론사를 비판하는 내용으로, 두 후보자를 지지ㆍ옹호하거나 위 후보자들의 경쟁 후보자를 반대ㆍ배척하는 내용을 포함하고 있지 않다. 두 후보자는 성별이 여성으로 같을 뿐, 소속 정당도 다르다. 따라서 이 사건 정보 2를 게시한 행위는 두 후보자의 당선을 도모한다는 목적의사가 객관적으로 인정된다고 보기 어렵다.\n  3) 이 사건 정보 2의 본문에서 사용된 ‘부랄잡것’은 편향적인 기사를 작성한 기자 또는 언론사에 대하여 여성혐오적 남성이라고 비하ㆍ모욕하는 내용일 뿐, 특정 정당ㆍ후보자 등과 직접적으로 관련이 없으므로, 두 후보자의 선거에 영향을 미친다고 보기 어렵다.  \n  4) 따라서 이 사건 정보 2는 ‘선거운동을 위하여’, ‘정당ㆍ후보자 등과 관련하여’ 특정 성별을 공연히 비하ㆍ모욕하는 것이라고 볼 수 없으므로, 공직선거법 제110조 제2항에 위반되는 정보에 해당하지 않는다.\n  다. 이 사건 정보 3에 관한 판단\n  1) 이 사건 정보 3은, ◇◇◇당 소속 비례대표국회의원후보자의 선거유세를 돕던 당원에게 돌을 던진 신원 미상의 남성을 비난하는 취지이다.\n  2) 이 사건 정보 3은 제21대 국회의원선거에서 ◇◇◇당이나 해당 후보자를 지지ㆍ옹호하거나 위 정당 또는 후보자의 경쟁 정당 또는 후보자를 반대ㆍ배척하는 내용이라고 볼 수 없고, 여성 후보자의 선거운동 과정에서 여성을 상대로 하여 발생한 범죄 사건에 대한 분노와 가해자인 남성을 비판하는 의견을 표현한 것으로 평가할 수 있으므로, 이 사건 정보 3을 게시한 행위는 ◇◇◇당 소속 후보자들 또는 해당 후보자의 당선을 도모한다는 목적의사가 객관적으로 인정된다고 보기 어렵다.\n  3) 이 사건 정보 3의 제목 및 본문에서 사용된 ‘한남새끼’, ‘한남좆퀴벌레새끼’라는 표현은 한국 남성을 부정적으로 지칭하는 ‘한남’에 다른 사람을 욕하여 이르는 말인 ‘새끼’를 단독으로 합성하거나, 남성의 성기를 비속하게 이르는 말과 바퀴벌레를 함께 합성하여 남성을 비하ㆍ모욕하는 것이다. 그러나 이 표현들의 내용은 해당 후보자의 선거유세를 돕던 당원에게 돌을 던진 신원 미상의 남성에 대한 것이고, 특정 정당ㆍ후보자 등과 직접적으로 관련이 없으므로, ◇◇◇당 소속 후보자들 또는 해당 후보자의 선거에 영향을 미친다고 보기 어렵다. \n  4) 따라서 이 사건 정보 3은 ‘선거운동을 위하여’, ‘정당ㆍ후보자 등과 관련하여’ 특정 성별을 공연히 비하ㆍ모욕하는 것이라고 볼 수 없으므로, 공직선거법 제110조 제2항에 위반되는 정보에 해당하지 않는다.  \n  라. 소결\n  이 사건 각 정보는 공직선거법 제110조 제2항에 위반되는 정보에 해당하지 않으므로, 이 사건 처분은 그 처분사유가 인정되지 않는다.\n  그런데도 원심은 특정 지역ㆍ지역인 또는 성별을 비하ㆍ모욕하는 ‘행위’가 정당ㆍ후보자 등과 서로 관계가 있으면 정당ㆍ후보자 등과의 관련성이 인정된다는 전제에서, 이 사건 각 정보가 각각 공직선거법 제110조 제2항에 위반되므로, 이 사건 처분은 그 처분사유가 인정되어 적법하다고 판단하였다. 이러한 원심판단에는 공직선거법 제110조 제2항의 요건에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다.\n  5. 결론\n  원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 서경환(재판장) 신숙희 마용주(주심)"

    "판결요지": "구 도시 및 주거환경정비법(2021. 3. 16. 법률 제17943호로 개정되기 전의 것) 제74조 제1항 본문 전단에 따르면, 사업시행자는 분양신청기간이 종료된 때에는 분양신청의 현황을 기초로 ‘분양대상자별 분양예정인 대지 또는 건축물(이하 ‘분양예정자산’이라 한다)의 추산액’(제3호), ‘분양대상자별 종전의 토지 또는 건축물 명세 및 사업시행계획인가 고시가 있은 날을 기준으로 한 가격(이하 ‘종전자산 명세 및 가격’이라 한다)’(제5호) 등이 포함된 관리처분계획을 수립하여 시장ㆍ군수 등의 인가를 받아야 한다. 제74조 제3항(이하 ‘통지규정’이라 한다)에 따르면, 조합은 관리처분계획 수립 등을 의결하기 위한 총회 개최일부터 1개월 전에 위 각 사항 등을 각 조합원에게 문서로 통지하여야 한다.\n  위 통지규정에서 통지 의무를 부과하고 있는 사항인 ‘분양대상자별 분양예정자산의 추산액’과 ‘분양대상자별 종전자산 명세 및 가격’은 통지를 받는 해당 조합원에 관한 내용만을 의미하고, 다른 조합원 또는 분양대상자에 관한 내용까지 이에 포함된다고 볼 것은 아니다.",
    "참조조문": "구 도시 및 주거환경정비법(2021. 3. 16. 법률 제17943호로 개정되기 전의 것) 제74조 제1항, 제3항(현행 제74조 제5항 참조)",

    "판례내용": "【원고, 피상고인】                원고 (소송대리인 법무법인 센트로 담당변호사 김향훈 외 6인)\n【피고, 상고인】                ○○○재개발정비사업조합 (소송대리인 변호사 김용덕 외 5인)\n【원심판결】  서울고법 2022. 6. 9. 선고 2021누66434 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유(제출기간이 지난 상고이유보충서의 기재는 이를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 기록에 따르면 다음 사실을 알 수 있다.\n  가. 피고는 서울 성동구 (이하 생략) 일대에서 재개발사업을 시행하는 조합이고, 원고는 위 사업 구역 내 토지 등 소유자로서 피고의 조합원이다.\n  나. 피고는 관리처분계획의 수립을 의결하기 위한 총회의 개최일부터 1개월 전인 2018. 11. 7. 조합원 전원에게 분양예정인 대지 또는 건축물(이하 ‘분양예정자산’이라 한다)의 추산액과 종전의 토지 또는 건축물(이하 ‘종전자산’이라 한다) 명세 및 사업시행계획인가 고시가 있은 날을 기준으로 한 가격(이하 ‘가격’이라고만 한다)이 기재된 문서를 등기우편으로 발송하여 통지하였다. 위 문서에는 통지를 받은 조합원 자신에 관한 분양예정자산의 추산액과 종전자산 명세 및 가격만 기재되어 있었고, 다른 조합원들에 관한 내용은 기재되어 있지 않았다. \n  다. 피고는 2018. 12. 8. 이 사건 총회를 열어 이 사건 관리처분계획의 수립을 의결한 다음, 2018. 12. 10.부터 2019. 1. 24.까지 인가신청 예정인 이 사건 관리처분계획에 대한 공람을 실시하였는데, 위 공람서류에는 분양대상자 전원에 관한 분양예정자산의 추산액과 종전자산 명세 및 가격이 포함되어 있었다.\n  라. 성동구청장은 2019. 8. 30. 이 사건 관리처분계획을 인가ㆍ고시하였다.\n  2. 원심의 판단\n  가. 원고의 주장 요지는 다음과 같다.\n  구 「도시 및 주거환경정비법」(2021. 3. 16. 법률 제17943호로 개정되기 전의 것, 이하 ‘구 도시정비법’이라 한다) 제74조 제1항은 관리처분계획에 포함될 사항으로 ‘분양대상자별 분양예정자산의 추산액’과 ‘분양대상자별 종전자산 명세 및 가격’을 정하고 있고, 같은 조 제3항은 관리처분계획의 수립을 의결하기 위한 총회의 개최일부터 1개월 전에 위 각 사항을 각 조합원에게 문서로 통지하도록 정하고 있다. \n  조합원은 조합원들 사이의 상대적 출자비율의 공정성 등을 판단할 수 있어야 위 총회에서 실질적인 의결권을 행사할 수 있다. 따라서 위 조항들에서 각 조합원에게 통지하고 총회에서 의결하도록 정한 ‘분양대상자별 분양예정자산의 추산액’과 ‘분양대상자별 종전자산 명세 및 가격’은 통지를 받는 조합원 자신에 관한 내용뿐만 아니라 조합원 전원에 관한 내용 전부를 의미한다. \n  그런데 피고는 이 사건 총회에 앞서 각 조합원에게 해당 조합원에 관한 내용만 통지하고 다른 조합원들에 관한 내용을 통지하지 않은 채 이 사건 총회에서 관리처분계획을 의결하여 조합원들의 실질적인 의결권을 침해하였다. 따라서 그 의결에는 중대한 하자가 존재하므로, 이 사건 관리처분계획은 위법하여 취소되어야 한다.\n  나. 원심은 원고의 위와 같은 주장을 받아들여, 피고가 이 사건 총회 이전에 원고를 포함한 각 조합원에게 분양대상자 전원에 관한 분양예정자산의 추산액과 종전자산 명세 및 가격을 통지하지 않았고, 이로써 위 각 사항이 포함되지 않은 관리처분계획(안)을 이 사건 총회에서 안건으로 심의ㆍ표결하여 조합원들의 실질적인 의결권을 침해하였으므로, 그 의결에 중대한 하자가 있다고 판단하였다. 이에 따라 원심은 이 사건 관리처분계획의 취소를 구하는 원고의 청구를 인용하였다.\n  3. 대법원의 판단\n  가.                구 도시정비법 제74조 제1항 본문 전단에 따르면, 사업시행자는 분양신청기간이 종료된 때에는 분양신청의 현황을 기초로 ‘분양대상자별 분양예정자산의 추산액’(제3호), ‘분양대상자별 종전자산 명세 및 가격’(제5호) 등이 포함된 관리처분계획을 수립하여 시장ㆍ군수 등의 인가를 받아야 한다. 제74조 제3항(이하 ‘이 사건 통지규정’이라 한다)에 따르면, 조합은 관리처분계획 수립 등을 의결하기 위한 총회 개최일부터 1개월 전에 위 각 사항 등을 각 조합원에게 문서로 통지하여야 한다.\n  나. 이 사건 통지규정에서 통지 의무를 부과하고 있는 사항인 ‘분양대상자별 분양예정자산의 추산액’과 ‘분양대상자별 종전자산 명세 및 가격’은 통지를 받는 해당 조합원에 관한 내용만을 의미하고, 다른 조합원 또는 분양대상자에 관한 내용까지 이에 포함된다고 볼 것은 아니다. 그 구체적인 이유는 다음과 같다. \n  (1) 이 사건 통지규정은, 조합이 관리처분계획의 수립 등을 의결하기 위한 총회의 개최일부터 1개월 전에 ‘분양대상자별’ 분양예정자산의 추산액과 ‘분양대상자별’ 종전자산 명세 및 가격을 ‘각’ 조합원에게 문서로 통지하여야 한다고 규정하고 있다. ‘분양대상자별’과 ‘각’이라는 문언을 규정 전체의 맥락에 비추어 조화롭게 해석하면, 통지의 대상은 통지를 받는 조합원 자신에 관한 분양예정자산의 추산액과 종전자산 명세 및 가격이라고 보는 것이 자연스럽다. \n  (2) 일반적으로 회의체를 소집함에 있어서 그 소집통지에 포함될 회의의 목적사항은 구성원들의 회의참석에 관한 의사결정이나 준비를 가능하게 할 정도이면 충분하고, 달리 법령이나 정관 등에서 특별한 규정을 두고 있지 않는 한, 상정될 안건의 구체적 내용이나 그에 관한 판단자료까지 반드시 소집통지에 포함해야 하는 것은 아니다(대법원 2012. 8. 23. 선고 2010두13463 판결 참조). \n  관련 법령 등에 특별한 규정이 있다고 보이지 않는 이 사건에서, 이 사건 통지규정의 취지는 분양대상자 전원에 관한 해당 정보를 판단자료로 제공하도록 하기 위한 것이라기 보다는 개별 조합원이 감정평가를 통하여 추산된 자신의 분양예정자산과 종전자산의 가치 및 예상 분담금 액수에 관한 정보를 확인하기 위한 것으로 봄이 타당하다. 따라서 해당 정보들의 도출 경위나 안건의 성격에 비추어 관리처분계획(안)에 대한 동의 여부를 결정할 수 있는 내용을 통지하면 충분할 것으로 보인다. \n  (3) 구 도시정비법 제72조 제1항 제1호와 제2호에 따르면, 사업시행자는 분양신청을 위한 사전통지 시에도 토지 등 소유자에게 ‘분양대상자별’ 종전자산의 명세 및 가격과 ‘분양대상자별’ 분담금의 추산액을 통지하여야 한다. 분양신청 단계에서는 토지 등 소유자 전원의 구체적 분양신청 내역이나 결과가 수합될 수 없음을 고려하면, 위 사전통지 대상은 통지 상대방인 토지 등 소유자 자신의 종전자산의 명세 및 가격과 분담금의 추산액인 것으로 보인다. 같은 법률에서 사용되는 같은 용어는 특별한 사정이 없는 한 같은 의미로 해석하는 것이 바람직하므로, 이 사건 통지규정에 따른 통지 대상 또한 통지 상대방인 조합원 자신에 관한 내용으로 보는 것이 타당하다. \n  (4) 이 사건 통지규정은 각 조합원에게 문서로 통지하여야 할 사항에 ‘분양대상자의 주소 및 성명’(구 도시정비법 제74조 제1항 제2호)을 포함시키지 않고 있다. 분양대상자 전원에 관한 분양예정자산의 추산액과 종전자산 명세 및 가격을 각 조합원에게 통지하면서 다른 조합원들의 주소 등 정보를 배제하기는 쉽지 않아, 이 사건 통지규정이 위와 같은 정보가 포함된 다른 조합원들에 관한 내용까지 통지 대상으로 규정하고 있다고 보기 어렵다. \n  (5) 구 도시정비법 제124조 제1항 제5호와 같은 조 제4항에 따르면, 관리처분계획서 및 관련 자료는 공개 및 열람ㆍ복사의 대상이다. 조합원은 관리처분계획의 수립 등을 의결하기 위한 총회 전이라도 위 규정에 따라 다른 조합원들에 관한 분양예정자산의 추산액과 종전자산 명세 및 가격을 확인하여 다른 조합원들의 분양내역 및 출자비율의 공정성 등을 검토할 수 있다. 또한 구 도시정비법 제78조 제1항에 따르면, 사업시행자는 관리처분계획인가를 신청하기 전에 관계 서류의 사본을 30일 이상 토지 등 소유자에게 공람하게 하고 의견을 들어야 하며, 그 공람 대상에는 분양대상자 전원에 관한 분양예정자산의 추산액과 종전자산 명세 및 가격을 비롯한 관리처분계획의 내용이 포함된다.  \n  이처럼 구 도시정비법상 조합원으로서 관리처분계획(안)의 공정성을 검토하고 조합에 의견을 제출할 수 있는 제도가 마련되어 있으므로, 이 사건 통지규정의 통지 대상을 분양대상자 전원에 관한 분양예정자산의 추산액과 종전자산 명세 및 가격으로 해석해야 할 필요성이 크지 않다.\n  다. 그런데도 원심은, 이 사건 통지규정에 따른 통지 의무 사항인 ‘분양대상자별 분양예정자산의 추산액’과 ‘분양대상자별 종전자산 명세 및 가격’이 분양대상자 전원에 관한 내용을 의미한다는 잘못된 전제에서, 피고가 각 조합원에게 분양대상자 전원에 관한 분양예정자산의 추산액과 종전자산 명세 및 가격을 통지하지 않음으로써 조합원들의 실질적인 의결권을 침해하였다고 판단하였다. 이러한 원심에는 앞서 본 이 사건 통지규정에 따른 통지 의무 사항의 범위에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. \n  4. 결론\n  나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 신숙희(재판장) 노태악(주심) 마용주"
  },

    "판결요지": "주택법 제92조는 \"시ㆍ도지사는 제64조를 위반하여 분양권 등을 전매하거나 알선하는 자를 주무관청에 신고한 자에게 대통령령으로 정하는 바에 따라 포상금을 지급할 수 있다.\"라고 규정하고 있다. 위 규정의 위임을 받은 같은 법 시행령 제92조 제4항은 \"제3항에 따른 통지를 받은 신고자는 신청서에 다음 각 호의 서류를 첨부하여 시ㆍ도지사에게 포상금 지급을 신청할 수 있다. 이 경우 시ㆍ도지사는 신청일부터 30일 이내에 국토교통부령으로 정하는 지급기준에 따라 포상금을 지급하여야 한다.\"라고 규정하고 있고, 같은 법 시행규칙 제38조는 \"영 제92조 제4항에 따른 포상금은 1천만 원 이하의 범위에서 지급하되, 구체적인 지급 기준 및 지급 기준액은 [별표 4]와 같다(제3항).\", \"시ㆍ도지사는 다음 각 호의 어느 하나에 해당하는 경우에는 포상금을 지급하지 아니할 수 있다. 1. 신고받은 전매행위 또는 알선행위(이하 ‘부정행위’라 한다)가 언론매체 등에 이미 공개된 내용이거나 이미 수사 중인 경우, 2. 관계 행정기관이 사실조사 등을 통하여 신고받은 부정행위를 이미 알게 된 경우(제4항)\"라고 규정하고 있다.\n  한편 주택법 제92조에 따른 포상금 제도는 시민의 자발적 감시를 통해 위반행위를 억제하고 규제의 실효성을 강화하려는 목적을 가진 일종의 유인책으로서, 이에 따른 포상금 지급결정은 경제적 이익을 제공하는 수익적 행정행위에 해당한다.  \n  위와 같은 관련 법령의 체제ㆍ형식과 문언, 신고포상금 제도의 목적과 성질, 주택법 제92조가 포상금의 지급 여부에 관한 기준을 구체적으로 정하고 있지 않은 점 등을 종합하면, 주택법 제92조에 따른 포상금의 지급은 시ㆍ도지사에게 지급 여부에 관한 재량권이 부여되어 있는 재량행위에 해당한다. ‘시ㆍ도지사는 신청일부터 30일 이내에 국토교통부령으로 정하는 지급기준에 따라 포상금을 지급하여야 한다.’라고 규정한 주택법 시행령 제92조 제4항 후문은 주택법 제92조의 내용과 취지 및 위 법령의 개정 연혁 등에 비추어 볼 때, 포상금을 지급하기로 결정한 경우라면 포상금 지급신청을 받은 날부터 30일 이내에 지급을 완료하라는 취지로 해석된다.",
    "참조조문": "주택법 제92조, 주택법 시행령 제92조 제4항, 주택법 시행규칙 제38조 제3항, 제4항",
    "참조판례": "",
    "판례내용": "【원고, 피상고인】                원고            \n【피고, 상고인】 경기도지사 (소송대리인 법무법인(유한) 바른 담당변호사 손흥수 외 1인)\n【원심판결】  수원고법 2021. 10. 22. 선고 2021누12424 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 수원고등법원에 환송한다. \n\n【이    유】  상고이유를 판단한다. \n  1. 사안의 개요\n  원심판결의 이유 및 원심이 적법하게 채택하여 조사한 증거 등에 따르면 다음 사실을 알 수 있다.\n  가. 원고는 2015. 11. 27. 수도권의 아파트 분양권 불법전매 1,141건을 경기도, 서울특별시, 인천광역시 등에 신고하였다. \n  나. 피고는 2018. 6. 12. 원고에게 경기도에서 발생한 분양권 불법전매 중 원고의 위 신고에 따라 수사가 진행되어 형사처벌이 확정된 52건에 대하여 형사재판확정증명 통지를 하였다. \n  다. 원고는 2019. 6. 21. 피고에게 위 52건에 대한 신고포상금 8,500만 원의 지급을 구하는 신청을 하였으나, 피고는 2019. 7. 1. 다음과 같은 사유로 신고포상금 지급을 거부하였다(이하 ‘이 사건 처분’이라 한다).\n  1) 경기도는 2019년도 예산안에 신고포상금 예산을 계상한 바 있으나, 경기도의회에서 동 예산을 삭감함에 따라 신고포상금 예산을 확보하지 못하였다. \n  2) 신고포상금 지급 여부는 시ㆍ도지사의 재량사항으로 예산사정 등을 고려하여 지급하지 않거나 감액하여 지급할 수 있다는 법제처 법령해석, 앞으로도 예산 확보가 현실적으로 어려운 사정, 특정 1인에 대한 과도한 포상금 지급의 문제점 등을 종합적으로 고려하여 경기도에서는 신고포상금을 지급하지 않기로 결정하였다. \n  라. 원고는 2019. 7. 2. 이 사건 처분에 대하여 중앙행정심판위원회에 재결을 신청하였다. \n  마. 원고는 2020. 3. 20. 행정심판청구가 있은 날로부터 60일이 지나도 재결이 없는 때에 해당한다는 이유로 이 사건 처분의 취소 등을 구하는 이 사건 소를 제기하였다. \n  바. 중앙행정심판위원회는 2020. 11. 10. 원고의 청구를 모두 기각하는 재결을 하였다. \n  2. 제1 상고이유에 대한 판단 \n  앞서 본 사실관계를 관련 법리와 기록에 비추어 살펴보면, 원고는 제소기간을 준수하였다고 봄이 타당하고, 원심판단에 소송요건에 관하여 필요한 심리를 다하지 아니하는 등으로 판결에 영향을 미친 잘못이 없다. \n  3. 제3 상고이유에 대한 판단 \n  가. 어느 행정행위가 기속행위인지 재량행위인지는 당해 처분의 근거가 되는 규정의 체재ㆍ형식과 그 문언, 당해 행위가 속하는 행정 분야의 주된 목적과 특성, 당해 행위 자체의 개별적 성질과 유형 등을 모두 고려하여 개별적으로 판단하여야 한다. 재량행위에 대한 사법심사는 행정청의 재량에 기초한 공익 판단의 여지를 감안하여 법원이 독자적인 결론을 내리지 않고 해당 행위에 재량권 일탈ㆍ남용이 있는지 여부만을 심사하게 되고, 사실오인과 비례ㆍ평등의 원칙 위반 여부 등이 그 판단 기준이 된다(대법원 2018. 10. 4. 선고 2014두37702 판결, 대법원 2020. 6. 4. 선고 2015두39996 판결 등 참조).\n  나.                주택법 제92조는 \"시ㆍ도지사는 제64조를 위반하여 분양권 등을 전매하거나 알선하는 자를 주무관청에 신고한 자에게 대통령령으로 정하는 바에 따라 포상금을 지급할 수 있다.\"라고 규정하고 있다. 위 규정의 위임을 받은 같은 법 시행령 제92조 제4항은 \"제3항에 따른 통지를 받은 신고자는 신청서에 다음 각 호의 서류를 첨부하여 시ㆍ도지사에게 포상금 지급을 신청할 수 있다. 이 경우 시ㆍ도지사는 신청일부터 30일 이내에 국토교통부령으로 정하는 지급기준에 따라 포상금을 지급하여야 한다.\"라고 규정하고 있고, 같은 법 시행규칙 제38조는 \"영 제92조 제4항에 따른 포상금은 1천만 원 이하의 범위에서 지급하되, 구체적인 지급 기준 및 지급 기준액은 [별표 4]와 같다(제3항).\", \"시ㆍ도지사는 다음 각 호의 어느 하나에 해당하는 경우에는 포상금을 지급하지 아니할 수 있다. 1. 신고받은 전매행위 또는 알선행위(이하 ‘부정행위’라 한다)가 언론매체 등에 이미 공개된 내용이거나 이미 수사 중인 경우, 2. 관계 행정기관이 사실조사 등을 통하여 신고받은 부정행위를 이미 알게 된 경우(제4항)\"라고 규정하고 있다.\n  한편 주택법 제92조에 따른 포상금 제도는 시민의 자발적 감시를 통해 위반행위를 억제하고 규제의 실효성을 강화하려는 목적을 가진 일종의 유인책으로서, 이에 따른 포상금 지급결정은 경제적 이익을 제공하는 수익적 행정행위에 해당한다.  \n  위와 같은 관련 법령의 체제ㆍ형식과 문언, 신고포상금 제도의 목적과 성질, 주택법 제92조가 포상금의 지급 여부에 대한 기준을 구체적으로 정하고 있지 않은 점 등을 종합하면, 주택법 제92조에 따른 포상금의 지급은 시ㆍ도지사에게 지급 여부에 관한 재량권이 부여되어 있는 재량행위에 해당한다. ‘시ㆍ도지사는 신청일부터 30일 이내에 국토교통부령으로 정하는 지급기준에 따라 포상금을 지급하여야 한다.’라고 규정한 주택법 시행령 제92조 제4항 후문은 주택법 제92조의 내용과 취지 및 위 법령의 개정 연혁 등에 비추어 볼 때, 포상금을 지급하기로 결정한 경우라면 포상금 지급신청을 받은 날부터 30일 이내에 지급을 완료하라는 취지로 해석된다. \n  다. 그런데도 원심은 이와 달리 주택법 제92조에 따른 분양권 전매 등의 신고에 대한 시ㆍ도지사의 신고포상금 지급이 기속재량행위에 해당한다고 보아 그 판시와 같은 이유를 들어 이 사건 처분이 위법하다고 판단하였다. 이러한 원심판단에는 재량행위에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있고, 이를 지적하는 피고의 이 부분 상고이유 주장은 이유 있다. \n  4. 파기 범위 \n  위와 같은 이유로 원심판결 중 주위적 청구 부분을 파기하는 이상, 이와 불가분적으로 결합된 예비적 청구 부분도 함께 파기한다. \n  5. 결론 \n  나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 노태악(재판장) 서경환 신숙희(주심) 마용주"

    "판례내용": "【원고, 상고인】                원고 (소송대리인 변호사 김의식)\n【피고, 피상고인】 남양주세무서장\n【원심판결】  서울고법 2025. 6. 26. 선고 2024누41306 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다.\n\n【이    유】  상고이유(제출기간이 지난 서면은 이를 보충하는 범위 내에서)를 판단한다.\n  1. 과세전적부심사의 기회를 부여하지 아니한 과세처분의 적법성에 관하여\n  국세기본법 및 국세기본법 시행령이 과세예고통지의 대상으로 삼고 있지 않다거나 과세전적부심사를 거치지 않고 곧바로 과세처분을 할 수 있는 예외사유로 정하고 있는 등의 특별한 사정이 없음에도 불구하고, 과세관청이 과세처분에 앞서 필수적으로 행하여야 할 과세예고통지를 하지 않거나 과세예고통지 후 과세전적부심사 청구나 그에 대한 결정이 있기도 전에 과세처분을 함으로써 납세자에게 과세전적부심사의 기회를 부여하지 아니한 채 과세처분을 하였다면, 이는 납세자의 절차적 권리를 침해한 것으로서 과세처분의 효력을 부정하는 방법으로 통제할 수밖에 없는 중대한 절차적 하자가 존재하는 경우에 해당하므로, 그 과세처분은 위법하다(대법원 2016. 4. 15. 선고 2015두52326 판결, 대법원 2016. 12. 27. 선고 2016두49228 판결 등 참조).\n                 국세기본법 제81조의15 제3항 각 호는 긴급한 과세처분의 필요가 있거나 형사절차상 과세관청이 반드시 과세처분을 할 수밖에 없는 등의 일정한 사유가 있는 경우에는 과세전적부심사를 거치지 않아도 된다고 규정하면서, 이러한 예외사유 가운데 하나로 ‘과세예고통지를 하는 날부터 국세부과 제척기간의 만료일까지의 기간이 3개월 이하인 경우’(제3호)를 들고 있다. 그러나 과세관청이 정당한 사유 없이 스스로 과세행정을 장기간 해태하여 부과제척기간 만료일이 임박한 시점에야 뒤늦게 과세예고통지를 함으로써 납세자로부터 과세전적부심사의 기회를 박탈하기에 이른 경우에는, 과세관청이 납세자에게 과세전적부심사의 기회를 부여하지 아니한 채 과세처분을 할 수 있는 예외사유에 해당한다고 할 수 없다. 과세예고통지가 부과제척기간 만료일부터 3개월이 남지 않은 시점에 이루어지기만 하면 아무런 제한 없이 과세전적부심사를 생략할 수 있다고 볼 경우, 과세관청이 임의로 부과제척기간 만료일이 임박한 시점에 과세예고통지를 함으로써 과세전적부심사를 회피할 수 있을 뿐 아니라, 과세전적부심사에 관한 납세자의 절차적 권리가 과세관청의 선택에 의하여 좌우되는 부당한 결과를 초래하기 때문이다.\n  따라서 과세관청이 국세기본법 제81조의15 제3항 제3호의 사유를 들어 납세자에게 과세전적부심사의 기회를 부여하지 아니한 채 과세처분으로 나아간 것이 절차상 정당성을 갖추었다고 하려면, 과세관청의 귀책사유 없이 부득이한 사정으로 부과제척기간의 만료일이 임박하게 되었고 이로 인하여 부과제척기간의 만료 전까지 과세전적부심사를 거칠 시간적 여유가 없게 되었다는 등의 정당한 사유가 추가로 인정되어야 하고, 이에 관하여는 과세관청이 증명하여야 한다(대법원 2025. 6. 5. 선고 2025두33014 판결 등 참조).\n  2. 판단\n  원심은, 국세기본법 제81조의15 제3항 제3호에 따르면 과세예고통지를 하는 날을 기준으로 국세부과 제척기간의 만료일까지의 기간이 3개월 이하인 이상 과세전적부심사를 생략할 수 있고, 과세관청의 귀책사유 유무나 정도를 고려하는 것은 적절하지 않다는 등의 이유로, 이 사건 처분이 과세전적부심사의 기회를 박탈하여 절차적으로 위법하다는 원고의 주장을 배척하였다. \n  그러나 앞서 본 법리에 비추어 살펴보면, 원심으로서는 그 판시와 같은 사유만으로 원고의 위 주장을 배척할 것이 아니라, 과세관청의 귀책사유 없이 부득이한 사정으로 부과제척기간의 만료일이 임박하게 되었고 그로 인하여 부과제척기간의 만료 전까지 과세전적부심사를 거칠 시간적 여유가 없게 되었다는 등의 정당한 사유에 관하여 심리를 하였어야 한다. 원심의 이러한 판단에는 국세기본법 제81조의15 제3항 제3호에 관한 법리를 오해하고 필요한 심리를 다하지 아니함으로써 판결에 영향을 미친 잘못이 있다(한편 원심이 들고 있는 대법원 2025. 2. 13. 선고 2023두41659 판결은 그 판시와 같은 맥락으로 원용하는 것은 적절한 것으로 보이지 아니한다).\n  3. 결론\n  원심판결을 파기하고 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 신숙희(재판장) 노태악(주심) 서경환 마용주"

    "판결유형": "판결",
    "판시사항": "[1] 온천법 제12조 제4항에서 정한 굴착허가 제외사유 중 제3호 (가)목의 적용을 제외하는 괄호의 ‘온천수 추가 확보를 위하여 기존 온천공에 부수하여 굴착허가를 신청한 경우’ 이른바 보조공을 위한 굴착허가에 해당하는지 판단하는 방법 및 그에 관한 증명책임의 소재(=신청자)\n\n[2] 온천발견신고가 수리된 기존 온천공의 소유자가 그 온천공의 이른바 보조공을 위한 굴착허가를 신청하였으나, 그 굴착 신청지로부터 수평거리 1,000m 이내에 온천발견신고가 수리된 타인 소유의 기존 온천공이 존재하는 경우, 시장·군수가 굴착허가를 할 수 있는지 여부(원칙적 소극)",

    "참조판례": "",
    "판례내용": "【원고, 상고인】                원고 (소송대리인 법무법인(유한) 율촌 외 1인)\n【피고, 피상고인】 포항시장 (소송대리인 변호사 이정환)\n【피고보조참가인】                피고보조참가인            \n【원심판결】  대구고법 2022. 9. 30. 선고 2022누2351 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 보조참가로 인한 부분을 포함하여 원고가 부담한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 후에 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요 \n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 다음과 같은 사실을 알 수 있다. \n  가. 포항시 북구 ○○면 △△리, □□리 일원 ○○온천원보호지구의 온천관리대장에 따르면, 피고는 1992. 12. 15. 2호공(위 △△리 (지번 1 생략) 소재) 및 3호공(위 △△리 (지번 2 생략) 소재)에 관한 이정길의 온천발견신고를 수리하였고, 2002. 5. 27. 4호공(위 △△리 (지번 3 생략) 소재)에 관한 피고 보조참가인(이하 ‘참가인’이라 한다)의 온천발견신고를 수리하였는데, 현재 2호공 소재 토지의 소유자는 원고이고, 3, 4호공 소재 토지의 소유자는 참가인이다.\n  나. 원고는 2020. 9. 7. 피고로부터 포항시 북구 ○○면 △△리 (지번 4 생략)(이하 ‘이 사건 신청지’라 한다)에 굴착 심도 300m, 허가기간 2020. 9. 4.부터 1년 등을 내용으로 하는 온천굴착허가(이하 ‘이 사건 종전허가’라 한다)를 받았다. \n  다. 원고는 2021. 1. 27. 이 사건 종전허가의 굴착 심도를 1,000m로 변경하는 등의  내용을 담은 굴착변경허가를 신청(이하 ‘이 사건 신청’이라 한다)하였다. 피고는 2021. 2. 3. 및 2021. 3. 10. 원고에게 기존 온천공인 3, 4호공 소재 토지의 소유권 증빙서류 또는 그 토지소유자의 굴착동의서를 제출해달라는 내용의 보완요구를 하였다. \n  라. 피고는 원고가 위 각 요구에 따르지 않자, 2021. 4. 2. ‘온천법 담당부서인 행정안전부에 대한 질의회신 결과, 보조공 굴착허가와 관련하여 굴착 신청지로부터 1,000m 이내에 타인 소유 온천공이 존재할 경우 굴착허가를 허용하는 것은 타당하지 않다고 회신되었다. 이러한 사유로 피고는 원고에게 3, 4호공 소재 토지의 소유권 증빙서류 제출을 수차례 요구하였으나 제출되지 않았다.’는 이유로 이 사건 신청을 불허(이하 ‘이 사건 처분’이라 한다)하였다.\n  2. 이 사건 처분사유의 확정 및 심판 범위에 관한 판단 \n  가. 행정청이 문서에 의하여 처분을 한 경우 원칙적으로 그 처분서의 문언에 따라 어떤 처분을 하였는지를 확정하여야 한다. 그러나 처분서의 문언만으로는 행정청이 어떤 처분을 하였는지 불분명하다는 등 특별한 사정이 있는 때에는 처분 경위, 처분청의 진정한 의사, 처분을 전후한 상대방의 태도 등 다른 사정을 고려하여 처분서의 문언과 달리 그 처분의 내용을 해석할 수도 있다(대법원 2010. 2. 11. 선고 2009두18035 판결, 대법원 2020. 9. 3. 선고 2020두34070 판결 등 참조). \n  행정소송에서도 당사자주의나 변론주의의 기본 구도는 여전히 유지된다고 할 것이므로, 새로운 사유를 인정하여 행정처분의 정당성 여부를 판단하는 것은 당초의 처분사유와 기본적 사실관계에 있어서 동일성이 인정되는 한도 내에서만 허용된다(대법원 2009. 5. 28. 선고 2008두6394 판결, 대법원 2011. 1. 13. 선고 2010두21310 판결 등 참조). \n  나. 온천법 제12조는, 제1항에서 온천수를 솟아나게 할 목적으로 토지를 굴착하려는 자는 시장·군수로부터 굴착허가를 받아야 한다고 정하면서, 제4항에서 허가의 제외 사유를 들고 있다. 그중 제3호 (가)목은 ‘시장·군수는 굴착 신청지가 기존 온천공과 수평거리 1,000m 이내인 경우’를 규정하되, 다만 이른바 보조공을 위한 굴착허가 신청의 경우 즉, 온천수 추가 확보를 위하여 기존 온천공에 부수하여 굴착허가를 신청한 경우는 제외한다고 규정하고 있다(이하 ‘이 사건 거리 규정’이라 한다). \n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하여 알 수 있는 이 사건 처분서의 문언, 이 사건 종전허가 및 이 사건 처분의 경위, 위 각 처분을 전후한 원고의 태도 등을 종합하면, 이 사건 처분사유는 이 사건 신청이 이 사건 거리 규정에서 말하는 보조공을 위한 굴착허가 신청에 해당함을 인정하면서도, 다만 이 사건 신청지로부터 1,000m 이내에 온천발견신고가 수리된 참가인 소유의 3, 4호공이 존재하는데도 참가인으로부터 굴착 동의를 받지 못하였다는 것이다. 따라서 이 사건 처분의 정당성 여부는 위와 같은 처분사유와 기본적 사실관계에 있어 동일성이 인정되는 한도 내에서 판단되어야 한다. \n  3. 이 사건 처분의 정당성 여부에 관한 판단 \n  가. 관련 법리\n  1)                온천법 제12조의 내용과 취지, 온천법이 정한 온천개발절차 및 보조공의 역할과 기능 등에 비추어 보면, 보조공을 위한 굴착허가 신청에 해당하는지 여부는 기존 온천공 소재 토지와 보조공 굴착 대상 토지의 위치, 형태, 형질, 구조의 차이, 기존 온천공 굴착 이후 온천개발·이용 경과, 기존 온천공 굴착과 보조공 굴착의 시간적 간격, 새로 굴착을 하려는 동기 등 여러 사정을 종합해서 판단하여야 하고, 그에 관한 증명책임은 보조공을 위한 굴착허가를 신청한 자에게 있다.\n  2) 온천발견신고가 수리된 기존 온천공의 소유자가 그 온천공의 보조공을 위한 굴착허가를 신청하였더라도, 그 굴착 신청지로부터 수평거리 1,000m 이내에 온천발견신고가 수리된 타인 소유의 기존 온천공이 존재하는 경우, 시장·군수는 그 타인의 굴착 동의가 있다는 등의 특별한 사정이 없는 한 굴착허가를 할 수 없다. 그 구체적 이유는 다음과 같다. \n  가) 이 사건 거리 규정이 보조공을 위한 굴착허가 신청에 대해 굴착허가 제한사유인 ‘기존 온천공과 수평거리 1,000m 이내인 경우’의 적용을 제외한 취지는, 보조공은 주된 온천공에 종속하여 그 기능이나 효용을 강화 또는 보충하는 보조적인 역할을 하므로 그 주된 온천공과의 관계에서 거리 제한을 둘 필요가 없기 때문이다. 그런데 가까운 거리에 소유자를 달리하는 온천발견신고가 수리된 복수의 기존 온천공이 있는 경우에는, 그중 어느 하나의 기존 온천공에 대하여 위와 같은 역할을 하는 보조공인 온천공이라고 해도 타인 소유의 다른 기존 온천공과의 관계에서는 곧바로 그러한 역할을 하는 보조공이라고 평가할 수 없다. 따라서 이 사건 거리 규정이 타인 소유의 기존 온천공과의 관계에서도 아무런 제한 없이 자신 소유의 기존 온천공에 대한 보조공 굴착을 허용하는 의미라고 해석할 수 없다.\n  나) 온천법은 이 사건 거리 규정에서 기존 온천공으로부터 수평거리 1,000m 이내에서의 굴착을 제한하고 있을 뿐만 아니라, 제22조 제1항 제1호에서 ‘시장·군수는 기존 온천공과 발견신고공의 수평거리가 1,000m 이내인 경우 온천발견신고를 수리할 수 없다.’고 규정하고 있다. 이는 무분별한 난개발을 방지하여 온천에 대한 적절한 보호를 도모할 뿐만 아니라, 온천 개발을 위하여 비용과 노력을 투입한 온천발견자의 권리를 보장하는 데 그 취지가 있다. 따라서 온천발견신고가 수리된 온천공 소유자의 온천에 관한 권리나 이익이 타인에 의해 침해되지 않도록 이 사건 거리 규정을 해석하는 것이 위와 같은 취지에 부합한다. \n  다) 동일한 온천원보호지구 내의 가까운 거리에 온천발견신고가 수리된 복수의 온천공이 각각 소유자를 달리하게 된 상황에서 어느 일방이 타인의 온천공과의 거리에 관계없이 임의로 자신 소유의 온천공을 위한 보조공을 굴착할 수 있다고 한다면, 토지의 무분별한 굴착과 온천공을 둘러싼 계속된 분쟁을 야기할 수 있다. 이러한 점에서 온천발견신고가 수리된 타인 소유의 온천공으로부터 수평거리 1,000m 이내에 있는 토지에 대한 굴착은, 설령 자신 소유의 온천공에 대한 보조공을 위한 굴착이라고 하더라도 그 타인의 동의가 있다는 등의 특별한 사정이 없는 한 허용될 수 없다고 이 사건 거리 규정을 해석할 필요가 있다.\n  나. 이 사건에 관한 판단 \n  1) 원심은, 이 사건 신청은 이 사건 거리 규정에서 정한 보조공을 위한 굴착허가 신청에 해당한다고 볼 수 없으므로 피고로서는 반드시 이 사건 신청에 따른 변경허가를 해야 하는 것은 아니라고 보았다. 나아가 원심은, 이 사건 신청지로부터 수평거리 1,000m 이내에 참가인 소유의 기존 온천공인 3, 4호공이 존재한다는 온천법상의 불허가사유가 있고, 이 사건 신청을 허가함으로써 또 다른 분쟁이 발생할 수도 있으므로 피고는 원고에게 기존 온천공인 3, 4호공 소재 토지의 소유권을 확보하거나, 그 토지소유자인 참가인으로부터 굴착동의서를 받아 제출할 것을 요구할 수 있다고 봄이 타당하다는 등의 이유를 들어, 이 사건 처분은 적법하다고 판단하였다.\n  2) 앞서 본 사실관계를 관련 법리에 비추어 살펴보면, 이 사건 신청지로부터 수평거리 1,000m 이내에 온천발견신고가 수리된 참가인 소유의 기존 온천공인 3, 4호공이 존재하고 있고, 원고가 참가인으로부터 2호공의 보조공을 위한 굴착 동의를 받았다는 등의 특별한 사정이 없으므로, 피고는 이 사건 신청을 허가할 수 없다. 따라서 이 사건 처분사유의 존재가 인정되므로, 이 사건 처분은 적법하다. \n  원심이 이 사건 처분사유와 기본적 사실관계에 있어서 동일성이 인정되지 않는 새로운 처분사유인 이 사건 신청이 보조공을 위한 굴착허가 신청에 해당한다고 볼 수 없다는 점을 들어 이 사건 처분의 정당성 여부를 판단한 것은 잘못이나, 이 사건 신청지로부터 수평거리 1,000m 이내에 참가인 소유의 기존 온천공인 3, 4호공이 존재한다는 점 등을 들어 이 사건 처분이 적법하다고 본 원심의 결론은 정당하고, 위와 같은 원심판단의 잘못은 판결 결과에 영향이 없다. \n  4. 결론 \n  상고를 기각하고 상고비용은 보조참가로 인한 부분을 포함하여 패소자가 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 서경환(재판장) 노태악 신숙희 마용주(주심)"

    "참조조문": "[1] 구 도시 및 주거환경정비법(2018. 1. 16. 법률 제15356호로 개정되기 전의 것) 제74조 제1항, 제3항(현행 제74조 제5항 참조) / [2] 행정소송법 제8조 제2항, 민사소송법 제208조 / [3] 행정소송법 제1조[행정처분일반], 제19조",

    "판례내용": "【원고(선정당사자), 상고인】                원고(선정당사자) 6            \n【원고, 상고인】                원고 4 외 1인 (소송대리인 변호사 윤영현 외 7인)\n【피고, 피상고인】                ○○○주택재개발정비사업조합 (소송대리인 법무법인(유한) 광장 담당변호사 김범준 외 3인)\n【원심판결】  서울고법 2022. 9. 7. 선고 2021누36440 판결         \n【주    문】\n  상고를 모두 기각한다.  상고비용은 원고(선정당사자) 및 원고들이 부담한다.\n\n【이    유】  상고이유를 판단한다.\n  1. 통지의 하자에 관하여 \n  가.                구 「도시 및 주거환경정비법」(2018. 1. 16. 법률 제15356호로 개정되어 2018. 7. 17. 시행되기 전의 것, 이하 ‘구 도시정비법’이라 한다) 제74조 제1항 본문 전단에 따르면, 사업시행자는 분양신청기간이 종료된 때에는 분양신청의 현황을 기초로 ‘분양대상자별 분양예정인 대지 또는 건축물의 추산액’(제3호), ‘분양대상자별 종전의 토지 또는 건축물 명세 및 사업시행계획인가 고시가 있은 날을 기준으로 한 가격’(제5호) 등이 포함된 관리처분계획을 수립하여 시장·군수 등의 인가를 받아야 한다. 그리고 같은 조 제3항(이하 ‘이 사건 통지규정’이라 한다)에 따르면, 조합은 관리처분계획의 수립 등을 의결하기 위한 총회의 개최일부터 1개월 전에 위 각 사항 등을 각 조합원에게 문서로 통지하여야 한다.\n  이 사건 통지규정에서 통지 의무를 부과하고 있는 사항인 ‘분양대상자별 분양예정인 대지 또는 건축물의 추산액’과 ‘분양대상자별 종전의 토지 또는 건축물 명세 및 사업시행계획인가 고시가 있은 날을 기준으로 한 가격’은 통지를 받는 해당 조합원에 관한 내용만을 의미하고, 다른 조합원 또는 분양대상자에 관한 내용은 이에 포함되지 않는다고 봄이 타당하다.\n  한편 판결서의 이유에는 주문이 정당하다는 것을 인정할 수 있을 정도로 당사자의 주장, 그 밖의 공격·방어방법에 관한 판단을 표시하면 되고 당사자의 모든 주장이나 공격·방어방법에 관하여 판단할 필요가 없다(행정소송법 제8조 제2항, 민사소송법 제208조). 따라서 법원의 판결에 당사자가 주장한 사항에 대한 구체적·직접적인 판단이 표시되어 있지 아니하더라도 판결 이유의 전반적인 취지에 비추어 그 주장을 인용하거나 배척하였음을 알 수 있는 정도라면 판단누락이라고 할 수 없고, 설령 실제로 판단을 하지 아니하였더라도 그 주장이 배척될 경우임이 분명한 때에는 판결 결과에 영향이 없어 판단누락의 위법이 있다고 할 수 없다(대법원 2013. 3. 28. 선고 2010두20805 판결 등 참조).\n  나. 원심은 제1심판결을 인용하여, 피고가 이 사건 관리처분계획의 수립을 의결하기 위한 2018. 4. 16. 자 총회의 개최일부터 1개월 전인 2018. 3. 15. ‘분양대상자별 분양예정인 대지 또는 건축물의 추산액’, ‘분양대상자별 종전의 토지 또는 건축물 명세 및 사업시행계획인가 고시가 있은 날을 기준으로 한 가격’ 등 이 사건 통지규정에 규정된 사항들을 각 조합원에게 통지하였다고 보아, 그 통지의 하자로 이 사건 관리처분계획이 위법하다는 원고(선정당사자) 및 원고들의 주장을 배척하였다.\n  이러한 원심의 판단에는, 위와 같은 통지 당시 통지받는 조합원 개인에 관한 위 각 사항만이 통지되고 다른 조합원을 포함한 분양대상자 전원에 관한 위 각 사항이 통지되지 않았으므로 그 통지에 하자가 있어 이 사건 관리처분계획이 위법하다는 원고들의 주장을 배척하는 취지도 포함되어 있다. 설령 원심이 이에 관하여 판단하지 않았다고 하더라도, 앞서 본 법리에 따라 원고들의 위 주장은 배척될 수밖에 없음이 분명하므로, 그러한 사정이 판결 결과에 영향을 미쳤다고 할 수도 없다. 따라서 원심의 판단에 상고이유 주장과 같이 통지의 하자에 대하여 판단을 누락하는 등의 잘못이 없다. \n  2. 공동주택 배정 절차 또는 주택 분양순위의 하자에 관하여 \n  구 도시정비법 제74조 제4항, 구 「도시 및 주거환경정비법 시행령」(2022. 12. 9. 대통령령 제33046호로 개정되기 전의 것) 제63조 제1항 제7호에 따르면, 주택 및 부대시설·복리시설의 공급순위는 기존의 토지 또는 건축물의 가격을 고려하여 정하고, 이 경우 그 구체적인 기준은 시·도조례로 정할 수 있다. 구 「서울특별시 도시 및 주거환경정비조례」(2018. 7. 19. 서울특별시조례 제6899호로 전부 개정되기 전의 것) 제30조 제1항 제3호에 따르면, 동일규모의 주택분양에 경합이 있는 경우에는 권리가액이 많은 순으로 분양한다.\n  원심은, 분양신청자가 건립세대수를 초과한 특정 평형에 대하여 해당 평형을 1순위로 분양신청한 조합원들뿐만 아니라 2순위, 3순위로 분양신청한 조합원들까지 경합을 인정하여 권리가액이 많은 순으로 공동주택을 배정한 것이 위법하거나 이에 관한 안내가 불충분하여 위법하다는 원고(선정당사자) 및 원고들의 주장에 대하여, 이러한 공동주택 배정은 위 각 법령에 따른 것이고 피고의 분양신청 안내가 불충분하였다고 보기 어렵다는 이유로 그 주장을 배척하였다.\n  관련 규정과 법리 및 원심이 적법하게 채택하여 조사한 증거들에 비추어 보면, 원심판단에 상고이유 주장과 같은 공동주택 배정 절차 또는 주택 분양순위에 관한 법리오해 등의 잘못이 없다. \n  3. 취소의 범위에 관하여\n  외형상 하나의 행정처분이라 하더라도 가분성이 있거나 그 처분대상의 일부가 특정될 수 있다면 일부만의 취소도 가능하고 그 일부의 취소는 당해 취소부분에 관하여 효력이 생긴다(대법원 1995. 11. 16. 선고 95누8850 전원합의체 판결, 대법원 2015. 3. 26. 선고 2012두20304 판결 등 참조). \n  원심은, 이 사건 관리처분계획 중 상가 부분은 나머지 부분과 분리하는 것이 가능하고 나머지 부분은 독립된 처분으로서 유효하게 존속할 수 있으므로 위 상가 부분만을 취소함이 타당하다고 보아, 이 사건 관리처분계획 중 상가 부분의 하자를 이유로 그 관리처분계획 전부가 취소되어야 한다는 원고(선정당사자) 및 원고들의 주장을 배척하였다.\n  원심판단은 앞서 본 법리에 기초한 것으로서, 상고이유 주장과 같은 관리처분계획의 전부 취소에 관한 법리오해 등의 잘못이 없다. \n  4. 결론\n  상고를 모두 기각하고 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 노경필(재판장) 이흥구(주심) 오석준 이숙연"
  },

    "참조조문": "대한민국과 미합중국간의 소득에 관한 조세의 이중과세 회피와 탈세방지 및 국제무역과 투자의 증진을 위한 협약 제2조 제2항, 제6조 제3항, 제14조 제4항 제a호, 구 법인세법(2018. 12. 24. 법률 제16008호로 개정되기 전의 것) 제93조 제8호",

    "판례내용": "【원고, 피상고인】                ○○○ 인크 (소송대리인 법무법인(유한) 광장 담당변호사 김경태 외 4인)\n【피고, 상고인】 동수원세무서장\n【원심판결】  수원고법 2021. 11. 19. 선고 2021누10435 판결         \n【주    문】\n  원심판결 중 피고 패소 부분을 파기하고, 이 부분 사건을 수원고등법원에 환송한다. \n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 다음과 같은 사실을 알 수 있다.\n  가. 원고는 미국법인으로서 2016. 7.경 △△△ 주식회사(이하 ‘소외 회사’라 한다)와 사이에, 국내외에 등록되거나 출원 중인 특허(이하 ‘이 사건 특허’라 한다)에 관하여 소외 회사에 라이선스를 허여하고 사용료를 지급받는 내용의 특허권 라이선스 계약(이하 ‘이 사건 계약’이라 한다)을 체결하였다. \n  나. 소외 회사는 2016~2018 사업연도에 이 사건 계약에 따른 사용료 명목으로 원고에게 합계 미화 2,200만 달러(이하 ‘이 사건 사용료’라 한다)를 지급하고, 피고에게 이에 대한 원천징수분 법인세를 납부하였다. \n  다. 원고는, 이 사건 사용료가 국외에서 등록되었으나 국내에는 등록되지 아니한 특허권(이하 ‘국내 미등록 특허권’이라 한다)에 대한 사용대가로서 「대한민국과 미합중국간의 소득에 관한 조세의 이중과세 회피와 탈세방지 및 국제무역과 투자의 증진을 위한 협약」(이하 ‘한미조세협약’이라 한다)에 따라 원천징수대상이 되는 국내원천소득이 아니라는 이유로, 2018. 8.경 피고에게 이미 원천징수·납부된 세액에 대한 환급을 구하는 경정청구를 하였다. 그러나 피고는 2018. 12. 17. 원고의 경정청구를 거부하였다. \n  2. 관련 규정\n  가. 한미조세협약 제14조 제4항은 \"본 조에서 사용되는 ‘사용료’라 함은 다음의 것을 의미한다.\"라고 규정하면서, 제a호에서 ‘문학·예술·과학작품의 저작권 또는 영화필름·라디오 또는 텔레비전 방송용 필름 또는 테이프의 저작권, 특허, 의장, 신안, 도면, 비밀공정 또는 비밀공식, 상표 또는 기타 이와 유사한 재산 또는 권리, 지식, 경험, 기능, 선박 또는 항공기의 사용 또는 사용권에 대한 대가로서 받는 모든 종류의 지급금’을 규정한다. 제6조는 \"이 협약의 목적상 소득의 원천은 다음과 같이 취급된다.\"라고 규정하면서, 제3항에서 \"제14조 제4항에 규정된 재산의 사용 또는 사용할 권리에 대하여 동 조항에 규정된 사용료는 어느 체약국 내의 동 재산의 사용 또는 사용할 권리에 대하여 지급되는 경우에만 동 체약국 내에 원천을 둔 소득으로 취급된다.\"라고 규정한다. 제2조 제2항 전문(前文)은 \"이 협약에서 사용되나 이 협약에서 정의되지 아니한 기타의 용어는, 달리 문맥에 따르지 아니하는 한, 그 조세가 결정되는 체약국의 법에 따라 내포하는 의미를 가진다.\"라고 규정한다.\n  나. 구 법인세법(2018. 12. 24. 법률 제16008호로 개정되기 전의 것, 이하 같다) 제93조는 \"외국법인의 국내원천소득은 다음 각 호와 같이 구분한다.\"라고 규정하면서, 제8호에서 \"다음 각 목의 어느 하나에 해당하는 권리·자산 또는 정보(이하 이 호에서 ‘권리 등’이라 한다)를 국내에서 사용하거나 그 대가를 국내에서 지급하는 경우 그 대가 및 그 권리 등을 양도함으로써 발생하는 소득. 다만 소득에 관한 이중과세 방지협약에서 사용지를 기준으로 하여 그 소득의 국내원천소득 해당 여부를 규정하고 있는 경우에는 국외에서 사용된 권리 등에 대한 대가는 국내 지급 여부에도 불구하고 국내원천소득으로 보지 아니한다. 이 경우 특허권, 실용신안권, 상표권, 디자인권 등 권리의 행사에 등록이 필요한 권리(이하 이 호에서 ‘특허권 등’이라 한다)는 해당 특허권 등이 국외에서 등록되었고 국내에서 제조·판매 등에 사용된 경우에는 국내 등록 여부에 관계없이 국내에서 사용된 것으로 본다.\"라고 규정한다.\n  3. 국내 미등록 특허권에 대한 사용료가 국내원천소득에 해당하는지 여부(제1, 2, 3 상고이유)\n  가. 관련 법리 \n  한미조세협약은 구 법인세법 제93조 제8호에서 규정하는 ‘사용지를 기준으로 하여 사용료소득의 국내원천소득 해당 여부를 규정하고 있는 이중과세 방지협약’에 해당한다. 한미조세협약에 따른 ‘사용지’를 확정하려면 먼저 ‘사용’의 의미를 명확히 할 필요가 있다. 그런데 한미조세협약은 ‘사용’의 의미를 별도로 정의하고 있지 않다. 그러므로 한미조세협약 제2조 제2항 전문에 따라 ‘사용’의 의미는 조세가 결정되는 체약국인 우리나라의 법에 따라 해석하여야 한다. 이와 관련하여 구 법인세법 제93조 제8호 단서 후문은 국내 미등록 특허권이 국내 제조·판매 등에 사용된 경우에는 국내 등록 여부에 관계없이 국내에서 사용된 것으로 본다고 규정한다. 여기서 ‘사용’은 독점적 효력을 가지는 특허권 자체를 사용하는 것이 아니라 그 특허권의 대상이 되는 제조방법·기술·정보 등(이하 ‘특허기술’이라 한다)을 사용한다는 의미로 보아야 한다. 따라서 국내 미등록 특허권의 특허기술이 국내에서 사용되었다면 그 대가인 사용료소득은 국내원천소득에 해당한다(대법원 2025. 9. 18. 선고 2021두59908 전원합의체 판결 참조). \n  나. 이 사건에 관한 판단\n  앞서 본 사실관계를 위 법리에 비추어 살펴보면, 이 사건 사용료가 이 사건 특허의 대상인 특허기술을 국내에서의 제조·판매 등에 사실상 사용하는 데에 대한 대가인 경우, 이는 한미조세협약 제6조 제3항, 제14조 제4항 제a호, 구 법인세법 제93조 제8호 단서 후문에 따라 국내 사용에 대한 사용료로서 국내원천소득에 해당한다. 그런데도 원심은, 이 사건 사용료 중 일부가 국내 미등록 특허권에 대한 것이라는 이유만으로, 그 특허기술이 국내에서의 제조·판매 등에 사실상 사용되었는지를 살피지 아니한 채 곧바로 국내원천소득에 해당하지 않는다고 판단하였다. 이러한 원심의 판단에는 한미조세협약상 국내 미등록 특허권에 대한 사용료의 국내원천소득 해당 여부에 관한 법리를 오해한 나머지 필요한 심리를 다하지 아니하여 판결에 영향을 미친 잘못이 있다.\n  4. 결론\n  나머지 상고이유에 대한 판단을 생략한 채 원심판결 중 피고 패소 부분을 파기하고 이 부분 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 노경필(재판장) 이흥구(주심) 오석준 이숙연"

    "판례내용": "【원고, 피상고인】 망 소외 1의 소송수계인 원고 1 외 1인 (소송대리인 법무법인 사람앤스마트 담당변호사 박성민\n【피고, 상고인】 근로복지공단\n【원심판결】  서울고법 2025. 6. 12. 선고 2024누62433 판결         \n【주    문】\n  원심판결 중 원고 망 소외 2의 소송수계인 원고 2에 대한 부분을 파기하고, 이 부분에 관한 제1심판결을 취소하며, 이 부분 소를 각하한다.  피고의 원고 망 소외 1의 소송수계인 원고 1에 대한 상고를 기각한다.  원고 망 소외 2의 소송수계인 원고 2와 피고 사이에 생긴 소송총비용 및 원고 망 소외 1의 소송수계인 원고 1과 피고 사이에 생긴 상고비용은 모두 피고가 부담한다.\n\n【이    유】  1. 원고 망 소외 2의 소송수계인 원고 2의 소에 대한 직권 판단 \n  기록에 의하면, 피고는 이 사건 상고를 제기한 후에 망 소외 2에 대한 처분을 직권으로 취소한 사실을 알 수 있으므로, 원고 망 소외 2의 소송수계인 원고 2의 이 사건 소는 이미 소멸하고 없는 처분에 대한 것으로서 소의 이익이 없어 부적법하게 되었다. \n  2. 피고의 상고이유에 대한 판단\n  가. 제2, 3 상고이유에 대하여 \n                 산업재해보상보험법(이하 ‘산재보험법’이라 한다) 제36조 제3항 본문은 보험급여를 산정하는 경우 해당 근로자의 평균임금을 산정하여야 할 사유가 발생한 날부터 1년이 지난 이후에는 매년 전체 근로자의 임금 평균액의 증감률에 따라 평균임금을 증감하되, 그 근로자의 연령이 60세에 도달한 이후에는 소비자물가변동률에 따라 평균임금을 증감한다고 규정하고 있다. 평균임금의 증감 제도는 오랜 기간 보험급여를 받거나 오랜 기간이 지난 후 보험급여를 받을 때, 평균임금을 산정할 사유가 생긴 날인 재해일 또는 진단 확정일을 기준으로 평균임금을 산정하여 보험급여액을 정할 경우 보험급여의 실질적 가치를 제대로 반영하지 못하는 불합리한 결과를 시정하기 위하여 마련된 것이다. 근로자의 업무상의 재해를 신속하고 공정하게 보상하고자 하는 산재보험법의 입법 목적과 평균임금 증감 제도를 둔 취지 등을 종합하여 보면, 2010. 5. 20. 법률 제10305호로 개정된 산재보험법 시행 전에 지급 사유가 발생한 진폐에 대하여 장해보상일시금을 산정하는 경우 근로복지공단이 정당한 이유 없이 그 지급을 거부하거나 늦춤으로 인하여 보험급여의 실질적 가치가 하락한 경우에는 보험급여 지급결정일까지 평균임금을 증감해야 한다(대법원 2024. 4. 16. 선고 2019두45616 판결 참조). \n  구 「진폐의 예방과 진폐근로자의 보호 등에 관한 법률」(2010. 5. 20. 법률 제10304호로 개정되기 전의 것, 이하 ‘구 진폐예방법’이라 한다)은 진폐에 걸린 근로자 및 그 유족에 대한 위로금의 지급에 관한 사항을 정하여 근로자의 건강 보호와 복지 증진에 이바지하는 것 등을 그 목적으로 하고 있고(제1조), 그에 따라 진폐위로금의 하나로 ‘장해위로금’을 규정하고 있는데(제24조 제1항 제2호), 이는 발병시기가 불명하여 사업주에 대한 손해배상청구로 구제받기 어려운 진폐근로자와 그 유족들의 생계의 곤란을 입법을 통해 보전하고자 마련된 것이다. 이에 구 진폐예방법은 진폐로 산재보험법에 따른 장해급여의 대상이 된 근로자가 퇴직하거나 퇴직한 근로자가 진폐로 산재보험법에 따른 장해급여의 대상이 되는 경우에 장해위로금을 지급하고, 그 지급액은 산재보험법에서의 진폐에 따른 장해보상일시금의 100분의 60에 해당하는 금액으로 한다는 명문의 규정(제25조 제2항)을 두고 있다. \n  위와 같은 구 진폐예방법의 입법 목적과 앞서 본 장해위로금 및 평균임금 증감 제도의 취지, 장해위로금 금액을 장해급여를 기준으로 산정한다고 규정한 구 진폐예방법의 명문규정, 정당한 이유 없이 급여의 지급이 늦어짐에 따른 실질적 가치 하락을 시정할 필요성은 장해위로금의 경우에도 인정되는 점 등을 종합하여 보면, 장해급여에 해당하는 장해보상일시금과 장해위로금의 법적 성격에 차이가 있다 하더라도, 앞서 본 장해보상일시금에 대한 법리는 장해위로금을 산정하는 경우에도 마찬가지로 적용된다고 봄이 타당하다. \n  원심은 판시와 같은 이유로, 피고가 망 소외 1에 대하여 장해위로금 지급결정일까지 평균임금을 증감하지 않고 진폐 진단일을 기준으로 장해위로금을 산정한 것은 위법하다고 판단하였다. \n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 원심의 판단은 위와 같은 법리에 따른 것으로 정당하고, 거기에 상고이유 주장과 같이 장해위로금의 산정방식 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. \n  나. 제1 상고이유에 대하여\n  행정처분의 취소를 구하는 항고소송에서 처분청은 당초 처분의 근거로 제시한 사유와 기본적 사실관계에서 동일성이 없는 다른 사유를 처분사유로 추가·변경할 수 없다(대법원 2017. 8. 29. 선고 2016두44186 판결 참조).\n  원심은, 피고가 이 사건 소송에서 추가로 주장한 처분사유는 ‘장해위로금을 휴업급여와 중복하여 지급할 수 없다.’는 것인데, 이는 이 사건 처분의 당초 처분사유인 ‘장해위로금은 진폐 진단일 당시의 평균임금을 기준으로 산정·지급해야 한다.’는 것과 기본적 사실관계가 다르므로, 이 사건 소송에서 위와 같은 처분사유를 추가하는 것은 허용되지 않는다고 판단하였다. \n  원심판결 이유를 앞서 본 법리와 기록에 비추어 살펴보면, 원심의 판단에 처분사유의 추가·변경에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. \n  다. 제4 상고이유에 대하여 \n  행정처분이 위법한 때에는 이를 취소함이 원칙이고 그 위법한 처분을 취소·변경함이 도리어 현저히 공공의 복리에 적합하지 않은 경우에 극히 예외적으로 위법한 행정처분의 취소를 허용하지 않는다는 사정판결을 할 수 있다. 그러므로 사정판결의 적용은 극히 엄격한 요건 아래 제한적으로 하여야 하고, 그 요건인 현저히 공공복리에 적합하지 아니한지 여부를 판단할 때는 위법·부당한 행정처분을 취소·변경하여야 할 필요와 그 취소·변경으로 인하여 발생할 수 있는 공공복리에 반하는 사태 등을 비교·교량하여 그 적용 여부를 판단하여야 한다(대법원 2019. 1. 31. 선고 2016두65718 판결 등 참조).\n  원심은 피고 주장의 사정만으로는 사정판결을 하여야 할 정도로 이 사건 처분을 취소하는 것이 현저히 공공복리에 적합하지 않은 경우에 해당한다고 보기 어렵다고 판단하였다. \n  원심판결 이유를 앞서 본 법리와 기록에 비추어 살펴보면, 원심의 판단에 사정판결의 요건에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. \n  3. 결론\n  그러므로 원심판결 중 원고 망 소외 2의 소송수계인 원고 2에 대한 부분을 파기하되, 이에 대하여는 이 법원이 직접 재판하기에 충분하므로 자판하기로 하여 제1심판결 중 위 원고에 관한 부분을 취소하고, 이 부분 소를 각하한다. 피고의 원고 망 소외 1의 소송수계인 원고 1에 대한 상고는 이유 없으므로 이를 기각한다. 원고 망 소외 2의 소송수계인 원고 2과 피고 사이에 생긴 소송총비용 및 원고 망 소외 1의 소송수계인 원고 1과 피고 사이에 생긴 상고비용은 모두 피고가 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 오석준(재판장) 이흥구 노경필 이숙연(주심)"
  },

    "판시사항": "산업재해보상보험법 시행규칙 제48조 [별표 5] ‘신체부위별 장해등급 판정에 관한 세부기준’ 제5호 (가)목 2)에서 정한 수시로 간병을 받아야 하는 ‘생명유지에 필요한 일상생활의 처리동작’ 및 이와 같은 동작에 ‘수시로’ 다른 사람의 간병을 받아야 한다는 것의 의미",
    "판결요지": "산업재해보상보험법령이 정한 장해등급기준 중 신경계통의 기능 또는 정신기능에 관한 장해등급은 노동능력에 미치는 영향과 간병이 필요한 정도 등을 종합적으로 고려하여 정한 것이다. 특히 중추신경계인 ‘뇌’의 장해는 전신에 걸쳐 복합적인 증상을 보이는 경우가 많고 증상의 정도도 여러 단계가 있을 수 있으므로, 구체적인 장해의 부위와 정도, 신체 부위에 나타나는 여러 증상을 종합적으로 평가하여 장해등급을 판정해야 한다. \n  산업재해보상보험법 제57조 제2항, 산업재해보상보험법 시행령 제53조 제1항 [별표 6] 제2급 제5호, 제3급 제3호, 산업재해보상보험법 시행규칙 제48조 [별표 5] 제5호 (가)목 2), 3)의 문언 및 취지, 장해등급 제도의 체계, 재해근로자의 생명유지와 인간다운 삶에 대한 조력이라는 간병의 본질 등에 비추어 보면, 산업재해보상보험법 시행규칙 제48조 [별표 5] ‘신체부위별 장해등급 판정에 관한 세부기준’ 제5호 (가)목 2)에서 정한 수시로 간병을 받아야 하는 ‘생명유지에 필요한 일상생활의 처리동작’이란 ‘호흡, 음식물 삼키기, 배뇨와 배변, 체위 변경’ 등 생명을 유지하는 데 반드시 필요한 동작에 한정된다고 볼 수 없고, 재해근로자가 ‘이동 동작, 식사 동작, 옷을 입고 벗는 동작, 대소변 처리 동작, 개인 위생 및 목욕 동작’ 등과 같이 일상생활을 하는 데 요구되는 기초적ㆍ반복적 동작의 상당수를 다른 사람 도움 없이 스스로 처리하지 못하여 최소한의 인간다운 삶을 영위하는 데 지장이 있는 경우라면, 이러한 동작 역시 이에 포함된다. 그리고 이와 같은 동작에 ‘수시로’ 다른 사람의 간병을 받아야 한다는 것은 간병인이 재해근로자의 생명유지 활동을 보조하기 위하여 항상 곁에 대기하여야 하는 정도에는 이르지 않더라도 재해근로자가 생명유지에 필요한 일상생활의 처리동작 전부 또는 주요 부분을 수행하기 위하여 필요할 때마다 다른 사람의 도움을 받아야 하는 경우를 의미한다.",
    "참조조문": "산업재해보상보험법 제57조 제2항, 산업재해보상보험법 시행령 제53조 제1항 [별표 6] 제2급 제5호, 제3급 제3호, 산업재해보상보험법 시행규칙 제48조 [별표 5] 제5호 (가)목 2), 3)",
    "참조판례": "",
    "판례내용": "【원고, 피상고인】                원고 (소송대리인 법무법인 더보상 담당변호사 안혜진 외 6인)\n【피고, 상고인】 근로복지공단\n【원심판결】  서울고법 2024. 7. 4. 선고 2023누34639 판결         \n【주    문】\n  상고를 기각한다.  상고비용은 피고가 부담한다. \n\n【이    유】  상고이유를 판단한다. \n  1. 사안의 개요\n  원고는 2020. 2. 5. 발생한 업무상 재해로 ‘상세불명의 뇌내출혈’을 진단받고 피고로부터 요양승인을 받아 2021. 4. 30.까지 요양하였다. 원고는 요양종결 후 피고에게 장해급여를 청구하였고, 피고는 2021. 6. 28. 원고의 장해등급을 산업재해보상보험법 시행령(이하 ‘산재보험법 시행령’이라 한다) 제53조 제1항 [별표 6] 제3급 제3호로 결정하는 처분을 하였다(이하 ‘이 사건 처분’이라 한다).\n  2. 관련 규정 및 법리\n  가. 관련 규정\n  산업재해보상보험법(이하 ‘산재보험법’이라 한다) 제57조 제2항은 장해급여는 장해등급에 따라 [별표 2]에 따른 장해보상연금 또는 장해보상일시금으로 하되, 그 장해등급의 기준은 대통령령으로 정한다고 규정하고 있다. 그 위임에 따른 산재보험법 시행령 제53조 제1항 [별표 6]은 장해등급을 제1급에서 제14급까지로 구분하고, 세부적으로 모두 165종의 유형적인 신체장해를 열거하고 있다. \n  그중 신경계통의 기능 또는 정신기능의 장해에 관하여, 산재보험법 시행령 제53조 제1항 [별표 6]은 제2급 제5호에서 \"신경계통의 기능 또는 정신기능에 뚜렷한 장해가 남아 수시로 간병을 받아야 하는 사람\"을, 제3급 제3호에서 \"신경계통의 기능 또는 정신기능에 뚜렷한 장해가 남아 평생 동안 노무에 종사할 수 없는 사람\"을 규정하고 있다. \n  나아가 산재보험법 시행령 제53조 제1항 후문의 위임에 따른 산업재해보상보험법 시행규칙(이하 ‘산재보험법 시행규칙’이라 한다) 제48조 [별표 5] ‘신체부위별 장해등급 판정에 관한 세부기준’에서는 신경계통의 기능 또는 정신기능의 장해에 관한 세부기준을 규정하고 있다(이하 ‘이 사건 세부기준’이라 한다). 이 사건 세부기준의 5. 가. 2)에서는 장해등급 제2급 제5호를 ‘고도의 신경계통의 기능 또는 정신기능장해로 생명유지에 필요한 일상생활의 처리동작에 수시로 다른 사람의 간병을 받아야 하거나 치매, 정의의 장해, 환각망상, 발작성 의식장해의 다발 등으로 수시로 다른 사람의 감시가 필요한 사람’으로 규정하고 있고(이하 ‘이 사건 조항’이라 한다), 5. 가. 3)에서는 장해등급 제3급 제3호를 ‘장해등급 제2급 제5호의 장해 정도에는 미치지 않지만 고도의 신경계통의 기능 또는 정신기능의 장해로 대뇌소증상, 인격변화 또는 기억장해 등이 남아 평생 동안 어떤 노동에도 종사할 수 없는 사람’으로 규정하고 있다. \n  나. 관련 법리 \n  산재보험법령이 정한 장해등급기준 중 신경계통의 기능 또는 정신기능에 관한 장해등급은 노동능력에 미치는 영향과 간병이 필요한 정도 등을 종합적으로 고려하여 정한 것이다. 특히 중추신경계인 ‘뇌’의 장해는 전신에 걸쳐 복합적인 증상을 보이는 경우가 많고 그 증상의 정도도 여러 단계가 있을 수 있으므로, 구체적인 장해의 부위와 정도, 신체 부위에 나타나는 여러 증상을 종합적으로 평가하여 그 장해등급을 판정하여야 한다. \n  앞서 본 관련 규정의 문언 및 취지, 장해등급 제도의 체계, 재해근로자의 생명유지와 인간다운 삶에 대한 조력이라는 간병의 본질 등에 비추어 보면, 이 사건 조항에서 정한 수시로 간병을 받아야 하는 ‘생명유지에 필요한 일상생활의 처리동작’이란 ‘호흡, 음식물 삼키기, 배뇨와 배변, 체위 변경’ 등 생명을 유지하는 데 반드시 필요한 동작에 한정된다고 볼 수 없고, 재해근로자가 ‘이동 동작, 식사 동작, 옷을 입고 벗는 동작, 대소변 처리 동작, 개인 위생 및 목욕 동작’ 등과 같이 일상생활을 하는 데 요구되는 기초적ㆍ반복적 동작의 상당수를 다른 사람 도움 없이 스스로 처리하지 못하여 최소한의 인간다운 삶을 영위하는 데 지장이 있는 경우라면, 이러한 동작 역시 이에 포함된다고 보아야 한다. 그리고 이와 같은 동작에 ‘수시로’ 다른 사람의 간병을 받아야 한다는 것은 간병인이 재해근로자의 생명유지 활동을 보조하기 위하여 항상 곁에 대기하여야 하는 정도에는 이르지 않더라도 재해근로자가 생명유지에 필요한 일상생활의 처리동작 전부 또는 주요 부분을 수행하기 위하여 필요할 때마다 다른 사람의 도움을 받아야 하는 경우를 의미한다. \n  3. 이 사건 처분의 위법 여부에 관한 판단\n  원심은 판시와 같은 이유로, 원고가 좌측 편마비로 인하여 좌측 상, 하지를 전혀 사용할 수 없고 우측 상, 하지만으로는 신체를 지탱하여 균형을 잡거나 보행 등을 전혀 할 수 없어 용변 처리 등 동작의 전 과정에서 타인의 도움이 필요할 뿐만 아니라, 실제 원고가 옷을 입고 벗는 동작 및 식사 동작 등을 하는 모습이 촬영된 영상에 의하더라도 원고에게 수시로 타인의 간병이 필요하다는 제1심법원 감정 결과의 신빙성을 인정할 수 있다고 본 다음, 원고가 타인의 도움 없이는 생명유지에 필요한 일상생활의 처리동작을 수행하는 것이 어려우므로 원고의 장해등급은 제2급 제5호에 해당한다는 전제에서 이를 제3급 제3호에 해당한다고 본 이 사건 처분은 위법하여 취소되어야 한다고 판단하였다.\n  앞서 본 법리와 기록에 비추어 살펴보면, 원심판단은 정당하고, 거기에 상고이유 주장과 같이 논리와 경험 법칙을 위반하여 자유심증주의 한계를 벗어나거나 장해등급의 판정 등에 관한 법리오해, 심리미진 등으로 판결에 영향을 미친 잘못이 없다. \n  4. 결론\n  상고를 기각하고 상고비용은 패소자가 부담하도록 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.    \n\n대법관 이흥구(재판장) 오석준 노경필(주심) 이숙연"

    "판례내용": "【원고, 피상고인 겸 부대상고인】                ○○○ 주식회사 (소송대리인 변호사 정병문 외 7인)\n【피고, 상고인 겸 부대피상고인】 이천세무서장\n【원심판결】  수원고법 2021. 12. 3. 선고 2021누10282 판결         \n【주    문】\n  원심판결 중 피고 패소 부분을 파기하고, 이 부분 사건을 수원고등법원에 환송한다.  원고의 부대상고를 기각한다. \n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위에서)와 부대상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 다음과 같은 사실을 알 수 있다.\n  가. 당사자의 지위\n  (회사명 1 생략) 엘엘씨[(영문회사명 1 생략), L.L.C., 이하 ‘소외 1 회사’라 한다]는 (회사명 2 생략) 엘피[(영문회사명 2 생략), L.P.)] 및 (회사명 3 생략) 엘엘씨(영문회사명 3 생략, L.L.C.) 등(이하 ‘소외 2 회사 등’이라 한다)이 보유한 특허권을 관리할 목적으로 미국 델라웨어주에 설립된 유한책임회사이고, (회사명 4 생략) 라이선싱[(영문회사명 4 생략)], 이하 ‘소외 3 회사’이라 한다)은 2010. 6. 21. 아일랜드에서 설립된 무한책임회사이다. 소외 1 회사는 키프로스에서 설립된 (회사명 5 생략) 리미티드[(영문회사명 5 생략) Limited, 이하 ‘소외 4 회사’라 한다)]의 지분을 100%, 소외 4 회사는 소외 3 회사의 지분을 99.9% 각 소유하고 있다. 소외 1 회사는 소외 2 회사 등 보유의 특허권에 관한 라이선스를 재허여받았고, 소외 3 회사에 위 특허권에 관한 라이선스를 재허여하였다.\n  나. 라이선스 계약의 체결\n  내국법인인 원고는 2012. 9. 19. 소외 3 회사와 사이에, 소외 2 회사 등이 보유한 국내외 등록 특허권 45,941개(이하 ‘이 사건 특허권’이라 한다. 이 중 국내에 등록된 2,612개를 제외한 나머지는 국외에서 등록되었으나 국내에는 등록되지 않은 ‘국내 미등록 특허권’에 해당한다)에 관하여 라이선스를 허여받고 그 대가로 사용료를 지급하는 내용의 특허권 라이선스 계약(이하 ‘이 사건 계약’이라 한다)을 체결하였다. \n  다. 2012 사업연도 법인세 징수처분 및 가산세 부과처분\n  1) 원고는 2012 사업연도에 이 사건 계약에 따른 계약금으로 소외 3 회사에 미화 8,500만 달러(이하 ‘이 사건 계약금’이라 한다)를 지급하였으나, 「대한민국과 아일랜드간의 소득 및 양도소득에 대한 조세의 이중과세회피와 탈세방지를 위한 협약」(이하 ‘한·아일랜드 조세협약’이라 한다) 제12조 제1항에 따라 법인세를 원천징수·납부하지 않았다. \n  2) 피고는 ‘① 소외 3 회사은 조세회피 목적으로 설립된 도관회사에 불과하고, 이 사건 계약금의 수익적 소유자는 소외 1 회사이므로, 한·아일랜드 조세협약이 아닌 「대한민국과 미합중국간의 소득에 관한 조세의 이중과세 회피와 탈세방지 및 국제무역과 투자의 증진을 위한 협약」(이하 ‘한미조세협약’이라 한다)이 적용되어야 하며, ② 이 사건 계약금은 한미조세협약상 국내원천소득에 해당한다.’는 이유로 2014. 5. 1. 원고에 대하여 2012 사업연도 원천징수분 법인세 17,112,485,030원 및 원천징수불이행 가산세 1,711,248,500원을 각 고지하였다.\n  라. 2013 사업연도 법인세 경정거부처분\n  1) 원고는 2013 사업연도에 소외 3 회사에 잔금으로 미화 105,061,275달러(이하 ‘이 사건 잔금’이라 하고, 이 사건 계약금과 함께 ‘이 사건 사용료’라 한다)를 지급하고, 피고에게 그에 따른 원천징수분 법인세 20,305,765,100원을 납부하였다.\n  2) 원고는, 이 사건 잔금은 한·아일랜드 조세협약 제12조 제1항에 따라 국내에서 과세할 수 없다는 이유로, 2015. 5. 13. 피고에게 납부된 원천징수분 법인세의 환급을 구하는 경정청구를 하였다. 그러나 피고는 2015. 11. 2. 원고의 경정청구를 거부하였다. \n  2. 이 사건 사용료에 관하여 한·아일랜드 조세협약 제12조 제1항이 적용되는지 여부 등(원고 부대상고이유)\n  가. 관련 규정 및 법리\n  1) 한·아일랜드 조세협약 제12조 제1항은 ‘타방체약국의 거주자에 의하여 취득되고 수익적으로 소유되는 일방체약국 내의 원천으로부터 발생하는 사용료는 동 타방체약국에서만 과세된다.’고 규정한다. 이에 따라 우리 법인세법상 국내원천소득에 해당하는 사용료소득일지라도 아일랜드의 거주자인 수익적 소유자에게 지급되는 경우에는 국내에서 과세될 수 없다. 위 조약 규정의 도입 연혁과 그 문맥 등을 종합할 때, 수익적 소유자는 그 사용료소득을 지급받은 자가 타인에게 이를 다시 이전할 법적 또는 계약상의 의무 등이 없는 사용·수익권을 갖는 경우를 뜻한다. 이러한 수익적 소유자에 해당하는지는 해당 소득에 관련된 사업활동의 내용과 현황, 그 소득의 실제 사용과 운용 내역 등 여러 사정을 종합하여 판단하여야 한다.\n                 국세기본법 제14조 제1항에서 규정하는 실질과세의 원칙은 법률과 같은 효력을 가지는 조세조약의 해석과 적용에 있어서도 이를 배제하는 특별한 규정이 없는 한 그대로 적용된다. 그러므로 사용료소득의 수익적 소유자에 해당한다고 할지라도 국세기본법상 실질과세의 원칙에 따라 조약 남용으로 인정되는 경우에는 그 적용을 부인할 수 있다. 즉, 재산의 귀속명의자는 재산을 지배·관리할 능력이 없고 그 명의자에 대한 지배권 등을 통하여 실질적으로 이를 지배·관리하는 자가 따로 있으며 그와 같은 명의와 실질의 괴리가 조세를 회피할 목적에서 비롯된 경우에는, 그 명의에 따른 조세조약 적용을 부인하고 그 재산에 관한 소득은 그 재산을 실질적으로 지배·관리하는 자에게 귀속된 것으로 보아 과세한다. 그러나 그러한 명의와 실질의 괴리가 없는 경우에는 소득의 귀속명의자에게 소득이 귀속된다(대법원 2018. 11. 15. 선고 2017두33008 판결 등 참조).\n  2) 한편 구 국세기본법(2013. 1. 1. 법률 제11604호로 개정되기 전의 것) 제47조의5 제1항은, 국세를 징수하여 납부할 의무를 지는 자가 징수하여야 할 세액을 세법에 따른 납부기한까지 납부하지 아니한 경우에는, ‘납부하지 아니한 세액의 100분의 10에 상당하는 금액’을 한도로 하여 원천징수납부 등 불성실가산세를 부과하도록 정하고 있다. 그런데 같은 법 제48조 제1항은 ‘세법에 따라 가산세를 부과하는 경우 납세자가 의무를 이행하지 아니한 데 대한 정당한 사유가 있는 때에는 해당 가산세를 부과하지 아니한다.’고 규정하고 있다.\n  나. 판단\n  원심은, 소외 1 회사가 원고를 비롯한 여러 내국법인들과 미국 내 특허권 침해 문제를 두고 소송을 제기하는 등 갈등을 겪어 오다가 그 분쟁 해결을 위한 라이선스 계약이 체결되기 얼마 전 아일랜드 법인인 소외 3 회사을 설립하였고, 조세피난처인 키프로스에 설립한 소외 4 회사를 매개로, 형식상 거래당사자 역할을 한 소외 3 회사에 지급된 이 사건 사용료소득을 실질적으로 지배·관리한 점 등 그 판시와 같은 이유를 들어, 이 사건 사용료소득의 수익적 소유자는 아일랜드 법인인 소외 3 회사가 아닌 미국법인인 소외 1 회사이고, 이 사건 계약의 형식상 명의와 그로 인한 사용료소득의 실질적 지배·관리 주체 사이의 괴리는 조세를 회피할 목적에서 비롯된 것이라고 보아, 이 사건 사용료소득에 대하여 한·아일랜드 조세협약이 아닌 한미조세협약이 적용되어야 한다고 판단하였다.\n  나아가 원심은, 원고가 이 사건 사용료의 대상인 특허권의 상당 부분이 미국에 등록된 것이고, 해당 특허권의 권리자인 소외 2 회사 등으로부터 관리를 위임받은 소외 1 회사 역시 미국법인임을 인식하였음에도, 정작 이 사건 계약을 체결할 때에는 거주지국 배타적 과세원칙을 채택하고 있는 한·아일랜드 조세협약의 일방 체약국인 아일랜드에 설립된 소외 3 회사와 계약을 체결한 점 등 그 판시와 같은 이유로, 원고가 2012 사업연도 법인세에 대한 원천징수·납부의무를 이행하지 아니한 데 정당한 사유가 존재하지 않는다고 판단하였다. \n  원심판결 이유를 앞서 본 법리에 비추어 살펴보면, 원심의 이러한 판단은 정당하고, 거기에 부대상고이유 주장과 같이 이 사건 사용료소득의 실질 귀속자나 가산세를 면제할 정당한 사유에 관한 법리를 오해한 잘못이 없다.\n  3. 국내 미등록 특허권에 대한 사용료가 국내원천소득에 해당하는지 여부(피고 제1 상고이유)\n  가. 관련 규정\n  1) 한미조세협약 제14조 제4항은 \"본 조에서 사용되는 ‘사용료’라 함은 다음의 것을 의미한다.\"라고 규정하면서, 제a호에서 ‘문학·예술·과학작품의 저작권 또는 영화필름·라디오 또는 텔레비전 방송용 필름 또는 테이프의 저작권, 특허, 의장, 신안, 도면, 비밀공정 또는 비밀공식, 상표 또는 기타 이와 유사한 재산 또는 권리, 지식, 경험, 기능, 선박 또는 항공기의 사용 또는 사용권에 대한 대가로서 받는 모든 종류의 지급금’을 규정한다. 제6조는 \"이 협약의 목적상 소득의 원천은 다음과 같이 취급된다.\"라고 규정하면서, 제3항에서 \"제14조 제4항에 규정된 재산의 사용 또는 사용할 권리에 대하여 동 조항에 규정된 사용료는 어느 체약국 내의 동 재산의 사용 또는 사용할 권리에 대하여 지급되는 경우에만 동 체약국 내에 원천을 둔 소득으로 취급된다.\"라고 규정한다. 제2조 제2항 전문(前文)은 \"이 협약에서 사용되나 이 협약에서 정의되지 아니한 기타의 용어는, 달리 문맥에 따르지 아니하는 한, 그 조세가 결정되는 체약국의 법에 따라 내포하는 의미를 가진다.\"라고 규정한다.\n  2) 구 법인세법(2015. 12. 15. 법률 제13555호로 개정되기 전의 것, 이하 같다) 제93조는 \"외국법인의 국내원천소득은 다음 각 호와 같이 구분한다.\"라고 규정하면서, 제8호에서 \"다음 각 목의 어느 하나에 해당하는 권리·자산 또는 정보(이하 이 호에서 ‘권리 등’이라 한다)를 국내에서 사용하거나 그 대가를 국내에서 지급하는 경우 그 대가 및 그 권리 등을 양도함으로써 발생하는 소득. 다만 소득에 관한 이중과세 방지협약에서 사용지를 기준으로 하여 그 소득의 국내원천소득 해당 여부를 규정하고 있는 경우에는 국외에서 사용된 권리 등에 대한 대가는 국내 지급 여부에도 불구하고 국내원천소득으로 보지 아니한다. 이 경우 특허권, 실용신안권, 상표권, 디자인권 등 권리의 행사에 등록이 필요한 권리(이하 이 호에서 ‘특허권 등’이라 한다)는 해당 특허권 등이 국외에서 등록되었고 국내에서 제조·판매 등에 사용된 경우에는 국내 등록 여부에 관계없이 국내에서 사용된 것으로 본다.\"라고 규정한다.\n  나. 관련 법리 \n  한미조세협약은 구 법인세법 제93조 제8호에서 규정하는 ‘사용지를 기준으로 하여 사용료소득의 국내원천소득 해당 여부를 규정하고 있는 이중과세 방지협약’에 해당한다. 한미조세협약에 따른 ‘사용지’를 확정하려면 먼저 ‘사용’의 의미를 명확히 할 필요가 있다. 그런데 한미조세협약은 ‘사용’의 의미를 별도로 정의하고 있지 않다. 그러므로 한미조세협약 제2조 제2항 전문에 따라 ‘사용’의 의미는 조세가 결정되는 체약국인 우리나라의 법에 따라 해석하여야 한다. 이와 관련하여 구 법인세법 제93조 제8호 단서 후문은 국내 미등록 특허권이 국내 제조·판매 등에 사용된 경우에는 국내 등록 여부에 관계없이 국내에서 사용된 것으로 본다고 규정한다. 여기서 ‘사용’은 독점적 효력을 가지는 특허권 자체를 사용하는 것이 아니라 그 특허권의 대상이 되는 제조방법·기술·정보 등(이하 ‘특허기술’이라 한다)을 사용한다는 의미로 보아야 한다. 따라서 국내 미등록 특허권의 특허기술이 국내에서 사용되었다면 그 대가인 사용료소득은 국내원천소득에 해당한다(대법원 2025. 9. 18. 선고 2021두59908 전원합의체 판결 참조). \n  다. 이 사건에 관한 판단\n  앞서 본 사실관계를 위 법리에 비추어 살펴보면, 이 사건 사용료 중 이 사건 특허권의 대상인 특허기술을 국내에서의 제조·판매 등에 사실상 사용하는 데에 대한 대가에 해당하는 부분의 경우, 한미조세협약 제6조 제3항, 제14조 제4항 제a호, 구 법인세법 제93조 제8호 단서 후문에 따라 국내 사용에 대한 사용료로서 국내원천소득에 해당한다. 그런데도 원심은 이 사건 사용료 중 원고가 국내 등록 특허권에 대한 것이라고 자인하는 부분을 제외한 나머지 부분이 국내 미등록 특허권에 대한 것이라는 이유만으로, 그 특허기술이 국내에서의 제조·판매 등에 사실상 사용되었는지를 살피지 아니한 채 곧바로 그 사용료가 국내원천소득에 해당하지 않는다고 판단하였다. 이러한 원심의 판단에는 한미조세협약상 국내 미등록 특허권에 대한 사용료의 국내원천소득 해당 여부에 관한 법리를 오해한 나머지 필요한 심리를 다하지 아니하여 판결에 영향을 미친 잘못이 있다. \n  4. 이 사건 사용료에 특허권 외에 ‘발명, 기술 등에 관한 비공개 정보의 사용대가’가 포함되어 있는지 여부(피고 제2상고이유)\n  이 사건 사용료에 특허권 외에 ‘발명, 기술 등에 관한 비공개 정보의 사용대가’가 포함되어 있다는 주장은 상고심에서 비로소 주장하는 것이어서 원심판결에 대한 적법한 상고이유가 될 수 없다. 나아가 살피더라도, 원심의 판단에 특허 출원 중인 발명 등 사용료의 국내 원천 여부에 관한 법리를 오해하는 등의 잘못이 없다.\n  5. 결론\n  나머지 상고이유에 대한 판단을 생략한 채 원심판결 중 피고 패소 부분을 파기하고 이 부분 사건을 다시 심리·판단하도록 원심법원에 환송하고, 원고의 부대상고를 기각하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 노경필(재판장) 이흥구(주심) 오석준 이숙연"
  },

    "판시사항": "[1] 2010. 5. 20. 법률 제10305호로 개정된 산업재해보상보험법 시행 전에 지급 사유가 발생한 진폐에 대하여 장해보상일시금을 산정할 때 근로복지공단이 정당한 이유 없이 그 지급을 거부하거나 늦추어 보험급여의 실질적 가치가 하락한 경우, 보험급여 지급결정일까지 평균임금을 증감해야 하는지 여부(적극) / 이러한 법리는 구 진폐의 예방과 진폐근로자의 보호 등에 관한 법률상 장해위로금을 산정하는 경우에도 마찬가지인지 여부(적극)\n\n [2] 행정처분의 취소를 구하는 항고소송에서 처분청이 당초 처분의 근거로 제시한 사유와 기본적 사실관계에서 동일성이 없는 다른 사유를 처분사유로 추가ㆍ변경할 수 있는지 여부(소극)\n\n [3] 사정판결은 엄격한 요건 아래 제한적으로 적용하여야 하는지 여부(적극) 및 사정판결을 하기 위한 요건인 ‘현저히 공공복리에 적합하지 아니한지’를 판단하는 방법",
    "판결요지": "[1] 산업재해보상보험법(이하 ‘산재보험법’이라 한다) 제36조 제3항 본문은 보험급여를 산정하는 경우 해당 근로자의 평균임금을 산정하여야 할 사유가 발생한 날부터 1년이 지난 이후에는 매년 전체 근로자의 임금 평균액의 증감률에 따라 평균임금을 증감하되, 그 근로자의 연령이 60세에 도달한 이후에는 소비자물가변동률에 따라 평균임금을 증감한다고 규정하고 있다. 평균임금의 증감 제도는 오랜 기간 보험급여를 받거나 오랜 기간이 지난 후 보험급여를 받을 때, 평균임금을 산정할 사유가 생긴 날인 재해일 또는 진단 확정일을 기준으로 평균임금을 산정하여 보험급여액을 정할 경우 보험급여의 실질적 가치를 제대로 반영하지 못하는 불합리한 결과를 시정하기 위하여 마련된 것이다. 근로자의 업무상의 재해를 신속하고 공정하게 보상하고자 하는 산재보험법의 입법 목적과 평균임금 증감 제도를 둔 취지 등을 종합하여 보면, 2010. 5. 20. 법률 제10305호로 개정된 산재보험법 시행 전에 지급 사유가 발생한 진폐에 대하여 장해보상일시금을 산정하는 경우 근로복지공단이 정당한 이유 없이 그 지급을 거부하거나 늦춤으로 인하여 보험급여의 실질적 가치가 하락한 경우에는 보험급여 지급결정일까지 평균임금을 증감해야 한다.\n  구 진폐의 예방과 진폐근로자의 보호 등에 관한 법률(2010. 5. 20. 법률 제10304호로 개정되기 전의 것, 이하 ‘구 진폐예방법’이라 한다)은 진폐에 걸린 근로자 및 그 유족에 대한 위로금의 지급에 관한 사항을 정하여 근로자의 건강 보호와 복지 증진에 이바지하는 것 등을 그 목적으로 하고 있고(제1조), 그에 따라 진폐위로금의 하나로 ‘장해위로금’을 규정하고 있는데(제24조 제1항 제2호), 이는 발병시기가 불명하여 사업주에 대한 손해배상청구로 구제받기 어려운 진폐근로자와 그 유족들의 생계의 곤란을 입법을 통해 보전하고자 마련된 것이다. 이에 구 진폐예방법은 진폐로 산재보험법에 따른 장해급여의 대상이 된 근로자가 퇴직하거나 퇴직한 근로자가 진폐로 산재보험법에 따른 장해급여의 대상이 되는 경우에 장해위로금을 지급하고, 그 지급액은 산재보험법에서의 진폐에 따른 장해보상일시금의 100분의 60에 해당하는 금액으로 한다는 명문의 규정(제25조 제2항)을 두고 있다.\n  위와 같은 구 진폐예방법의 입법 목적과 앞서 본 장해위로금 및 평균임금 증감 제도의 취지, 장해위로금 금액을 장해급여를 기준으로 산정한다고 규정한 구 진폐예방법의 명문규정, 정당한 이유 없이 급여의 지급이 늦어짐에 따른 실질적 가치 하락을 시정할 필요성은 장해위로금의 경우에도 인정되는 점 등을 종합하여 보면, 장해급여에 해당하는 장해보상일시금과 장해위로금의 법적 성격에 차이가 있다 하더라도, 앞서 본 장해보상일시금에 대한 법리는 장해위로금을 산정하는 경우에도 마찬가지로 적용된다고 봄이 타당하다.\n\n [2] 행정처분의 취소를 구하는 항고소송에서 처분청은 당초 처분의 근거로 제시한 사유와 기본적 사실관계에서 동일성이 없는 다른 사유를 처분사유로 추가ㆍ변경할 수 없다.\n\n [3] 행정처분이 위법한 때에는 이를 취소함이 원칙이고 그 위법한 처분을 취소ㆍ변경함이 도리어 현저히 공공의 복리에 적합하지 않은 경우에 극히 예외적으로 위법한 행정처분의 취소를 허용하지 않는다는 사정판결을 할 수 있다. 그러므로 사정판결의 적용은 극히 엄격한 요건 아래 제한적으로 하여야 하고, 그 요건인 현저히 공공복리에 적합하지 아니한지를 판단할 때는 위법ㆍ부당한 행정처분을 취소ㆍ변경하여야 할 필요와 그 취소ㆍ변경으로 인하여 발생할 수 있는 공공복리에 반하는 사태 등을 비교ㆍ교량하여 그 적용 여부를 판단하여야 한다.",
    "참조조문": "[1] 구 산업재해보상보험법(2010. 5. 20. 법률 제10305호로 개정되기 전의 것) 제36조 제3항, 산업재해보상보험법 제36조 제3항, 구 진폐의 예방과 진폐근로자의 보호 등에 관한 법률(2010. 5. 20. 법률 제10304호로 개정되기 전의 것) 제1조, 제24조 제1항 제2호, 제25조 제2항 / [2] 행정소송법 제27조[행정소송재판일반] / [3] 행정소송법 제28조",
    "참조판례": "[1] 대법원 2024. 4. 16. 선고 2019두45616 판결(공2024상, 780) / [2] 대법원 2017. 8. 29. 선고 2016두44186 판결(공2017하, 1867) / [3] 대법원 2019. 1. 31. 선고 2016두65718 판결",
    "판례내용": "【원고, 피상고인】                원고 1 외 1인 (소송대리인 법무법인 사람앤스마트 담당변호사 박성민)\n【피고, 상고인】 근로복지공단\n【원심판결】  서울고법 2025. 5. 16. 선고 2024누62952 판결         \n【주    문】\n  상고를 모두 기각한다.  상고비용은 피고가 부담한다. \n\n【이    유】  상고이유를 판단한다.\n  1. 제2, 3 상고이유에 대하여 \n                 산업재해보상보험법(이하 ‘산재보험법’이라 한다) 제36조 제3항 본문은 보험급여를 산정하는 경우 해당 근로자의 평균임금을 산정하여야 할 사유가 발생한 날부터 1년이 지난 이후에는 매년 전체 근로자의 임금 평균액의 증감률에 따라 평균임금을 증감하되, 그 근로자의 연령이 60세에 도달한 이후에는 소비자물가변동률에 따라 평균임금을 증감한다고 규정하고 있다. 평균임금의 증감 제도는 오랜 기간 보험급여를 받거나 오랜 기간이 지난 후 보험급여를 받을 때, 평균임금을 산정할 사유가 생긴 날인 재해일 또는 진단 확정일을 기준으로 평균임금을 산정하여 보험급여액을 정할 경우 보험급여의 실질적 가치를 제대로 반영하지 못하는 불합리한 결과를 시정하기 위하여 마련된 것이다. 근로자의 업무상의 재해를 신속하고 공정하게 보상하고자 하는 산재보험법의 입법 목적과 평균임금 증감 제도를 둔 취지 등을 종합하여 보면, 2010. 5. 20. 법률 제10305호로 개정된 산재보험법 시행 전에 지급 사유가 발생한 진폐에 대하여 장해보상일시금을 산정하는 경우 근로복지공단이 정당한 이유 없이 그 지급을 거부하거나 늦춤으로 인하여 보험급여의 실질적 가치가 하락한 경우에는 보험급여 지급결정일까지 평균임금을 증감해야 한다(대법원 2024. 4. 16. 선고 2019두45616 판결 참조). \n  구 「진폐의 예방과 진폐근로자의 보호 등에 관한 법률」(2010. 5. 20. 법률 제10304호로 개정되기 전의 것, 이하 ‘구 진폐예방법’이라 한다)은 진폐에 걸린 근로자 및 그 유족에 대한 위로금의 지급에 관한 사항을 정하여 근로자의 건강 보호와 복지 증진에 이바지하는 것 등을 그 목적으로 하고 있고(제1조), 그에 따라 진폐위로금의 하나로 ‘장해위로금’을 규정하고 있는데(제24조 제1항 제2호), 이는 발병시기가 불명하여 사업주에 대한 손해배상청구로 구제받기 어려운 진폐근로자와 그 유족들의 생계의 곤란을 입법을 통해 보전하고자 마련된 것이다. 이에 구 진폐예방법은 진폐로 산재보험법에 따른 장해급여의 대상이 된 근로자가 퇴직하거나 퇴직한 근로자가 진폐로 산재보험법에 따른 장해급여의 대상이 되는 경우에 장해위로금을 지급하고, 그 지급액은 산재보험법에서의 진폐에 따른 장해보상일시금의 100분의 60에 해당하는 금액으로 한다는 명문의 규정(제25조 제2항)을 두고 있다. \n  위와 같은 구 진폐예방법의 입법 목적과 앞서 본 장해위로금 및 평균임금 증감 제도의 취지, 장해위로금 금액을 장해급여를 기준으로 산정한다고 규정한 구 진폐예방법의 명문규정, 정당한 이유 없이 급여의 지급이 늦어짐에 따른 실질적 가치 하락을 시정할 필요성은 장해위로금의 경우에도 인정되는 점 등을 종합하여 보면, 장해급여에 해당하는 장해보상일시금과 장해위로금의 법적 성격에 차이가 있다 하더라도, 앞서 본 장해보상일시금에 대한 법리는 장해위로금을 산정하는 경우에도 마찬가지로 적용된다고 봄이 타당하다. \n  원심은 피고가 정당한 이유 없이 원고 1과 망 소외인에 대하여 장해위로금의 지급을 늦추었다는 전제에서 피고가 장해위로금 지급결정일까지 평균임금을 증감하지 않고 진폐 정밀진단일을 기준으로 장해위로금을 산정한 것은 위법하다고 판단하였다. \n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 원심의 판단은 위와 같은 법리에 따른 것으로 정당하고, 거기에 상고이유 주장과 같이 장해위로금의 산정방식 등에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. \n  2. 제1 상고이유에 대하여\n  행정처분의 취소를 구하는 항고소송에서 처분청은 당초 처분의 근거로 제시한 사유와 기본적 사실관계에서 동일성이 없는 다른 사유를 처분사유로 추가ㆍ변경할 수 없다(대법원 2017. 8. 29. 선고 2016두44186 판결 참조).\n  원심은, 피고가 이 사건 소송에서 추가로 주장한 처분사유는 ‘장해위로금을 휴업급여와 중복하여 지급할 수 없다.’는 것인데, 이는 이 사건 처분의 당초 처분사유인 ‘장해위로금은 진폐 진단일 당시의 평균임금을 기준으로 산정ㆍ지급해야 한다.’는 것과 기본적 사실관계가 다르므로, 이 사건 소송에서 위와 같은 처분사유를 추가하는 것은 허용되지 않는다고 판단하였다. \n  원심판결 이유를 앞서 본 법리와 기록에 비추어 살펴보면, 원심의 판단에 처분사유의 추가ㆍ변경에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. \n  3. 제4 상고이유에 대하여 \n  행정처분이 위법한 때에는 이를 취소함이 원칙이고 그 위법한 처분을 취소ㆍ변경함이 도리어 현저히 공공의 복리에 적합하지 않은 경우에 극히 예외적으로 위법한 행정처분의 취소를 허용하지 않는다는 사정판결을 할 수 있다. 그러므로 사정판결의 적용은 극히 엄격한 요건 아래 제한적으로 하여야 하고, 그 요건인 현저히 공공복리에 적합하지 아니한지 여부를 판단할 때는 위법ㆍ부당한 행정처분을 취소ㆍ변경하여야 할 필요와 그 취소ㆍ변경으로 인하여 발생할 수 있는 공공복리에 반하는 사태 등을 비교ㆍ교량하여 그 적용 여부를 판단하여야 한다(대법원 2019. 1. 31. 선고 2016두65718 판결 등 참조).\n  원심은 피고 주장의 사정만으로는 사정판결을 하여야 할 정도로 이 사건 처분을 취소하는 것이 현저히 공공복리에 적합하지 않은 경우에 해당한다고 보기 어렵다고 판단하였다. \n  원심판결 이유를 앞서 본 법리와 기록에 비추어 살펴보면, 원심의 판단에 사정판결의 요건에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 없다. \n  4. 결론\n  그러므로 상고를 모두 기각하고 상고비용은 패소자가 부담하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오석준(재판장) 이흥구 노경필 이숙연(주심)"

    "판시사항": "도시계획시설의 설치 장소로 결정된 토지에 적법하게 건축된 허가 대상 가설건축물에서 인적ㆍ물적시설을 갖추고 계속적으로 영업을 행하고 있던 영업자가 도시계획시설사업이 아닌 다른 공익사업의 시행으로 인하여 허가받은 존치기간까지 영업을 계속할 수 없게 된 경우, 영업손실보상을 청구할 수 있는지 여부(원칙적 적극) / 위 영업자가 기존의 허가에 따른 존치기간 만료일 이후에 다른 공익사업으로 인하여 가설건축물에서 영업을 할 수 없게 된 경우, 영업손실보상을 청구할 수 있는지 여부(원칙적 소극) / 영업자에게 존치기간 만료일 이후의 시점에도 해당 가설건축물에서 계속해서 영업을 할 수 있으리라는 정당한 기대가 있었는지 판단하는 방법",
    "판결요지": "공익사업을 위한 토지 등의 취득 및 보상에 관한 법률 제77조 제1항, 제4항, 공익사업을 위한 토지 등의 취득 및 보상에 관한 법률 시행규칙 제45조 제1호, 국토의 계획 및 이용에 관한 법률 제64조 제1항, 제2항, 제3항, 건축법 제20조 제1항, 제2항 제3호, 건축법 시행령 제15조 제1항 제2호에 따르면, 도시계획시설의 설치 장소로 결정된 토지에서 예외적으로 건축 등 개발행위가 허가된 가설건축물(이하 ‘허가 대상 가설건축물’이라 한다)을 건축한 토지소유자는 도시계획시설사업이 시행될 때까지 허가 대상 가설건축물을 건축하여 한시적으로 사용할 수 있는 대신 도시계획시설사업이 시행될 경우에는 자신의 비용으로 그 가설건축물을 철거해야 할 의무를 부담할 뿐 아니라 가설건축물의 철거에 따른 손실보상을 청구할 수 없고, 보상을 청구할 수 없는 손실에는 가설건축물의 철거에 따른 영업손실도 포함된다. 소유자가 그 손실보상을 청구할 수 없는 이상 그의 가설건축물의 이용권능에 터 잡은 임차인 역시 가설건축물의 철거에 따른 영업손실의 보상을 청구할 수는 없다. \n  그런데 허가 대상 가설건축물의 소유자는 도시계획시설사업이 시행되지 않는 한 허가받은 존치기간 내에는 그 가설건축물을 사용할 수 있고, 도시계획시설사업이 아닌 다른 공익사업이 시행되더라도 곧바로 허가 대상 가설건축물을 철거할 의무를 부담한다고 볼 수 없다. 존치기간이 만료되기 전이라도 다른 공익사업의 시행으로 인하여 허가 대상 가설건축물을 사용할 수 없게 될 것을 예상하고서 가설건축물을 건축하였다고 볼 수는 없기 때문이다. 이러한 점에서 허가 대상 가설건축물의 소유자나 임차인 등인 영업자는 도시계획시설사업이 시행되지 않는 한 허가받은 존치기간 내에는 그 가설건축물을 사용할 수 있다는 정당한 기대를 가지고 있고, 이러한 기대는 단순한 사실상의 기대를 넘어 법적으로 보호받아야 할 이익에 해당한다. \n  따라서 적법하게 건축된 허가 대상 가설건축물에서 인적ㆍ물적시설을 갖추고 계속적으로 영업을 행하고 있던 영업자가 다른 공익사업의 시행으로 인하여 허가받은 존치기간까지 영업을 계속할 수 없게 되었다면, 원칙적으로 그 영업자는 특별한 희생 또는 손실을 입었다고 볼 수 있다. \n  그러나 한편으로, 허가 대상 가설건축물은 한시적 이용 및 원상회복을 전제하여 예외적으로 건축이 허용되는 것으로서 필연적으로 존치기간이 정해져 있고, 존치기간 연장허가는 행정청의 재량행위에 해당한다. 이러한 사정에 국토의 계획 및 이용에 관한 법률이 가설건축물 제도를 둔 목적이나 취지 등을 보태어 보면, 허가 대상 가설건축물의 소유자나 임차인 등인 영업자가 기존의 허가에 따른 존치기간이 향후 연장되어 존치기간 만료일 이후의 시점에도 계속해서 가설건축물을 이용할 수 있다고 기대하더라도, 이는 가설건축물의 소유자가 존치기간 연장허가를 신청할 경우 행정청이 이를 허가해 줄 것이 분명하다거나 행정청이 그 신청을 거부하는 것이 재량권 일탈ㆍ남용에 해당한다는 등의 특별한 사정이 존재하지 않는 한 정당한 사유가 있는 것으로 인정하기 어렵다. 그러므로 그러한 기대는 법적으로 보호받아야 할 이익이라고 볼 수 없는 단순한 사실상의 기대에 불과하다. \n  따라서 적법하게 건축된 허가 대상 가설건축물에서 인적ㆍ물적시설을 갖추고 계속적으로 영업을 행하고 있던 영업자가 기존의 허가에 따른 존치기간 만료일 이후에 도시계획시설사업과 무관한 다른 공익사업으로 인하여 가설건축물에서 영업을 할 수 없게 되었더라도, 공익사업의 사업인정고시 당시에 영업자에게 해당 가설건축물에서 존치기간 만료일 이후의 시점에도 계속해서 영업을 할 수 있으리라는 정당한 기대가 있었다는 등의 특별한 사정이 없는 한, 영업자는 특별한 희생 또는 손실을 입었다고 볼 수 없어 영업손실보상을 청구할 수 없다. 영업자에게 그러한 정당한 기대가 있었는지는, 가설건축물 허가나 존치기간 연장허가의 경위, 해당 공익사업의 사업인정고시 당시 가설건축물의 잔여 존치기간, 해당 도시계획시설사업 및 공익사업의 진행 경과, 해당 영업의 내용과 운영 경과 등 여러 사정을 종합적으로 고려하여 판단해야 한다.",
    "참조조문": "공익사업을 위한 토지 등의 취득 및 보상에 관한 법률 제77조 제1항, 제4항, 공익사업을 위한 토지 등의 취득 및 보상에 관한 법률 시행규칙 제45조 제1호, 국토의 계획 및 이용에 관한 법률 제64조 제1항, 제2항, 제3항, 건축법 제20조 제1항, 제2항 제3호, 건축법 시행령 제15조 제1항 제2호",
    "참조판례": "대법원 2001. 8. 24. 선고 2001다7209 판결(공2001하, 2063)",
    "판례내용": "【원고, 피상고인】                원고 (소송대리인 법무법인 선재 담당변호사 국윤식 외 2인)\n【피고, 상고인】 한국토지주택공사 (소송대리인 법무법인 자유라이프 담당변호사 송진규 외 5인)\n【원심판결】  서울고법 2024. 11. 20. 선고 2024누47427 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 조사하여 채택한 증거 등에 의하면, 다음과 같은 사실을 알 수 있다. \n  가. 구리시 갈매동 (지번 생략) 임야 1,016㎡(이하 ‘이 사건 부지’라 한다)는 2006. 1. 10. 구리도시관리계획(변경)결정이 고시됨에 따라 도시계획시설인 ‘주차장3’의 예정지로 지정되었다.\n  나. 이 사건 부지의 소유자였던 소외 1, 소외 2(이하 ‘소외 1 등’이라 한다)는 2012. 9. 10. 구리시장에게 ‘이 사건 부지 지상에 연면적 합계 451㎡ 규모의 가설건축물 2동을 건축하는 것’을 내용으로 하는 건축허가신청을 하였고, 구리시장으로부터 가설건축물 존치기간을 2015. 8. 9.까지로 정한 건축허가를 받아 이 사건 부지 지상에 가설건축물 2동을 건축하고 구리시장으로부터 사용승인을 받았다. \n  다. 소외 1 등은 2015. 8. 4. 구리시장에게 위 가설건축물의 존치기간을 2018. 8. 9.까지로 연장하는 내용의 연장신고서를 제출하였고, 구리시장은 이를 수리하였다. \n  라. 피고를 사업시행자로 한 구리갈매역세권지구 공공주택사업〈7차〉(이하 ‘이 사건 사업’이라 한다)에 관한 사업인정고시가 2018. 7. 4. 이루어졌는데, 이 사건 부지는 이 사건 사업 구역에 포함되었다. \n  마. 소외 1 등은 2018. 7. 19. 구리시장에게 위 가설건축물의 존치기간을 2021. 8. 9.까지로 연장하는 내용의 연장신고서를 제출하였으나, 구리시장은 2018. 7. 27. 이 사건 부지가 이 사건 사업 구역에 편입되었음을 이유로 존치기간 연장을 불허하였다. \n  바. 원고는 2013. 3. 14. 소외 1 등으로부터 이 사건 부지 지상에 건축된 가설건축물 2동 중 1동(이하 ‘이 사건 가설건축물’이라 한다)을 임차한 뒤, 2013. 4. 16. 무렵부터 2021. 1. 4.까지 이 사건 가설건축물에서 ‘○○○’이라는 상호로 조미료 등 도ㆍ소매업(이하 ‘이 사건 영업’이라 한다)을 영위하였다. \n  사. 중앙토지수용위원회는 2021. 12. 9. 이 사건 부지 지상의 원고 소유 지장물에 대하여는 수용개시일을 2022. 1. 10.로 하여 손실보상금을 인정하고, 이 사건 영업에 대한 영업손실보상 청구는 받아들이지 않는 내용의 수용재결을 하였다. 이에 원고가 이의신청을 하였으나 영업손실보상 부분에 대한 이의신청은 기각되었다. \n  2. 제1 상고이유에 대하여 \n  가. 관련 규정\n  1) 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」 제77조 제1항, 제4항, 같은 법 시행규칙 제45조 제1호에 따르면, 공익사업으로 인하여 영업을 휴업함에 따른 영업손실에 대하여는 영업이익과 시설의 이전비용 등을 고려하여 보상하여야 하는데, 이러한 영업손실보상의 대상인 영업은 사업인정고시일 이전부터 적법한 장소에서 인적ㆍ물적시설을 갖추고 계속적으로 행하고 있는 영업이어야 함이 원칙이다. \n  2) 「국토의 계획 및 이용에 관한 법률」(이하 ‘국토계획법’이라 한다) 제64조 제1항부터 제3항, 건축법 제20조 제1항, 제2항 제3호, 건축법 시행령 제15조 제1항 제2호에 따르면, 도시계획시설의 설치 장소로 결정된 토지에 관하여는 그 도시계획시설이 아닌 건축물의 건축을 허가할 수 없음이 원칙이고, 다만 도시계획시설결정의 고시일부터 2년이 지날 때까지 그 시설의 설치에 관한 사업이 시행되지 아니한 도시계획시설 중 단계별 집행계획이 수립되지 않은 경우 등에는 예외적으로 가설건축물의 건축 등 개발행위를 허가할 수 있다(이하 허가를 받아 건축되는 가설건축물을 ‘허가 대상 가설건축물’이라 한다). 이때 허가 대상 가설건축물의 존치기간은 3년 이내로 하되, 도시계획시설사업이 시행될 때까지 그 기간을 연장할 수 있고, 만약 그 토지에서 도시계획시설사업이 시행되면 허가권자는 그 시행예정일 3개월 전까지 가설건축물 소유자의 부담으로 그 가설건축물의 철거 등 원상회복에 필요한 조치를 명하여야 한다. \n  나. 원심의 판단 \n  원심은 판시와 같은 이유를 들어, 적법하게 건축된 허가 대상 가설건축물의 부지에서 도시계획시설사업과 무관한 다른 공익사업이 시행되는 경우, 공익사업의 사업인정고시일을 기준으로 그 이전부터 적법한 허가 대상 가설건축물에서 행하여지고 있던 영업이기만 하면 그 공익사업으로 인한 영업손실보상의 대상에 해당함을 전제로, 이 사건 사업인정고시일 이전부터 적법한 이 사건 가설건축물에서 행하여지고 있던 이 사건 영업은 영업손실보상의 대상에 해당한다고 판단하였다. \n  다. 대법원의 판단  \n  1) 관련 법리\n  가) 손실보상은 사인에게 발생하는 재산상 특별한 희생 또는 손실에 대하여 사유재산권의 보장과 전체적인 공평 부담의 견지에서 행하여지는 조절적인 재산적 보상이자 특별한 희생에 대한 전보이다. 따라서 손실보상을 받기 위해서는 그 사인에게 특별한 희생 또는 손실이 발생하여야 하고, 재산상의 특별한 희생이나 손실이 발생하였다고 할 수 없는 경우에는 손실보상을 청구할 수 없다(대법원 2024. 5. 30. 선고 2023두61707 판결 참조). \n  영업손실의 보상은 공익사업의 시행으로 인하여 사업구역 안에서 행하고 있는 영업의 폐업ㆍ휴업에 따른 손실을 보상하는 것으로, 그 영업이 장래에도 계속 유지될 것임을 전제로 하여 일정기간 동안의 합리적인 기대이익의 상실 등을 보상하는 취지이다.\n  나) 앞서 살핀 규정들에 따르면, 도시계획시설의 설치 장소로 결정된 토지에서 허가 대상 가설건축물을 건축한 토지소유자는 도시계획시설사업이 시행될 때까지 허가 대상 가설건축물을 건축하여 한시적으로 사용할 수 있는 대신 도시계획시설사업이 시행될 경우에는 자신의 비용으로 그 가설건축물을 철거하여야 할 의무를 부담할 뿐 아니라 가설건축물의 철거에 따른 손실보상을 청구할 수 없고, 보상을 청구할 수 없는 손실에는 가설건축물의 철거에 따른 영업손실도 포함된다. 소유자가 그 손실보상을 청구할 수 없는 이상 그의 가설건축물의 이용권능에 터 잡은 임차인 역시 그 가설건축물의 철거에 따른 영업손실의 보상을 청구할 수는 없다(대법원 2001. 8. 24. 선고 2001다7209 판결 등 참조). \n  그런데 허가 대상 가설건축물의 소유자는 도시계획시설사업이 시행되지 않는 한 허가받은 존치기간 내에는 그 가설건축물을 사용할 수 있고, 도시계획시설사업이 아닌 다른 공익사업이 시행되더라도 곧바로 허가 대상 가설건축물을 철거할 의무를 부담한다고 볼 수 없다. 존치기간이 만료되기 전이라도 다른 공익사업의 시행으로 인하여 허가 대상 가설건축물을 사용할 수 없게 될 것을 예상하고서 그 가설건축물을 건축하였다고 볼 수는 없기 때문이다. 이러한 점에서 허가 대상 가설건축물의 소유자나 임차인 등인 영업자는 도시계획시설사업이 시행되지 않는 한 허가받은 존치기간 내에는 그 가설건축물을 사용할 수 있다는 정당한 기대를 가지고 있고, 이러한 기대는 단순한 사실상의 기대를 넘어 법적으로 보호받아야 할 이익에 해당한다. \n  따라서 적법하게 건축된 허가 대상 가설건축물에서 인적ㆍ물적시설을 갖추고 계속적으로 영업을 행하고 있던 영업자가 다른 공익사업의 시행으로 인하여 허가받은 존치기간까지 영업을 계속할 수 없게 되었다면, 원칙적으로 그 영업자는 특별한 희생 또는 손실을 입었다고 볼 수 있다.   \n  다) 그러나 한편으로, 허가 대상 가설건축물은 한시적 이용 및 원상회복을 전제하여 예외적으로 건축이 허용되는 것으로서 필연적으로 존치기간이 정해져 있고, 그 존치기간 연장허가는 행정청의 재량행위에 해당한다. 이러한 사정에 국토계획법이 가설건축물 제도를 둔 목적이나 취지 등을 보태어 보면, 허가 대상 가설건축물의 소유자나 임차인 등인 영업자가 기존의 허가에 따른 존치기간이 향후 연장되어 존치기간 만료일 이후의 시점에도 계속해서 가설건축물을 이용할 수 있다고 기대하더라도, 이는 그 가설건축물의 소유자가 존치기간 연장허가를 신청할 경우 행정청이 이를 허가해줄 것이 분명하다거나 행정청이 그 신청을 거부하는 것이 재량권 일탈ㆍ남용에 해당한다는 등의 특별한 사정이 존재하지 않는 한 정당한 사유가 있는 것으로 인정하기 어렵다. 그러므로 그러한 기대는 법적으로 보호받아야 할 이익이라고 볼 수 없는 단순한 사실상의 기대에 불과하다.\n  따라서 적법하게 건축된 허가 대상 가설건축물에서 인적ㆍ물적시설을 갖추고 계속적으로 영업을 행하고 있던 영업자가 기존의 허가에 따른 존치기간 만료일 이후에 도시계획시설사업과 무관한 다른 공익사업으로 인하여 가설건축물에서 영업을 할 수 없게 되었다고 하더라도, 그 공익사업의 사업인정고시 당시에 영업자에게 해당 가설건축물에서 존치기간 만료일 이후의 시점에도 계속해서 영업을 할 수 있으리라는 정당한 기대가 있었다는 등의 특별한 사정이 없는 한, 그 영업자는 특별한 희생 또는 손실을 입었다고 볼 수 없어 영업손실보상을 청구할 수 없다. 영업자에게 그러한 정당한 기대가 있었는지는, 가설건축물 허가나 존치기간 연장허가의 경위, 해당 공익사업의 사업인정고시 당시 가설건축물의 잔여 존치기간, 해당 도시계획시설사업 및 공익사업의 진행 경과, 해당 영업의 내용과 운영 경과 등 여러 사정을 종합적으로 고려하여 판단하여야 한다.   \n  2) 구체적 판단 \n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 이 사건 사업인정고시 당시 이 사건 가설건축물의 존치기간은 한 달 정도밖에 남아 있지 않았고, 원고는 존치기간이 만료된 후에도 그로부터 약 2년 5개월이 지난 2021. 1. 4.까지 이 사건 가설건축물에서 이 사건 영업을 영위한 사실을 인정할 수 있는 반면, 원고가 위 존치기간이 연장되어 존치기간 만료 이후의 시점에도 이 사건 가설건축물에서 계속 영업을 할 수 있으리라는 정당한 기대가 있었다고 인정할 만한 사정을 찾기 어렵다. 이러한 사정 등을 고려하면 원고에게 특별한 희생 또는 손실이 발생하였다고 인정하기 어렵다고 볼 여지가 있다. \n  그런데도 원심은, 도시계획시설사업과 무관한 다른 공익사업의 사업인정고시일을 기준으로 그 이전부터 적법한 허가 대상 가설건축물에서 행하여지고 있던 영업은 일괄적으로 다른 공익사업으로 인한 영업손실보상의 대상에 해당한다고 보아, 원고에게 허가받은 존치기간 만료일 이후의 시점에도 이 사건 가설건축물에서 계속 영업을 할 수 있으리라는 정당한 기대를 인정할 특별한 사정이 있었는지에 관하여 심리하지 아니한 채, 곧바로 이 사건 영업이 영업손실보상의 대상에 해당한다고 판단하였다. 이러한 원심판단에는 허가 대상 가설건축물에서의 영업에 대한 영업손실보상 등에 관한 법리를 오해하여 필요한 심리를 다하지 아니함으로써 판결에 영향을 미친 잘못이 있다. 이 점을 지적하는 상고이유 주장은 이유 있다. \n  3. 결론 \n  나머지 상고이유에 관한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리ㆍ판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다. \n\n대법관 노태악(재판장) 서경환 신숙희(주심) 마용주"

    "판례내용": "【원고, 피상고인】                ○○○ 엘엘씨 (소송대리인 법무법인 정안 담당변호사 박지인 외 2인)\n【피고, 상고인】 영등포세무서장 (소송대리인 법무법인(유한) 클라스한결 담당변호사 최승재 외 1인)\n【원심판결】  서울고법 2022. 8. 17. 선고 2021누54929 판결         \n【주    문】\n  원심판결을 파기하고, 사건을 서울고등법원에 환송한다. \n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 상고이유보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  1. 사안의 개요\n  원심판결 이유와 원심이 적법하게 채택하여 조사한 증거 등에 의하면, 다음과 같은 사실을 알 수 있다.\n  가. 원고는 미국법인으로서 캐나다법인인 △△△ 코퍼레이션[(영문명 1 생략), 이하 ‘이 사건 캐나다법인’이라 한다]이 개발하여 취득한 광대역 음성 표준 코덱 등 관련 특허를 양수받아 이를 라이선스하는 사업을 영위하고 있다. 원고는 유럽 내 특허 라이선스 사업을 위해 독일에서 □□□ 커뮤니케이션즈 게엠베하[(영문명 2 생략) Communications GMBH, 이하 ‘이 사건 독일법인’이라 한다)를 설립하였고, 그 주식 100%를 보유하고 있다. \n  나. 원고와 이 사건 독일법인은 2015. 12. 31. ◇◇◇주식회사(이하 ‘소외 회사’라 한다)와, 국내외에 등록된 159개의 특허권(이하 이중 국내에 등록된 3개를 제외한 국내 미등록 특허권 156개를 ‘이 사건 특허권’이라 한다)에 관하여 소외 회사에 라이선스를 허여하고 그로부터 원고가 사용료를 지급받는 내용의 특허권 라이선스 계약(이하 ‘이 사건 계약’이라 한다)을 체결하였다.\n  다. 소외 회사는 2016. 2. 26. 및 2016. 6. 8. 두 차례에 걸쳐 원고에게 합계 2,400만 달러를 이 사건 계약에 따른 사용료 명목으로 지급하고, 피고에게 이에 대한 원천징수분 법인세를 납부하였다. \n  라. 원고는, 위 사용료 중 이 사건 특허권에 대한 사용대가 부분(이하 ‘이 사건 사용료’라 한다)은 「대한민국과 미합중국간의 소득에 관한 조세의 이중과세 회피와 탈세방지 및 국제무역과 투자의 증진을 위한 협약」(이하 ‘한미조세협약’이라 한다)에 따라 원천징수대상이 되는 국내원천소득이 아니라는 이유로, 2019. 6. 21. 피고에게 납부된 원천징수분 법인세의 일부 환급을 구하는 경정청구를 하였다. 그러나 피고는 그로부터 2개월이 지나도록 아무런 통지를 하지 않았다.\n  2. 이 사건 사용료 전부의 실질 귀속자가 원고인지 여부(제5, 6 상고이유)\n  원심은, 원고가 이 사건 계약 체결 전에 이미 이 사건 캐나다법인으로부터 이 사건 특허권을 양수하였을 뿐만 아니라, 이 사건 독일법인의 주식 전부를 보유하고 있는 완전모회사로서, 이 사건 특허권 전부에 관하여 제3자에게 라이선스를 허여할 수 있는 지위에 있었던 점, 소외 회사도 이처럼 원고가 이 사건 특허권을 실질적으로 지배·관리하는 지위에 있음을 인식한 상태에서 이 사건 계약에서 정한 바에 따라 이 사건 사용료 전액을 원고에게 지급한 점, 이 사건 사용료는 전부 원고에게 귀속된 것으로 보이고, 달리 이 사건 독일법인에 이전되었다고 볼 아무런 근거가 없는 점 등 그 판시와 같은 이유를 들어, 이 사건 특허권 중 적어도 그 등록명의인이 원고가 아닌 특허권에 관하여는 그 사용료가 원고에게 실질적으로 귀속되었다고 볼 수 없다는 취지의 피고 주장을 배척하였다.\n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 원심의 이러한 판단은 정당하고, 거기에 이 부분 상고이유 주장과 같이 실질과세원칙 등에 관한 법리오해, 심리미진, 채증법칙 위반 등으로 판결에 영향을 미친 잘못이 없다.\n  3. 국내 미등록 특허권에 대한 사용료가 국내원천소득에 해당하는지 여부(제1, 2 상고이유)\n  가. 관련 규정\n  1) 한미조세협약 제14조 제4항은 \"본 조에서 사용되는 ‘사용료’라 함은 다음의 것을 의미한다.\"라고 규정하면서, 제a호에서 ‘문학·예술·과학작품의 저작권 또는 영화필름·라디오 또는 텔레비전 방송용 필름 또는 테이프의 저작권, 특허, 의장, 신안, 도면, 비밀공정 또는 비밀공식, 상표 또는 기타 이와 유사한 재산 또는 권리, 지식, 경험, 기능, 선박 또는 항공기의 사용 또는 사용권에 대한 대가로서 받는 모든 종류의 지급금’을 규정한다. 제6조는 \"이 협약의 목적상 소득의 원천은 다음과 같이 취급된다.\"라고 규정하면서, 제3항에서 \"제14조 제4항에 규정된 재산의 사용 또는 사용할 권리에 대하여 동 조항에 규정된 사용료는 어느 체약국 내의 동 재산의 사용 또는 사용할 권리에 대하여 지급되는 경우에만 동 체약국 내에 원천을 둔 소득으로 취급된다.\"라고 규정한다. 제2조 제2항 전문(前文)은 \"이 협약에서 사용되나 이 협약에서 정의되지 아니한 기타의 용어는, 달리 문맥에 따르지 아니하는 한, 그 조세가 결정되는 체약국의 법에 따라 내포하는 의미를 가진다.\"라고 규정한다.\n  2) 구 법인세법(2016. 12. 20. 법률 제14386호로 개정되기 전의 것, 이하 같다) 제93조는 \"외국법인의 국내원천소득은 다음 각 호와 같이 구분한다.\"라고 규정하면서, 제8호에서 \"다음 각 목의 어느 하나에 해당하는 권리·자산 또는 정보(이하 이 호에서 ‘권리 등’이라 한다)를 국내에서 사용하거나 그 대가를 국내에서 지급하는 경우 그 대가 및 그 권리 등을 양도함으로써 발생하는 소득. 다만 소득에 관한 이중과세 방지협약에서 사용지를 기준으로 하여 그 소득의 국내원천소득 해당 여부를 규정하고 있는 경우에는 국외에서 사용된 권리 등에 대한 대가는 국내 지급 여부에도 불구하고 국내원천소득으로 보지 아니한다. 이 경우 특허권, 실용신안권, 상표권, 디자인권 등 권리의 행사에 등록이 필요한 권리(이하 이 호에서 ‘특허권 등’이라 한다)는 해당 특허권 등이 국외에서 등록되었고 국내에서 제조·판매 등에 사용된 경우에는 국내 등록 여부에 관계없이 국내에서 사용된 것으로 본다.\"라고 규정한다.\n  나. 관련 법리 \n  한미조세협약은 구 법인세법 제93조 제8호에서 규정하는 ‘사용지를 기준으로 하여 사용료소득의 국내원천소득 해당 여부를 규정하고 있는 이중과세 방지협약’에 해당한다. 한미조세협약에 따른 ‘사용지’를 확정하려면 먼저 ‘사용’의 의미를 명확히 할 필요가 있다. 그런데 한미조세협약은 ‘사용’의 의미를 별도로 정의하고 있지 않다. 그러므로 한미조세협약 제2조 제2항 전문에 따라 ‘사용’의 의미는 조세가 결정되는 체약국인 우리나라의 법에 따라 해석하여야 한다. 이와 관련하여 구 법인세법 제93조 제8호 단서 후문은 국내 미등록 특허권이 국내 제조·판매 등에 사용된 경우에는 국내 등록 여부에 관계없이 국내에서 사용된 것으로 본다고 규정한다. 여기서 ‘사용’은 독점적 효력을 가지는 특허권 자체를 사용하는 것이 아니라 그 특허권의 대상이 되는 제조방법·기술·정보 등(이하 ‘특허기술’이라 한다)을 사용한다는 의미로 보아야 한다. 따라서 국내 미등록 특허권의 특허기술이 국내에서 사용되었다면 그 대가인 사용료소득은 국내원천소득에 해당한다(대법원 2025. 9. 18. 선고 2021두59908 전원합의체 판결 참조). \n  다. 구체적 판단\n  앞서 본 사실관계를 위 법리에 비추어 살펴보면, 이 사건 사용료가 이 사건 특허권의 대상인 특허기술을 국내에서의 제조·판매 등에 사실상 사용하는 데에 대한 대가인 경우, 이는 한미조세협약 제6조 제3항, 제14조 제4항 제a호, 구 법인세법 제93조 제8호 단서 후문에 따라 국내 사용에 대한 사용료로서 국내원천소득에 해당한다. 그런데도 원심은, 이 사건 사용료가 국내 미등록 특허권에 대한 것이라는 이유만으로, 그 특허기술이 국내에서의 제조·판매 등에 사실상 사용되었는지를 살피지 아니한 채 곧바로 국내원천소득에 해당하지 않는다고 판단하였다. 이러한 원심의 판단에는 한미조세협약상 국내 미등록 특허권에 대한 사용료의 국내원천소득 해당 여부에 관한 법리를 오해한 나머지 필요한 심리를 다하지 아니하여 판결에 영향을 미친 잘못이 있다.\n  4. 이 사건 사용료에 특허권 외에 ‘발명, 기술 등에 관한 비공개 정보의 사용대가’가 포함되어 있는지 여부(제4 상고이유)\n  원심은 판시와 같은 이유로, 이 사건 사용료에 ‘발명, 기술 등에 관한 비공개 정보의 사용대가’가 포함되어 있다는 피고의 주장을 배척하였다. \n  원심판결 이유를 관련 법리와 기록에 비추어 살펴보면, 원심의 이유 설시에 일부 적절하지 않은 부분이 있으나, 이 사건 사용료에 ‘발명, 기술 등에 관한 비공개 정보의 사용대가’가 포함되어 있다고 보기 어렵다는 결론은 정당하다. 이러한 원심의 판단에 구 법인세법 제93조 제8호 (나)목에 관한 법리오해의 잘못이 없다. \n  5. 결론\n  나머지 상고이유에 대한 판단을 생략한 채 원심판결을 파기하고, 사건을 다시 심리·판단하도록 원심법원에 환송하기로 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 마용주(재판장) 서경환 신숙희(주심)"
  },

    "판시사항": "甲의 2011년 귀속 종합소득세 및 부가가치세에 대하여 이미 3차례에 걸쳐 세무조사가 이루어졌는데, 이후 검찰의 고발의뢰로 관할 지방국세청장이 실시한 甲에 대한 세무조사 결과에 따라 관할 세무서장이 종합소득세 및 부가가치세를 증액경정 한 사안에서, 검찰의 고발의뢰로 진행한 세무조사는 그 전에 있었던 조사 모두와의 관계에서 같은 세목 및 같은 과세기간에 대하여 이루어진 것으로서 구 국세기본법 제81조의4 제2항에 따라 원칙적으로 금지되는 재조사에 해당하고, 재조사가 허용되는 예외적 사유에 해당하지 않는다고 본 원심판단을 수긍한 사례",

    "판례내용": "【원고, 피상고인】                원고 (소송대리인 홍익법무법인 외 2인)\n【피고, 상고인】 반포세무서장 외 1인 (소송대리인 법무법인(유한) 대륙아주 외 1인)\n【원심판결】  서울고법 2023. 3. 7. 선고 2021누37801 판결         \n【주    문】\n  상고를 모두 기각한다.  상고비용은 피고들이 부담한다.\n\n【이    유】  상고이유(상고이유서 제출기간이 지난 다음 제출된 각 상고이유보충서의 기재는 상고이유를 보충하는 범위에서)를 판단한다.\n  원심은, 이 사건 세무조사가 그 전에 있었던 제1, 2, 3차 조사 모두와의 관계에서 같은 세목 및 같은 과세기간에 대하여 이루어진 것으로서 구 국세기본법(2018. 12. 31. 법률 제16097호로 개정되기 전의 것, 이하 같다) 제81조의4 제2항에 따라 원칙적으로 금지되는 재조사에 해당한다고 판단한 다음, 이를 예외적으로 허용되는 재조사로 보아야 한다는 피고들의 주장, 즉 구 국세기본법 제81조의4 제2항 제1호의 ‘조세탈루의 혐의를 인정할 만한 명백한 자료가 있는 경우’ 또는 같은 항 제7호의 위임에 따른 구 국세기본법 시행령(2019. 2. 12. 대통령령 제29534호로 개정되기 전의 것) 제63조의2 제2호의 ‘각종 과세자료의 처리를 위한 재조사를 하는 경우’나 제3호의 ‘「조세범 처벌절차법」 제2조 제1호에 따른 조세범칙행위의 혐의를 인정할 만한 명백한 자료가 있는 경우’에 해당한다는 주장을 판시와 같은 이유로 모두 배척하였다.\n  원심판결 이유를 관련 규정과 법리 및 기록에 비추어 살펴보면, 이러한 원심의 판단에 상고이유 주장과 같이 예외적인 재조사 허용 사유 등에 관한 법리를 오해하거나 필요한 심리를 다하지 아니하는 등으로 판결에 영향을 미친 잘못이 없다.\n  그러므로 상고를 모두 기각하고 상고비용은 패소자가 부담하게 하여, 관여 대법관의 일치된 의견으로 주문과 같이 판결한다.\n\n대법관 오경미(재판장) 권영준 엄상필(주심) 박영재"
  },
